оляет выявить существенный разрыв между результатами современных моделей и уровнем мастерства человеческих экспертов в креативной сфере. Musebench включает 4016 вопросов по различным дисциплинам искусства, таким как кинематография и визуальные искусства, акцентируя внимание на причинах художественных выборов. Оценки 28 моделей показывают, что даже лучшая из них достигает только 48.29% точности, что значительно ниже 87.18% у человеческих экспертов.'}, 'en': {'title': 'Bridging the Gap in Artistic Understanding for MLLMs', 'desc': 'The paper introduces Musebench, a benchmark for evaluating multimodal large language models (MLLMs) on their understanding of artistic concepts across various creative fields. It highlights the gap between MLLMs and human experts in interpreting artistic intent, as current models primarily focus on perceptual recognition rather than deeper reasoning. Musebench consists of 4,016 questions derived from professional commentary and visual examples, designed to assess nuanced artistic understanding. The evaluation shows that even the best MLLM achieves only 48.29% accuracy, significantly lower than the 87.18% accuracy of human experts, indicating a need for improved models in creative domains.'}}}, {'id': 'https://huggingface.co/papers/2607.06403', 'title': 'From Foundation to Application: Improving VLA Models in Practice', 'url': 'https://huggingface.co/papers/2607.06403', 'abstract': 'Abstract LingBot-VLA 2.0 enhances generalization across tasks and embodiments through expanded data preprocessing and training on diverse robot configurations, extends action space to include whole-body degrees of freedom for complex manipulation tasks, and incorporates predictive dynamics modeling using video representation and depth estimation for improved temporal reasoning.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Despite recent progress of VLA foundation models, the disparity between laboratory conditions and real-world applications continues to impede their practical implementation. To bridge this gap, we present LingBot-VLA 2.0, which advances LingBot-VLA through improvements in three functional domains. (1) Generalization across tasks and embodiments. Compared to the previous version, we revamp the data processing pipeline and curate around 60,000 hours of data for pretraining, including 50,000 hours of robot trajectories spanning 20 robot configurations and 10,000 hours of egocentric human videos. (2) Expanded action space in addition to dual-arm hardware platforms. In particular, our system accommodates degrees of freedom for the heads, waists, mobile bases, and dexterous hands, thereby empowering the robots to tackle more complex tasks in practical scenarios. (3) Predictive dynamics modeling for improved temporal reasoning. Specifically, we formulate future prediction as a proxy task, facilitated by a video representation model for semantic priors and a depth estimation model for geometric cues. Evaluations on the GM-100 benchmark, conducted in a generalist setting, validate the beneficial impact of these proposed modifications. Furthermore, benefiting from the expanded pretraining data that covers whole-body degrees of freedom, LingBot-VLA-2.0 demonstrates strong cross-embodiment long-horizon mobile manipulation capability across the two robotic platforms.', 'score': 1, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '220e98fd440a794d', 'github_url': '', 'github_stars': 0, 'authors': ['Wei Wu', 'Fangjing Wang', 'Fan Lu', 'He Sun', 'Shi Liu', 'Yunnan Wang', 'Yibin Yan', 'Yong Wang', 'Shuailei Ma', 'Xinyang Wang', 'Yibin Liu', 'Shuai Yang', 'Tianxiang Zhou', 'Kejia Zhang', 'Lei Zhou', 'Cheng Su', 'Nan Xue', 'Bin Tan', 'Han Zhang', 'Youchao Zhang', 'Fei Liao', 'Xing Zhu', 'Yujun Shen', 'Kecheng Zheng'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.06403.jpg', 'data': {'categories': ['#benchmark', '#robotics', '#training', '#reasoning', '#dataset', '#optimization', '#data', '#agi'], 'emoji': '🤖', 'ru': {'title': 'LingBot-VLA 2.0: шаг к универсальным роботам!', 'desc': 'LingBot-VLA 2.0 улучшает обобщение задач и телесных воплощений за счет расширенной предобработки данных и обучения на разнообразных конфигурациях роботов. Он расширяет пространство действий, включая свободы движений всего тела для сложных манипуляций. Кроме того, модель предсказательной динамики использует видео представления и оценку глубины для улучшенного временного анализа. Оценки на бенчмарке GM-100 подтверждают эффективность предложенных улучшений.'}, 'en': {'title': 'Empowering Robots with Enhanced Generalization and Complex Manipulation', 'desc': "LingBot-VLA 2.0 improves the ability of robots to perform various tasks by enhancing data preprocessing and training on a wide range of robot configurations. It expands the action space to include movements from the entire body, allowing robots to handle more complex manipulation tasks. The system also incorporates predictive dynamics modeling, which uses video and depth data to enhance the robot's understanding of time and movement. Evaluations show that these advancements significantly improve the robot's performance in real-world scenarios."}}}, {'id': 'https://huggingface.co/papers/2607.05992', 'title': 'PluraMath: Extending Mathematical Reasoning Evaluation Beyond High-Resource Languages', 'url': 'https://huggingface.co/papers/2607.05992', 'abstract': 'Abstract PluraMath extends the PolyMath dataset to 18 underrepresented languages, revealing persistent gaps in multilingual mathematical reasoning performance between high-resource and low-resource languages.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Mathematical reasoning has become a central task for evaluating and tuning reasoning Large Language Models (LLMs), yet existing benchmarks remain heavily biased toward high-resource languages, with English and Chinese dominating both pre-training corpora and evaluation suites. The recently released PolyMath (Wang et al., 2025) dataset represents a significant step forward, yet its coverage is still limited to 18 only high-resource languages. To address this gap, we introduce PluraMath, an extension of PolyMath to 18 additional {underrepresented languages spanning 6 language families -- ranging from mid-resource to extreme low-resource settings. We constructed the dataset through a human-curated pipeline, where native speakers thoroughly validated pre-computed translations. Using PluraMath, we then benchmark 27 reasoning LLMs across four model scales -- small, mid-size, large, and closed-source ensembles -- probing the multilingual mathematical reasoning capabilities of state-of-the-art models under diverse linguistic conditions. Our fine-grained analysis confirms a persistent gap in mathematical reasoning performance between high-resource and underrepresented languages, with stronger results largely associated with better instruction-following ability. We fully open-source our dataset, data acquisition pipeline, and evaluation framework, with the goal of lowering the barrier to multilingual benchmark development for underrepresented communities.', 'score': 1, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'd9584aa0f82da23a', 'github_url': '', 'github_stars': 0, 'authors': ['Daryna Dementieva', 'Nikolay Babakov', 'Kathy Hämmerl', 'Ilseyar Alimova', 'Jindřich Libovický', 'Shu Okabe', 'Miras Baisbay', 'Lukas Edman', 'Abrorkhon Inomkhujaev', 'Antonia Karamolegkou', 'Mateusz Lango', 'Volkan Özer', 'Nikola Selic', 'Subhankar Swain', 'Tsedeniya Kinfe Temesgen', 'Galit Bary Weisberg', 'Alexander Fraser'], 'affiliations': ['Applied AI Institute', 'Charles University', 'German University of Digital Science', 'Indian Institute of Technology, Kharagpur (IIT Kharagpur)', 'Inria', 'Munich Center for Machine Learning (MCML)', 'Munich Data Science Institute (MDSI)', 'Nazarbayev University', 'Technical University of Munich (TUM)'], 'pdf_title_img': 'assets/pdf/title_img/2607.05992.jpg', 'data': {'categories': ['#low_resource', '#benchmark', '#open_source', '#reasoning', '#dataset', '#multilingual'], 'emoji': '📚', 'ru': {'title': 'Устранение языковых барьеров в математическом рассуждении', 'desc': 'Статья представляет PluraMath, расширение набора данных PolyMath, который охватывает 18 языков с низкими ресурсами. Исследование выявляет значительные различия в способности математического рассуждения между языками с высокими ресурсами и языками с низкими ресурсами. Используя PluraMath, авторы проводили оценку 27 крупных языковых моделей (LLMs) и подтвердили, что производительность значительно лучше у языков с высокими ресурсами. Статья стремится улучшить возможности многоязычной оценки моделей для недопредставленных языковых сообществ.'}, 'en': {'title': 'Bridging the Gap in Multilingual Mathematical Reasoning', 'desc': 'PluraMath is a new dataset that expands the existing PolyMath dataset to include 18 underrepresented languages, highlighting the ongoing challenges in multilingual mathematical reasoning. It addresses the bias in current benchmarks, which mainly focus on high-resource languages like English and Chinese. The dataset was created with careful validation by native speakers to ensure quality translations. By testing 27 reasoning large language models (LLMs) on this dataset, the study reveals significant performance gaps between high-resource and low-resource languages, emphasizing the need for more inclusive evaluation methods.'}}}, {'id': 'https://huggingface.co/papers/2607.06442', 'title': 'SIEVE: Structure-Aware Data Selection for Imitation Learning with VLA Models', 'url': 'https://huggingface.co/papers/2607.06442', 'abstract': 'Abstract SIEVE is a structure-aware data selection method for vision-language-action imitation learning that identifies reusable visuo-motor primitives and transition interfaces to improve policy learning efficiency.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) models are typically trained by imitation learning on large-scale robot demonstration datasets, but more data does not necessarily yield better policies due to redundancy, noise, and uneven coverage. Existing data selection methods often assess demonstrations at either the trajectory or state-action level, missing the reusable structures that compose long-horizon behaviors. In this paper, we propose SIEVE, a structure-aware data selection method for VLA imitation learning. SIEVE views demonstrations as compositions of reusable primitives and transition interfaces. It first discovers visuo-motor primitives from segmented trajectories, then allocates selection budgets to composition patterns by maximizing reuse-aware structural exposure under diminishing returns. Finally, it selects medoid trajectories within each composition-pattern bucket to retain central, stable, and imitation-friendly demonstrations. Experiments across multiple datasets, benchmarks, and VLA models show that SIEVE consistently outperforms competitive data selection baselines. Notably, SIEVE can surpass full-data training while using only 50% of demonstrations and 50% of training steps, suggesting that reusable structure, captured through primitives and transitions, is an important signal for efficient VLA imitation learning.', 'score': 1, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'd2f8d46b57b1682e', 'github_url': '', 'github_stars': 0, 'authors': ['Changti Wu', 'Bin Yu', 'Zhaolong Shen', 'Shijie Lian', 'Xiaopeng Lin', 'Cong Huang', 'Zhirui Zhang', 'Lei Zhang', 'Kai Chen'], 'affiliations': ['Beihang University', 'DeepCybo', 'East China Normal University', 'Harbin Institute of Technology', 'Huazhong University of Science and Technology', 'The Hong Kong University of Science and Technology (Guangzhou)', 'Zhongguancun Academy', 'Zhongguancun Institute of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2607.06442.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#dataset', '#data', '#transfer_learning', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Эффективное обучение через многоразовые структуры', 'desc': 'Статья представляет метод выбора данных SIEVE, который учитывает структуры для улучшения обучения политик в задачах подражания. Метод помогает определить многоразовые примитивы и интерфейсы переходов, что ведет к повышению эффективности обучения. SIEVE выделяет примитивы из сегментированных траекторий и распределяет бюджеты выбора по композиционным паттернам, максимизируя структурное покрытие. Эксперименты показывают, что SIEVE превосходит другие методы выбора данных, используя только 50% демонстраций и шагов обучения.'}, 'en': {'title': 'Unlocking Efficiency in Imitation Learning with SIEVE', 'desc': 'The paper introduces SIEVE, a method for selecting data in vision-language-action imitation learning that focuses on reusable visuo-motor primitives and transition interfaces. Traditional data selection often overlooks the underlying structures that form complex behaviors, leading to inefficiencies in policy learning. SIEVE enhances learning by identifying these reusable components and optimizing the selection of demonstrations based on their structural value. Experiments demonstrate that SIEVE can achieve better performance than full-data training while using only half the data and training steps, highlighting the importance of structured data in improving learning efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.03819', 'title': 'CGGS: Consistency-Augmented Geometric Gaussian Splatting for Ego-centric 3D Scene Generation', 'url': 'https://huggingface.co/papers/2607.03819', 'abstract': 'Abstract CGGS is a text-to-3D framework that enhances 3D-content-awareness and addresses geometric distortions through a multi-stage approach involving ego-centric generation, layout decoration, and geometric refinement.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Challenges remain in ego-centric 3D scene generation due to limited view overlap and the dominant influence of individual perspectives on scene interpretation. These factors hinder the creation of viewpoint-consistent and semantically aligned visual content, as well as the construction of accurate geometric structures. In this paper, we propose CGGS, a text-to-3D framework aiming to enhance 3D-content-awareness and address geometric distortions in ego-centric scene generation. Firstly, the Ego-centric Generator is proposed by fine-tuning a Multi-View Latent Diffusion Model with consistency-augmented loss to generate consistent, high-fidelity 2D content aligned with textual descriptions. Then, Layout Decorator leverages optical flow and point-track correspondence to estimate depth, therefore producing dense point clouds as coarse layouts from the ego-centric 2D priors. Building on this initialization, Geometric Refiner is proposed to enhance 3D Gaussian reconstruction via an entropy-based Mutual Information Depth Loss (MID) combined with a hierarchical optimization scheme for improving visual quality and geometric structure. Comprehensive experiments demonstrate that softred{CGGS} outperforms previous methods in generating coherent and accurate text-driven 3D scenes. Project page: https://cggs-26.github.io/cggs26/.', 'score': 1, 'issue_id': 2781, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '72482c0a734b2e0d', 'github_url': '', 'github_stars': 0, 'authors': ['Zhenyu Sun', 'Xiaohan Zhang', 'Qi Liu', 'Huan Wang'], 'affiliations': ['School of Engineering, Westlake University, Hangzhou 310030, China', 'School of Future Technology, South China University of Technology, Guangzhou 511442, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.03819.jpg', 'data': {'categories': ['#3d', '#optimization', '#diffusion'], 'emoji': '🖼️', 'ru': {'title': 'Создание 3D-сцены из текста: новейшие технологии', 'desc': 'Статья представляет CGGS — фреймворк для создания 3D-контента из текстового описания. Он улучшает восприятие 3D-контента и решает проблемы геометрических искажений посредством многоступенчатого подхода. Основными компонентами являются генератор эго-центричных сцен, декоратор компоновки и уточнитель геометрии. Эксперименты показывают, что CGGS превосходит предыдущие методы в создании согласованных и точных 3D-сцен, соответствующих текстовым описаниям.'}, 'en': {'title': 'Transforming Text into Accurate 3D Scenes', 'desc': 'CGGS is a text-to-3D framework designed to improve the generation of 3D scenes from text descriptions while addressing geometric distortions. It employs a multi-stage approach that includes an Ego-centric Generator for creating high-fidelity 2D content, a Layout Decorator for estimating depth and producing point clouds, and a Geometric Refiner for enhancing 3D structures. The framework uses advanced techniques like consistency-augmented loss and Mutual Information Depth Loss to ensure that the generated scenes are coherent and visually accurate. Experiments show that CGGS significantly outperforms previous methods in creating consistent and semantically aligned 3D content.'}}}, {'id': 'https://huggingface.co/papers/2607.02920', 'title': 'Layer-wise Cross-Lingual Depression Detection from Speech: Analysis with Contrastive Alignment', 'url': 'https://huggingface.co/papers/2607.02920', 'abstract': 'Abstract A supervised contrastive alignment framework maps WavLM embeddings from English and Mandarin into a shared clinical space for depression detection, addressing cross-lingual generalization challenges and revealing performance artifacts caused by speaker identity leakage.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Significant disparities exist in the diagnosis and clinical presentation of depression across different linguistic populations. Speech-based depression detection performs well monolingually, but cross-lingual generalization remains an open challenge. A key reason is that prior work uses segment-level random splits without speaker grouping, leading to identity leakage that inflates reported metrics. We propose CLeaD, a supervised contrastive alignment framework that maps WavLM embeddings from English and Mandarin into a shared clinical space, without parallel data or target-language fine-tuning. Evaluating 52 Mandarin speakers, contrastive alignment modestly outperforms the baseline (F1: 0.640 vs. 0.622) under leave-one-speaker-out evaluation. It also improves depressed-class recall at intermediate layers (7-8), though the small test set limits generalizability. Two findings remain robust: model scaling degrades cross-lingual performance while improving monolingual English, and speaker identity leakage artificially inflated previously reported Mandarin F1 scores to 0.954, an artifact we reproduce and quantify.', 'score': 1, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'b51dde78918b1e89', 'github_url': '', 'github_stars': 0, 'authors': ['Anisha Pattanayak', 'Hanie Kang', 'Huang-Cheng Chou', 'Shrikanth Narayanan', 'Sudarsana Reddy Kadiri'], 'affiliations': ['Ming Hsieh Department of Electrical and Computer Engineering, University of Southern California, USA', 'Signal Analysis and Interpretation Laboratory (SAIL), University of Southern California, USA', 'Thomas Lord Department of Computer Science, University of Southern California, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.02920.jpg', 'data': {'categories': ['#healthcare', '#leakage', '#transfer_learning', '#multilingual'], 'emoji': '🧠', 'ru': {'title': 'Новая методология для кросс-язычной диагностики депрессии', 'desc': 'В статье представлена новая методология CLeaD для распознавания депрессии на основе речи, которая объединяет эмбеддинги WavLM на английском и мандаринском языках в общую клиническую область. Это решение направлено на преодоление проблем с кросс-язычной генерализацией и устранение искажений, вызванных утечкой идентичности говорящего. Метод показывает небольшое, но значимое улучшение по сравнению с базовым уровнем в задачах диагностики депрессии. Результаты показывают, что увеличение размера модели ухудшает кросс-язычную производительность, при этом утечка идентичности говорящего раздувает ранее зарегистрированные метрики.'}, 'en': {'title': 'Bridging Languages for Better Depression Detection', 'desc': 'This paper introduces CLeaD, a supervised contrastive alignment framework that aligns WavLM embeddings from English and Mandarin for detecting depression. It addresses the challenge of cross-lingual generalization by avoiding speaker identity leakage, which can inflate performance metrics. The framework shows improved performance in detecting depression in Mandarin speakers compared to previous methods. The study highlights that while model scaling enhances monolingual performance, it can degrade cross-lingual results.'}}}, {'id': 'https://huggingface.co/papers/2607.05765', 'title': 'Image2Sim: Scaling Embodied Navigation via Generative Neural Simulator', 'url': 'https://huggingface.co/papers/2607.05765', 'abstract': 'Abstract Image2Sim enables scalable embodied navigation training by creating high-fidelity interactive environments from RGB-D images through decoupled 3D spatial anchoring and photorealistic rendering techniques.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Embodied navigation aims to build agents that interpret multimodal goals, reason in 3D space, and reach target destinations reliably in the real world. However, progress remains constrained by the lack of scalable, high-fidelity, and physically grounded interactive environments. Although real-world scanned datasets offer visual realism, they are limited by scale. In contrast, synthetic simulators scale more easily but often exhibit large sim-to-real gaps. We introduce Image2Sim, a real-time neural simulation framework that constructs high-quality interactive environments from posed RGB-D image sequences. The central idea is to decouple 3D spatial anchoring from photorealistic observation synthesis. For scene construction, Image2Sim uses a feed-forward feature Gaussian model that lifts posed RGB-D observations into a 3D feature-Gaussian representation in a single pass. For rendering, we propose a Geometry-Aware One-Step Pixel Flow model that transforms sparse and noisy Gaussian projections into high-quality panoramic RGB-D observations. Image2Sim also serves as a fully automated embodied data engine that generates high-fidelity observations, executable actions, and diverse navigation instructions at scale. It converts large collections of videos and images into nearly 20K interactive scenes and synthesizes more than 10 million navigation training samples. Navigation models trained entirely in these neural environments achieve strong improvements on major benchmarks and transfer effectively to real-world zero-shot settings. These results suggest that scalable neural simulation can serve as a practical training substrate for embodied navigation at scale.', 'score': 0, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'ee0330e623b92c99', 'github_url': '', 'github_stars': 0, 'authors': ['Zihan Wang', 'Seungjun Lee', 'Yinghao Xu', 'Gim Hee Lee'], 'affiliations': ['HKUST', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.05765.jpg', 'data': {'categories': ['#benchmark', '#games', '#3d', '#dataset', '#agents', '#transfer_learning', '#synthetic'], 'emoji': '🌍', 'ru': {'title': 'Нейросимуляция для обучения embodied навигации', 'desc': 'Статья представляет Image2Sim, систему для обучения навигации с использованием высококачественных интерактивных сред, созданных из RGB-D изображений. Технология разделяет 3D пространственное якорение и фотореалистичное рендеринг, что позволяет строить сцены в реальном времени. Image2Sim генерирует до 20 000 интерактивных сцен и синтезирует более 10 миллионов образцов для обучения навигационным моделям. Результаты показывают, что такая нейросимуляция превосходит традиционные методы и эффективно переносится в реальные условия.'}, 'en': {'title': 'Scalable Neural Simulation for Enhanced Navigation Training', 'desc': 'Image2Sim is a framework that creates realistic interactive environments for training navigation agents using RGB-D images. It separates the processes of 3D spatial anchoring and photorealistic rendering to enhance the quality of simulated environments. By generating nearly 20,000 interactive scenes and over 10 million navigation samples, it allows for scalable training of navigation models. These models show significant performance improvements on benchmarks and can effectively transfer to real-world scenarios without additional training.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf moonly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (23)', '#agent_memory (26)', '#agents (60)', '#agi (18)', '#alignment (3)', '#architecture (48)', '#audio (7)', '#benchmark (78)', '#compression (6)', '#context_window (1)', '#continual_learning (7)', '#data (32)', '#dataset (64)', '#diffusion (28)', '#ethics (4)', '#games (43)', '#graphs (5)', '#hallucinations (3)', '#healthcare (12)', '#inference (28)', '#interpretability (22)', '#knowledge_graphs', '#leakage (3)', '#long_context (20)', '#low_resource (3)', '#machine_translation (1)', '#math (6)', '#memorization (1)', '#memory (20)', '#multilingual (6)', '#multimodal (54)', '#open_source (38)', '#optimization (119)', '#plp', '#prompt_caching', '#prompting (4)', '#rag (2)', '#reasoning (43)', '#retrieval (15)', '#retrieval_eval (2)', '#rl (33)', '#rlhf (6)', '#robotics (18)', '#science (15)', '#security (4)', '#session_memory (5)', '#small_models (2)', '#story_generation', '#survey (13)', '#synthetic (12)', '#tool_use (5)', '#training (100)', '#transfer_learning (22)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "../img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '../' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-15 08:07',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-15 08:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-15 08:07')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('monthly'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
