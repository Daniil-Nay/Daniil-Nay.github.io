d on feedback.'}}}, {'id': 'https://huggingface.co/papers/2606.30562', 'title': 'Morphing into Hybrid Attention Models', 'url': 'https://huggingface.co/papers/2606.30562', 'abstract': 'Abstract FlashMorph is an efficient layer selection method that formulates hybrid layer selection as a budget-constrained optimization problem, using morphable models and linearization regularization to improve long-context efficiency in Transformers.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Hybrid attention models improve long-context efficiency by retaining only a subset of full-attention layers and replacing the remaining layers with linear attention. However, the effectiveness of Transformer-to-hybrid conversion critically depends on which layers preserve full attention. Existing hybrid layer selection methods typically rely on heuristic strategies such as fixed placement patterns or layerwise scoring, implicitly treating layer importance as isolated and overlooking the interdependent layer effect under a global hybrid configuration. In this work, we formulate hybrid layer selection as a budget-constrained subset optimization problem. We further propose FlashMorph (Fast LAyer Selection for Hybrid MORPHing), an effective, efficient and scalable layer selection method for Transformer-to-hybrid conversion. FlashMorph first constructs a morphable model by equipping each full-attention layer with a converted linear-attention branch. It then freezes all model weights and jointly optimizes layerwise gates on synthetic long-context retrieval data, with a linearization regularization that encourages the model to rely on linear attention for efficiency. The learned gates are discretized under a preset full-attention budget to instantiate the hybrid architecture, followed by standard logits distillation and long-context finetuning. Extensive experiments show that FlashMorph discovers more effective hybrid configurations, preserves strong long-context recall and general benchmark performance while substantially reducing layer selection cost compared with existing layer selection methods, demonstrating its effectiveness, efficiency, and scalability.', 'score': 37, 'issue_id': 2756, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '279b41912620d4a9', 'github_url': '', 'github_stars': 0, 'authors': ['Disen Lan', 'Jianbin Zheng', 'Yuxi Ren', 'Xin Xia', 'Xuanda Wang', 'Xuefeng Xiao', 'Xipeng Qiu', 'Yu Cheng'], 'affiliations': ['ByteDance Seed', 'Fudan University', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2606.30562.jpg', 'data': {'categories': ['#training', '#long_context', '#architecture', '#synthetic', '#optimization'], 'emoji': '⚙️', 'ru': {'title': 'Эффективный выбор слоев в Transformers', 'desc': 'Статья посвящена методу выбора слоев под названием FlashMorph, который улучшает эффективность Transformers при работе с длинными контекстами. Метод формулирует выбор слоев как задачу оптимизации с бюджетными ограничениями, что позволяет находить более эффективные конфигурации. FlashMorph использует морфируемую модель и регуляризацию линейного внимания, что делает выбор слоев более точным. Эксперименты показывают, что этот метод значительно снижает затраты на выбор слоев, сохраняя при этом высокую производительность моделей.'}, 'en': {'title': 'Optimizing Layer Selection for Efficient Transformers', 'desc': 'FlashMorph is a new method for selecting layers in Transformer models that focuses on improving efficiency for long-context tasks. It treats the selection of hybrid layers as an optimization problem, allowing for better performance by using a combination of full-attention and linear-attention layers. Unlike previous methods that used fixed strategies, FlashMorph considers the interdependence of layers to find the best configuration. The approach has been shown to reduce costs while maintaining strong performance in long-context retrieval and general tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.01642', 'title': 'Multi-Resolution Flow Matching: Training-Free Diffusion Acceleration via Staged Sampling', 'url': 'https://huggingface.co/papers/2607.01642', 'abstract': 'Abstract MrFlow accelerates text-to-image diffusion by combining low-resolution generation with pixel-space super-resolution and noise injection, achieving up to 25x speedup without training or runtime modifications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Hardware-agnostic strategies for accelerating text-to-image diffusion, such as timestep distillation and feature caching, can reduce inference time without custom kernels or system-level optimization. Among them, multi-resolution generation strategies have recently received broad attention, attaining more than 5x speedup without any training. However, the design of performing upsampling in the latent space, together with the selective modification of partial regions, causes these methods to exhibit noticeable blurring or artifacts. To this end, we propose MrFlow, a training-free multi-resolution acceleration strategy for pretrained flow-matching models built upon a staged low-to-high-resolution pipeline. MrFlow first rapidly generates the main structure at low resolution, then performs super-resolution in the pixel space using a lightweight pretrained GAN-based model, subsequently injects low-strength noise to enable high-frequency resampling, and finally refines the details at high resolution. Quantitative and qualitative results on FLUX.1-dev and Qwen-Image show that MrFlow exploits the quadratic token reduction and reduced step requirement of low-resolution sampling to achieve 10x end-to-end acceleration while keeping OneIG within a 1% gap relative to that before acceleration, significantly surpassing other training-free acceleration strategies, and requiring no training or runtime dynamic identification whatsoever. MrFlow can further be directly combined orthogonally with pre-trained timestep distillation strategies, achieving even higher generation acceleration of up to 25x.', 'score': 29, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '42c607a68d7c2ec0', 'github_url': '', 'github_stars': 0, 'authors': ['Xingyu Zheng', 'Xianglong Liu', 'Yifu Ding', 'Weilun Feng', 'Junqing Lin', 'Jinyang Guo', 'Haotong Qin'], 'affiliations': ['ETH Zurich', 'Nanyang Technological University', 'School of Artificial Intelligence, Beihang University', 'School of Computer Science and Engineering, Beihang University', 'State Key Laboratory of AI Safety, Institute of Computing Technology, Chinese Academy of Sciences', 'State Key Laboratory of Complex & Critical Software Environment, Beihang University', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.01642.jpg', 'data': {'categories': ['#inference', '#diffusion', '#data', '#architecture', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Скорость генерации изображений до 25 раз!', 'desc': 'Статья представляет метод MrFlow, который ускоряет процесс генерации изображений из текста, комбинируя низкоразрешающую генерацию с суперразрешением и инъекцией шума. Этот подход позволяет достичь увеличения скорости до 25 раз без необходимости в обучении модели или изменении ее работы. В отличие от существующих методов, MrFlow минимизирует размытие и артефакты, достигая быстрого создания структуры на низком разрешении и затем улучшая детали на пиксельном уровне. Результаты показывают, что MrFlow значительно превосходит другие стратегии ускорения, сохраняя высокое качество генерации при ухудшении не более чем на 1%.'}, 'en': {'title': 'Accelerating Text-to-Image Diffusion with MrFlow', 'desc': 'MrFlow is a novel approach that speeds up text-to-image diffusion by integrating low-resolution generation with pixel-space super-resolution and noise injection. This method achieves up to 25 times faster performance without the need for training or runtime changes. By generating the main structure at low resolution and refining it with a lightweight GAN-based model, MrFlow minimizes blurring and artifacts commonly seen in previous methods. The results demonstrate significant acceleration while maintaining high-quality outputs, outperforming other training-free strategies.'}}}, {'id': 'https://huggingface.co/papers/2607.01647', 'title': 'AgenticDataBench: A Comprehensive Benchmark for Data Agents', 'url': 'https://huggingface.co/papers/2607.01647', 'abstract': 'Abstract A comprehensive benchmark named AgenticDataBench is introduced to evaluate data agents across diverse domains with fine-grained task annotations and skill-based coverage metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Data science aims to derive actionable insights from heterogeneous raw data, unlocking the value of the massive amounts of data generated in modern society. Automating this process is essential to reducing labor-intensive efforts for data scientists and enabling scalable data-driven applications. Recently, large language model (LLM)-based data agents have emerged as a promising solution to automate data science workflows. However, the field lacks comprehensive benchmarks to rigorously evaluate these agents across diverse scenarios with fine-grained granularity. To address this gap, we propose AgenticDataBench, a comprehensive benchmark featuring realistic tasks spanning diverse domains with fine-grained ground-truth labels. This enables evaluations to capture the diversity and complexity of data science workflows and the detailed performance of agents. First, to cover diverse domains, we collect real datasets and tasks from 15 vertical domains, including 5 real-world B2B use cases from a leading fintech company. Second, to remove redundancy in real-world tasks and generate high-quality tasks for domains lacking real data, we introduce data science skills, recurring data-centric operational patterns, and quantify benchmark coverage by the number of skills included. Representative skills are extracted from large-scale task solutions on Stack Overflow using skill-aligned hierarchical clustering. Third, for real-world business tasks, we select task-solution pairs that maximize diversity in skill composition, ensuring broad coverage of practical scenarios. Fourth, to generate realistic tasks for devise domains without real tasks, we propose a systematic LLM-based task generation approach to create workflows and tasks based on these skills. Finally, we evaluate state-of-the-art data agents using our annotated benchmark and open-sourced testbed, providing detailed skill-level insights.', 'score': 29, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'a374c976d2699bde', 'github_url': '', 'github_stars': 0, 'authors': ['Zhaoyan Sun', 'Shan Zhong', 'Daizhou Wen', 'Jiaxing Han', 'Guoliang Li', 'Ying Yan', 'Peng Zhang', 'Yu Su', 'Xiang Qi', 'Baolin Sun', 'Chengyuan Yang', 'Tao Fang', 'Huaiyu Ruan'], 'affiliations': ['Ant Digital Technologies', 'Ant Group', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01647.jpg', 'data': {'categories': ['#benchmark', '#data', '#dataset', '#open_source', '#survey'], 'emoji': '📊', 'ru': {'title': 'Новый стандарт для оценки агентов данных', 'desc': 'В статье представлен обширный бенчмарк под названием AgenticDataBench, который предназначен для оценки агентов данных в различных областях с подробными аннотациями задач и метриками охвата навыков. Этот бенчмарк позволяет проводить оценку, отражающую разнообразие и сложность рабочих процессов в области науки о данных. Автоматизация процессов, связанных с анализом данных, является ключевой для уменьшения трудозатрат ученых данных и поддержки масштабируемых приложений. В работе также предлагается использовать большие языковые модели (LLM) для генерации реалистичных задач, что позволяет покрыть области, в которых недостаточно реальных данных.'}, 'en': {'title': 'Empowering Data Science Automation with AgenticDataBench', 'desc': 'The paper introduces AgenticDataBench, a benchmark designed to evaluate data agents in various domains with detailed task annotations and skill-based metrics. It aims to automate data science workflows using large language models (LLMs) to reduce the manual effort required by data scientists. The benchmark includes real datasets and tasks from multiple domains, ensuring a comprehensive evaluation of agent performance. By providing fine-grained insights into skill coverage and task diversity, it addresses the current lack of rigorous evaluation methods in the field.'}}}, {'id': 'https://huggingface.co/papers/2607.02517', 'title': 'WorldDirector: Building Controllable World Simulators with Persistent Dynamic Memory', 'url': 'https://huggingface.co/papers/2607.02517', 'abstract': 'Abstract WorldDirector enables controllable video generation with persistent object memory by decoupling semantic motion planning from visual rendering through LLM coordination of 3D trajectories and camera movements.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present WorldDirector, a highly controllable video world model framework designed for persistent dynamic object memory and unrestricted viewpoint exploration. Unlike existing world models that entangle physical dynamics with pixel rendering and rely on continuous visual observation to sustain motion, our framework explicitly decouples semantic motion orchestration from visual generation. By leveraging an LLM to coordinate 3D trajectories with camera movements and subsequently employing these orchestrated trajectories as control signals for video generation, our approach ensures strict physical logic and appearance stability, successfully preserving the exact visual identities of dynamic entities even when they re-enter the scene after prolonged periods out of view. Experimental results demonstrate that our method supports the synthesis of complex and extended events with unprecedented controllability and persistent dynamic object memory. Project Page: https://worlddirector.github.io/', 'score': 22, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '1407c8c3feff0e30', 'github_url': '', 'github_stars': 0, 'authors': ['Hanlin Wang', 'Hao Ouyang', 'Qiuyu Wang', 'Wen Wang', 'Qingyan Bai', 'Ka Leong Cheng', 'Yue Yu', 'Yixuan Li', 'Yihao Meng', 'Zichen Liu', 'Yanhong Zeng', 'Yujun Shen', 'Qifeng Chen'], 'affiliations': ['Ant Group', 'CUHK', 'HKUST', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2607.02517.jpg', 'data': {'categories': ['#3d', '#agents', '#optimization', '#memory'], 'emoji': '🎥', 'ru': {'title': 'Контролируемая генерация видео с памятью о динамических объектах', 'desc': 'WorldDirector - это фреймворк для генерации видео, который обеспечивает контролируемое создание визуального контента с помощью памяти о динамических объектах. Он разъединяет планирование семантического движения и визуальную генерацию, используя LLM для координации 3D-траекторий и движений камеры. Это позволяет сохранить физическую логику и стабильность внешнего вида объектов, даже если они временно покидают сцену. Результаты экспериментов показывают, что метод поддерживает синтез сложных событий с высокой управляемостью.'}, 'en': {'title': 'Mastering Video Generation with Object Memory', 'desc': 'WorldDirector is a framework for generating videos that allows for precise control over dynamic objects and their movements. It separates the planning of motion from the actual visual rendering, which helps maintain the identity of objects even when they are not visible for a while. By using a large language model (LLM) to manage 3D paths and camera angles, it ensures that the generated videos are both realistic and consistent. This approach enables the creation of complex scenes with a high level of control and memory of objects in the video.'}}}, {'id': 'https://huggingface.co/papers/2606.31825', 'title': 'Breaking Failure Cascades: Step-Aware Reinforcement Learning for Medical Multimodal Reasoning', 'url': 'https://huggingface.co/papers/2606.31825', 'abstract': 'Abstract A reinforcement learning approach called MRPO is introduced to improve clinical image reasoning by addressing cascading errors through step-wise process rewards, demonstrating superior performance over existing methods.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recent multimodal large language models have shown great promise in clinical image reasoning, but existing post-training pipelines remain predominantly outcome-centric, relying on final answer correctness or sequence-level preferences. This suffers from sparse credit assignment, making it difficult to optimize the reasoning process essential for clinical applications. Our analysis reveals that cascading errors from early-stage reasoning failures are a leading cause of incorrect predictions in medical visual question answering (VQA) benchmarks. Motivated by this, we propose Medical Reasoning-aware Policy Optimization (MRPO), an RL algorithm that incorporates step-wise process rewards. When the final answer is incorrect, MRPO assigns exponentially larger penalties to tokens in earlier invalid reasoning steps, breaking failure cascades without compromising successful paths. Across three multimodal LLM backbones, MRPO consistently outperforms standard GRPO and a recent RL baseline, and on Qwen3-VL-8B-Instruct even surpasses substantially larger medical MLLMs such as HuatuoGPT-Vision-34B by 2.79 points. Moreover, MRPO reduces early-stage reasoning failures from 64.0% to 13.0%, showing that targeted mitigation of cascading failures improves both reasoning quality and final answer accuracy. Our code is available at https://github.com/dmis-lab/MRPO', 'score': 19, 'issue_id': 2756, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '000f842e9f3220a4', 'github_url': '', 'github_stars': 0, 'authors': ['Junha Jung', 'Minbyul Jeong', 'Suhyeon Lim', 'Sungwook Jung', 'Jaehoon Yun', 'Taeyun Roh', 'Mujeen Sung', 'Jaewoo Kang'], 'affiliations': ['AIGEN Sciences', 'Hanyang University College of Medicine', 'KAIST', 'Korea University', 'Kyung Hee University', 'Upstage AI'], 'pdf_title_img': 'assets/pdf/title_img/2606.31825.jpg', 'data': {'categories': ['#multimodal', '#reasoning', '#rl', '#healthcare', '#rlhf', '#training', '#optimization'], 'emoji': '🩺', 'ru': {'title': 'Оптимизация медицинского рассуждения с помощью MRPO', 'desc': 'В статье представлен подход обучения с подкреплением под названием MRPO, который улучшает анализ клинических изображений, устраняя каскадные ошибки с помощью пошаговых вознаграждений. Традиционные методы фокусируются на окончательных ответах, что затрудняет оптимизацию процесса рассуждения. MRPO применяет экспоненциальные штрафы к неверным шагам, позволяя избегать каскадных неудач, не нарушая успешные пути. Тестирование показывает, что MRPO значительно снижает количество ранних ошибок рассуждения и повышает точность ответов.'}, 'en': {'title': 'Enhancing Clinical Image Reasoning with MRPO', 'desc': 'The paper introduces a reinforcement learning method called Medical Reasoning-aware Policy Optimization (MRPO) to enhance clinical image reasoning. MRPO addresses the issue of cascading errors in medical visual question answering by implementing step-wise process rewards, which help in optimizing the reasoning process. By assigning larger penalties to earlier incorrect reasoning steps, MRPO effectively mitigates the impact of these errors on final predictions. The results show that MRPO significantly reduces early-stage reasoning failures and outperforms existing methods, leading to improved accuracy in clinical applications.'}}}, {'id': 'https://huggingface.co/papers/2607.01874', 'title': 'SkillCoach: Self-Evolving Rubrics for Evaluating and Enhancing Agentic Skill-Use', 'url': 'https://huggingface.co/papers/2607.01874', 'abstract': 'Abstract SkillCoach is a self-evolving rubric framework that evaluates and improves agentic skill-use by analyzing skill selection, following, composition, and reflection processes, providing better supervision than outcome-only metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Skills are becoming a reusable operational layer for LLM agents, encoding SOPs, domain rules, tool workflows, scripts, and validation routines. In realistic skill repositories, overlapping skills make reliable skill-use difficult. Final verifier success is too coarse for both evaluation and training, since an agent may pass through trial and error while selecting distractor skills, skipping required steps, composing workflows incorrectly or omitting final checks. We introduce SkillCoach, a self-evolving rubric framework for evaluating and enhancing agentic skill-use. SkillCoach derives skill-grounded process rubrics from real rollouts and evaluates trajectories along four dimensions: skill selection, skill following, skill composition, and skill-grounded reflection. It keeps the external verifier as a separate outcome signal, allowing process quality to be distinguished from accidental task success. The evolved rubrics further serve as process supervision for selecting high-quality training trajectories. Experiments show that evolved rubrics substantially improve evaluation quality, expose failures hidden by final accuracy, and provide stronger supervision signals than outcome-only filtering for enhancing agentic skill-use.', 'score': 15, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'f4f7096387052af8', 'github_url': '', 'github_stars': 0, 'authors': ['Jiayin Zhu', 'Kelong Mao', 'Yudong Guo', 'Dengbo He', 'Sulong Xu', 'Simiu Gu', 'Yutao Yue'], 'affiliations': ['HKUST(GZ)', 'JD.COM'], 'pdf_title_img': 'assets/pdf/title_img/2607.01874.jpg', 'data': {'categories': ['#agent_memory', '#agents', '#optimization', '#training'], 'emoji': '🤖', 'ru': {'title': 'SkillCoach: Эволюция контроля агентских навыков', 'desc': 'Статья посвящена системе SkillCoach, которая обеспечивает более глубокую оценку и улучшение использования агентских навыков. Она анализирует процесс выбора, выполнения, составления и рефлексии навыков, что позволяет превосходить оценку только по результатам. SkillCoach генерирует рубрики, основанные на реальных данных, и оценивает работу по четырем направлениям, что помогает выявлять ошибки, которые могут быть скрыты под финальной точностью. Эксперименты показывают, что улучшенные рубрики значительно повышают качество оценки и предлагают более надежные сигналы для обучения.'}, 'en': {'title': 'Enhancing Agentic Skills with SkillCoach', 'desc': 'SkillCoach is a framework designed to evaluate and improve how agents use skills by analyzing their selection, execution, composition, and reflection processes. It generates rubrics from real-world examples, allowing for a more detailed assessment of skill use beyond just final outcomes. By separating the evaluation of process quality from the final success of tasks, SkillCoach helps identify hidden failures and provides better training signals. Experiments demonstrate that this approach significantly enhances the quality of evaluations and supports the development of more effective agentic skills.'}}}, {'id': 'https://huggingface.co/papers/2607.01002', 'title': 'Logit-Contribution Scoring Identifies Non-Literal Retrieval Heads', 'url': 'https://huggingface.co/papers/2607.01002', 'abstract': "Abstract Logit-Contribution Scoring (LOCOS) identifies attention heads responsible for non-literal context synthesis in large language models by measuring their output-value circuit's contribution to answer tokens, outperforming existing methods on retrieval benchmarks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In long-context use, large language models frequently synthesize answers from the meaning of a relevant context span rather than literally copy-pasting them. Identifying which attention heads perform this synthesis matters for interpreting long-context model behavior. Yet existing detectors miss these heads by construction: they reward heads whose attended token matches the generated token, a literal-copy criterion that captures where a head reads but not what it writes through its output-value (OV) circuit, the very mechanism that carries non-literal retrieval. We introduce Logit-Contribution Scoring (LOCOS), a write-aware detector that scores each head by the projection of its OV-circuit output onto the answer-token unembedding direction, contrasting needle and off-needle source positions in a single forward pass. Across three model families (Qwen3, Gemma-3, OLMo-3.1), mean-ablating the top LOCOS heads on the NoLiMa non-literal retrieval benchmark collapses ROUGE-L at lower head counts than prior attention-based detections; on Qwen3-8B, ablating 50 heads drives ROUGE-L from 0.401 to 0.000 while the strongest baseline still retains 0.292. The selected heads are retrieval-specific: parametric recall and arithmetic reasoning stay at baseline under the same ablation. On Qwen3-8B, the same ablation also drops MuSiQue from 0.55 to 0.08 and BABI-Long from 0.62 to 0.20, while a random-heads control stays within 0.05 of baseline.", 'score': 15, 'issue_id': 2756, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '52a3cd89295a0567', 'github_url': '', 'github_stars': 0, 'authors': ['Aryo Pradipta Gema', 'Beatrice Alex', 'Pasquale Minervini'], 'affiliations': ['Heriot-Watt University', 'Miniml.AI', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2607.01002.jpg', 'data': {'categories': ['#long_context', '#retrieval', '#benchmark', '#interpretability'], 'emoji': '🧠', 'ru': {'title': 'Новый подход к пониманию языковых моделей', 'desc': 'Статья посвящена методу Logit-Contribution Scoring (LOCOS), который позволяет выявлять головки внимания, отвечающие за синтез не литературного контекста в больших языковых моделях. LOCOS измеряет вклад выходного значения каждой головки в генерацию токенов ответа, что позволяет лучше понять поведение моделей с длительным контекстом. Авторы показывают, что этот метод превосходит существующие подходы на тестах на извлечение информации. Результаты демонстрируют, что правильное определение головок, участвующих в синтезе, имеет значительное значение для повышения качества генерации.'}, 'en': {'title': 'Unlocking Non-Literal Context in Language Models with LOCOS', 'desc': 'The paper introduces Logit-Contribution Scoring (LOCOS), a method for identifying attention heads in large language models that contribute to non-literal context synthesis. Unlike previous methods that focus on literal token matching, LOCOS evaluates the output-value circuit of each head to determine its impact on generated tokens. This approach allows for better interpretation of model behavior, especially in long-context scenarios. The results show that ablating the top LOCOS heads significantly reduces performance on non-literal retrieval tasks, highlighting the importance of these specific heads in the synthesis process.'}}}, {'id': 'https://huggingface.co/papers/2607.02291', 'title': 'Optimizing Visual Generative Models via Distribution-wise Rewards', 'url': 'https://huggingface.co/papers/2607.02291', 'abstract': 'Abstract A novel reinforcement learning framework for visual generation uses distribution-wise rewards to improve image diversity and quality while addressing mode collapse and computational efficiency issues.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Conventional reinforcement learning strategies for visual generation typically employ sample-wise reward functions, yet this practice frequently results in reward hacking that degrades image diversity and introduces visual anomalies. To address these limitations, we present a novel framework that finetunes generative models using distribution-wise rewards, ensuring better alignment with real-world data distributions. Unlike rewards that evaluate samples individually, distribution-wise reward accounts for the data distribution of the samples, mitigating the mode collapse problem that occurs when all samples optimize towards the same direction independently. To overcome the prohibitive computational cost of estimating these rewards, we introduce a subset-replace strategy that efficiently provides reward signals by updating only a small subset of a generated reference set. Additionally, we apply RL to optimize post-hoc model merging coefficients, potentially mitigating the train-inference inconsistency caused by introducing stochastic differential equation (SDE) in regular RL practices. Extensive experiments show our approach significantly improves FID-50K across various base models, from 8.30 to 5.77 for SiT and from 3.74 to 3.52 for EDM2. Qualitative evaluation also confirms that our method enhances perceptual quality while preserving sample diversity.', 'score': 14, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '297a734a4493d805', 'github_url': '', 'github_stars': 0, 'authors': ['Ruihang Li', 'Mengde Xu', 'Shuyang Gu', 'Leigang Qu', 'Fuli Feng', 'Han Hu', 'Wenjie Wang'], 'affiliations': ['Hunyuan Frontier Lab, Tencent', 'National University of Singapore', 'Shanghai Innovation Institute', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.02291.jpg', 'data': {'categories': ['#games', '#rl', '#optimization', '#training'], 'emoji': '🎨', 'ru': {'title': 'Новые горизонты визуальной генерации с помощью распределительных наград', 'desc': 'В статье представлена новая концепция обучения с подкреплением для визуальной генерации, которая использует распределительные награды для повышения качества и разнообразия изображений и решения проблем с коллапсом режимов. Традиционные стратегии часто приводят к ухудшению разнообразия и появлению визуальных аномалий из-за индивидуальной оценки наград. Наше решение учитывает распределение данных, что помогает избежать проблемы коллабирования. Мы также предлагаем стратегию замены подмножества, которая снижает вычислительные затраты при оценке наград.'}, 'en': {'title': 'Enhancing Visual Generation with Distribution-Wise Rewards', 'desc': 'This paper presents a new reinforcement learning framework aimed at improving visual generation by using distribution-wise rewards. Unlike traditional methods that rely on sample-wise rewards, which can lead to issues like mode collapse and reduced image diversity, this approach evaluates the overall data distribution. The framework also introduces a subset-replace strategy to efficiently compute rewards, minimizing computational costs. Experimental results demonstrate significant improvements in image quality and diversity across various generative models.'}}}, {'id': 'https://huggingface.co/papers/2607.01224', 'title': 'AutoMem: Automated Learning of Memory as a Cognitive Skill', 'url': 'https://huggingface.co/papers/2607.01224', 'abstract': "Abstract Memory management in large language models is treated as a trainable skill through a framework that automates both memory structure optimization and proficiency enhancement, leading to significant performance improvements in long-horizon tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Memory expertise is a learned skill: knowing what to encode, when to retrieve, and how to organize knowledge--a capacity known in cognitive science as metamemory. We bring this perspective to LLMs by treating memory management as a trainable skill. We promote file-system operations to first-class memory actions alongside task actions, letting the model itself decide how to manage its memory. This memory skill improves along two axes: the structure that supports it (prompts, file schemas, action vocabulary), and the proficiency of the model exercising it. Both axes resist manual optimization: episodes in long-horizon tasks run for thousands of steps, and a single memory mistake can hide long before it surfaces, making human review of full trajectories impractical. We introduce AutoMem, a framework that automates both axes. In the first loop, a strong LLM reviews complete agent trajectories and iteratively revises the memory structure that shapes how the agent interacts with its memory files. In the second loop, the agent's own good memory decisions are identified from many episodes and used as training signal to sharpen the model's memory proficiency directly. Across three procedurally generated long-horizon games (Crafter, MiniHack, and NetHack), optimizing memory alone--without modifying the model's task-action behavior--improved the base agent's performance ~2x-4x, bringing a 32B open-weight model competitive with frontier systems such as Claude Opus 4.5 and Gemini 3.1 Pro Thinking. Our results show that memory management is an independently learnable skill, and a high-leverage objective yielding large gains on long-horizon tasks.", 'score': 14, 'issue_id': 2756, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '8a6899529fcc8883', 'github_url': '', 'github_stars': 0, 'authors': ['Shengguang Wu', 'Hao Zhu', 'Yuhui Zhang', 'Xiaohan Wang', 'Serena Yeung-Levy'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.01224.jpg', 'data': {'categories': ['#agent_memory', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Управление памятью как обучаемый навык', 'desc': 'В данной работе рассматривается управление памятью в крупных языковых моделях как обучаемый навык. Авторы предлагают использовать фреймворк AutoMem, который автоматизирует оптимизацию структуры памяти и улучшение ее навыков. Это позволяет модели самостоятельно решать, как управлять своей памятью и значительно улучшает производительность в долгосрочных задачах. Оптимизация памяти без изменения поведения модели увеличивает эффективность в 2-4 раза, что ставит 32-миллиардную модель на уровень с ведущими системами.'}, 'en': {'title': 'Unlocking Memory: A Trainable Skill for Enhanced Performance', 'desc': "This paper presents a framework called AutoMem that treats memory management in large language models (LLMs) as a trainable skill. It automates the optimization of memory structures and enhances the model's proficiency in managing memory, which is crucial for long-horizon tasks. By allowing the model to decide how to manage its memory through file-system operations, significant performance improvements are achieved. The results demonstrate that optimizing memory alone can lead to a 2x-4x increase in performance, making the model competitive with leading systems."}}}, {'id': 'https://huggingface.co/papers/2607.02271', 'title': 'AGVBench: A Reliability-Oriented Benchmark of Data Augmentation for Vein Recognition', 'url': 'https://huggingface.co/papers/2607.02271', 'abstract': 'Abstract Research evaluates 30 augmentation strategies for vein recognition across multiple datasets and architectures, revealing inconsistencies between accuracy and adversarial security while highlighting dataset-specific effectiveness variations.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vein recognition is a secure biometric technology often constrained by limited annotated data and imaging variations. While data augmentation mitigates this, strategies designed for natural images may disrupt the fine-grained topology and textures essential for identity discrimination. We present AGVBench, which evaluates 30 representative augmentation strategies on five public palm- and finger-vein datasets with seven backbone architectures, covering classic CNNs, vision transformers, and vein-specific recognition models. Our results show that multi-image mixing methods (e.g., MixUp, PuzzleMix, StarMixup) generally provide the strongest recognition performance. However, they are often poorly calibrated and vulnerable to adversarial perturbations, revealing a clear inconsistency between clean accuracy and adversarial security. We also find that severe geometric transformations frequently degrade recognition, which is potentially due to feature misalignment or spatial cropping, and that augmentation effectiveness varies across palm and finger vein datasets. These findings prove that accuracy-centric evaluation is insufficient for biometric augmentation. AGVBench provides standardized protocols to support reproducible research and guide the design of reliable, secure, and robust vein recognition systems. Our codebase is available at https://github.com/Advance-VeinTech-Innovators/AGVBench.', 'score': 13, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'f5386039bb34b7a9', 'github_url': '', 'github_stars': 0, 'authors': ['Haiyang Li', 'Yuming Fu', 'Qun Song', 'Hongchao Liao', 'Jing Chen', 'Mounim A. EI-Yacoubi', 'Xin Jin'], 'affiliations': ['Chongqing Technology and Business University, Chongqing 400067, China', 'Guangzhou College of Applied Science and Technology, Guangzhou, Guangdong Province, China', 'SAMOVAR, Telecom SudParis, Institute Polytechnique de Paris, 91120 Palaiseau, France', 'School of Engineering, Westlake University, Hangzhou, Zhejiang Province, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.02271.jpg', 'data': {'categories': ['#benchmark', '#training', '#data', '#dataset', '#optimization', '#security', '#survey'], 'emoji': '🔍', 'ru': {'title': 'Эффективность увеличения данных для безопасного распознавания вен', 'desc': 'В данной работе исследуется 30 стратегий увеличения данных для распознавания вен на различных наборах данных и архитектурах. Выявлены несоответствия между точностью и устойчивостью к adversarial атакам, а также вариации эффективности в зависимости от характеристик наборов данных. Показано, что методы многослойного смешивания изображений, такие как MixUp и PuzzleMix, обеспечивают наилучшие результаты, но часто имеют низкую калибровку и восприимчивость к perturbations. Также выяснено, что серьезные геометрические трансформации могут ухудшать качество распознавания, что связано с несовпадением признаков.'}, 'en': {'title': 'Balancing Accuracy and Security in Vein Recognition', 'desc': 'This research evaluates 30 data augmentation strategies for vein recognition, focusing on their effectiveness across different datasets and architectures. It highlights the inconsistency between accuracy and adversarial security, showing that methods effective for natural images may harm vein recognition performance. The study introduces AGVBench, a framework for assessing these strategies on various vein datasets using multiple model architectures. Findings indicate that while multi-image mixing methods enhance recognition, they can compromise security, emphasizing the need for a balanced approach in biometric augmentation evaluation.'}}}, {'id': 'https://huggingface.co/papers/2607.02508', 'title': 'From SRA to Self-Flow: Data Augmentation or Self-Supervision?', 'url': 'https://huggingface.co/papers/2607.02508', 'abstract': 'Abstract Research investigates the mechanisms behind self-alignment methods in diffusion transformers, finding that performance improvements stem primarily from data augmentation along the noise dimension rather than token interactions between noise levels.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Representation alignment has become an effective way to accelerate diffusion transformer training and improve generation quality. Recent self-alignment methods, such as SRA and Self-Flow, further remove the dependency on external pretrained encoders by constructing alignment within the diffusion model itself. However, the mechanism behind the improvement from SRA to Self-Flow, dual-time scheduling, remains under-examined: Self-Flow attributes its gain to interactions between tokens at different noise levels, where cleaner tokens help infer noisier ones. In this work, we revisit this explanation and ask whether the gain instead comes from data augmentation along the noise dimension. To disentangle these factors, we introduce Attention Separation, which preserves the same dual-timestep input as Self-Flow while blocking attention between tokens assigned to different noise levels. Surprisingly, removing such interaction does not degrade performance and can even improve it, suggesting that the improvement from SRA to Self-Flow mainly comes from data augmentation. Furthermore,We show that Attention Separation itself provides an augmentation effect by splitting a single image into multiple effective training parts to expand the training data. Based on these observations, we combine self-representation alignment with dual-timestep and attention-separation augmentation, and demonstrate the effectiveness of this design on ImageNet.', 'score': 10, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '37eb8e1b241c5208', 'github_url': '', 'github_stars': 0, 'authors': ['Dengyang Jiang', 'Mengmeng Wang', 'Harry Yang', 'Jingdong Wang'], 'affiliations': ['Baidu Inc.', 'The Hong Kong University of Science and Technology', 'Zhejiang University of Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.02508.jpg', 'data': {'categories': ['#data', '#diffusion', '#optimization', '#training'], 'emoji': '🔍', 'ru': {'title': 'Улучшение генерации через расширение данных в диффузионных трансформерах', 'desc': 'В данной работе исследуются механизмы самоалыгментационных методов в диффузионных трансформерах. Основной вывод заключается в том, что улучшение производительности связано с увеличением данных вдоль измерения шума, а не с взаимодействием токенов на разных уровнях шума. Применение метода разделения внимания позволяет сохранять входные данные с двойным временным шагом и одновременно блокировать взаимодействие между токенами, что не ухудшает результаты, а может даже улучшить их. Это открытие подтверждает, что метод самоалыгментации действительно расширяет обучающую выборку и улучшает качество генерации.'}, 'en': {'title': 'Unlocking Performance: Data Augmentation Over Token Interaction', 'desc': 'This research explores how self-alignment methods in diffusion transformers enhance performance, focusing on data augmentation along the noise dimension. It challenges the idea that improvements come from token interactions at different noise levels, showing that removing these interactions does not harm performance. The study introduces Attention Separation, which effectively augments training data by splitting images into multiple parts. Ultimately, it combines self-representation alignment with dual-timestep and attention-separation techniques, demonstrating significant effectiveness on ImageNet.'}}}, {'id': 'https://huggingface.co/papers/2606.27669', 'title': 'When Search Agents Should Ask: DiscoBench for Clarification-Aware Deep Search', 'url': 'https://huggingface.co/papers/2606.27669', 'abstract': "Abstract DiscoBench evaluates search agents' ability to handle ambiguous queries through clarification questioning and recovery in multi-step information-seeking tasks across diverse real-world domains.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Search agents powered by large language models (LLMs) are increasingly used to solve complex information-seeking tasks, requiring multi-step retrieval and reasoning to fulfill user goals. However, existing benchmarks often assume that user queries are complete and explicit, overlooking the fact that real-world search requests are frequently vague, underspecified, or even factually incorrect. In deep search scenarios, such ambiguity can propagate along multi-step reasoning chains and lead agents toward incorrect search trajectories. To address this gap, we introduce DiscoBench, a benchmark for clarification-aware deep search, designed to evaluate whether search agents can proactively identify ambiguity, ask effective clarification questions, and recover correct reasoning paths through user interaction. DiscoBench contains 211 samples and 463 ambiguity instances across 11 real-world domains, covering four ambiguity types. We further design a user simulator for multi-turn interaction and evaluate model performance from four perspectives: task utility, ambiguity detection, interaction strategy, and cost efficiency. Experiments on representative LLMs show that ambiguity detection and effective clarification are distinct capabilities, and that repeatedly searching instead of asking for clarification often performs worse than direct guessing, highlighting a critical gap between retrieval ability and interactive problem-solving in current search agents.", 'score': 9, 'issue_id': 2756, 'pub_date': '2026-06-26', 'pub_date_card': {'ru': '26 июня', 'en': 'June 26', 'zh': '6月26日'}, 'hash': '4fd9bddb8ea3e20e', 'github_url': '', 'github_stars': 0, 'authors': ['Yiling Tao', 'Shihan Deng', 'Meiling Tao', 'Pengzhi Wei', 'Zhichao Hu', 'Zhihao Zhu'], 'affiliations': ['Hunyuan, Tencent', 'Shenzhen International Graduate School, Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2606.27669.jpg', 'data': {'categories': ['#reasoning', '#retrieval', '#agents', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'DiscoBench: Новый подход к оценке многослойного поиска', 'desc': 'Данная статья представляет новый бенчмарк DiscoBench для оценки способности агентов поиска справляться с неоднозначными запросами. Она подчеркивает, что многие реальные поисковые запросы являются нечеткими и недостаточно определенными, что может привести к неправильным результатам. DiscoBench позволяет тестировать, могут ли агенты задавать уточняющие вопросы и восстанавливать верные логические цепочки в многошаговых задачах. Эксперименты показывают, что выявление неоднозначности и эффективные уточнения являются разными навыками.'}, 'en': {'title': 'Navigating Ambiguity: Enhancing Search Agents with DiscoBench', 'desc': "DiscoBench is a benchmark designed to assess how well search agents can manage ambiguous queries by asking clarification questions and recovering from misunderstandings in multi-step information-seeking tasks. It highlights the limitations of existing benchmarks that assume user queries are clear and complete, which is often not the case in real-world scenarios. The benchmark includes 211 samples with various ambiguity types across 11 domains, allowing for a comprehensive evaluation of search agents' performance. Experiments reveal that effective ambiguity detection and clarification are crucial for improving interactive problem-solving, as relying solely on retrieval can lead to incorrect outcomes."}}}, {'id': 'https://huggingface.co/papers/2606.31924', 'title': 'InstanceControl: Controllable Complex Image Generation without Instance Labeling', 'url': 'https://huggingface.co/papers/2606.31924', 'abstract': 'Abstract InstanceControl enables multi-instance image generation by using vision-language models to establish instance-level correspondences between text prompts and visual conditions, while employing adaptive mask refinement for improved accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Controllable image generation methods, such as ControlNet, have demonstrated a remarkable capacity to introduce visual conditions(e.g., depth maps) to guide image generation. However, these methods often struggle with complex multi-instance scenes, frequently leading to attribute confusion among instances. While recent approaches attempt to mitigate this via manual instance labeling, such requirements are labor-intensive. In this paper, we propose InstanceControl, a novel multi-instance controllable generation method that eliminates the need for instance labeling. We identify the primary bottleneck in existing methods as the inability to accurately associate instance descriptions with their corresponding regions within visual conditions. To address this, we leverage the Vision-Language Model (VLM) to establish instance-level correspondences between text prompts and visual conditions. Specifically, the VLM automatically parses instance descriptions from the text prompts and simultaneously predicts instance masks based on the visual conditions. Furthermore, since the predicted masks may contain noise, we introduce an adaptive mask refinement strategy that dynamically refines these instance masks during the generation process. Extensive experiments demonstrate that our approach outperforms state-of-the-art methods, achieving superior fidelity and precise instance-level control.', 'score': 8, 'issue_id': 2756, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'cc2f75d7666b93b9', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaoyu Liu', 'Huan Wang', 'Fan Li', 'Zhixin Wang', 'Jiaqi Xu', 'Ming Liu', 'Wangmeng Zuo'], 'affiliations': ['HUAWEI Noahs Ark Lab, Shenzhen, China', 'Harbin Institute of Technology, Harbin, China'], 'pdf_title_img': 'assets/pdf/title_img/2606.31924.jpg', 'data': {'categories': ['#multimodal', '#3d', '#optimization', '#games'], 'emoji': '🖼️', 'ru': {'title': 'Генерация изображений с несколькими экземплярами без маркировки', 'desc': 'Статья предлагает новый метод генерации изображений с несколькими экземплярами под названием InstanceControl. Он использует модели зрения и языка (Vision-Language Models) для создания соответствий между текстовыми подсказками и визуальными условиями, избавляя от необходимости ручной маркировки экземпляров. Метод включает адаптивную стратегию уточнения масок, что улучшает точность генерации. Эксперименты показывают, что InstanceControl превосходит существующие алгоритмы, обеспечивая более высокую fidelity и точный контроль на уровне экземпляров.'}, 'en': {'title': 'Effortless Multi-Instance Image Generation', 'desc': 'InstanceControl is a new method for generating images with multiple instances by linking text prompts to specific visual elements without needing manual labeling. It uses a Vision-Language Model (VLM) to match descriptions of instances with their corresponding areas in the images. To improve accuracy, it includes an adaptive mask refinement process that cleans up the initial instance masks during image generation. Experiments show that InstanceControl provides better image quality and more precise control over individual instances compared to existing methods.'}}}, {'id': 'https://huggingface.co/papers/2607.02032', 'title': 'PACE: A Proxy for Agentic Capability Evaluation', 'url': 'https://huggingface.co/papers/2607.02032', 'abstract': "Abstract PACE is a framework that predicts expensive agentic LLM benchmark performance using a small subset of atomic evaluation instances, achieving high accuracy at a fraction of the cost.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Evaluating LLM agents on benchmarks like SWE-Bench and GAIA can be expensive, time-consuming, and requires complex infrastructure. A single evaluation can cost thousands of dollars and take days to complete. In contrast, non-agentic LLM benchmarks that test individual capabilities (e.g., reasoning, code generation) are fast and cheap to run. In this paper, we investigate whether performance on expensive agentic benchmarks can be accurately predicted by the performance on a small, carefully selected subset of atomic evaluation instances. We introduce PACE, a framework that constructs proxy benchmarks by selecting instances from existing non-agentic evaluations whose aggregate scores most reliably predict model performances on agentic benchmarks. Given a pool of candidate instances spanning atomic capabilities, PACE fits a regression that maps a model's scores on a compact subset of source instances to its score on the target agentic benchmark. The subset itself is curated by combining two complementary instance-selection strategies, target-relevance local selection and globally informative global selection. We apply PACE to the 4 target agentic benchmarks in this paper, which yields PACE-Bench, the concrete proxy benchmark that we evaluate in the paper. Experiments across 14 models, 4 agentic benchmarks, and 19 non-agentic benchmarks show that PACE-Bench predicts agentic scores with leave-one-out cross-validation (LOOCV) mean absolute error (MAE) under 4%, Spearman correlation above 0.80, and pairwise model-ranking accuracy around 85%, all at much less than 1% of the full agentic evaluation cost. We further analyze the selected proxy instances, revealing which skills each agentic benchmark uniquely demands. PACE enables practitioners to obtain reliable estimates of agentic performance during model development, selection, and routing, without the overhead of full agent evaluation.", 'score': 7, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'f29c5c40a9d40bd4', 'github_url': '', 'github_stars': 0, 'authors': ['Yueqi Song', 'Lintang Sutawika', 'Jiarui Liu', 'Lindia Tjuatja', 'Jiayi Geng', 'Yunze Xiao', 'Daniel Lee', 'Aditya Bharat Soni', 'Vincent Lo', 'Xiang Yue', 'Graham Neubig'], 'affiliations': ['Carnegie Mellon University', 'Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.02032.jpg', 'data': {'categories': ['#optimization', '#agent_memory', '#agents', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Эффективное предсказание производительности LLM с помощью PACE', 'desc': 'PACE — это фреймворк, который предсказывает производительность агентных LLM на сложных бенчмарках, используя небольшую выборку атомарных оценочных экземпляров. Он позволяет значительно снизить затраты и временные ресурсы при оценке моделей, требующих обширной инфраструктуры. Метод PACE использует регрессию для сопоставления оценок модели на компактном наборе экземпларов с оценками на более сложных бенчмарках. В результате PACE-Bench обеспечивает точные прогнозы производительности, экономя при этом значительные средства.'}, 'en': {'title': 'Efficient Performance Prediction for Agentic LLMs', 'desc': 'PACE is a framework designed to predict the performance of expensive agentic LLM benchmarks using a small set of simpler evaluation instances. It achieves high accuracy while significantly reducing costs and time associated with traditional evaluations. By selecting instances from non-agentic benchmarks that correlate well with agentic performance, PACE creates a proxy benchmark called PACE-Bench. This allows for efficient model assessment during development, providing reliable performance estimates without the need for full evaluations.'}}}, {'id': 'https://huggingface.co/papers/2607.02269', 'title': 'AnyGroundBench: A Specialized-Domain Benchmark for Video Grounding in Vision-Language Models', 'url': 'https://huggingface.co/papers/2607.02269', 'abstract': 'Abstract Vision-Language Models struggle with domain adaptation in specialized spatio-temporal video grounding tasks, highlighting limitations in zero-shot generalization and in-context learning capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language Models (VLMs) have demonstrated immense promise in Spatio-Temporal Video Grounding (STVG). However, current evaluation protocols are largely confined to zero-shot assessments on general, daily-life benchmarks. This creates a critical disconnect from real-world applications in specialized fields, where models inevitably encounter rare visual concepts and complex spatio-temporal dynamics. Since exhaustive pre-training across infinite data distributions is infeasible, the ability to adapt to novel domains is essential. To bridge this gap, we introduce AnyGroundBench, a domain-adaptation benchmark designed to shift the STVG evaluation paradigm from static zero-shot testing to rigorous domain adaptation. Targeting five specialized domains (animal, industry, sports, surgery, and public security), AnyGroundBench pairs newly captured videos such as expert-annotated mouse behaviors with established datasets, unifying them through dense, high-fidelity spatio-temporal annotations. Crucially, the benchmark provides dedicated training subsets to systematically measure domain adaptability. We extensively evaluate 15 state-of-the-art VLMs, assessing their zero-shot generalization and In-Context Learning (ICL) capabilities under practical computational constraints. Ultimately, our findings reveal that current models fail in both zero-shot and ICL-based adaptation when confronted with specialized domains, exposing critical flaws in spatio-temporal reasoning that future research must address.', 'score': 7, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '6dd4262918c664fe', 'github_url': '', 'github_stars': 0, 'authors': ['Rintaro Otsubo', 'Ryo Fujii', 'Reina Ishikawa', 'Taiki Kanaya', 'Kanta Sawafuji', 'Hiroki Kajita', 'Shigeki Sakai', 'Hideo Saito', 'Ryo Hachiuma'], 'affiliations': ['Keio AI Research Center', 'Keio University', 'Keio University School of Medicine', 'NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.02269.jpg', 'data': {'categories': ['#dataset', '#reasoning', '#transfer_learning', '#benchmark'], 'emoji': '🎥', 'ru': {'title': 'Новые горизонты для адаптации моделей в видеоаналитике', 'desc': 'Статья обсуждает проблемы адаптации моделей на основе компьютерного зрения и языка (VLM) к специализированным задачам, связанным со спатио-временным определением видео. Акцентируется внимание на ограничениях в обобщении без обучения и в способности к обучению в контексте, что приводит к трудностям при работе с редкими визуальными концепциями. Чтобы решить эту проблему, вводится новый бенчмарк AnyGroundBench, который направлен на оценку адаптивности моделей в пяти специализированных областях. Исследование показывает, что современные модели не справляются с задачами адаптации в таких специализированных доменах.'}, 'en': {'title': 'Bridging the Gap in Video Grounding with AnyGroundBench', 'desc': 'This paper addresses the challenges faced by Vision-Language Models (VLMs) in adapting to specialized spatio-temporal video grounding tasks. It highlights the limitations of these models in zero-shot generalization and in-context learning when dealing with rare visual concepts. To tackle this issue, the authors introduce AnyGroundBench, a benchmark that shifts the evaluation focus from static zero-shot testing to rigorous domain adaptation across five specialized domains. The study evaluates 15 state-of-the-art VLMs, revealing significant shortcomings in their spatio-temporal reasoning capabilities in specialized contexts.'}}}, {'id': 'https://huggingface.co/papers/2606.29961', 'title': 'DuoMem: Towards Capable On-Device Memory Agents via Dual-Space Distillation', 'url': 'https://huggingface.co/papers/2606.29961', 'abstract': "Abstract DuoMem is a dual-space distillation framework that transfers procedural problem-solving from large language models to compact student models through context-space and parameter-space distillation, achieving high performance with minimal additional parameters and improved inference speed.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large Language Model (LLM)-based agents can solve complex procedural tasks by interacting with environments over multiple turns, but this ability typically depends on large models, long contexts, and repeated inference calls. This makes advanced memory-augmented agents difficult to deploy on resource-constrained devices. We introduce DuoMem, a dual-space distillation framework that transfers procedural problem-solving ability from a large teacher model to compact student models. DuoMem distils in two complementary spaces: (1)context-space distillation, which replaces student-generated memories with higher-quality teacher-generated procedural memories prepended to the student's input, and (2)parameter-space distillation, which fine-tunes lightweight LoRA adapters on successful teacher trajectories. Evaluated on ALFWorld, a challenging embodied decision-making benchmark, DuoMem boosts a 4B-parameter model from 4.3% to 77.9% task success rate, closing most of the gap to a 72B teacher model (87.1%), while adding fewer than 10M trainable parameters and only a few megabytes of pre-computed teacher memories. Moreover, the DuoMem-enhanced 4B model completes tasks over 3x faster than the 72B teacher in wall-clock time, making it viable for real-time edge deployment, which would be challenging for the teacher.Extensive ablations across eight models spanning 2B-72B parameters reveal that both distillation axes contribute complementary", 'score': 6, 'issue_id': 2756, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '1746f856609a8842', 'github_url': '', 'github_stars': 0, 'authors': ['Peyman Hosseini', 'Ondrej Bohdal', 'Ahmed Alajrami', 'Andrea Maracani', 'Ignacio Castro', 'Matthew Purver', 'Mete Ozay', 'Savas Ozkan', 'Taha Ceritli'], 'affiliations': ['Queen Mary University of London', 'Samsung R&D Institute UK'], 'pdf_title_img': 'assets/pdf/title_img/2606.29961.jpg', 'data': {'categories': ['#inference', '#training', '#transfer_learning', '#agents', '#dataset', '#memory', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Эффективная дистилляция для компактных моделей', 'desc': 'Статья представляет DuoMem, фреймворк дистилляции с двумя пространствами, который переносит навыки решения процедурных задач от больших языковых моделей к компактным моделям-ученикам. Он использует дистилляцию в двух взаимодополняющих пространствах: дистилляция контекстных данных и дистилляция параметров. DuoMem существенно улучшает успех выполнения задач, увеличивая его с 4,3% до 77,9% для модели с 4 миллиардами параметров. Это достигается с минимальным добавлением параметров и значительно ускоренной инференцией, что делает возможность развертывания на устройствах с ограниченными ресурсами реальной.'}, 'en': {'title': 'Empowering Small Models with Big Model Wisdom', 'desc': 'DuoMem is a framework that helps smaller models learn problem-solving skills from larger language models. It does this through two types of distillation: context-space, which improves the input memories of the smaller model, and parameter-space, which fine-tunes its parameters based on successful examples from the larger model. This approach allows the smaller model to perform complex tasks effectively while using fewer resources. The results show a significant increase in task success rates and faster performance, making it suitable for deployment on devices with limited capabilities.'}}}, {'id': 'https://huggingface.co/papers/2607.01686', 'title': 'WARP: Weight-Space Analysis for Recovering Training Data Portfolios', 'url': 'https://huggingface.co/papers/2607.01686', 'abstract': "Abstract WARP is a framework that infers training data compositions from released model weights by analyzing geometric footprints in weight space through model merging and feature extraction.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Foundation models are routinely released to the public, yet the data recipes used to train them -- such as domain mixture weights that determine how different sources are sampled -- are rarely disclosed. This creates an access asymmetry: researchers study the resulting models but lack visibility into the training distribution that produces them. Prior works for inferring training data, such as membership inference, detect at the level of individual samples and thus cannot characterize the global composition of the training corpus. We introduce WARP, a framework that recovers a fine-tuned model's training mixtures directly from its released weights. WARP interpolates between the base and fine-tuned models using model merging, generating pseudo-checkpoints that approximate the missing training trajectory and expose a geometric footprint of the training data in the weight space. From these simulated footprints, WARP extracts geometric features and maps them to domain proportions using either a parameter-free softmax readout or an MLP projector trained on synthetic mixtures. In controlled experiments with BERT and GPT-2, WARP recovers domain mixtures with an average MAE as low as 0.046 and 0.104 respectively, outperforming membership inference and a variant with access to the true training trajectory.", 'score': 5, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '8a1061fc8b91751d', 'github_url': '', 'github_stars': 0, 'authors': ['Tzu-Heng Huang', 'Aditya Goyal', 'John Cooper', 'Frederic Sala'], 'affiliations': ['University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.01686.jpg', 'data': {'categories': ['#data', '#leakage', '#benchmark', '#synthetic'], 'emoji': '🔍', 'ru': {'title': 'Восстановление обучающих данных из весов модели', 'desc': 'WARP - это фреймворк, который анализирует геометрические следы в пространстве весов модели для восстановления составов обучающих данных. Он позволяет понять, какие источники данных использовались при обучении моделей, таких как BERT и GPT-2, даже если эта информация не раскрыта. WARP комбинирует базовые и дообученные модели, создавая псевдоконтрольные точки, которые отображают отсутствующую траекторию обучения. В экспериментах WARP достигает высокой точности в восстановлении составов доменов, превосходя предыдущие методы.'}, 'en': {'title': 'Unlocking Training Data Insights with WARP', 'desc': 'WARP is a novel framework designed to infer the training data compositions of machine learning models by analyzing their weight space. It addresses the issue of access asymmetry, where researchers can study models but lack insight into the training data used. By merging models and extracting geometric features from the weights, WARP can approximate the training mixtures that produced a fine-tuned model. In experiments, it demonstrated superior performance in recovering domain mixtures compared to previous methods like membership inference.'}}}, {'id': 'https://huggingface.co/papers/2607.02466', 'title': 'Learning to Move Before Learning to Do: Task-Agnostic pretraining for VLAs', 'url': 'https://huggingface.co/papers/2607.02466', 'abstract': 'Abstract Task-Agnostic Pretraining framework trains robotic models using self-supervised inverse dynamics on unlabeled data followed by lightweight language grounding, achieving superior performance with minimal expert demonstrations.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) models are fundamentally bottlenecked by the scarcity of expert demonstrations -- triplets of observations, instructions, and actions that are costly to collect at scale. We argue that this bottleneck stems from conflating two distinct learning objectives: acquiring physical competence (how to move) and acquiring semantic alignment (what to do). Crucially, only the latter requires language supervision. Building on this Decomposition Hypothesis, we propose Task-Agnostic Pretraining (TAP), a two-stage framework that first learns transferable motor priors from cheap, unlabeled interaction data -- including discarded off-task trajectories and autonomous robot play -- via a self-supervised Inverse Dynamics objective. A lightweight second stage then grounds these priors in language using minimal expert data. On the SIMPLER benchmark, TAP matches models trained on over 1M expert trajectories while using orders of magnitude less labeled data, yielding a 10% absolute gain over standard behavior cloning. On a real-world WidowX platform, TAP retains 25% success under camera perturbations where internet-scale baselines collapse to 0%, demonstrating that task-agnostic pretraining produces robust, transferable physical representations and offers a scalable path forward for Embodied AI.', 'score': 5, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '72daa5e6d5ba7543', 'github_url': '', 'github_stars': 0, 'authors': ['Junhao Shi', 'Siyin Wang', 'Xiaopeng Yu', 'Li Ji', 'Jingjing Gong', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'Shanghai Innovation Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.02466.jpg', 'data': {'categories': ['#rl', '#training', '#agi', '#transfer_learning', '#robotics', '#agents', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Преодоление недостатка экспертных данных в обучении роботов', 'desc': 'В статье представлен подход Task-Agnostic Pretraining (TAP), который обучает модели роботов с использованием самонаправленного метода инверсной динамики на неразмеченных данных. Этот метод позволяет избежать зависимости от дорогих экспертных демонстраций, разделяя задачи на физические навыки и семантическое соответствие. TAP сначала изучает переносимые моторные приоритеты на основе недорогих неразмеченных взаимодействий, а затем связывает их с языковыми инструкциями. Эксперименты показывают, что TAP достигает высоких результатов с использованием значительно меньшего объема размеченных данных.'}, 'en': {'title': 'Unlocking Robotic Learning with Minimal Expert Data', 'desc': 'The paper introduces a Task-Agnostic Pretraining (TAP) framework that enhances robotic learning by separating the acquisition of physical skills from semantic understanding. It utilizes self-supervised inverse dynamics on unlabeled data to develop motor skills, followed by a lightweight language grounding phase that requires minimal expert demonstrations. This approach addresses the challenge of limited expert data by leveraging cheap interaction data, leading to significant performance improvements. TAP demonstrates robust performance in real-world scenarios, proving its effectiveness in creating transferable physical representations for Embodied AI.'}}}, {'id': 'https://huggingface.co/papers/2607.01763', 'title': 'Denser neq Better: Limits of On-Policy Self-Distillation for Continual Post-Training', 'url': 'https://huggingface.co/papers/2607.01763', 'abstract': 'Abstract On-policy self-distillation in continual post-training accelerates in-domain specialization but fails to prevent forgetting and can collapse in out-of-distribution scenarios, indicating that on-policy data alone is insufficient for continual learning.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Continual post-training enables foundation models to acquire new knowledge while preserving existing capabilities. Recent work suggests that on-policy learning can mitigate forgetting, with on-policy self-distillation emerging as a particularly attractive approach. In this work, we revisit this optimistic view through self-distillation policy optimization (SDPO). Our experiments show that SDPO can accelerate in-domain specialization when teacher signals are stable and well aligned, but it struggles to generalize to out-of-distribution scenarios. In continual post-training, SDPO exhibits stronger forgetting and can even collapse, whereas on-policy reinforcement learning methods such as GRPO adapt more conservatively and better preserve prior capabilities. Further analyses reveal that denser self-distillation induces larger drift in both parameter space and response space, and can amplify high-frequency formatting artifacts through a self-reinforcing teacher--student loop. These findings suggest that on-policy data alone is insufficient for continual learning. Dense self-distillation can accelerate specialization when teacher targets are stable and token-level supervision is reliable, but it should not be treated as a default stabilizer for continual post-training. Our code is available at https://github.com/Moenupa/SDPO-CL.', 'score': 5, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '28b3ea3bcbee8fca', 'github_url': '', 'github_stars': 0, 'authors': ['Meng Wang', 'Haohan Zhao', 'Wenzhuo Liu', 'Lu Yang', 'Geng Liu', 'Haiyang Guo', 'Guo-Sen Xie', 'Gaofeng Meng', 'Hongbin Liu', 'Fei Zhu'], 'affiliations': ['Centre for Artificial Intelligence and Robotics, HKISI, CAS', 'Institute of Automation, CAS', 'Nanjing University of Science and Technology', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.01763.jpg', 'data': {'categories': ['#continual_learning', '#optimization', '#training'], 'emoji': '📉', 'ru': {'title': 'Проблемы само-дистилляции в постоянном обучении', 'desc': 'Исследование рассматривает методы само-дистилляции в процессе постоянного дообучения для предотвращения забывания моделей. Выясняется, что использование только данных на основе политики (on-policy) не достаточно для успешного постоянного обучения, особенно в новых условиях. Несмотря на ускорение специализации в схожих доменах, само-дистилляция может приводить к сильному забыванию и проблемам при различных распределениях данных. Авторы подчеркивают, что стабильные и хорошо согласованные сигналы учителя критически важны для успешной само-дистилляции.'}, 'en': {'title': 'Rethinking On-Policy Self-Distillation for Continual Learning', 'desc': 'This paper explores the limitations of on-policy self-distillation in continual post-training for machine learning models. While it can enhance specialization within the same domain, it struggles with forgetting previous knowledge and fails in out-of-distribution scenarios. The authors introduce self-distillation policy optimization (SDPO) and demonstrate that it can accelerate learning when teacher signals are stable, but it may lead to increased forgetting and model collapse. The findings indicate that relying solely on on-policy data is inadequate for effective continual learning.'}}}, {'id': 'https://huggingface.co/papers/2607.02375', 'title': 'Representation Distribution Matching for One-Step Visual Generation', 'url': 'https://huggingface.co/papers/2607.02375', 'abstract': 'Abstract Representation Distribution Matching enables high-quality image generation by matching feature distributions under pretrained encoders, with improved performance through optimized batch sizes and multi-encoder evaluation metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We elucidate the design space of Representation Distribution Matching (RDM), our name for the paradigm that trains a one-step image generator by matching generated and reference feature distributions under frozen pretrained encoders. We identify two design axes, how the distributions are compared and the representations they are compared in, and controlled studies along them yield three findings. First, the classical MMD, which could not train convincing generators a decade ago, becomes a strong and scalable objective once estimated right. Second, the generated batch is then the operative variable, with an optimum above 2048, far beyond customary batch sizes. Third, any single representation can be gamed, driven below the real score while images stay visibly fake, so we match against a balanced battery of encoders and evaluate with SW_r14, a Sliced-Wasserstein distance over 14 encoders that is independent of the training loss and resists gaming. Combining the preferred choices yields improved RDM (iRDM): it sets the one-step state of the art on ImageNet at SW_r14 1.30, corroborated by PickScore, a human-preference proxy our objective never optimizes, which prefers it over the prior best one-step generator on 71.2% of matched samples. The same recipe post-trains the four-step FLUX.2 [klein] into a one-step generator, surpassing the four-step version on GenEval, 0.826 to 0.794, and on PickScore, 22.76 to 22.58, in 90 H200 GPU-hours. Project page: https://alan-lanfeng.github.io/rdm/.', 'score': 4, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'cd349626f23da45c', 'github_url': '', 'github_stars': 0, 'authors': ['Lan Feng', 'Wuyang Li', 'Eloi Zablocki', 'Matthieu Cord', 'Alexandre Alahi'], 'affiliations': ['EPFL, Switzerland', 'Sorbonne Universite, France', 'Valeo.ai, France'], 'pdf_title_img': 'assets/pdf/title_img/2607.02375.jpg', 'data': {'categories': ['#diffusion', '#benchmark', '#training', '#architecture', '#dataset', '#optimization'], 'emoji': '🎨', 'ru': {'title': 'Согласование распределений для высококачественной генерации изображений', 'desc': 'Статья посвящена методу согласования распределений представлений (RDM), который позволяет эффективно генерировать изображения. Метод базируется на сравнении распределений признаков, извлеченных из замороженных предварительно обученных энкодеров. Были выявлены ключевые факторы, влияющие на качество генерации, такие как оптимальный размер батча и использование нескольких энкодеров для оценки результатов. Итогом стало улучшение результатов на наборе данных ImageNet и значительное превосходство над предыдущими методами генерации.'}, 'en': {'title': 'Revolutionizing Image Generation with Representation Distribution Matching', 'desc': 'This paper introduces Representation Distribution Matching (RDM), a method for generating high-quality images by aligning feature distributions from generated images with those from reference images using pretrained encoders. The authors explore two key design aspects: the comparison method of distributions and the representations used for comparison, leading to significant findings. They demonstrate that using the classical Maximum Mean Discrepancy (MMD) can effectively train image generators when estimated correctly, and that larger batch sizes improve performance. Additionally, they propose a robust evaluation metric, SW_r14, which uses multiple encoders to prevent misleading results, achieving state-of-the-art performance on ImageNet and surpassing previous models in human preference tests.'}}}, {'id': 'https://huggingface.co/papers/2607.01436', 'title': 'Discrete Diffusion Language Models for Interactive Radiology Report Drafting', 'url': 'https://huggingface.co/papers/2607.01436', 'abstract': 'Abstract Diffusion language models match or exceed autoregressive models in medical visual question answering while offering faster decoding and bidirectional text editing capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Diffusion language models, which generate text by denoising a token canvas bidirectionally instead of emitting tokens left to right, have become competitive with autoregressive (AR) generation. Medical foundation models, however, remain almost entirely autoregressive. We adapt a mixture-of-experts diffusion language model, DiffusionGemma-26B, and benchmark it against its same-size AR sibling Gemma-4-26B under an identical LoRA recipe on medical visual question answering datasets, scored by a verbosity-robust LLM judge. Diffusion matches or exceeds AR on all of them, and the finetuned model (3.8B active) is competitive with frontier vision-language models; its decoding is also 3.5-4.4x faster. Beyond this parity, the diffusion model offers a drafting capability AR lacks: any-order infill. Because the canvas is denoised bidirectionally, a radiologist can fix report fragments and have the model fill the text between them, an operation inherent to diffusion but not to autoregression, which is subpar at it. This suits real reports, which are often terse or inconsistent across clinicians and institutions.', 'score': 4, 'issue_id': 2756, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '7d2e8572a170f633', 'github_url': '', 'github_stars': 0, 'authors': ['Max Van Puyvelde', 'Halil Ibrahim Gulluk', 'Wim Van Criekinge', 'Olivier Gevaert'], 'affiliations': ['Department of Biomedical Data Science, Stanford University School of Medicine', 'Department of Electrical Engineering, Stanford University', 'Department of Mathematical Modelling, Stat
