    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.05394', 'title': 'Weak-to-Strong Generalization via Direct On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.05394', 'abstract': "Abstract Direct On-Policy Distillation transfers reinforcement learning improvements from smaller to larger models by using the policy shift induced by RL as an implicit reward signal, enabling efficient scaling of training without re-running expensive RL on the target model.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning with verifiable rewards (RLVR) is a powerful recipe for improving language-model reasoning, but it is expensive to repeat on every new strong model because the target model must generate many rollouts during training. As models scale, post-training itself becomes a bottleneck. We study a weak-to-strong alternative: run RL on a smaller model where rollouts are cheaper, then reuse what that RL run learned to improve a stronger target model. Directly distilling the post-RL weak teacher is not enough, because the teacher's final policy mixes useful RL gains with the limitations of the smaller model. We propose Direct On-Policy Distillation (Direct-OPD), which transfers the teacher's RL-induced policy shift instead. Direct-OPD compares the post-RL teacher with its own pre-RL reference and treats their log-ratio as a dense implicit reward for the student. In plain terms, the checkpoint pair tells us which actions RL made the weak model more or less likely to take, and Direct-OPD applies that signal on the stronger student's own on-policy states. This directly reuses the weak model's RL supervision signal without running sparse-reward RL on the target model. Empirically, Direct-OPD consistently leverages weaker teachers to improve stronger target models; notably, it boosts Qwen3-1.7B from 48.3% to 58.3% on AIME 2024 in just 4 hours on 8 A100 GPUs. It outperforms step-matched direct RL and enables the sequential composition of multiple policy shifts. Our results show that RL outcomes can be reused across model scales as implicit reward signals, not merely as final models to imitate.", 'score': 91, 'issue_id': 2814, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '8cc271818dfed97d', 'github_url': '', 'github_stars': 0, 'authors': ['Shiyuan Feng', 'Huan-ang Gao', 'Haohan Chi', 'Hanlin Wu', 'Zhilong Zhang', 'Zheng Jiang', 'Bingxiang He', 'Wei-Ying Ma', 'Ya-Qin Zhang', 'Hao Zhou'], 'affiliations': ['Department of Computer Science and Technology, Tsinghua University', 'Institute for AI Industry Research (AIR), Tsinghua University', 'Peking University', 'SIA-Lab of Tsinghua AIR and ByteDance Seed'], 'pdf_title_img': 'assets/pdf/title_img/2607.05394.jpg', 'data': {'categories': ['#optimization', '#transfer_learning', '#training', '#rl'], 'emoji': '📈', 'ru': {'title': 'Эффективная передача знаний между моделями!', 'desc': 'В статье рассматривается метод прямой дистилляции политик (Direct On-Policy Distillation) для передачи улучшений в области обучения с подкреплением (RL) от меньших моделей к большим. Метод использует изменения политики, вызванные RL, в качестве неявного сигнала награды, что позволяет эффективно масштабировать обучение без повторного запуска затратного RL на целевой модели. Исследуемое решение позволяет использовать слабую модель для получения полезной информации, которую затем можно применить к более сильной модели. Результаты экспериментов показывают, что метод улучшает производительность больших моделей, ускоряя процесс обучения и делая его более эффективным.'}, 'en': {'title': 'Efficiently Scaling RL with Direct On-Policy Distillation', 'desc': "This paper introduces Direct On-Policy Distillation (Direct-OPD), a method that enhances larger reinforcement learning (RL) models by transferring knowledge from smaller models. Instead of re-running expensive RL on the larger model, Direct-OPD uses the policy changes from the smaller model as an implicit reward signal. This approach allows for efficient scaling of training by leveraging the weaker model's RL experiences without the need for extensive rollouts. The results demonstrate that Direct-OPD significantly improves the performance of larger models, showcasing the potential of reusing RL outcomes across different model sizes."}}}, {'id': 'https://huggingface.co/papers/2607.10383', 'title': 'ABot-N1: Toward a General Visual Language Navigation Foundation Model', 'url': 'https://huggingface.co/papers/2607.10383', 'abstract': 'Abstract  Visual Language Navigation foundation models aim to unify deep reasoning for grounded spatial decisions with broad versatility for diverse embodied tasks. Current approaches typically achieve this integration via monolithic policies that map observations directly to actions, yet they often suffer from coordinate drift and poor handling of long-tail semantics. Furthermore, these black-box mappings lack interpretability, hindering the simultaneous achievement of generality, robustness, and transparency. We present ABot-N1, a step toward a general Visual Language Navigation foundation model, that addresses these challenges by decoupling cognition from control via a slow-fast architecture guided by dual visual-language signals. More specifically, a slow vision-language reasoner performs explicit Chain-of-Thought reasoning while producing a pixel goal. This compact set of image-space anchor points serves as a universal interface for diverse tasks, including point-goal, object-goal, poi-goal, instruction-following, and person-following. Subsequently, a fast action expert leverages both the textual cues and the pixel guidance to generate continuous waypoints at the native control frequency. By bridging high-level intents and low-level control through pixel-grounded anchors paired with explicit linguistic traces, our approach ensures robust, generalizable, and interpretable navigation across simulation and real-world benchmarks. ABot-N1 establishes new state-of-the-art records, delivering massive gains specifically in urban-scale navigation: boosting POI arrival by 35.0% (to 77.3%) and achieving 95.4%/92.9% SR in complex indoor and outdoor scenes. It also maintains superior robustness across object-reaching, person-following, and instruction-following tasks. New Point-Goal/POI-Goal benchmarks are released as open source to advance the field of urban-scale navigation.', 'score': 80, 'issue_id': 2814, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '377986f249a6d947', 'github_url': '', 'github_stars': 0, 'authors': ['Ruiyan Gong', 'Yingnan Guo', 'Junjun Hu', 'Jintao Kong', 'Xiaoxu Leng', 'Tianlun Li', 'Weize Li', 'Fei Liu', 'Zhicheng Liu', 'Jia Lu', 'Minghua Luo', 'Chenlin Ming', 'Yanfen Shen', 'Jiyue Tao', 'Zhengbo Wang', 'Mingyang Yin', 'Minqi Gu', 'Zihao Guan', 'Wei Guo', 'Guoqing Liu', 'Huachong Pang', 'Menglin Yang', 'Zeqian Ye', 'Xiaoxiao Geng', 'Zhining Gu', 'Honglin Han', 'Di Jing', 'Hongyu Pan', 'Mingchao Sun', 'Kuan Yang', 'Jianfang Zhang', 'Yanghong Chen', 'Ye He', 'Wei Mei', 'Jiahao Shi', 'Xiangpo Yang', 'Yanqing Zhu', 'Zedong Chu', 'Xiaolong Wu', 'Mu Xu'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.10383.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#agents', '#open_source', '#interpretability'], 'emoji': '🧭', 'ru': {'title': 'Новая эра навигации с ABot-N1', 'desc': 'В статье представлена модель ABot-N1 для навигации по визуальному языку, которая объединяет глубокое понимание пространственных решений и универсальность для различных задач. Она решает проблемы существующих подходов, таких как дрейф координат и плохая интерпретируемость, разделяя когнитивные процессы и управление через архитектуру с медленной и быстрой обработкой. Модель использует визуально-языковые сигналы для генерации стабильных навигационных точек, что улучшает общую устойчивость и обобщаемость. ABot-N1 демонстрирует выдающиеся результаты в городских масштабах, достигая значительного повышения успешности навигации.'}, 'en': {'title': "Navigating with Clarity: ABot-N1's Breakthrough in Visual Language Navigation", 'desc': 'This paper introduces ABot-N1, a new model for Visual Language Navigation that improves how machines make spatial decisions. It separates reasoning from action using a slow-fast architecture, allowing for better understanding and execution of tasks. The model uses a vision-language reasoner to create pixel goals, which serve as clear targets for various navigation tasks. ABot-N1 achieves significant performance improvements in urban navigation, demonstrating robustness and interpretability across different scenarios.'}}}, {'id': 'https://huggingface.co/papers/2607.10350', 'title': 'ABot-AgentOS: A General Robotic Agent OS with Lifelong Multi-modal Memory', 'url': 'https://huggingface.co/papers/2607.10350', 'abstract': 'Abstract  Recent VLM and VLA systems have improved robotic perception and action prediction, yet long-horizon embodied agents still require a general runtime layer for reasoning, memory, tool use, verification, and cross-embodiment execution. We present ABot-AgentOS, a general robotic Agent Operating System that sits above low-level controllers and provides a deliberative agent layer for scene-conditioned planning, context-isolated skill execution, multi-stage verification, multi-modal memory, and edge-cloud collaboration. To evaluate such systems, we introduce EmbodiedWorldBench, an executable benchmark with 16 indoor, outdoor, and hybrid scenes, four difficulty levels, and over 200 tasks involving navigation, object search, NPC dialogue, dynamic events, and trace-grounded scoring. ABot-AgentOS further introduces Universal Multi-modal Graph Memory, a persistent source-grounded substrate that converts dialogue, visual observations, spatial context, temporal relations, and task traces into typed nodes and edges. A failure-driven self-evolution loop converts diagnosed memory failures into gated runtime evo-assets that are promoted only to later evaluation splits, preventing current-split ground-truth leakage while enabling continual improvement. On an initial EmbodiedWorldBench subset, ABot-AgentOS improves over a single-controller baseline in both task success and goal completion. Across memory benchmarks, ABot-AgentOS Static achieves 87.5 on LoCoMo, 59.9 on OpenEQA EM-EQA, 88.6 on Mem-Gallery, and 76.5 Acc@All on NExT-QA; self-evolution further improves LoCoMo to 88.7, OpenEQA to 60.4, and Mem-Gallery to 89.0. These results suggest that a general Agent OS layer can improve long-horizon embodied execution while providing persistent, auditable memory for continual interaction.', 'score': 67, 'issue_id': 2814, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '2a9fff25288e4c7f', 'github_url': '', 'github_stars': 0, 'authors': ['Jiayi Tian', 'Shiao Liu', 'Yuting Xu', 'Jia Lu', 'Zihao Guan', 'Honglin Han', 'Di Yang', 'Minqi Gu', 'Yifei Qian', 'Tianlin Zhang', 'Yanqing Zhu', 'Zeqian Ye', 'Menglin Yang', 'Fei Wang', 'Xu Hu', 'Xiuxian Li', 'Wei Zhang', 'Shihui Su', 'Yiyan Ji', 'Jingbo Wang', 'Ziteng Feng', 'Jiaheng Liu', 'Zhaoxiang Zhang', 'Xiaolong Wu', 'Mingyang Yin', 'Zedong Chu', 'Mu Xu'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.10350.jpg', 'data': {'categories': ['#memory', '#benchmark', '#agents', '#continual_learning', '#agent_memory', '#tool_use'], 'emoji': '🤖', 'ru': {'title': 'Новая эра робототехники с ABot-AgentOS', 'desc': 'В данной статье представлена новая операционная система для роботов ABot-AgentOS, которая улучшает восприятие и предсказание действий. Она обеспечивает уровень рассуждений для планирования и выполнения задач, используя многофункциональную память и сотрудничество между разными системами. Для оценки таких систем был введен набор тестов EmbodiedWorldBench, включающий различные сцены и задачи. Результаты показывают, что ABot-AgentOS значительно улучшает успех выполнения задач и завершение целей по сравнению с обычными контроллерами.'}, 'en': {'title': 'Empowering Robots with ABot-AgentOS for Enhanced Decision-Making', 'desc': 'This paper introduces ABot-AgentOS, a robotic Agent Operating System designed to enhance long-horizon embodied agents by providing a higher-level reasoning and planning layer. It features capabilities like scene-conditioned planning, multi-modal memory, and a self-evolution mechanism that improves performance over time. The system is evaluated using EmbodiedWorldBench, which includes various tasks and environments to test navigation, object search, and interaction. Results show that ABot-AgentOS significantly outperforms traditional single-controller systems in task success and memory benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.09125', 'title': '4D Human-Scene Reconstruction from Low-Overlap Captures', 'url': 'https://huggingface.co/papers/2607.09125', 'abstract': 'Abstract  Existing volumetric capture of dynamic human performance achieves high fidelity with dense camera arrays. However, in real-world scenarios, only a handful of low-overlap cameras are available, which degrades the output quality and leaves large areas unobserved. Recent 4D reconstruction methods have focused on low-overlap settings, yet they still produce noticeable artifacts in under-observed regions. Video diffusion models have emerged as another option, but they show geometrically inconsistent results for humans. To address these limitations, we propose StudioRecon, a pipeline that reconstructs 4D human scenes from sparse, low-overlap cameras by decoupling background and humans. We densify background supervision by synthesizing hundreds of camera-controlled novel views with a video diffusion model. We also robustly initialize deformable Gaussian humans with cross-view identity association and triangulated multi-view keypoint fitting. Finally, our recursive enhancement module with motion-adaptive consistency injection harmonizes the composed output, thereby further avoiding remaining artifacts. We achieve state-of-the-art novel view synthesis across four real-world datasets and demonstrate applications such as novel trajectory rendering and human replacement.', 'score': 40, 'issue_id': 2814, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'f5ae19ad511911c4', 'github_url': '', 'github_stars': 0, 'authors': ['Minhyuk Hwang', 'Sangmin Kim', 'Seunguk Do', 'Daneul Kim', 'Jaesik Park'], 'affiliations': ['Seoul National University, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.09125.jpg', 'data': {'categories': ['#3d', '#synthetic', '#diffusion'], 'emoji': '🕺', 'ru': {'title': 'Реконструкция 4D-сцен с помощью StudioRecon', 'desc': 'В данной статье представлена система StudioRecon, которая позволяет реконструировать 4D-сцены с участием человека из ограниченного числа камер с низким перекрытием. Система использует метод диффузии видео для генерации новых ракурсов, что помогает улучшить качество фона. Также реализована надежная инициализация людей с помощью ассоциации идентичностей и подгонки ключевых точек. В итоге, мы достигаем высококачественного синтеза новых видов и минимизируем артефакты в реконструированном изображении.'}, 'en': {'title': 'Revolutionizing 4D Human Scene Reconstruction with Sparse Cameras', 'desc': 'This paper presents StudioRecon, a novel pipeline for reconstructing 4D human scenes using sparse, low-overlap camera setups. It addresses the challenges of existing methods that struggle with artifacts in under-observed areas by decoupling the background from human subjects. The approach enhances background supervision through the synthesis of novel views using a video diffusion model and robustly initializes human representations with cross-view identity association. The proposed recursive enhancement module improves the output quality by ensuring motion-adaptive consistency, achieving state-of-the-art results in novel view synthesis across multiple datasets.'}}}, {'id': 'https://huggingface.co/papers/2607.11487', 'title': 'LightMem-Ego: Your AI Memory for Everyday Life', 'url': 'https://huggingface.co/papers/2607.11487', 'abstract': "Abstract  Personal AI assistants on mobile and wearable devices continuously perceive users' daily lives through visual and audio streams. However, answering queries about past experiences requires lightweight multimodal memory that can continuously accumulate, organize, and retrieve long-term experiences, which remains challenging. To address this challenge, we present LightMem-Ego, a lightweight streaming multimodal memory system for everyday-life assistance. The system continuously captures egocentric visual and audio streams, aligns them on a shared timeline, and organizes them into a hierarchical memory consisting of current, short-term, and long-term memory. Given a user query, LightMem-Ego dynamically routes retrieval to the appropriate memory level and generates answers grounded in multimodal evidence. The demonstration can be deployed on smartphones and AI glasses, supporting object finding, conversation recall, life summarization, routine discovery, and personalized assistance. Code is available at https://github.com/zjunlp/LightMem-Ego.", 'score': 32, 'issue_id': 2814, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'b17ededca1716a39', 'github_url': '', 'github_stars': 0, 'authors': ['Yijun Chen', 'Boyi Xiao', 'Yixian Zhao', 'Haoting Xia', 'Buqiang Xu', 'Jizhan Fang', 'Yanya Li', 'Yaqi Zheng', 'Xuehai Wang', 'Zirui Xue', 'Liuxin Zhang', 'Hui Li', 'Ningyu Zhang'], 'affiliations': ['Central China Normal University', 'Lenovo Group Limited', 'South China University of Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11487.jpg', 'data': {'categories': ['#memory', '#agent_memory', '#retrieval', '#open_source', '#session_memory', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Легкая многомодальная память для персональных AI-ассистентов', 'desc': 'В статье представлена система LightMem-Ego, предназначенная для создания легкой многомодульной памяти, которая обеспечивает поддержку пользователей в повседневной жизни. Эта система обрабатывает визуальные и аудиопотоки, аккумулируя и организуя информацию в иерархическую память. LightMem-Ego позволяет отвечать на запросы пользователей, динамически выбирая уровень памяти для извлечения данных. Это решение может быть применено на смартфонах и AI-очках для помощи в поиске объектов, воспоминаниях о разговорах и персонализированной поддержке.'}, 'en': {'title': 'Lightweight Multimodal Memory for Everyday AI Assistance', 'desc': "This paper introduces LightMem-Ego, a lightweight multimodal memory system designed for personal AI assistants on mobile and wearable devices. It captures and organizes visual and audio information from users' daily lives into a structured memory system that includes current, short-term, and long-term memory. The system can efficiently retrieve relevant information based on user queries by dynamically selecting the appropriate memory level. LightMem-Ego enhances user experience by supporting various tasks such as object finding and conversation recall, making it a valuable tool for personalized assistance."}}}, {'id': 'https://huggingface.co/papers/2607.11849', 'title': 'AdvancedMathBench: A Benchmark Suite for Advanced Mathematical Proof Generation and Verification', 'url': 'https://huggingface.co/papers/2607.11849', 'abstract': 'Abstract  Large language models (LLMs) have achieved remarkable performance on high-school and olympiad-style mathematics, yet their capabilities on advanced mathematics remain poorly understood. Existing benchmarks, however, fall short in both scope and evaluation granularity: they provide limited disciplinary coverage and often rely on final-answer correctness or coarse judgments, leaving the validity of the reasoning process inadequately assessed. To bridge this gap, we introduce AdvancedMathBench, a benchmark suite designed to evaluate advanced mathematical reasoning capabilities. Its core proof-generation benchmark, ProverBench, contains 296 problems spanning undergraduate and doctoral qualifying-exam levels. To provide reliable evaluation of the proofs, we develop a dedicated automatic verification pipeline trained on large-scale expert annotations to produce both correctness verdicts and fine-grained assessments of proof errors, which exhibits strong agreement with human experts on held-out proof trajectories. We further introduce VerifierBench, consisting of 888 model-generated proof trajectories paired with expert ground truth, to evaluate whether models can correctly judge proof validity and provide sound verification rationales. Experiments show that AdvancedMathBench remains challenging for frontier models. On proof generation, the best-performing model, GPT-5.5-xhigh, achieves only 75.8 and 66.1 on the UGD and QE splits, respectively, indicating substantial room for improvement on advanced mathematical proof construction. On proof verification, the best model attains a Balanced F1 of only 65.1, and models generally exhibit low true negative rates, suggesting that critical error detection remains a major bottleneck.', 'score': 19, 'issue_id': 2814, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'bbdc436efff255f8', 'github_url': '', 'github_stars': 0, 'authors': ['Lingkai Kong', 'Zijian Wu', 'Yuzhe Gu', 'Haiteng Zhao', 'Wenyong Huang', 'Shuang Sun', 'Zhicheng Xiong', 'Xiaotian Zhang', 'Shuya Zhao', 'Yan Wang', 'Disheng Xu', 'Wenwei Zhang', 'Kai Chen'], 'affiliations': ['Great Bay', 'MMLab, The Chinese University of Hong Kong', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11849.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#math'], 'emoji': '📐', 'ru': {'title': 'Проверка пределов возможностей LLM в продвинутой математике', 'desc': 'В данной статье рассматриваются возможности больших языковых моделей (LLM) в сфере продвинутой математики, которые до сих пор недостаточно изучены. Авторы представляют новый бенчмарк AdvancedMathBench, который позволяет оценить способности к математическому рассуждению на уровне бакалавриата и аспирантуры. Bключает в себя систему для генерации и проверки доказательств, где важно точное определение корректности решений. Эксперименты показывают, что существующие модели еще не достигают высоких результатов в генерации и верификации математических доказательств.'}, 'en': {'title': 'Unlocking Advanced Math: New Benchmarks for LLMs', 'desc': 'This paper explores the limitations of large language models (LLMs) in advanced mathematics, highlighting their strong performance in basic math but poor understanding of complex problems. To address this, the authors introduce AdvancedMathBench, a comprehensive benchmark suite that evaluates advanced mathematical reasoning. It includes ProverBench, which tests proof generation with 296 challenging problems, and VerifierBench, which assesses proof validity through model-generated trajectories. The results indicate that even the best models struggle with proof construction and verification, revealing significant areas for improvement.'}}}, {'id': 'https://huggingface.co/papers/2607.11881', 'title': 'Metacognition in LLMs: Foundations, Progress, and Opportunities', 'url': 'https://huggingface.co/papers/2607.11881', 'abstract': "Abstract  Metacognition is a foundational component of intelligence critical to effective learning, problem solving, decision-making, communication, and more. In recent years, it has become increasingly recognized as a cornerstone of capable, transparent AI systems. Yet while LLMs have made significant progress across diverse real-world tasks, it is not yet clear when, how, or to what extent they can exhibit or be endowed with effective metacognitive abilities, nor how such abilities can be adapted to advance the fundamental capabilities, reliability, and intelligence of AI systems. This paper bridges this gap by presenting the first comprehensive overview of the current state of knowledge on metacognition for LLMs. We analyze and taxonomize the landscape of this emerging field and summarize recent technical advancements, including methods and benchmarks to measure and evaluate LLMs' metacognitive abilities, techniques to elicit, improve, and apply metacognition in LLMs, and findings and implications of ongoing research. We also discuss applications, open questions and challenges, and promising directions for future work. Our aim is to provide a detailed and up-to-date review of this topic and stimulate meaningful research and discussion. An organized list of papers can be found at https://github.com/yale-nlp/LLM-Metacognition.", 'score': 12, 'issue_id': 2814, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'dff3684024e2ba78', 'github_url': '', 'github_stars': 0, 'authors': ['Gabrielle Kaili-May Liu', 'Areeb Gani', 'Jacqueline Lu', 'Jordan Thomas', 'Mark Steyvers', 'Arman Cohan'], 'affiliations': ['University of California, Irvine', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11881.jpg', 'data': {'categories': ['#survey', '#benchmark', '#multimodal', '#training'], 'emoji': '🧠', 'ru': {'title': 'Метакогниция как ключ к улучшению возможностей LLM', 'desc': 'Метакогниция является основополагающим компонентом интеллекта, необходимым для эффективного обучения и решения задач. В последнее время она привлекает внимание как важный элемент для создания прозрачных и способных систем ИИ. В данной статье представлен первый всесторонний обзор текущего состояния знаний о метакогниции для LLM. Мы анализируем и систематизируем достижения в этой области и обсуждаем методы улучшения метакогнитивных возможностей LLM.'}, 'en': {'title': 'Unlocking Metacognition for Smarter AI', 'desc': "This paper explores the role of metacognition in large language models (LLMs), highlighting its importance for enhancing AI systems' learning and decision-making capabilities. It provides a comprehensive overview of current research on how LLMs can develop and utilize metacognitive skills. The authors analyze recent advancements, including methods to measure and improve these abilities in LLMs. Additionally, the paper discusses future research directions and challenges in integrating metacognition into AI systems."}}}, {'id': 'https://huggingface.co/papers/2607.09701', 'title': 'EgoSteer: A Full-Stack System Towards Steerable Dexterous Manipulation from Egocentric Videos', 'url': 'https://huggingface.co/papers/2607.09701', 'abstract': 'Abstract  Steerability is a defining capability of generalist robot policies, yet remains largely absent in dexterous-hand systems for lack of large-scale, language-aligned, and action-accurate demonstration data. To address this bottleneck, we present a full-stack system that scales dexterous VLA pre-training from egocentric human videos and enables data-efficient real-robot post-training. It integrates EgoSmith, a data pipeline that curates in-the-wild egocentric videos into 9.6K hours of high-quality pre-training data with 9x higher throughput and better accuracy than prior SOTA; a unified robot stack for teleoperation and human-in-the-loop correction; and EgoSteer, a world-model-enhanced VLA trained on optimized infrastructure. Human-data pre-training equips EgoSteer with language-guided manipulation priors, which are grounded through robot post-training and improved by DAgger refinement. Empirically, EgoSteer robustly executes free-form instructions across 40+ diverse tasks, demonstrating failure recovery, dexterity, and generalization. The pre-trained model also few-shot adapts to complex long-horizon tasks, including box folding, on two embodiments with 75+% success. We open-source the system, data, and model at https://egosteer.github.io/.', 'score': 8, 'issue_id': 2817, 'pub_date': '2026-06-21', 'pub_date_card': {'ru': '21 июня', 'en': 'June 21', 'zh': '6月21日'}, 'hash': '97915154a147736f', 'github_url': '', 'github_stars': 0, 'authors': ['Yifan Zhong', 'Zhang Chen', 'Tianrui Guan', 'Fanlian Zeng', 'Yuyao Ye', 'Tianjia He', 'Ka Nam Lui', 'Jiayi Li', 'Tingrui Zhang', 'Ruilin Yan', 'Xinhao Ji', 'Guangyu Zhao', 'Wenjie Lou', 'Jiayuan Zhang', 'Yuanpei Chen', 'Yaodong Yang'], 'affiliations': ['Institute for AI, PKU', 'PKU-PsiBot Joint Lab', 'UPenn'], 'pdf_title_img': 'assets/pdf/title_img/2607.09701.jpg', 'data': {'categories': ['#agi', '#robotics', '#open_source', '#dataset', '#data'], 'emoji': '🤖', 'ru': {'title': 'Управляемость роботов: новый уровень манипуляций', 'desc': 'В статье рассматривается новая система для управления манипуляциями роботов с использованием методов машинного обучения. Авторы предлагают улучшенный подход к обучению на основе видеоданных, позволяя роботам эффективно выполнять сложные задачи. Система EgoSteer использует предварительное обучение с учетом языка и демонстрирует высокую точность и гибкость в выполнении инструкций. В результате внедрения этого подхода роботы могут адаптироваться к новым задачам с минимальными затратами данных.'}, 'en': {'title': 'Empowering Robots with Language-Guided Dexterity', 'desc': 'This paper introduces a system called EgoSteer that enhances the steerability of dexterous robot hands by using a large dataset of egocentric human videos. It employs a data pipeline named EgoSmith to create 9.6K hours of high-quality pre-training data, significantly improving the efficiency and accuracy of the training process. The system allows robots to follow complex, language-guided instructions and adapt to various tasks with minimal additional training. The results show that EgoSteer can successfully perform over 40 tasks, demonstrating its ability to recover from failures and generalize across different scenarios.'}}}, {'id': 'https://huggingface.co/papers/2607.11505', 'title': 'Proxy Exploration and Reusable Guidance: A Modular LLM Post-Training Paradigm via Proxy-Guided Update Signals', 'url': 'https://huggingface.co/papers/2607.11505', 'abstract': "Abstract  Post-training is essential for refining the domain-specific capabilities of large language models (LLMs), yet existing reward optimization and distribution matching methods tightly couple policy exploration with distribution alignment. This coupling forces expensive exploration directly on the policy model and severely hinders the asynchronous generation, reuse, and cross-model transfer of optimization signals. In this paper, we propose Proxy-guided Update Signal Transfer (PUST), a novel post-training framework that fundamentally decouples update-signal exploration from distribution alignment. Instead of utilizing the primary model for costly exploration, PUST employs a lightweight proxy model as an efficient testbed to discover high-reward behaviors. We extract the relative improvement signal between the proxy's initial and optimized states, transferring this directional update to the primary model to guide its policy alignment. This decoupled pipeline, comprising proxy exploration, update-signal extraction, and signal transfer, significantly reduces computational overhead and enables optimization signals to be asynchronously generated, cached, and reused. Crucially, by transferring relative improvements rather than absolute policy distributions, PUST naturally supports weak-to-strong improvement and seamless cross-model transfer. Systematic evaluations on Qwen3-family models across math and code domains demonstrate that update signals extracted from substantially weaker proxies can robustly and adjustably enhance stronger primary models. Ultimately, PUST transforms post-training from a monolithic online optimization process into a highly modular, reusable, and cost-efficient paradigm.", 'score': 7, 'issue_id': 2815, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'cd71a6c97f2885dd', 'github_url': '', 'github_stars': 0, 'authors': ['Daocheng Fu', 'Rong Wu', 'Yu Yang', 'Xuemeng Yang', 'Jianbiao Mei', 'Licheng Wen', 'Pinlong Cai', 'Yong Liu', 'Botian Shi', 'Yu Qiao'], 'affiliations': ['Fudan University', 'Shanghai AI Laboratory', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11505.jpg', 'data': {'categories': ['#training', '#optimization', '#transfer_learning'], 'emoji': '🔄', 'ru': {'title': 'Новый подход к дообучению больших языковых моделей', 'desc': 'В статье представлено новое средство дообучения больших языковых моделей, называемое Proxy-guided Update Signal Transfer (PUST). Этот метод отделяет исследование обновляющих сигналов от выравнивания распределений, что сокращает вычислительные затраты. Используя легкую прокси-модель для исследования, PUST позволяет извлекать значительные улучшения и передавать их основной модели. Это преобразует процесс послеобучения в модульный и более экономичный подход.'}, 'en': {'title': 'Decoupling Exploration and Alignment for Efficient Model Training', 'desc': 'This paper introduces Proxy-guided Update Signal Transfer (PUST), a new framework for post-training large language models (LLMs). PUST separates the exploration of update signals from the alignment of model distributions, allowing for more efficient optimization. By using a lightweight proxy model for exploration, it reduces the computational costs associated with policy updates. The framework enables asynchronous generation and reuse of optimization signals, leading to improved performance in various tasks without the need for direct exploration on the primary model.'}}}, {'id': 'https://huggingface.co/papers/2607.00397', 'title': 'NeuroCogMap Reveals Cognitive Organization of Large Language Models', 'url': 'https://huggingface.co/papers/2607.00397', 'abstract': 'Abstract  Understanding how complex cognitive functions are organized within artificial systems is central to interpreting large language models (LLMs) and relating them to biological cognition. Yet although LLMs exhibit broad cognitive-like behaviours, it remains unclear whether their internal representations form reproducible functional systems that explain behaviour, failure and links to human cognition. Here we present NeuroCogMap, a cognitive neuroscience-inspired framework that organizes internal features of LLMs into functional parcels and links them to interpretable functions, cognitive capabilities and a cognitive hierarchy. These parcels form a stable and semantically coherent organization that is partly conserved across models and functionally linked to model outputs. Within this organization, major LLM failures, including hallucination, bias, refusal failure and sycophancy, correspond to distinct disruptions in representational and behavioural-control systems, yielding internal signatures for mechanism-guided detection and targeted intervention. Beyond model behaviour, NeuroCogMap improves prediction of human cortical responses during naturalistic language comprehension, with the strongest correspondence in higher-order association cortex. At the cognitive level, its internal signatures expose latent strategies that guide refinements of classical models of human decision-making. Together, these findings establish NeuroCogMap as a system-level framework for mapping functional organization in artificial systems and for relating this organization to human cortical function and cognitive behaviour.', 'score': 5, 'issue_id': 2814, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'e20c48fd6bc0e6c7', 'github_url': '', 'github_stars': 0, 'authors': ['Zhongxiang Sun', 'Haolang Lu', 'Qiang Ma', 'Qi Li', 'Qipeng Wang', 'Liang Pang', 'Chenyu Liu', 'Qiankun Li', 'Hao Sun', 'Kun Wang', 'Yi Zeng', 'Jun Xu', 'Guoqi Li', 'Ji-Rong Wen'], 'affiliations': ['Beijing University of Posts and Telecommunications, Beijing, China', 'College of Computing and Data Science, Nanyang Technological University, Singapore', 'Gaoling School of Artificial Intelligence, Renmin University of China, Beijing, China', 'Huazhong University of Science and Technology, Wuhan, China', 'IGS, Imperial College London, London, UK', 'Institute of Automation, Chinese Academy of Sciences, Beijing, China', 'State Key Laboratory of AI Safety, Institute of Computing Technology, Chinese Academy of Sciences, Beijing, China', 'The University of Hong Kong, Hong Kong, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.00397.jpg', 'data': {'categories': ['#agents', '#ethics', '#architecture', '#science', '#interpretability', '#multimodal', '#hallucinations'], 'emoji': '🧠', 'ru': {'title': 'Картирование когнитивных функций в искуственных системах', 'desc': 'Статья представляет NeuroCogMap — структуру, вдохновлённую когнитивной нейронаукой, для организации внутренних особенностей LLM в функциональные группы. Эти группы помогают интерпретировать поведение моделей и связывать их с когнитивными способностями и иерархией. Исследование показывает, что основные ошибки LLM, такие как галлюцинации и предвзятости, соответствуют нарушениям в системах представления и контроля поведения. NeuroCogMap также улучшает предсказание реакции человеческой коры при восприятии языка.'}, 'en': {'title': 'Mapping Cognitive Functions in Language Models', 'desc': 'This paper introduces NeuroCogMap, a framework that organizes the internal features of large language models (LLMs) into functional parcels, linking them to cognitive capabilities and a hierarchy. It reveals that these parcels create a stable organization that is somewhat consistent across different models and relates to their outputs. The framework also identifies specific failures in LLMs, such as hallucination and bias, by mapping disruptions in their representational and behavioral systems. Additionally, NeuroCogMap enhances the prediction of human brain responses during language comprehension, providing insights into human decision-making processes.'}}}, {'id': 'https://huggingface.co/papers/2607.11736', 'title': 'MET: Theory-Grounded and Culture-Aware Multilingual Moral Reasoning', 'url': 'https://huggingface.co/papers/2607.11736', 'abstract': 'Abstract  Language models are increasingly used for moral decision-making across diverse linguistic and cultural contexts, yet existing work overlooks multilinguality on three aspects: 1) multilingual evaluation benchmarks use direct translation, failing to adapt culture-specific items; 2) inference-time methods for moral reasoning rely on static, English-centric scaffolds and lack grounding in moral theory; 3) training methods for moral decision-making typically require expensive supervision from stronger models or human annotators. We address these gaps with three contributions. First, we introduce MCLASH, a multilingual moral decision-making benchmark to capture culturally situated moral intuitions and social norms across languages. Second, we propose MET (Multilingual Ethics with Theory-grounded reasoning), a two-step prompting method built on expert-curated, theory-based grounds drawn from psychology and philosophy: the model first selects situation- and culture-specific grounds, then reasons over them in the native language of the user. Third, we introduce MET-D (MET-Distillation), which enhances the second step through a self-distillation training stage that requires no external supervision. MET-D improves macro-F1 over the base model on all three models of different sizes and families (Qwen3-4B, Qwen3-8B, Gemma3-4B), by an average of 3.71 points on MCLASH and 4.23 on MMoralExceptQA, with a peak MCLASH gain of 12.94 points for Malay on Qwen3-8B. We further reveal that MET-D increases native-language reasoning by 62.13 points on average, and that beneficial grounds differ systematically across cultures. Together, these contributions open the path for culture-aligned, theory-grounded multilingual moral reasoning.', 'score': 4, 'issue_id': 2819, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '0745005885429f98', 'github_url': '', 'github_stars': 0, 'authors': ['Ayoung Lee', 'Ryan Kwon', 'Yunxiang Zhang', 'Yuxuan Liu', 'Peter Railton', 'Lu Wang'], 'affiliations': ['Department of Computer Science and Engineering', 'Department of Philosophy University of Michigan'], 'pdf_title_img': 'assets/pdf/title_img/2607.11736.jpg', 'data': {'categories': ['#benchmark', '#training', '#prompting', '#ethics', '#long_context', '#multilingual'], 'emoji': '🌍', 'ru': {'title': 'Многоязычное моральное рассуждение на основе культуры', 'desc': 'В данной работе представлен MCLASH — многоязычный эталон для принятия моральных решений, который учитывает культурные нормы и интуиции. Для улучшения процесса морального рассуждения предложен метод MET, основанный на теоретических основах из психологии и философии, который позволяет модели работать на родном языке пользователя. Мы также разработали MET-D, метод самодистилляции, который не требует внешнего надзора и улучшает результаты на базе моделей. Исследование показывает, что модули MET-D значительно увеличивают качество оценки на разных языках и культурах.'}, 'en': {'title': 'Empowering Multilingual Moral Reasoning with Culture and Theory', 'desc': "This paper addresses the challenges of using language models for moral decision-making in multilingual contexts. It introduces MCLASH, a benchmark that captures moral intuitions and norms specific to different cultures and languages. The authors propose MET, a two-step prompting method that uses theory-based reasoning to improve moral reasoning in the user's native language. Additionally, they present MET-D, a self-distillation training method that enhances performance without needing external supervision, leading to significant improvements in reasoning accuracy across various models."}}}, {'id': 'https://huggingface.co/papers/2607.09362', 'title': 'CtrlVTON: Controllable Virtual Try-On via Visual-Instance-Prompt Segmentation', 'url': 'https://huggingface.co/papers/2607.09362', 'abstract': 'Abstract  Virtual try-on (VTO) has made significant progress in realistically transferring garments onto a target person. Yet most systems give the user little control over how a garment should be worn -- its size (loose or fitted), style (e.g., tucked in or untucked, open or closed), and spatial placement on the body. We address this gap with two complementary contributions. First, we define and solve Visual-Instance-Prompt Segmentation via VIP-SAM: given a flatlay image of a garment, segment that specific instance in a photograph of a person wearing it. This is an instance-level task, distinct from the typically studied category-level segmentation. Second, we introduce CtrlVTON, a controllable VTO framework that recasts try-on as an image editing problem and adds segmentation masks as pixel-level control over garment layout, including style, size, and spatial placement on the body. VIP-SAM and CtrlVTON each achieve state-of-the-art results on their respective tasks. In particular, CtrlVTON generates images that follow user-provided layouts far more faithfully than the strongest proprietary editing systems while matching them on garment fidelity.', 'score': 4, 'issue_id': 2814, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': '3bc45277f2e08749', 'github_url': '', 'github_stars': 0, 'authors': ['Seungyong Lee', 'Hyun Jun Jang', 'Sangoh Kim', 'Sungjoon Park'], 'affiliations': ['KAIST', 'NXN Labs'], 'pdf_title_img': 'assets/pdf/title_img/2607.09362.jpg', 'data': {'categories': ['#3d', '#multimodal'], 'emoji': '👗', 'ru': {'title': 'Контроль над виртуальной примеркой одежды!', 'desc': 'Статья посвящена виртуальной примерке (VTO), которая достигла значительного прогресса в реалистичной трансформации одежды на целевом человеке. В большинстве систем пользователи имеют ограниченный контроль над тем, как следует носить одежду, включая размер, стиль и размещение на теле. Авторы предлагают два улучшения: сегментацию по экземплярам с помощью VIP-SAM и контролируемую виртуальную примерку с CtrlVTON, что позволяет более точно управлять стилем и размещением одежды. Эти методы показывают лучшие результаты по сравнению с существующими системами редактирования изображений.'}, 'en': {'title': 'Empowering Virtual Try-On with User Control', 'desc': 'This paper presents advancements in virtual try-on (VTO) technology, focusing on user control over garment appearance. It introduces Visual-Instance-Prompt Segmentation (VIP-SAM) to accurately segment specific garments in images of people. Additionally, the authors propose CtrlVTON, a controllable VTO framework that treats try-on as an image editing task, allowing for detailed adjustments in garment style, size, and placement. Both VIP-SAM and CtrlVTON achieve state-of-the-art performance, significantly improving user experience in virtual garment fitting.'}}}, {'id': 'https://huggingface.co/papers/2607.11885', 'title': 'Latent-Identity Tuning in Text-to-Image Personalization Models', 'url': 'https://huggingface.co/papers/2607.11885', 'abstract': "Abstract  Generating and editing a person's face demands high precision, as even minor modifications can significantly alter a subject's perceived identity. Current personalization and editing methods built on general-purpose text-to-image models, however, often lack the precision required for fine-grained facial edits. We present a method for fine-grained identity tuning in text-to-image personalization models. Unlike standard image editing, which operates on a given image, identity tuning modifies the latent representation of a specific identity, enabling the generation of diverse images that consistently depict the same edited identity. To enable fine-grained latent identity tuning, we explore the latent space of a pre-trained, frozen encoder for text-to-image personalization. Our approach requires no additional training. Instead, it leverages the existing architecture of a frozen encoder to uncover latent semantic directions. This space consists of a set of latent tokens that play distinct roles in capturing different aspects of an identity and often correspond to specific spatial or semantic facial regions. We show that meaningful directions can be identified within this space and within subspaces defined by selected tokens, enabling localized, fine-grained, and semantically coherent edits. We validate our approach through qualitative and quantitative experiments that demonstrate diverse localized facial edits while preserving cross-image identity consistency. Project page at: https://garibida.github.io/IdentityTuning/", 'score': 3, 'issue_id': 2817, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '41c404a98952da03', 'github_url': '', 'github_stars': 0, 'authors': ['Daniel Garibi', 'Ronen Kamenetsky', 'Hadar Averbuch-Elor', 'Daniel Cohen-Or', 'Or Patashnik'], 'affiliations': ['Cornell University', 'Tel Aviv University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11885.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#multimodal'], 'emoji': '🖼️', 'ru': {'title': 'Точная настройка идентичности в генерации изображений', 'desc': 'В данной статье представлено новое подход к точной настройке идентичности в моделях текст-в-изображение. Этот метод позволяет изменять латентное представление определенной индивидуальности, обеспечивая генерацию разнообразных изображений с однородным редактированным лицом. Особенностью нашего подхода является отсутствие необходимости в дополнительном обучении, что позволяет использовать существующую архитектуру замороженного энкодера. Мы проводим эксперименты, которые показывают высокую точность и согласованность идентичности в редактируемых изображениях.'}, 'en': {'title': 'Precision in Facial Identity Editing', 'desc': 'This paper introduces a method for fine-grained identity tuning in text-to-image models, allowing for precise facial edits without altering the perceived identity. Unlike traditional image editing, which modifies existing images, this approach adjusts the latent representation of a specific identity to generate consistent and diverse images. The method utilizes a pre-trained, frozen encoder to explore the latent space, identifying semantic directions that correspond to different facial features. Through experiments, the authors demonstrate that their technique enables localized and coherent facial edits while maintaining identity consistency across images.'}}}, {'id': 'https://huggingface.co/papers/2607.11644', 'title': 'Motion4Motion: Motion Transfer Across Subjects at Inference', 'url': 'https://huggingface.co/papers/2607.11644', 'abstract': 'Abstract  This work explores the motion transfer from one video to another, which is crucial in animation for diverse characters. Previously, video motion transfer has been largely explored between human and human-like characters, enabling a lot of applications in digital creation. However, these approaches encounter a main limitation. Specifically, related technical pipelines heavily rely on a predefined human skeleton structure and accordingly require skeleton-conditional model training. On the one hand, these methods are difficult to generalize to diverse characters, such as animals from different species, while preserving their unique motion styles. On the other hand, labeled data in diverse skeletons is limited, which additionally restricts the large-scale training for the task. In this paper, we jump out of the skeleton-based motion transfer framework and propose a training-free motion transfer framework, named Motion4Motion. Motion4Motionmodels the motion flow of the character in a video instead of skeletons, which makes motion transfer across species easier. Extensive experimental results and novel applications show our methods outperform baselines impressively. Project page is available at https://lhchen.top/Motion4Motion.', 'score': 3, 'issue_id': 2814, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '2211df48b3e55945', 'github_url': '', 'github_stars': 0, 'authors': ['Ling-Hao Chen', 'Zixin Yin', 'Duomin Wang', 'Xianfang Zeng', 'Gang Yu'], 'affiliations': ['Stepfun, China', 'The Hong Kong University of Science and Technology, China', 'Tsinghua University, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.11644.jpg', 'data': {'categories': ['#3d'], 'emoji': '🎨', 'ru': {'title': 'Новый подход к передаче движений для разнообразных персонажей', 'desc': 'В этой работе рассматривается передача движений из одного видео в другое, что важно для анимации различных персонажей. Ранее передача движений в основном изучалась между человеческими и человекоподобными персонажами, но существующие методы имеют свои ограничения. Основная проблема заключается в том, что они требуют заранее заданной структуры скелета, что усложняет обобщение на разнообразные персонажи, такие как животные. В данной статье предложен новый подход Motion4Motion, который не зависит от скелетов и позволяет легче передавать движения между представителями разных видов.'}, 'en': {'title': 'Revolutionizing Motion Transfer with Motion4Motion', 'desc': 'This paper presents a new approach to motion transfer between videos, focusing on diverse characters beyond just humans. The proposed method, Motion4Motion, eliminates the need for a predefined skeleton structure, allowing for easier transfer of motion styles across different species. By modeling the motion flow directly from the video, it overcomes limitations of previous methods that struggled with generalization and required extensive labeled data. Experimental results demonstrate that Motion4Motion significantly outperforms existing techniques, showcasing its potential for various applications in digital animation.'}}}, {'id': 'https://huggingface.co/papers/2607.11643', 'title': 'Xiaomi-Robotics-U0: Unified Embodied Synthesis with World Foundation Model', 'url': 'https://huggingface.co/papers/2607.11643', 'abstract': 'Abstract  Recent foundation image and video generation models offer strong generalization and controllability, but their direct application to embodied scenarios is limited by requirements for multi-view consistency, geometric coherence, and robot embodiment constraints. Existing methods typically adapt foundation models with limited robot data, often sacrificing visual knowledge acquired during large-scale pre-training. We present Xiaomi-Robotics-U0, a 38-billion-parameter multimodal autoregressive model for unified embodied synthesis. It treats embodied generation as an extension of foundation image and video generation and jointly optimizes text-to-image generation, image editing, embodied scene generation, embodied transfer, and embodied video generation. This unified framework preserves the generalization of the pre-trained world foundation model while adapting it to embodied settings. Xiaomi-Robotics-U0 is the first model to support high-quality multi-view scene generation across multiple robot embodiments and to introduce structured, controllable embodied transfer for fine-grained editing while preserving multi-view consistency and interaction dynamics. It achieves state-of-the-art results on single-step and sequential generation tasks, outperforming GPT-Image-2.0 in human evaluations of embodied scene generation and transfer, ranking first on World Arena for embodied video generation, and improving the out-of-distribution success rate of pi_0.5 from 36.9% to 63.2% on challenging real-world manipulation tasks. These results show that foundation world models can serve both as embodied world models and scalable data engines for embodied intelligence. Code and checkpoints are available at https://robotics.xiaomi.com/xiaomi-robotics-u0.html.', 'score': 3, 'issue_id': 2818, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '39fee1863ba45f20', 'github_url': '', 'github_stars': 0, 'authors': ['Xinghang Li', 'Jun Guo', 'Qiwei Li', 'Long Qian', 'Hang Lai', 'Yueze Wang', 'Hongyu Yan', 'Jiahang Cao', 'Xi Chen', 'Jingen Qu', 'Jiaxi Song', 'Nan Sun', 'Hanye Zhao', 'Futeng Liu', 'Wanli Peng', 'Heyun Wang', 'Yunhong Wang', 'Caoyu Xia', 'Jack Zhao', 'Diyun Xiang', 'Hangjun Ye', 'Heng Qu', 'Huaping Liu', 'Jason Li'], 'affiliations': ['Xiaomi Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2607.11643.jpg', 'data': {'categories': ['#games', '#robotics', '#agi', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Новая эра генерации для роботов!', 'desc': 'В данной статье представлен мультимодальный авторегрессивный модель Xiaomi-Robotics-U0, обладающая 38 миллиардами параметров. Она объединяет генерацию изображений и видео с контекстом воплощенных сценариев, обеспечивая многовидовую согласованность и геометрическую целостность. Модель оптимизирует различные задачи, включая генерацию сцен и видео для роботов, сохраняя при этом знания, полученные на этапе предварительного обучения. Результаты показывают, что Xiaomi-Robotics-U0 превосходит предыдущие модели в генерации и передаче воплощенных сцен.'}, 'en': {'title': 'Unified Embodied Synthesis for Robotics', 'desc': 'This paper introduces Xiaomi-Robotics-U0, a large multimodal autoregressive model designed for embodied synthesis in robotics. It enhances traditional image and video generation by ensuring multi-view consistency and geometric coherence, which are crucial for robotic applications. The model integrates various tasks like text-to-image generation and embodied scene generation into a unified framework, maintaining the strengths of pre-trained foundation models. It achieves superior performance in generating and transferring embodied scenes, demonstrating significant improvements in real-world manipulation tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.10623', 'title': 'LATO.2: Factorized 3D Mesh Generation with Vertex and Topology Flow', 'url': 'https://huggingface.co/papers/2607.10623', 'abstract': 'Abstract  Flow matching over carefully designed latent representations has recently emerged as a powerful paradigm for topology-aware mesh generation. Existing approaches, however, model vertices and connectivity jointly in a joint latent space, entangling continuous vertex geometry with discrete combinatorial structure; this complicates flow learning and manifests as drifting vertices and broken surfaces. We present LATO.2, a factorized flow matching framework that decomposes mesh generation into a vertex flow followed by a connectivity flow conditioned on the realized vertices, with both stages anchored to a shared coarse voxel scaffold. Dedicated VAEs underpin the two stages, recovering vertices at sub-voxel precision and embedding discrete connectivity into a continuous latent space. We demonstrate two advantages unique to this factorization: (i) part-wise generation, in which the scaffold is partitioned and each part synthesized at full latent capacity, yielding substantially higher-resolution meshes than a monolithic latent permits; and (ii) topology-adaptive editing, in which manipulating first-stage vertices induces the corresponding connectivity without re-optimization. Experiments show that LATO.2 surpasses state-of-the-art topology-aware mesh generators in geometric fidelity and connectivity quality.', 'score': 2, 'issue_id': 2814, 'pub_date': '2026-07-12', 'pub_date_card': {'ru': '12 июля', 'en': 'July 12', 'zh': '7月12日'}, 'hash': 'c320f3e6cb496cd3', 'github_url': '', 'github_stars': 0, 'authors': ['Hang Long', 'Tianhao Zhao', 'Junkai Lin', 'Youjia Zhang', 'Huipeng Guo', 'Rendong Liang', 'Jiale Xu', 'Jozef Hladký', 'Matthias Nießner', 'Wei Yang'], 'affiliations': ['Huazhong University of Science and Technology', 'Independent Researcher', 'Meshy AI', 'Technical University of Munich'], 'pdf_title_img': 'assets/pdf/title_img/2607.10623.jpg', 'data': {'categories': ['#3d', '#architecture', '#optimization', '#games'], 'emoji': '🔗', 'ru': {'title': 'Эффективная генерация сеток с LATO.2', 'desc': 'Статья представляет LATO.2 — новый подход к генерации сеток, который разделяет процесс на два этапа: генерацию вершин и генерацию связности. Это позволяет избежать смешивания непрерывной геометрии и дискретной структуры, что улучшает качество генерации. Вдобавок, данный метод использует специальные VAE для более точного восстановления вершин и их связности. Эксперименты показали, что LATO.2 превосходит существующие методы по качеству геометрии и связности.'}, 'en': {'title': 'Revolutionizing Mesh Generation with LATO.2', 'desc': 'The paper introduces LATO.2, a novel framework for generating meshes that separates the processes of vertex and connectivity flow. By using a shared coarse voxel scaffold, it allows for more precise vertex recovery and better handling of discrete connectivity. This factorization leads to two main benefits: the ability to generate higher-resolution meshes through part-wise generation and the capability for topology-adaptive editing. LATO.2 outperforms existing methods in terms of geometric fidelity and connectivity quality.'}}}, {'id': 'https://huggingface.co/papers/2607.07470', 'title': 'A Theory of Contrastive Learning with Natural Images', 'url': 'https://huggingface.co/papers/2607.07470', 'abstract': "Abstract  Why does contrastive learning with simple images and augmentations yield useful representations for downstream tasks? We address this question by analytically computing the optimal representation in terms of a contrastive loss for a range of basic augmentations and any image dataset with stationary statistics. We show that for certain augmentations the optimum can be attained by a CNN whose first layer filters are sinusoids, followed by a pointwise nonlinearity, global average pooling, and a final linear layer that performs partial whitening. We also show that the optimal weights in such CNNs for more complicated augmentations are still sinusoids. The frequencies of the sinusoids and their weights can be computed using a simple waterfilling algorithm given the dataset's expected power spectrum. Experiments with different image datasets and augmentations show that such CNNs trained with SGD empirically learn sinusoids in their first layer and to perform partial whitening", 'score': 1, 'issue_id': 2819, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'db9ed37d24b57485', 'github_url': '', 'github_stars': 0, 'authors': ['Antonio Torralba', 'Yair Weiss'], 'affiliations': ['CSAIL, MIT', 'School of Computer Science and Engineering, Hebrew University of Jerusalem'], 'pdf_title_img': 'assets/pdf/title_img/2607.07470.jpg', 'data': {'categories': ['#data', '#dataset', '#optimization', '#architecture', '#training'], 'emoji': '🖼️', 'ru': {'title': 'Оптимизация представлений через контрастивное обучение', 'desc': 'В этой статье рассматривается, почему контрастивное обучение с простыми изображениями и аугментациями дает полезные представ representations для последующих задач. Авторы вычисляют оптимальное представление в терминах контрастивной потери для различных базовых аугментаций и наборов изображений. Показано, что для некоторых аугментаций оптимальное представление может быть достигнуто с помощью CNN, где первый слой состоит из синусоидальных фильтров. Эксперименты подтверждают, что такие CNN, обученные с помощью SGD, эмпирически обучают синусоиды в первом слое и выполняют частичное осветление.'}, 'en': {'title': 'Unlocking Contrastive Learning with Sinusoidal Filters', 'desc': 'This paper explores why contrastive learning works well with simple images and augmentations. It analytically determines the best representation using contrastive loss for various basic augmentations. The findings reveal that a CNN can achieve optimal performance with sinusoidal filters in its first layer, followed by specific processing steps. Experiments confirm that these CNNs, when trained, learn to use sinusoidal filters and perform partial whitening effectively.'}}}, {'id': 'https://huggingface.co/papers/2607.02512', 'title': 'Program-as-Weights: A Programming Paradigm for Fuzzy Functions', 'url': 'https://huggingface.co/papers/2607.02512', 'abstract': 'Abstract Fuzzy-function programming compiles natural-language specifications into compact neural artifacts using a 4B compiler and 0.6B interpreter, achieving efficient, local execution with reduced memory usage and faster inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Many everyday programming tasks resist clean rule-based implementation, such as alerting on important log lines, repairing malformed JSON, or ranking search results by intent, and are increasingly outsourced to large language model APIs at the cost of locality, reproducibility, and price. We propose fuzzy-function programming: compiling such a function from a natural-language specification into a compact, locally-executable neural artifact. We instantiate this paradigm with Program-as-Weights (PAW), in which a 4B compiler trained on FuzzyBench, a 10M-example dataset we release, emits parameter-efficient adapters for a frozen, lightweight interpreter. A 0.6B Qwen3 interpreter executing PAW programs matches the performance of direct prompting of Qwen3-32B, while using roughly one fiftieth of the inference memory and running at 30 tokens/s on a MacBook M3. PAW reframes the foundation model from a per-input problem solver into a tool builder: invoked once per function definition, it produces a small reusable artifact whose subsequent calls per function application are cheap and offline.', 'score': 82, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'cfda8ca76e39c79f', 'github_url': '', 'github_stars': 0, 'authors': ['Wentao Zhang', 'Liliana Hotsko', 'Woojeong Kim', 'Pengyu Nie', 'Stuart Shieber', 'Yuntian Deng'], 'affiliations': ['Cornell University', 'Harvard University', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2607.02512.jpg', 'data': {'categories': ['#inference', '#training', '#data', '#dataset', '#open_source', '#optimization', '#small_models'], 'emoji': '🤖', 'ru': {'title': 'Нечеткое программирование: новая эра в создании инструментов', 'desc': "В статье представлено новое направление в программировании, называемое нечетким функциональным программированием. Оно позволяет компилировать спецификации на естественном языке в компактные нейронные артефакты с помощью компилятора и интерпретатора, обеспечивая быструю и эффективную работу с меньшими затратами памяти. Методика 'Программа как веса' преобразует решения задач, таких как обработка логов или ранжирование, в локально исполняемые артефакты. Это открывает новые возможности для создания инструментов с возможностью повторного использования без необходимости постоянного обращения к большим языковым моделям (LLM)."}, 'en': {'title': 'Transforming Natural Language into Efficient Neural Tools', 'desc': 'This paper introduces fuzzy-function programming, which transforms natural language specifications into compact neural models for efficient execution. It utilizes a 4B compiler and a 0.6B interpreter to create parameter-efficient adapters that reduce memory usage and enhance inference speed. The proposed Program-as-Weights (PAW) framework allows for the generation of reusable artifacts that can be executed locally, addressing common programming tasks that are difficult to implement with traditional rule-based methods. By shifting the focus from solving individual problems to building tools, PAW enables more efficient and cost-effective programming solutions.'}}}, {'id': 'https://huggingface.co/papers/2607.02255', 'title': 'AgenticSTS: A Bounded-Memory Testbed for Long-Horizon LLM Agents', 'url': 'https://huggingface.co/papers/2607.02255', 'abstract': 'Abstract A bounded contract approach for long-horizon LLM agents uses typed retrieval to assemble fresh prompts, enabling isolated analysis of memory components and demonstrating improved performance in complex decision-making tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Memory for a long-horizon LLM agent is a contract about what each future decision is allowed to see. The simplest contract appends past observations, tool calls, and reflections to every prompt, which makes prior context easy to access but also turns it into a jumbled mixture in which the effect of any single memory component is hard to isolate. We introduce and instrument an alternative bounded contract: every decision is made from a fresh user message assembled by typed retrieval, with no raw cross-decision transcript appended. The prompt thus stays bounded across runs of any length, and any single layer can be ablated in isolation. We instantiate the contract in Slay the Spire 2, a closed-rule stochastic deck-building game whose runs require hundreds of tactical and strategic decisions. A public online benchmark of frontier LLMs on the same game reports zero wins at the lowest difficulty across five configurations, and the developer-reported human win rate at the same difficulty is 16%; the task is hard but not saturated. Within our harness, a fixed-A0 ablation shows the largest observed difference when triggered strategic skills are enabled: the no-store baseline wins 3/10 games and adding the skill layer 6/10. At this sample size the comparison is directional rather than statistically decisive (Fisher exact p\\approx0.37); a cross-backbone probe and public accumulating-context baselines are reported as operational comparisons rather than controlled tests of the contract variable itself. We release a reproducible testbed: 298 completed trajectories with condition tags, frozen memory/skill snapshots, prompt records, and analysis scripts -- an agent design and a validated, reusable methodology for studying how explicit memory layers shape long-horizon LLM-agent decisions.', 'score': 46, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'ed0046b1e55cf224', 'github_url': '', 'github_stars': 0, 'authors': ['Xiangchen Cheng', 'Yunwei Jiang', 'Jianwen Sun', 'Zizhen Li', 'Chuanhao Li', 'Xiangcheng Cao', 'Yihao Liu', 'Fanrui Zhang', 'Li Jin', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab', 'Nankai University', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.02255.jpg', 'data': {'categories': ['#agent_memory', '#benchmark', '#retrieval', '#games', '#agents', '#memory', '#session_memory'], 'emoji': '🧠', 'ru': {'title': 'Эффективные контракты для агентов LLM с долгосрочной памятью', 'desc': 'Статья предлагает новый подход к созданию агентов LLM с длительным горизонтом принятия решений, используя типизированный поиск для составления свежих подсказок. Это позволяет изолировать анализ компонентов памяти и улучшает результаты в сложных задачах. В отличие от традиционных методов, где предыдущий контекст смешивается, авторы предлагают использовать свежие сообщения от пользователя без добавления старых данных в каждую подсказку. Метод был протестирован в игре Slay the Spire 2, и показал значительное увеличение выигрышной ставки при активации стратегических навыков.'}, 'en': {'title': 'Enhancing LLM Decision-Making with Bounded Contracts', 'desc': 'This paper presents a new method for improving long-horizon decision-making in large language model (LLM) agents by using a bounded contract approach. It focuses on typed retrieval to create fresh prompts, which helps in isolating the effects of different memory components. The method is tested in a complex game environment, Slay the Spire 2, where it shows improved performance compared to traditional methods. The authors provide a reproducible testbed for further research on how explicit memory layers influence LLM-agent decisions.'}}}, {'id': 'https://huggingface.co/papers/2607.02440', 'title': 'EvoPolicyGym: Evaluating Autonomous Policy Evolution in Interactive Environments', 'url': 'https://huggingface.co/papers/2607.02440', 'abstract': 'Abstract Autonomous agents evaluate policy improvement through iterative editing within fixed budgets, revealing that successful policy evolution requires both task-specific mechanisms and feedback-constrained refinement.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Autonomous agents are increasingly expected to improve executable policies through feedback, yet existing evaluations often collapse this process into a final score or confound it with open-ended software-engineering progress. We introduce Autonomous Policy Evolution, a controlled evaluation setting in which a harness-model agent repeatedly edits an executable policy system under a fixed interaction budget. We instantiate this setting in EvoPolicyGym, a benchmark built from compact interactive RL environments that evaluates how agents iteratively improve explored policies. On the EvoPolicyGym suite, GPT-5.5 achieves the strongest aggregate rank score and top-two performance on all 16 environments. Beyond leaderboard results, EvoPolicyGym also provides trajectory-level diagnostics that distinguish how agents allocate budget, convert feedback into parametric tuning. These analyses show that strong autonomous policy evolution depends not only on isolated task wins, but on discovering task-appropriate mechanisms and refining policies under bounded feedback.', 'score': 43, 'issue_id': 2756, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'cbc65d074c4a6f68', 'github_url': '', 'github_stars': 0, 'authors': ['Zhilin Wang', 'Han Song', 'Runzhe Zhan', 'Jusen Du', 'Jiacheng Chen', 'Tianle Li', 'Qingyu Yin', 'Yulun Wu', 'Zhennan Shen', 'Tong Zhu', 'Yanshu Li', 'Guanjie Chen', 'Derek F. Wong', 'Yafu Li', 'Yu Cheng', 'Yang Yang'], 'affiliations': ['Brown University', 'Shanghai Jiao Tong University', 'Soochow University', 'The Chinese University of Hong Kong', 'Tsinghua University', 'University of Macau', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02440.jpg', 'data': {'categories': ['#rl', '#benchmark', '#games', '#agi', '#agents', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Эволюция Политики для Автономных Агентов', 'desc': "Статья предлагает новый подход к оценке развития автономных агентов с использованием методов машинного обучения. В рамках этой работы введено понятие 'Автономная Эволюция Политики', где агенты улучшают свои действия, получая обратную связь в условиях фиксированного бюджета взаимодействия. Исследование проводилось на платформе EvoPolicyGym, которая позволяет оценивать, как агенты итеративно улучшают свои стратегии в разных средах. Результаты показывают, что успешная эволюция политики зависит от правильного выбора механизмов и умения обрабатывать обратную связь."}, 'en': {'title': 'Iterative Policy Improvement through Feedback and Refinement', 'desc': 'This paper presents a method for Autonomous Policy Evolution, where agents iteratively improve their policies within a set budget of interactions. It highlights the importance of task-specific mechanisms and the need for feedback-constrained refinement in policy development. The authors introduce the EvoPolicyGym, a benchmark that allows for controlled evaluations of how agents enhance their policies in various environments. Results show that effective policy evolution relies on both achieving task-specific goals and refining strategies base
