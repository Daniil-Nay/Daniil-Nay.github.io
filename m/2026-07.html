se key-value outer product with sparse reads and writes to a large explicit memory. We show that, under an isoFLOP constraint and with an identical number of parameters, a higher state memory capacity significantly improves performance on in-context learning and long-context retrieval tasks. Moreover, by learning the initial state of the SDM memory and therefore using it as a parametric memory, we show that the model further improves on a wide range of common-knowledge and reasoning tasks.', 'score': 4, 'issue_id': 2785, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'e4f9d4baa623c3ea', 'github_url': '', 'github_stars': 0, 'authors': ['Loïc Cabannes', 'Pierre-Emmanuel Mazaré', 'Gergely Szilvasy', 'Matthijs Douze', 'Maria Lomeli', 'Ilze Amanda Auzina', 'Justin Carpentier', 'Gabriel Synnaeve', 'Hervé Jégou'], 'affiliations': ['Inria Paris & ENS-PSL University', 'Meta FAIR', 'University of Tübingen'], 'pdf_title_img': 'assets/pdf/title_img/2607.07386.jpg', 'data': {'categories': ['#retrieval', '#architecture', '#long_context', '#memory', '#session_memory', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Новый подход к обучению длинного контекста с помощью SDM', 'desc': 'Статья представляет архитектуру Sparse Delta Memory (SDM), которая увеличивает ёмкость скрытого состояния в линейных RNN с использованием разреженной адресации. Это позволяет улучшить обучение и извлечение информации из длинного контекста, сохраняя при этом вычислительную эффективность. SDM заменяет плотный ключ-значение на разреженные операции чтения и записи в большую явную память. В результате, при одинаковом количестве параметров, увеличение ёмкости памяти значительно улучшает результаты задач по обучению и извлечению информации в контексте.'}, 'en': {'title': 'Boosting Long-Context Learning with Sparse Delta Memory', 'desc': 'The paper introduces Sparse Delta Memory (SDM), an advanced architecture that enhances gated linear RNNs by incorporating sparse addressing to significantly boost hidden state capacity. This improvement allows for better long-context learning and retrieval while keeping computational efficiency in check. Unlike traditional linear attention models, which struggle with long-context recall, SDM achieves higher performance without increasing the number of floating-point operations (FLOPs). Additionally, by utilizing a learned initial state as a parametric memory, SDM excels in various common-knowledge and reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.06838', 'title': 'WildCity: A Real-World City-Scale Testbed for Rendering, Simulation, and Spatial Intelligence', 'url': 'https://huggingface.co/papers/2607.06838', 'abstract': 'Abstract WildCity presents a large-scale multimodal dataset for urban navigation and spatial representation, enabling research into AI systems that can perceive and reason about city-scale environments similar to human cognitive capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Humans can navigate an unfamiliar city and gradually form a coherent spatial mental map spanning tens of square kilometers. Can AI build spatial representations at a comparable scale? Although recent foundation models have advanced scene reconstruction and embodied intelligence, scaling to entire cities remains an open challenge, primarily due to the lack of city-scale data. To bridge the gap, we introduce WildCity, a real-world multimodal dataset collected by autonomous fleets traversing complex urban environments. Our dataset includes 18 trajectories, each averaging 83.7 kilometers in length, and preserves the core challenges of in-the-wild perception, e.g., dynamic objects, lighting variations, and imperfect camera poses. We further establish an urban-tailored reconstruction baseline and convert the reconstructed environments into a closed-loop simulator. Beyond the dataset and baseline, we systematically analyze the key challenges on the path to simulation-ready urban digital twins: scalability, extrapolation, and uncertainty. Ultimately, WildCity aims to catalyze progress not only in city-scale rendering, but more broadly in the pursuit of AI that can perceive, remember, and reason across space at a scale comparable to human cognition. Project page: https://han-xiangyu.github.io/Wild-City/', 'score': 4, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '9c6125052d8526f6', 'github_url': '', 'github_stars': 0, 'authors': ['Xiangyu Han', 'Mengyu Yang', 'Jiaqi Li', 'Bowen Chang', 'Ziyu Chen', 'Hexu Zhao', 'Rahul Kumar Agrawal', 'Anthony Rodriguez', 'Fiona Hua', 'Marco Pavone', 'Chen Feng', 'Yiming Li'], 'affiliations': ['May Mobility, Ann Arbor, MI, USA', 'NVIDIA, Santa Clara, CA, USA', 'New York University, New York, NY, USA', 'Stanford University, Stanford, CA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.06838.jpg', 'data': {'categories': ['#reasoning', '#agents', '#dataset', '#survey', '#multimodal'], 'emoji': '🏙️', 'ru': {'title': 'Создание цифровых двойников городов с помощью AI', 'desc': 'Статья представляет датасет WildCity, который был создан для исследования навигации и пространственного представления в городских условиях. Датасет включает в себя 18 маршрутов, каждый из которых в среднем составляет 83.7 километра и отражает сложности восприятия в реальных условиях. Авторы также предлагают базовый метод реконструкции городского окружения и обсуждают ключевые проблемы, такие как масштабируемость и неопределенность. Целью WildCity является продвижение вперед в области создания цифровых двойников городов и разработки AI, способного воспринимать и размышлять о пространстве на уровне, сопоставимом с человеческим восприятием.'}, 'en': {'title': 'Navigating Cities: Bridging AI and Human Spatial Understanding', 'desc': 'WildCity introduces a large dataset designed for urban navigation and spatial understanding, allowing AI to learn how to perceive city environments like humans do. It consists of 18 long trajectories collected by autonomous vehicles, capturing real-world challenges such as moving objects and varying light conditions. The dataset aims to help AI systems build spatial representations of entire cities, addressing the current limitations in city-scale data. Additionally, it provides a baseline for urban reconstruction and explores key challenges in creating accurate digital twins of urban spaces.'}}}, {'id': 'https://huggingface.co/papers/2606.30111', 'title': 'Automating the Design of Embodied Agent Architectures', 'url': 'https://huggingface.co/papers/2606.30111', 'abstract': 'Abstract Automated agent architecture search demonstrates potential for improving embodied agent performance while revealing challenges related to optimization signals, local optima, and credit assignment in simulation-based training.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Embodied agents are typically built as hand-designed compositions of perception, memory, planning, and action modules. This modularity exposes a large architectural design space, but current systems still rely on researcher intuition to choose where information is stored, how observations are processed, and how model calls are connected. Agent Architecture Search (AAS) automates such design for text-domain agents, but has not been systematically evaluated on perceptual embodied agents through simulator rollouts. We study this transfer. We introduce AgentCanvas, a typed-graph runtime that hosts embodied executors as editable node-and-wire programs with simulator-aware execution and episode-level logs, and KDLoop, a coding-agent search procedure that cycles through proposal, critique, experiment, and distillation, with triggered reflection after stalls. We evaluate three AAS variants across four embodied executors spanning vision-language navigation, embodied question answering, and language-conditioned manipulation. The resulting 3x4 matrix shows that architecture-level search can produce deployable and directional success-rate gains on embodied tasks, while one apparent high-scoring candidate is rejected as leak-bearing. At the same time, the experiments expose constraints that are muted in text-domain AAS: optimization signals can be masked by rollout noise, search can become trapped in local edit basins, and episode-level credit assignment only partially emerges even when detailed logs are available. These results characterize both the promise and the current limits of automated architecture search for embodied agents.', 'score': 4, 'issue_id': 2784, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'd5bfe9e24f2d6b0b', 'github_url': '', 'github_stars': 0, 'authors': ['Jian Zhou', 'Sihao Lin', 'Jin Li', 'Shuai Fu', 'Gengze Zhou', 'Qi Wu'], 'affiliations': ['Australian Institute for Machine Learning, University of Adelaide, SA, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2606.30111.jpg', 'data': {'categories': ['#transfer_learning', '#training', '#agents', '#agent_memory', '#architecture', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Автоматизированный поиск архитектур для встроенных агентов', 'desc': 'В данной статье рассматривается автоматизированный поиск архитектур агентов, что может улучшить производительность встроенных агентов. Исследуются проблемы, связанные с сигналами оптимизации, локальными минимумами и назначением заслуг в обучении с использованием симуляций. Авторы представляют AgentCanvas, среду для редактируемых программ с учетом симуляторов, и KDLoop, процедуру поиска, которая включает предложения, критику, эксперименты и дистилляцию. Результаты показывают, что поиск на уровне архитектуры может повысить успешность выполнения задач, однако также выявляют ограничения, которые отсутствуют в текстовых задачах.'}, 'en': {'title': 'Automating Agent Design for Better Performance', 'desc': 'This paper explores the use of automated agent architecture search (AAS) to enhance the performance of embodied agents, which are systems that interact with the physical world. The authors introduce AgentCanvas, a framework that allows for the flexible design of agent architectures, and KDLoop, a method for iteratively improving these designs through experimentation and feedback. The study evaluates various AAS approaches on tasks like vision-language navigation and embodied question answering, revealing both successes and challenges in optimization and credit assignment. Ultimately, the findings highlight the potential benefits of AAS while also addressing the limitations faced in real-world applications compared to text-based agents.'}}}, {'id': 'https://huggingface.co/papers/2607.07508', 'title': 'Single-Rollout Asynchronous Optimization for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.07508', 'abstract': 'Abstract Asynchronous reinforcement learning with single-rollout optimization addresses stability issues in LLM training for complex tasks, outperforming existing methods in coding and reasoning benchmarks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning (RL) is becoming increasingly important for post-training large language models (LLMs). Previous RL pipelines for LLMs were mostly synchronous and batch-interleaved, which is inefficient for long-horizon agentic tasks. Recently, asynchronous RL has emerged as a more efficient alternative by updating the model as rollouts arrive. However, existing asynchronous RL systems often emphasize throughput, while leaving training stability and task effectiveness largely underexplored. For example, a key challenge is that group-wise sampling in the widely-used GRPO framework does not naturally fit asynchronous agentic training. In this paper, we present Single-rollout Asynchronous Optimization (SAO) to address the stability and off-policy challenges in asynchronous RL. To reduce off-policy effects and improve generalization, we replace group-wise sampling with single-rollout sampling, that is, using one rollout per prompt. We further improve this single-rollout strategy with practical value-model training designs. To improve optimization stability, we introduce a strict double-side token-level clipping strategy. SAO is able to train stably for one thousand steps and consistently outperform GRPO and its variants on agentic coding and reasoning benchmarks, such as SWE-Bench Verified, BeyondAIME, and IMOAnswerBench. We also demonstrate that single-rollout RL is particularly effective in a simulated online learning setting, where the model must adapt to changing evolving environments. To this end, SAO is successfully deployed in the agentic RL pipeline for training the open GLM-5.2 model (750B-A40B).', 'score': 3, 'issue_id': 2785, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'cdd9cf0fdd089529', 'github_url': '', 'github_stars': 0, 'authors': ['Zhenyu Hou', 'Yujiang Li', 'Jie Tang', 'Yuxiao Dong'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.07508.jpg', 'data': {'categories': ['#training', '#optimization', '#agi', '#games', '#benchmark', '#agents', '#rl', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Стабильное обучение крупных языковых моделей с помощью SAO', 'desc': 'В статье рассматривается метод асинхронного обучения с подкреплением (RL) для крупных языковых моделей (LLM), который решает проблемы стабильности при обучении на сложных задачах. Предложенный метод, называемый Single-rollout Asynchronous Optimization (SAO), использует индивидуальные прогоны для улучшения генерализации и стабильности обучения. Это позволяет модели эффективно обновляться по мере поступления данных, улучшая результаты по сравнению с традиционными методами. Кроме того, SAO успешно применяется в симулированной настройке онлайн-обучения, что делает его особенно полезным для адаптации к изменяющимся условиям.'}, 'en': {'title': 'Stability Meets Efficiency in Asynchronous RL for LLMs', 'desc': 'This paper introduces Single-rollout Asynchronous Optimization (SAO) to enhance the stability and effectiveness of asynchronous reinforcement learning (RL) for large language models (LLMs). Traditional RL methods often struggle with stability during training, especially for complex tasks, but SAO improves this by using single-rollout sampling instead of group-wise sampling. The authors also implement a double-side token-level clipping strategy to further stabilize optimization. As a result, SAO outperforms existing methods on various coding and reasoning benchmarks, demonstrating its effectiveness in dynamic learning environments.'}}}, {'id': 'https://huggingface.co/papers/2607.06624', 'title': 'AgentLens: Production-Assessed Trajectory Reviews for Coding Agent Evaluation', 'url': 'https://huggingface.co/papers/2607.06624', 'abstract': 'Abstract  We present AgentLens, a production-assessed benchmark for interactive code agents. Most code-agent benchmarks reduce a run to a single bit -- did the task pass? -- but the people who actually use these agents experience the entire trajectory: how the agent follows instructions, uses its tools, verifies its own work, recovers from mistakes, and talks to them along the way. AgentLens evaluates that whole trajectory. It pairs formal verification, where an objective check exists, with LLM-written trajectory reviews and side-by-side comparisons, so that each run yields a readable explanation of why the score is what it is. This makes AgentLens useful for more than ranking models: we use it to diagnose model behavior, compare successive versions of our own agent, and catch product regressions in a nightly evaluation pipeline. We release the benchmark as open source at https://github.com/agent-lens/agent-lens-bench.', 'score': 3, 'issue_id': 2786, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '20c3194bd2576d47', 'github_url': '', 'github_stars': 0, 'authors': ['Andrey Podivilov', 'Vadim Lomshakov', 'Sergey Savin', 'Matvei Startsev', 'Roman Pozharskiy', 'Maksim Parshin', 'Sergey Nikolenko'], 'affiliations': ['Explyt', 'St. Petersburg Department of the Steklov Institute of Mathematics', 'St. Petersburg State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.06624.jpg', 'data': {'categories': ['#open_source', '#interpretability', '#benchmark', '#agent_memory', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Полный анализ работы кодовых агентов', 'desc': 'Статья представляет новый метод оценки интерактивных кодовых агентов под названием AgentLens. В отличие от традиционных методов, которые оценивают лишь итоговый результат, AgentLens анализирует весь процесс выполнения задания, включая взаимодействие агента с инструментами и исправление ошибок. Такой подход позволяет не только ранжировать модели, но и диагностировать поведение агентов и отслеживать изменения в их производительности. Бенчмарк будет доступен в открытом доступе для использования и анализа.'}, 'en': {'title': 'Evaluating the Full Journey of Code Agents', 'desc': "AgentLens is a new benchmark designed to evaluate interactive code agents by assessing their entire performance trajectory rather than just a pass/fail outcome. It combines formal verification with reviews generated by large language models (LLMs) to provide detailed explanations of the agent's actions and decisions. This comprehensive evaluation helps in diagnosing model behavior, comparing different versions of the agent, and identifying regressions in product performance. By making this benchmark open source, it encourages broader use and improvement in the field of code agents."}}}, {'id': 'https://huggingface.co/papers/2607.03723', 'title': 'OmniTacTune: Policy-Agnostic Real-World RL for Tactile Residual Adaptation of Visual Policies', 'url': 'https://huggingface.co/papers/2607.03723', 'abstract': 'Abstract OmniTacTune enables efficient adaptation of tactile feedback to visual robot policies through a two-stage reinforcement learning approach that improves success rates in contact-rich manipulation tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Visual policies learned from human videos, teleoperation, and robot demonstrations offer scalable motion priors, but often fail in contact-rich manipulation, where success significantly depends on local force and contact geometry. Tactile sensing provides these complementary signals, yet tactile data remain costly to collect and hard to generalize across sensors, robots, and tasks. We introduce OmniTacTune, a policy-agnostic real-world RL pipeline that adapts tactile feedback to pretrained visual policies through residual correction. OmniTacTune uses a two-stage design: it first bootstraps tactile-aware learning from autonomous base-policy rollouts, then learns a lightweight tactile residual policy through online interaction. Extensive experiments show that OmniTacTune generalizes across diverse contact-rich tasks, visual base policies, and tactile representations. Across four real-world contact-rich tasks, it improves visual base policies from 5-40% success to 85-100% within 40-80 minutes, demonstrating an efficient path for adapting tactile feedback to scalable visual robot policies. Project page: https://colinyu1.github.io/omnitactune-site/', 'score': 3, 'issue_id': 2787, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '98e8fb1861ad9fdc', 'github_url': '', 'github_stars': 0, 'authors': ['Kelin Yu', 'Haode Zhang', 'Harish Ravichandar', 'Yunhai Han', 'Ruohan Gao'], 'affiliations': ['Georgia Institute of Technology', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2607.03723.jpg', 'data': {'categories': ['#transfer_learning', '#training', '#robotics', '#optimization', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Эффективная адаптация тактильной обратной связи для роботов', 'desc': 'Статья представляется метод OmniTacTune, который улучшает адаптацию тактильных сигналов для визуальных политик роботов с помощью двухступенчатого подхода обучения с подкреплением. Этот метод помогает справляться с задачами манипуляции, где контакт и сила играют важную роль. OmniTacTune использует предварительно обученные визуальные политики и адаптирует их с помощью тактильной обратной связи, что значительно повышает успех выполнения задач. Эксперименты подтвердили, что метод способен улучшать результаты работы роботов в условиях интенсивного контакта.'}, 'en': {'title': 'Enhancing Robot Manipulation with Tactile Feedback', 'desc': "OmniTacTune is a method that helps robots improve their ability to handle tasks that require both touch and vision. It uses a two-stage reinforcement learning approach to adapt tactile feedback to existing visual policies, making robots better at manipulating objects. The first stage involves learning from previous robot actions, while the second stage fine-tunes the robot's responses based on real-time tactile data. This approach has shown significant improvements in task success rates, demonstrating its effectiveness in diverse contact-rich environments."}}}, {'id': 'https://huggingface.co/papers/2607.04939', 'title': 'Teaching LLMs a Low-Resource Language: Enhancing Code Completion in Pharo', 'url': 'https://huggingface.co/papers/2607.04939', 'abstract': "Abstract Large language models can be adapted for low-resource programming languages through specialized training pipelines and benchmarks, achieving superior code completion performance compared to general-purpose models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large Language Models (LLMs) unlocked new possibilities in automated code writing, becoming the backbone of most code completion tools. While LLMs excel in mainstream languages, they often lack support for the so-called low-resource languages where training data is scarce. As a result, these languages lag behind in the quality of code completion tooling available to their communities. A concrete example is Pharo, a Smalltalk-inspired language whose IDE currently offers only single-token completion. In this work, we report on our experience bringing LLM-based code completion to Pharo. First, we describe an end-to-end pipeline that combines Pharo-specific data curation, continued pre-training and fine-tuning of open code LLMs. Second, we introduce a set of Pharo code completion benchmarks designed to evaluate whether models (i) learn Pharo's syntax and (ii) accurately complete masked Pharo code from real-world GitHub repositories. Third, we show empirically that Pharo-specialized models substantially outperform their original base checkpoints and also exceed the accuracy of substantially larger code LLMs on Pharo completion. Overall, our case study demonstrates the feasibility of bringing strong LLM-based code completion to low-resource programming languages, with models small enough to provide ``real-time'' in-IDE support.", 'score': 2, 'issue_id': 2784, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'e2852eaacf4174d7', 'github_url': '', 'github_stars': 0, 'authors': ['Kilian Kier', 'Alessandro Giagnorio', 'Omar AbedelKader', 'Oleksandr Zaitsev', 'Robert Peharz', 'Romain Robbes', 'Gabriele Bavota', 'Stéphane Ducasse'], 'affiliations': ['CIRAD, UMR SENS', 'CNRS, University of Bordeaux Bordeaux INP, LaBRI, UMR5800', 'Graz University of Technology', 'Graz University of Technology and Lifeware SA', 'Software Institute USI Università della Svizzera italiana', 'Univ. Lille, Inria, CNRS, Centrale Lille UMR 9189 CRIStAL'], 'pdf_title_img': 'assets/pdf/title_img/2607.04939.jpg', 'data': {'categories': ['#data', '#open_source', '#benchmark', '#training', '#small_models', '#dataset', '#low_resource'], 'emoji': '💻', 'ru': {'title': 'Улучшение автозавершения кода для языков с ограниченными ресурсами', 'desc': 'Статья описывает, как большие языковые модели (LLMs) могут быть адаптированы для языков программирования с ограниченными ресурсами, таких как Pharo. Авторы разработали специализированный процесс обучения и тестирования для улучшения качества автоматической генерации кода. В ходе исследования они показали, что модели, адаптированные под Pharo, превосходят более крупные модели по точности завершения кода. Это открывает новые возможности для создания инструментов разработки на низкоресурсных языках.'}, 'en': {'title': 'Empowering Low-Resource Languages with Specialized LLMs', 'desc': "This paper discusses how large language models (LLMs) can be effectively adapted for low-resource programming languages, specifically focusing on Pharo. It presents a specialized training pipeline that includes data curation, continued pre-training, and fine-tuning to enhance code completion capabilities. The authors introduce benchmarks to evaluate the models' understanding of Pharo's syntax and their ability to complete code accurately. Results show that Pharo-specialized models significantly outperform general-purpose models, demonstrating the potential for improved code completion in low-resource languages."}}}, {'id': 'https://huggingface.co/papers/2607.05966', 'title': 'Imagined Rollouts are Kinematic, Not Dynamic: A Diagnosis of Long-Horizon World-Model Failure', 'url': 'https://huggingface.co/papers/2607.05966', 'abstract': "Abstract World models exhibit long-horizon failures due to kinematic rather than dynamic imagination, as demonstrated by measuring imagined kinematic-consistency error which remains flat while policy rewards collapse across friction boundaries.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Long-horizon failure in world models is conventionally attributed to compounding error, a generic framing that does not distinguish what kind of error compounds. We propose a kinematic-vs-dynamic reframing: world models tend to imagine kinematically rather than dynamically. We operationalize this as the imagined Kinematic-Consistency Error, a per-step diagnostic that measures how far a rollout departs from a closed-form kinematic null, paired with a perturbation protocol that tests whether iKCE responds when physical conditions cross a regime boundary. We instantiate the diagnostic on a released DreamerV3 checkpoint trained on DMC walker-walk, where imagined iKCE runs roughly two orders of magnitude above that of matched real-physics rollouts. Across a friction sweep that crosses the gait-collapse boundary, the model's iKCE stays statistically flat even as the trained policy's reward collapses through the same range, providing the kinematic-not-dynamic signature. The diagnostic distinguishes kinematic from dynamic imagination at horizons longer than the embodiment's gait period.", 'score': 1, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'c4ab3b0fb38f5a90', 'github_url': '', 'github_stars': 0, 'authors': ['Finn Rasmus Schäfer', 'Korbinian Moller', 'Yuan Gao', 'Christian Oefinger', 'Sebastian Schmidt', 'Johannes Betz'], 'affiliations': ['Autonomous Vehicle Systems Lab Technical University of Munich, Garching b. Munchen, Germany', 'Data Analytics and Machine Learning Group Technical University of Munich, Garching b. Munchen, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2607.05966.jpg', 'data': {'categories': ['#agents', '#long_context', '#rl', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Кинематическое против динамического воображения', 'desc': 'В данной статье рассматриваются проблемы долгосрочного прогнозирования в моделях мира, которые связаны с кинематическим и динамическим воображением. Исследование показывает, что ошибка кинематической согласованности остается постоянной, в то время как вознаграждение политики падает на границах трения. Авторы предлагают новый подход к диагностике, который позволяет различить кинематическое и динамическое воображение. Проведенные эксперименты демонстрируют, что ошибка кинематической согласованности значительно выше у моделей, чем у реальных физических процессоров.'}, 'en': {'title': 'Understanding Kinematic vs. Dynamic Imagination in World Models', 'desc': "This paper discusses the limitations of world models in long-horizon predictions, specifically focusing on the difference between kinematic and dynamic imagination. It introduces the concept of imagined Kinematic-Consistency Error (iKCE) to measure how accurately a model's predictions align with kinematic principles. The authors demonstrate that while the model's rewards decline when facing changes in physical conditions, the iKCE remains constant, indicating a failure to adapt dynamically. This distinction helps to better understand the types of errors that compound in world models over time."}}}, {'id': 'https://huggingface.co/papers/2607.06309', 'title': 'Token-Based Dual-view Fusion and Adaptation of Large Vision Models for Breast Cancer Classification', 'url': 'https://huggingface.co/papers/2607.06309', 'abstract': 'Abstract A token-centric dual-view learning framework unifies prompt-based adaptation and cross-view fusion in a frozen vision transformer to improve breast cancer classification from mammography images.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Accurate breast cancer classification from mammography requires effective integration of complementary information from craniocaudal (CC) and mediolateral oblique (MLO) views, which provide a more complete characterization of breast abnormalities. However, existing multi-view learning approaches typically rely on feature-level aggregation or single-stage cross-attention, which can entangle view-specific and shared representations and restrict interaction to limited network depths. To address these limitations, we propose a token-centric dual-view learning framework that unifies prompt-based adaptation and cross-view fusion within a frozen vision transformer backbone. The framework reformulates inter-view interaction as structured token-level communication, where dedicated fusion tokens explicitly encode bidirectional information exchange between CC and MLO views via cross-attention, serving as intermediate carriers of cross-view dependencies rather than relying on direct feature fusion. Unlike conventional methods that apply fusion at a single layer, fusion modules are inserted at multiple transformer depths, enabling progressive and repeated interaction across the encoder hierarchy. Fusion tokens are reintegrated into the token sequence and refined by subsequent transformer layers, facilitating hierarchical propagation of complementary information while preserving view-specific structure. Experiments on VinDr-Mammo and CMMD datasets demonstrate consistent improvements over linear probing, prompt-only adaptation, and conventional fusion baselines. On the VinDr-Mammo BI-RADS classification task, the framework achieves 50.40% F1-score and 0.8090 AUC, including a 0.10 AUC improvement over a dual-view fusion baseline in the binary setting. Ablation studies further validate the effectiveness of token-based fusion and multi-depth interaction design.', 'score': 0, 'issue_id': 2787, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'a6ff81775bd26fe1', 'github_url': '', 'github_stars': 0, 'authors': ['Aysan Ghayouri Pirsoltan', 'Shima Babakordi', 'Mohammad Reza Mohammadi'], 'affiliations': ['School of Computer Engineering, Iran University of Science and Technology, Tehran, Iran'], 'pdf_title_img': 'assets/pdf/title_img/2607.06309.jpg', 'data': {'categories': ['#multimodal', '#training', '#optimization', '#healthcare', '#dataset'], 'emoji': '🩺', 'ru': {'title': 'НоваяEra в классификации рака молочной железы', 'desc': 'В статье предлагается новая структура обучения, основанная на токенах, для улучшения классификации рака молочной железы по маммографиям. Она объединяет адаптацию на основе подсказок и слияние данных с разных ракурсов, что позволяет более эффективно интегрировать информацию с видов CC и MLO. Это достигается за счет токенов слияния, которые кодируют двусторонний обмен информацией между двумя видами, вместо простой агрегации на уровне признаков. Эксперименты показывают, что предложенный метод обеспечивает значительное улучшение результатов по сравнению с традиционными подходами.'}, 'en': {'title': 'Enhancing Breast Cancer Classification with Token-Centric Dual-View Learning', 'desc': 'This paper presents a novel token-centric dual-view learning framework aimed at enhancing breast cancer classification from mammography images. It integrates prompt-based adaptation and cross-view fusion within a frozen vision transformer, allowing for better interaction between craniocaudal and mediolateral oblique views. By reformulating inter-view communication as structured token-level exchanges, the framework enables more effective information sharing without entangling view-specific features. Experimental results show significant improvements in classification performance compared to traditional methods, demonstrating the advantages of multi-depth interaction and token-based fusion.'}}}, {'id': 'https://huggingface.co/papers/2607.00302', 'title': 'Wake up for Touch! Mask-isolated Tactile Alignment Learning in MLLMs', 'url': 'https://huggingface.co/papers/2607.00302', 'abstract': 'Abstract Splash is a mask-isolated tactile alignment learning framework that enables multimodal LLMs to acquire tactile sensing capabilities without sacrificing vision-language reasoning through selective parameter updating that prevents catastrophic forgetting.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Touch supplies the physical grounding needed to perceive intrinsic material properties, such as friction and compliance, that vision alone often cannot resolve. Recent efforts for equipping multimodal LLMs with this tactile sense, however, expose a zero-sum trade-off: the limited parameter budget of compact models forces a choice between acquiring the new sensory modality and preserving the established vision-language reasoning. We present Splash, a mask-isolated tactile alignment learning framework for MLLMs. Splash quantifies the significance of each pretrained parameter, and partitions the parameter space into a dormant and critical subspace. While the frozen critical subspace acts as a stable anchor to safeguard general visual knowledge, Splash updates the isolated dormant subspace to internalize tactile alignment towards LLMs. This selective, non-destructive expansion effectively prevents catastrophic forgetting and ensures non-destructive modality expansion. Extensive experiments show that Splash effectively achieves tactile reasoning without additional inference overhead in the LLM part, demonstrating state-of-the-art performance on visuo-tactile benchmarks, including SSVTP, TVL, and TacQuad, while preserving its original general-purpose capabilities.', 'score': 0, 'issue_id': 2785, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '4ca6bcfa5eb0028b', 'github_url': '', 'github_stars': 0, 'authors': ['Yoonhyung Park', 'Minji Kim', 'Sungwon Moon', 'Jiyoung Lee'], 'affiliations': ['Division of Artificial Intelligence & Software, Ewha Womans University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00302.jpg', 'data': {'categories': ['#training', '#continual_learning', '#multimodal', '#optimization'], 'emoji': '🖐️', 'ru': {'title': 'Новая эра многомодального обучения с тактильными ощущениями', 'desc': 'Splash представляет собой фреймворк обучения тактильной согласованности для многомодальных LLM, который позволяет моделям развивать тактильные способности, не жертвуя зрительно-языковыми рассуждениями. Он использует выборочное обновление параметров, предотвращая катастрофическое забвение информации. Фреймворк выделяет важность предобученных параметров и разделяет их на критическую и неактивную подпространства. Эксперименты показывают, что Splash достигает высоких результатов в тактильном рассуждении, сохраняя при этом оригинальные возможности модели без дополнительных затрат на вывод.'}, 'en': {'title': 'Enhancing LLMs with Tactile Sensing Without Sacrificing Vision', 'desc': 'The paper introduces Splash, a framework designed to enhance multimodal large language models (LLMs) with tactile sensing abilities while maintaining their vision-language reasoning. It addresses the challenge of catastrophic forgetting by selectively updating parameters in a dormant subspace, allowing the model to learn new tactile information without losing existing visual knowledge. By quantifying the importance of each parameter, Splash ensures that critical visual capabilities remain stable while integrating tactile alignment. The framework demonstrates impressive performance on visuo-tactile benchmarks, achieving state-of-the-art results without increasing inference overhead.'}}}, {'id': 'https://huggingface.co/papers/2606.29526', 'title': 'The Mirage of Optimizing Training Policies: Monotonic Inference Policies as the Real Objective for LLM Reinforcement Learning', 'url': 'https://huggingface.co/papers/2606.29526', 'abstract': 'Abstract Training-inference mismatch in reinforcement learning for large language models leads to instability, which is addressed through a new policy optimization objective and framework that ensures consistent policy improvements between training and inference phases.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning (RL) has gained growing attention in large language model (LLM) post-training, yet RL training remains fragile and can suffer from instability or collapse. One vital cause is training-inference mismatch: LLM adopts separate inference and training engines for generation efficiency and training precision, which in practice exhibits inconsistent probabilities for the same trajectories on training and inference sides, even with synchronized model parameters. This naturally induces a special type of off-policyness ever existing and poisoning the training. Prior works have made various efforts in addressing the off-policyness to stabilize the training policies under the mismatch. In this paper, we point out the objective misalignment neglected by existing works that an effective update to the policy in the training engine not necessarily ensures the improvement of the inference policy, i.e., the one used in deployment. To this end, we propose a new policy optimization objective for LLM RL, named Monotonic Inference Policy Improvement (MIPI). Following this principle, we introduce Monotonic Inference Policy Update (MIPU), a two-step LLM RL framework that constructs sampler-referenced candidate updates and selectively accepts synchronized candidates using an inference-side gap proxy. Experiments conducted on two model scales under high mismatch show that MIPU improves average reasoning performance and training stability.', 'score': 127, 'issue_id': 2770, 'pub_date': '2026-06-28', 'pub_date_card': {'ru': '28 июня', 'en': 'June 28', 'zh': '6月28日'}, 'hash': 'e04605df9c9148f1', 'github_url': '', 'github_stars': 0, 'authors': ['Jing Liang', 'Hongyao Tang', 'Yi Ma', 'Yancheng He', 'Weixun Wang', 'Xiaoyang Li', 'Ju Huang', 'Wenbo Su', 'Jinyi Liu', 'Yan Zheng', 'Jianye Hao', 'Bo Zheng'], 'affiliations': ['Alibaba', 'Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2606.29526.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#rl', '#training'], 'emoji': '📈', 'ru': {'title': 'Оптимизация политики для стабильного обучения больших языковых моделей', 'desc': 'В данной статье рассматривается проблема несоответствия между обучением и выводом в области Reinforcement Learning (RL) для больших языковых моделей (LLM). Это несоответствие приводит к нестабильности, и авторы предлагают новую цель оптимизации политики, чтобы обеспечить последовательные улучшения между этапами обучения и вывода. Вводится также двухступенчатая структура, называемая Monotonic Inference Policy Update (MIPU), которая помогает улучшить производительность вывода и стабильность обучения. Эксперименты показывают, что MIPU приводит к увеличению средней производительности рассуждений при высоком уровне несоответствия.'}, 'en': {'title': 'Stabilizing RL in LLMs with Monotonic Policy Improvements', 'desc': 'This paper addresses the instability in reinforcement learning (RL) for large language models (LLMs) caused by training-inference mismatch. The authors introduce a new policy optimization objective called Monotonic Inference Policy Improvement (MIPI) to ensure consistent policy updates between training and inference phases. They also propose a two-step framework, Monotonic Inference Policy Update (MIPU), which selectively accepts updates based on an inference-side gap proxy. Experiments demonstrate that MIPU enhances reasoning performance and stabilizes training under conditions of high mismatch.'}}}, {'id': 'https://huggingface.co/papers/2607.02501', 'title': 'Embodied.cpp: A Portable Inference Runtime of Embodied AI Models on Heterogeneous Robots', 'url': 'https://huggingface.co/papers/2607.02501', 'abstract': 'Abstract Embodied.cpp is a portable C++ runtime that enables efficient deployment of vision-language-action and world-action models across heterogeneous edge devices through modular execution layers and optimized inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Embodied AI models now span vision-language-action (VLA) models and world-action models (WAMs), but practical deployment remains fragmented across model-specific Python stacks, backend assumptions, and robot-side glue code, especially on heterogeneous edge devices. Existing inference runtimes are designed mainly for request-response serving and therefore do not satisfy the runtime contract of embodied deployment: multi-rate execution inside closed-loop control, latency-first batch-1 inference on heterogeneous hardware, and extensible embodied interfaces beyond fixed token I/O. We present Embodied.cpp, a portable C++ inference runtime for embodied models. Based on an architectural analysis of representative VLA models and WAMs, Embodied.cpp captures a shared execution path and organizes it into five layers: input adapters, sequence builders, backbone execution, head plugins, and deployment adapters. The runtime provides modular multi-rate execution, latency-first fused inference, and extensible operator and I/O support, enabling deployment across heterogeneous devices, robots, and simulators through one backend abstraction. We evaluate Embodied.cpp on two VLA models, HY-VLA and pi0.5, and on a preliminary WAM benchmark using a LingBot-VA Transformer block. The VLA deployments achieve successful closed-loop execution with 100.0% and 91.0% task success rates, respectively. The WAM benchmark reduces block memory from 312.2 MiB to 88.1 MiB. These results show that Embodied.cpp improves deployment efficiency while preserving high accuracy across diverse embodied model architectures.', 'score': 34, 'issue_id': 2770, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '0b9ba0ee6f0747df', 'github_url': '', 'github_stars': 0, 'authors': ['Ling Xu', 'Chuyu Han', 'Borui Li', 'Hao Wu', 'Shiqi Jiang', 'Ting Cao', 'Chuanyou Li', 'Sheng Zhong', 'Shuai Wang'], 'affiliations': ['Institute for AI Industry Research (AIR), Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02501.jpg', 'data': {'categories': ['#inference', '#robotics', '#games', '#architecture', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Эффективное развертывание моделей в мире действия', 'desc': 'Статья представляет Embodied.cpp, переносимый C++ рантайм, который позволяет эффективно развертывать модели, основанные на взаимодействии языка, зрения и действия на различных устройствах. Он организует выполнение в пять модульных слоев, что способствует немедленной обработке данных и гибкости для работы с разными аппаратными платформами. Embodied.cpp поддерживает многоуровневое выполнение и оптимизацию производительности, обеспечивая высокую точность выполнения задач. Это решение улучшает эффективность развертывания моделей, сохраняя при этом высокие показатели успешного выполнения.'}, 'en': {'title': 'Streamlined Deployment for Embodied AI Models', 'desc': 'Embodied.cpp is a C++ runtime designed for efficiently deploying vision-language-action (VLA) and world-action models (WAMs) on various edge devices. It addresses the challenges of fragmented deployment across different Python stacks and backend systems by providing a modular architecture with five execution layers. This runtime supports multi-rate execution and latency-optimized inference, making it suitable for real-time applications in robotics. Evaluation shows that it achieves high task success rates while significantly reducing memory usage, enhancing deployment efficiency across diverse models.'}}}, {'id': 'https://huggingface.co/papers/2607.02461', 'title': 'OrbitQuant: Data-Agnostic Quantization for Image and Video Diffusion Transformers', 'url': 'https://huggingface.co/papers/2607.02461', 'abstract': 'Abstract OrbitQuant enables efficient post-training quantization for diffusion transformers by using a normalized rotated basis that eliminates the need for recalibration across different timesteps and modalities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Diffusion transformers (DiTs) achieve state-of-the-art image and video generation, but their multi-step sampling and growing parameter count make inference expensive. Post-training quantization (PTQ) is the natural remedy, yet DiT activations shift across timesteps, prompts, and guidance branches, forcing prior methods to re-fit calibration data for every new checkpoint or modality. We present OrbitQuant, a data-agnostic weight-activation quantizer that bypasses range estimation by quantizing in a normalized, rotated basis. In this basis, a randomized permuted block-Hadamard (RPBH) rotation concentrates each coordinate around one fixed, known marginal regardless of the input, so a single Lloyd-Max codebook serves all timesteps, prompts, and layers of a given input dimension. We extend the same quantizer to weight rows offline, absorbing the rotation into the weights so that it cancels inside each linear layer and only a forward rotation on the activations remains at runtime. The same recipe transfers from image to video with no per-modality tuning. Across FLUX.1, Z-Image-Turbo, Wan 2.1, and CogVideoX, it sets the state of the art for PTQ at several low-bit settings. It also pushes PTQ of image diffusion transformers to W2A4 with usable generation quality.', 'score': 23, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'c66ee6dcac3c7333', 'github_url': '', 'github_stars': 0, 'authors': ['Donghyun Lee', 'Jitesh Chavan', 'Duy Nguyen', 'Sam Huang', 'Liming Jiang', 'Priyadarshini Panda', 'Timo Mertens', 'Saurabh Shukla'], 'affiliations': ['Cantina Labs', 'University of Illinois Urbana-Champaign', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2607.02461.jpg', 'data': {'categories': ['#inference', '#compression', '#diffusion', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Эффективная квантизация для диффузионных трансформеров', 'desc': 'Статья описывает метод OrbitQuant, который позволяет эффективно производить пост-тренировочную квантизацию диффузионных трансформеров. Этот подход устраняет необходимость в перерасчете калибровочных данных благодаря использованию нормализованного вращенного базиса. Он обеспечивает высокое качество генерации изображений и видео при низком уровне битности без дополнительной настройки для различных модальностей. OrbitQuant устанавливает новые стандарты эффективности квантизации, позволяя использовать одну и ту же кодовую книгу для всех временных шагов и размерностей.'}, 'en': {'title': 'Efficient Quantization for Diffusion Transformers', 'desc': 'OrbitQuant introduces a novel approach for post-training quantization (PTQ) of diffusion transformers, which are known for their high-quality image and video generation. By utilizing a normalized rotated basis, it eliminates the need for recalibrating quantization parameters across different timesteps and modalities. This method allows for a single codebook to be used across various inputs, significantly reducing the computational cost during inference. The results demonstrate that OrbitQuant achieves state-of-the-art performance in PTQ, enabling efficient low-bit quantization without sacrificing generation quality.'}}}, {'id': 'https://huggingface.co/papers/2607.01804', 'title': 'VLA-Corrector: Lightweight Detect-and-Correct Inference for Adaptive Action Horizon', 'url': 'https://huggingface.co/papers/2607.01804', 'abstract': 'Abstract VLA-Corrector addresses limitations of action chunking in vision-language-action models by introducing a lightweight latent-space vision monitor that enables adaptive corrective replanning, improving robustness in contact-rich manipulation tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) foundation models have recently achieved strong progress in embodied intelligence. To reduce policy-call frequency while preserving temporal coherence, most generative policies adopt an action chunk mechanism, executing multiple future actions in an open-loop manner under a fixed action horizon. However, this "predict-then-blindly-execute" paradigm sacrifices closed-loop reactivity: in contact-rich physical interactions, even small local perturbations can rapidly amplify within the open-loop blind spot, leading to compounding errors and ultimately task failure. To address this limitation, we propose VLA-Corrector, a lightweight corrective inference framework for action-chunked VLA policies. Without modifying the backbone policy weights, VLA-Corrector introduces a lightweight Latent-space Vision Monitor (LVM) that continuously compares predicted and actual visual feature evolution, enabling online detection of visual dynamics deviations. Once persistent deviation is detected, the system triggers a truncation event, discards the remaining stale actions, and invokes corrective replanning via Online Gradient Guidance (OGG). The detect-and-correct mechanism of VLA-Corrector naturally induces an event-triggered adaptive action horizon: it preserves long-horizon execution when the current chunk remains reliable, and invokes short-horizon corrective replanning when execution begins to drift. In doing so, VLA-Corrector mitigates the trade-off imposed by static horizons between execution robustness and policy-call frequency. It can be integrated into different VLA models without further retraining the VLA backbone, interrupting compounding errors while preserving much of the efficiency benefit of action chunking and substantially improving robustness in long-horizon, contact-rich robotic manipulation tasks.', 'score': 22, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'e032c4d775628526', 'github_url': '', 'github_stars': 0, 'authors': ['Yi Pan', 'Miao Pan', 'Qi Lu', 'Jiaming Huang', 'Man Zhang', 'Siteng Huang', 'Xin Li', 'Jie Zhang', 'Yongliang Shen', 'Xuhong Zhang', 'Wenqi Zhang'], 'affiliations': ['Alibaba DAMO Academy', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01804.jpg', 'data': {'categories': ['#inference', '#robotics', '#agi', '#optimization', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Коррекция действий для устойчивого взаимодействия', 'desc': 'Статья представляет модель VLA-Corrector, которая решает проблемы с механизмом разбиения действий в моделях взаимодействия между восприятием, языком и действиями. Модель использует легковесный монитор визуального пространства, который позволяет адаптивно корректировать выполнение действий и повышает устойчивость в задачах манипуляции с контактами. При обнаружении отклонений в визуальных данных система отменяет устаревшие действия и запускает процесс коррекции. Эта модель можно интегрировать в разные VLA модели без дополнительного обучения, что делает ее полезной для повышения надежности выполнения задач с долгосрочными планами.'}, 'en': {'title': 'Adaptive Correction for Robust Robotic Manipulation', 'desc': 'The VLA-Corrector improves vision-language-action models by addressing the limitations of action chunking in robotic manipulation tasks. It introduces a lightweight Latent-space Vision Monitor that detects deviations between predicted and actual visual features, allowing for adaptive corrective replanning. This system enhances robustness by enabling a dynamic action horizon, where the model can switch between long-horizon execution and short-horizon corrections based on real-time feedback. By doing so, VLA-Corrector reduces errors in contact-rich environments without needing to retrain the underlying policy models.'}}}, {'id': 'https://huggingface.co/papers/2606.28551', 'title': 'DataComp-VLM: Improved Open Datasets for Vision-Language Models', 'url': 'https://huggingface.co/papers/2606.28551', 'abstract': 'Abstract DataComp for VLMs (DCVLM) establishes a comprehensive benchmark for evaluating data curation strategies in vision-language models, demonstrating that data mixing rather than filtering significantly improves model performance at scale.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Building performant Vision-Language Models (VLMs) requires carefully curating large-scale training datasets, yet the community lacks systematic benchmarks for evaluating such curation strategies. We introduce DataComp for VLMs (DCVLM), a benchmark for controlled data-centric experiments to improve VLM training. As part of DCVLM, we collect 160 datasets spanning four data types -- image-caption pairs, multimodal interleaved documents, text-only, and instruction-tuning data -- into a corpus of 6T multimodal tokens. DCVLM allows participants to test curation strategies (filtering, mixing, formatting, sampling) across 1B-8B models and 6.25B-200B token budgets. Models are then evaluated on a carefully selected suite of up to 52 downstream benchmarks across 9 domains. We conduct extensive experiments on DCVLM and find that data mixing, not filtering, is key to a high-quality training dataset: instruction-heavy mixtures scale better than caption-heavy ones, with gains widening at larger scales. The resulting dataset, DCVLM-Baseline, enables training an 8B VLM to 63.6% accuracy on our 33-task core suite with 200B training tokens. Compared to FineVision, the state-of-the-art open VLM training dataset, this represents an improvement of +5.4pp. DCVLM and all accompanying artifacts will be made publicly available at https://www.datacomp.ai/dcvlm/.', 'score': 15, 'issue_id': 2771, 'pub_date': '2026-06-26', 'pub_date_card': {'ru': '26 июня', 'en': 'June 26', 'zh': '6月26日'}, 'hash': '11bdb8c98281e4f6', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Farina', 'Vishaal Udandarao', 'Thao Nguyen', 'Selim Kuzucu', 'Maximilian Böther', 'Andreas Hochlehnert', 'Adhiraj Ghosh', 'Marianna Nezhurina', 'Karsten Roth', 'Joschka Struber', 'Yuhui Zhang', 'Sebastian Dziadzio', 'Elaine Sui', 'Soumya Jahagirdar', 'Dhruba Ghosh', 'Hasan Hammoud', 'Thomas De Min', 'Simone Caldarella', 'Jehanzeb Mirza', 'Sedrick Keh', 'Mehdi Cherti', 'Hilde Kuehne', 'Bernt Schiele', 'Serena Yeung-Levy', 'Muhammad Ferjad Naeem', 'Federico Tombari', 'Ana Klimovic', 'Elisa Ricci', 'Matthias Bethge', 'Sewoong Oh', 'Ameya Prabhu', 'Alessio Tonioni', 'Jenia Jitsev', 'Massimiliano Mancini', 'Ludwig Schmidt', 'Nikhil Parthasarathy'], 'affiliations': ['1', '10', '11', '12', '13', '14', '15', '2', '3', '4', '5', '6', '7', '8', '9'], 'pdf_title_img': 'assets/pdf/title_img/2606.28551.jpg', 'data': {'categories': ['#open_source', '#data', '#dataset', '#benchmark', '#survey'], 'emoji': '📊', 'ru': {'title': 'Смешивание данных — ключ к эффективным VLM', 'desc': 'Статья представляет новый бенчмарк DataComp для моделей зрения-языка (VLM), который помогает оценить стратегии курации данных. Мы выяснили, что смешивание данных, а не их фильтрация, значительно улучшает производительность моделей. В рамках DCVLM было собрано 160 наборов данных, охватывающих различные типы данных, включая изображения и подписи. Результаты показали, что смеси с упором на инструкции демонстрируют лучшие результаты на больших масштабах.'}, 'en': {'title': 'Mixing Data is Key for Vision-Language Model Success', 'desc': 'The paper introduces DataComp for VLMs (DCVLM), a benchmark designed to evaluate data curation strategies for vision-language models. It highlights that mixing data, rather than filtering it, leads to better model performance, especially at larger scales. The benchmark includes a diverse collection of datasets and allows for testing various curation methods across different model sizes. The findings show that instruction-heavy data mixtures significantly enhance training outcomes, achieving notable accuracy improvements over existing datasets.'}}}, {'id': 'https://huggingface.co/papers/2606.31227', 'title': 'Securing the AI Agent: A Unified Framework for Multi-Layer Agent Red Teaming', 'url': 'https://huggingface.co/papers/2606.31227', 'abstract': 'Abstract AI-Infra-Guard is an open-source framework that addresses AI infrastructure security through layered detection paradigms spanning infrastructure, protocol, agent behavior, and model layers.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The fast growth of open-source AI infrastructure, from model serving engines and agent platforms to the Model Context Protocol (MCP) ecosystem and the language models themselves, has outpaced the security tooling available to defend it. We present AI-Infra-Guard, an open-source framework that organizes AI red teaming around a single observation: the attack surface of an AI agent is stratified across layers (infrastructure, protocol/tool, agent behavior, and model), and no single detection paradigm fits all of them. The framework therefore matches a paradigm to each layer, from deterministic rule matching over 75+ AI components and 1{,}400+ vulnerability rules, through LLM-driven agentic auditing of MCP servers and agent-skill packages and multi-turn black-box agent red teaming, to a jailbreak harness with 26+ attack operators over sixteen datasets. To our knowledge it is the only open-source framework to span all of these, including supply-chain auditing of the agent skills that increasingly extend AI agents. We release AI-Infra-Guard as open source so that layer-paradigm matching can serve as a practical foundation for agent security and a shared base for the community to build on.', 'score': 8, 'issue_id': 2771, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '75aea8d9dfa61d00', 'github_url': '', 'github_stars': 0, 'authors': ['Yong Yang', 'Xing Zheng', 'Huiyu Wu', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo', 'Bo Yang', 'Yi Zhou', 'Xiangfan Wu', 'Zonghao Ying'], 'affiliations': ['Tencent Zhuque Lab'], 'pdf_title_img': 'assets/pdf/title_img/2606.31227.jpg', 'data': {'categories': ['#agents', '#open_source', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность ИИ инфраструктуры на новом уровне', 'desc': 'AI-Infra-Guard — это открытая платформа, предназначенная для обеспечения безопасности инфраструктуры ИИ через многослойные методы обнаружения. Она анализирует безопасность на различных уровнях: инфраструктуры, протоколов, поведения агентов и моделей. Платформа сопоставляет каждый уровень с определенной парадигмой обнаружения, что позволяет более эффективно выявлять уязвимости. Мы выпустили AI-Infra-Guard как открытый код, чтобы она стала практической основой для безопасности агентов в сообществе.'}, 'en': {'title': 'Layered Defense for AI Infrastructure Security', 'desc': 'AI-Infra-Guard is an open-source framework designed to enhance the security of AI infrastructure by employing multiple detection strategies across different layers. It recognizes that the attack surface of AI agents is complex and varies across infrastructure, protocols, agent behavior, and models. The framework utilizes a combination of deterministic rule matching, LLM-driven auditing, and red teaming techniques to address vulnerabilities effectively. By providing a comprehensive approach to AI security, AI-Infra-Guard aims to serve as a foundational tool for the community to improve agent safety.'}}}, {'id': 'https://huggingface.co/papers/2607.02471', 'title': 'Interpretation-Oriented Cloud Removal via Observation-Anchored Residual Flow with Geo-Contextual Alignment', 'url': 'https://huggingface.co/papers/2607.02471', 'abstract': 'Abstract Geo-Anchored Cloud Removal framework addresses semantic drift in cloud removal by combining physically grounded residual inversion with semantic manifold constraints from vision foundation models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Cloud removal (CR) is essential for optical remote sensing, serving as a prerequisite for reliable downstream interpretation, such as semantic segmentation and change detection. However, existing CR approaches often prioritize visual realism while overlooking their impact on subsequent analytical tasks, leading to semantic drift and degraded downstream performance. To address this issue, we propose Geo-Anchored Cloud Removal (GACR), a unified framework that jointly ensures faithful reconstruction and robust interpretability. At its core, GACR incorporates Observation-Anchored Residual Flow (OAR-Flow), which reformulates CR as a physically grounded residual inversion process. By anchoring the generative trajectory to the cloudy observation rather than pure noise, OAR-Flow enables fast, stable, and faithful reconstruction. To further preserve semantic structures critical for downstream interpretation, GACR integrates Geo-Contextual Prior Alignment (GCPA) to constrain the reconstruction within a semantic manifold induced by a Vision Foundation Model (VFM). Consequently, GACR strictly maintains the spatial-semantic integrity of complex landscapes. Extensive experiments across six CR datasets and twelve downstream tasks demonstrate that GACR produces superior reconstruction quality while consistently improving downstream task accuracy. The code is available at https://github.com/wzy6055/GACR.', 'score': 4, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '492a880402889305', 'github_url': '', 'github_stars': 0, 'authors': ['Ziyao Wang', 'Maonan Wang', 'Yucheng He', 'Xianping Ma', 'Ziyi Wang', 'Hongyang Zhang', 'Yirong Cheng', 'Man-on Pun'], 'affiliations': ['Faculty of Geosciences and Engineering, Southwest Jiaotong University, Chengdu, China', 'School of Science and Engineering, The Chinese University of Hong Kong, Shenzhen, Shenzhen, China', 'Shanghai Ai Lab, Shanghai, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.02471.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#data', '#dataset', '#healthcare', '#benchmark', '#optimization'], 'emoji': '☁️', 'ru': {'title': 'Надежное удаление облаков для точного анализа изображений', 'desc': 'В статье представлена структура Geo-Anchored Cloud Removal, которая решает проблему семантического дрейфа при удалении облаков. Метод сочетает физически обоснованное восстановление остатков с семантическими ограничениями, полученными от моделей компьютерного зрения. Это обеспечивает надежное восстановление изображений и улучшает результаты последующих аналитических задач, таких как семантическая сегментация. Проведенные эксперименты показывают, что предложенная методика значительно повышает качество восстановления и точность последующих задач.'}, 'en': {'title': 'Enhancing Cloud Removal with Semantic Integrity', 'desc': 'The Geo-Anchored Cloud Removal (GACR) framework addresses the issue of semantic drift in cloud removal for optical remote sensing. It combines physically grounded residual inversion with semantic constraints from vision foundation models to ensure accurate reconstruction. By using Observation-Anchored Residual Flow (OAR-Flow), GACR anchors the reconstruction process to actual observations, enhancing stability and fidelity. This approach not only improves the quality of cloud removal but also boosts the performance of downstream tasks like semantic segmentation and change detection.'}}}, {'id': 'https://huggingface.co/papers/2607.01420', 'title': 'MultAttnAttrib: Training-Free Multimodal Attribution in Long Document Question Answering', 'url': 'https://huggingface.co/papers/2607.01420', 'abstract': "Abstract MultAttnAttrib is a training-free multimodal attribution method that locates source evidence in documents using attention heads and calibrated thresholds, achieving superior accuracy and efficiency compared to existing approaches.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct As grounded QA systems are increasingly deployed in AI assistants, accurately attributing generated answers to evidence is critical for user trust and model safety. While unimodal attributions have been explored in depth, the multimodal setting remains relatively under-researched. As a result, we introduce MultAttnAttrib, a training-free attribution-generation method that leverages a model's prefill pass, selected attention heads, and calibrated thresholds to locate source evidence within a document. To establish baseline results for the method, we introduce MultAttrEval, a complementary benchmark dataset annotated with fine-grained, ground-truth attributions for answer components grounded in multimodal source documents. To our knowledge, this is the first evaluation dataset designed specifically for multimodal attribution in long-form documents. Experimental results show that MultAttnAttrib consistently outperforms a variety of attribution-generation methods, including several strong prompting-based approaches and matches the latest frontier models such as GPT 5.4. Our method not only substantially improves attribution accuracy for both unimodal and multimodal attribution types, but also produces attributions at up to one-seventh of the direct inference latency compared to prompting on the same base model.", 'score': 4, 'issue_id': 2771, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '5ce6a6cf54c09d2e', 'github_url': '', 'github_stars': 0, 'authors': ['Dang Quang Thien Tran', 'Quang V. Dang', 'Vinamra Tyagi', 'Sai Soorya Rao Veeravalli', 'Trang Nguyen', 'Ryan A. Rossi', 'Franck Dernoncourt', 'Nedim Lipka', 'Koustava Goswami', 'Samyadeep Basu'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.01420.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#benchmark', '#dataset', '#long_context', '#prompting'], 'emoji': '🔍', 'ru': {'title': 'Новый подход к многомодальной атрибуции', 'desc': 'Статья представляет метод MultAttnAttrib, который не требует обучения и предназначен для атрибуции многомодальных данных. Он использует головы внимания и откалиброванные пороги для локализации источников информации в документах с высокой точностью и эффективностью. Авторы также вводят набор данных MultAttrEval, который предоставляет базовые результаты для оценки методов атрибуции. Экспериментальные результаты показывают значительные улучшения в точности атрибуции по сравнению с существующими подходами.'}, 'en': {'title': 'Revolutionizing Multimodal Attribution with MultAttnAttrib', 'desc': 'MultAttnAttrib is a novel method for multimodal attribution that identifies source evidence in documents without requiring training. It utilizes attention heads and calibrated thresholds to enhance both accuracy and efficiency in generating attributions. This method addresses the gap in multimodal attribution research, providing a new benchmark dataset called MultAttrEval for evaluating attribution in long-form documents. Experimental results demonstrate that MultAttnAttrib outperforms existing methods and significantly reduces inference latency.'}}}, {'id': 'https://huggingface.co/papers/2607.00052', 'title': 'AGE: Adaptive-masking for Graph Embedding in Graph Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2607.00052', 'abstract': 'Abstract GraphRAG extends RAG by incorporating graph-structured data for LLMs, addressing latent feature misalignment through Adaptive-masking for Graph Embedding (AGE) that uses Transformer-based self-supervised learning with learnable node sampling.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct GraphRAG is an extension of retrieval-augmented generation (RAG) that supports large language models (LLMs) by referring to graph-structured data as external knowledge. While this technique ideally captures intricate relationships, it often struggles with graph representations for LLMs, particularly for frozen LLMs, due to the misalignment between graph-based and text-based latent features. We tackle this issue by introducing the {\\it Adaptive-masking for Graph Embedding (AGE)}. AGE employs a Transformer in a mask-based self-supervised learning (SSL) approach. We designed the architecture similar to text embedding encoders, addressing the latent feature misalignment. In contrast to natural language texts, graphs are concise representations, and there exist {\\it key nodes} that hold dominant contextual information, which are challenging to predict from their surroundings. Masking such key nodes leads to inefficiency in the SSL process. Therefore, AGE focuses on predicting nodes apart from key nodes, utilizing a learnable node sampler. Our experimental results indicate that AGE significantly improves approaches using non-parametric search component in GraphQA tasks, achieving superior accuracy across four benchmark datasets with distinct characteristics.', 'score': 3, 'issue_id': 2771, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'cf310dfddbfbd177', 'github_url': '', 'github_stars': 0, 'authors': ['Bao Long Nguyen Huu', 'Atsushi Hashimoto'], 'affiliations': ['OMRON Corporation', 'OMRON SINIC Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2607.00052.jpg', 'data': {'categories': ['#graphs', '#benchmark', '#architecture', '#optimization', '#rag', '#retrieval'], 'emoji': '📊', 'ru': {'title': 'Улучшение обработки графовых данных для LLM', 'desc': 'Статья описывает метод GraphRAG, который расширяет подход RAG, добавляя графо-структурированные данные для больших языковых моделей (LLM). Для решения проблемы несоответствия между латентными признаками графов и текстов используется метод Adaptive-masking for Graph Embedding (AGE). AGE применяет механизмы самонаблюдения на основе трансформеров, позволяя более эффективно извлекать информацию из графов. Эксперименты показывают, что AGE значительно улучшает результаты в задачах GraphQA, обеспечивая более высокую точность на различных наборах данных.'}, 'en': {'title': 'Enhancing LLMs with Graph-Structured Data', 'desc': 'GraphRAG enhances retrieval-augmented generation (RAG) by integrating graph-structured data to improve large language models (LLMs). It addresses the challenge of latent feature misalignment through a novel method called Adaptive-masking for Graph Embedding (AGE), which utilizes Transformer-based self-supervised learning. AGE focuses on predicting non-key nodes to improve efficiency in the learning process, as key nodes often contain critical contextual information that is hard to predict. Experimental results show that AGE significantly boosts accuracy in GraphQA tasks across various benchmark datasets.'}}}, {'id': 'https://huggingface.co/papers/2607.01233', 'title': 'Measuring the Gap Between Human and LLM Research Ideas', 'url': 'https://huggingface.co/papers/2607.01233', 'abstract': 'Abstract Large language models generate research ideas that cluster around specific opportunity patterns and paradigms, diverging systematically from the broader and more diverse distributions found in human research papers.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct LLMs are increasingly used to brainstorm research ideas, but existing evaluations mostly judge individual ideas by novelty, feasibility, or expert preference. We instead ask: how far are current LLM-generated ideas from human researchers? To characterize this gap, we build a large-scale evaluation framework for ideation from high-quality human research papers. For each paper, we reverse-engineer a small set of closely related prior works that likely inspired its core idea. LLMs are then prompted to generate a new idea from the set of paper titles and summaries. We introduce a two-axis research-taste taxonomy to profile each idea by its opportunity pattern and research paradigm, and use it to quantify the divergence between human and LLM ideas. Across idea sets generated by different LLMs, we observe a consistent distributional gap: LLM ideas are disproportionately concentrated around bridge-like opportunities and synthesis methods, whereas the human paper reference distribution spreads more broadly across ways of framing gaps and constructing contributions. This result suggests that strong LLMs can produce a range of reasonable ideas, but that range remains narrower than, and systematically shifted relative to, human research taste.', 'score': 2, 'issue_id': 2773, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '3c3933b0259a1007', 'github_url': '', 'github_stars': 0, 'authors': ['Ziyu Chen', 'Yilun Zhao', 'Arman Cohan'], 'affiliations': ['University of Chicago', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01233.jpg', 'data': {'categories': ['#alignment', '#reasoning', '#multimodal', '#benchmark', '#survey'], 'emoji': '🤖', 'ru': {'title': 'Разрыв между идеями LLM и человеческими исследованиями', 'desc': 'В данной статье исследуется, как генерируемые крупными языковыми моделями (LLM) идеи для научных исследований отличаются от идей, создаваемых людьми. Мы создали масштабную оценочную платформу, чтобы изучить эти различия, анализируя множество высококачественных научных работ. Оказалось, что идеи LLM чаще сосредоточены вокруг ограниченного числа тем и методов, в то время как человеческие работы охватывают более разнообразные подходы и концепции. Это подчеркивает, что, хотя LLM могут генерировать разумные идеи, их диапазон все же меньше и систематически отличается от разнообразия научного мышления людей.'}, 'en': {'title': 'Bridging the Gap: LLMs vs. Human Research Creativity', 'desc': 'This paper explores how large language models (LLMs) generate research ideas and compares them to those produced by human researchers. It finds that LLM-generated ideas tend to cluster around specific patterns and paradigms, unlike the broader diversity seen in human research. The authors create a framework to evaluate these ideas by reverse-engineering related works and categorizing them using a two-axis taxonomy. The results indicate that while LLMs can generate reasonable ideas, their scope is narrower and systematically different from human creativity in research.'}}}, {'id': 'https://huggingface.co/papers/2606.31959', 'title': 'AnyBokeh: Physics-Guided Any-to-Any Bokeh Editing with Optical Fingerprint Transfer', 'url': 'https://huggingface.co/papers/2606.31959', 'abstract': 'Abstract AnyBokeh is a physics-guided framework for bokeh editing that estimates source blur states and transfers optical characteristics between different focus and aperture settings without requiring all-in-focus reconstruction.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Depth-of-field control is a fundamental tool in photography, yet post-capture bokeh editing from a single image remains challenging. A practical editor should handle images captured under arbitrary focus and aperture settings. Existing methods typically assume an all-in-focus input, or first recover an all-in-focus image before rendering new bokeh. Such pipelines can discard useful blur cues from the source image and propagate reconstruction artifacts into the final edit. We introduce AnyBokeh, a physics-guided framework for any-to-any bokeh editing. Instead of treating source blur merely as a degradation to be removed, AnyBokeh estimates the source blur state with a signed circle-of-confusion map and a disparity map. By modeling the linear relation between signed circle of confusion and disparity difference, AnyBokeh estimates a source-specific optical fingerprint and transfers the source optical characteristics to the desired focus and aperture setting. A generative editor conditioned on both source and target circle-of-confusion maps then performs relative blur synthesis, enabling spatially adaptive deblurring, preservation, and defocus rendering. To support physically supervised learning, we further construct a high-fidelity synthetic dataset with accurate depth, focus distance, and full EXIF metadata. Experiments on real-world benchmarks show that AnyBokeh achieves faithful and controllable editing across any-to-any bokeh editing, all-in-focus-to-bokeh rendering, and defocus deblurring, while avoiding all-in-focus reconstruction and test-time bokeh-level calibration commonly required by existing approaches. The code and dataset will be available at https://github.com/itsmag11/AnyBokeh.', 'score': 2, 'issue_id': 2772, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '622f802da3d0cec4', 'github_url': '', 'github_stars': 0, 'authors': ['Xinyu Hou', 'Xiaoming Li', 'Zongsheng Yue', 'Chen Change Loy'], 'affiliations': ['S-Lab, College of Computing & Data Science, Nanyang Technological University, Singapore, 639798'], 'pdf_title_img': 'assets/pdf/title_img/2606.31959.jpg', 'data': {'categories': ['#dataset', '#synthetic', '#optimization', '#architecture', '#benchmark', '#data'], 'emoji': '🌌', 'ru': {'title': 'Новый взгляд на редактирование боке в фотографии', 'desc': 'AnyBokeh - это фреймворк, который помогает редактировать боке в фотографиях, учитывая физические характеристики. Он оценивает состояние размытия источника и может передавать оптические свойства между разными настройками фокуса и диафрагмы без необходимости восстанавливать полное фокусное изображение. Это позволяет избежать потери полезных сигналов размытия и сохранения артефактов реконструкции. AnyBokeh предлагает новый подход к редактированию боке, предоставляя более точные и управляемые результаты.'}, 'en': {'title': 'Revolutionizing Bokeh Editing with AnyBokeh', 'desc': 'AnyBokeh is a novel framework designed for bokeh editing that leverages physics principles to estimate blur states and transfer optical characteristics between various focus and aperture settings. Unlike traditional methods that rely on all-in-focus images, AnyBokeh utilizes a signed circle-of-confusion map and a disparity map to accurately model the source blur. This approach allows for spatially adaptive deblurring and defocus rendering, preserving important blur cues from the original image. The framework is supported by a high-fidelity synthetic dataset, enabling effective training and achieving superior editing results across diverse scenarios.'}}}, {'id': 'https://huggingface.co/papers/2405.03650', 'title': 'Generated Contents Enrichment', 'url': 'https://huggingface.co/papers/2405.03650', 'abstract': 'Abstract A joint adversarial framework enriches scene graphs using graph convolutional networks to generate semantically richer visual content from sparse scene descriptions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We study Generated Contents Enrichment (GCE), a conditional image-generation task in which a sparse scene description is first enriched t
