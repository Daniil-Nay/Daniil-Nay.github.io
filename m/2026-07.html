Mixture-of-Experts. Он улучшает производительность за счет предсказания активаций экспертов и соответствующей маршрутизации запросов. В отличие от существующих маршрутизаторов, которые только балансируют нагрузку, ELDR анализирует активированные эксперты и направляет запросы к наименее загруженным работникам. Это позволяет снизить задержки и повысить эффективность работы моделей MoE.'}, 'en': {'title': 'Optimizing Expert Routing for Faster Decoding', 'desc': 'The paper introduces ELDR, a decode router designed for prefill-decode disaggregated Mixture-of-Experts (MoE) models. Unlike traditional routers that only balance load, ELDR predicts expert activations to optimize request routing based on latency. It creates an expert signature from prefill activations and uses K-means clustering to partition these signatures among decode workers. The implementation of ELDR shows a significant reduction in median time per operation (TPOT) while maintaining the quality of model outputs across various workloads.'}}}, {'id': 'https://huggingface.co/papers/2607.01071', 'title': 'MemSyco-Bench: Benchmarking Sycophancy in Agent Memory', 'url': 'https://huggingface.co/papers/2607.01071', 'abstract': "Abstract Memory plays a crucial role in LLM-based agents, but retrieved memories can cause sycophancy issues where agents over-align with users at the expense of factual accuracy, necessitating new evaluation benchmarks that assess memory's impact on reasoning and decision-making rather than just storage and retrieval.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Memory has emerged as a cornerstone of modern LLM-based agents, supporting their evolution from single-turn assistants to long-term collaborators. However, memory is not always beneficial: retrieved memories often induce a critical issue of sycophancy, causing agents to over-align with the user at the cost of factual accuracy or objective reasoning. Despite this emerging risk, existing memory benchmarks primarily evaluate whether memories are correctly stored, retrieved, or updated, while overlooking how retrieved memories influence downstream reasoning and decision-making. To bridge this gap, we propose MemSyco-Bench, a comprehensive benchmark for evaluating memory-induced sycophancy in agent systems. MemSyco-Bench measures when memory should influence a decision and how valid memory should be used. Specifically, it covers five tasks that assess whether agents can reject memory as factual evidence, respect its applicable scope, resolve conflicts between memory and objective evidence, track memory updates, and use valid memory for personalization. All related resources are collected for the community at https://github.com/XMUDeepLIT/MemSyco-Bench.", 'score': 18, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '26fab030b832d708', 'github_url': '', 'github_stars': 0, 'authors': ['Zhishang Xiang', 'Zerui Chen', 'Yunbo Tang', 'Zhimin Wei', 'Ruqin Ning', 'Yujie Lin', 'Qinggang Zhang', 'Jinsong Su'], 'affiliations': ['Jilin University', 'Xiamen University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01071.jpg', 'data': {'categories': ['#retrieval_eval', '#agent_memory', '#evaluation', '#reasoning', '#benchmark', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Память и подхалимство: новый взгляд на оценку LLM', 'desc': 'Память играет важную роль в агентах на основе LLM, однако извлеченные воспоминания могут вызывать проблему подхалимства, когда агенты чрезмерно ориентируются на пользователей в ущерб фактической точности. Эта работа поднимает вопрос о необходимости новых оценочных метрик, которые будут учитывать влияние памяти на рассуждения и принятие решений. Мы предлагаем MemSyco-Bench — комплексную методику для оценки подхалимства, вызванного памятью в агентовых системах. Методика включает пять задач, которые помогут определить, когда память должна влиять на решение и каким образом следует использовать действительную память.'}, 'en': {'title': "Evaluating Memory's Role in LLMs: Tackling Sycophancy", 'desc': "This paper discusses the importance of memory in large language model (LLM) agents and highlights a problem called sycophancy, where agents overly conform to user preferences, compromising factual accuracy. It points out that current benchmarks mainly focus on memory storage and retrieval, neglecting how memory affects reasoning and decision-making. To address this issue, the authors introduce MemSyco-Bench, a new benchmark designed to evaluate the impact of memory on sycophancy in agent systems. MemSyco-Bench includes tasks that assess an agent's ability to discern when to rely on memory, manage conflicts with objective evidence, and utilize valid memory for personalized interactions."}}}, {'id': 'https://huggingface.co/papers/2606.19271', 'title': 'TurboServe: Serving Streaming Video Generation Efficiently and Economically', 'url': 'https://huggingface.co/papers/2606.19271', 'abstract': 'Abstract TurboServe is a specialized serving system for streaming video generation that addresses session state management and dynamic resource allocation challenges through integrated scheduling, autoscaling, and migration mechanisms.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Streaming video generation is emerging as a new serving workload in which users interact with long-lived sessions that generate video progressively, chunk by chunk. Unlike offline video generation or typical LLM serving, streaming video generation must preserve session state across active and idle periods, repeatedly schedule ongoing sessions, and deliver each chunk under a tight latency target. This creates two key serving challenges in multi-user, multi-GPU environments: session duration heterogeneity, where long-running sessions make placement decisions suboptimal over time, and temporal user-demand heterogeneity, where the number of active sessions fluctuates sharply across bursts and idle periods.   We present TurboServe, the first serving system designed specifically for streaming video generation workloads. TurboServe formulates serving as an online scheduling problem that jointly coordinates session placement and GPU provisioning. Its closed-loop scheduling algorithm combines a migration-aware placement controller, which rebalances sessions across GPUs to reduce the maximum per-chunk latency, with a load-driven autoscaling controller, which adapts the GPU budget to workload variation for improved cost efficiency. To support these decisions at runtime, TurboServe implements coalesced chunk processing for batching concurrent active sessions on the same GPU, GPU-CPU offloading for session suspension and resumption, and NCCL-based GPU-GPU migration for online rebalancing. We evaluate TurboServe on real-world production traces from Shengshu Technology across multiple model sizes and GPU clusters with up to 64 NVIDIA B300 GPUs. Compared with baseline serving configurations, TurboServe reduces worst-case per-chunk latency by 37.5% and total GPU operating cost by 37.2% on average. Our code is publicly available at https://github.com/shengshu-ai/TurboServe.', 'score': 18, 'issue_id': 2749, 'pub_date': '2026-06-17', 'pub_date_card': {'ru': '17 июня', 'en': 'June 17', 'zh': '6月17日'}, 'hash': 'd6edbd79909d888a', 'github_url': '', 'github_stars': 0, 'authors': ['Youhe Jiang', 'Haoxu Wang', 'Haotong Bao', 'Kai Jiang', 'Jianfei Chen', 'Jun Zhu', 'Fangcheng Fu', 'Jintao Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'Shengshu Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2606.19271.jpg', 'data': {'categories': ['#optimization', '#inference', '#open_source', '#session_memory', '#agents'], 'emoji': '🎥', 'ru': {'title': 'Эффективное потоковое видео с TurboServe', 'desc': 'Статья описывает систему TurboServe, разработанную для потоковой генерации видео с акцентом на управление состоянием сессий и динамическим распределением ресурсов. TurboServe решает проблему оптимального размещения и выделения GPU посредством алгоритма онлайн-расписания, который учитывает продолжительность сессий и колебания пользовательского спроса. Система использует алгоритмы управления миграцией и авто-масштабирования, что позволяет снижать задержки при генерации видео до 37,5% и оптимизировать затраты на операции GPU. В результате TurboServe улучшает эффективность работы в многопользовательских и много-GPU средах.'}, 'en': {'title': 'TurboServe: Optimizing Streaming Video Generation with Smart Resource Management', 'desc': 'TurboServe is a specialized system designed for streaming video generation, focusing on managing session states and dynamically allocating resources. It addresses challenges like session duration variability and fluctuating user demand by formulating serving as an online scheduling problem. The system employs a closed-loop scheduling algorithm that optimizes session placement and GPU resource allocation to minimize latency and improve cost efficiency. Through techniques like coalesced chunk processing and GPU migration, TurboServe significantly enhances performance, reducing latency and operational costs in multi-GPU environments.'}}}, {'id': 'https://huggingface.co/papers/2607.00461', 'title': 'Multimodal Continuous Reasoning via Asymmetric Mutual Variational Learning', 'url': 'https://huggingface.co/papers/2607.00461', 'abstract': "Abstract Asymmetric Mutual Variational Learning addresses train-inference mismatch in multimodal reasoning by using bidirectional calibration to prevent answer leakage and improve latent-space stability.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Multimodal Large Language Models (MLLMs) are often constrained by a language-space bottleneck, forcing complex visual reasoning into discrete tokens which can lose perceptual nuance. A promising alternative is continuous latent reasoning, where the goal is to discover implicit reasoning pathways that bridge the multimodal query and the final answer. However, this introduces a severe train-inference mismatch: a training-time posterior, conditioned on the ground-truth answer, can exploit answer-dependent shortcuts. Standard variational training then forces the inference-time prior to mimic a posterior that has access to information unavailable at test time, leading to poor performance. To address this, we propose Asymmetric Mutual Variational Learning (AMVL), a framework that resolves this mismatch via a bidirectional calibration objective. A forward KL divergence trains the target-agnostic prior to match the posterior, while a novel reverse KL divergence simultaneously regularizes the posterior, preventing it from collapsing into inference-incompatible regions and mitigating this ``answer leakage''. We provide theoretical analysis formalizing this leakage as prior contamination and prove that our dual-KL objective reduces it. We instantiate AMVL in a latent-integrated MLLM and show that it consistently outperforms strong discrete and latent-reasoning baselines, improving the average score on the complex BLINK benchmark by +10.83 and achieving gains of up to +32.00 on individual reasoning tasks, with analyses confirming improved latent-space stability.", 'score': 16, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'adf0eb47433b863b', 'github_url': '', 'github_stars': 0, 'authors': ['Shijie Li', 'Yilin Gao', 'Siyuan Yang', 'Tieyuan Chen', 'Chaofan Gan', 'Zhihao He', 'Zicheng Zhao', 'Yuyu Guo', 'Weiyao Lin', 'Hang Yu'], 'affiliations': ['Ant Group', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00461.jpg', 'data': {'categories': ['#benchmark', '#training', '#optimization', '#architecture', '#reasoning', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Решение проблемы несоответствия в многомодальном обучении', 'desc': 'В статье рассматривается проблема несоответствия между обучением и инференцией в многомодальном рассуждении и предлагается метод Asymmetric Mutual Variational Learning (AMVL). Данный метод использует двустороннюю калибровку для предотвращения утечек ответов и улучшения стабильности скрытого пространства. Актуально использовать непрерывное латентное рассуждение, что позволяет находить имплицитные пути рассуждения между запросом и финальным ответом. Проведенные эксперименты показывают, что AMVL значительно превосходит традиционные методы, улучшая точность на сложных задачах многомодального обучения.'}, 'en': {'title': 'Bridging the Gap: Enhancing Multimodal Reasoning with AMVL', 'desc': 'The paper introduces Asymmetric Mutual Variational Learning (AMVL) to tackle the issue of train-inference mismatch in multimodal reasoning. It uses a bidirectional calibration approach to enhance latent-space stability and prevent answer leakage during inference. By employing forward and reverse KL divergence, AMVL aligns the training posterior with the inference prior while avoiding shortcuts that could lead to poor performance. The results show that AMVL significantly improves reasoning capabilities in multimodal large language models, outperforming existing methods on various benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.00666', 'title': 'Domain Arithmetic: One-Shot VLA Adaptation under Environmental Shifts', 'url': 'https://huggingface.co/papers/2607.00666', 'abstract': 'Abstract Vision-Language-Action models can be efficiently adapted to new environments using a single demonstration through weight vector arithmetic that isolates domain-specific information via subspace alignment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) models often fail to perform the same learned tasks under environmental shifts, such as changes in camera pose and shifts to a different but similar robot (e.g., from Panda to UR5e). Adapting these models to the shifted environment (i.e., target domain) often requires training on multiple demonstrations for each task, which are costly to collect. To reduce the burden of data curation and training, we propose an analogy-based method that adapts VLA models under environmental shifts through weight vector arithmetic with domain-specific information addition, named Domain ARiThmetic (DART). Unlike prior approaches, DART requires collecting only a single demonstration, enabling efficient adaptation. To accurately isolate domain-specific information for addition, DART performs subspace alignment between singular components in weight vectors to filter out noisy components. In both simulated and real-world experiments, DART outperforms existing VLA adaptation methods in one-shot scenarios across diverse visual and embodiment shifts. Code is available at https://github.com/snumprlab/dart.', 'score': 16, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'cef66cdb6d3f45e8', 'github_url': '', 'github_stars': 0, 'authors': ['Taewook Kang', 'Taeheon Kim', 'Donghyun Shin', 'Jonghyun Choi'], 'affiliations': ['Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00666.jpg', 'data': {'categories': ['#optimization', '#dataset', '#transfer_learning', '#agents', '#training', '#data'], 'emoji': '🔧', 'ru': {'title': 'Эффективная адаптация моделей VLA с помощью одной демонстрации', 'desc': 'Модели, связывающие видение, язык и действия (VLA), могут быть эффективно адаптированы к новым условиям с помощью одной демонстрации, применяя арифметику весов для изоляции специфичной информации. В данной работе представлен метод под названием Domain ARiThmetic (DART), который позволяет адаптировать модели VLA к измененным условиям без необходимости в многократных демонстрациях. DART использует выравнивание подпространства для фильтрации ненужных компонентов в векторах весов, что улучшает точность адаптации. Проведенные эксперименты показывают, что DART превосходит существующие методы адаптации в сценариях с одним примером.'}, 'en': {'title': 'Efficient One-Shot Adaptation for VLA Models', 'desc': 'This paper introduces Domain ARiThmetic (DART), a method for adapting Vision-Language-Action (VLA) models to new environments using only a single demonstration. DART utilizes weight vector arithmetic to isolate and add domain-specific information through subspace alignment, which helps filter out noise. This approach significantly reduces the need for multiple demonstrations, making the adaptation process more efficient. Experimental results show that DART outperforms existing methods in one-shot adaptation scenarios across various visual and embodiment changes.'}}}, {'id': 'https://huggingface.co/papers/2607.01104', 'title': 'CausalMix: Data Mixture as Causal Inference for Language Model Training', 'url': 'https://huggingface.co/papers/2607.01104', 'abstract': 'Abstract CausalMix addresses limitations in LLM data mixing by formulating mixture optimization as a causal inference problem, enabling dynamic adaptation to shifting data distributions without costly retraining.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In Large Language Model (LLM) training, data mixing plays a pivotal role in determining model performance. Recent methods optimize mixture weights via proxy models, but they rely on the assumption of static data distributions. As a result, when the underlying data pool shifts, these methods require costly retraining from scratch. This limitation restricts their ability to scale seamlessly from small settings to larger data pools and model sizes. In this paper, we propose CausalMix to address this limitation by casting data mixture optimization as a causal inference problem. We formulate the statistical features of the data pool as covariates and the domain mixture as the treatment. After fitting a causal model on 512 runs of Qwen2.5-0.5B to estimate the Conditional Average Treatment Effect (CATE), we extrapolate the optimal mixture for an 800K data pool and apply it to train a 7B model. Furthermore, we successfully generalize the framework to long chain-of-thought data on Qwen3-4B-Base. By leveraging causal modeling to isolate confounding biases, CausalMix dynamically infers state-dependent optimal data mixtures. Extensive experiments show that the mixture guided by CausalMix consistently improves performance across multiple downstream tasks, outperforming RegMix and other baselines. In addition, we use the CATE Interpreter to provide visual analysis of the learned mixing strategy. Overall, CausalMix offers a causal and interpretable framework for optimizing LLM data mixtures.', 'score': 14, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '886477985019fb9a', 'github_url': '', 'github_stars': 0, 'authors': ['Zinan Tang', 'Yukun Zhang', 'Shaomian Zheng', 'Zhuoshi Pan', 'Qizhi Pei', 'Dingnan Jin', 'Jun Zhou', 'Yujun Wang', 'Biqing Huang'], 'affiliations': ['Ant Group', 'Renmin University of China', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01104.jpg', 'data': {'categories': ['#interpretability', '#optimization', '#training', '#data'], 'emoji': '🔄', 'ru': {'title': 'Динамическое смешивание данных для LLM', 'desc': 'В статье CausalMix рассматриваются ограничения традиционного подхода к смешиванию данных в обучении LLM. Авторы предлагают новый метод, который формулирует оптимизацию смешивания как задачу причинного вывода, что позволяет динамически адаптироваться к изменяющимся распределениям данных без необходимости дорогого переобучения. Это решение помогает улучшить производительность модели, особенно при работе с большими наборами данных. Эксперименты показывают, что метод CausalMix превосходит другие подходы, обеспечивая более эффективное смешивание данных.'}, 'en': {'title': 'Dynamic Data Mixing through Causal Inference', 'desc': 'CausalMix introduces a new approach to optimize data mixing in large language models (LLMs) by treating it as a causal inference problem. This method allows for dynamic adaptation to changes in data distributions without the need for expensive retraining. By estimating the Conditional Average Treatment Effect (CATE), CausalMix identifies the best data mixtures for different model sizes and tasks. The framework not only enhances performance across various applications but also provides interpretable insights into the mixing strategy used.'}}}, {'id': 'https://huggingface.co/papers/2607.00248', 'title': 'Seed2.0 Model Card: Towards Intelligence Frontier for Real-World Complexity', 'url': 'https://huggingface.co/papers/2607.00248', 'abstract': "Abstract Seed2.0 addresses complex real-world tasks by tackling long-tail knowledge and complex instruction following challenges while enhancing reasoning, visual understanding, and search capabilities through a robust evaluation framework grounded in user needs.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present Seed2.0, a model series that takes a meaningful step toward solving complex, real-world tasks. Our approach begins with identifying users' genuine needs and constructing a reliable, forward-looking evaluation system by selecting and abstracting benchmarks grounded in these needs and in realistic, complex scenarios. Guided by this evaluation system, Seed2.0 targets two persistent challenges, long-tail knowledge and complex instruction following, substantially improving the model's reliability on intricate, long-horizon tasks. Beyond these, Seed2.0 delivers world-leading reasoning intelligence, visual understanding, and search capabilities that address the most common needs of a broad user base. Through extensive real-world use cases documented in this model card, we demonstrate that Seed2.0 begins to exhibit the ability to handle initial complex real-world tasks, delivering greater value to hundreds of millions of users.", 'score': 14, 'issue_id': 2750, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '8ef18ce4811f570c', 'github_url': '', 'github_stars': 0, 'authors': ['Bytedance Seed'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.00248.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#reasoning', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Революционные решения для сложных задач!', 'desc': 'Seed2.0 представляет собой серию моделей, направленных на решение сложных реальных задач. Она учитывает длинный хвост знаний и сложность выполнения инструкций, что позволяет значительно улучшить надежность модели. Основываясь на потребностях пользователей, модель создаёт надежную систему оценки, которая помогает лучше справляться с трудными задачами. Seed2.0 обеспечивает выдающиеся возможности в области рассуждений, визуального восприятия и поиска, что способствует удовлетворению нужд широкой аудитории пользователей.'}, 'en': {'title': 'Empowering Real-World Task Solutions with Seed2.0', 'desc': 'Seed2.0 is a model series designed to tackle complex real-world tasks by addressing challenges like long-tail knowledge and complex instruction following. It focuses on understanding user needs and creating a robust evaluation framework based on realistic scenarios. This model significantly enhances reasoning, visual understanding, and search capabilities, making it more reliable for intricate tasks. Through extensive real-world applications, Seed2.0 shows promise in delivering value to a wide user base.'}}}, {'id': 'https://huggingface.co/papers/2607.01191', 'title': 'Perceive-to-Reason: Decoupling Perception and Reasoning for Fine-Grained Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.01191', 'abstract': 'Abstract A unified framework named Perceive-to-Reason (P2R) is introduced that separates visual perception from reasoning in vision-language models through a two-stage process, improving fine-grained visual reasoning performance on high-resolution images.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Fine-grained visual reasoning remains challenging for vision-language models, especially when small but critical visual cues are buried in high-resolution images. Existing approaches rely on repeated cropping or test-time visual search to introduce local evidence, but they typically do not explicitly distinguish perception from reasoning. In this paper, we propose Perceive-to-Reason (P2R), a unified framework that formulates fine-grained visual reasoning as a two-stage process: the model first localizes question-relevant evidence as a Perceiver, and then answers the question as a Reasoner based on the annotated image and cropped regions. To better align training with this decoupled formulation, we further introduce Perception-Reasoning Alternating GRPO (PRA-GRPO), a role-aware reinforcement learning strategy that alternates between perception-focused and reasoning-focused updates using only final-answer supervision. Built on top of Qwen3-VL-Instruct-2B/4B/8B, P2R consistently improves performance across model scales. In particular, P2R-4B achieves 93.2% on V-Star, 81.9% on HR-Bench-4K, and 80.5% on HR-Bench-8K, substantially outperforming its corresponding backbone. Further experiments show that the benefits of P2R extend beyond high-resolution benchmarks to broader multimodal reasoning tasks. These results suggest that explicitly decoupling perception from reasoning provides an effective framework for fine-grained visual reasoning.', 'score': 11, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '7ef72500e48a5ab2', 'github_url': '', 'github_stars': 0, 'authors': ['Hongxing Li', 'Xiufeng Huang', 'Dingming Li', 'Wenjing Jiang', 'Zixuan Wang', 'Haolei Xu', 'Hanrong Zhang', 'Haiwen Hong', 'Longtao Huang', 'Hui Xue', 'Weiming Lu', 'Jun Xiao', 'Yueting Zhuang', 'Yongliang Shen'], 'affiliations': ['Alibaba Group', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01191.jpg', 'data': {'categories': ['#rl', '#reasoning', '#benchmark', '#training', '#multimodal'], 'emoji': '🖼️', 'ru': {'title': 'Разделение восприятия и рассуждения для точного визуального анализа', 'desc': 'В статье представлен единый фреймворк под названием Perceive-to-Reason (P2R), который разделяет визуальное восприятие и рассуждение в моделях зрительно-языкового взаимодействия. Этот подход улучшает качество точного визуального рассуждения на высококачественных изображениях, локализуя ключевые визуальные подсказки. P2R формирует процесс визуального рассуждения в два этапа: сначала модель находит важные элементы изображения, а затем отвечает на вопрос на основе этих данных. Также вводится метод обучения PRA-GRPO, который чередует обновления, ориентированные на восприятие и рассуждение, используя только информацию о финальном ответе.'}, 'en': {'title': 'Decoupling Perception and Reasoning for Enhanced Visual Understanding', 'desc': 'The paper introduces a framework called Perceive-to-Reason (P2R) that separates visual perception from reasoning in vision-language models. This two-stage process first identifies relevant visual evidence before answering questions, enhancing fine-grained visual reasoning on high-resolution images. The authors also present a reinforcement learning strategy, PRA-GRPO, which alternates between perception and reasoning updates using final-answer supervision. Results show that P2R significantly improves performance across various benchmarks, indicating that decoupling these processes is beneficial for multimodal reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.00272', 'title': 'ASPIRE: Agentic /Skills Discovery for Robotics', 'url': 'https://huggingface.co/papers/2607.00272', 'abstract': 'Abstract ASPIRE is a continual learning system that autonomously develops and refines robot control programs through iterative exploration, achieving superior performance and zero-shot generalization in manipulation and household tasks while enabling sim-to-real transfer.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Traditional robot programming is challenging: it requires orchestrating multimodal perception, managing physical contact dynamics, and handling diverse configurations and execution failures. We introduce ASPIRE (Agentic Skill Programming through Iterative Robot Exploration), a continual learning system that autonomously writes and refines robot control programs in a code-as-policy paradigm while compounding experience into a reusable skill library. ASPIRE discovers skills that persist across tasks, simulation and real-world settings, and embodiments. It operates in an open-ended loop with three components: (1) a closed-loop robot execution engine that exposes fine-grained multimodal traces, enabling autonomous failure diagnosis, repair synthesis, and validation; (2) a continually expanding skill library that distills validated fixes into reusable, transferable knowledge; and (3) evolutionary search that generates diverse task sequences and control programs to explore beyond single-trajectory refinement. ASPIRE surpasses prior methods by up to 77% on LIBERO-Pro manipulation under perturbation, 72% on Robosuite bimanual handover, and 32% on BEHAVIOR-1K long-horizon household tasks. Its accumulated library also enables zero-shot generalization to unseen long-horizon tasks: on LIBERO-Pro Long, ASPIRE achieves 31% success versus 4% for prior methods despite their use of test-time reasoning and retries. Finally, simulation-discovered skills provide initial evidence of sim-to-real transfer, substantially reducing real-robot programming effort across different embodiments and robot APIs.', 'score': 11, 'issue_id': 2750, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'ae77be4ed2ab6328', 'github_url': '', 'github_stars': 0, 'authors': ['Runyu Lu', 'Yubo Wu', 'Ethan Kou', 'Letian Fu', 'Wenli Xiao', 'Ajay Mandlekar', 'Yinzhen Xu', 'Guanya Shi', 'Ken Goldberg', 'Ang Chen', 'Mosharaf Chowdhury', 'Yuke Zhu', 'Linxi "Jim" Fan', 'Guanzhi Wang'], 'affiliations': ['CMU', 'NVIDIA', 'UC Berkeley', 'UIUC', 'UMich'], 'pdf_title_img': 'assets/pdf/title_img/2607.00272.jpg', 'data': {'categories': ['#agents', '#transfer_learning', '#robotics', '#continual_learning'], 'emoji': '🤖', 'ru': {'title': 'Самообучающиеся роботы для решения сложных задач!', 'desc': 'ASPIRE — это система непрерывного обучения, которая самостоятельно разрабатывает и совершенствует программы управления роботами через итеративное исследование. Она демонстрирует превосходные результаты и нулевую генерализацию в задачах манипуляции и домашних делах, а также обеспечивает перенос из симуляции в реальность. Система накапливает опыт в библиотеке навыков, позволяя эффективно решать задачи в различных условиях. ASPIRE превосходит предыдущие методы в производительности и сокращает усилия при программировании реальных роботов.'}, 'en': {'title': 'Empowering Robots with Autonomous Skill Development', 'desc': 'ASPIRE is a continual learning system designed to autonomously create and improve robot control programs through iterative exploration. It utilizes a code-as-policy approach to build a reusable skill library, allowing robots to perform various manipulation and household tasks effectively. The system features a closed-loop execution engine for diagnosing and fixing failures, an expanding skill library for knowledge transfer, and evolutionary search for diverse task exploration. ASPIRE demonstrates significant performance improvements over previous methods, achieving zero-shot generalization and facilitating sim-to-real transfer in robotic applications.'}}}, {'id': 'https://huggingface.co/papers/2607.00678', 'title': 'ABot-M0.5: Unified Mobility-and-Manipulation World Action Model', 'url': 'https://huggingface.co/papers/2607.00678', 'abstract': 'Abstract ABot-M0.5 is a World Action Model for mobile manipulation that improves performance through temporal granularity alignment, action space disentanglement, and train-test consistency in autoregressive prediction.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Mobile manipulation is a key capability for general-purpose robots, yet remains challenging for current embodied learning methods. VLA policies are typically reactive and lack explicit world modeling, while existing World Action Models (WAMs) are still poorly aligned with the structure of mobile manipulation: they operate on coarse video chunks, model entangled navigation-manipulation actions, and train inverse dynamics under supervision that does not match autoregressive inference. As a result, they often miss fine-grained contact dynamics, suffer from action-distribution conflicts, and accumulate errors over long-horizon rollouts. We propose ABot-M0.5, a new WAM built on the insight that mobile manipulation requires alignment at three levels: temporal granularity, action space, and train-test consistency. To align temporal granularity, we introduce intermediate latent actions that capture local visual state transitions and serve as an bridging action space between video latents and embodiment-specific controls. To align action space, we design a dual-level Mixture-of-Transformers architecture that disentangles both modality representations and heterogeneous action subspaces such as base movement and arm manipulation. To align inference conditions, we propose the dream-forcing training strategy that progressively trains inverse dynamics on model-predicted videos, improving train-test alignment and robustness during autoregressive prediction. Experiments on challenging mobile and fine-grained manipulation benchmarks demonstrate that ABot-M0.5 achieves state-of-the-art performance in both long-horizon task success and finegrained control accuracy. These results highlight the critical importance of granularity-aligned, action-disentangled, and inference-consistent world-action modeling.', 'score': 10, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '187208957ddebdbd', 'github_url': '', 'github_stars': 0, 'authors': ['Ronghan Chen', 'Yandan Yang', 'Zuojin Tang', 'Dongjie Huo', 'Tong Lin', 'Haoning Wu', 'Haoyun Liu', 'Yuzhi Chen', 'Lulu Zheng', 'Botai Yuan', 'Tianlun Li', 'Mingxin Wang', 'Dekang Qi', 'Bin Hu', 'Wei Mei', 'Yuze Xuan', 'Haolong Yang', 'Yanqing Zhu', 'Mu Xu', 'Zhiheng Ma', 'Xinyuan Chang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.00678.jpg', 'data': {'categories': ['#robotics', '#optimization', '#agents', '#benchmark', '#architecture', '#training', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Новая модель для мобильной манипуляции', 'desc': 'ABot-M0.5 — это новая модель мира для мобильной манипуляции, которая улучшает производительность за счет выравнивания временной гранулярности, разъединения пространства действий и согласованности между обучением и тестированием. Эта модель учитывает, что мобильная манипуляция требует внимания на трех уровнях: временной гранулярности, пространстве действий и условиях вывода. В экспериментах на сложных задачах мобильной манипуляции она достигла выдающихся результатов в долгосрочном успехе задач и точности контроля. Эти результаты подчеркивают важность гранулярного выравнивания и надежного моделирования действий в мире.'}, 'en': {'title': 'Aligning Actions for Superior Mobile Manipulation', 'desc': 'ABot-M0.5 is a World Action Model designed to enhance mobile manipulation in robots by aligning temporal granularity, disentangling action spaces, and ensuring consistency between training and testing. It introduces intermediate latent actions to better capture local visual transitions and connects video data to specific robot controls. The model employs a dual-level Mixture-of-Transformers architecture to separate different types of actions, such as movement and manipulation. Through a novel dream-forcing training strategy, ABot-M0.5 improves the robustness of predictions, achieving state-of-the-art results in complex manipulation tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.01218', 'title': 'The State-Prediction Separation Hypothesis', 'url': 'https://huggingface.co/papers/2607.01218', 'abstract': 'Abstract Separating state prediction from token prediction in Transformers improves language modeling performance and efficiency across different scales.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Transformers use the same forward computation stream to both predict the next token and store useful state for future token predictions. We formulate the state-prediction separation hypothesis: disentangling the two roles yields better language modeling performance. We design a Transformer variant that uses two computation streams to separate the two functions, and conduct pretraining experiments across various scales. Our experiments show that state-prediction separation consistently offers better data and compute efficiencies, improving validation loss and outperforming standard Transformers by 2--3 percentage points on average on downstream tasks. We also conduct extensive empirical analysis that rules out potential confounders and demonstrates the fundamental difference in the gradients our design entails.', 'score': 7, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'b3f6a8a070994168', 'github_url': '', 'github_stars': 0, 'authors': ['Giovanni Monea', 'Nathan Godey', 'Kianté Brantley', 'Yoav Artzi'], 'affiliations': ['Cornell University', 'Harvard University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01218.jpg', 'data': {'categories': ['#optimization', '#architecture', '#training'], 'emoji': '⚡', 'ru': {'title': 'Разделение предсказания для лучшей эффективности языкового моделирования', 'desc': 'В данной статье рассматривается разделение предсказания состояния и предсказания токена в трансформерах, что улучшает производительность языкового моделирования. Авторы формулируют гипотезу о раздельном предсказании, которая позволяет достичь лучших результатов в задачах обработки естественного языка. Разработан новый вариант трансформера, использующий два потока вычислений для выполнения этих функций. Эксперименты показывают, что такое разделение обеспечивает лучшую эффективность данных и вычислений, снижая потери на валидации и превосходя стандартные трансформеры на 2-3 процентных пункта в среднем.'}, 'en': {'title': 'Enhancing Transformers: Separate State and Token Predictions for Better Performance', 'desc': 'This paper introduces a new approach to improve language modeling in Transformers by separating state prediction from token prediction. By using two distinct computation streams, the model can better manage the roles of predicting the next token and storing useful information for future predictions. The authors conducted pretraining experiments that showed this separation leads to enhanced performance and efficiency, achieving lower validation loss and outperforming traditional Transformers. Their extensive analysis confirms the effectiveness of this design, highlighting significant differences in the gradients produced.'}}}, {'id': 'https://huggingface.co/papers/2607.00917', 'title': 'Valdi: Value Diffusion World Models', 'url': 'https://huggingface.co/papers/2607.00917', 'abstract': 'Abstract Value Diffusion World Models combine end-to-end online training with latent diffusion dynamics to enable fast, uncertain dynamics prediction for Model Predictive Control in reinforcement learning environments.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct World models can enable Model Predictive Control (MPC), but this requires dynamics prediction that is both fast enough for online use and expressive enough to represent uncertain futures. Diffusion models offer a natural mechanism for modeling uncertain dynamics, yet their iterative inference procedure makes them difficult to use for low-latency latent planning. We bridge this gap with Value Diffusion World Models (Valdi), combining end-to-end online training for MPC with a latent diffusion dynamics model. In preliminary experiments on the CarRacing environment, we show that Valdi, using a single diffusion step at both training and inference, matches a deterministic MLP baseline. Our experiments expose a trade-off between predictive multimodality and control performance in this setup. Code is available at https://github.com/Kit115/ValueDiffusionWorldModels.', 'score': 6, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'fea067ba8398b27f', 'github_url': '', 'github_stars': 0, 'authors': ['Christopher Lindenberg', 'Kashyap Chitta'], 'affiliations': ['KE:SAI Kyutai ELLIS Scalable Autonomous Intelligence, Germany', 'University of Tübingen, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2607.00917.jpg', 'data': {'categories': ['#optimization', '#agents', '#rl', '#diffusion', '#training', '#games'], 'emoji': '🚗', 'ru': {'title': 'Эффективное управление неопределенной динамикой', 'desc': 'Статья описывает новый подход к моделированию динамики в контексте управления с помощью Model Predictive Control (MPC) при помощи Value Diffusion World Models (Valdi). Эти модели сочетают онлайн-обучение и латентную диффузионную динамику для быстрого предсказания неопределенных динамик. Они значительно упрощают процесс предсказания за счет использования одного шага диффузии на этапе обучения и вывода. Эксперименты показывают компромисс между многомодальным предсказанием и эффективностью управления.'}, 'en': {'title': 'Fast and Uncertain Dynamics Prediction for Reinforcement Learning', 'desc': 'Value Diffusion World Models (Valdi) integrate online training with latent diffusion dynamics to enhance Model Predictive Control (MPC) in reinforcement learning. This approach allows for rapid and uncertain dynamics prediction, which is crucial for effective decision-making in dynamic environments. By utilizing a single diffusion step during both training and inference, Valdi achieves performance comparable to traditional deterministic models. The research highlights a balance between the ability to predict multiple future scenarios and the overall control performance.'}}}, {'id': 'https://huggingface.co/papers/2606.31551', 'title': 'AutoTrainess: Teaching Language Models to Improve Language Models Autonomously', 'url': 'https://huggingface.co/papers/2606.31551', 'abstract': 'Abstract AutoTrainess enables autonomous language model training by providing structured agent-computer interfaces that guide planning, data preparation, training, evaluation, and logging operations more effectively than traditional command-line approaches.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Training language models (LMs) remains a highly human-intensive process, even as frontier language model agents become increasingly capable at software engineering and other long-horizon tasks. A central challenge is that autonomous post-training is not just a coding problem: it requires the agent to repeatedly plan iterations, construct benchmark-aligned data, run stable training jobs, evaluate checkpoints, and preserve experiment state across many hours of interaction. We present AutoTrainess, a LM agent that exposes these operations as a repository of agent-computer interfaces for planning, data preparation, training, evaluation, and logging. Rather than leaving the agent to operate in a raw CLI environment with an underspecified action space, AutoTrainess externalizes prior human experience as explicit workflows, rules, and execution constraints that guide the agent toward effective and reliable training behavior. On PostTrainBench, AutoTrainess consistently outperforms CLI-only baselines, achieving 26.94 average score with GPT-5.4 (Codex) versus 23.21 for CLI-only. It also generalizes across models and harnesses, improving DeepSeek-V4-Flash (OpenCode) from 12.13 to 19.58.', 'score': 6, 'issue_id': 2749, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'e1e7af7362f7ee85', 'github_url': '', 'github_stars': 0, 'authors': ['Zhaojian Yu', 'Penghao Yin', 'Shuzheng Gao', 'Shilin He', 'Kai Cai', 'Xiao-Ping Zhang'], 'affiliations': ['Simple Agent Lab', 'The Chinese University of Hong Kong', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2606.31551.jpg', 'data': {'categories': ['#optimization', '#agents', '#agent_memory', '#benchmark', '#training', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Автономное обучение языковых моделей с AutoTrainess', 'desc': 'Статья представляет AutoTrainess - новый инструмент для автономного обучения языковых моделей. С помощью интерфейсов взаимодействия агент-компьютер, он облегчает планирование, подготовку данных, обучение и оценку. AutoTrainess использует структурированные рабочие процессы, что позволяет агентам более эффективно справляться с задачами, чем традиционные командные интерфейсы. Результаты показывают, что AutoTrainess обеспечивает значительно лучшие результаты по сравнению с методами, основанными только на CLI.'}, 'en': {'title': 'Streamlining Language Model Training with AutoTrainess', 'desc': 'AutoTrainess is a system that helps automate the training of language models by providing structured interfaces for various tasks like planning, data preparation, and evaluation. This approach is more effective than traditional command-line methods, which can be cumbersome and less organized. The system allows language model agents to follow clear workflows and rules, making the training process more reliable and efficient. In tests, AutoTrainess showed better performance than CLI-only methods, demonstrating its ability to improve training outcomes across different models.'}}}, {'id': 'https://huggingface.co/papers/2606.20997', 'title': 'BioInsight: Multi-Agent Orchestration for Interactive Biomedical Knowledge Discovery', 'url': 'https://huggingface.co/papers/2606.20997', 'abstract': 'Abstract BioInsight is a multi-agent system that transforms static biomedical reports into interactive, evidence-centered interfaces by organizing disease-specific evidence through structured artifacts and deterministic citation normalization.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Biomedical researchers increasingly use AI-generated analyses and reports to interpret protein-level signals, but static outputs are often insufficient for research decision-making, where users need to inspect evidence, assess uncertainty, compare mechanisms, and refine hypotheses. We present BioInsight, a multi-agent system that moves from static biomedical report generation to interactive evidence-centered interactive interface generation. Given a disease name, a protein association table, and optional cohort metadata, BioInsight organizes disease-specific evidence through typed intermediate artifacts, including ranked pathways, literature evidence packets, protein-level reasoning notes, citation-grounded reports, dashboard schemas, and rendered interactive interfaces. The system decomposes evidence retrieval from mechanistic reasoning, normalizes citations through deterministic components, and converts the same structured evidence used in the report into an interactive interface. We evaluate BioInsight on standardized biomedical QA, challenging protein-function reasoning, and end-to-end biomedical evidence synthesis. Results show that BioInsight achieves best, and suggest that biomedical AI systems should move beyond text-only and static reports toward provenance-preserving, interactive evidence artifacts.', 'score': 6, 'issue_id': 2749, 'pub_date': '2026-06-19', 'pub_date_card': {'ru': '19 июня', 'en': 'June 19', 'zh': '6月19日'}, 'hash': 'd48ac28c58b21c29', 'github_url': '', 'github_stars': 0, 'authors': ['Jieyi Wang', 'Bingxuan Li', 'Nanyi Jiang', 'Desong Meng', 'Zirui Fan', 'Yuxin Guo', 'Jiayu Liu', 'Kunlun Zhu', 'Eddie Yang', 'Xiusi Chen', 'Pan Lu', 'Bingxin Zhao'], 'affiliations': ['Peking University', 'Purdue University', 'Stanford University', 'University of Illinois at Urbana-Champaign', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2606.20997.jpg', 'data': {'categories': ['#agents', '#interpretability', '#reasoning', '#agent_memory', '#healthcare', '#science', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Переход к интерактивным биомедицинским интерфейсам', 'desc': 'BioInsight — это многоагентная система, которая преобразует статические биомедицинские отчеты в интерактивные интерфейсы, ориентированные на доказательства. Она структурирует данные о заболеваниях и нормализует цитаты, обеспечивая более глубокое понимание информации. Исследователи могут взаимодействовать с доказательствами, оценивать неопределенности и сравнивать механизмы на основе информации о белках. Результаты показывают, что такие системы ИИ должны перейти от статических текстовых отчетов к интерактивным артефактам, сохраняющим достоверность.'}, 'en': {'title': 'Transforming Static Reports into Interactive Evidence Interfaces', 'desc': 'BioInsight is a multi-agent system designed to enhance the usability of biomedical reports by transforming them into interactive, evidence-centered interfaces. It organizes disease-specific evidence using structured artifacts and normalizes citations to improve clarity and accessibility. This system allows researchers to inspect evidence, assess uncertainty, and refine hypotheses, moving beyond static outputs. Evaluation results indicate that BioInsight outperforms traditional methods, highlighting the need for interactive and provenance-preserving biomedical AI systems.'}}}, {'id': 'https://huggingface.co/papers/2607.00553', 'title': 'Cross-Domain Generalization Failure in Lightweight Intrusion Detection Models for IIoT Networks', 'url': 'https://huggingface.co/papers/2607.00553', 'abstract': 'Abstract Lightweight machine learning models for IIoT intrusion detection show limited generalization across networks due to reliance on coarse port-category features and imbalanced class distributions, with adversarial robustness not correlating with cross-network performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Lightweight machine learning models are increasingly proposed for intrusion detection in Industrial Internet of Things (IIoT) networks due to their suitability for resource-constrained edge deployment. Most reported results evaluate these models only within their training network, leaving behavior on unseen networks unverified. This study trains four lightweight architectures on one IIoT dataset and evaluates them, without retraining, on two structurally distinct IIoT datasets using a feature representation restricted to attributes available across all three sources. Explainability analysis across two top-performing models shows both rely overwhelmingly on coarse port-category features; the most influential category occurs in source-domain attack traffic at 96 to 435 times the rate in the two target domains, indicating that coarsening port resolution relocates rather than removes a documented shortcut. Evaluation under naturally imbalanced class distributions reveals a further effect: the evaluation protocol used can reverse which target network appears to pose the greater generalization challenge. Adversarial robustness and recovery through limited target-domain exposure are also assessed; robustness to adversarial perturbation is unrelated to cross-network generalization, and recovery through adaptation varies considerably by architecture. These findings suggest deployment readiness should be assessed using cross-network evaluation under realistic class distributions, rather than within-domain accuracy alone.', 'score': 5, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '3ccc1eb3c91ffebb', 'github_url': '', 'github_stars': 0, 'authors': ['MD Azizul Hakim', 'Md Shihab Uddin', 'Talha Ibne Anis'], 'affiliations': ['Department of Computer Science and Technology, Bangladesh Sweden Polytechnic Institute', 'Department of Electrical Engineering, Bangladesh Sweden Polytechnic Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.00553.jpg', 'data': {'categories': ['#training', '#interpretability', '#security', '#transfer_learning', '#architecture', '#dataset', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Проверка готовности моделей машинного обучения в разных сетях', 'desc': 'В данной статье рассматриваются легковесные модели машинного обучения для обнаружения вторжений в сети IIoT. Выявлено, что такие модели имеют ограниченные возможности обобщения на разных сетях из-за зависимости от грубых категорий портов и несбалансированных классов. Проведенный анализ показал, что модели полагаются на определенные характеристики, которые могут не отражать реальную ситуацию в другой сети. Результаты исследования подчеркивают важность оценки готовности к развертыванию с использованием кросс-сетевой проверки при реальных распределениях классов.'}, 'en': {'title': 'Ensuring Robust IIoT Intrusion Detection Across Networks', 'desc': 'This paper discusses the challenges of using lightweight machine learning models for intrusion detection in Industrial Internet of Things (IIoT) networks. It highlights that these models often perform poorly when tested on new, unseen networks due to their reliance on broad port-category features and imbalanced class distributions. The study evaluates four lightweight architectures on different IIoT datasets, revealing that their performance is heavily influenced by specific features and that adversarial robustness does not guarantee better generalization across networks. The authors emphasize the need for cross-network evaluation under realistic conditions to ensure the models are truly ready for deployment.'}}}, {'id': 'https://huggingface.co/papers/2607.00924', 'title': 'Graph-Native Reinforcement Learning Enables Traceable Scientific Hypothesis Generation through Conceptual Recombination', 'url': 'https://huggingface.co/papers/2607.00924', 'abstract': 'Abstract Graph-PRefLexOR, a graph-native reasoning model trained with Group Relative Policy Optimization, improves materials science hypothesis generation through structured phases of mechanism exploration, graph construction, pattern extraction, and hypothesis synthesis, demonstrating enhanced reasoning traceability and semantic diversity.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Accelerating materials discovery requires AI systems that can generate scientifically valid hypotheses through multi-step, domain-grounded reasoning. Standard large language models often produce fluent but weakly traceable responses to open-ended materials design problems, making it difficult to determine whether final answers are supported by coherent intermediate reasoning. We develop Graph-PRefLexOR, a family of graph-native reasoning models fine-tuned with Group Relative Policy Optimization (GRPO) to organize reasoning into explicit phases for mechanism exploration, graph construction, pattern extraction, and hypothesis synthesis. This design links neural language generation with symbolic relational structure, enabling causal connections to be constructed, inspected, and reused. On 100 open-ended questions from materials science and mechanics literature, Graph-PRefLexOR achieves 40-65% improvements over corresponding base models, with the largest gains in reasoning traceability. Embedding analyses show broader semantic exploration and approximately 2-3 times greater semantic diversity than baselines. Semantic backtracking and layer-wise hidden-state analyses further show stronger alignment between structured reasoning and final answers. Finally, test-time graph expansion reveals that additional compute primarily increases long-range conceptual recombination within a bounded semantic space, rather than simply expanding semantic coverage. These results establish graph-native reinforcement learning as a pathway toward interpretable AI systems for scientific hypothesis generation in materials design and other scientific applications.', 'score': 4, 'issue_id': 2751, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '7bf7e0a65f1d4633', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#graphs', '#rlhf', '#science', '#reasoning', '#interpretability', '#rl', '#graphs'], 'emoji': '🔍', 'ru': {'title': 'Новая эра в генерации гипотез для материаловедения', 'desc': 'Статья представляет модель Graph-PRefLexOR, которая использует графовые структуры для улучшения генерации гипотез в материаловедении. Она обучена с помощью метода Group Relative Policy Optimization, что позволяет организовать процесс рассуждения в четко определенные фазы. Эта модель сочетает в себе языковую генерацию и символическую структуру, что способствует созданию и проверке причинных связей. Результаты показывают значительное улучшение трассируемости рассуждений и семантического разнообразия по сравнению с традиционными языковыми моделями.'}, 'en': {'title': 'Revolutionizing Materials Discovery with Graph-Native Reasoning', 'desc': 'Graph-PRefLexOR is a graph-native reasoning model that enhances hypothesis generation in materials science by using structured phases of reasoning. It employs Group Relative Policy Optimization to improve the organization of reasoning into distinct steps, such as mechanism exploration and hypothesis synthesis. This model outperforms standard large language models by providing better reasoning traceability and greater semantic diversity in its outputs. The results demonstrate that graph-native reinforcement learning can lead to more interpretable AI systems for scientific applications.'}}, 'authors': [], 'affiliations': []}, {'id': 'https://huggingface.co/papers/2606.32029', 'title': 'When LLMs Read Tables Carelessly: Measuring and Reducing Data Referencing Errors', 'url': 'https://huggingface.co/papers/2606.32029', 'abstract': 'Abstract Large language models exhibit data referencing errors when processing tables, which can be mitigated through critic-based filtering and rejection sampling, with a lightweight 4B-parameter model achieving high detection accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct While large language models (LLMs) perform well on table tasks, they still make data referencing errors (DREs), i.e., incorrectly citing or omitting table values, despite understanding the table structure. Beyond final-answer accuracy, DREs directly compromise the correctness and reliability of intermediate reasoning steps. Yet prior studies have only offered limited, small-scale analyses. In this work, we present the first systematic evaluation of tabular data referencing errors across different models and tasks. Our results show that DREs occur across all tested models (1.7B to 20B parameters). Furthermore, we demonstrate that incorporating data referencing as a critic significantly improves answer accuracy up to 12.0%, through critic-based filtering and rejection sampling. Finally, we trained a lightweight 4B-parameter critic model that achieves an average F1 score of 78.2% in detecting both in-distribution and out-of-distribution DREs, and effectively assists inference for larger models.', 'score': 4, 'issue_id': 2750, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '6fa27f31261d1a07', 'github_url': '', 'github_stars': 0, 'authors': ['Yuqing Yang', 'Qi Zhu', 'Zhen Han', 'Boran Han', 'Zhengyuan Shen', 'Shuai Wang', 'Vassilis N. Ioannidis', 'Huzefa Rangwala'], 'affiliations': ['AWS AI Labs', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2606.32029.jpg', 'data': {'categories': ['#inference', '#data', '#training', '#hallucinations', '#interpretability', '#reasoning', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Устранение ошибок ссылок на данные в языковых моделях', 'desc': 'В данной статье обсуждаются ошибки ссылок на данные, которые совершают большие языковые модели (LLM) при обработке таблиц. Эти ошибки возникают, когда модели неверно цитируют или упускают значения из таблиц, несмотря на понимание их структуры. Авторы предлагают использовать фильтрацию на основе критиков и отбор с отсеиванием, что значительно повышает точность ответов. Они также создали легковесную модель критика с 4 миллиардами параметров, которая эффективно обнаруживает эти ошибки и улучшает вывод для более крупных моделей.'}, 'en': {'title': 'Enhancing Table Accuracy in Language Models', 'desc': 'This paper addresses data referencing errors (DREs) in large language models (LLMs) when they process tables, which can lead to incorrect citations or omissions of table values. The authors conducted a systematic evaluation of DREs across various models and tasks, revealing that these errors are prevalent in models ranging from 1.7B to 20B parameters. They propose a solution that involves using a critic-based approach, which enhances answer accuracy by up to 12% through filtering and rejection sampling. Additionally, a lightweight 4B-parameter critic model was developed, achieving a high F1 score of 78.2% in detecting DREs, thereby improving the inference process for larger models.'}}}, {'id': 'https://huggingface.co/papers/2606.31292', 'title': 'AtomiMed: Hierarchical Atomic Fact-Checking for Universal Clinical-Aware Medical Report Evaluation', 'url': 'https://huggingface.co/papers/2606.31292', 'abstract': 'Abstract AtomiMed presents a novel evaluation framework for medical report generation that decomposes clinical narratives into atomic facts and uses an agentic cross-verification process to improve accuracy assessment beyond traditional metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Traditional metrics for Medical Report Generation (MRG) predominantly rely on surface-level n-gram overlap, which fails to capture clinical factual accuracy and often overlooks catastrophic diagnostic errors. We address this fundamental limitation by proposing AtomiMed, a universal, modality-agnostic evaluation framework that decomposes complex medical narratives into a standardized, multi-level hierarchy of Atomic Clinical Facts, encompassing Disease-level entities and Attribute-level descriptors, including location, morphology, and severity. By implementing an Agentic Cross-Verification loop between ground-truth and predicted reports, AtomiMed simulates a multi-radiologist peer-review process to verify clinical consistency, thus enabling the decoupled assessment of diagnostic detection and descriptive accuracy. To facilitate standardized evaluation, we introduce MRGEvalKit, an open-source toolkit for automated hierarchical extraction, and curate OmniMRG-Bench, a comprehensive multi-modal benchmark covering X-ray, CT, MRI, and Ultrasound. Extensive experiments on multiple expert-annotated reader studies demonstrate that AtomiMed achieves significantly higher correlation with human radiologist judgment compared to traditional and model-based metrics. Our code are release at https://github.com/Venn2336/MRGEvalkit', 'score': 4, 'issue_id': 2749, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '9c090f8612915941', 'github_url': '', 'github_stars': 0, 'authors': ['Yuan Wang', 'Wanxing Chang', 'Songtao Jiang', 'Shujian Gao', 'Xiaotian Zhang', 'Ruifeng Yuan', 'Weiwei Cao', 'Bowen Shi', 'Ling Zhang', 'Zuozhu Liu', 'Jianpeng Zhang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2606.31292.jpg', 'data': {'categories': ['#evaluation', '#healthcare', '#open_source', '#benchmark'], 'emoji': '🩺', 'ru': {'title': 'Новая эра оценки медицинских отчетов', 'desc': 'AtomiMed представляет новую оценочную платформу для генерации медицинских отчетов, которая разбивает клинические истории на атомарные факты. Она использует процесс кросс-проверки, чтобы улучшить оценку точности за пределами традиционных метрик. Платформа может анализировать сложные медицинские нарративы, создавая стандартизированную иерархию атомарных клинических фактов. AtomiMed проводит проверку согласованности отчетов, имитируя процесс независимой оценки, что позволяет более точно оценивать диагностику и описательную точность.'}, 'en': {'title': 'Revolutionizing Medical Report Evaluation with Atomic Facts', 'desc': 'AtomiMed introduces a new evaluation framework for generating medical reports that breaks down clinical narratives into basic facts. It improves accuracy assessment by using an agentic cross-verification process, which goes beyond traditional metrics that often miss critical diagnostic errors. The framework organizes medical information into a structured hierarchy of Atomic Clinical Facts, allowing for a more detailed evaluation of both diagnosis and description. Additionally, AtomiMed provides an open-source toolkit and a benchmark for standardized assessment across various imaging modalities.'}}}, {'id': 'https://huggingface.co/papers/2607.01211', 'title': 'Are Performance-Optimization Benchmarks Reliably Measuring Coding Agents?', 'url': 'https://huggingface.co/papers/2607.01211', 'abstract': "Abstract  Repository-level performance-optimization benchmarks such as GSO, SWE-Perf and SWE-fficiency evaluate coding agents by applying patches to real repositories and comparing runtime against unoptimized baselines and official reference patches. Their leaderboard scores are increasingly used as evidence of coding-agent progress, but those scores can conflate runtime instability, benchmark-specific scoring rules, and how many tasks are already solved by at least one public submission. We audit these issues across the three benchmarks. First, we replay the official reference patches for 740 code optimization tasks across four common types of Google Cloud machines. Most benchmark tasks can be replayed, but their reference patches satisfy the original benchmark validity rules in every cross-machine replay for only 39/102 GSO tasks, 11/140 SWE-Perf tasks, and 411/498 SWE-fficiency tasks; SWE-Perf is especially fragile because many reference patches produce close-to-zero runtime changes. Second, we show that public submission rankings depend strongly on the benchmark scoring rule. Among eight public submissions shared by GSO and SWE-fficiency, the official rankings disagree on 9 of 28 pairwise submission comparisons, and SWE-fficiency's leaderboard scoring rule assigns the worst ten tasks overly high score weights of 58.5%-82.8%. Third, looking across 10 public submissions for each task, we find that at least one submission matches or beats the reference patch on 85.3% (384/450) of replay-valid GSO and SWE-fficiency tasks, and beats the unoptimized base code on 99.8% (449/450). Our study complements leaderboard scores by identifying tasks with more reliable performance signals, quantifying per-task score contributions, and exposing the remaining performance gaps that are hidden by aggregate rankings.", 'score': 3, 'issue_id': 2753, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'e57eb40bafb1e99c', 'github_url': '', 'github_stars': 0, 'authors': ['Zhi Chen', 'Zhensu Sun', 'Yuling Shi', 'David Lo', 'Lingxiao Jiang'], 'affiliations': ['Shanghai Jiao Tong University', 'Singapore Management University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01211.jpg', 'data': {'categories': ['#agents', '#survey', '#optimization', '#benchmark'], 'emoji': '🔍', 'ru': {'title': 'Проблемы оценивания производительности в оптимизации кода', 'desc': 'В статье рассматриваются проблемы оптимизации производительности репозиториев с использованием методов, таких как GSO, SWE-Perf и SWE-fficiency. Авторы анализируют стабильность выполнения и правила оценивания, которые могут искажать результаты. Исследование показывает, что не все эталоны патчей обеспечивают корректные результаты при повторной проверке на различных машинах. Кроме того, существует значительная зависимость ранжирования публичных submissions от правил оценивания, что подчеркивает необходимость более тщательной проверки этих систем.'}, 'en': {'title': 'Unveiling the Truth Behind Coding Agent Benchmarks', 'desc': 'This paper audits the reliability of performance-optimization benchmarks for coding agents, such as GSO, SWE-Perf, and SWE-fficiency. It reveals that many reference patches do not consistently meet validity rules across different machine types, indicating potential instability in benchmark results. The study also highlights how public submission rankings can vary significantly based on the scoring rules used, leading to misleading interpretations of agent performance. Finally, it identifies tasks with more reliable performance signals and quantifies the contributions of individual scores, shedding light on hidden performance gaps in aggregate rankings.'}}}, {'id': 'https://huggingface.co/papers/2607.00407', 'title': 'Personalization as Inverse Planning: Learning Latent Design Intents for Agentic Slide Generation via Structural Denoising', 'url': 'https://huggingface.co/papers/2607.00407', 'abstract': 'Abstract Page-level slide personalization is addressed through a novel framework that formulates the problem as inverse planning and uses a multi-agent reinforcement learning approach to learn design intents without requiring specific tool knowledge.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Slide design requires personalizing both deck themes and page layouts. Yet, current AI agent-based methods struggle with fine-grained, page-level design. Solely relying on prespecified templates or user verbose instructions, they fail to capture latent design intents, leaving Page-level Slide Personalization (PSP) unresolved. To close this gap, this work formulates PSP as an inverse planning problem. We propose to learn a design intent without assuming any knowledge of the specific executing tools (e.g., PowerPoint, Beamer) being used. However, relinquishing control over these tools makes the problem intractable to optimize end-to-end. To overcome this, we propose SPIRE, a principled framework to solve PSP approximately. By intentionally corrupting the visual structures of clean slides, SPIRE creates a verifiable task to denoise the corruption, whereby two agents learn to collaboratively refine executable designs via reinforcement learning (RL). We present a proof that structural denoising is a consistent surrogate for PSP, and that the multi-agent formulation strictly reduces policy gradient variance in RL. Extensive experiments demonstrate the superiority of SPIRE.', 'score': 3, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'd0ec49ec2e5f1060', 'github_url': '', 'github_stars': 0, 'authors': ['Tianci Liu', 'Zihan Dong', 'Linjun Zhang', 'Haoyu Wang', 'jing Gao', 'Emre Kiciman', 'Ranveer Chandra', 'Wei-Ting Chen'], 'affiliations': ['Microsoft', 'Purdue University', 'Rutgers University', 'University at Albany'], 'pdf_title_img': 'assets/pdf/title_img/2607.00407.jpg', 'data': {'categories': ['#agents', '#training', '#rl', '#optimization', '#games'], 'emoji': '🎨', 'ru': {'title': 'Персонализация слайдов с помощью обучения с подкреплением', 'desc': 'В этой статье рассматривается персонализация слайдов на уровне страниц с помощью новой рамочной структуры, определяющей задачу как обратное планирование. Используя подход многопользовательского обучения с подкреплением, исследователи учатся понимать дизайнерские намерения, не полагаясь на конкретные инструменты. Основная проблема заключается в том, что существующие методы не могут точно захватить скрытые намерения дизайна. Новый фреймворк SPIRE позволяет эффективно решать эту задачу, используя подход коррекции визуальных структур слайдов.'}, 'en': {'title': 'Revolutionizing Slide Design with Multi-Agent Learning', 'desc': 'This paper introduces a new framework for page-level slide personalization (PSP) using multi-agent reinforcement learning. It formulates PSP as an inverse planning problem, allowing the system to learn design intents without needing specific tool knowledge. The proposed method, SPIRE, addresses the limitations of existing AI methods by creating a task that involves denoising corrupted slide structures. Through extensive experiments, the authors demonstrate that SPIRE effectively reduces policy gradient variance and outperforms previous approaches in generating personalized slide designs.'}}}, {'id': 'https://huggingface.co/papers/2607.01131', 'title': 'Autonomous Scientific Discovery via Iterative Meta-Reflection', 'url': 'https://huggingface.co/papers/2607.01131', 'abstract': 'Abstract An autonomous scientific discovery framework uses large language models and dynamic code generation to conduct open-ended research while maintaining statistical rigor through meta-reflection and multimodal data processing.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Autonomous scientific discovery systems offer the potential to accelerate research by automating the process of hypothesis generation and validation. However, current systems operate within constrained search spaces or require predefined research questions, limiting their capacity for true open-ended inquiry. Furthermore, while they generate hypotheses iteratively, they largely lack the ability to explicitly synthesize their own accumulated findings to uncover complex, interconnected phenomena. We introduce DiscoPER, an autonomous large language model-powered framework that conducts open-ended research by dynamically generating and executing code to explore datasets without pre-specified research objectives. To ensure rigorous scientific validity, every proposed discovery must pass statistical testing. To overcome the limitations of isolated search, our framework introduces a second-order reasoning mechanism that periodically analyzes its own accumulated discoveries. By treating prior discoveries as empirical data, DiscoPER identifies structural patterns, confounds, and epistemic gaps, actively redirecting hypothesis exploration toward uncharted regions of the search space. The search space is further expanded by incorporating tool use, enabling the system to explore hypotheses beyond structured metadata by seamlessly processing and extracting useful information from multimodal sources like images. Evaluated on iNatDisco, a new multimodal ecological knowledge benchmark with pattern-level ground truth obtained from peer-reviewed literature, DiscoPER recovers 8 of 9 known patterns with a 72.7% hypothesis support rate, outperforming both classical causal discovery and LLM-guided baselines. Ablations show that DiscoPER scales with more data, and confirms the benefits of second-order meta-reflection.', 'score': 3, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'ab7073ea73e0dae1', 'github_url': '', 'github_stars': 0, 'authors': ['Bingchen Zhao', 'Sara Beery', 'Oisin Mac Aodha'], 'affiliations': ['Massachusetts Institute of Technology', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2607.01131.jpg', 'data': {'categories': ['#tool_use', '#science', '#multimodal', '#reasoning', '#benchmark', '#agents', '#dataset', '#agi'], 'emoji': '🔍', 'ru': {'title': 'Автономные исследования без границ', 'desc': 'Данная статья представляет новый фреймворк DiscoPER, который использует большие языковые модели для автономного проведения открытых исследований. Он генерирует и выполняет код для анализа данных без заранее определенных исследовательских вопросов, что позволяет проводить более свободные и глубокие исследования. Для обеспечения научной строгости каждая предложенная находка проходит статистическое тестирование. Кроме того, система анализирует свои предыдущие открытия, что помогает выявлять сложные взаимосвязи и расширять пространство поиска.'}, 'en': {'title': 'Unlocking Open-Ended Research with DiscoPER', 'desc': 'This paper presents DiscoPER, an autonomous framework that leverages large language models for open-ended scientific research. It dynamically generates and executes code to explore datasets without needing predefined research questions, allowing for more flexible hypothesis generation. DiscoPER incorporates a second-order reasoning mechanism to analyze its own discoveries, identifying patterns and gaps in knowledge. The framework has been evaluated on a new ecological benchmark, demonstrating its ability to recover known patterns and outperform traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2606.30124', 'title': 'SciIR: A Large-scale Training Dataset and Benchmark for Scientific Image Reasoning Generation', 'url': 'https://huggingface.co/papers/2606.30124', 'abstract': "Abstract Scientific image generation faces challenges in semantic alignment and logical reasoning, prompting the creation of SciIR-82k dataset and SciIR-Bench evaluation framework to improve scientific reasoning capabilities in text-to-image models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct While Text-to-Image (T2I) models have shown remarkable success in generating photorealistic visual content, they still struggle with the rigorous semantic alignment and logical reasoning required for scientific imagery. Inspired by Peirce's Semiotic Triad, we introduce Scientific Image Reasoning (SciIR), a comprehensive resource for training and evaluation of scientific image generation. We formalize scientific reasoning into three core dimensions: Entity Structure (Icon), Scientific Process (Index), and Scientific Law (Symbol). Specifically, to overcome the scarcity of training data in scientific image generation, we elaborately create SciIR-82k, a large-scale dataset containing over 80,000 high-quality scientific image-text pairs from cutting-edge publications. The dataset is hierarchically organized according to the semiotic dimensions and incorporates a Scientific Reasoning Chain-of-Thought (Sci-RCoT) to explicitly model underlying visual logic. For evaluation, we propose SciIR-Bench, which aligns with these three semiotic levels and employs an Atomic Checklist to convert the outcome-oriented scientific accuracy into process-oriented, verifiable, fine-grained questions. Our extensive experiments reveal significant deficiencies in current models' scientific reasoning capabilities. Furthermore, by fine-tuning on the SciIR-82k dataset, we developed the Qwen-Image-SciIR model, which achieves a substantial improvement on the SciIR-Bench, increasing the final score from 35\\% to 43\\%, laying a solid foundation for future advances in scientific image generation.", 'score': 3, 'issue_id': 2753, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '6d44a8e03a2c4b8f', 'github_url': '', 'github_stars': 0, 'authors': ['Zhiyuan Ma', 'Zhengfeng Shi', 'Yuning An', 'Peize Li', 'Jiabao Wei', 'Ruijie Li', 'Junhao Xiao', 'Jianjun Li', 'Bowen Zhou'], 'affiliations': ['Department of Electronic Engineering, Tsinghua University, China', 'School of Airspace Science and Engineering, Shandong University, China', 'School of Computer Science and Technology, Huazhong University of Science and Technology, China'], 'pdf_title_img': 'assets/pdf/title_img/2606.30124.jpg', 'data': {'categories': ['#science', '#training', '#benchmark', '#reasoning', '#multimodal', '#dataset'], 'emoji': '🧪', 'ru': {'title': 'Поднимаем планку научной генерации изображений!', 'desc': 'В статье рассматриваются проблемы генерации научных изображений, связанные с семантическим соответствием и логическим мышлением. Для решения этих задач была создана база данных SciIR-82k, содержащая более 80,000 высококачественных пар изображений и текстов. Также предложена оценочная система SciIR-Bench, которая учитывает три ключевых аспекта научного м
