istics & Bioinformatics, Ghent University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01436.jpg', 'data': {'categories': ['#multimodal', '#diffusion', '#benchmark', '#games', '#healthcare', '#rlhf', '#training', '#architecture', '#dataset'], 'emoji': '🩺', 'ru': {'title': 'Диффузионные модели в медицине: скорость и точность!', 'desc': 'В статье обсуждаются модели глубокого обучения, использующие диффузию, которые сопоставимы или превышают автогрессивные модели в области медицинского визуального вопроса-ответа. Эти модели способны быстро генерировать текст, отфильтровывая шум и позволяя двустороннее редактирование. Адаптированная модель DiffusionGemma-26B показывает конкурентоспособные результаты по сравнению с аналогичной автогрессивной моделью Gemma-4-26B. Уникальная возможность такого подхода - заполнение текста в произвольном порядке, что значительно облегчает работу радиологов с отчетами, которые могут быть краткими или непоследовательными.'}, 'en': {'title': 'Revolutionizing Medical Q&A with Diffusion Models', 'desc': "This paper presents a diffusion language model that outperforms traditional autoregressive models in medical visual question answering tasks. The model, DiffusionGemma-26B, utilizes a mixture-of-experts approach and generates text by denoising a token canvas bidirectionally, allowing for faster decoding and improved text editing capabilities. It is benchmarked against an autoregressive counterpart, Gemma-4-26B, showing superior performance across various datasets. Additionally, the diffusion model's unique ability to perform any-order infill enables more effective editing of medical reports, addressing inconsistencies in clinical documentation."}}}, {'id': 'https://huggingface.co/papers/2606.25178', 'title': 'Transferability for General Reasoning: An Automated Curriculum for Multi-Domain RLVR', 'url': 'https://huggingface.co/papers/2606.25178', 'abstract': 'Abstract Transfer-Aware Curriculum (TAC) improves multi-domain reinforcement learning by prioritizing domains that provide broad benefits to other domains, using gradient-geometry alignment to estimate cross-domain transferability.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning with verifiable rewards (RLVR) has been extended from single-domain training to multi-domain reasoning suites spanning mathematics, programming, and science. However, the training curriculum (how often each domain is sampled) is typically fixed or hand-tuned, even though reasoning skills transfer unevenly across domains. Existing learnability-based curricula adapt to where the policy is currently improving, but are blind to whether a gradient step on the selected domain benefits the remaining domains. In this paper, we propose Transfer-Aware Curriculum (TAC), a bandit-style online curriculum that prioritizes domains whose updates broadly benefit the rest of the training suite. TAC repurposes signals already produced by RL training: per-domain advantages capture local learnability, and projected gradients, taken from the GRPO step being computed, estimate cross-domain transferability via gradient-geometry alignment, at negligible cost (<1% wall-clock overhead). Across a six-domain reasoning suite, TAC achieves the best macro-averaged accuracy on both Qwen3-1.7B and Llama3.2-3B, outperforming proportional random sampling, a hand-designed schedule, and a learnability-only bandit, and improving over the last of these by up to 2.8 points (10% relative). Ablations show performance degrades sharply when the transferability term is removed, and TAC remains robust on imbalanced training mixtures where learnability-only curricula over-commit to dominant domains. Our findings establish cross-domain transferability as a key signal for curriculum design in multi-domain RLVR.', 'score': 3, 'issue_id': 2756, 'pub_date': '2026-06-27', 'pub_date_card': {'ru': '27 июня', 'en': 'June 27', 'zh': '6月27日'}, 'hash': '1f85f28b9f071d21', 'github_url': '', 'github_stars': 0, 'authors': ['Yongjin Yang', 'Jiarui Liu', 'Yinghui He', 'Lechen Zhang', 'Bernhard Schölkopf', 'Zhijing Jin'], 'affiliations': ['Carnegie Mellon University', 'ELLIS Institute Tübingen', 'EuroSafeAI', 'Jinesis Lab, University of Toronto & Vector Institute', 'Max Planck Institute for Intelligent Systems', 'Princeton University', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2606.25178.jpg', 'data': {'categories': ['#reasoning', '#rl', '#training', '#transfer_learning', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Умное обучение с учетом переносимости', 'desc': 'Статья описывает методику Transfer-Aware Curriculum (TAC), которая улучшает обучение с подкреплением в нескольких доменах. TAC определяет приоритетные домены для обучения, которые способствуют улучшению результатов в других доменах, используя выравнивание градиентов для оценки переносимости. Это позволяет адаптировать учебный план в реальном времени и повышает точность на различных задачах, таких как математика и программирование. Тесты показывают, что TAC значительно превосходит традиционные методы и сохраняет эффективность даже в условиях неравномерного обучения.'}, 'en': {'title': 'Boosting Multi-Domain Learning with Transfer-Aware Curriculum', 'desc': 'The paper introduces Transfer-Aware Curriculum (TAC), a method that enhances multi-domain reinforcement learning by focusing on domains that can help improve others. It uses gradient-geometry alignment to assess how updates in one domain can benefit the learning in other domains. Unlike traditional methods that rely on fixed sampling or hand-tuning, TAC adapts dynamically to prioritize domains that maximize overall learning efficiency. The results show that TAC significantly outperforms existing curriculum strategies, demonstrating the importance of cross-domain transferability in designing effective training schedules.'}}}, {'id': 'https://huggingface.co/papers/2606.27821', 'title': 'Parameter-Efficient Quantum-Inspired Fast Weight Programmers for Traffic-Matrix Forecasting', 'url': 'https://huggingface.co/papers/2606.27821', 'abstract': 'Abstract Quantum-inspired recurrent models using gated QKAN-FWPs demonstrate superior forecasting accuracy with reduced computational requirements compared to traditional LSTM networks for traffic matrix prediction.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Traffic matrices (TMs) capture network-wide origin-destination demand and are central to traffic engineering, yet accurate whole-matrix forecasting remains challenging when prediction must be performed under the memory, update, and training-budget constraints of online network control. This paper investigates whether compact quantum-inspired recurrent models can provide effective TM forecasts without relying on dedicated graph, transformer, or diffusion modules. We adapt gated quantum-inspired Kolmogorov-Arnold network fast-weight programmers (QKAN-FWPs) to direct multi-step Abilene TM forecasting, where each model predicts the next 20 five-minute frames of a 144-channel origin-destination (OD) matrix from a two-hour history. We benchmark three QKAN placement variants against a matched-size long short-term memory (LSTM) network, a larger LSTM, and a classical gated fast-weight programmer under a shared fixed-budget training protocol. Among the evaluated recurrent models, G-QKANFWP achieves the best pooled root-mean-square error (RMSE), while using only 22.4% of the larger LSTM. It also outperforms both the matched-size LSTM and the classical G-FWP baseline, indicating that the gain is not due to gated fast-weight framework alone. Convergence and channel-wise analyses further show that the quantum-inspired variants obtain lower validation-loss area under the learning curve (AULC) than matched-size recurrent baselines, while G-QKANFWP and GQKAN-FWP achieve substantially more OD-channel wins. These results identify a classical slow programmer with a quantum-inspired fast programmer as a promising accuracy-efficiency design for resource-conscious network traffic-matrix forecasting.', 'score': 3, 'issue_id': 2756, 'pub_date': '2026-06-26', 'pub_date_card': {'ru': '26 июня', 'en': 'June 26', 'zh': '6月26日'}, 'hash': 'bc0624da6bc501ea', 'github_url': '', 'github_stars': 0, 'authors': ['Kuo-Chung Peng', 'Jiun-Cheng Jiang', 'Chun-Hua Lin', 'Tai-Yue Li', 'Nan-Yow Chen', 'Samuel Yen-Chi Chen'], 'affiliations': ['Department of Physics and Center for Theoretical Physics, National Taiwan University, Taipei, Taiwan', 'National Center for High-Performance Computing, National Institutes of Applied Research, Hsinchu, Taiwan', 'Wells Fargo, New York, NY, USA'], 'pdf_title_img': 'assets/pdf/title_img/2606.27821.jpg', 'data': {'categories': ['#benchmark', '#training', '#architecture', '#dataset', '#memory', '#optimization'], 'emoji': '🔮', 'ru': {'title': 'Квантовые модели для точного прогнозирования трафика', 'desc': 'В статье рассматриваются квантово-вдохновленные рекуррентные модели, которые показывают повышенную точность прогнозирования матриц трафика по сравнению с традиционными LSTM-сетями. Модели используют адаптированные квантовые программы для быстрого обновления весов, что позволяет эффективно предсказывать матрицы с высоким разрешением. Эксперименты продемонстрировали, что новая модель G-QKAN-FWP достигает лучших результатов при меньших вычислительных затратах. Это открывает новые горизонты для проектирования систем прогнозирования с ограниченными ресурсами.'}, 'en': {'title': 'Quantum-Inspired Models Revolutionize Traffic Forecasting', 'desc': 'This paper presents quantum-inspired recurrent models, specifically gated QKAN-FWPs, which enhance forecasting accuracy for traffic matrices while being more computationally efficient than traditional LSTM networks. Traffic matrices are crucial for understanding network demand, but predicting them accurately is difficult under constraints of online network control. The study adapts QKAN-FWPs to forecast multi-step traffic matrices, demonstrating that these models can predict future traffic demands effectively. Results show that G-QKAN-FWP outperforms LSTM models in accuracy and efficiency, suggesting a new approach for resource-conscious traffic forecasting.'}}}, {'id': 'https://huggingface.co/papers/2607.01283', 'title': 'Scaling Laws for Grid-Based Approximate Nearest Neighbor Search in High Dimensions', 'url': 'https://huggingface.co/papers/2607.01283', 'abstract': 'Abstract Grid-based multiprobe algorithms demonstrate superior dimensional scaling properties compared to graph-, tree-, and partitioning-based methods for approximate nearest neighbor search, making them competitive for high-dimensional and rebuild-heavy applications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Grid-based approaches to approximate nearest neighbor (ANN) search have been absent from modern scaling analyses. We present a systematic characterization of a multiprobe grid algorithm with respect to dataset size N and dimensionality d. Our experiments reveal a previously unreported d-scaling crossover on the GloVe embedding family, in which multiprobe grid search maintains an approximately constant dimensional scaling exponent while other graph-, tree-, and partitioning-based methods exhibit degrading throughput. The advantage comes with near-linear query scaling in N, but also with lower indexing cost than competing ANN methods. Our results suggest that grid-based methods such as multiprobe grid may be competitive in rebuild-heavy or high-dimensional settings where indexing cost and dimensional robustness dictate performance. More broadly, recent work has formalized self-attention as an ANN operation. Thus, the N- and d-scaling properties of ANN algorithms may guide cost analysis of efficient transformer architectures. Code is available at: https://github.com/weiz345/MultiProbeANN.', 'score': 1, 'issue_id': 2756, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '033b6dc911817483', 'github_url': '', 'github_stars': 0, 'authors': ['Matthew J Liu', 'Wei Hang Zheng', 'Vidhan Purohit', 'Siqi Xie', 'Chieh-En Li', 'Jerry Li', 'Noah Flynn'], 'affiliations': ['Independent Researcher', 'University of California, Berkeley', 'University of Toronto, St. George', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2607.01283.jpg', 'data': {'categories': ['#benchmark', '#retrieval', '#architecture', '#dataset', '#optimization'], 'emoji': '📊', 'ru': {'title': 'Превосходство сетевых алгоритмов в поясе поиска соседей', 'desc': 'В данной статье рассматриваются алгоритмы поиска ближайших соседей на основе сетки, которые показывают лучшие свойства масштабируемости по сравнению с графовыми, древовидными и партиционными методами. Мы систематически охарактеризовали алгоритм мультипроба с точки зрения размера набора данных N и размерности d. Эксперименты показали, что мультипроба поддерживает почти постоянный масштабирование размерности при росте N, в то время как другие методы демонстрируют ухудшение производительности. Результаты указывают на преимущества использования методов на основе сетки в задаче поиска ближайших соседей при высоких размерностях и значительных затратах на перестройку индекса.'}, 'en': {'title': 'Grid-Based Methods: A New Frontier in ANN Search', 'desc': 'This paper explores grid-based multiprobe algorithms for approximate nearest neighbor (ANN) search, highlighting their advantages in high-dimensional and rebuild-heavy applications. The authors systematically analyze the performance of a multiprobe grid algorithm in relation to dataset size and dimensionality. They discover a unique scaling behavior where the multiprobe grid method maintains efficiency while other methods struggle as dimensions increase. The findings suggest that grid-based approaches could be more effective in scenarios where indexing costs and dimensionality are critical factors.'}}}, {'id': 'https://huggingface.co/papers/2607.04425', 'title': 'UI-MOPD: Multi-Platform On-Policy Distillation for Continual GUI Agent Learning', 'url': 'https://huggingface.co/papers/2607.04425', 'abstract': 'Abstract Uni-GUI dataset and UI-MOPD method enable cross-platform GUI agent training by addressing limited data and platform-specific capability degradation through multi-teacher on-policy distillation.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recent advances in multimodal foundation models and agent systems have driven GUI agents from single-platform task execution toward cross-platform interaction. However, building multi-platform GUI agents remains challenging. On one hand, high-quality and executable cross-platform interaction trajectories are still scarce, and existing data often suffer from limited platform coverage. On the other hand, different platforms exhibit distinct interaction conventions, making joint or continual training prone to behavioral pattern mixing, platform-specific capability degradation, and catastrophic forgetting. To address these challenges, we construct Uni-GUI, a high-quality cross-platform GUI interaction dataset, and propose UI-MOPD, the first method that incorporates multi-teacher on-policy distillation into continual learning for GUI agents. UI-MOPD dynamically selects a platform-specific teacher according to the current environment and transfers platform-specific behavioral priors to a shared policy through platform-conditioned distillation, enabling adaptation to new platforms while preserving capabilities on existing ones. Experiments on OSWorld and MobileWorld show that UI-MOPD achieves task success rates of 38.2% and 12.0%, respectively, demonstrating its effectiveness in balancing cross-platform capability retention and new-platform adaptation.   Project page: https://elispectre.github.io/UI-MOPD/.', 'score': 55, 'issue_id': 2776, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'df144294b20c4e10', 'github_url': '', 'github_stars': 0, 'authors': ['Niu Lian', 'Alan Chen', 'Zhehao Yu', 'Chengzhen Duan', 'Fazhan Liu', 'Hui Liu', 'Pei Fu', 'Jian Luan', 'Yaowei Wang', 'Shu-Tao Xia', 'Jinpeng Wang'], 'affiliations': ['Harbin Institute of Technology, Shenzhen', 'Peng Cheng Laboratory', 'Tsinghua Shenzhen International Graduate School, Tsinghua University', 'Xiaomi', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04425.jpg', 'data': {'categories': ['#continual_learning', '#agents', '#transfer_learning', '#dataset'], 'emoji': '🌐', 'ru': {'title': 'Многофункциональные GUI-агенты: адаптация и сохранение возможностей', 'desc': 'В статье рассматриваются проблемы, связанные с обучением многофункциональных графических интерфейсов (GUI) на разных платформах. Для решения этих проблем был создан набор данных Uni-GUI и предложен метод UI-MOPD, который использует многопедагогическую дистилляцию. Это позволяет адаптироваться к новым платформам, сохраняя при этом уже приобретенные возможности. Эксперименты показывают, что метод UI-MOPD эффективно справляется с задачей балансировки между сохранением возможностей и адаптацией к новым платформам.'}, 'en': {'title': 'Empowering Cross-Platform GUI Agents with UI-MOPD', 'desc': 'This paper introduces the Uni-GUI dataset and the UI-MOPD method to enhance cross-platform GUI agent training. It addresses the challenges of limited data and platform-specific performance issues by using multi-teacher on-policy distillation. The proposed method allows GUI agents to adapt to new platforms while maintaining their capabilities on existing ones. Experiments demonstrate that UI-MOPD effectively balances the retention of cross-platform skills and the adaptation to new environments.'}}}, {'id': 'https://huggingface.co/papers/2607.05373', 'title': 'PixWorld: Unifying 3D Scene Generation and Reconstruction in Pixel Space', 'url': 'https://huggingface.co/papers/2607.05373', 'abstract': 'Abstract PixWorld presents a unified pixel-space diffusion approach for 3D reconstruction and generation that overcomes limitations of latent-space methods through direct image-level supervision and geometry-aware feature alignment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct 3D reconstruction and generation are commonly tackled by separate paradigms: pixel-based regression for reconstruction, and latent diffusion for generation. Recent works attempt to unify them in latent space, but with notable drawbacks: the diffusion objective is defined on latent features rather than the underlying 3D representation, and both branches suffer from information loss introduced by latent encoding, while requiring a pretrained Variational Autoencoder (VAE) or Representation Autoencoder (RAE). In this paper, we reformulate these two tasks under a unified pixel-space diffusion paradigm and introduce PixWorld, a single model that jointly addresses 3D reconstruction and generation. By supervising diffusion directly on rendered images, PixWorld removes the above limitations and aligns optimization with 3D scene fidelity. Beyond photometric and perceptual supervision that operates at the 2D image level and lacks 3D geometric awareness, we further introduce a geometry perception loss that aligns rendered views with their ground truth in the geometry-aware feature space of a pretrained 3D foundation model, providing 3D structural supervision. PixWorld consistently outperforms prior latent-space generation methods and matches state-of-the-art reconstruction methods, demonstrating the superiority of a unified pixel-space approach.', 'score': 42, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '3b332251ee08ef60', 'github_url': '', 'github_stars': 0, 'authors': ['Sensen Gao', 'Zhaoqing Wang', 'Qihang Cao', 'Dongdong Yu', 'Changhu Wang', 'Jia-Wang Bian'], 'affiliations': ['AISphere', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2607.05373.jpg', 'data': {'categories': ['#diffusion', '#3d', '#architecture', '#optimization'], 'emoji': '🌌', 'ru': {'title': 'Единый подход к 3D реконструкции и генерации', 'desc': 'Статья описывает подход PixWorld, который объединяет методы диффузии в пиксельном пространстве для трехмерной реконструкции и генерации. Он преодолевает ограничения методов, основанных на латентном пространстве, благодаря прямому контролю на уровне изображений и согласованию признаков с учетом геометрии. PixWorld использует единый модельный подход, который совместно решает задачи реконструкции и генерации, улучшая соответствие с 3D сценами. Новый метод доказал свою эффективность, превзойдя предыдущие латентные методы и сопоставив результаты с современными методами реконструкции.'}, 'en': {'title': 'Revolutionizing 3D with Unified Pixel-Space Diffusion', 'desc': 'PixWorld introduces a new method for 3D reconstruction and generation using a unified pixel-space diffusion approach. This method directly supervises the diffusion process on images, avoiding the pitfalls of latent-space methods that can lose important information. By aligning the optimization with the actual 3D scene, PixWorld enhances both photometric and geometric accuracy. The results show that this approach outperforms previous methods and achieves state-of-the-art performance in 3D tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.04438', 'title': 'ResearchStudio-Reel: Automate the Last Mile of Research from Paper to Poster, Video, and Blog', 'url': 'https://huggingface.co/papers/2607.04438', 'abstract': "Abstract ResearchStudio-Reel automates research dissemination by composing specialized skills around a shared paper extractor, generating consistent and editable artifacts including posters, videos, and blogs with hard pass/fail quality gates.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Research dissemination, turning a paper into a poster, a talk video, and a blog post, is still a manual last mile. Prior automation treats each artifact in isolation that each re-extract the paper from scratch, usually ship one-way renders the author cannot reopen in PowerPoint or Word, and gates quality on soft VLM-preference scores that plateau while load-bearing sections still read as empty. We argue this last mile is best built as a composition of skills: thin agent-readable contracts that share one upstream extractor and wrap deterministic primitives in a measured-fill loop whose exits are hard pass/fail render gates. We instantiate this as ResearchStudio-Reel, five Claude Code and Codex skills organized into one shared extractor (Paper2Assets), three editable generators (Paper2Poster, Paper2Video, Paper2Blog), and one interactive convergence layer (Paper2Reel). Paper2Assets extracts each paper once into a shared bundle that can be reused by every downstream skill; The three generators produce a print-ready poster, a synchronized talk video, and a bilingual blog that stay factually consistent and round-trip through PowerPoint or Word; Paper2Reel then binds all three into a self-contained HTML viewer whose section-level clicks jump the video, slides, captions, and blog to matching content. On the Paper2Poster benchmark, our posters lead every aesthetic and information sub-criterion against both prior automated systems and single-shot frontier LLMs, surpassing the authors' own on aesthetics under two held-out VLM judges and winning overall on 84% to 93% of papers; capability audits further show that, by uniquely pairing narration-aligned on-slide highlights with a bilingual blog gated by layout-aware DOCX repair, ResearchStudio-Reel is the only pipeline to ship all three editable artifacts. Project is available at https://aka.ms/ResearchStudio", 'score': 36, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'e13e3bec2b675675', 'github_url': '', 'github_stars': 0, 'authors': ['Lingao Xiao', 'Yalun Dai', 'Yangyu Huang', 'Qihao Zhao', 'Wenshan Wu', 'Hugo He', 'Ruishuo Chen', 'Jin Jiang', 'Qianli Ma', 'Jiahuan Zhang', 'Xin Zhang', 'Ying Xin', 'Yang Ou', 'Yan Xia', 'Scarlett Li', 'Longbo Huang', 'Zhipeng Zhang', 'Yang He', 'Yap Kim Hui', 'Yan Lu'], 'affiliations': ['CFAR, A*STAR', 'Microsoft Research', 'Nanyang Technological University', 'National University of Singapore', 'Peking University', 'Shanghai Jiao Tong University', 'Tsinghua University', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04438.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#open_source', '#science'], 'emoji': '📑', 'ru': {'title': 'Автоматизация распространения научных исследований', 'desc': 'Исследование представляет собой автоматизацию распространения научных работ с помощью системы ResearchStudio-Reel, которая объединяет навыки для извлечения информации из статей. Создаются редактируемые материалы, такие как постеры, видео и блоги, которые обеспечивают качество на основе строгих критериев. В отличие от предыдущих подходов, которые рассматривали каждый артефакт отдельно, новая система использует один общий экстрактор для всех компонентов. Это позволяет обеспечить согласованность и простоту в обновлении всех созданных материалов.'}, 'en': {'title': 'Automating Research Dissemination with Consistent Artifacts', 'desc': 'ResearchStudio-Reel automates the process of turning academic papers into various formats like posters, videos, and blogs. It uses a shared paper extractor to ensure consistency and allows for editable outputs, overcoming limitations of previous automation methods. The system integrates multiple skills to create high-quality artifacts that can be reused and modified, ensuring factual accuracy across all formats. This approach not only enhances the quality of the generated materials but also allows authors to interactively engage with their work in a cohesive manner.'}}}, {'id': 'https://huggingface.co/papers/2607.04439', 'title': 'ResearchStudio-Idea: An Evidence-Grounded Research-Ideation Skill Suite from ML Conference Outcomes', 'url': 'https://huggingface.co/papers/2607.04439', 'abstract': 'Abstract ResearchStudio-Idea provides a skill suite for effective research ideation that combines literature search, novelty checking, and pattern-guided generation to produce traceable research proposals.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large language models have made research ideation increasingly accessible, yet effective idea development requires more than generating candidate directions. Researchers must ground a problem in current literature, identify meaningful bottlenecks, differentiate from existing solutions, and evaluate risks before committing to implementation. We present ResearchStudio-Idea as a reusable skill suite for this first mile of research ideation. The suite includes Paper-Search, a standalone multi-source literature search skill; Scoop-Check, a standalone prior-art collision checker for novelty claims; and IdeaSpark, the end-to-end skill that composes evidence grounding, pattern-guided generation, collision retrieval, audit, and idea-card rendering into one workflow. IdeaSpark is constructed from a corpus of 1,947 machine learning conference papers collected from ICLR, ICML, and NeurIPS between 2021 and 2025, including Oral papers, a separately tracked high-citation subset, and rejected submissions. Analysis of these outcomes reveals 31 recurring ideation sub-patterns, consolidated into 15 reusable ideation patterns. Each pattern is operationalized as a structured card containing research contexts, bottleneck types, differentiation strategies, supporting precedents, and common failure modes. Given a research problem and an evidence bundle, IdeaSpark evaluates evidence readiness, reconstructs the surrounding research context, identifies unresolved bottlenecks, selects relevant patterns, instantiates one candidate direction, retrieves potentially conflicting prior work, and performs outcome-informed auditing. This workflow transforms reusable ideation patterns into traceable research proposals. Blind automated-judge evaluations show that IdeaSpark consistently produces stronger research proposals than no-skill and generic-skill baselines while maintaining competitive novelty.', 'score': 34, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': '60fd8c420ce99230', 'github_url': '', 'github_stars': 0, 'authors': ['Qihao Zhao', 'Yangyu Huang', 'Yalun Dai', 'Lingao Xiao', 'Jianjun Gao', 'Xin Zhang', 'Wenshan Wu', 'Scarlett Li', 'Yang He', 'Yan Lu', 'Yap Kim Hui'], 'affiliations': ['CFAR, A*STAR', 'Microsoft Research', 'Nanyang Technological University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.04439.jpg', 'data': {'categories': ['#survey', '#dataset', '#multimodal', '#data', '#science'], 'emoji': '🧠', 'ru': {'title': 'Инновационные идеи с ResearchStudio-Idea', 'desc': 'ResearchStudio-Idea представляет собой набор инструментов для эффективной генерации идей в исследовательской деятельности, который сочетает в себе поиск литературы, проверку новизны и генерацию идей с учетом паттернов. Он помогает исследователям не только генерировать идеи, но и закреплять их в текущей литературе, выявлять узкие места и оценивать риски. Основной компонент, IdeaSpark, использует данные из более чем 1900 статей по машинному обучению, чтобы сформировать структурированные карты идей. Этот подход позволяет преобразовать паттерны генерации идей в отслеживаемые исследовательские предложения.'}, 'en': {'title': 'Transforming Research Ideas into Traceable Proposals', 'desc': 'ResearchStudio-Idea is a skill suite designed to enhance research ideation by integrating literature search, novelty checking, and structured idea generation. It helps researchers ground their problems in existing literature, identify key challenges, and differentiate their proposals from prior work. The suite includes tools like Paper-Search for literature retrieval, Scoop-Check for assessing novelty, and IdeaSpark for generating comprehensive research proposals. By utilizing a corpus of machine learning papers, IdeaSpark identifies recurring ideation patterns and transforms them into traceable proposals, demonstrating superior performance in generating quality research ideas.'}}}, {'id': 'https://huggingface.co/papers/2607.04033', 'title': 'OmniOpt: Taxonomy, Geometry, and Benchmarking of Modern Optimizers', 'url': 'https://huggingface.co/papers/2607.04033', 'abstract': 'Abstract OmniOpt presents a unified framework for optimizer selection in large-scale model training by combining meta-pipeline transformations, norm-constrained linear minimization oracles, and a cross-domain benchmark to systematically analyze optimizer families and their trade-offs across different training objectives and model scales.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Optimizer selection for large-scale model training has become a system-level design decision constrained jointly by compute, memory, tuning budget, and task diversity, yet the landscape of over one hundred methods remains fragmented. We therefore present OmniOpt, a unified survey and benchmark cookbook of optimizers for the research community. OmniOpt rests on four coupled components. First, we treat every optimizer update as a structured transformation through a five-stage meta-pipeline, and show that most methods engage only one or two of these stages. Second, we use norm-constrained linear minimization oracles (LMOs) to unify different optimizers. Third, these two views ground a dual-dimension taxonomy, one dimension assigning each method to a mechanism family and the other recording the measurable training objectives it aims to improve. Fourth, and at the core of this paper, we instantiate the full taxonomy in a unified cross-domain benchmark spanning representative optimizers, model scales, and training regimes from language model pretraining to image classification, systematically analyzing each method family across multiple effect objectives and laying out their trade-offs. OmniOpt thus supplies the research community with an operational coordinate system for selecting optimizers under explicit mechanism and objective assumptions, and charts a direction for the future development of the optimizer community.', 'score': 31, 'issue_id': 2776, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': 'add1731367ae6681', 'github_url': '', 'github_stars': 0, 'authors': ['Siyuan Li', 'Jiabao Pan', 'Yumou Liu', 'Zhuoli Ouyang', 'Xin Jin', 'Xinglong Xu', 'Jingxuan Wei', 'Shengye Pang', 'Jintao Che', 'Xuanhe Zhou', 'Conghui He', 'Cheng Tan'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'Shanghai University', 'Southern University of Science and Technology', 'UCAS', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04033.jpg', 'data': {'categories': ['#survey', '#training', '#optimization', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'OmniOpt: универсальный выбор оптимизаторов для обучения моделей', 'desc': 'Статья представляет OmniOpt — универсальную платформу для выбора оптимизаторов при обучении крупных моделей. Она объединяет преобразования мета-конвейера, нормы-ограниченные линейные минимизационные оракулы и кросс-доменные бенчмарки для систематического анализа семейств оптимизаторов. OmniOpt предлагает единую таксономию, рассматривающую различные подходы к оптимизации и их влияние на задачи обучения. Этот инструмент позволяет исследователям более эффективно выбирать оптимизаторы с учетом механизмов и целей задач.'}, 'en': {'title': 'Streamlining Optimizer Selection for Large-Scale Training', 'desc': 'OmniOpt introduces a comprehensive framework for selecting optimizers in large-scale model training. It combines various techniques, including meta-pipeline transformations and norm-constrained linear minimization oracles, to analyze different optimizer families. The framework categorizes optimizers based on their mechanisms and the training objectives they target, providing a structured approach to understanding their trade-offs. By offering a unified benchmark, OmniOpt aids researchers in making informed decisions about optimizer selection across diverse tasks and model scales.'}}}, {'id': 'https://huggingface.co/papers/2607.02642', 'title': 'GigaWorld-1: A Roadmap to Build World Models for Robot Policy Evaluation', 'url': 'https://huggingface.co/papers/2607.02642', 'abstract': 'Abstract World models for robotic policy evaluation are systematically studied through a new benchmark, revealing that long-horizon rollout consistency and robot-specific controllability are more important than short-term visual realism for reliable policy assessment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Evaluating embodied robot foundation models remains a critical bottleneck; unlike large language models efficiently assessed via digital benchmarks, robotic policies require slow, costly real-world rollouts limited by hardware and human supervision, which has driven interest in world models as surrogate policy evaluators, yet the key properties that make a world model reliable for policy assessment remain poorly understood. This work presents a systematic study of world models for robotic policy evaluation and introduces WMBench, a benchmark constructed from real-robot teleoperation data and matched policy rollouts covering diverse manipulation tasks to enable controlled comparisons across model families, action encodings, rollout horizons, and evaluation metrics. Using WMBench, we analyze 7 video world models, 4 action representation schemes, and over 324,000 simulated policy rollouts paired with real robot executions, further enriching our analysis with large-scale community submissions from the CVPR 2026 GigaBrain Challenge, curated synthetic trajectories, and a training videos spanning more than 12,000 hours. Our experiments deliver three core insights: evaluator quality is dominated by long-horizon, action-faithful rollout consistency rather than short-term visual realism; pretraining gains stem not only from data scale but from balancing general world knowledge with robot-specific controllability; and architectural choices including action encoding, memory design, and evaluator-focused post-training strongly determine alignment with real-world robot behavior. Drawing on these results, we derive a practical design roadmap and realize it in GigaWorld-1, a world model specially optimized for policy evaluation, and we fully release our code, models, datasets, and toolkits to advance scalable evaluation research for embodied foundation models.', 'score': 29, 'issue_id': 2775, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'a93b4fe1650940f6', 'github_url': '', 'github_stars': 0, 'authors': ['GigaWorld Team', 'Angyuan Ma', 'Boyuan Wang', 'Bohan Li', 'Chaojun Ni', 'Guo Li', 'Guan Huang', 'Guosheng Zhao', 'Hao Li', 'Hengtao Li', 'Jingyu Liu', 'Jiwen Lu', 'Qiuping Deng', 'Tingdong Yu', 'Xuancheng Xu', 'Xinyu Zhou', 'Xiuwei Xu', 'Xinze Chen', 'Xiaofeng Wang', 'Xiaoyu Tian', 'Yang Wang', 'Yifan Chang', 'Yukun Zhou', 'Yun Ye', 'Zhenyu Wu', 'Zhanqian Wu', 'Zheng Zhu'], 'affiliations': ['GigaAI', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02642.jpg', 'data': {'categories': ['#survey', '#agent_memory', '#dataset', '#optimization', '#architecture', '#benchmark', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Долгосрочная надежность важнее краткосрочной реалистичности', 'desc': 'В статье исследуется применение мироустройств для оценки роботизированной политики через новый бенчмарк WMBench. Установлено, что важнее долгосрочная согласованность развертывания и управляемость, специфичная для робота, чем краткосрочная визуальная реалистичность. Также обсуждаются ключевые свойства мироустройств, влияющие на их надежность в оценке политик. В результате работы была разработана архитектура GigaWorld-1, специально оптимизированная для оценки политик, и представлены все данные и инструменты для дальнейшего исследования.'}, 'en': {'title': 'Prioritizing Long-Horizon Consistency for Robotic Policy Evaluation', 'desc': 'This paper investigates the effectiveness of world models in evaluating robotic policies, emphasizing the importance of long-horizon rollout consistency and robot-specific controllability over short-term visual realism. It introduces WMBench, a benchmark designed from real-robot data to facilitate comparisons across various model families and evaluation metrics. The study analyzes multiple video world models and action representation schemes, revealing that the quality of evaluators is significantly influenced by their ability to maintain action fidelity over longer horizons. The findings lead to the development of GigaWorld-1, a world model optimized for policy evaluation, with all resources made publicly available to enhance research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.05247', 'title': 'Vision Pretraining for Dense Spatial Perception', 'url': 'https://huggingface.co/papers/2607.05247', 'abstract': 'Abstract Boundary modeling enables dense spatial perception by learning sub-pixel representations that enhance depth estimation and support embodied AI applications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Dense spatial perception is essential for physical intelligence, where visual systems are expected to recover structured, metric, and actionable representations from pixel observations. Modern visual foundation models tend to prioritize semantic invariance, often at the expense of detailed spatial understanding. In this work, we study vision pretraining through a boundary-centric lens, motivated by the premise that boundaries and shape discontinuities offer essential cues for perceiving geometric properties. Concretely, we propose masked boundary modeling, a self-supervised paradigm that dynamically learns sub-pixel boundary representations and subsequently leverages the discovered boundary-bearing tokens as masked targets to facilitate dense visual token learning. By scaling this framework, we develop LingBot-Vision and demonstrate its efficacy across a diverse set of downstream vision tasks with DINOv3 as a strong baseline. Remarkably, LingBot-Vision drives the progression from LingBot-Depth 1.0 to LingBot-Depth 2.0 for depth completion, and thereby yields enhanced depth estimation, a key pillar for embodied artificial intelligence. Our findings reveal that boundary modeling goes beyond simple line segments and instead serves as a scalable pretraining principle for learning spatially structured visual representations.', 'score': 27, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'ecadf887c94f4549', 'github_url': '', 'github_stars': 0, 'authors': ['Zelin Fu', 'Bin Tan', 'Changjiang Sun', 'Shaohui Liu', 'Kecheng Zheng', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Nan Xue'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.05247.jpg', 'data': {'categories': ['#agents', '#agi', '#3d', '#games'], 'emoji': '🔍', 'ru': {'title': 'Моделирование границ для глубокого пространственного восприятия', 'desc': 'В этой статье рассматривается моделирование границ как способ улучшения пространственного восприятия для задач глубинногоEstimations и воплощенного ИИ. Мы предлагаем метод masked boundary modeling, который динамически обучает субпиксельные представления границ. Это позволяет эффективно извлекать визуальные токены и улучшает качество оценки глубины. Исследования показывают, что моделирование границ является важным принципом предварительного обучения для создания структурированных визуальных представлений.'}, 'en': {'title': 'Enhancing Depth Estimation through Boundary Modeling', 'desc': 'This paper introduces a method called masked boundary modeling to improve depth estimation in visual systems. By focusing on boundaries and shape discontinuities, the approach enhances the learning of sub-pixel representations, which are crucial for understanding spatial structures. The authors present LingBot-Vision, a framework that utilizes these boundary representations to boost performance in various vision tasks. The results show that this boundary-centric approach significantly advances depth completion, which is vital for embodied AI applications.'}}}, {'id': 'https://huggingface.co/papers/2607.02646', 'title': 'EVA-Client: A Unified Data Collection, Inference, and Deployment Framework for Embodied Policies on Real Robots', 'url': 'https://huggingface.co/papers/2607.02646', 'abstract': 'Abstract EVA-Client is an open-source framework that unifies real-robot policy deployment, data collection, and evaluation through a component-decoupled architecture with inspectable execution workflows.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present EVA-Client, an open-source framework for deployment, data collection, and evaluation of trained manipulation policies on real robots. Sitting between a policy server and the physical hardware, EVA-Client unifies the real-robot stages of the policy iteration loop within a single codebase. It makes three contributions. First, a component-decoupled architecture in which robot backends, inference strategies, and transport middlewares form an orthogonal grid: adding a robot or a strategy touches only its own layer. Second, inspectable execution through Debug, Collect, and Eval workflows, with modes ranging from open-loop simulation to continuous real-time control. Third, every evaluation run doubles as a data collection, recording full rollouts in training-ready format alongside exhaustive logs and a side-by-side comparison viewer, so each evaluation feeds the next round of training rather than ending as an unrecorded impression. EVA-Client further consolidates major real-time inference strategies, synchronous and asynchronous execution, ACT-style temporal ensembling, Real-Time Chunking, and a naive-async ablation baseline, behind a single configuration surface.', 'score': 21, 'issue_id': 2776, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'bb96105e747c3109', 'github_url': '', 'github_stars': 0, 'authors': ['Heqing Yang', 'Yang Yi', 'Liyao Wang', 'Linqing Zhong', 'Donglin Yang', 'Ruipu Wu', 'Zitong Bai', 'Fengjiao Chen', 'Manyuan Zhang', 'Linjiang Huang', 'Si Liu'], 'affiliations': ['CoLab, Beihang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02646.jpg', 'data': {'categories': ['#agents', '#training', '#open_source', '#optimization', '#robotics', '#data'], 'emoji': '🤖', 'ru': {'title': 'EVA-Client: единая платформа для работы с реальными роботами', 'desc': 'EVA-Client — это открытая платформа для развертывания, сбора данных и оценки обученных политик манипуляции на реальных роботах. Она объединяет этапы итерационного цикла политики, обеспечивая модульную архитектуру, где добавление нового робота или стратегии затрагивает лишь соответствующий слой. EVA-Client предлагает инспектируемые рабочие процессы, позволяя отлаживать, собирать данные и оценивать действия робота в реальном времени. Каждая оценка также служит для сбора данных, формируя полные впечатления для следующего раунда обучения.'}, 'en': {'title': 'Streamlining Robot Policy Deployment and Evaluation', 'desc': 'EVA-Client is an open-source framework designed to streamline the deployment, data collection, and evaluation of manipulation policies on real robots. It features a component-decoupled architecture that allows for easy integration of different robot backends and inference strategies without affecting other components. The framework includes inspectable execution workflows that support various modes, from simulation to real-time control, enhancing the debugging and evaluation process. Additionally, each evaluation run serves as a data collection opportunity, ensuring that insights gained feed back into the training loop for continuous improvement.'}}}, {'id': 'https://huggingface.co/papers/2607.04443', 'title': 'Wan-Streamer v0.2: Higher Resolution, Same Latency', 'url': 'https://huggingface.co/papers/2607.04443', 'abstract': "Abstract Wan-Streamer v0.2 enhances audio-visual interaction by increasing visual resolution while maintaining low latency through optimized thinker-performer architecture with multi-GPU parallel processing.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present Wan-Streamer v0.2, a latency-preserving upgrade of the native-streaming, end-to-end audio-visual interaction model. v0.2 keeps the v0.1 modeling formulation, but raises the interactive output stream from 192x336 to 640x368 while preserving approximately 200 ms model-side signal-to-signal latency at 25 FPS. The higher-resolution stream supports scene-grounded mid-shot agents whose posture, gaze, hands, nearby objects, and local scene layout remain legible during real-time conversation. To support the larger visual stream without adding user-visible delay, v0.2 keeps the thinker as a single-GPU low-latency path for streaming perception, the short language/state Transformer pass that builds the generation cache, and final decoding. The performer becomes a multi-GPU Ulysses-style context-parallel group for the expensive next-unit latent generation. Each performer rank writes incoming K/V into a pre-sharded local cache. The long high-resolution latent video sequence is split across ranks for denoising and gathered through Ulysses communication, while the much shorter audio latent sequence is generated without sequence sharding. In this split, the thinker's language/state computation reaches the performer only as K/V conditioning, so no separate language sequence has to be communicated inside the performer group. This concentrates additional hardware on visual generation while preserving the compact thinker-performer boundary, keeping total remote interaction latency at approximately 550 ms when a 350 ms bidirectional network budget is included.", 'score': 19, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': '2c2747949a87b511', 'github_url': '', 'github_stars': 0, 'authors': ['Lianghua Huang', 'Zhi-Fan Wu', 'Yupeng Shi', 'Wei Wang', 'Mengyang Feng', 'Junjie He', 'Chen-Wei Xie', 'Yu Liu', 'Jingren Zhou', 'Ang Wang', 'Bang Zhang', 'Baole Ai', 'Chen Liang', 'Cheng Yu', 'Chongyang Zhong', 'Jinwei Qi', 'Kai Zhu', 'Pandeng Li', 'Peng Zhang', 'Wenyuan Zhang', 'Xinhua Cheng', 'Yitong Huang', 'Yun Zheng', 'Yuxiang Bao', 'Yuzheng Wang', 'Zoubin Bi'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.04443.jpg', 'data': {'categories': ['#multimodal', '#audio', '#architecture', '#optimization'], 'emoji': '🎤', 'ru': {'title': 'Новая эра аудио-визуального взаимодействия!', 'desc': 'Статья описывает обновление Wan-Streamer v0.2, которое улучшает взаимодействие аудио и видео за счёт повышения разрешения изображения при низкой задержке. Модель сохраняет формулировку v0.1, но увеличивает поток до 640x368 пикселей и поддерживает задержку около 200 мс при 25 FPS. Это позволяет агентам в сцене сохранять читаемость позы, взгляда и объектов вокруг во время реального разговора. Архитектура использует параллельную обработку на нескольких GPU для оптимизации генерации контента без увеличения задержек для пользователя.'}, 'en': {'title': 'Enhancing Visuals Without the Wait', 'desc': "Wan-Streamer v0.2 improves audio-visual interaction by enhancing visual resolution while keeping latency low. It maintains the original model's structure but increases the output resolution significantly, allowing for clearer mid-shot agents during real-time conversations. The architecture utilizes a single-GPU thinker for low-latency perception and a multi-GPU performer for generating high-resolution visuals. This design ensures that the overall interaction latency remains manageable, even with the increased visual complexity."}}}, {'id': 'https://huggingface.co/papers/2607.04988', 'title': 'InternVLA-A1.5: Unifying Understanding, Latent Foresight, and Action for Compositional Generalization', 'url': 'https://huggingface.co/papers/2607.04988', 'abstract': 'Abstract InternVLA-A1.5 integrates pretrained vision-language models with future prediction in latent space to enable efficient robot manipulation with preserved semantics and long-horizon execution.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Unified models for robot manipulation aim to equip one policy with both the semantic priors of pretrained VLMs and the physical dynamics learned through future prediction. In practice, existing designs tend to erode the semantics of the pretrained backbone, suffer interference among heterogeneous objectives, and learn future prediction from scratch in pixel space, leaving the dynamics priors of pretrained video generators unexploited. We present InternVLA-A1.5, which builds the policy on a native VLM backbone that keeps training on VQA and subtask prediction, and attaches a lightweight unified expert for continuous action generation. Future prediction is recast as a latent-querying problem, where a small set of learnable foresight tokens condenses the task-relevant future into a compact latent code under the supervision of a frozen pretrained video generation model, so the policy inherits world-model dynamics priors without ever learning pixel-level generation. The video branch is discarded at inference, keeping real-time control. Pretrained on 1.2M robot episodes and 3M multimodal samples, InternVLA-A1.5 achieves the best overall results on all six simulation benchmarks. In the real world, the preserved semantics deliver the strongest compositional generalization on held-out instruction bindings, and the two designs together sustain long-horizon execution.', 'score': 16, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '6ce96e73e471dc5b', 'github_url': '', 'github_stars': 0, 'authors': ['Haoxiang Ma', 'Junhao Cai', 'Xiaoxu Xu', 'Hao Li', 'Yuyin Yang', 'Yang Tian', 'Jiafei Cao', 'Hongrui Zhu', 'Zherui Qiu', 'Zhaxizhuoma', 'Yuqiang Yang', 'Jiaqi Peng', 'Xueyuan Wei', 'Yangkun Zhu', 'Jiahao Jiang', 'Xing Gao', 'Hanqing Wang', 'Feng Yuan', 'Kailin Li', 'Xueyue Zhu', 'Tai Wang', 'Yan Ding', 'Jiangmiao Pang', 'Jia Zeng', 'Jingjing Zhang', 'Bowen Zhou', 'Yao Mu', 'Chunhua Shen', 'Weinan Zhang'], 'affiliations': ['Physical Intelligence Team, Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.04988.jpg', 'data': {'categories': ['#agents', '#agi', '#multimodal', '#robotics', '#optimization', '#benchmark', '#games'], 'emoji': '🤖', 'ru': {'title': 'Инновационная модель для управления роботами', 'desc': 'Статья описывает модель InternVLA-A1.5, которая объединяет предобученные модели обработки изображений и текста с предсказанием будущего для эффективного управления роботами. Она сохраняет семантику и обеспечивает возможность длительного выполнения задач. Модель использует легкий унифицированный эксперт для генерации непрерывных действий и переопределяет предсказание будущего как задачу латентного запроса. В результате, InternVLA-A1.5 демонстрирует лучшие результаты на шести симуляционных тестах и обеспечивает надежную обобщающую способность в реальном мире.'}, 'en': {'title': 'Efficient Robot Manipulation with Semantic Preservation', 'desc': 'InternVLA-A1.5 combines pretrained vision-language models with future prediction to enhance robot manipulation while maintaining semantic understanding. It utilizes a unified policy that integrates semantic knowledge from pretrained models and physical dynamics learned through future predictions. By treating future prediction as a latent-querying problem, it efficiently condenses relevant future information into a compact latent code, leveraging pretrained video generation dynamics without pixel-level learning. This approach results in superior performance across simulation benchmarks and strong generalization in real-world tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.04605', 'title': 'Do All Visual Tokens Matter Equally? Object-Evidence Preserving Token Merging for Vision-Language Retrieval', 'url': 'https://huggingface.co/papers/2607.04605', 'abstract': 'Abstract Object-aware token merging framework SaMer compresses image-side tokens while preserving query-selectable visual evidence, achieving significant storage reduction and improved retrieval performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Multi-vector vision-language retrieval preserves fine-grained visual evidence through maximum-similarity late interaction, but dense image-side tokens make storage and scoring expensive. Existing token compression methods reduce this cost, yet they can remove or collapse object- and region-level evidence that future query tokens may need to select. We propose SaMer, an object-aware token merging framework that compresses image-side post-projector tokens into K representative centroids while preserving the original late-interaction interface. SaMer uses object annotations only during training as a merge prior to discourage cross-instance mixing, requires no ground-truth bounding boxes or detectors at inference time, and adapts only the shared projection layer with frozen vision and language backbones. With K=64, SaMer removes more than 93% of image-side tokens and reduces ColPali storage by 16.09times, while improving R@1 on Flickr30K and MSCOCO. These gains arise because object-aware merging preserves query-selectable object evidence that pruning or feature-only pooling can remove or collapse. SaMer also outperforms compression baselines and shows stronger phrase-level grounding, suggesting that efficient multi-vector retrieval depends not only on reducing token count, but on preserving the evidence future query tokens need to select.', 'score': 13, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'fb8c08df9018d651', 'github_url': '', 'github_stars': 0, 'authors': ['Suhyeong Park', 'Junha Jung', 'Jungwoo Park', 'Jaewoo Kang'], 'affiliations': ['AIGEN Sciences Inc.', 'Korea University', 'The Catholic University of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.04605.jpg', 'data': {'categories': ['#compression', '#retrieval'], 'emoji': '🖼️', 'ru': {'title': 'Эффективное сжатие токенов с сохранением визуальных доказательств', 'desc': 'В статье представлен метод SaMer, который сжимает токены на стороне изображения, сохраняя визуальные доказательства, доступные для выбора запросами. Этот подход значительно уменьшает объем хранимых данных и улучшает производительность поиска. Метод использует аннотации объектов только на этапе обучения, что предотвращает смешивание экземпляров, и не требует использования граунд-трастовых ограничений при inference. SaMer позволяет удалить более 93% токенов, улучшая качество поиска на таких датасетах, как Flickr30K и MSCOCO.'}, 'en': {'title': 'Efficient Token Compression with Object Awareness', 'desc': 'The paper introduces SaMer, an object-aware token merging framework designed to compress image-side tokens while maintaining essential visual evidence for queries. This method significantly reduces storage requirements and enhances retrieval performance by merging tokens into representative centroids without losing critical object information. SaMer operates with object annotations only during training, allowing it to function without ground-truth bounding boxes during inference. The results demonstrate that SaMer not only decreases the number of tokens but also improves the accuracy of phrase-level grounding in vision-language tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.05061', 'title': 'KVpop -- Key-Value Cache Compression with Predictive Online Pruning', 'url': 'https://huggingface.co/papers/2607.05061', 'abstract': 'Abstract KVpop learns optimal key-value cache eviction by directly supervising keep-or-drop decisions using future-attention targets, achieving high performance with reduced memory usage.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Key-value (KV) cache growth is a major bottleneck in autoregressive decoding, as memory and bandwidth scale linearly with context length. Existing KV eviction methods often rely on static heuristics or proxy scores, which poorly track future token utility and cause brittle eviction as relevance shifts. To address this, we introduce KVpop, which learns a fixed-budget KV eviction policy by directly supervising the keep-or-drop decision. The scorer is trained against a novel future-attention target, computed efficiently without materializing dense attention maps. We further introduce a delayed memory-based scorer that, uniquely among learned eviction methods, defers scoring for a fixed number of steps to exploit near-future context. On AIME and HMMT mathematical reasoning, KVpop retains 98% of full-attention performance on Qwen3-4B at 75% KV cache compression and 97% at 88% compression, consistently outperforming established eviction baselines. Qwen3-8B shows even stronger results, reaching near-full teacher performance. These results show that supervising eviction with future-attention signals cuts memory costs while maintaining quality.', 'score': 12, 'issue_id': 2777, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '381ad61d6cbba1b2', 'github_url': '', 'github_stars': 0, 'authors': ['Lukas Hauzenberger', 'Niklas Schmidinger', 'Anamaria-Roberta Hartl', 'David Stap', 'Thomas Schmied', 'Sebastian Böck', 'Günter Klambauer', 'Sepp Hochreiter'], 'affiliations': ['Johannes Kepler University Linz, Austria', 'NXAI'], 'pdf_title_img': 'assets/pdf/title_img/2607.05061.jpg', 'data': {'categories': ['#memory', '#optimization', '#inference', '#compression'], 'emoji': '🔑', 'ru': {'title': 'Оптимизация кэша ключ-значение для повышения производительности', 'desc': 'Статья посвящена новому методу оптимизации эвакуации кэш-памяти ключ-значение (KV) в задачах автогрессивного декодирования. Метод под названием KVpop обучается на основе будущих целевых показателей, что позволяет лучше предсказывать необходимость хранения или удаления токенов. В отличие от существующих статических методов, KVpop показывает высокую производительность при значительной экономии памяти, сохраняя до 98% качества при сжатии кэша на 75%. Это делает его эффективным решением для задач, связанных с обработкой больших объемов данных.'}, 'en': {'title': 'Optimizing Cache Eviction with Future-Attention', 'desc': 'The paper introduces KVpop, a method for optimizing key-value cache eviction in machine learning models. It directly supervises decisions on whether to keep or drop cache entries using future-attention targets, which helps improve performance while reducing memory usage. Unlike traditional methods that rely on static heuristics, KVpop adapts to changes in token relevance by learning from future context. The results demonstrate that KVpop can maintain high performance even with significant cache compression, outperforming existing eviction strategies.'}}}, {'id': 'https://huggingface.co/papers/2607.05352', 'title': 'Multiplayer Interactive World Models with Representation Autoencoders', 'url': 'https://huggingface.co/papers/2607.05352', 'abstract': "Abstract A large-scale multiplayer world model trained on extensive gameplay data demonstrates stable long-horizon rollouts in a complex physics-based environment while maintaining coherence across multiple agents' actions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce the first multiplayer world model for highly dynamic environments governed by complex physical interactions. Whereas single-player world models treat the other agents as part of the environment, ours conditions on the action streams of multiple agents, learning to attribute changes in the scene to the correct player and to stay coherent under arbitrary combinations of their actions. We study this problem in the game of Rocket League, where players compete and cooperate under fast, tightly coupled dynamics. Trained on 10,000 hours of gameplay collected with publicly available bots, our 5-billion-parameter latent diffusion model generates four-player matches in real time, producing 20 frames per second on a single Nvidia B200 GPU. Although trained only on short clips, its rollouts stay stable far beyond the training horizon: distributional quality holds steady out to five minutes, the longest horizon we measure, and in practice we observe rollouts continuing for hours with no sign of collapse. We systematically investigate the central design choices: the video codec, the generative objective, and the multiplayer conditioning scheme. In addition, we characterize how behavior changes with model and data scale, including the capabilities that emerge and the failure modes that persist. We further develop targeted evaluations that probe the model's physical understanding rather than visual appearance alone. To support continued research on multiplayer world models, we release our dataset, our full training and inference codebase, and a live demo.", 'score': 10, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '760f7398ee64af0f', 'github_url': '', 'github_stars': 0, 'authors': ['Anthony Hu', 'Václav Volhejn', 'Adrien Ramanana Rahary', 'Chris Mulder', 'Aditya Makkar', 'Amélie Royer', 'Manu Orsini', 'Alyx Liao', 'Adam Jelley', 'Eloi Alonso', 'Florian Laurent', 'Fredrik Norén', 'James Swingos', 'Jan Hünermann', 'Kent Rollins', 'Lucas Hosseini', 'Matthieu Le Cauchois', 'Maxim Peter', 'Pim de Witte', 'Tim Brown', 'Vincent Micheli', 'Moritz Böhle', 'Gabriel de Marmiesse', 'Viktoriia Sharmanska', 'Lucia Specia', 'Michael Black', 'Patrick Pérez'], 'affiliations': ['Epic Games'], 'pdf_title_img': 'assets/pdf/title_img/2607.05352.jpg', 'data': {'categories': ['#agents', '#training', '#rl', '#open_source', '#diffusion', '#games', '#dataset'], 'emoji': '⚽', 'ru': {'title': 'Инновационная мультиплеерная модель мира для динамических игр', 'desc': 'В данной статье представлен новый мультиплеерный мир модель, обученная на большом объеме игровых данных, которая демонстрирует стабильные долгосрочные результаты в сложной физической среде. Эта модель учитывает действия нескольких агентов и обеспечивает согласованность их взаимодействий. Исследование проводилось на примере игры Rocket League, где игроки соревнуются и сотрудничают. Модель способна генерировать матчи в реальном времени с высоким качеством и стабильностью, даже при долгосрочных интервалах.'}, 'en': {'title': 'Revolutionizing Multiplayer Dynamics with Stable World Models', 'desc': 'This paper presents a novel multiplayer world model designed for dynamic environments with complex physics, specifically applied to the game Rocket League. Unlike traditional single-player models, this approach conditions on the actions of multiple agents, allowing for coherent interactions and scene changes attributed to the correct player. The model, trained on extensive gameplay data, demonstrates impressive stability in long-horizon rollouts, maintaining quality for up to five minutes and even longer in practice. The authors also explore key design choices and provide resources for further research in multiplayer world modeling.'}}}, {'id': 'https://huggingface.co/papers/2607.04428', 'title': 'dOPSD: On-Policy Self-Distillation for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2607.04428', 'abstract': "Abstract Diffusion large language models face challenges in reasoning enhancement through post-training, but a novel on-policy self-distillation method using internal denoising trajectories improves mathematical reasoning and code generation performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Diffusion large language models (dLLMs) generate text by iteratively denoising a masked sequence, offering a parallel alternative to autoregressive models, but eliciting strong reasoning through post-training remains difficult: supervised fine-tuning is off-policy and suffers from exposure bias, while reinforcement learning gives only sparse, sequence-level rewards and is hard to apply without tractable sequence likelihoods. On-policy self-distillation (OPSD) offers a promising alternative, using one model as both student and teacher to provide dense, token-level, on-policy supervision, but its effectiveness hinges on giving the teacher privileged information (PI) - typically an instance-specific ground-truth reference unavailable at inference - so the student ends up distilling a weak PI-free consensus policy that yields little improvement on dLLM reasoning. We introduce dOPSD, which instead derives the teacher's privilege directly from the student's own denoising trajectory, evaluating masked positions using later, more-decoded steps of that same trajectory rather than an external label, so the teacher's advantage emerges from the model's own decoding process; on Dream and LLaDA, dOPSD improves both in-domain math reasoning and out-of-domain code generation, outperforming supervised and on-policy baselines.", 'score': 10, 'issue_id': 2776, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'edf1485217fa46f3', 'github_url': '', 'github_stars': 0, 'authors': ['Phuong Tuan Dat', 'Qi Li', 'Xinchao Wang'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.04428.jpg', 'data': {'categories': ['#reasoning', '#training', '#math', '#rl', '#optimization', '#diffusion'], 'emoji': '💡', 'ru': {'title': 'Новый подход к самодистилляции для улучшения reasoning в языковых моделях', 'desc': 'В работе предложен новый метод самодистилляции под названием dOPSD, который улучшает способность больших языковых моделей к математическому рассуждению и генерации кода. Этот метод использует внутренние траектории денойзинга, позволяя модели черпать информацию из собственных результатов. В отличие от традиционных методов, dOPSD обеспечивает более плотный уровень супервизии, что способствует улучшению качества выводов. Полученные результаты показывают значительное превосходство над существующими методами, такими как управляемая дополнительная настройка.'}, 'en': {'title': 'Empowering dLLMs with Self-Distillation for Better Reasoning', 'desc': "This paper presents a new method called dOPSD that enhances reasoning in diffusion large language models (dLLMs) through on-policy self-distillation. Unlike traditional methods that rely on external labels, dOPSD uses the model's own denoising trajectory to provide supervision, allowing it to learn from its own decoding process. This approach helps improve mathematical reasoning and code generation performance by leveraging token-level feedback. The results show that dOPSD outperforms existing supervised and on-policy methods in various tasks."}}}, {'id': 'https://huggingface.co/papers/2607.03973', 'title': 'MANCE: Manifold Aware Concept Erasure', 'url': 'https://huggingface.co/papers/2607.03973', 'abstract': 'Abstract Manifold constraint hypothesis enables improved concept erasure by projecting updates onto estimated representation manifolds, achieving state-of-the-art results in nonlinear concept removal.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Concept erasure aims to remove a target concept from a representation while preserving the other information encoded in it. This is difficult because representations encode many concepts that are often correlated with the erasure target, so removing the target risks damaging them. We propose the Manifold Constraint Hypothesis (MCH): if natural representations concentrate on a structured, lower-dimensional manifold, then interventions should be constrained to that manifold and better preserve other information encoded in the representation during interventions. We instantiate MCH in a new concept erasure method: MANifold aware Concept Erasure (MANCE). MANCE performs iterative updates to the representations using signals from a classifier that predicts a target concept. We estimate the manifold using representations obtained from natural inputs, and then we project the concept removal update to the estimated manifold. We perform extensive evaluation on 119 settings spanning text and vision, including 13 language models, three NLP concepts, and 40 CelebA-CLIP attributes. Employing MANCE on top of previous methods shows consistent improved leakage results. We also introduce MANCE+ and MANCE++, which prepend a closed-form erasure algorithm before employing MANCE, achieving better leakage--surgicality tradeoffs relative to matched full-space updates. MANCE++, our best method, achieves state-of-the-art results on nonlinear concept erasure. These results support MCH in the erasure setting: interventions should be constrained to the natural representation manifold.', 'score': 8, 'issue_id': 2777, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': 'f9e0970cf22f9bf3', 'github_url': '', 'github_stars': 0, 'authors': ['Matan Avitan', 'Yoav Goldberg', 'Yanai Elazar'], 'affiliations': ['Allen Institute for Artificial Intelligence', 'Bar-Ilan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.03973.jpg', 'data': {'categories': ['#interpretability', '#training', '#architecture', '#leakage', '#optimization', '#data'], 'emoji': '🔍', 'ru': {'title': 'Эффективное удаление концепций с помощью ограниченности манифольда', 'desc': 'Гипотеза о множественной ограниченности (MCH) улучшает процесс удаления концепций, проецируя обновления на оцененные манифольды представлений. Это важно, поскольку представления часто содержат взаимосвязанные концепции, и их удаление может повредить другим данным. Мы предлагаем новый метод удаления концепций, известный как MANifold aware Concept Erasure (MANCE), который использует итеративные обновления и сигналы классификатора. Результаты показывают, что MANCE достигает передовых результатов в области нелинейного удаления концепций.'}, 'en': {'title': 'Enhancing Concept Erasure with Manifold Constraints', 'desc': 'This paper introduces the Manifold Constraint Hypothesis (MCH), which suggests that concept erasure can be improved by projecting updates onto a structured, lower-dimensional manifold of representations. The proposed method, MANifold aware Concept Erasure (MANCE), iteratively updates representations while preserving other encoded information by using signals from a classifier. Extensive evaluations across various settings demonstrate that MANCE consistently outperforms previous methods in reducing concept leakage. The paper also presents MANCE+ and MANCE++, which enhance the erasure process by incorporating a closed-form algorithm, achieving state-of-the-art results in nonlinear concept removal.'}}}, {'id': 'https://huggingface.co/papers/2607.03524', 'title': 'Perceptual Flow Matching for Few-Step Generative Modeling', 'url': 'https://huggingface.co/papers/2607.03524', 'abstract': 'Abstract Perceptual Flow Matching enables efficient few-step generation by supervising flow matching in perceptual feature space, achieving high-quality results with reduced sampling steps and improved accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We propose Perceptual Flow Matching (PFM), a simple yet effective framework for few-step generation in flow-matching models. Rather than performing velocity regression in the conventional VAE latent space, PFM supervises flow matching in a perceptual feature space using pretrained perceptual models. This simple change substantially improves the few-step generation capability of flow-matching models, reducing the number of sampling steps from 35-50 to 4-8 while preserving generation quality. Unlike existing acceleration and distillation approaches, PFM requires neither teacher models nor auxiliary score networks and can be integrated into standard flow-matching training pipelines with minimal modifications. Extensive experiments on image generation, video generation, and image editing tasks demonstrate that PFM consistently produces high-quality results while producing fewer artifacts than existing distillation-based methods. We further show that perceptual supervision shifts the regression minimizer from mean-seeking to mode-seeking, biasing predictions toward on-manifold modes that remain accurate under coarse few-step integration. Our results reveal that standard flow-matching training can naturally yield high-quality few-step generators when supervised in an appropriate representation space. We hope this insight inspires future research into representation-aware objectives for efficient generative modeling.', 'score': 8, 'issue_id': 2777, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'e0ff177c9273fc67', 'github_url': '', 'github_stars': 0, 'authors': ['Chuyang Zhao', 'Yifei Song', 'Hongfa Wang', 'Jianlong Yuan', 'Yuan Zhang', 'Siming Fu', 'Zhineng Chen', 'Huilin Deng', 'Haoyang Huang', 'Nan Duan'], 'affiliations': ['Fudan University', 'Joy Future Academy', 'Tsinghua University', 'USTC'], 'pdf_title_img': 'assets/pdf/title_img/2607.03524.jpg', 'data': {'categories': ['#training', '#optimization', '#diffusion', '#dataset'], 'emoji': '✨', 'ru': {'title': 'Эффективная генерация с минимальными шагами', 'desc': 'Метод Perceptual Flow Matching (PFM) представляет собой простой и эффективный подход для генерации с небольшим количеством шагов в моделях соответствия потока. Вместо традиционной регрессии скорости в латентном пространстве VAE, PFM использует предварительно обученные перцептивные модели для управления соответствием потока в пространстве перцептивных признаков. Это значительно улучшает возможности генерации за счет уменьшения количества шагов от 35-50 до 4-8 при сохранении качества. Метод не требует учительских моделей и может быть интегрирован в стандартные тренировочные конвейеры с минимальными изменениями.'}, 'en': {'title': 'Efficient Few-Step Generation with Perceptual Flow Matching', 'desc': 'Perceptual Flow Matching (PFM) is a new framework that enhances few-step generation in flow-matching models by supervising flow matching in a perceptual feature space. This approach allows for a significant reduction in sampling steps from 35-50 down to just 4-8, while still maintaining high-quality outputs. Unlike traditional methods that rely on teacher models or auxiliary networks, PFM integrates easily into existing training pipelines with minimal changes. Experiments show that PFM not only produces fewer artifacts but also improves the accuracy of generated content across various tasks like image and video generation.'}}}, {'id': 'https://huggingface.co/papers/2607.00597', 'title': 'Multi-Turn Agentic Scientific Literature Search via Workflow Induction', 'url': 'https://huggingface.co/papers/2607.00597', 'abstract': "Abstract paper pilot is a multi-turn literature search agent that uses executable workflows to improve search accuracy and reduce errors by incorporating user feedback and controlled workflow corruption training.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scientific literature search often requires more than retrieving papers from a single query: users' intents are underspecified, preference-dependent, and evolve through interaction. Existing search agents typically rely on fixed pipelines or implicit language-only reasoning, making their search strategies difficult to control, inspect, and refine. We introduce PaperPilot, a multi-turn literature search agent that frames scientific search as workflow induction. Given an anchor paper and a user query, PaperPilot constructs an executable DAG of paper-search operators, including keyword search, citation expansion, filtering, scoring, reranking, and evidence extraction. User feedback is then used to refine both the query and the workflow itself. We train PaperPilot with supervised workflow imitation and preference optimization over controlled workflow corruptions. Experiments show that PaperPilot-9B improves over the base Qwen3.5-9B toolset agent under multi-turn interaction, increasing Hit@5 from 58.0 to 77.0, MRR from 47.5 to 59.4, and nDCG@10 from 26.8 to 32.5, while reducing workflow execution errors from 9.5% to 0%. These results show that explicit, editable search workflows provide an effective and controllable interface for aligning literature search agents with complex scientific intent.", 'score': 7, 'issue_id': 2777, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'b4671cb330b88c52', 'github_url': '', 'github_stars': 0, 'authors': ['Jisen Li', 'Bingxuan Li', 'Nanyi Jiang', 'Xuying Ning', 'Xiyao Wang', 'Yifan Shen', 'Heng Wang', 'Yuqing Jian', 'Xiaoxia Wu', 'Ben Athiwaratkun', 'Pan Lu', 'Jiaxuan You', 'Bingxin Zhao'], 'affiliations': ['Stanford University', 'Together AI', 'University of Illinois Urbana-Champaign', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2607.00597.jpg', 'data': {'categories': ['#science', '#agent_memory', '#agents', '#training', '#rlhf', '#optimization', '#retrieval'], 'emoji': '📚', 'ru': {'title': 'PaperPilot: Инновационный поиск научной литературы', 'desc': 'Статья описывает PaperPilot — многоходового агента для поиска научной литературы, который использует исполняемые рабочие процессы для повышения точности поиска. Он учитывает обратную связь от пользователей и обучается с помощью оптимизации предпочтений. PaperPilot строит направленный ациклический граф, включающий операции по
