иска, фильтрации и извлечения данных, что позволяет адаптировать поиск под меняющиеся намерения пользователей. Эксперименты показали значительное улучшение результатов поиска и сокращение ошибок выполнения рабочих процессов.'}, 'en': {'title': 'Enhancing Scientific Search with Interactive Workflows', 'desc': 'PaperPilot is a multi-turn literature search agent designed to enhance the accuracy of scientific searches by using executable workflows. It addresses the challenge of evolving user intents by allowing for interactive feedback and controlled training of search strategies. By constructing a directed acyclic graph (DAG) of search operations, it enables users to refine their queries and workflows effectively. Experiments demonstrate significant improvements in search performance metrics while minimizing execution errors, showcasing the benefits of a structured and editable search approach.'}}}, {'id': 'https://huggingface.co/papers/2607.05155', 'title': 'EdgeBench: Unveiling Scaling Laws of Learning from Real-World Environments', 'url': 'https://huggingface.co/papers/2607.05155', 'abstract': 'Abstract Analysis of 38,000 hours of real-world agent interactions reveals log-sigmoid scaling laws for performance and exponential learning speed improvements across 134 diverse tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Pretraining scaling laws reveal that model capability improves predictably with data and compute. But learning from real world environments after deployment remains far less understood. Analyzing roughly 38,000 hours of agent interaction with the environment across 134 real world tasks, we find, to the best of our knowledge, the first evidence that overall performance during environment learning follows a log-sigmoid scaling law with remarkably high precision, reaching R^2 = 0.998. Across model generations, we also find that agent learning speed roughly doubles every three months. This discovery stems from EdgeBench, a suite of 134 real world tasks with ultra-long horizons, spanning scientific discovery, software engineering, combinatorial optimization, professional knowledge work, formal mathematics, and interactive games. Each task sustains at least 12 hours of continuous agent operation under rich, multilevel feedback, and is built through substantial expert effort. We publicly release 51 tasks and our full evaluation framework to accelerate the study of how agents learn from real world experience.', 'score': 6, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '6e1a4655107681ee', 'github_url': '', 'github_stars': 0, 'authors': ['Deyao Zhu', 'Xin Zhou', 'Shengling Qin', 'Xuekai Zhu', 'Hangliang Ding', 'Shu Zhong', 'Zixin Wen', 'Zhonglin Xie', 'Chenhui Gou', 'Linxuan Ren', 'Yueyang Wang', 'Junfeng Zhong', 'Rui Liu', 'Tian Gao', 'Yangguang Lin', 'Jingyuan Zhang', 'Maojia Song', 'Xuan Qi', 'Jinhong Wu', 'Chenyang Zhang', 'Yinzhu Piao', 'Ziru Niu', 'Hongbin Lin', 'Lingxiang Meng', 'Peng Tang', 'Chengyao Tang', 'Shanyu Wu', 'Huanyu Zheng', 'Yu Liu', 'Liya Zhu', 'He Wang', 'Ming Ding', 'Ziyu Wan', 'Hao Liu', 'Sibo Wang', 'Haotian Zhu', 'Xintian Zhang', 'Nan Chai', 'Yipeng Liu', 'Panhao Lai', 'Sihang Yuan', 'Zixin Su', 'Ge Zhang', 'Wangchunshu Zhou', 'Yantao Du', 'Wenhao Huang', 'Guang Shi'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.05155.jpg', 'data': {'categories': ['#agents', '#continual_learning', '#training', '#open_source', '#agent_memory', '#benchmark', '#optimization', '#games', '#dataset'], 'emoji': '📈', 'ru': {'title': 'Лог-сигмоидальное масштабирование производительности агентов в реальном мире', 'desc': 'В данной статье исследуется влияние взаимодействия агентов с реальным миром на их производительность и скорость обучения. Анализ 38 000 часов взаимодействий показываeт, что производительность агентов следует лог-сигмоидальному закону масштабирования. Установлено, что скорость обучения агентов удваивается примерно каждые три месяца. Также представлено 51 задание для ускорения изучения обучения агентов на реальном опыте.'}, 'en': {'title': 'Unlocking Agent Learning: Scaling Laws in Real-World Tasks', 'desc': 'This paper analyzes 38,000 hours of real-world agent interactions to uncover log-sigmoid scaling laws that describe performance improvements and exponential learning speed across 134 diverse tasks. The findings indicate that as models are exposed to more data and computational resources, their capabilities improve predictably. However, the process of learning from real-world environments post-deployment is still not well understood. The study introduces EdgeBench, a comprehensive evaluation framework that includes 51 publicly released tasks, facilitating further research into agent learning from real-world experiences.'}}}, {'id': 'https://huggingface.co/papers/2607.05391', 'title': 'LLM-as-a-Verifier: A General-Purpose Verification Framework', 'url': 'https://huggingface.co/papers/2607.05391', 'abstract': "Abstract LLM-as-a-Verifier introduces a probabilistic verification framework that scales across multiple dimensions to improve solution correctness assessment and agent performance across various benchmarks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scaling pre-training, post-training, and test-time compute have become the central paradigms for improving the capabilities of LLMs. In this work, we identify verification, the ability to determine the correctness of a solution, as a new scaling axis. To unlock this and demonstrate its effectiveness, we introduce LLM-as-a-Verifier, a general-purpose verification framework that provides fine-grained feedback for agentic tasks without requiring additional training. Unlike standard LM judges that prompt LLMs to produce discrete scores for candidate solutions, LLM-as-a-Verifier computes the expectation over the distribution of scoring token logits to generate continuous scores. This probabilistic formulation enables verification to scale along multiple dimensions: (1) score granularity, (2) repeated evaluation, and (3) criteria decomposition. In particular, we show that scaling the scoring granularity leads to better separation between positive and negative solutions, resulting in more calibrated comparisons. Moreover, scaling repeated evaluation and criteria decomposition consistently lead to additional gains in verification accuracy through variance and complexity reduction. We further introduce a cost-efficient ranking algorithm for selecting the best solution among candidates using the verifier's continuous scores. LLM-as-a-Verifier achieves state-of-the-art performance on Terminal-Bench V2 (86.5%), SWE-Bench Verified (78.2%), RoboRewardBench (87.4%), and MedAgentBench (73.3%). Beyond verification, the fine-grained signals from LLM-as-a-Verifier can also serve as a proxy for estimating task progress. We build an extension for Claude Code, enabling developers to monitor and improve their own agentic systems. Finally, we show that LLM-as-a-Verifier can provide dense feedback for RL, improving the sample efficiency of SAC and GRPO on robotics and mathematical reasoning benchmarks.", 'score': 6, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '5111f1e8e7c4d04e', 'github_url': '', 'github_stars': 0, 'authors': ['Jacky Kwok', 'Shulu Li', 'Pranav Atreya', 'Yuejiang Liu', 'Yixing Jiang', 'Chelsea Finn', 'Marco Pavone', 'Ion Stoica', 'Azalia Mirhoseini'], 'affiliations': ['NVIDIA Research', 'Stanford University', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2607.05391.jpg', 'data': {'categories': ['#agents', '#reasoning', '#robotics', '#training', '#math', '#rl', '#agent_memory', '#benchmark', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Новый подход к проверке решений с помощью LLM', 'desc': 'Статья представляет новый метод проверки решений с использованием LLM как проверяющего инструмента. Этот подход позволяет более точно оценивать корректность результатов, предоставляя непрерывные оценки вместо дискретных. Авторы утверждают, что улучшение градации оценок и многократные проверки способствуют повышению точности верификации. В результате, LLM-as-a-Verifier достигает высоких показателей в различных бенчмарках, демонстрируя свою эффективность.'}, 'en': {'title': 'Enhancing Solution Verification with LLM-as-a-Verifier', 'desc': 'The paper presents LLM-as-a-Verifier, a new framework for verifying the correctness of solutions generated by language models. It introduces a probabilistic approach that allows for fine-grained feedback without needing extra training. This method enhances the evaluation process by providing continuous scores instead of discrete ones, improving the distinction between correct and incorrect solutions. The framework demonstrates state-of-the-art performance across various benchmarks and offers insights for monitoring agentic systems and improving reinforcement learning efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.05376', 'title': 'MV-Forcing: Long Multi-View Video Generation via 4D-Grounded Spatio-Temporal Self-Forcing', 'url': 'https://huggingface.co/papers/2607.05376', 'abstract': "Abstract A video diffusion framework generates long, multi-view consistent videos by combining temporal and view-wise autoregression through 4D geometric bridging and spatio-temporal distillation techniques.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recent advances in video diffusion models have enabled either long single-view generation through temporal autoregression, or short multi-view synthesis through bidirectional attention. However, generating long, multi-view consistent videos of dynamic scenes remains unsolved. In this work, we present MV-Forcing, a framework that composes temporal and view-wise autoregression within a single diffusion model by introducing a 4D geometric bridge between sequentially generated views. Our key insight is that an autoregressive 3D reconstruction model naturally interfaces between autoregressively generated views. Given a completed source view, we reconstruct its 3D structure and render a geometric prior of the next target viewpoint, which the diffusion model refines into a high-quality video. To extend generation beyond the teacher's fixed temporal window, we introduce a joint denoising regime where both view slots are initialized from noise during training, enabling temporally unbounded generation. We distill the model via Distribution Matching Distillation with Spatio-Temporal Self-Forcing, closing the train-inference exposure bias gap for both temporal and view-sequential autoregression. Extensive experiments on both synthetic and real-world data demonstrate that MV-Forcing produces geometrically consistent multi-view videos of dynamic scenes at arbitrary lengths and viewpoint counts using a single few-step student model.", 'score': 4, 'issue_id': 2777, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '124ec50a116d5a2d', 'github_url': '', 'github_stars': 0, 'authors': ['Gal Fiebelman', 'Hadar Averbuch-Elor', 'Sagie Benaim'], 'affiliations': ['Cornell University', 'The Hebrew University of Jerusalem'], 'pdf_title_img': 'assets/pdf/title_img/2607.05376.jpg', 'data': {'categories': ['#diffusion', '#multimodal', '#3d'], 'emoji': '🎥', 'ru': {'title': 'Создание длинных многоватных видео с помощью авторегрессии', 'desc': 'В данной статье представлено новое решение для создания длинных многоватных видео с учетом временной и пространственной согласованности. Предложенная модель MV-Forcing использует 4D геометрический мост для улучшения качества видео, комбинируя авторегрессию по времени и по видам. Основным достижением является возможность генерации видео без фиксированного временного окна, что позволяет создавать видео любой длины и количества ракурсов. Эксперименты показывают, что MV-Forcing генерирует геометрически согласованные многоватные видео динамичных сцен с высоким качеством.'}, 'en': {'title': 'Generating Long, Consistent Multi-View Videos with MV-Forcing', 'desc': 'This paper introduces MV-Forcing, a novel video diffusion framework that generates long, multi-view consistent videos by integrating temporal and view-wise autoregression. It employs a 4D geometric bridge to connect sequentially generated views, allowing for the reconstruction of 3D structures from completed source views. The framework also features a joint denoising regime that enables the generation of videos beyond fixed temporal windows. Through extensive experiments, MV-Forcing demonstrates the ability to produce high-quality, geometrically consistent videos of dynamic scenes across various lengths and viewpoints using a single model.'}}}, {'id': 'https://huggingface.co/papers/2607.05196', 'title': 'Unified Audio Intelligence Without Regressing on Text Intelligence', 'url': 'https://huggingface.co/papers/2607.05196', 'abstract': 'Abstract A unified audio-text large language model is presented that integrates audio and text processing through a shared transformer decoder, achieving superior performance across multiple audio and speech tasks while maintaining strong text reasoning capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Audio intelligence involves understanding, reasoning about, and generating both audio and speech. In this work, we introduce Nemotron-Labs-Audex-30B-A3B (Audex), a unified audio-text LLM built on Nemotron-Cascade-2-30B-A3B, a strong text-only MoE LLM. Audex adopts a simple unified design with a single Transformer decoder: audio inputs are encoded and projected into the text embedding space, while text tokens and quantized audio output tokens are treated uniformly during generation. This architecture enables strong audio-text fusion, seamless multimodal generation, and compatibility with standard LLM training and inference infrastructure. For training, we meticulously curate audio-text datasets comprising 157.4B audio tokens and 320.5B text tokens. We apply multi-stage supervised training on these datasets, followed by text-only Cascade RL and multi-domain on-policy distillation. Audex delivers state-of-the-art audio understanding, speech recognition and translation, text-to-speech, audio generation, and speech-to-speech generation, while preserving very compelling reasoning, alignment, knowledge, long-context, and agentic capabilities of its text-only LLM backbone with marginal or no regression. We release the model checkpoints to facilitate open research.', 'score': 3, 'issue_id': 2778, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '81cd8d134b29dcd2', 'github_url': '', 'github_stars': 0, 'authors': ['Zhifeng Kong', 'Sang-gil Lee', 'Jaehyeon Kim', 'Boxin Wang', 'Zihan Liu', 'Sungwon Kim', 'Yang Chen', 'Arushi Goel', 'Rajarshi Roy', 'Wenliang Dai', 'Zhuolin Yang', 'Yangyi Chen', 'Dongfu Jiang', 'Sreyan Ghosh', 'Tuomas Rintamaki', 'Andrew Tao', 'Jonathan Raiman', 'Mohammad Shoeybi', 'Bryan Catanzaro', 'Wei Ping'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.05196.jpg', 'data': {'categories': ['#audio', '#training', '#open_source', '#multimodal', '#alignment', '#games', '#dataset', '#long_context', '#agi'], 'emoji': '🎤', 'ru': {'title': 'Унифицированная модель для аудио и текста', 'desc': 'Представлена унифицированная модель, которая обрабатывает как аудио, так и текст, используя один трансформер-декодер. Модель достигает выдающихся результатов в задачах с аудио и речью, сохраняя при этом высокие способности к текстовому анализу. Audex использует простой дизайн и интегрирует аудио и текст на одном уровне, что позволяет обеспечивать сильное слияние модальностей. В процессе обучения использовались обширные наборы данных, что позволило добиться современных результатов в аудиообработке, распознавании речи и генерации аудио.'}, 'en': {'title': 'Unifying Audio and Text for Superior AI Performance', 'desc': 'This paper presents Audex, a unified audio-text large language model that effectively combines audio and text processing using a shared transformer decoder. By encoding audio inputs into the text embedding space, Audex achieves strong performance in various audio and speech tasks while maintaining robust text reasoning abilities. The model is trained on a vast dataset of audio and text tokens, employing multi-stage supervised training and reinforcement learning techniques. Audex excels in tasks such as speech recognition, audio generation, and translation, all while preserving the advanced capabilities of its text-only LLM foundation.'}}}, {'id': 'https://huggingface.co/papers/2607.01793', 'title': 'Safety Testing LLM Agents at Scale: From Risk Discovery to Evidence-Grounded Verification', 'url': 'https://huggingface.co/papers/2607.01793', 'abstract': 'Abstract Automated safety testing framework Vera uses a three-stage pipeline to identify and test safety risks in LLM agents through structured risk taxonomies, combinatorial case generation, and adaptive sandbox execution with evidence-based verification.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct LLM agents increasingly perform autonomous actions through external tools, leading to complex and evolving safety risks. However, existing safety testing targets expert-designed safety violations, and the corresponding outcomes are evaluated by hard-coded rules, making them costly to extend as agents evolve. To this end, we present Vera, an end-to-end automated safety testing framework that instantiates software engineering testing principles for non-deterministic agents through a three-stage, self-reinforcing pipeline. First, a literature-driven exploration continuously discovers and structures emerging risks into taxonomies of safety risks, attack methods, and tool execution environments. Second, combinatorial composition across taxonomy dimensions produces executable safety cases, each specifying a concrete safety goal, a programmatically constructed initial state, and a deterministic verification predicate grounded in observable artifacts. Third, adaptive execution runs heterogeneous agents in isolated sandboxes where a control agent steers multi-turn interaction based on runtime observations, while evidence-grounded verifiers judge outcomes from environment state and tool-call evidence rather than model self-report. We evaluate Vera on four production agent frameworks (OpenClaw, Hermes, Codex, Claude Code), revealing substantial safety weaknesses, with average attack success rates reaching 93.9\\% under multi-channel attacks; we also release Vera-Bench, comprising 1600 executable safety cases spanning 124 risk categories across three execution settings. These results indicate that modular, executable testing infrastructure is essential for rigorous and maintainable safety evaluation of rapidly evolving agentic systems at scale. The code is publicly available at https://github.com/Yunhao-Feng/Vera.', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '505249af88025d1a', 'github_url': '', 'github_stars': 0, 'authors': ['Yunhao Feng', 'Ruixiao Lin', 'Ming Wen', 'Qinqin He', 'Yanming Guo', 'Yifan Ding', 'Yutao Wu', 'Jialuo Chen', 'Yunhao Chen', 'Xiaohu Du', 'Jianan Ma', 'Zixing Chen', 'Zhuoer Xu', 'Xingjun Ma', 'Xinhao Deng'], 'affiliations': ['Alibaba Group', 'AntGroup', 'Deakin University', 'Fudan University', 'Hunan Institute of Advanced Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01793.jpg', 'data': {'categories': ['#agent_memory', '#dataset', '#benchmark', '#agents', '#security', '#open_source'], 'emoji': '🛡️', 'ru': {'title': 'Новая эра в тестировании безопасности LLM-агентов', 'desc': 'Автоматизированная система тестирования безопасности Vera использует трехступенчатый процесс для выявления и тестирования рисков безопасности в LLM-агентах. Эта система организует риски в таксономии и генерирует проверочные случаи через комбинаторные композиции. Vera позволяет оценивать нештатных агентов в изолированных песочницах, где контрольный агент направляет взаимодействие на основе наблюдений. Результаты работы показывают, что модульная и исполняемая инфраструктура тестирования необходима для масштабной и поддерживаемой оценки безопасности быстро развивающихся систем агентов.'}, 'en': {'title': 'Vera: A Dynamic Safety Testing Framework for LLM Agents', 'desc': 'The paper presents Vera, an automated safety testing framework designed to identify and mitigate safety risks in large language model (LLM) agents. It employs a three-stage pipeline that includes risk taxonomy structuring, combinatorial case generation, and adaptive sandbox execution for evidence-based verification. Unlike traditional methods that rely on hard-coded rules, Vera dynamically generates safety cases and evaluates outcomes based on real-time observations. The framework has been tested on various agent frameworks, revealing significant safety vulnerabilities and emphasizing the need for modular testing infrastructures in evolving agentic systems.'}}}, {'id': 'https://huggingface.co/papers/2607.01764', 'title': 'Mastermind: Strategy-grounded Learning for Repository-Scale Vulnerability Reproduction', 'url': 'https://huggingface.co/papers/2607.01764', 'abstract': 'Abstract A dual-loop framework named Mastermind is introduced that separates strategy learning from task-specific experience to improve vulnerability reproduction capabilities in software engineering agents.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Repository-level vulnerability reproduction is a demanding software engineering (SE) task: an agent must inspect a codebase, infer the input grammar that reaches a vulnerable path, construct a proof-of-conceptv(PoC), and verify that the crash disappears on the patched build. Recent LLM agents can often execute these steps when the approach is correct, yet they still fail by choosing the wrong strategy. This paper argues that strategy, rather than the full action trajectory, is the right learning unit for such SE agents: it is compact enough to optimize, concrete enough to guide execution, and stable enough to store and reuse across attempts. We present Mastermind, a dual-loop framework that separates transferable strategy learning from task-specific experience. A trainable planner learns reusable vulnerability-reproduction strategies through SFT and milestone-based GRPO, while an experience loop maintains task-local strategy records that guide subsequent attempts. The planner is trained independently of the executor, allowing strategy learning to improve multiple frozen executors without modifying their action-generation capability. We evaluate Mastermind on CyberGym using 260 training tasks and 200 held-out evaluation tasks. With GPT-5.5 as the frozen executor, Mastermind achieves an 84.5% pass rate, outperforming open-book PoC context (60.0%), Best-of-8 sampling (63.0%), and iterative improvement (77.0%). The same planner also improves GPT-5.4 mini and GLM~5.1 from 45.0% and 58.5% to 60.0% and 71.0%. These results demonstrate that learning high-level strategies is an effective and transferable mechanism for improving repository-scale SE agents.', 'score': 3, 'issue_id': 2775, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '4b51db410895bce4', 'github_url': '', 'github_stars': 0, 'authors': ['Mingzhe Du', 'Luu Anh Tuan', 'Tianyi Wu', 'Renyang Liu', 'Zhijiang Guo', 'Dong Huang', 'See-Kiong Ng'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2607.01764.jpg', 'data': {'categories': ['#training', '#optimization', '#transfer_learning', '#agents'], 'emoji': '🛠️', 'ru': {'title': 'Mastermind: стратегическое обучение для улучшения воспроизводимости уязвимостей', 'desc': 'В статье представлена двухконтурная структура под названием Mastermind, которая отделяет обучение стратегий от специфического опыта задач для улучшения способности воспроизводить уязвимости в программной инженерии. Агентам необходимо анализировать код, выявлять грамматику ввода для уязвимого пути, создавать доказательства концепции и проверять исправления. Mastermind обучает планировщика, который разрабатывает переиспользуемые стратегии воспроизведения уязвимостей, в то время как локальный цикл опыта поддерживает записи стратегий для последующих попыток. Результаты показывают, что изучение высокоуровневых стратегий эффективно улучшает работу агентов программной инженерии на уровне репозитория.'}, 'en': {'title': 'Mastermind: Elevating Software Agents with Strategic Learning', 'desc': 'The paper introduces Mastermind, a dual-loop framework designed to enhance the ability of software engineering agents to reproduce vulnerabilities. It emphasizes the importance of learning strategies separately from task-specific experiences, allowing agents to optimize their approach to vulnerability reproduction. By using a trainable planner for strategy learning and an experience loop for task-specific records, Mastermind enables agents to improve their performance without altering their action generation. The framework shows significant improvements in pass rates for vulnerability reproduction tasks, demonstrating the effectiveness of high-level strategy learning in software engineering.'}}}, {'id': 'https://huggingface.co/papers/2607.02881', 'title': 'PraMem: Practice-derived Experiential Memory for Long-horizon Behavior Prediction', 'url': 'https://huggingface.co/papers/2607.02881', 'abstract': "Abstract Long-horizon behavior prediction is enhanced through PraMem, which transforms lengthy historical sequences into experiential memory for improved accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Long-horizon behavior prediction aims to infer a user's next action based on a lengthy historical sequence, playing a crucial role in artificial intelligence field. The rise of large language models (LLMs) offers a promising direction for sequential behavior prediction, yet LLMs struggle with latent behavioral pattern induction and model-intrinsic cognitive biases when tackling long-horizon behavior prediction. Prior memory management methods follow a context-compression paradigm that attempts to address this task by alleviating the historical sequence burden, yet fail to resolve the core challenges. In this paper, we advocate a paradigm shift that reframes the lengthy historical sequence from a burden into a valuable resource to be exploited, and accordingly propose PraMem, which conducts beforehand practice over the lengthy historical sequence to build an experiential memory, thereby serving as the assisted input for accurate long-horizon behavior prediction. Extensive experiments across diverse tasks demonstrate that PraMem achieves superior performance than prior methods, and more in-depth analyses provide valuable insights into the mechanism and evolution of the experiential memory. Code: https://github.com/icip-cas/PraMem.", 'score': 2, 'issue_id': 2775, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '87b59f9dd8112474', 'github_url': '', 'github_stars': 0, 'authors': ['Zhuoqun Li', 'Boxi Cao', 'Jiawei Chen', 'Hanshu Zhou', 'Ruoxi Xu', 'Guiping Jiang', 'Ruotong Pan', 'Tingting Gao', 'Han Li', 'Xiangyu Wu', 'Hongyu Lin', 'Yaojie Lu', 'Xianpei Han', 'Le Sun'], 'affiliations': ['Chinese Information Processing Laboratory, Institute of Software, Chinese Academy of Sciences', 'Fudan University', 'Kuaishou Technology', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.02881.jpg', 'data': {'categories': ['#memory', '#training', '#long_context', '#agent_memory'], 'emoji': '🧠', 'ru': {'title': 'Опытная память для точного прогнозирования поведения', 'desc': 'В данной статье рассматривается метод PraMem, который улучшает прогнозирование долгосрочного поведения, преобразуя длинные исторические последовательности в опытную память. Этот подход позволяет использовать накопленный опыт для более точного предсказания следующего действия пользователя. Метод PraMem переосмысливает длительные последовательности как ценное ресурсное, а не бремя. Эксперименты показывают, что PraMem превосходит предыдущие методы в различных задачах.'}, 'en': {'title': 'Transforming History into Memory for Better Predictions', 'desc': 'This paper introduces PraMem, a novel approach for long-horizon behavior prediction that transforms lengthy historical sequences into experiential memory. By leveraging the capabilities of large language models (LLMs), PraMem addresses the challenges of latent behavioral pattern induction and cognitive biases that hinder traditional methods. Instead of compressing historical data, PraMem utilizes it as a valuable resource, enhancing prediction accuracy through prior practice on the sequences. Experimental results show that PraMem outperforms existing techniques, providing insights into the dynamics of experiential memory.'}}}, {'id': 'https://huggingface.co/papers/2602.11688', 'title': 'GORGO: Online Tuning for Cross-Region Network-Aware LLM Serving', 'url': 'https://huggingface.co/papers/2602.11688', 'abstract': "Abstract GORGO is a proxy architecture that optimizes LLM inference load balancing by jointly considering network latency, prefill cost, and queueing delay through evolutionary strategy tuning on a new synthetic dataset.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Increasingly, LLM inference services proxy client requests to engine replicas distributed globally. Load-balancing policies must jointly account for factors including KV-cache locality, replica load, and variable network latency when optimizing for metrics like latency and TTFT. However, existing systems only evaluate a subset of these factors in their cost model, leading to uneven concentrations of load and KV-cache across replicas. We present GORGO, a proxy architecture that holistically factors network latency, prefill cost, and queueing delay using tunable parameters. Since open-source chat datasets such as LMSYS-Chat1M and WildChat-4.8M lack long-context, high prefix-reuse data, we release a synthetic dataset, ART-Chat-2.5M, from long-context production metadata. On a tuning window from ART-Chat-2.5M, evolutionary strategies guide the GORGO policy's parameters to directly optimize p95 TTFT. During held-out evaluation windows, we fix the parameter values learned from tuning and improve p95 TTFT by 6.9-15.5% and p95 end-to-end (E2E) latency by 14.3-30.9% over baseline load-balancing policies such as simple session affinity and prefix-cache. The code and ART-Chat-2.5M dataset can be found at https://github.com/Arcadia-Research-Team/GORGO.", 'score': 2, 'issue_id': 2776, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '6e32a50432327043', 'github_url': '', 'github_stars': 0, 'authors': ['Alessio Ricci Toniolo', 'Rome Thorstenson', 'Abinaya Dinesh'], 'affiliations': ['ART', 'Carnegie Mellon University'], 'pdf_title_img': 'assets/pdf/title_img/2602.11688.jpg', 'data': {'categories': ['#inference', '#synthetic', '#open_source', '#optimization', '#dataset'], 'emoji': '⚖️', 'ru': {'title': 'Оптимизация балансировки нагрузки для LLM-сервисов', 'desc': 'GORGO - это архитектура прокси, которая оптимизирует балансировку нагрузки при выводе LLM, учитывая задержку сети, стоимость предварительной загрузки и задержку в очереди. В отличие от существующих систем, GORGO анализирует эти факторы в комбинации, что позволяет избежать неравномерного распределения нагрузки. Мы создали синтетический датасет ART-Chat-2.5M для настройки параметров политики GORGO, что привело к улучшению времени отклика. В результате удалось значительно снизить задержки и повысить эффективность работы LLM-сервисов.'}, 'en': {'title': 'Optimizing LLM Inference with GORGO: A Holistic Load Balancing Approach', 'desc': 'GORGO is a proxy architecture designed to enhance load balancing for large language model (LLM) inference by considering multiple factors such as network latency, prefill cost, and queueing delay. It uses evolutionary strategies to tune parameters based on a new synthetic dataset, ART-Chat-2.5M, which addresses the limitations of existing datasets. By optimizing these factors, GORGO significantly improves performance metrics like p95 TTFT and end-to-end latency compared to traditional load-balancing methods. The architecture aims to create a more efficient distribution of requests across globally distributed engine replicas.'}}}, {'id': 'https://huggingface.co/papers/2606.28393', 'title': 'Transition-Aware best-of-N sampling for Longitudinal Chest X-ray Reports', 'url': 'https://huggingface.co/papers/2606.28393', 'abstract': 'Abstract A novel training-free sampling method for chest X-ray report generation that leverages longitudinal patient history by encoding changes between prior and current examinations through set-to-set distance metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In longitudinal clinical practice, every chest X-ray is read in the context of the patients prior exam, and much of what the radiologist communicates is the change from one visit to the next. To the best of our knowledge, we present the first training-free best-of-N sampling scheme for pre-trained chest X-ray report generators that is explicitly aware of this longitudinal prior to current transition. We call it transition-aware best-of-N sampling, each report is split into sentences and embedded into an unordered set in Rd; each (prior, current) pair is reduced to a fixed-dim directional vector via a set-to-set distance designed to encode the change between the two sets; and candidates are scored by cosine distance from their candidate transition vector to a cached bank of ground-truth training transition vectors, aggregated as min or kNN. We instantiate the framework with four directional set distances (mean-shift, novelty residual, directed-Hausdorff anchor, and cost-weighted optimal transport) and evaluate on a multi-visit AP-PA cohort, running inference under three prompts on three vision-language generators. Transition-aware best-of-N outperforms random selection across the board, with the largest relative gains on the Impression section.', 'score': 2, 'issue_id': 2777, 'pub_date': '2026-06-23', 'pub_date_card': {'ru': '23 июня', 'en': 'June 23', 'zh': '6月23日'}, 'hash': '5e96cf1c10b4c225', 'github_url': '', 'github_stars': 0, 'authors': ['Halil Ibrahim Gulluk', 'Max Van Puyvelde', 'Wim Van Criekinge', 'Olivier Gevaert'], 'affiliations': ['Department of Biomedical Data Science, Stanford University School of Medicine, Stanford, CA, USA', 'Department of Electrical Engineering, Stanford University, Stanford, CA, USA', 'Department of Mathematical Modelling, Statistics & Bioinformatics, Ghent University, Ghent, Belgium'], 'pdf_title_img': 'assets/pdf/title_img/2606.28393.jpg', 'data': {'categories': ['#prompting', '#multimodal', '#healthcare', '#training', '#inference', '#optimization', '#games'], 'emoji': '🩻', 'ru': {'title': 'Генерация отчетов по рентгенограммам с осознанием изменений', 'desc': "В статье представлен новый метод генерации отчетов по рентгенограммам грудной клетки, который не требует обучения. Он использует исторические данные пациентов, акцентируя внимание на изменениях между предыдущими и текущими обследованиями. Метод называется 'переходное осознанное выборка лучшего из N' и эффективно применяет метрики расстояния между наборами. Результаты показывают, что предложенный метод превосходит случайный выбор, особенно в разделе 'Впечатление'."}, 'en': {'title': 'Revolutionizing Chest X-Ray Reports with Transition-Aware Sampling', 'desc': "This paper introduces a new method for generating chest X-ray reports without the need for additional training. It focuses on the changes in a patient's condition by comparing previous and current X-ray examinations. The method uses a unique sampling technique called transition-aware best-of-N sampling, which evaluates reports based on how well they reflect these changes. The approach outperforms random selection, particularly in the Impression section of the reports, by utilizing set-to-set distance metrics to encode the differences between prior and current examinations."}}}, {'id': 'https://huggingface.co/papers/2607.05390', 'title': 'Deform360: A Massive Multi-view Visuotactile Dataset for Deformable World Models', 'url': 'https://huggingface.co/papers/2607.05390', 'abstract': 'Abstract A large-scale visuotactile dataset called Deform360 is introduced to study deformable object dynamics, enabling comparison between 2D video and 3D particle world models for robotic manipulation tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Predicting object dynamics (i.e., world modeling) is a fundamental challenge for robotic manipulation, and modeling deformable objects presents a particularly difficult case due to their high-dimensional state spaces and complex material properties. While current world models approach this through two distinct paradigms: learning the dynamics over the 2D pixel space or more explicit 3D geometric space. A systematic understanding of their relative strengths and limitations remains elusive due to the lack of diverse, large-scale real-world data. To address this, we present Deform360, a large-scale visuotactile dataset featuring 198 daily-life objects, 1,980 interaction sequences, and over 215 hours of observations from 41 surround-view cameras and bimanual tactile grippers to capture both global motion and contact-induced local deformations. Leveraging a novel markerless visuotactile 3D tracking pipeline to extract dense geometry and motion, we systematically evaluate current state-of-the-art world models, comparing 2D video models against 3D particle models. Finally, we provide a preliminary demonstration indicating the real-world applicability of our dataset by performing robot planning tasks on deformable objects. Our analysis reveals key insights into the trade-offs between structural priors and scalability, providing a solid benchmark for future research in generalizable deformable object-centric world modeling. Project website: https://deform360.lhy.xyz', 'score': 1, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'ea2f0b8a60fbfad3', 'github_url': '', 'github_stars': 0, 'authors': ['Hongyu Li', 'Wanjia Fu', 'Xiaoyan Cong', 'Zekun Li', 'Binghao Huang', 'Hanxiao Jiang', 'Xintong He', 'Yiqing Liang', 'Rao Fu', 'Tao Lu', 'Srinath Sridhar', 'Kevin A. Smith', 'George Konidaris', 'Yunzhu Li'], 'affiliations': ['Brown University, Providence, RI', 'Columbia University, New York, NY', 'Massachusetts Institute of Technology, Cambridge, MA'], 'pdf_title_img': 'assets/pdf/title_img/2607.05390.jpg', 'data': {'categories': ['#3d', '#benchmark', '#robotics', '#science', '#games', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Исследуем динамику деформируемых объектов!', 'desc': 'В статье представлено крупномасштабное датасет Deform360, предназначенное для изучения динамики деформируемых объектов. Этот датасет включает в себя 198 объектов повседневного обихода и более 200 часов наблюдений с использованием камер и тактильных захватов. Авторы сравнивают подходы моделирования динамики объектов в 2D и 3D пространствах и анализируют их сильные и слабые стороны. Результаты показывают важность этого датасета для будущих исследований в области моделирования деформируемых объектов и роботов.'}, 'en': {'title': 'Unlocking Deformable Object Dynamics with Deform360', 'desc': 'The paper introduces Deform360, a large-scale visuotactile dataset designed to enhance the understanding of deformable object dynamics for robotic manipulation. It compares two approaches to world modeling: 2D video-based models and 3D particle-based models, highlighting the challenges posed by the complex nature of deformable objects. The dataset includes extensive observations of various daily-life objects, captured through advanced tracking techniques to analyze both global and local deformations. This work aims to provide a benchmark for future research, revealing insights into the trade-offs between different modeling strategies.'}}}, {'id': 'https://huggingface.co/papers/2607.02998', 'title': 'CONFLUX: A Latent Diusion Model for 3D Chest-CT Synthesis with RL Post-Training', 'url': 'https://huggingface.co/papers/2607.02998', 'abstract': 'Abstract A 3D latent diffusion model for chest CT generation that achieves high-fidelity results while enabling control over clinical attributes through metadata conditioning and reinforcement learning refinement.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Controllable generative models of 3D medical images can synthesize volumes with specified clinical attributes, but this demands samples that are simultaneously high-fidelity, natively 3D, and faithful to the requested conditioning. We present CONFLUX, a latent diffusion model for chest computed tomography (CT): a 3D variational autoencoder compresses each volume, and a rectified-flow transformer generates in the latent space. Generation is conditioned on structured radiological metadata (18 abnormality findings, sex, age, and reconstruction kernel) through adaptive layer normalization. The model leads strong volumetric baselines on tri-planar Frechet distance (FID 32.3 vs. 74.6 for MAISI) while exposing direct control over clinical attributes. To strengthen that control we add an online reinforcement-learning post-training stage (group-relative policy optimization) that rewards how reliably a classifier recovers the requested findings from each generated volume. Judged by a separate, independent classifier, post-training removes 47% of the shortfall relative to real-scan reliability. We release the model and a ~200k synthetic chest-CT dataset with conditioning metadata spanning a wide variety of clinical findings.', 'score': 1, 'issue_id': 2777, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '6296538970255e3e', 'github_url': '', 'github_stars': 0, 'authors': ['Max Van Puyvelde', 'Halil Ibrahim Gulluk', 'Wim Van Criekinge', 'Olivier Gevaert'], 'affiliations': ['Department of Biomedical Data Science, Stanford University School of Medicine', 'Department of Electrical Engineering, Stanford University', 'Department of Mathematical Modelling, Statistics & Bioinformatics, Ghent University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02998.jpg', 'data': {'categories': ['#dataset', '#synthetic', '#diffusion', '#healthcare', '#rl', '#3d'], 'emoji': '🩻', 'ru': {'title': 'Генерация КТ с управляемыми клиническими характеристиками', 'desc': 'В данной статье представлен 3D латентный диффузионный модель для генерации грудных КТ, которая достигает высококачественных результатов и позволяет управлять клиническими характеристиками через условие метаданных. Модель использует вариационный автоэнкодер для сжатия объемов и трансформер для генерации в латентном пространстве. Генерация основывается на структурированных радиологических метаданных, таких как находки аномалий, пол, возраст и параметры реконструкции. Благодаря дополнительному этапу пост-обучения с использованием обучения с подкреплением, модель демонстрирует улучшенные результаты в распознавании клинических находок.'}, 'en': {'title': 'High-Fidelity 3D Chest CT Generation with Controlled Clinical Attributes', 'desc': "This paper presents CONFLUX, a 3D latent diffusion model designed for generating high-fidelity chest CT images. It allows for control over clinical attributes by conditioning on structured metadata, such as abnormality findings and patient demographics. The model utilizes a 3D variational autoencoder for compression and a rectified-flow transformer for generation in the latent space. Additionally, an online reinforcement learning stage enhances the model's ability to produce images that accurately reflect the requested clinical features."}}}, {'id': 'https://huggingface.co/papers/2607.03296', 'title': 'Taste-aware music retrieval from audio embeddings', 'url': 'https://huggingface.co/papers/2607.03296', 'abstract': "Abstract Audio encoders from HEAR families are evaluated for taste prediction, with gated late-fusion showing superior rank correlation and the best models achieving human-level accuracy on held-out music.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Crossmodal correspondences between sound and taste are well established in psychology and neuroscience, but largely absent from content-based multimedia retrieval. We formalise taste-from-audio prediction as a content-based music information retrieval benchmark over a perceptually validated multi-source corpus, comparing ten frozen audio encoders from the four HEAR families under a shared multi-task regression head, with gated late-fusion as a configurable variant. In order to assess the effectiveness of the models, we compute absolute error and rank correlation. The strongest systems predict the five tastes within a macro RMSE of 0.134; on held-out real music their error is less than half a single rater's deviation from the consensus (RMSE 0.13 vs. 0.28), so the model tracks the group consensus more closely than an average human rater, and well below the previous state of the art baseline (0.219). On absolute error the encoders are statistically flat, with a single VGGish matching the best fusion, but gated late-fusion's advantage is confined to rank correlation (macro Pearson r 0.724 vs. 0.666). Operationalised as a content-based retrieval index, the predicted taste space ranks a 309-item pool far more faithfully than a CLAP-text baseline, which sits at chance; ridge probes and an audio-bandstop knockout read the strongest representations against documented sound-taste correspondences.", 'score': 1, 'issue_id': 2777, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'a2e6c28a30747397', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Spanio', 'Antonio Rodà'], 'affiliations': ['University of Padua, Padua, Italy'], 'pdf_title_img': 'assets/pdf/title_img/2607.03296.jpg', 'data': {'categories': ['#benchmark', '#audio', '#retrieval'], 'emoji': '🎶', 'ru': {'title': 'Предсказание вкусов на основе аудио', 'desc': 'В данной работе оцениваются аудиокодеры из семейства HEAR для предсказания вкусов. Использование поздней гибридной фузии показало наилучшие результаты в корреляции рангов, а лучшие модели достигают точности на уровне человека на отложенных музыкальных данных. Мы формализуем предсказание вкусов на основе аудио как задачу извлечения информации из музыки и сравниваем десять замороженных аудиокодеров. Результаты показывают, что предложенные модели надежно отражают группу консенсуса лучше, чем среднестатистический оценщик.'}, 'en': {'title': 'Predicting Taste from Music: A New Benchmark in Audio Analysis', 'desc': 'This paper explores the use of audio encoders from the HEAR families to predict taste based on music, establishing a new benchmark in content-based music information retrieval. The study employs a multi-task regression approach and evaluates models using metrics like absolute error and rank correlation. Gated late-fusion techniques demonstrate superior performance, achieving human-level accuracy in taste prediction. The findings reveal that the best models closely align with group consensus, outperforming previous benchmarks in this innovative crossmodal task.'}}}, {'id': 'https://huggingface.co/papers/2607.04410', 'title': 'AI Wizards at EXIST 2026: Hierarchical Soft-Label Learning for Multimodal Sexism Identification in Memes', 'url': 'https://huggingface.co/papers/2607.04410', 'abstract': 'Abstract A multimodal sexism identification system for memes uses hierarchical conditional soft-label prediction with vision-language embeddings and a lightweight Gated MLP trained via KL divergence and uncertainty weighting.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present the AI Wizards submission to EXIST 2026 for multimodal sexism identification in memes. The task is composed of three, increasingly harder subtasks. We model them hierarchically as conditional soft-label prediction over empirical annotator distributions. Our system maps fixed Gemini Embedding 2 vision-language representations through a lightweight Gated MLP trained with KL divergence and homoscedastic uncertainty weighting. Our submissions ranked first on Task 2.3 and fourth on Tasks 2.1 and 2.2 on the official Soft-Soft leaderboards. The code is available at https://github.com/NLP-AI-Wizards/EXIST-2026', 'score': 0, 'issue_id': 2777, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'cbe6ae286e46a801', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Fasulo', 'Antonio Gravina', 'Luca Tedeschini', 'Luca Babboni'], 'affiliations': ['Everest Systems GmbH, Max-Jarecki-Straße 21, 69115 Heidelberg, Germany', 'Swiss Data Science Center, ETH Zürich, Andreasturm, Andreasstrasse 5, 8092 Zürich, Switzerland', 'Villanova.ai S.P.A, Località Sa Illetta, SS 195 KM 2.3, 09123 Cagliari, Italy'], 'pdf_title_img': 'assets/pdf/title_img/2607.04410.jpg', 'data': {'categories': ['#interpretability', '#multimodal', '#open_source', '#architecture', '#optimization', '#games'], 'emoji': '🖼️', 'ru': {'title': 'Идентификация сексизма в мемах с помощью ИИ', 'desc': 'В данной статье представлен многофункциональный метод идентификации сексизма в мемах. Система использует иерархическое предсказание условных мягких меток с помощью векторных представлений изображения и текста. Обучение происходит с использованием KL-дивергенции и взвешивания неопределенности. Мы достигли лучших результатов в определенных задачах соревнования EXIST 2026.'}, 'en': {'title': 'Harnessing Multimodal AI for Sexism Detection in Memes', 'desc': 'This paper presents a system for identifying sexism in memes using multiple types of data, known as multimodal analysis. It employs a hierarchical approach to predict soft labels based on the distributions of human annotators. The system utilizes vision-language embeddings and a lightweight Gated MLP, which is trained using techniques like KL divergence and uncertainty weighting. The authors achieved top rankings in specific tasks of the competition, demonstrating the effectiveness of their model.'}}}, {'id': 'https://huggingface.co/papers/2607.04064', 'title': 'Speaker-Disentangled Chunk-Wise Regression for Syllabic Tokenization', 'url': 'https://huggingface.co/papers/2607.04064', 'abstract': 'Abstract A speaker-disentangled syllabic tokenizer regresses perturbed student representations toward clean teacher targets to improve syllable boundary detection and speech language modeling performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Unsupervised syllabic tokenization aims to learn discrete syllabic tokens that capture latent linguistic content-related structure from raw speech. Recent syllabic tokenization methods employ teacher-student distillation of the pretrained HuBERT to organize latent speech frame representations into syllabic segments. However, when trained with an utterance-level cross-entropy objective, the model predicts speaker identity rather than linguistic content, thereby compromising the purity of syllabic tokens. To address this problem, we propose a speaker-disentangled syllabic tokenizer that regresses speaker-perturbed student representations toward clean teacher targets within fixed-length chunks. Experimental results demonstrate that our proposed method achieves state-of-the-art performance in syllable boundary detection and syllabic segment clustering. Moreover, a speech language model trained on our syllabic tokens achieves a 7% relative improvement in syntactic and semantic understanding over the phone-level SpiRit-LM.', 'score': 0, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'cd80f24e567431e8', 'github_url': '', 'github_stars': 0, 'authors': ['Ryota Komatsu', 'Kota Kawakita', 'Takuma Okamoto', 'Takahiro Shinozaki'], 'affiliations': ['Institute of Science Tokyo, Meguro, Tokyo 152-8550, Japan', 'National Institute of Information and Communications Technology, Kyoto 619-0289, Japan'], 'pdf_title_img': 'assets/pdf/title_img/2607.04064.jpg', 'data': {'categories': ['#optimization', '#audio', '#synthetic'], 'emoji': '🔊', 'ru': {'title': 'Выделение слогов без учета говорящего', 'desc': 'В данной статье представлен токенизатор, который отделяет слоги от конкретного говорящего, чтобы улучшить обнаружение границ слогов и модели языка речи. Метод основан на дистилляции знаний от учителя к студенту, чтобы организовать представления речи в слоговые сегменты. Проблема в том, что предшествующие методы часто фокусируются на идентификации говорящего, а не на лингвистическом содержании, что ухудшает качество токенов. Новый подход демонстрирует выдающиеся результаты в обнаружении границ слогов и кластеризации слогов.'}, 'en': {'title': 'Enhancing Syllable Detection with Speaker-Disentangled Tokenization', 'desc': 'This paper introduces a speaker-disentangled syllabic tokenizer that enhances the detection of syllable boundaries and improves speech language modeling. It uses a teacher-student distillation approach to refine syllabic tokens from raw speech, focusing on linguistic content rather than speaker identity. By regressing perturbed student representations towards clean teacher targets, the model effectively organizes speech frame representations into coherent syllabic segments. Experimental results show that this method outperforms previous techniques, achieving significant improvements in both syllable boundary detection and language understanding tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.03068', 'title': 'PixCon: Clean-Positive Contrastive Learning for Foundation-Model Semi-Supervised Segmentation', 'url': 'https://huggingface.co/papers/2607.03068', 'abstract': 'Abstract PixCon is a semi-supervised semantic segmentation framework that uses clean-positive pixel-contrastive learning with per-class memory banks to improve accuracy over existing methods.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Semi-supervised semantic segmentation (SSSS) has long turned on one question, which pseudo-labels to trust, and answered it with ever more careful confidence filtering. Foundation backbones change the regime: with a DINOv2 teacher a strict threshold already retains a measured 98%-clean pseudo-label set, so the accuracy that remains lives not in the filter but in how the embedding space is structured by class. We propose PixCon, a clean-positive pixel-contrastive framework. PixCon maintains a per-class memory bank that admits only labeled pixels the student already classifies correctly, guaranteeing a contamination-free positive set (ρ_F=0) by construction, unlike prior contrastive SSSS banks (ReCo, U^2PL) built from confidence-filtered pseudo-labels. It is a single branch over a consistency backbone, adds no inference-time parameters, and needs no bank-specific threshold. A first-order analysis of the supervised-InfoNCE gradient explains why contamination hurts: its false-positive term scales as ρ_F/(1-ρ_F), which we measure (0.018 on Pascal, 0.106 on ADE20K) rather than assume. Across Pascal VOC, Cityscapes, and ADE20K, PixCon matches or improves a strong DINOv2-based UniMatch V2 baseline in a compute-matched one-switch protocol: it improves every Pascal-1/8 seed (a per-seed gain of about +0.2 mIoU) and its three-seed mean reaches 87.90, the published UniMatch V2-B figure. Because contamination is already rare under foundation-model teachers, our analysis indicates the ρ_F=0 guarantee acts chiefly as robustness as teachers weaken, while the accuracy gain comes from cleaner positive supervision, making clean-positive contrast a robust, low-cost default for foundation-model SSSS.', 'score': 0, 'issue_id': 2776, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '4b9214d5abb5b357', 'github_url': '', 'github_stars': 0, 'authors': ['Ebenezer Tarubinga'], 'affiliations': ['Ebenworks Systems, Seoul, Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.03068.jpg', 'data': {'categories': ['#memory', '#optimization', '#training', '#data'], 'emoji': '🔍', 'ru': {'title': 'Чистая контрастная семантическая сегментация', 'desc': 'PixCon - это полусупервизированная структура для семантической сегментации, которая использует чистое положительное пиксельно-контрастное обучение. Она применяет память по классам, чтобы поддерживать только корректно классифицированные пиксели, обеспечивая тем самым отсутствие загрязнения в положительном наборе данных. В результате PixCon достигает или даже превосходит точность существующих методов на известных наборах данных. Это делает его надежным и экономически эффективным решением для задач полусупервизированной семантической сегментации.'}, 'en': {'title': 'Clean-Positive Contrast for Better Segmentation', 'desc': 'PixCon is a new framework for semi-supervised semantic segmentation that enhances accuracy by using clean-positive pixel-contrastive learning. It introduces per-class memory banks that only include correctly classified labeled pixels, ensuring a contamination-free positive set. This approach eliminates the need for complex confidence filtering and additional parameters during inference. The results show that PixCon outperforms existing methods, providing a robust and efficient solution for improving segmentation tasks with foundation models.'}}}, {'id': 'https://huggingface.co/papers/2607.07708', 'title': 'Accurate, Interdisciplinary and Transparent Structure-property Understanding with Deep Native Structural Reasoning', 'url': 'https://huggingface.co/papers/2607.07708', 'abstract': 'Abstract SciReasoner is a multimodal scientific foundation model that enables interpretable structural reasoning across proteins, molecules, and crystals by discretizing structural elements into a unified vocabulary for enhanced prediction and scientific inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Structure-property relationships are foundational to biology, chemistry and materials science, where function, reactivity and physical response emerge from spatial, chemical and periodic organization. Mechanistically explaining these relationships requires interpreting structural evidence through scientific principles and physical constraints, from stereochemistry and bonding to symmetry, energetics and periodic order. However, applying artificial intelligence to this process presents a joint challenge of representation and reasoning: models must preserve domain-native structural information while showing how specific evidence supports predictions under these constraints. Here we introduce SciReasoner, a multimodal scientific foundation model for native structural reasoning across proteins, small molecules and inorganic crystals. SciReasoner discretizes coordinates, topologies and periodic connectivities into a unified structure-aware vocabulary, treating structural tokens as addressable evidence units during reasoning. In homology-controlled Gene Ontology prediction, SciReasoner improves Cellular Component annotation for low-homology and orphan-like proteins, increasing F_{max} from 0.42 to 0.55. In chemistry, it raises single-step retrosynthesis accuracy from 0.63 to 0.72 while generating fragment-level disconnection and precursor-verification traces. In materials science, its representations separate elemental and compound phases and resolve high- and low-band-gap regimes. Across 86 benchmarks, SciReasoner achieves state-of-the-art performance on 67 tasks. Double-blind expert evaluation rates its reasoning traces as preferred or at least comparable to those of a frontier large language model in 98% of cases. By making structure an inspectable substrate for reasoning under scientific constraints, SciReasoner connects accurate prediction with interpretable scientific inference.', 'score': 71, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '8363cd358aac1a83', 'github_url': '', 'github_stars': 0, 'authors': ['Chen Tang', 'Yizhou Wang', 'Jianyu Wu', 'Lintao Wang', 'Shixiang Tang', 'Pengze Li', 'Encheng Su', 'Jun Yao', 'Jiabei Xiao', 'Yuqi Shi', 'Jielan Li', 'Hongxia Hao', 'Zhangyang Gao', 'Fang Wu', 'Ben Fei', 'Xiangyu Yue', 'Pan Tan', 'Bozitao Zhong', 'Jinouwen Zhang', 'Aoran Wang', 'Yan Lu', 'Jiaheng Liu', 'Xinzhu Ma', 'Liang Hong', 'Mingyue Zheng', 'Phil Torr', 'Bowen Zhou', 'Wanli Ouyang', 'Lei Bai'], 'affiliations': ['Drug Discovery and Design Center, State Key Laboratory of Drug Research, Shanghai Institute of Materia Medica, Chinese Academy of Sciences, China', 'Fudan University, China', 'Nanjing University, China', 'Shanghai Artificial Intelligence Laboratory, China', 'Shanghai Jiao Tong University, China', 'Stanford University, USA', 'The Chinese University of Hong Kong, Hong Kong', 'The University of Science and Technology of China, China', 'University of Chinese Academy of Sciences, China', 'University of Oxford, UK', 'University of Sydney, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2607.07708.jpg', 'data': {'categories': ['#multimodal', '#reasoning', '#interpretability', '#science'], 'emoji': '🔬', 'ru': {'title': 'Новая эра интерпретируемого структурного моделирования', 'desc': 'SciReasoner — это мультимодальная научная модель, которая позволяет интерпретировать структурные связи между белками, молекулами и кристаллами. Модель использует унифицированный словарь для дискретизации структурных элементов, что улучшает предсказание и научные выводы. SciReasoner достигает выдающихся результатов в различных задачах, повышая точность аннотации и синтеза по сравнению с предыдущими методами. Она соединяет точные предсказания с интерпретируемыми научными выводами, что важно для биологии, химии и науки о материалах.'}, 'en': {'title': 'Unlocking Scientific Insights through Structural Reasoning', 'desc': 'SciReasoner is a multimodal foundation model designed for structural reasoning in the fields of biology, chemistry, and materials science. It converts structural elements into a unified vocabulary, allowing for better predictions and scientific inferences. The model excels in interpreting complex relationships between structure and function, improving accuracy in tasks like protein annotation and retrosynthesis. With state-of-the-art performance across numerous benchmarks, SciReasoner enhances the interpretability of AI predictions by linking them to scientific principles and constraints.'}}}, {'id': 'https://huggingface.co/papers/2607.07608', 'title': 'Dual Latent Memory in Vision-Language-Action Models for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2607.07608', 'abstract': 'Abstract LaMem-VLA introduces a latent-memory-native framework that integrates historical experience into vision-language-action reasoning through coordinated memory components operating in the same latent space.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Mainstream Vision-Language-Action (VLA) models predict actions primarily from the current observation under a Markovian assumption, thus struggling with long-horizon, temporally dependent tasks. Existing memory-augmented VLAs either expand the observation window or retrieve history from the memory bank as auxiliary policy-side context. However, they leave memory outside the native latent embedding space of VLA reasoning, preventing historical experience from being fluidly interleaved with multimodal reasoning and action formation. To this end, we introduce LaMem-VLA, a latent-memory-native framework that reconstructs historical experience into latent memory tokens and directly interweaves them with VLA reasoning. At its core, LaMem-VLA introduces four coordinated components: (i) a curator that organizes historical experience into two complementary short-term and long-term memory vaults; (ii) a seeker that queries both vaults using the multimodal cognition to retrieve context-relevant evidence; (iii) a condenser that reconstructs the retrieved evidence into compact short-term and long-term latent memory tokens; and (iv) a weaver that injects these memory tokens with the current observation and instruction into one continuous embedding sequence. By representing, retrieving, and consuming historical experience entirely in the same continuous latent space, LaMem-VLA enables memory to directly participate in VLA reasoning and guide action generation under a bounded context. Extensive experiments on SimplerEnv and LIBERO demonstrate the superiority of our LaMem-VLA.', 'score': 44, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '4260145f557b0252', 'github_url': '', 'github_stars': 0, 'authors': ['Hongyu Qu', 'Jianzhe Gao', 'Xiaobin Hu', 'Shaohuan Yang', 'Xinlei Yu', 'Rui Yan', 'Wenguan Wang', 'Xiangbo Shu', 'Shuicheng Yan'], 'affiliations': ['Nanjing University of Science and Technology', 'National University of Singapore', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.07608.jpg', 'data': {'categories': ['#multimodal', '#agent_memory', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Интеграция памяти в рассуждения VLA', 'desc': 'Статья представляет модель LaMem-VLA, которая интегрирует исторический опыт в рассуждения по зрению, языку и действиям (VLA) через координированные компоненты памяти. Этот подход позволяет эффективно использовать как краткосрочную, так и долгосрочную память, что улучшает обработку временно зависимых задач. Модель реконструирует исторический опыт в латентные токены памяти, которые плавно вписываются в многомодальное рассуждение. Эксперименты показывают, что LaMem-VLA превосходит существующие модели, улучшая генерацию действий на основе ограниченного контекста.'}, 'en': {'title': 'Integrating Memory for Enhanced VLA Reasoning', 'desc': "LaMem-VLA is a new framework that enhances vision-language-action (VLA) reasoning by integrating historical experiences directly into the reasoning process. It uses coordinated memory components that operate in the same latent space, allowing for a more fluid interaction between past experiences and current observations. The framework includes a curator for organizing memories, a seeker for retrieving relevant information, a condenser for creating memory tokens, and a weaver for combining these tokens with current inputs. This approach improves the model's ability to handle long-term tasks by making memory an integral part of the decision-making process."}}}, {'id': 'https://huggingface.co/papers/2607.07675', 'title': 'Scaling Mixture-of-Experts Video Pretraining for Embodied Intelligence', 'url': 'https://huggingface.co/papers/2607.07675', 'abstract': 'Abstract LingBot-Video presents a DiT-based video pretraining framework with Mixture-of-Experts architecture, specialized data augmentation, and multi-dimensional reward system for embodied intelligence applications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Despite the recent promise in robot control, video generative models suffer from a domain mismatch due to their primary focus on content creation. For example, their design inherently prioritizes visual fidelity and creativity over computational efficiency and physical realism. In this work, we present LingBot-Video, a DiT-based video pretraining paradigm specifically tailored for embodied intelligence. From the architecture perspective, we adopt the Mixture-of-Experts (MoE), instead of dense, framework to achieve a better trade-off between modeling capacity and inference efficiency, and manage to scale it up from scratch. From the data perspective, we construct a data profiling engine that augments standard internet videos with extensive robot-oriented footage, encompassing manipulation, navigation, and egocentric perspectives, to equip the base model with an intrinsic understanding of actions and world dynamics. From the training perspective, we develop a multi-dimensional reward system to enforce the alignment regarding physical rationality and task completion, going beyond standard criteria such as aesthetics, prompt-following, and motion consistency. Comprehensive evaluations validate its performance and efficiency as a video foundation model. We contribute LingBot-Video as the inaugural large-scale, open-source MoE video foundation model to the community, in a pioneering effort to bridge digital creativity and physical actuation.', 'score': 39, 'issue_id': 2783, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'd4086358994a5dbe', 'github_url': '', 'github_stars': 0, 'authors': ['Shuailei Ma', 'Jiaqi Liao', 'Xinyang Wang', 'Jingjing Wang', 'Chaoran Feng', 'Zijing Hu', 'Chong Bao', 'Zichen Xi', 'Yuqi Gan', 'Weisen Wang', 'Yanhong Zeng', 'Qin Zhao', 'Zifan Shi', 'Wei Wu', 'Hao Ouyang', 'Qiuyu Wang', 'Shangzhan Zhang', 'Jiahao Shao', 'Yipengjing Sun', 'Liangxiao Hu', 'Lunke Pan', 'Nan Xue', 'Kecheng Zheng', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Ka Leong Cheng'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07675.jpg', 'data': {'categories': ['#architecture', '#agents', '#alignment', '#dataset', '#open_source', '#training', '#games'], 'emoji': '🤖', 'ru': {'title': 'LingBot-Video: новый подход к обучению видео для интеллекта', 'desc': 'Статья представляет LingBot-Video — фреймворк предварительного обучения видео, основанный на DiT и архитектуре Mixture-of-Experts. Он использует специализированное увеличение данных и многомерную систему вознаграждений для приложений в области встраиваемого интеллекта. LingBot-Video направлен на преодоление разницы между генерацией видео и робототехническим контролем, фокусируя внимание на физической реалистичности и эффективности вычислений. Проведенные оценки подтверждают его производительность как видео базовой модели и вносят вклад в сообщество как первый крупномасштабный открытый MoE видео фреймворк.'}, 'en': {'title': 'Bridging Digital Creativity and Physical Intelligence', 'desc': "LingBot-Video introduces a video pretraining framework based on DiT and utilizes a Mixture-of-Experts architecture to enhance efficiency and modeling capacity for embodied intelligence tasks. It addresses the limitations of existing video generative models by focusing on physical realism and computational efficiency rather than just visual quality. The framework incorporates specialized data augmentation techniques to enrich the training dataset with robot-centric video content, improving the model's understanding of actions and environmental dynamics. Additionally, a multi-dimensional reward system is implemented to ensure alignment with physical rationality and task completion, making it a significant advancement in video foundation models."}}}, {'id': 'https://huggingface.co/papers/2607.07534', 'title': 'Infinite Worlds with Versatile Interactions', 'url': 'https://huggingface.co/papers/2607.07534', 'abstract': 'Abstract An advanced world modeling system with extended interaction capabilities, real-time processing, diverse interactive elements, and multi-agent behavior control for collaborative virtual environments.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present LingBot-World 2.0 (also known as LingBot-World-Infinity), an advanced iteration of LingBot-World featuring four distinct upgrades. (1) Our model achieves an unbounded interaction horizon while maintaining consistent output quality, benefiting from a carefully crafted causal pretraining paradigm. (2) Through distilling a real-time variant from the base model, our system guarantees rapid response time, sufficient to drive 720p video streams at 60 fps. (3) Compared to the previous version, this update introduces highly diverse interactive elements, comprising a broader spectrum of actions (e.g., attacking, archery, spell-casting, and shooting) alongside a richer variety of text-driven events. (4) We pioneer the integration of an agentic harness within the domain of world modeling, wherein a pilot agent is tasked with planning and executing character behaviors, while a director agent is responsible for synthesizing novel environmental elements as the scene progresses. Additionally, to facilitate a shared experience, we develop an interface that permits multiple players to simultaneously immerse themselves in this vivid world simulator. We pair our primary 14B model with a lightweight 1.3B counterpart, which supports effortless deployment on a single GPU.', 'score': 21, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '9d84744c34237508', 'github_url': '', 'github_stars': 0, 'authors': ['Zelin Gao', 'Qiuyu Wang', 'Jiapeng Zhu', 'Jingye Chen', 'Zichen Liu', 'Qingyan Bai', 'Jiahao Wang', 'Yufeng Yuan', 'Hanlin Wang', 'Yichong Lu', 'Ka Leong Cheng', 'Haojie Zhang', 'Jian Gao', 'Tianrui Feng', 'Yuzheng Liu', 'Yao Yao', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Hao Ouyang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07534.jpg', 'data': {'categories': ['#agents', '#agent_memory', '#games', '#multimodal', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'Мир нового взаимодействия: LingBot-World 2.0', 'desc': 'В статье представлена новая версия модели мироощущения LingBot-World 2.0 с расширенными возможностями взаимодействия и многопользовательскими функциями. Модель обеспечивает быструю обработку данных в реальном времени и богатый набор интерактивных элементов. Она использует новый подход к предобучению, что улучшает качество вывода и позволяет поддерживать плавность видео в разрешении 720p при 60 кадрах в секунду. Также в системе внедрены агенты, которые управляют поведением персонажей и создают новые элементы окружения в процессе игры.'}, 'en': {'title': 'Article', 'desc': ''}}}, {'id': 'https://huggingface.co/papers/2607.04434', 'title': 'RoboDojo: A Unified Sim-and-Real Benchmark for Comprehensive Evaluation of Generalist Robot Manipulation Policies', 'url': 'https://huggingface.co/papers/2607.04434', 'abstract': 'Abstract RoboDojo presents a unified sim-and-real benchmark for evaluating generalist robot manipulation policies across diverse tasks and evaluation dimensions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Generalist robot manipulation policies have advanced rapidly, yet existing benchmarks remain limited in systematically evaluating their capabilities. Many rely on simple, short-horizon, or skill-narrow tasks with limited capability coverage, and are often conducted only in simulation or only in the real world. Simulation enables scalable feedback but misses physical deployment challenges, while real-world evaluation is costly, time-consuming, and difficult to reproduce. We introduce RoboDojo, a unified sim-and-real benchmark for comprehensive evaluation of generalist robot manipulation policies. RoboDojo includes 42 simulation tasks and 18 real-world tasks covering diverse and complementary manipulation capabilities. The simulation benchmark evaluates five dimensions: generalization, memory, precision, long-horizon execution, and open-vocabulary instruction following, while the real-world benchmark exposes policies to challenging physical-world deployment conditions. RoboDojo supports scalable evaluation through heterogeneous parallel simulation in Isaac Sim and provides RoboDojo-RealEval, a reproducible real-world evaluation system with remote cloud access, standardized hardware, scene reset, evaluation protocol, and deployment interface. Together with XPolicyLab, policies can be integrated once and evaluated across simulation and real-world settings with minimal adaptation. We integrate 30 policies into XPolicyLab and evaluate them on RoboDojo, establishing a public leaderboard and systematic analysis of current policy performance. The website is available at http://robodojo-benchmark.com/.', 'score': 6, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '30aeccef8021ca46', 'github_url': '', 'github_stars': 0, 'authors': ['Tianxing Chen', 'Yue Chen', 'Zixuan Li', 'Junyuan Tang', 'Kailun Su', 'Haoran Lu', 'Weijie Wan', 'Baijun Chen', 'Songling Liu', 'Haowen Yan', 'Honghao Su', 'Zhiyang Dou', 'Kaixuan Wang', 'Dandan Zhang', 'Yunze Liu', 'Yan Qin', 'Qiwei Liang', 'Qiwei Wu', 'Zijian Lin', 'Wenwei Lin', 'Yuran Wang', 'Minghua He', 'Tianshu Wu', 'Ruihai Wu', 'Jingquan Zhou', 'Kai-Chong Lei', 'Haibao Yu', 'Yuanfeng Ji', 'Weiyang Jin', 'Guanyu Lin', 'Xiaofan Li', 'Qi Xiong', 'Renjing Xu', 'Zhongyu Li', 'Wenhao Chai', 'Enze Xie', 'Ziwei Wang', 'Yao Mu', 'Hao Dong', 'Wojciech Matusik', 'Mingyu Ding', 'Wenbo Ding', 'Ping Luo', 'Masayoshi Tomizuka'], 'affiliations': ['CMU', 'CUHK', 'HKUST (GZ)', 'IC', 'MIT', 'MMLab@HKU', 'NTU', 'NU', 'NUS', 'PKU', 'Princeton', 'SJTU', 'Stanford', 'THU', 'UC Berkeley', 'UNC', 'Yale', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2607.04434.jpg', 'data': {'categories': ['#long_context', '#open_source', '#benchmark', '#robotics', '#memory', '#games'], 'emoji': '🤖', 'ru': {'title': 'Универсальная бенчмарка для роботов', 'desc': 'Статья представляет RoboDojo — универсальную бенчмарку для оценки общих политик манипуляции роботами в различных задачах. RoboDojo включает 42 задачи в симуляции и 18 задач в реальном мире, обеспечивая разнообразие и взаимодополняемость навыков манипуляции. Бенчмарк оценивает такие параметры, как обобщение, память, точность и выполнение длительных инструкций. Это решение упрощает и делает воспроизводимой оценку робототехнических политик как в симуляции, так и в реальном мире.'}, 'en': {'title': 'RoboDojo: Bridging Sim and Real for Robot Evaluation', 'desc': 'RoboDojo is a new benchmark designed to evaluate generalist robot manipulation policies in both simulated and real-world environments. It addresses the limitations of existing benchmarks by providing a comprehensive set of tasks that cover various manipulation capabilities. The benchmark includes 42 simulation tasks and 18 real-world tasks, assessing dimensions like generalization, precision, and long-horizon execution. With tools for scalable evaluation and a public leaderboard, RoboDojo aims to enhance the reproducibility and effectiveness of robot policy assessments.'}}}, {'id': 'https://huggingface.co/papers/2607.07386', 'title': 'Sparse Delta Memory: Scaling the State of Linear RNNs through Sparsity', 'url': 'https://huggingface.co/papers/2607.07386', 'abstract': 'Abstract Sparse Delta Memory extends gated linear RNNs with sparse addressing to dramatically increase hidden state capacity for improved long-context learning and retrieval while maintaining computational efficiency.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Linear attention models allow a fixed state size and a fixed amount of compute per token. However, due to their limited state size, linear attention models fall behind in long-context recall compared to softmax-attention-based transformer architectures. Increasing the state size of linear attention improves recall performance but at the cost of higher FLOPs. In this work, we introduce Sparse Delta Memory (SDM), an architecture that scales the hidden state of gated linear RNNs to orders of magnitude higher capacity using a sparse addressing scheme. SDM extends the Gated DeltaNet architecture by replacing the den
