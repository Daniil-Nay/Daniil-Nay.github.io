ультатов в условиях нехватки ресурсов.'}, 'en': {'title': 'Efficient Stance Detection with PAST-TIDE', 'desc': 'PAST-TIDE is a stance detection system designed for the StanceNakba Shared Task. It innovatively uses statement tuning by redefining stance detection as a cloze-style masked language modeling task. The system employs prototypical contrastive learning to enhance training efficiency and incorporates topic-conditional layer normalization for better performance in Arabic stance detection. PAST-TIDE demonstrates strong results with macro-F1 scores of 0.75 and 0.74, showing that small modifications to pre-trained models can yield competitive outcomes in low-resource environments.'}}}, {'id': 'https://huggingface.co/papers/2607.06291', 'title': 'AlayaWorld: Long-Horizon and Playable Video World Generation', 'url': 'https://huggingface.co/papers/2607.06291', 'abstract': 'Abstract AlayaWorld is an open-source framework for creating interactive generative worlds that enables real-time user interaction and supports diverse actions within a modular architecture.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Game worlds have traditionally been built through labor-intensive production pipelines, making them costly to develop, difficult to customization, and expensive to modify after deployment. Recent advances in video world models offer a fundamentally different paradigm. Rather than explicitly authoring every component of a virtual environment, these models autoregressively synthesize future observations conditioned on the current world state and user interactions, enabling playable worlds to be generated online. Trained on both gameplay recordings and real-world videos, they can capture diverse visual appearances and physical dynamics, opening new opportunities for interactive applications beyond gaming, including embodied intelligence. In this paper, we present AlayaWorld, a full-stack open-source framework for building interactive generative worlds. AlayaWorld enables open-ended real-time interaction, allowing users to freely navigate and perform diverse actions such as combat, spell casting, and monster summoning. The framework unifies the complete development-from data preparation model architecture, model training, inference acceleration, and deployment-within a modular and extensible architecture. Alongside the framework, we release reproducible pipelines, reference implementations, evaluation tools, and comprehensive documentation, establishing a practical foundation for future research and real-time applications of generative world models.', 'score': 49, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '10274a0b0e27042e', 'github_url': '', 'github_stars': 0, 'authors': ['AlayaWorld Team', 'Kaipeng Zhang', 'Chuanhao Li', 'Yifan Zhan', 'Yongtao Ge', 'Yuanyang Yin', 'Jiaming Tan', 'Kang He', 'Liaoyuan Fan', 'Ruicong Liu', 'Xiaojie Xu', 'Xuangeng Chu', 'Zhen Li', 'Zhengyuan Lin', 'Zhixiang Wang', 'Zian Meng', 'Zihui Gao'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.06291.jpg', 'data': {'categories': ['#games', '#open_source', '#inference', '#training', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'Создайте свой мир с AlayaWorld!', 'desc': 'AlayaWorld — это открытая платформа для создания интерактивных генеративных миров, которая позволяет пользователям взаимодействовать в реальном времени. Благодаря использованию модели видеомиров, разработчики могут автоматически генерировать игровые модели, основываясь на текущем состоянии мира и действиях пользователя. Это значительно упрощает процесс создания и настройки виртуальных сред, делая их более доступными для модификации и улучшений. В работе представлены инструменты и документация, которые помогут исследователям и разработчикам использовать генеративные модели в своих проектах.'}, 'en': {'title': 'Empowering Interactive Worlds with AlayaWorld', 'desc': 'AlayaWorld is an innovative open-source framework designed for creating interactive generative worlds that allow real-time user engagement. It leverages advanced video world models to synthesize virtual environments based on user interactions, eliminating the need for traditional, labor-intensive development processes. By training on gameplay recordings and real-world videos, it captures a wide range of visual and physical dynamics, making it suitable for various applications beyond gaming. The framework provides a comprehensive development ecosystem, including data preparation, model training, and deployment, facilitating future research in generative world models.'}}}, {'id': 'https://huggingface.co/papers/2607.06560', 'title': 'Vision as Unified Multimodal Generation', 'url': 'https://huggingface.co/papers/2607.06560', 'abstract': 'Abstract A unified multimodal model formulates computer vision tasks as generation problems using natural language and visual prompts, achieving performance comparable to specialized systems across diverse vision tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We formulate computer vision as unified multimodal generation, where heterogeneous visual tasks are expressed in the native text and image generation spaces of a unified multimodal model, without task-specific architectures. Under this formulation, SenseNova-Vision uses natural-language instructions and optional visual prompts to specify tasks, target regions or views, and decoding conventions, and generates responses as text for symbolic outputs, images for dense spatial predictions, or mixed text-and-image outputs for compositional tasks. To support large-scale training, we convert diverse computer vision annotations into instruction-response examples compatible with these generation spaces, resulting in the SenseNova-Vision Corpus, a computer-vision instruction-response corpus spanning text, image, and mixed targets. Starting from an off-the-shelf pretrained unified multimodal model, SenseNova-Vision is trained primarily on this corpus, with auxiliary multimodal data used as a capability-preserving mixture, and requires no task-specific prediction heads or architectural modifications. The resulting model covers a broad range of vision tasks, including detection, OCR, keypoint estimation, segmentation, depth estimation, surface normal prediction, point maps, and camera pose estimation, while supporting language-defined variants that combine category, color, region, and other visual cues. Experiments show that a single unified model can match leading task-specialized systems across structured visual understanding, dense geometric prediction, segmentation, and multi-view visual geometry. These results suggest unified multimodal generation as a scalable route for integrating computer vision capabilities into general-purpose foundation models. The model and corpus are publicly available.', 'score': 21, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '3096eb5a576dd52b', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaoyang Han', 'Jianhua Li', 'Kewang Deng', 'Zukai Chen', 'Xuanke Shi', 'Sihan Wang', 'Boxuan Li', 'Linyan Wang', 'Siyi Xie', 'Xin You', 'Jinsheng Quan', 'Zhongang Cai', 'Haiwen Diao', 'Ziwei Liu', 'Lei Yang', 'Dahua Lin', 'Quan Wang'], 'affiliations': ['Nanyang Technological University', 'Peking University', 'SenseTime Research', 'Shanghai Jiao Tong University', 'The Chinese University of Hong Kong', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.06560.jpg', 'data': {'categories': ['#games', '#multimodal', '#optimization', '#dataset', '#data', '#survey'], 'emoji': '🖼️', 'ru': {'title': 'Унифицированная генерация для задач компьютерного зрения', 'desc': 'В этой статье представлен унифицированный многомодальный подход к задачам компьютерного зрения, который рассматривает их как задачи генерации с использованием языка и визуальных подсказок. Модель SenseNova-Vision способна выполнять широкий спектр задач, таких как обнаружение объектов, сегментация и оценка глубины, без необходимости в специфических архитектурах для каждой задачи. Используя аннотации из различных источников, была создана база данных SenseNova-Vision, позволяющая обучать модель на примерах инструкций и ответов. Результаты показали, что одна унифицированная модель может достигать уровня специализированных систем в различных областях визуального понимания.'}, 'en': {'title': 'Unified Multimodal Generation for Computer Vision', 'desc': 'This paper presents a unified multimodal model that treats various computer vision tasks as generation problems using both natural language and visual prompts. The model, called SenseNova-Vision, can perform a wide range of tasks without needing specific architectures for each task. It generates outputs in different formats, such as text for symbolic tasks and images for spatial predictions, based on instructions and visual cues. The results indicate that this single model can achieve performance similar to specialized systems, suggesting a scalable approach to integrating computer vision into general-purpose models.'}}}, {'id': 'https://huggingface.co/papers/2607.02980', 'title': 'Hierarchical Sparse Attention Done Right: Toward Infinite Context Modeling', 'url': 'https://huggingface.co/papers/2607.02980', 'abstract': 'Abstract Hierarchical Landmark Sparse Attention enables efficient long-context language modeling by learning chunk selection end-to-end, achieving performance comparable to full attention while extrapolating beyond training context lengths.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scaling modern large language models (LLMs) to long contexts is limited by the quadratic computation cost, and poor length extrapolation of dense attention. Chunk-wise sparse attention offers a promising alternative, but all existing methods fall short of full attention because of their inaccurate chunk selection. We propose Hierarchical Landmark Sparse (HiLS) Attention, a chunk-wise sparse attention mechanism that learns chunk selection end-to-end under the language-modeling (LM) loss. HiLS factorizes attention hierarchically: each query performs attention independently with each retrieved chunk to extract chunk-specific information, and the resulting outputs are fused according to chunk retrieval scores. By incorporating retrieval scores into the forward attention computation, HiLS optimizes them directly with the LM loss, enabling end-to-end retrieval learning and native sparse training. Experimental results show that HiLS-Attention achieves performance comparable to, and in some cases better than, full attention at in-domain context lengths. Meanwhile, HiLS-Attention extrapolates more than 64times the training context length with 90% retrieval accuracy, far beyond full attention. Moreover, existing full-attention models can be converted to HiLS-Attention with lightweight continued pretraining, preserving in-domain performance while acquiring ultra-long-context extrapolation. Together with its sparse KV access and computation, HiLS-Attention breaks the usual efficiency-performance trade-off, enabling long-context LLMs that are both more efficient and more effective on general long-context tasks than their full-attention counterparts.', 'score': 19, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '2eadf86f5f5d4f1e', 'github_url': '', 'github_stars': 0, 'authors': ['Xiang Hu', 'Xinyu Wei', 'Hao Gu', 'Minshen Zhang', 'Tian Liang', 'Huayang Li', 'Lei Zhu', 'Yan Wang', 'Sirui Han', 'Yushi Bai', 'Kewei Tu', 'Haitao Mi', 'Leo Liang'], 'affiliations': ['ShanghaiTech University', 'Tencent HY Team', 'The Hong Kong University of Science and Technology', 'University of California, San Diego'], 'pdf_title_img': 'assets/pdf/title_img/2607.02980.jpg', 'data': {'categories': ['#training', '#inference', '#long_context', '#optimization', '#retrieval', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Эффективное внимание для длинных контекстов', 'desc': 'Статья представляет новый механизм внимания под названием Hierarchical Landmark Sparse (HiLS) Attention, который позволяет эффективно обрабатывать длинные контексты в языковом моделировании. Этот подход учит выборChunks на этапе обучения, что позволяет достигать производительности, сопоставимой с полной моделью внимания. HiLS использует иерархическую факторизацию внимания, что позволяет извлекать специфичную информацию из каждого выбранного Chunk. Результаты экспериментов показывают, что данный метод превосходит существующие решения по эффективности и точности на длинных контекстах.'}, 'en': {'title': 'Efficient Long-Context Modeling with HiLS Attention', 'desc': 'The paper introduces Hierarchical Landmark Sparse (HiLS) Attention, a new method for efficient long-context language modeling. It learns to select chunks of data end-to-end, allowing it to perform comparably to traditional full attention while also extending beyond the training context length. HiLS Attention uses a hierarchical approach where each query processes information from different chunks independently, optimizing the selection based on retrieval scores. This method not only improves efficiency but also enhances performance on long-context tasks, making it a strong alternative to full attention models.'}}}, {'id': 'https://huggingface.co/papers/2607.05511', 'title': 'Light-Omni: Reflex over Reasoning in Agentic Video Understanding with Long-Term Memory', 'url': 'https://huggingface.co/papers/2607.05511', 'abstract': "Abstract Light-Omni is a multimodal agent framework that enables efficient video understanding through dual contextual states, achieving faster and more accurate video processing by eliminating iterative reasoning while maintaining semantic alignment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Agentic video understanding equips models with long-term memory to autonomously process and respond to continuous, long-horizon multimodal streams. However, advanced video agents often rely on ``detective-style'' iterative reasoning for action control (e.g., search) and evidence aggregation, incurring prohibitive costs and latency. We argue that such heavy reasoning primarily compensates for the lack of global context and semantic misalignment in retrieval. This paper introduces Light-Omni, a multimodal agent framework for reflexive and lightweight video understanding. It achieves this through dual contextual states that instantly build the required context in a single forward pass. First, we maintain a global state, a finite-sized multimodal script continuously consolidated from episodic memory, serving as the global context for Light-Omni. Through hierarchical merging, it preserves recent details while summarizing past events. Second, conditioned on this global context, we generate a parametric latent state that directly drives autonomous actions and produces retrieval embeddings, with minimal latency. Benefiting from this coupled design, Light-Omni achieves semantically aligned retrieval and reflexive responses while avoiding iterative reasoning. Extensive experiments validate the effectiveness of Light-Omni across multiple video benchmarks. Notably, it outperforms M3-Agent with an average 2.4% accuracy gain, a 12.1times speedup, and a 2.6times improvement in GPU memory efficiency. Furthermore, it serves as a memory system to enhance both the performance and efficiency of existing MLLMs. Project page: https://clare-nie.github.io/Light-Omni.", 'score': 18, 'issue_id': 2780, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '290f321dccb4ed94', 'github_url': '', 'github_stars': 0, 'authors': ['Chang Nie', 'Jiaju Wei', 'Junlan Feng', 'Chaoyou Fu', 'Caifeng Shan'], 'affiliations': ['Nanjing University'], 'pdf_title_img': 'assets/pdf/title_img/2607.05511.jpg', 'data': {'categories': ['#memory', '#multimodal', '#agents', '#benchmark', '#agent_memory', '#retrieval', '#long_context'], 'emoji': '📹', 'ru': {'title': 'Эффективное понимание видео без итеративных рассуждений', 'desc': 'Light-Omni — это фреймворк для мультифункциональных агентов, который улучшает понимание видео с помощью двойных контекстуальных состояний. Он позволяет быстрее и точнее обрабатывать видео, избегая затратного итеративного рассуждения и поддерживая семантическое согласование. Используя глобальное состояние и параметрическое латентное состояние, Light-Omni обеспечивает автономное реагирование и извлечение информации с минимальными задержками. Эксперименты показывают, что Light-Omni превосходит предыдущие модели по точности, скорости и эффективности использования памяти на GPU.'}, 'en': {'title': 'Revolutionizing Video Understanding with Light-Omni', 'desc': 'Light-Omni is a multimodal agent framework designed for efficient video understanding by utilizing dual contextual states. It eliminates the need for iterative reasoning, which often slows down processing, while ensuring semantic alignment. The framework maintains a global state that consolidates information from memory and generates a parametric latent state for quick, autonomous actions. Experimental results show that Light-Omni significantly outperforms existing models in accuracy, speed, and memory efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.02963', 'title': 'Parallelized Autoregressive Decoding for Omni-Modal Dense Video Captioning', 'url': 'https://huggingface.co/papers/2607.02963', 'abstract': 'Abstract A parallelized autoregressive framework for dense video captioning that improves generation efficiency by exploiting weak local dependencies across temporally distinct events while maintaining temporal grounding accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Dense video captioning aims to generate temporally grounded descriptions of video events, benefiting both event-level video understanding and generation. In this domain, autoregressive video large language models have emerged as a prevalent paradigm due to their strong generative and cross-modal modeling capacity. However, generating dense captions under the token-by-token paradigm severely limits inference efficiency and hinders scalability as video length and event density increase. In this work, we propose a parallelized autoregressive framework that not only improves generation efficiency but also enhances temporally grounded captioning performance. Our key insight is to exploit the weak local dependencies across temporally distinct events to restructure the causal dependency graph, thereby enabling lossless parallel generation. Specifically, tokens with weak cross-event dependencies can be decoded in parallel, while tightly coupled tokens within each event retain sequential decoding to preserve local semantic coherence. To realize this insight, we introduce two key components for lossless parallel decoding: (1) a latent global planning mechanism that automatically learns the event-level structure and produces compact tokens encoding global inter-event causality while adaptively aggregating event-level audio-visual semantics, guiding subsequent dependency restructuring and parallel decoding; and (2) an event-factorized parallel decoding mechanism that effectively balances local focus with global inter-event awareness. Experiments on various benchmarks demonstrate the clear advantage of our approach in both efficiency and performance in omni-modal event grounding and captioning. Project website: https://github.com/showlab/PadCaptioner.', 'score': 16, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '3916710b68b2c723', 'github_url': '', 'github_stars': 0, 'authors': ['Wenzheng Zeng', 'Siyi Jiao', 'Chen Gao', 'Hwee Tou Ng', 'Mike Zheng Shou'], 'affiliations': ['National University of Singapore, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.02963.jpg', 'data': {'categories': ['#benchmark', '#games', '#multimodal', '#optimization', '#architecture'], 'emoji': '🎬', 'ru': {'title': 'Эффективное видеокаптирование с параллельным декодированием', 'desc': 'В данной работе представлена параллелизованная авторегрессионная структура для плотной видеокаптации, которая улучшает эффективность генерации за счет использования слабых локальных зависимостей между временно удаленными событиями. Это решение позволяет сохранять точность временной привязки и значительно увеличивает скорость генерации описаний событий в видео. Используя новый механизм планирования и параллельного декодирования, модель справляется с сложными зависимостями и позволяет эффективно обрабатывать длинные видео. Эксперименты показывают, что предложенный подход превосходит существующие методы как по эффективности, так и по качеству генерации подписи.'}, 'en': {'title': 'Parallelize Video Captioning for Faster and Smarter Descriptions', 'desc': 'This paper presents a new framework for dense video captioning that enhances efficiency by allowing parallel generation of captions. It leverages weak local dependencies between different events in a video to restructure how captions are generated, enabling faster processing without losing accuracy. The framework includes a global planning mechanism to understand event relationships and a parallel decoding method that balances local and global context. Experiments show that this approach significantly improves both the speed and quality of video captioning compared to traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2607.03451', 'title': 'SkillOpt-Lite: Better and Faster Agent Self-evolution via One Line of Vibe', 'url': 'https://huggingface.co/papers/2607.03451', 'abstract': 'Abstract A minimal viable pipeline for skill optimization is proposed through Zeroth-Order optimization formalization, eliminating redundancies while maintaining convergence and generalization through trajectory exploration, consensus mining, and validation gating principles.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct While skill optimization for autonomous agents has gained traction, existing methods rely on complex pipelines. This leaves a fundamental question unaddressed: What constitutes a minimal viable pipeline for skill optimization, where every component is justified by theory or empirical necessity? We formalize skill optimization via Zeroth-Order (ZO) optimization, mapping classical counterparts (central difference, trust regions) to recent literature. Noting that unlike blind numerical perturbations in classical ZO, skill trajectories serve as interpretable debugging feedback. Grounded in Claude Code philosophy and PAC learning, we establish three principles for convergence and generalization: file-system-based trajectory exploration, consensus attribute mining, and independent validation gating. Eliminating redundancies, we propose SkillOpt-Lite. It accelerates convergence and outperforms full SkillOpt: improving LiveMath by +8.8 points on GPT-5.5 and +25.4 points on GPT-5.4-nano, allowing the nano model to surpass standard GPT-5.4 optimized by SkillOpt. Finally, we integrate our framework into production coding agents like VSCode Copilot, enabling developers to evolve agent skills via one line of vibe. Because our framework treats all agent components simply as standard editable code, this minimal pipeline naturally generalizes to full harness optimization (HarnessOpt). On SpreadsheetBench, HarnessOpt enables GPT-5.4-nano to achieve 0.7758 accuracy, outperforming the larger GPT-5.5 running standard pipelines (0.7620). Code is available at https://github.com/EvolvingLMMs-Lab/SkillOpt-Lite.', 'score': 14, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '9be198da2c3e4cf0', 'github_url': '', 'github_stars': 0, 'authors': ['Yifei Shen', 'Bo Li', 'Xinjie Zhang'], 'affiliations': ['LMMs-Lab', 'Microsoft', 'NTU MMLab'], 'pdf_title_img': 'assets/pdf/title_img/2607.03451.jpg', 'data': {'categories': ['#optimization', '#agents', '#training'], 'emoji': '🚀', 'ru': {'title': 'Минимальная жизнеспособная pipeline для оптимизации навыков', 'desc': 'Статья предлагает минимально жизнеспособнуюpipeline для оптимизации навыков с помощью формализации нулевого порядка, устраняя избыточности и сохраняя сходимость и обобщение. Используя принципы исследования траекторий, консенсусного майнинга и валидации, разработан метод SkillOpt-Lite, который ускоряет схождение и показывает лучшие результаты по сравнению с полным вариантом SkillOpt. На примерах улучшения LiveMath объясняется, как этот подход позволяет агентам развивать навыки с помощью простого редактирования кода. Статья также обсуждает возможности интеграции в инструменты разработки, такие как VSCode Copilot.'}, 'en': {'title': 'Streamlining Skill Optimization with SkillOpt-Lite', 'desc': 'This paper introduces a streamlined approach to skill optimization for autonomous agents using Zeroth-Order (ZO) optimization. It emphasizes a minimal viable pipeline that reduces complexity while ensuring effective convergence and generalization through specific principles. The proposed SkillOpt-Lite framework enhances performance by utilizing interpretable skill trajectories and consensus mining, leading to significant improvements in model accuracy. By integrating this framework into coding agents, it allows for easy skill evolution, demonstrating its practical applicability in real-world scenarios.'}}}, {'id': 'https://huggingface.co/papers/2607.02770', 'title': 'Gemma 4 Technical Report', 'url': 'https://huggingface.co/papers/2607.02770', 'abstract': 'Abstract Gemma 4 introduces efficient, multimodal language models with diverse architectures, enhanced reasoning capabilities, and improved performance across various tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce Gemma 4, a new generation of open-weight, natively multimodal language models in the Gemma model family. Designed to advance compute efficiency and reasoning, the Gemma 4 model suite features dense and Mixture-of-Experts architectures, ranging from 2.3B to 31B parameters. Alongside improved vision and audio encoders for all model sizes, we propose a unified, encoder-free architecture for our 12B model, which ingests raw audio and image patches. Furthermore, we integrate a thinking mode, enabling Gemma models to generate reasoning traces prior to responding. We improve inference speed, memory, and compute efficiency, as well as long-context abilities through critical design choices. Gemma 4 establishes a leap in performance across STEM, multimodal, and long-context benchmarks, and rivals larger, frontier open models in human-rated tasks.', 'score': 13, 'issue_id': 2781, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'c19a79d95485325b', 'github_url': '', 'github_stars': 0, 'authors': ['Gemma Team', 'Sherif El Abd', 'Vaibhav Aggarwal', 'Robin Algayres', 'Alek Andreev', 'Olivier Bachem', 'Ian Ballantyne', 'Cormac Brick', 'Victor Cărbune', 'Michelle Casbon', 'Mayank Chaturvedi', 'Victor Cotruta', 'Alice Coucke', 'Phil Culliton', 'Robert Dadashi', 'Lucas Dixon', 'Mohamed Elhawaty', 'Utku Evci', 'Clément Farabet', 'Johan Ferret', 'Filippo Galgani', 'Sertan Girgin', 'Jean-Bastien Grill', 'Maarten Grootendorst', 'Jiaxian Guo', 'Cassidy Hardin', 'Yanzhang He', 'Steven M. Hernandez', 'Omri Homburger', 'Léonard Hussenot', 'Juyeong Ji', 'Armand Joulin', 'Aishwarya Kamath', 'Parnian Kassraie', 'Olivier Lacombe', 'Preethi Lahoti', 'Gaël Liu', 'Gus Martins', 'Luciano Martins', 'Tatiana Matejovicova', 'Ramona Merhej', 'Nikola Momchev', 'Sneha Mondal', 'Ryan Mullins', 'Sindhu Raghuram Panyam', 'Shreya Pathak', 'Sarah Perrin', 'André Susano Pinto', 'Etienne Pot', 'Angéline Pouget', 'Alexandre Ramé', 'Sabela Ramos', 'Douglas Reid', 'David Rim', 'Morgane Rivière', 'Karsten Roth', ang', 'Ming-Hsuan Yang', 'Ziyu Ying', 'Jae Hyeon Yoo', 'Sajjad Zafar', 'Fred Zhang', 'Jiageng Zhang', 'Jianyi Zhang', 'Xiaofan Zhang', 'Chao Zhao', 'David Zhou', 'Chen Zou'], 'affiliations': ['Gemma Team, Google DeepMind'], 'pdf_title_img': 'assets/pdf/title_img/2607.02770.jpg', 'data': {'categories': ['#open_source', '#training', '#inference', '#reasoning', '#long_context', '#multimodal', '#agi', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Gemma 4: Эффективность и многозадачность в одном!', 'desc': 'Статья представляет модель Gemma 4, которая является новейшим поколением мультимодальных языковых моделей с открытыми весами. Она предлагает эффективные архитектуры, способные обрабатывать текст, изображения и аудио. Новая модель улучшает скорость вывода, эффективность памяти и вычислений, а также способности к длительному контексту. Gemma 4 демонстрирует отличные результаты в различных задачах и соперничает с более крупными моделями на основе человеческой оценки.'}, 'en': {'title': 'Revolutionizing Multimodal Language Models with Gemma 4', 'desc': 'Gemma 4 is a new series of multimodal language models that improve efficiency and reasoning capabilities. It features various architectures, including dense and Mixture-of-Experts models, with parameter sizes ranging from 2.3B to 31B. The model introduces a unique encoder-free design for processing raw audio and image data, along with a thinking mode that generates reasoning traces. Overall, Gemma 4 significantly enhances performance on STEM and multimodal tasks while competing with larger models in human-rated evaluations.'}}}, {'id': 'https://huggingface.co/papers/2607.03530', 'title': 'MentalThink: Shaping Thoughts in Mental SVG World', 'url': 'https://huggingface.co/papers/2607.03530', 'abstract': 'Abstract MentalThink enables multimodal large language models to perform visual-symbolic reasoning by generating and interpreting SVG code as an executable intermediate representation for spatial problem-solving.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce MentalThink, a visual-symbolic reasoning paradigm that equips Multimodal LLMs (MLLMs) with an executable mechanism for "mental" visualization. The core of MentalThink is a think-with-SVG pipeline, where the model learns to generate, render, and interpret scalable vector graphics (SVG) code as an intermediate visual representation for multi-turn reasoning. By creating structured vector sketches, the model can externalize spatial hypotheses, inspect them through deterministic rendering, and reason within a constrained geometric space, effectively mimicking the human process of mental imagery. We instantiate this paradigm through a two-stage training framework, combining Supervised Fine-Tuning (SFT) for SVG syntactic alignment with multi-turn Reinforcement Learning (RL) to encourage iterative inspection, revision, and refinement of intermediate visual hypotheses. Extensive evaluations demonstrate that MentalThink achieves superior performance on spatial understanding and reasoning benchmarks (e.g., 55.1% on VSIBench, 76.0% on MindCube), showing that executable vector graphics provide a verifiable visual workspace for dynamic perspective taking, visual reflection, and compositional scene construction.', 'score': 9, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'aeb64df91148ee67', 'github_url': '', 'github_stars': 0, 'authors': ['Kangheng Lin', 'Jisheng Yin', 'Dingming Li', 'En Yu', 'Yana Wei', 'Han Zhou', 'Liang Zhao', 'Hongyu Zhou', 'Hongbo Peng', 'Jianjian Sun', 'Zheng Ge', 'Xiangyu Zhang', 'Daxin Jiang', 'Jingyu Wang'], 'affiliations': ['State Key Laboratory of Networking and Switching Technology, Beijing University of Posts and Telecommunications', 'StepFun', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.03530.jpg', 'data': {'categories': ['#benchmark', '#games', '#training', '#reasoning', '#multimodal', '#rl'], 'emoji': '🖌️', 'ru': {'title': 'Визуально-символическое рассуждение с помощью SVG', 'desc': 'MentalThink - это новая парадигма визуально-символического рассуждения, которая позволяет многомодальным LLM создавать и интерпретировать SVG-код для решения пространственных задач. Модель обучается генерировать и рендерить масштабируемую векторную графику как промежуточное представление для многоповоротного рассуждения. Используя этот подход, модель может внешне представлять пространственные гипотезы и анализировать их в ограниченном геометрическом пространстве. Обширные оценки показывают, что MentalThink значительно улучшает понимание и рассуждение о пространстве.'}, 'en': {'title': 'Empowering MLLMs with Visual-Symbolic Reasoning', 'desc': 'MentalThink is a new approach that helps multimodal large language models (MLLMs) perform visual-symbolic reasoning by using SVG code as a tool for solving spatial problems. It introduces a think-with-SVG pipeline, allowing the model to create and interpret scalable vector graphics as a way to visualize and reason about spatial tasks. This method mimics human mental imagery by enabling the model to generate structured sketches and refine its visual hypotheses through a two-stage training process. Evaluations show that MentalThink significantly improves performance on spatial understanding tasks, demonstrating the effectiveness of using executable vector graphics for reasoning.'}}}, {'id': 'https://huggingface.co/papers/2607.05804', 'title': 'TurnOPD: Making On-Policy Distillation Turn-Aware for Efficient Long-Horizon Agent Training', 'url': 'https://huggingface.co/papers/2607.05804', 'abstract': "Abstract Turn-level budgeting strategy for efficient on-policy distillation in long-horizon agent training addresses inefficiencies in full-horizon rollouts and shallow token concentration.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct On-policy distillation (OPD) trains a student policy by matching a stronger teacher on the student's own trajectories, offering a promising framework for language agent training. However, its application to long-horizon agentic tasks remains insufficiently explored. We identify two key inefficiencies in vanilla agent OPD: (1) full-horizon rollouts often waste wall-clock resources on tail turns that provide weak and noisy KL supervision, and (2) trajectory-level KL objectives concentrate most of the loss on shallow tokens, leaving deeper decision turns under-trained once initial behaviors are aligned. To address these challenges, we propose TurnOPD, a turn-level budgeting strategy for efficient on-policy distillation of long-horizon agents. TurnOPD consists of two budget controllers: adaptive rollout-depth budgeting, which uses probe-based turn statistics to determine rollout length, and progressive turn-normalized loss budgeting, which gradually shifts KL weighting from token-level to turn-balanced supervision. Experiments on ALFWorld, WebShop, and Multi-Hop Search with task-specialized teacher models show that TurnOPD achieves superior validation accuracy under equal wall-clock training budgets and advances the accuracy--time frontier beyond vanilla OPD.", 'score': 7, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'e6831be00fc95099', 'github_url': '', 'github_stars': 0, 'authors': ['Yuhang Zhou', 'Kai Zheng', 'Haoling Li', 'Dengyun Peng', 'Can Xu', 'Jingjing Chen'], 'affiliations': ['Fudan University', 'Tencent Hunyuan'], 'pdf_title_img': 'assets/pdf/title_img/2607.05804.jpg', 'data': {'categories': ['#training', '#optimization', '#agent_memory', '#agents', '#rl'], 'emoji': '🎮', 'ru': {'title': 'Эффективная дистилляция для агентов с длинным горизонтом', 'desc': 'Статья посвящена новой стратегии бюджетирования на уровне ходов для эффективной он-политической дистилляции в обучении агентов с длинными горизонтами. Проблемы, возникающие из-за неэффективного использования ресурсов и концентрации на поверхностных токенах, были проанализированы и описаны. Авторы предлагают метод TurnOPD, который включает адаптивное планирование глубины и прогрессивное нормирование потерь. Эксперименты показывают, что TurnOPD значительно улучшает точность валидации при равных затратах времени на обучение по сравнению с традиционными методами.'}, 'en': {'title': 'Optimizing Long-Horizon Agent Training with Turn-Level Budgeting', 'desc': 'This paper introduces TurnOPD, a new strategy for on-policy distillation that improves the training of long-horizon agents. It addresses inefficiencies in traditional methods by focusing on turn-level budgeting, which optimizes the use of resources during training. The approach includes adaptive rollout-depth budgeting and progressive turn-normalized loss budgeting to enhance the learning process. Experiments demonstrate that TurnOPD outperforms existing methods in terms of validation accuracy while maintaining efficient training times.'}}}, {'id': 'https://huggingface.co/papers/2607.06558', 'title': 'RynnWorld-Teleop: An Action-Conditioned World Model for Digital Teleoperation', 'url': 'https://huggingface.co/papers/2607.06558', 'abstract': "Abstract Digital teleoperation replaces physical robot interaction with generative world models to create diverse training data for robotics, enabling efficient zero-shot Sim2Real transfer and improved real-world performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scaling robot learning requires massive, diverse trajectory data, yet collection is currently bottlenecked by physical teleoperation, where every demonstration binds operator time to specific hardware and workspaces. We introduce digital teleoperation, a paradigm that decouples data collection from physical constraints by replacing the real robot with a generative world model. In this framework, an operator's hand-pose stream drives a robot-centric generative world model to synthesize high-fidelity egocentric videos from a single reference image. The recorded pose stream serves as an embodiment-agnostic action label transferable to any target robot via standard retargeting, yielding complete state-action trajectories for imitation learning independent of physical hardware. We instantiate this paradigm in RynnWorld-Teleop, a system that integrates depth-aware skeletal conditioning, progressive human-to-robot training on a video Diffusion Transformer, and streaming autoregressive distillation. This pipeline compresses the generative process into a single-pass inference, enabling 40+ FPS, real-time interactive generation on a single H100 GPU. Policies trained exclusively on RynnWorld-Teleop-generated data achieve effective zero-shot Sim2Real transfer across dexterous and diverse bimanual tasks. Moreover, augmenting real-world datasets with our digitally teleoperated data consistently improves success rates, demonstrating that RynnWorld-Teleop serves as a high-fidelity, scalable data engine for the next generation of robotic agents.", 'score': 7, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'ffa9cb54a75c69f3', 'github_url': '', 'github_stars': 0, 'authors': ['Haoyu Zhao', 'Xingyue Zhao', 'Hangyu Li', 'Biao Gong', 'Kehan Li', 'Siteng Huang', 'Xin Li', 'Deli Zhao', 'Zhongyu Li'], 'affiliations': ['Alibaba Group', 'Ant Group', 'CUHK', 'DAMO Academy, Alibaba Group', 'Hong Kong Embodied AI Lab', 'Hupan Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.06558.jpg', 'data': {'categories': ['#robotics', '#training', '#dataset', '#optimization', '#transfer_learning', '#synthetic'], 'emoji': '🤖', 'ru': {'title': 'Цифровая телеоперация для умных роботов', 'desc': 'Статья предлагает новый подход к цифровой телеоперации, который заменяет физическое взаимодействие с роботами генеративными мировыми моделями. Это позволяет эффективно собирать данные для обучения роботов без зависимости от аппаратного обеспечения. Разработанная система RynnWorld-Teleop может создавать высококачественные видеозаписи из одиночного изображения, что улучшает обучение через имитацию. Использование данных, полученных с помощью этой системы, значительно повышает успешность выполнения задач в реальном мире.'}, 'en': {'title': 'Revolutionizing Robot Training with Digital Teleoperation', 'desc': 'This paper introduces digital teleoperation, a method that uses generative world models to create diverse training data for robots, allowing for efficient zero-shot Sim2Real transfer. By decoupling data collection from physical robots, it enables operators to generate high-fidelity videos from a single image, which can be used for imitation learning across different robotic platforms. The proposed system, RynnWorld-Teleop, utilizes advanced techniques like depth-aware skeletal conditioning and real-time video generation to produce state-action trajectories without being tied to specific hardware. The results show that policies trained on this digitally generated data can effectively perform various tasks in the real world, enhancing the performance of robotic agents.'}}}, {'id': 'https://huggingface.co/papers/2607.06559', 'title': 'RynnWorld-4D: 4D Embodied World Models for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2607.06559', 'abstract': 'Abstract A multi-modal 4D world model generates synchronized RGB, depth, and optical flow data from single RGB-D images and language instructions, enabling efficient robotic manipulation through unified diffusion processes and inverse dynamics policy learning.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Robotic manipulation in the open world requires not only recognizing what a scene looks like, but also anticipating how its 3D structure moves under interaction. We argue that synchronized RGB, depth, and optical flow, namely RGB-DF, provide a physically grounded representation that captures the underlying 4D dynamics of a scene. Compared to 2D pixel videos, this multi-modal synergy aligns visual appearance with geometric structure and temporal motion, creating a representation space significantly closer to the low-level end-effector actions demanded by robotic systems, thereby narrowing the gap between world prediction and policy learning. Building on this insight, we introduce RynnWorld-4D, a generative model that co-produces future RGB frames, depth maps, and optical flow from a single RGB-D image and a language instruction within one unified diffusion process. This 4D world model features a tri-branch architecture that integrates cross-modal attention with frame-wise 3D RoPE, ensuring that appearance, geometry, and motion evolve consistently. To supply training data at scale, we curate Rynn4DDataset 1.0, a massive dataset of over 254.4 million frames across egocentric human and robotic manipulation videos with high-quality pseudo-labels for depth and optical flow. We further propose RynnWorld-4D-Policy, an inverse dynamics head that consumes the internal 4D representations of RynnWorld-4D in a single forward pass, bypassing expensive multi-step denoising, to output robot actions in a closed-loop manner. Experiments show that RynnWorld-4D produces temporally and spatially coherent 4D predictions, and that RynnWorld-4D-Policy achieves state-of-the-art performance on real-world dexterous bimanual manipulation tasks, particularly excelling in tasks demanding spatial precision and temporal coordination.', 'score': 7, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '4641477303c0630d', 'github_url': '', 'github_stars': 0, 'authors': ['Haoyu Zhao', 'Xingyue Zhao', 'Siteng Huang', 'Xin Li', 'Deli Zhao', 'Zhongyu Li'], 'affiliations': ['CUHK', 'DAMO Academy, Alibaba Group', 'Hong Kong Embodied AI Lab', 'Hupan Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.06559.jpg', 'data': {'categories': ['#games', '#robotics', '#3d', '#diffusion', '#multimodal', '#agents', '#dataset'], 'emoji': '🤖', 'ru': {'title': '4D модель для управления роботами в изменяющемся мире', 'desc': 'В данной статье представлен многофункциональный 4D модель мира, которая генерирует синхронизированные данные RGB, глубины и оптического потока из одиночных RGB-D изображений и языковых инструкций. Модель позволяет эффективно управлять роботами, используя объединенные процессы диффузии и обучение политики обратной динамики. Синхронизация различных модальностей, таких как RGB-DF, создает физически обоснованное представление динамики сцены, которое значительно приближает прогнозирование мира к действиям робота. Новый набор данных Rynn4DDataset и архитектура RynnWorld-4D увеличивают масштаб обучения и обеспечивают высокое качество предсказаний для манипуляционных задач.'}, 'en': {'title': 'Revolutionizing Robotic Manipulation with 4D World Models', 'desc': 'This paper presents a multi-modal 4D world model that generates synchronized RGB, depth, and optical flow data from single RGB-D images and language instructions. The model, called RynnWorld-4D, uses a unified diffusion process to create a representation that captures the dynamics of a scene, improving robotic manipulation. By integrating visual appearance with geometric structure and motion, it narrows the gap between world prediction and policy learning. The proposed RynnWorld-4D-Policy efficiently outputs robot actions using these 4D representations, achieving state-of-the-art performance in complex manipulation tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.05147', 'title': 'DSpark: Confidence-Scheduled Speculative Decoding with Semi-Autoregressive Generation', 'url': 'https://huggingface.co/papers/2607.05147', 'abstract': 'Abstract DSpark enhances LLM inference speed by combining parallel draft generation with adaptive verification that reduces waste and improves throughput in high-concurrency settings.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Speculative decoding accelerates Large Language Model (LLM) inference by decoupling draft generation from target verification. While recent parallel drafters efficiently propose long token sequences in a single forward pass, they suffer from rapid acceptance decay due to a lack of inter-token dependencies. Furthermore, indiscriminately verifying these extended blocks wastes critical batch capacity on tokens with high rejection risks, severely degrading throughput in high-concurrency serving systems. We introduce DSpark, a speculative decoding framework that unifies high-throughput parallel generation with adaptive, load-aware verification. To maintain draft quality, DSpark utilizes a semi-autoregressive architecture, coupling a parallel backbone with a lightweight sequential module, to introduce intra-block dependency modeling and mitigate suffix decay. To optimize system efficiency, DSpark employs confidence-scheduled verification, dynamically tailoring the verification length for each request based on estimated prefix survival probabilities and engine-specific throughput profiles. On offline benchmarks across diverse domains, DSpark substantially improves the accepted length over state-of-the-art autoregressive and parallel drafters. When deployed within the DeepSeek-V4 serving system under live user traffic, DSpark successfully mitigates verification waste. Compared to the established production baseline (MTP-1), DSpark accelerates per-user generation speeds by 60 to 85 percent at matched throughput levels. More importantly, by preventing severe throughput degradation under strict interactivity constraints, it enables performance tiers that were previously unattainable, shifting the Pareto frontier of our serving system.', 'score': 7, 'issue_id': 2781, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '0c2cfd37058e5091', 'github_url': '', 'github_stars': 0, 'authors': ['Xin Cheng', 'Xingkai Yu', 'Chenze Shao', 'Jiashi Li', 'Yunfan Xiong', 'Yi Qian', 'Jiaqi Zhu', 'Shirong Ma', 'Xiaokang Zhang', 'Jiasheng Ye', 'Qinyu Chen', 'Chengqi Deng', 'Jiping Yu', 'Damai Dai', 'Zhengyan Zhang', 'Yixuan Wei', 'Yixuan Tan', 'Wenkai Yang', 'Runxin Xu', 'Yu Wu', 'Zhean Xu', 'Xuanyu Wang', 'Muyang Chen', 'Rui Tian', 'Xiao Bi', 'Zhewen Hao', 'Shaoyuan Chen', 'Huanqi Cao', 'Wentao Zhang', 'Anyi Xu', 'Huishuai Zhang', 'Dongyan Zhao', 'Wenfeng Liang'], 'affiliations': ['DeepSeek-AI', 'Peking University'], 'pdf_title_img': 'assets/pdf/title_img/2607.05147.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization', '#inference'], 'emoji': '⚡', 'ru': {'title': 'Ускорение вывода LLM с DSpark', 'desc': 'В данной статье представлено решение DSpark, которое увеличивает скорость вывода для LLM, сочетая параллельную генерацию черновиков с адаптивной проверкой. Это позволяет снизить потери и улучшить пропускную способность в условиях высокой конкурентности. DSpark использует полуавторегрессионную архитектуру для моделирования зависимостей внутри блоков и предотвращения снижения качества черновиков. В результате, система демонстрирует значительное улучшение по сравнению с существующими методами, ускоряя генерацию на 60-85% при совпадающих уровнях пропускной способности.'}, 'en': {'title': 'Accelerating LLM Inference with DSpark', 'desc': 'DSpark is a framework designed to enhance the inference speed of Large Language Models (LLMs) by integrating parallel draft generation with adaptive verification. It addresses the issue of acceptance decay in generated token sequences by introducing intra-block dependency modeling, which helps maintain draft quality. Additionally, DSpark optimizes verification processes by dynamically adjusting the verification length based on the likelihood of token acceptance, thus improving system efficiency. As a result, DSpark significantly accelerates user generation speeds while maintaining high throughput, enabling better performance in high-concurrency environments.'}}}, {'id': 'https://huggingface.co/papers/2607.05339', 'title': 'TREK: Distill to Explore, Reinforce to Refine', 'url': 'https://huggingface.co/papers/2607.05339', 'abstract': "Abstract TREK expands exploration support for policy optimization by using distillation for exploration rather than imitation, improving performance on challenging mathematical reasoning and agentic tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Group Relative Policy Optimization (GRPO) is effective when the current policy already samples useful reasoning trajectories, but it stalls on hard prompts whose correct solution modes lie outside the student's on-policy support. We propose TREK (Teacher-Routed Exploration via Forward KL), a simple staged procedure that uses distillation not for imitation but for exploration support expansion. A key advantage of TREK is its generality: because it only consumes verified output trajectories, it can use an external black-box teacher, a white-box teacher, or the same model given additional inference-time context, and it can efficiently identify which hard-prompt samples are most worth consolidating even when teacher internals are unavailable. TREK first identifies prompts where the unaided student has very low pass rate, queries a proposal source to produce verified candidate solutions, keeps the top-r proposals ranked by current student likelihood, applies a short forward-KL phase to pull those verified modes into the student's support, and then returns to standard on-policy GRPO refinement. On mathematical reasoning, TREK with DeepSeek-V4 proposals improves Qwen3 models across all tested scales on AIME 2024 and AIME 2025; for Qwen3-8B, it improves AIME 2025 from 36.9 to 40.3 and AIME 2024 from 47.9 to 51.1 (avg@16), while the self-context variant reaches 38.5 and 49.6 without an external teacher. On agentic tasks, TREK raises ALFWorld success rate from 75.8 to 82.8 and ScienceWorld success rate from 12.5 to 26.7; notably, on the hardest task types, TREK achieves high success rates early in training while unaided GRPO requires substantially more optimization steps to reach comparable levels.", 'score': 6, 'issue_id': 2781, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '7a487126ed77fe5b', 'github_url': '', 'github_stars': 0, 'authors': ['Yuanda Xu', 'Zhengze Zhou', 'Kayhan Behdin', 'Jelena Markovic-Voronov', 'Hejian Sang', 'Xiaomin Li', 'Wenhui Zhu', 'Xinchen Du', 'Aida Rahmattalabi', 'Ran He', 'Sen Na', 'Zhipeng Wang', 'Alborz Geramifard'], 'affiliations': ['Georgia Institute of Technology', 'Harvard University', 'LinkedIn Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2607.05339.jpg', 'data': {'categories': ['#training', '#reasoning', '#agents', '#optimization', '#math', '#rl'], 'emoji': '🧠', 'ru': {'title': 'TREK: Новый путь к эффективной оптимизации политики', 'desc': 'Статья предлагает новый метод под названием TREK, который использует дистилляцию для расширения поддержки исследования в задачах оптимизации политики. Этот метод помогает улучшить результаты на сложных задачах математического вывода и агентных задачах. TREK работает, идентифицируя трудные промпты с низким уровнем успешности и генерируя проверенные решения. Показано, что TREK значительно повышает эффективность моделей Qwen3 и достигает лучших результатов по сравнению со стандартными методами.'}, 'en': {'title': 'Enhancing Exploration in Policy Optimization with TREK', 'desc': 'The paper introduces TREK, a method that enhances policy optimization by using distillation for exploration instead of imitation. This approach helps improve performance on complex mathematical reasoning and agentic tasks by expanding the exploration support. TREK identifies challenging prompts where the current policy struggles and generates verified solutions to guide the learning process. By integrating these solutions into the policy refinement, TREK significantly boosts success rates in various tasks while maintaining efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.05722', 'title': 'Nemotron-Labs-Diffusion: A Tri-Mode Language Model Unifying Autoregressive, Diffusion, and Self-Speculation Decoding', 'url': 'https://huggingface.co/papers/2607.05722', 'abstract': "Abstract Nemotron-Labs-Diffusion is a tri-mode language model that combines autoregressive, diffusion, and self-speculation decoding to achieve superior throughput and efficiency compared to existing models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce Nemotron-Labs-Diffusion, a tri-mode language model (LM) that unifies AR, diffusion, and self-speculation decoding within a single architecture. Trained with a joint AR-diffusion objective, Nemotron-Labs-Diffusion can switch modes to sustain high throughput across deployment settings and concurrency levels. Our study shows that (1) AR and diffusion objectives are complementary: diffusion improves lookahead planning, while AR provides left-to-right linguistic priors. (2) In self-speculation mode, diffusion drafts while AR verifies, outperforming multi-token prediction (MTP) methods in both acceptance rate and real-device efficiency. (3) A speed-of-light analysis further demonstrates diffusion's long-term potential, with up to 76.5% more tokens per forward pass than self-speculation under an optimal sampler. Scaling to 3B, 8B, and 14B parameters, our Nemotron-Labs-Diffusion family, including base, instruct, and vision-language models, consistently outperforms state-of-the-art open-source AR and diffusion LMs in both accuracy and speed. For example, Nemotron-Labs-Diffusion-8B decodes 6x more tokens per forward than Qwen3-8B with comparable accuracy, translating to 4x higher throughput on SPEED-Bench with SGLang on a GB200 GPU.", 'score': 4, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'cfd2e3872e4930c1', 'github_url': '', 'github_stars': 0, 'authors': ['Yonggan Fu', 'Lexington Whalen', 'Abhinav Garg', 'Chengyue Wu', 'Maksim Khadkevich', 'Nicolai Oswald', 'Enze Xie', 'Daniel Egert', 'Sharath Turuvekere Sreenivas', 'Shizhe Diao', 'Chenhan Yu', 'Ye Yu', 'Weijia Chen', 'Sajad Norouzi', 'Jingyu Liu', 'Shiyi Lan', 'Ligeng Zhu', 'Jin Wang', 'Jindong Jiang', 'Morteza Mardani', 'Mehran Maghoumi', 'Song Han', 'Ante Jukić', 'Nima Tajbakhsh', 'Jan Kautz', 'Pavlo Molchanov'], 'affiliations': ['Georgia Tech', 'HKU', 'MIT', 'NVIDIA', 'University of Chicago'], 'pdf_title_img': 'assets/pdf/title_img/2607.05722.jpg', 'data': {'categories': ['#open_source', '#training', '#diffusion', '#optimization', '#architecture'], 'emoji': '🚀', 'ru': {'title': 'Новая эра языковых моделей с Nemotron-Labs-Diffusion', 'desc': 'В статье представлен языковая модель Nemotron-Labs-Diffusion, которая объединяет три режима: автогрессивный (AR), диффузионный и самоспекулятивный декодирование. Модель обучена с использованием совместной цели AR-диффузии, что позволяет ей переключаться между режимами для достижения высокой пропускной способности. Исследование показывает, что диффузия улучшает планирование и предлагает дополнение к линейному языковому прогнозированию. Сравнение с другими передовыми моделями показывает, что Nemotron-Labs-Diffusion значительно превосходит по скорости и точности.'}, 'en': {'title': 'Revolutionizing Language Models with Tri-Mode Decoding', 'desc': 'Nemotron-Labs-Diffusion is a novel tri-mode language model that integrates autoregressive (AR), diffusion, and self-speculation decoding techniques to enhance performance and efficiency. By training with a joint AR-diffusion objective, it can seamlessly switch between modes, optimizing throughput for various deployment scenarios. The model demonstrates that diffusion enhances planning capabilities while AR maintains linguistic structure, and in self-speculation mode, it effectively combines both methods for improved prediction accuracy. With scalable parameters, Nemotron-Labs-Diffusion consistently surpasses existing state-of-the-art models in both speed and accuracy, achieving significant improvements in token generation rates.'}}}, {'id': 'https://huggingface.co/papers/2607.02515', 'title': 'PointDiT: Pixel-Space Diffusion for Monocular Geometry Estimation', 'url': 'https://huggingface.co/papers/2607.02515', 'abstract': 'Abstract A minimalist pixel-space diffusion transformer using plain ViT architecture directly processes 3D point map patches conditioned on image tokens from DINOv3, outperforming complex latent-based models while maintaining simplicity and robustness in ambiguous regions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct State-of-the-art single-image 3D reconstruction methods often rely on complex hybrid architectures and loss functions, or compress geometry into latent spaces in order to leverage pre-trained latent diffusion models. In this work, we show that such architectural overhead and intricate loss formulations are unnecessary. We introduce a minimalist pixel-space Diffusion Transformer, built on a plain ViT, that operates directly on raw 3D point map patches and is conditioned on image tokens from a pre-trained DINOv3. Unlike existing latent diffusion approaches, we train our diffusion backbone entirely from scratch, eliminating the need for point map tokenizers. Despite its simplicity, our approach surpasses complex latent-based diffusion models while remaining significantly simpler than hybrid alternatives. Notably, it produces sharper geometric structure and is more robust in highly ambiguous regions, such as transparent objects.', 'score': 3, 'issue_id': 2781, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '85610fb534e85a66', 'github_url': '', 'github_stars': 0, 'authors': ['Haofei Xu', 'Rundi Wu', 'Philipp Henzler', 'Nikolai Kalischek', 'Michael Oechsle', 'Fabian Manhardt', 'Marc Pollefeys', 'Andreas Geiger', 'Federico Tombari', 'Michael Niemeyer'], 'affiliations': ['ETH Zurich', 'Google', 'KE:SAI', 'Microsoft', 'Technical University of Munich', 'University of Tubingen, Tubingen AI Center'], 'pdf_title_img': 'assets/pdf/title_img/2607.02515.jpg', 'data': {'categories': ['#architecture', '#3d', '#diffusion'], 'emoji': '📏', 'ru': {'title': 'Минимализм в 3D-реконструкции: эффективность без сложности', 'desc': 'В данной статье представлен новый подход к 3D-реконструкции изображений, основанный на упрощённой архитектуре ViT. Авторы демонстрируют, что сложные гибридные модели и сложные функции потерь не являются необходимыми. Вместо этого они предлагают использовать минималистичный Объёмный Трансформер, который работает напрямую с 3D точечными картами и использует изображения из DINOv3. Этот метод обеспечивает более чёткую геометрию и остаётся устойчивым в сложных ситуациях, таких как прозрачные объекты.'}, 'en': {'title': 'Simplicity Meets Performance in 3D Reconstruction', 'desc': 'This paper presents a minimalist pixel-space diffusion transformer that uses a simple Vision Transformer (ViT) architecture to process 3D point map patches. It is conditioned on image tokens from a pre-trained DINOv3 model, allowing it to outperform more complex latent-based models. The authors argue that intricate architectures and loss functions are unnecessary for effective single-image 3D reconstruction. Their approach not only simplifies the process but also enhances the quality of geometric structures, especially in challenging areas like transparent objects.'}}}, {'id': 'https://huggingface.co/papers/2607.05803', 'title': 'Quantifying and Expanding the Theoretical Capacity of Late-Interaction Retrieval Models', 'url': 'https://huggingface.co/papers/2607.05803', 'abstract': 'Abstract MaxSim similarity can exactly replicate inner products between sparse vectors and supports logical operations, with Signed MaxSim extending this capability to real-valued vectors while improving retrieval performance on complex query types.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Late-interaction retrieval models that use the MaxSim similarity function have shown strong empirical performance, often outperforming single-vector dense and sparse retrieval models. Despite these empirical findings, little is known about the theoretical representation power of MaxSim and how it compares to other retrieval approaches. This paper shows by construction that MaxSim similarity can exactly replicate the inner product between any two non-negative k-sparse vectors with possibly infinite dimension, requiring only O(k) representation space. Moreover, there exist similarities that MaxSim can express while standard vector inner products with the same representation space cannot. Leveraging our theoretical framework, we introduce Signed MaxSim which allows late-interaction models to exactly replicate any real-valued inner product, something we prove standard MaxSim is not capable of. We also show that MaxSim can act as an aggregation of soft-OR operations and as an evaluator of logical expressions in positive Conjunctive Normal Form. Our findings show that MaxSim is at least as capable as standard vector inner products for any non-negative vectors and our extension, Signed MaxSim, is as capable for any vectors. Both similarities possess additional capabilities that inner product cannot replicate, marking one of the first theoretical justifications and quantifications of late-interaction methods. Our theoretical findings are supported empirically: on a retrieval task featuring queries with negations, Signed MaxSim improves out-of-domain performance significantly over a standard ColBERT/MaxSim baseline with nDCG@10 increasing from 0.597 to 1.000 under a vocabulary shift and from 0.008 to 0.788 on negation-only queries.', 'score': 2, 'issue_id': 2781, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '657156556108130f', 'github_url': '', 'github_stars': 0, 'authors': ['Julian Killingback', 'Varad Ingale', 'Hamed Zamani', 'Cameron Musco'], 'affiliations': ['Center for Intelligent Information Retrieval University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2607.05803.jpg', 'data': {'categories': ['#benchmark', '#retrieval', '#math', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'MaxSim: новое слово в сходстве и поиске информации', 'desc': 'В этой статье представлено новое измерение функции сходства MaxSim, которая точно воспроизводит.inner products между разреженными векторами и поддерживает логические операции. Расширенная версия, Signed MaxSim, улучшает производительность на сложных запросах и позволяет точно воспроизводить любые вещественные внутренние произведения. Исследование показывает, что MaxSim обладает способностями, недоступными стандартным внутренним произведениям, и может выступать в роли агрегатора логических операций. Эмпирические результаты подтверждают преимущества нового подхода, увеличивая эффективность поиска с отрицательными запросами.'}, 'en': {'title': 'MaxSim: A New Frontier in Vector Similarity and Retrieval', 'desc': 'This paper introduces MaxSim similarity, which can replicate inner products between sparse vectors and supports logical operations. The authors extend this concept with Signed MaxSim, enhancing retrieval performance for complex queries involving real-valued vectors. They demonstrate that MaxSim can represent certain similarities that standard inner products cannot, while also proving its theoretical capabilities. Empirical results show that Signed MaxSim significantly outperforms traditional models in retrieval tasks, especially with queries that include negations.'}}}, {'id': 'https://huggingface.co/papers/2607.03509', 'title': 'Flex-Forcing: Towards a Unified Autoregressive and Bidirectional Video Diffusion Model', 'url': 'https://huggingface.co/papers/2607.03509', 'abstract': 'Abstract Flex-Forcing enables video diffusion models to operate under both bidirectional and autoregressive generation regimes through a flexible chunking mechanism over temporal and denoising steps, improving video quality and inference speed.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recent progress in large-scale generative models has substantially advanced video generation, yet existing methods remain constrained by a rigid inference paradigm. Bidirectional diffusion models excel at global coherence and visual fidelity but suffer from slow inference, while autoregressive models offer efficient and streaming generation at the cost of long-range consistency and exposure bias. We introduce Flex-Forcing, a unified training and inference framework that enables a video diffusion model to seamlessly operate under both bidirectional and autoregressive generation regimes. The core idea is a flexible chunking mechanism jointly defined over the temporal axis and denoising steps. This design allows the model to (1) perform flexible chunking according to different device budgets, (2) perform bidirectional inference across chunks for global structure planning, while generating frames autoregressively within each chunk for efficient and fine-grained synthesis, and (3) perform any-order, any-timestep autoregressive generation without the strict causal constraint. Extensive experiments on multiple video generation benchmarks demonstrate that Flex-Forcing achieves consistently better video quality, long-video stability than strong baselines with a rigid inference schedule, while offering faster inference.', 'score': 2, 'issue_id': 2781, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '32b39cc727398700', 'github_url': '', 'github_stars': 0, 'authors': ['Xinyin Ma', 'Julius Berner', 'Chao Liu', 'Arash Vahdat', 'Weili Nie', 'Xinchao Wang'], 'affiliations': ['NVIDIA Research, California, USA', 'National University of Singapore, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.03509.jpg', 'data': {'categories': ['#benchmark', '#training', '#diffusion', '#optimization', '#architecture'], 'emoji': '🎥', 'ru': {'title': 'Гибкое поколение видео с Flex-Forcing', 'desc': 'Статья представляет механизм Flex-Forcing, который позволяет моделям видео диффузии работать в обоих режимах генерации: двунаправленном и авторегрессионном. Этот механизм использует гибкую сегментацию, что улучшает качество видео и скорость вывода. Благодаря этому подходу модели могут эффективно планировать глобальную структуру и генерировать кадры с высоким качеством. Исследования показывают, что Flex-Forcing обеспечивает стабильность и лучшую производительность по сравнению с традиционными методами.'}, 'en': {'title': 'Flex-Forcing: Bridging Bidirectional and Autoregressive Video Generation', 'desc': 'The paper introduces Flex-Forcing, a novel framework that enhances video diffusion models by allowing them to function in both bidirectional and autoregressive modes. This is achieved through a flexible chunking mechanism that optimizes temporal and denoising steps, leading to improved video quality and faster inference. By enabling flexible chunking, the model can adapt to different device capabilities and maintain global coherence while generating frames efficiently. Extensive experiments show that Flex-Forcing outperforms traditional methods, providing better video quality and stability in long videos.'}}}, {'id': 'https://huggingface.co/papers/2607.00394', 'title': 'When Classic Cache Policies Fail: Learning-Augmented Replacement for Semantic Retrieval Buffers', 'url': 'https://huggingface.co/papers/2607.00394', 'abstract': 'Abstract Research addresses cache management for LLM agents by formalizing semantic cache replacement as an online problem with switching costs, proposing SOLAR—a learning-augmented framework that outperforms traditional heuristics through regret-based modification timing and Bayesian content selection.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct LLM agents increasingly rely on retrieval buffers to store and reuse past experience, yet the cache management policies governing these buffers remain largely ad-hoc. We formalize this as an online semantic cache replacement problem with switching costs, where items are matched by embedding similarity and hit quality is continuous rather than binary. Through experiments on two datasets from MemoryBench-Full (LoCoMo, DialSim) with 8 replacement policies, we reveal a surprising finding: classic heuristics (LRU, LFU) consistently underperform the naive FIFO baseline on semantic workloads, due to the absence of temporal locality and frequency concentration. We propose SOLAR, a learning-augmented framework that derives modification timing from regret accumulation (achieving sim17\\% modification rate) and content selection from Bayesian online learning over implicit retrieval feedback. We prove SOLAR achieves a constant competitive ratio leq 3, independent of cache size and horizon (vs.\\ Ω(K) for FIFO), and eviction regret O(KTlog T), matching the Ω(KT) lower bound up to logarithmic factors. Experiments demonstrate 5--75\\% relative improvement over FIFO at tight cache sizes, with a clearly characterized phase transition at the working set boundary. Synthetic experiments with 5000-item pools further reveal an inverted-U relationship between pool size and retrieval quality, justifying capacity constraints as a retrieval noise phenomenon rather than a storage limitation.', 'score': 2, 'issue_id': 2781, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '98156a4fe245af87', 'github_url': '', 'github_stars': 0, 'authors': ['Yushi Sun', 'Bowen Cao', 'Wai Lam'], 'affiliations': ['LIGHTSPEED, Tencent Shenzhen, China', 'The Chinese University of Hong Kong Hong Kong, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.00394.jpg', 'data': {'categories': ['#inference', '#agent_memory', '#agents', '#retrieval', '#memory'], 'emoji': '📚', 'ru': {'title': 'Умное управление кэшем для агентов LLM', 'desc': 'В данной статье рассматривается управление кэшом для агентов LLM, формализуя замену семантического кэша как задачу онлайн с затратами на переключение. Предложена SOLAR — фреймворк с использованием обучения, который превосходит традиционные эвристики благодаря модификации времени на основе сожаления и выбору контента на основе байесовского подхода. Эксперименты показывают, что классические эвристики (такие как LRU и LFU) значительно уступают даже простому FIFO на семантических нагрузках. SOLAR демонстрирует улучшение производительности от 5 до 75% по сравнению с FIFO при ограниченных размерах кэша.'}, 'en': {'title': 'Revolutionizing Cache Management for LLMs with SOLAR', 'desc': 'This paper focuses on improving cache management for large language model (LLM) agents by addressing the online semantic cache replacement problem. It introduces SOLAR, a framework that enhances traditional cache policies by using regret-based timing for modifications and Bayesian methods for content selection. The research shows that classic heuristics like LRU and LFU perform poorly compared to a simple FIFO approach in semantic contexts. Experiments demonstrate that SOLAR significantly outperforms FIFO, achieving better retrieval quality and efficiency in managing cache resources.'}}}, {'id': 'https://huggingface.co/papers/2606.31329', 'title': '3D HAMSTER: Bridging Planning and Control in Hierarchical Vision Language Action Models through 3D Trajectory Guidance', 'url': 'https://huggingface.co/papers/2606.31329', 'abstract': 'Abstract 3D HAMSTER framework enhances robot manipulation by integrating a vision-language model with depth encoding to generate metrically accurate 3D trajectories for point cloud-based control policies.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Hierarchical Vision-Language-Action (VLA) models decouple high-level planning from low-level control to improve generalization in robot manipulation. Recent work in this paradigm uses 2D end-effector trajectories predicted by a Vision-Language Model (VLM) as explicit guidance for a downstream policy. However, state-of-the-art low-level policies operate in 3D metric space on point clouds, and feeding them 2D guidance that lacks depth forces each waypoint to be assigned the depth of whatever scene surface lies beneath it, producing geometrically distorted trajectories. We propose 3D HAMSTER, a hierarchical framework that closes this gap by having the planner directly output metrically reliable 3D trajectories. We augment a VLM with a dedicated depth encoder and a dense depth reconstruction objective to predict 3D waypoint sequences, which are directly integrated into a pointcloudbased low-level policy. Across 3D trajectory prediction, simulation, and real-world manipulation, 3D HAMSTER consistently outperforms proprietary VLMs and 2D-guided baselines, with the largest gains under appearance-altering shifts and unseen language, spatial, and visual conditions. The project page is available at https://davian-robotics.github.io/3D_HAMSTER/.', 'score': 2, 'issue_id': 2781, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '91dafffbe20387b0', 'github_url': '', 'github_stars': 0, 'authors': ['Dongyoon Hwang', 'Byungkun Lee', 'Dongjin Kim', 'Hyojin Jang', 'Hoiyeong Jin', 'Jueun Mun', 'Minho Park', 'Hojoon Lee', 'Hyunseung Kim', 'Jaegul Choo'], 'affiliations': ['Graduate School of Artificial Intelligence, POSTECH, Pohang, Republic of Korea', 'Holiday Robotics, Seoul, Republic of Korea', 'KRAFTON AI, Seoul, Republic of Korea', 'Kim Jaechul Graduate School of AI, KAIST, Seoul, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2606.31329.jpg', 'data': {'categories': ['#games', '#robotics', '#3d', '#optimization', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Роботы, видящие в 3D!', 'desc': '3D HAMSTER - это система, которая улучшает манипуляции роботов, сочетая модели зрения и языка с кодировкой глубины для генерации точных 3D-траекторий. Эта методика позволяет отделить высокоуровневое планирование от низкоуровневого управления, что увеличивает обобщающую способность в манипуляциях. Основная проблема заключается в том, что 2D-траектории могут создавать искажения, если их глубина не учитывается. 3D HAMSTER решает эту проблему, выводя надежные 3D-траектории для управления роботами на основе облаков точек.'}, 'en': {'title': 'Revolutionizing Robot Manipulation with 3D Trajectories', 'desc': "The 3D HAMSTER framework improves robot manipulation by combining a vision-language model with depth encoding to create accurate 3D trajectories for controlling robots using point clouds. It separates high-level planning from low-level control, enhancing the robot's ability to generalize across different tasks. Unlike previous methods that used 2D trajectories, 3D HAMSTER directly generates 3D waypoints, avoiding the geometric distortions caused by depth assumptions in 2D guidance. This approach has shown superior performance in various scenarios, including challenging visual and spatial conditions."}}}, {'id': 'https://huggingface.co/papers/2606.30026', 'title': 'MuseBench: Benchmarking Intent-Level Audiovisual Arts Understanding in MLLMs', 'url': 'https://huggingface.co/papers/2606.30026', 'abstract': "Abstract A comprehensive benchmark called Musebench is introduced to evaluate multimodal large language models on nuanced artistic understanding, revealing a significant gap between current models and human expert performance in creative domain expertise.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Audiovisual arts encompass diverse creative disciplines, including cinema, visual arts, stage performance, and game design, where artistic meaning arises from deliberate combinations of visual, auditory, and narrative elements (e.g., fear amplified through claustrophobic framing, or grief conveyed through silence and lingering close-ups). True artistic understanding extends beyond recognizing what is depicted to reasoning about why it is expressed through particular creative choices. Despite the strong progress of multimodal large language models (MLLMs), this critical aspect of artistic understanding remains underexplored, as existing benchmarks largely measure perceptual recognition while overlooking reasoning about creative intent. To address this gap, we introduce Musebench, a comprehensive benchmark designed to evaluate MLLMs on nuanced artistic understanding. It comprises 4,016 questions spanning cinematic arts, static visual arts, stage performing arts, and game arts, distilled from over 10K candidate video essays that pair professional commentary with visual demonstration. To capture the open-ended nature of artistic analysis at scale, the benchmark combines single-select and variable-option multi-select questions. All questions are generated and refined through a four-phase iterative pipeline combining shortcut filtering, adversarial distractors, and expert validation. Comprehensive zero-shot evaluation of 28 state-of-the-art MLLMs reveals that even the best-performing model achieves only 48.29% accuracy, substantially below human expert performance of 87.18%, exposing a significant gap in current models' creative domain expertise.", 'score': 2, 'issue_id': 2781, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '41e563783fac0e27', 'github_url': '', 'github_stars': 0, 'authors': ['Yuxuan Fan', 'Gyusik Seo', 'Jing Hao', 'Jaemin Cho', 'Mohit Bansal', 'Jaehong Yoon'], 'affiliations': ['AI2', 'Johns Hopkins University', 'NTU Singapore', 'The University of Hong Kong', 'UNC-Chapel Hill'], 'pdf_title_img': 'assets/pdf/title_img/2606.30026.jpg', 'data': {'categories': ['#benchmark', '#games', '#reasoning', '#multimodal', '#survey'], 'emoji': '🎨', 'ru': {'title': 'Проверка художественного понимания с Musebench', 'desc': 'В статье представлен новый бенчмарк под названием Musebench, который предназначен для оценки многомодальных крупных языковых моделей (MLLM) в области художественного понимания. Этот бенчмарк позв
