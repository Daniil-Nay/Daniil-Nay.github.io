ышления. Эксперименты показывают, что обновленная модель Qwen-Image-SciIR значительно улучшила способности к научному мышлению в генерации изображений.'}, 'en': {'title': 'Enhancing Scientific Image Generation through Reasoning and Data', 'desc': 'This paper addresses the challenges in generating scientific images that require semantic alignment and logical reasoning. It introduces the SciIR-82k dataset, which contains over 80,000 high-quality image-text pairs, organized to support scientific reasoning. The authors propose a new evaluation framework, SciIR-Bench, that assesses models based on three semiotic dimensions: Entity Structure, Scientific Process, and Scientific Law. By fine-tuning the Qwen-Image-SciIR model on this dataset, they demonstrate improved performance in scientific reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2606.29464', 'title': 'Rank-Aware Hyperbolic Alignment for Vision-Language Dataset Distillation', 'url': 'https://huggingface.co/papers/2606.29464', 'abstract': 'Abstract Vision-language dataset distillation method using rank-aware hyperbolic alignment to optimize synthetic image-text pairs for efficient contrastive model training while preserving modality-specific diversity.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-language dataset distillation (VLDD) compresses a large image-text paired dataset into a small set of synthetic pairs that can efficiently train contrastive vision-language models under strict data and compute budgets. Most existing methods match expert trajectories or cross-modal statistics, yet still enforce full-dimensional alignment in a Euclidean embedding space. This is often overly restrictive due to rank-deficient image--text correlation, with shared semantics concentrated in a low-dimensional range and remaining variation spread across a weakly correlated residual subspace. LoRS relaxes alignment at the similarity level by low-rank factorization, but does not explicitly control dominant alignment capacity and structure in the representation space. We thus propose a rank-aware hyperbolic alignment (RAHA) that combines hierarchical geometry with explicit alignment-capacity control. RAHA lifts multimodal representations to hyperbolic space and optimizes distilled pairs with asymmetric objectives that enforce geodesic alignment in the shared range while regularizing the residual subspace to preserve modality-private diversity and improve transfer robustness. Experiments on benchmarks show that RAHA demonstrates competitive cross-modal retrieval and improved transfer indicators under fixed budgets.', 'score': 3, 'issue_id': 2753, 'pub_date': '2026-06-28', 'pub_date_card': {'ru': '28 июня', 'en': 'June 28', 'zh': '6月28日'}, 'hash': '96a8b86424d427f6', 'github_url': '', 'github_stars': 0, 'authors': ['Jongoh Jeong', 'Sun-Kyung Lee', 'Kuk-Jin Yoon'], 'affiliations': ['Electronics and Telecommunications Research Institute (ETRI), Republic of Korea', 'Korea Advanced Institute of Science and Technology (KAIST), Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2606.29464.jpg', 'data': {'categories': ['#benchmark', '#synthetic', '#data', '#transfer_learning', '#optimization', '#games', '#multimodal', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Оптимизация синтетических пар для улучшения обучения моделей', 'desc': 'В статье предложен метод дистилляции наборов данных для взаимодействия между изображениями и текстом, который использует ранговую гиперболическую выравнивание. Этот метод позволяет оптимизировать синтетические пары изображений и текста для эффективного обучения контрастивных моделей. Он сосредоточен на сохранении разнообразия данных, что важно для корректной обработки разных модальностей. Эксперименты показывают, что новый метод превосходит существующие подходы в задачах кросс-модального поиска и повышает устойчивость к переносу.'}, 'en': {'title': 'Efficient Dataset Distillation with Rank-Aware Hyperbolic Alignment', 'desc': "This paper presents a new method for creating smaller, efficient datasets from large image-text pairs, aimed at training contrastive vision-language models. The proposed rank-aware hyperbolic alignment (RAHA) improves upon existing methods by allowing for more flexible alignment in a hyperbolic space, which better captures the complex relationships between images and text. By focusing on low-rank structures, RAHA preserves the unique characteristics of each modality while enhancing the model's ability to transfer knowledge. Experiments show that RAHA achieves strong performance in cross-modal retrieval tasks while adhering to strict data and computational limits."}}}, {'id': 'https://huggingface.co/papers/2606.26040', 'title': 'AI translation of literary texts is "fine", but readers still prefer human translations', 'url': 'https://huggingface.co/papers/2606.26040', 'abstract': 'Abstract Human readers prefer human-translated literary works over machine translations, finding the latter less immersive and harder to distinguish from human translations, despite machine translation metrics favoring the automated versions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct AI translation of literary works is increasingly common. While the content may be rendered adequately, we do not know enough about how readers experience it in terms of immersiveness and literary effect, aspects poorly captured by automatic machine translation metrics or human evaluation targeting fluency and adequacy. We ask 15 avid readers to compare recently published human translations (HT) to machine translations (MT) generated with an agentic large language model (LLM)-based pipeline, for 15 recent novels in French, Polish, and Japanese and translated into English. Readers evaluated approximately 8K-word excerpts in two conditions: immersive reading of the whole excerpt (30 comparisons) and close reading of 386 aligned HT-MT chunk pairs (772 comparisons), with two readers per book and in alternating order of presentation. Overall, readers find MT "fine", but prefer HT (slightly at excerpt-level 19/30, more clearly at chunk-level 522/772) for its ease, clarity, and immersive nature. Readers\' highlights show that MT\'s quality varies more within one book than HT\'s does. Crucially, readers cannot reliably tell the two apart (17/30 guess correctly) and tend to prefer the version they believe to be human. Automatic metrics, including LLM-as-a-judge approaches, fail to recover reader preferences and favor MT. We release LAIT (Literary AI Translation), a reader-centered evaluation dataset with 1K reader comments, 2K judgments and preference ratings, and 7.2K span-level annotations, along with our evaluation protocol and supporting interface.', 'score': 3, 'issue_id': 2750, 'pub_date': '2026-06-24', 'pub_date_card': {'ru': '24 июня', 'en': 'June 24', 'zh': '6月24日'}, 'hash': 'cebc278ffaf4a428', 'github_url': '', 'github_stars': 0, 'authors': ['Yves Ferstler', 'Adam Podoxin', 'Ty Brassington', 'Roman Grundkiewicz', 'Maite Taboada', 'Marzena Karpinska'], 'affiliations': ['Université du Québec à Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2606.26040.jpg', 'data': {'categories': ['#machine_translation', '#dataset', '#ethics', '#multilingual'], 'emoji': '📚', 'ru': {'title': 'Читатели выбирают человеческие переводы!', 'desc': 'В данной статье исследуется предпочтение читателей при выборе литературных переводов. Читатели предпочитают переводы, выполненные людьми, а не машинным переводом, несмотря на то, что автоматические метрики могут показывать преимущества машинного перевода. Авторы провели сравнение человеческих и машинных переводов с использованием LLM на 15 новеллах на французском, польском и японском языках, что показало, что качество перевода варьируется, и читатели предпочитают переводы людей за их естественность и погружающий эффект. Также было замечено, что автоматические метрики не отражают истинные предпочтения читателей.'}, 'en': {'title': 'Human Touch Triumphs: Readers Prefer Human Translations Over Machine', 'desc': "This paper investigates how readers perceive human translations (HT) versus machine translations (MT) of literary works. Despite MT being rated favorably by automatic metrics, human readers prefer HT for its clarity and immersive quality. The study involved 15 avid readers comparing excerpts from novels translated by both methods, revealing that while MT is considered 'fine', HT is favored for deeper engagement. The authors introduce the LAIT dataset to better capture reader preferences, highlighting the limitations of current automatic evaluation methods."}}}, {'id': 'https://huggingface.co/papers/2607.00529', 'title': 'NoPA: Non-Parametric Online 3D Scene Graph Generation', 'url': 'https://huggingface.co/papers/2607.00529', 'abstract': 'Abstract NoPA introduces a non-parametric distribution-based approach for real-time 3D scene graph generation that preserves geometric details while maintaining computational efficiency through kernel density estimates and particle-based object representation.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Classic 3D scene graph generation approaches fail to work in real-time due to the heavy computational cost of environment mapping and the need to generate intermediate point-cloud representations. To alleviate this issue, a recent work eschews point clouds in favor of a lightweight Gaussian distribution for each object. This approximation drastically speeds up inference and enables real-time 3D scene graph generation. However, the representation has two key weaknesses. 1) Each object is approximated by a single 3D Gaussian, which causes a severe loss of 3D geometric detail. 2) The discrepancy between this approximation and the true object geometry exacerbates the inaccurate merging of object candidates during online inference. To address these issues, we propose NoPA, which represents each object as a separate non-parametric distribution. This formulation retains 3D geometric information while preserving real-time inference of the parametric Gaussian formulation. To build upon our novel object representation, we propose a tailored merging strategy to recover coherent object instances. Specifically, we leverage maximum mean discrepancy on kernel density estimates to enable robust merging of object candidates during online exploration while minimizing added computational complexity. The key is to maintain a fixed particle set per object. Furthermore, to rectify the relation loss caused by misclassified objects, NoPA propagates relationships between objects with high affinity. Experiments show that NoPA substantially outperforms current methods without sacrificing real-time inference speed.', 'score': 2, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'bf96bca705f70695', 'github_url': '', 'github_stars': 0, 'authors': ['Qi Xun Yeo', 'Seungjun Lee', 'Yan Li', 'Gim Hee Lee'], 'affiliations': ['Department of Computer Science, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.00529.jpg', 'data': {'categories': ['#inference', '#graphs', '#optimization', '#architecture', '#3d'], 'emoji': '🌐', 'ru': {'title': 'Эффективная генерация 3D сцен в реальном времени', 'desc': 'Статья представляет подход NoPA для генерации 3D графов сцен в реальном времени, который сохраняет геометрические детали при низких вычислительных затратах. Этот метод использует непараметрическое распределение и плотность ядра для представления объектов, что позволяет значительно ускорить процесс вывода. Несмотря на это, у предыдущих подходов были недостатки, связанные с потерей геометрии и неточной слиянием объектов. NoPA решает эти проблемы, сохраняя информацию о форме объектов и обеспечивая правильное объединение кандидатов объектов во время онлайн-исследования.'}, 'en': {'title': 'Real-Time 3D Scene Graphs with Non-Parametric Distributions', 'desc': 'NoPA presents a novel method for generating 3D scene graphs in real-time by using non-parametric distributions to represent objects. This approach maintains important geometric details while improving computational efficiency compared to traditional methods that rely on point clouds. By employing kernel density estimates and a tailored merging strategy, NoPA effectively merges object candidates during online inference. The results demonstrate that NoPA significantly enhances performance without compromising the speed of real-time processing.'}}}, {'id': 'https://huggingface.co/papers/2607.00115', 'title': 'PixelEyes: Decoupling Perception and Reasoning for Pinpoint Visual Evidence Seeking', 'url': 'https://huggingface.co/papers/2607.00115', 'abstract': 'Abstract Multi-turn visual reasoning agents suffer from entangled reasoning and perception that cause redundant trajectories; PixelEyes addresses this by decoupling these processes through mask-guided search and semantic-region breadth-first search, demonstrated on a new benchmark with expert-resynthesized data.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct This paper explores multi-turn visual reasoning and observes that MLLMs repeatedly fail to localize the target, leading to long, redundant trajectories. We attribute this failure to the entanglement of reasoning and perception within a single model, the MLLM reasons and localizes simultaneously, and inaccurate localization triggers additional reasoning turns that bloat the trajectory. To solve this problem, we propose PixelEyes, a multi-turn visual reasoning agent that explicitly decouples reasoning from perception, i.e., the reasoner decides what to look for, while a specialized perception tool answers where it is. Specifically, PixelEyes introduces 1) Mask-guided Visual Search. A referring segmentation model is invoked to provide mask-precise localization, freeing the reasoner from the need to compensate for imprecise grounding. 2) Semantic-region Breadth-first Search (BFS). To eliminate redundant loops caused by repeatedly cropping incorrect sub-regions, we organize exploration as a breadth-first search over semantic regions. To internalize these capabilities, we construct the PixelEyes-6K dataset by resynthesizing expert trajectories from existing data. This explicitly embeds our mask-guided search and BFS logic into the model. We further introduce Pinpoint-Bench, a zero-hint visual search benchmark, i.e., no location cues are provided in the question, with instance-level masks and bounding boxes that separate localization failures from reasoning failures, enabling fine-grained analysis of failure modes such as inattentional blindness. Recent state-of-the-art MLLMs and visual reasoning agents leave large headroom on Pinpoint-Bench, demonstrating its quality and difficulty. Code and models are open-sourced.', 'score': 2, 'issue_id': 2751, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '4813c9ec22a77009', 'github_url': '', 'github_stars': 0, 'authors': ['Dengxian Gong', 'Yuanzheng Wu', 'Haobo Yuan', 'Zhengdong Hu', 'Tao Zhang', 'Yikang Zhou', 'Shihao Chen', 'Quanzhu Niu', 'Kai Wang', 'Jason Li', 'Haochen Wang', 'Lu Qi', 'Shunping Ji', 'Ming-Hsuan Yang'], 'affiliations': ['CASIA', 'NTU', 'NUS', 'UC Merced', 'UTS', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00115.jpg', 'data': {'categories': ['#dataset', '#reasoning', '#games', '#benchmark', '#open_source', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Разделение рассуждения и восприятия для улучшения визуального поиска', 'desc': 'Статья рассматривает проблемы многоповоротного визуального рассуждения, где традиционные подходы комбинируют рассуждение и восприятие, что приводит к избыточным траекториям. Предлагаемый метод PixelEyes разделяет эти процессы, позволяя рассуждению сосредоточиться на том, что искать, а восприятию - на том, где это находится. Метод включает в себя маскированный визуальный поиск и алгоритм поиска по семантическим регионам, что улучшает точность локализации. Созданный набор данных PixelEyes-6K и бенчмарк Pinpoint-Bench позволяют анализировать ошибки визуального поиска и рассуждения.'}, 'en': {'title': 'Decoupling Reasoning and Perception for Efficient Visual Search', 'desc': 'This paper introduces PixelEyes, a multi-turn visual reasoning agent that separates reasoning from perception to improve localization accuracy. Traditional models often entangle these processes, leading to redundant reasoning turns and inefficient trajectories. PixelEyes employs mask-guided visual search for precise localization and a breadth-first search strategy to avoid repetitive exploration of incorrect areas. The authors also present a new benchmark, Pinpoint-Bench, to evaluate visual reasoning capabilities without location hints, highlighting the challenges faced by current models.'}}}, {'id': 'https://huggingface.co/papers/2606.30030', 'title': 'CogSENet: Blind Image Deblurring with Blur-Conditioned Semantic Routing and Explicit Frequency Fusion', 'url': 'https://huggingface.co/papers/2606.30030', 'abstract': "Abstract CogSENet presents a novel blind image deblurring framework inspired by eagle vision, incorporating semantic-aware modules and frequency decomposition for improved restoration quality and structural fidelity.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Blind image deblurring demands the recovery of high-fidelity details and coherent structures from complex, unknown degradations. Current blind image deblurring methods struggle with real-world, spatially varying degradations, and lack the semantic awareness necessary to reliably differentiate valid textures from artifacts. To bridge this gap, we propose CogSENet, a dynamic, semantic-aligned reconstruction framework inspired by the eagle's visual system. By mimicking the eagle's active saccadic scanning, we devise a Semantic-Driven State Space Module (SDSSM) with semantic-aware token regrouping via differentiable routing, enabling prompt-conditioned long-range dependency modeling. To ensure physically interpretable recovery of textures and structures, a BiFreqFusionBlock (BFFB) mirrors functional differentiation of the eagle's retina by decomposing features into high and low frequencies using wavelet transforms. Finally, we estimate a continuous Blur Field (CBF) from blur image and fuse it with CLIP semantic priors to modulate the deepest latent features, emulating focal adaptation and enabling adaptive restoration under spatially non-uniform blur. Extensive experiments demonstrate that CogSENetoutperforms state-of-the-art deblurring methods in both visual quality and structural fidelity with fewer parameters, while also performing favorably on dehazing, deraining, and denoising tasks.", 'score': 1, 'issue_id': 2752, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '99d7f27fb9dfb1d3', 'github_url': '', 'github_stars': 0, 'authors': ['Pan Wang', 'Yihao Hu', 'Xiujin Liu'], 'affiliations': ['University of Michigan, Ann Arbor, MI, USA', 'University of Science and Technology of China, Hefei, China', 'Westlake University, Hangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2606.30030.jpg', 'data': {'categories': ['#dataset', '#architecture'], 'emoji': '🦅', 'ru': {'title': 'CogSENet: Восстановление изображений на основе зрения орлов', 'desc': 'CogSENet представляет собой инновационную систему для устранения размытия изображений, вдохновленную зрением орлов. Она использует семантически осознанные модули и разложение частот для повышения качества восстановления и структурной целостности. Метод позволяет эффективно различать действительные текстуры и артефакты, что является одним из основных недостатков существующих технологий. Эксперименты показывают, что CogSENet превосходит другие методы устранения размытия по качеству визуализации и структурной точности.'}, 'en': {'title': 'Eagle-Inspired Image Deblurring for Superior Quality', 'desc': 'CogSENet is a new framework for blind image deblurring that takes inspiration from how eagles see. It uses semantic-aware modules and frequency decomposition to improve the quality of restored images and maintain their structure. The framework includes a Semantic-Driven State Space Module for better understanding of textures and a BiFreqFusionBlock to separate image features into different frequency components. Experiments show that CogSENet outperforms existing methods in image quality and structure while being efficient in terms of parameters.'}}}, {'id': 'https://huggingface.co/papers/2607.08964', 'title': 'Long-Horizon-Terminal-Bench: Testing the Limits of Agents on Long-Horizon Terminal Tasks with Dense Reward-Based Grading', 'url': 'https://huggingface.co/papers/2607.08964', 'abstract': 'Abstract  AI agents have become capable of autonomously completing short, well-specified tasks. However, existing terminal benchmarks largely focus on simple problems that finish within minutes and are evaluated only by their final outcome. This setup overlooks intermediate progress and partial solutions, yielding sparse reward signals and an incomplete picture of agent capability. We introduce Long-Horizon-Terminal-Bench, a terminal benchmark of 46 long-horizon tasks spanning nine categories, including experiment reproduction, software engineering, multimodal analysis, interactive games, and scientific computing. Each task follows a Terminal-Bench-style setup with a reference solution or simulation engine, but is further decomposed into fine-grained graded subtasks. This design enables dense intermediate rewards and partial credit, allowing evaluation to capture not only whether an agent reaches the final goal, but also how far it progresses on open-ended workflows. Tasks in Long-Horizon-Terminal-Bench typically require hundreds of episodes and minutes to hours of execution, stressing long-horizon planning, long-context management, and iterative debugging rather than one-shot problem solving. We evaluate 15 frontier models and find that agents consume on average 9.9M tokens per task, with roughly 231 episodes and 85.3 minutes of execution time per run, making Long-Horizon-Terminal-Bench more demanding than prior terminal-based benchmarks. Even the strongest tested model achieves 15.2% pass@1 at a partial-reward threshold of 0.95 and 10.9% at a perfect-reward threshold of 1.0, while the mean pass rate across models is 4.3% and 1.7% under the two thresholds, respectively. These results reveal headroom for improvement. We further analyze failure modes and error patterns, and release Long-Horizon-Terminal-Bench to support future progress on long-horizon terminal agents.', 'score': 43, 'issue_id': 2808, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': 'd74cc32e92ccf4b6', 'github_url': '', 'github_stars': 0, 'authors': ['Zongxia Li', 'Zhongzhi Li', 'Yucheng Shi', 'Ruhan Wang', 'Junyao Yang', 'Zhichao Liu', 'Xiyang Wu', 'Anhao Li', 'Yue Yu', 'Ninghao Liu', 'Lichao Sun', 'Haotao Mi', 'LeoweiLiang'], 'affiliations': ['Indiana University', 'Lehigh University', 'National University of Singapore', 'Tencent HY LLM Frontier', 'The Hong Kong Polytechnic University', 'University of Georgia', 'University of Maryland, College Park', 'University of Minnesota, Twin Cities'], 'pdf_title_img': 'assets/pdf/title_img/2607.08964.jpg', 'data': {'categories': ['#long_context', '#agents', '#optimization', '#benchmark', '#games', '#multimodal'], 'emoji': '🧠', 'ru': {'title': 'Новый подход к оценке долгосрочных агентов', 'desc': 'В статье представлен новый бенчмарк Long-Horizon-Terminal-Bench, который включает 46 задач с длительным горизонтом, охватывающих девять категорий, таких как инженерия программного обеспечения и научные вычисления. Этот бенчмарк даёт возможность оценивать агенты не только по финальному результату, но и по промежуточному прогрессу и частичным решениям. Применение детализированных подзадач позволяет получать плотные промежуточные награды, что способствует более полной оценке способности агента. Исследование показывает, что текущие модели справляются с задачами с низким коэффициентом успеха, что указывает на потенциал для улучшения в области долгосрочного планирования.'}, 'en': {'title': 'Revolutionizing AI Evaluation with Long-Horizon Tasks', 'desc': "This paper presents Long-Horizon-Terminal-Bench, a new benchmark designed to evaluate AI agents on complex, long-horizon tasks across various domains. Unlike existing benchmarks that focus on short tasks with sparse rewards, this framework decomposes tasks into fine-grained subtasks, providing dense intermediate rewards and partial credit. This allows for a more comprehensive assessment of an agent's capabilities, including its progress on open-ended workflows. The evaluation of 15 advanced models shows significant room for improvement, highlighting the challenges of long-horizon planning and iterative debugging."}}}, {'id': 'https://huggingface.co/papers/2607.09657', 'title': 'Scalable Visual Pretraining for Language Intelligence', 'url': 'https://huggingface.co/papers/2607.09657', 'abstract': 'Abstract  The rapid progress of large foundation models has been driven predominantly by pretraining on large-scale text corpora. However, many forms of knowledge are conveyed through visual representations, where figures, typeset equations, and page layouts carry rich information that cannot be faithfully or completely captured by text alone. Yet current pretraining approaches discard these visual cues by converting visually rich sources, such as documents and web pages, into plain text for learning language intelligence. This paper challenges the default assumption that language models must be trained on text-only representations and shows that Visual Pretraining is a scalable learner for foundation model intelligence. To this end, we conduct a systematic study of unsupervised visual pretraining paradigms that directly leverage visual documents without text extraction. Across multiple backbones and benchmarks, visual pretraining on the same underlying corpora consistently outperforms text-only pretraining, offering an efficient pathway to scalable language intelligence.', 'score': 40, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'ac359bb46cd0477a', 'github_url': '', 'github_stars': 0, 'authors': ['Yiming Zhang', 'Zhonghan Zhao', 'Wenwei Zhang', 'Haiteng Zhao', 'Tianyang Lin', 'Yunhua Zhou', 'Demin Song', 'Kuikun Liu', 'Haochen Ye', 'Haian Huang', 'Yuzhe Gu', 'Haijun Lv', 'Qipeng Guo', 'Bin Liu', 'Gaoang Wang', 'Kai Chen'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.09657.jpg', 'data': {'categories': ['#multimodal', '#optimization', '#transfer_learning', '#training'], 'emoji': '📊', 'ru': {'title': 'Визуальное предварительное обучение для языковых моделей', 'desc': 'В статье обсуждается важность визуальных представлений для больших языковых моделей. Авторы утверждают, что существующие методы предварительного обучения игнорируют визуальные элементы, такие как графики и макеты, преобразуя их в обычный текст. Они предлагают новый подход - визуальное предварительное обучение, которое использует визуальные документы без извлечения текста. Результаты показывают, что такой метод значительно превосходит традиционное предварительное обучение на текстовых данных.'}, 'en': {'title': 'Unlocking Language Intelligence with Visual Pretraining', 'desc': 'This paper explores the limitations of traditional language models that rely solely on text for training. It argues that visual information, such as figures and layouts, contains valuable knowledge that is often overlooked. The authors propose a method called Visual Pretraining, which utilizes visual documents directly without converting them to text. Their experiments show that this approach consistently outperforms text-only pretraining, highlighting its potential for enhancing language model intelligence.'}}}, {'id': 'https://huggingface.co/papers/2607.09024', 'title': 'Video Generation Models are General-Purpose Vision Learners', 'url': 'https://huggingface.co/papers/2607.09024', 'abstract': 'Abstract  Driven by next-token prediction, NLP shifted from task-specific models into powerful generalist foundation models. What, then, is the equivalent catalyst needed to achieve a general-purpose model in computer vision? In this paper, we contend that large-scale text-to-video generation serves as a strong pre-training paradigm for computer vision, providing the necessary spatiotemporal priors, vision-language alignment, and scalability required for general visual intelligence. We introduce GenCeption, which leverages a pre-trained video generative diffusion backbone to define a feed-forward perception model, capable of performing various vision tasks steered by text instructions. Empirical results demonstrate that GenCeption achieves state-of-the-art performance across a diverse suite of tasks, including depth, surface normal, and camera pose estimation, expression-referring segmentation, and 3D keypoint prediction, often matching or surpassing specialized models (e.g. DepthAnything3, SAM3, D4RT, VGGT-Omega, Sapiens, David, Genmo, and Lotus-2). Furthermore, the video generative pretrained backbone outperforms alternative pretraining paradigms (e.g., V-JEPA, and Video MAE) under comparable settings. Importantly, GenCeption exhibits preliminary data and model scaling properties along with exceptional data efficiency, where it achieves comparable performance with leading models like D4RT and VGGT-Omega with 7 to 500 less training data. Finally, GenCeption also exhibits intriguing emergent behaviors: a model trained exclusively on synthetic human videos generalizes to real-world footage and out-of-distribution object categories (e.g., animals and robots). These findings suggest that video generation is not merely a synthesis tool, but a foundational path toward generalist vision intelligence for the physical world. Project page: https://genception.github.io', 'score': 37, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': '4e359f0c7d9799ac', 'github_url': '', 'github_stars': 0, 'authors': ['Letian Wang', 'Chuhan Zhang', 'Rishabh Kabra', 'Jasper Uijlings', 'Steven Waslander', 'Andrew Zisserman', 'Joao Carreira', 'Kaiming He', 'Misha Andriluka', 'Eduard Gabriel Bazavan', 'Andrei Zanfir', 'Cristian Sminchisescu'], 'affiliations': ['Google DeepMind', 'Lund University', 'MIT', 'University College London', 'University of Oxford', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2607.09024.jpg', 'data': {'categories': ['#agi', '#training', '#optimization', '#3d', '#multimodal', '#diffusion'], 'emoji': '🎥', 'ru': {'title': 'Генерация видео как путь к универсальному зрению', 'desc': 'В данной статье рассматривается, как генерация видео на основе текста может служить основой для создания универсальной модели в области компьютерного зрения. Авторы представляют модель GenCeption, использующую предобученную диффузионную модель для генерации видео, что позволяет ей эффективно выполнять различные задачи компьютерного зрения, управляемые текстовыми инструкциями. Эмпирические результаты показывают, что GenCeption достигает выдающихся результатов в множестве задач, превосходя специализированные модели и демонстрируя высокую эффективность при обучении на меньшем объеме данных. Это подтверждает, что генерация видео является ключевым шагом к созданию общего интеллекта в области компьютерного зрения.'}, 'en': {'title': 'GenCeption: Bridging Video Generation and Generalist Vision Intelligence', 'desc': 'This paper introduces GenCeption, a model that uses large-scale text-to-video generation as a pre-training method for computer vision tasks. By leveraging a pre-trained video generative diffusion backbone, GenCeption can perform various vision tasks guided by text instructions. The model demonstrates state-of-the-art performance in tasks like depth estimation and 3D keypoint prediction, often outperforming specialized models. Additionally, GenCeption shows remarkable data efficiency and the ability to generalize from synthetic to real-world data, indicating its potential as a foundation for general visual intelligence.'}}}, {'id': 'https://huggingface.co/papers/2607.04751', 'title': 'Trust Region Policy Distillation', 'url': 'https://huggingface.co/papers/2607.04751', 'abstract': 'Abstract  Big goals are hard to achieve all at once; breaking them into small steps is wiser. We present Trust Region Policy Distillation (TOP-D), which transforms the notoriously unstable, high-variance On-Policy Distillation (OPD) into a stable training paradigm by dynamically constructing a proximal teacher. Theoretically, we establish a rigorous framework demonstrating that TOP-D inherently controls gradient variance. By providing a formal global convergence analysis alongside a monotonic improvement bound, we mathematically formalize the reliability and stability of the overall training dynamics. Empirically, TOP-D dramatically enhances training stability, sample efficiency, and final performance on mathematical reasoning tasks. More importantly, TOP-D introduces zero additional computational overhead, positioning itself as a promising alternative to the well-established OPD paradigm.', 'score': 17, 'issue_id': 2808, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'd3b731e041601585', 'github_url': '', 'github_stars': 0, 'authors': ['Zhengpeng Xie', 'Li Lyna Zhang', 'Zeke Xie', 'Mao Yang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.04751.jpg', 'data': {'categories': ['#training', '#optimization', '#reasoning', '#rl', '#math'], 'emoji': '⚙️', 'ru': {'title': 'Стабильное обучение без дополнительных затрат', 'desc': 'В статье представлен метод Trust Region Policy Distillation (TOP-D), который улучшает нестабильный процесс обучения On-Policy Distillation (OPD). TOP-D динамически создает проксимального учителя, что позволяет контролировать вариантность градиентов. Авторы предоставляют теоретическую основу и анализ глобальной сходимости, подтверждающий надежность training dynamics. Эксперименты показывают, что TOP-D значительно улучшает стабильность обучения и эффективность выборки без дополнительных вычислительных затрат.'}, 'en': {'title': 'Stable Learning Through Trust Region Policy Distillation', 'desc': "This paper introduces Trust Region Policy Distillation (TOP-D), a method that improves the stability of On-Policy Distillation (OPD) by creating a dynamic proximal teacher. It provides a theoretical framework that shows how TOP-D controls gradient variance, leading to more reliable training. The authors present a global convergence analysis and a monotonic improvement bound, ensuring the method's effectiveness. Empirical results demonstrate that TOP-D significantly boosts training stability, sample efficiency, and performance in mathematical reasoning tasks without adding extra computational costs."}}}, {'id': 'https://huggingface.co/papers/2607.07964', 'title': 'KronQ: LLM Quantization via Kronecker-Factored Hessian', 'url': 'https://huggingface.co/papers/2607.07964', 'abstract': 'Abstract  Post-training quantization (PTQ) is a widely adopted technique for compressing large language models (LLMs) without retraining. Existing second-order PTQ methods, including GPTQ, construct quantization objectives exclusively from input activation statistics, effectively assuming that all output channels contribute equally to the layer-wise reconstruction objective. We propose KronQ, a PTQ framework that challenges this assumption by introducing the gradient covariance into the quantization pipeline. Under the Kronecker-factored Hessian approximation, the quantization loss depends jointly on both the activation and gradient covariances, and KronQ exploits this at two complementary levels. (1) KronQ introduces bidirectional incoherence processing, extending the existing input-side random rotation to the output dimension using the gradient covariance, reducing weight magnitude variance across both input and output dimensions. (2) KronQ derives a new sensitivity metric for inter-layer mixed-precision allocation, driven by the gradient and activation Hessian traces. Notably, in the case of 2-bit weight-only quantization on LLaMA-3-70B, while GPTQ and GPTAQ diverge or produce degenerate quantizations (>2000 perplexity on WikiText-2), KronQ achieves 7.93 perplexity.', 'score': 14, 'issue_id': 2808, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'cb86bfef96149ae6', 'github_url': '', 'github_stars': 0, 'authors': ['Donghyun Lee', 'Yuhang Li', 'Ruokai Yin', 'Priyadarshini Panda'], 'affiliations': ['University of Southern California', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2607.07964.jpg', 'data': {'categories': ['#inference', '#compression', '#optimization'], 'emoji': '📉', 'ru': {'title': 'Повышение эффективности квантизации с помощью KronQ', 'desc': 'Статья представляет новый метод квантизации после обучения (PTQ) для больших языковых моделей (LLM) под названием KronQ. Отличие KronQ заключается в использовании ковариации градиента для более точной квантизации, что позволяет улучшить качество модели. Метод вводит двунаправленную обработку некогерентности и разрабатывает новую метрику чувствительности для распределения смешанной точности. В эксперименте KronQ демонстрирует значительно лучшее качество по сравнению с существующими методами, такими как GPTQ.'}, 'en': {'title': 'KronQ: Smarter Quantization for Better Language Models', 'desc': 'This paper presents KronQ, a novel post-training quantization (PTQ) framework for compressing large language models without the need for retraining. Unlike existing methods that treat all output channels equally, KronQ incorporates gradient covariance into the quantization process, allowing for a more nuanced approach. It introduces bidirectional incoherence processing to reduce weight magnitude variance and develops a new sensitivity metric for mixed-precision allocation based on gradient and activation Hessian traces. The results show that KronQ significantly outperforms previous methods, achieving a perplexity of 7.93 on LLaMA-3-70B with 2-bit weight-only quantization.'}}}, {'id': 'https://huggingface.co/papers/2607.06553', 'title': 'From RGB Generation to Dense Field Readout: Pixel-Space Dense Prediction with Text-to-Image Models', 'url': 'https://huggingface.co/papers/2607.06553', 'abstract': "Abstract Pretrained diffusion transformers can be adapted for dense prediction tasks by mapping tokens to task-native outputs instead of generating RGB images, achieving state-of-the-art results with minimal additional parameters.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large-scale text-to-image models are attractive backbones for dense prediction because RGB generation pretraining learns rich semantic, structural, and geometric priors. Existing generative and editing approaches reuse these priors by casting dense prediction as target generation: annotations such as depth, normals, alpha mattes, masks, and heatmaps are encoded into an RGB-trained VAE latent space and decoded back as image-like targets. We argue this inherits more of the generative output interface than dense prediction requires: unlike RGB synthesis, dense prediction asks for pixel-correct, task-native fields on the same image plane, not new RGB content to be rendered. Our key observation is that a pretrained DiT already organizes RGB inputs through a patch-to-token-to-patch lattice on the image plane, so each token indexes a fixed output patch whose channels can carry task-native quantities instead of RGB appearance. We instantiate this as ReChannel: we keep the VAE encoder for the DiT's input distribution but drop the target-side decoder, adapt the frozen DiT with task LoRA, and map each token to its p x p x K_t pixel-space patch through a shared token-local linear head--about 33K parameters, no spatial mixing. Using FLUX-Klein, we evaluate on six dense prediction tasks and over a dozen benchmarks. This minimal interface sets new state-of-the-art on trimap-free matting, KITTI depth, and referring segmentation, and stays competitive on normals, saliency, and pose. In a matched 4B setting it is more accurate and 2.48x faster than an edit-plus-latent-decode counterpart--dense perception can benefit from generative pretraining without inheriting its output interface.", 'score': 9, 'issue_id': 2808, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '4eed6a07ac58ef65', 'github_url': '', 'github_stars': 0, 'authors': ['Zanyi Wang', 'Xin Lin', 'Haodong Li', 'Dengyang Jiang', 'Yijiang Li'], 'affiliations': ['HKUST', 'UCSD'], 'pdf_title_img': 'assets/pdf/title_img/2607.06553.jpg', 'data': {'categories': ['#dataset', '#training', '#optimization', '#benchmark', '#architecture', '#diffusion'], 'emoji': '🖼️', 'ru': {'title': 'Новые горизонты плотного прогнозирования с диффузионными трансформерами', 'desc': 'В данной статье рассматривается адаптация предварительно обученных диффузионных трансформеров для задач плотного прогнозирования. Авторы показывают, что можно сопоставить токены с выходами, специфичными для задач, вместо генерации RGB-изображений, что приводит к высоким результатам с минимальным числом дополнительных параметров. Используя метод ReChannel, была значительно улучшена точность на нескольких задачах плотного прогнозирования, таких как матирование и определение глубины. В результате исследование подтверждает, что плотное прогнозирование может выигрывать от предварительного обучения генеративных моделей без необходимости в сложных выходных интерфейсах.'}, 'en': {'title': 'ReChannel: Transforming Tokens for Dense Prediction', 'desc': 'This paper presents a method called ReChannel, which adapts pretrained diffusion transformers for dense prediction tasks by mapping tokens to specific outputs instead of generating RGB images. The authors argue that traditional methods inherit unnecessary complexities from RGB generation, while dense prediction requires precise pixel-level outputs. By leveraging the existing structure of the pretrained model, they achieve state-of-the-art results on various benchmarks with minimal additional parameters. The approach demonstrates that generative pretraining can enhance dense prediction tasks without the need for complex output interfaces.'}}}, {'id': 'https://huggingface.co/papers/2607.09661', 'title': 'PanoWorld: Real-World Panoramic Generation', 'url': 'https://huggingface.co/papers/2607.09661', 'abstract': 'Abstract  In this work, we aim to address the challenge of long-range memory in panoramic world models by exploiting the rotation-equivariant property of omnidirectional representations, where rotation can be treated as an implicit geometric transformation.Building on this insight, we propose PanoWorld, which simplifies camera trajectories into translations via fixed headings for both current-action modeling and long-range memory through Dense Panoramic Ray-Conditioning (DPRC) and Geometry-aware Memory Augmentation (GMA).Then, a three-stage training pipeline is introduced to progressively optimize each component. To better evaluate physical consistency under large-scale spatial variations and diverse illumination conditions, where existing datasets are relatively stable, we construct World360, a large-scale dataset consisting of both real-world video clips collected via panoramic unmanned aerial vehicles and high-quality simulated clips generated by AirSim360.Extensive experiments on World360 demonstrate the effectiveness of PanoWorld, outperforming alternative methods by a large margin.Our models, training code, and dataset will be publicly available. More information can be found on our project page: https://lihaoy-ux.github.io/panoworld-page/.', 'score': 7, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'd660ddd49b93da81', 'github_url': '', 'github_stars': 0, 'authors': ['Haoyuan Li', 'Dizhe Zhang', 'Yuemei Zhou', 'Xiangkai Zhang', 'Haoran Feng', 'Xiaofan Lin', 'Wenjie Jiang', 'Bo Du', 'Ming-Hsuan Yang', 'Lu Qi'], 'affiliations': ['Insta360 Research', 'Institute of Automation Chinese Academy of Sciences', 'Tsinghua University', 'UC Merced', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.09661.jpg', 'data': {'categories': ['#dataset', '#training', '#long_context', '#open_source', '#data'], 'emoji': '🌍', 'ru': {'title': 'Новая эра панорамного моделирования в ML', 'desc': 'В данной работе мы решаем задачу долгосрочной памяти в панорамных мировых моделях, используя свойство вращательной эквивалентности. Мы представляем PanoWorld, который упрощает траектории камер, используя фиксированные направления для моделирования текущих действий и долгосрочной памяти. В статье также предложен трехступенчатый процесс обучения для оптимизации каждого компонента. Для оценки физической консистентности в условиях больших пространственных вариаций мы создали датасет World360, который включает реальные видеоклипы и высококачественные симулированные кадры.'}, 'en': {'title': 'Revolutionizing Long-Range Memory in Panoramic Models', 'desc': 'This paper introduces PanoWorld, a method designed to improve long-range memory in panoramic world models by utilizing the rotation-equivariant nature of omnidirectional representations. It simplifies camera movements into translations with fixed headings, enhancing both current-action modeling and long-range memory through techniques like Dense Panoramic Ray-Conditioning and Geometry-aware Memory Augmentation. The authors also present a three-stage training pipeline to optimize the model components progressively. To validate their approach, they created World360, a large-scale dataset that includes real-world and simulated panoramic video clips, demonstrating that PanoWorld significantly outperforms existing methods in various conditions.'}}}, {'id': 'https://huggingface.co/papers/2607.09415', 'title': 'Self-Guided Test-Time Training for Long-Context LLMs', 'url': 'https://huggingface.co/papers/2607.09415', 'abstract': "Abstract  Long-context processing has become increasingly important for large language models (LLMs), but simply extending the context window does not guarantee effective utilization of long inputs. As input length grows, accuracy often degrades, indicating that models still struggle to identify and use the evidence most relevant to a question. A promising way to improve long-context utilization is test-time training (TTT), which treats the test context as a training example for instance-specific parameter adaptation. However, applying TTT to the entire long context is prohibitively expensive, while adapting on randomly sampled spans introduces severe noise. Because most spans in a long context are irrelevant to the specific question, training on them may even degrade the base model's performance. Our preliminary study shows that TTT is highly sensitive to training-span quality: on LongBench-v2, TTT on randomly sampled spans hurts performance, whereas TTT on oracle spans substantially improves it. Motivated by this, we propose a simple method, Self-Guided TTT (S-TTT): before adaptation, the model identifies the evidence spans it should learn from, and the standard language-modeling training objective is applied only to those selected spans. On two challenging long-context reasoning benchmarks, LongBench-v2 and LongBench-Pro, S-TTT improves accuracy for both Qwen3-4B-Thinking-2507 and Llama-3.1-8B-Instruct, achieving up to a 15% relative improvement.", 'score': 7, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'f56f50f78f986eda', 'github_url': '', 'github_stars': 0, 'authors': ['Xinyu Zhu', 'Zhe Xu', 'Xiaohan Wei', 'Yunchen Pu', 'Fei Tian', 'Chonglin Sun', 'Kaushik Rangadurai', 'Hua Zhi', 'Frank Shyu', 'Sandeep Pandey', 'Luke Simon', 'Yu Meng', 'Xi Liu'], 'affiliations': ['Meta AI', 'University of Virginia'], 'pdf_title_img': 'assets/pdf/title_img/2607.09415.jpg', 'data': {'categories': ['#long_context', '#optimization', '#context_window', '#training'], 'emoji': '📚', 'ru': {'title': 'Улучшение обработки длинных контекстов с помощью S-TTT', 'desc': 'В статье рассматривается проблема обработки длинных контекстов в больших языковых моделях (LLM). Увеличение длины контекстного окна не всегда приводит к лучшему использованию информации, так как точность может ухудшаться. Предлагается метод тестового обучения (TTT) для адаптации модели к конкретным кускам контекста, но использование случайно выбранных фрагментов может ухудшить качество. Новый подход, Self-Guided TTT (S-TTT), позволяет модели самостоятельно выбирать информативные фрагменты для обучения, что значительно повышает точность.'}, 'en': {'title': 'Enhancing Long-Context Processing with Self-Guided Training', 'desc': 'This paper addresses the challenges of processing long contexts in large language models (LLMs), where simply increasing the context window does not ensure better performance. It highlights the issue of accuracy degradation when models are faced with lengthy inputs, as they struggle to focus on relevant information. The authors propose a method called Self-Guided Test-Time Training (S-TTT), which allows models to identify and learn from the most pertinent spans of text rather than randomly sampled ones. Their experiments show that S-TTT significantly enhances accuracy on long-context reasoning tasks, demonstrating the importance of training-span quality.'}}}, {'id': 'https://huggingface.co/papers/2607.08393', 'title': 'Towards Mechanistically Understanding Why Memorized Knowledge Fails to Generalize in Large Language Model Finetuning', 'url': 'https://huggingface.co/papers/2607.08393', 'abstract': 'Abstract  Fine-tuning LLMs to inject new knowledge faces a critical challenge: LLMs can quickly memorize new facts, yet fail to use them for downstream reasoning tasks. We formalize this failure as the \\textbf{Knowing--Using Gap}, characterized by an accuracy gap and a temporal lag between memorization and generalization. To understand this phenomenon, we fine-tune LLMs with unseen knowledge and monitor the spatial permeation dynamics of the knowledge internally using a novel intervention technique called self-patching. Self-patching identifies activation locations where relocating representations substantially improves failed generalization cases. These results are consistent with a knowledge-circuit misalignment hypothesis: memorized representations can exist internally but may not be routed to computation-effective layers. To demonstrate the practicality of this diagnostic finding, we design a simple heuristic strategy which recovers 58--75\\% of the oracle headroom in generalization failure. Experiments are done cross-domain for the robustness of this finding.', 'score': 6, 'issue_id': 2808, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '337377a960482d82', 'github_url': '', 'github_stars': 0, 'authors': ['Lu Dai', 'Ziyang Rao', 'Yili Wang', 'Hanqing Wang', 'Hao Liu', 'Hui Xiong'], 'affiliations': ['HKUST', 'HKUST(GZ)'], 'pdf_title_img': 'assets/pdf/title_img/2607.08393.jpg', 'data': {'categories': ['#memorization', '#reasoning', '#optimization', '#training'], 'emoji': '🤖', 'ru': {'title': 'Закрываем разрыв между знанием и использованием', 'desc': "Статья изучает проблему, когда крупные языковые модели (LLM) быстро запоминают новую информацию, но не могут эффективно использовать её в дальнейших задачах. Это явление называется 'Разрывом Знания и Использования' и проявляется в разнице точности и временной задержке между запоминанием и обобщением знаний. Авторы предлагают метод 'самопереписывания', который помогает переместить представления внутри модели для улучшения обобщения. Результаты показывают, что умело изменяя активации, можно значительно повысить эффективность обобщения модели."}, 'en': {'title': 'Bridging the Knowing–Using Gap in LLMs', 'desc': 'This paper addresses the challenge of fine-tuning large language models (LLMs) to effectively use newly learned knowledge. It introduces the concept of the Knowing–Using Gap, which highlights the discrepancy between memorizing facts and applying them in reasoning tasks. The authors employ a technique called self-patching to analyze how knowledge is represented within the model and to improve generalization. Their findings suggest that while LLMs can memorize information, the routing of this knowledge to the appropriate computational layers is often misaligned, leading to generalization failures.'}}}, {'id': 'https://huggingface.co/papers/2607.06957', 'title': 'Flow-ERD: Agent-type Aware Flow Matching with Entropy-Regularized Distillation for Diverse Traffic Simulation', 'url': 'https://huggingface.co/papers/2607.06957', 'abstract': "Abstract Flow-ERD is a multi-agent traffic simulator that combines agent-type aware flow matching with entropy-regularized distillation to achieve both realistic and diverse motion patterns.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Realistic and diverse traffic simulation is essential to autonomous driving development. Yet prevailing benchmarks predominantly reward realism, and recent methods have optimized accordingly, leaving diversity underexplored. We introduce Flow-ERD, a multi-agent simulator that pursues realism and diversity jointly. Its backbone, Agent-Type Aware Flow Matching (AFM), couples flow matching's multi-modal expressiveness with type-specific kinematic execution. It preserves fine-grained diversity while keeping motions consistent with each agent type. A second stage, Entropy-Regularized Distillation (ERD), fine-tunes the closed-loop rollout distribution with an entropy-regularized reverse-KL objective. This mitigates covariate shift while explicitly preventing collapse onto high-density modes. We evaluate Flow-ERD with a log-free diversity metric alongside standard realism scores. Flow-ERD ranks first on the WOSAC test benchmark and dominates the realism--diversity Pareto front among reproducible baselines. Our project page is available https://seulbinhwang.github.io/flow-erd-project-page/{here}.", 'score': 4, 'issue_id': 2809, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '92b2d4473473919c', 'github_url': '', 'github_stars': 0, 'authors': ['Seulbin Hwang', 'Kiyoung Om', 'Daejung Kim', 'Jinhan Lee'], 'affiliations': ['NAVER LABS Corp., Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.06957.jpg', 'data': {'categories': ['#agents', '#games', '#optimization', '#benchmark', '#rl'], 'emoji': '🚗', 'ru': {'title': 'Реализм и разнообразие движения в симуляции', 'desc': 'В статье представлена новая модель симуляции движения автомобилей Flow-ERD, которая сочетает реалистичное и разнообразное моделирование движения. Используя метод Agent-Type Aware Flow Matching (AFM), модель обеспечивает точное соответствие типам агентов и разнообразие движений. Второй этап, Entropy-Regularized Distillation (ERD), настраивает распределение с учетом энтропии, предотвращая сходимость к высокоплотным режимам. Flow-ERD демонстрирует лучшие результаты на тестовом бенчмарке WOSAC, что подтверждает его эффективность в сравнении с другими методами.'}, 'en': {'title': 'Balancing Realism and Diversity in Traffic Simulation', 'desc': 'Flow-ERD is a multi-agent traffic simulator designed to enhance both realism and diversity in traffic patterns, which is crucial for the development of autonomous driving systems. It employs Agent-Type Aware Flow Matching (AFM) to ensure that the motion of different agent types remains consistent while allowing for fine-grained diversity. Additionally, it incorporates Entropy-Regularized Distillation (ERD) to refine the distribution of generated traffic patterns, preventing the model from focusing too heavily on common scenarios. The simulator has been evaluated against existing benchmarks, achieving top rankings in both realism and diversity metrics.'}}}, {'id': 'https://huggingface.co/papers/2607.09020', 'title': 'Phone Segmentation and Recognition through Phonological Activation Mapping', 'url': 'https://huggingface.co/papers/2607.09020', 'abstract': 'Abstract  Phone segmentation and recognition are inherently related tasks, yet modern approaches typically model them separately. We argue that phonetic structure is already latent in the representations of self-supervised speech models (S3Ms), and one only needs to steer them to solve both tasks. We leverage S3M-based Phonological Activation Mapping (SPAM), which maps each S3M representation frame to a vector of phonological feature activations, such as voicing and nasality. On top of SPAM, we introduce two simple but effective lightweight, gradient-descent-free prediction heads: a recognition head and a segmentation head. Our method requires less than a minute of phonetic transcriptions, and generalizes to unseen phones during training. Across a diverse range of datasets, our approach attains strong segmentation and recognition performance.', 'score': 2, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'a023e6f6db24191b', 'github_url': '', 'github_stars': 0, 'authors': ['Shikhar Bharadwaj', 'Kwanghee Choi', 'Stephen McIntosh', 'Chin-Jou Li', 'Eunjung Yeo', 'Daisuke Saito', 'Nobuaki Minematsu', 'Shinji Watanabe', 'Jian Zhu', 'David Harwath', 'David R. Mortensen'], 'affiliations': ['CMU, USA', 'UBC, Canada', 'UT Austin, USA', 'UTokyo, Japan'], 'pdf_title_img': 'assets/pdf/title_img/2607.09020.jpg', 'data': {'categories': ['#audio'], 'emoji': '🔊', 'ru': {'title': 'Объединение сегментации и распознавания фонем в одном подходе', 'desc': 'В этой статье рассматриваются задачи сегментации и распознавания фонем, которые обычно моделируются отдельно. Авторы утверждают, что фонетическая структура уже присутствует в представлениях моделей самообучения речи (S3Ms). Они представляют метод, основанный на PLAM (Phonological Activation Mapping), который связывает представления S3M с активами фонологических признаков. Новый подход демонстрирует высокую эффективность в задачах сегментации и распознавания, требуя минимального количества расшифровок фонем.'}, 'en': {'title': 'Unified Phone Segmentation and Recognition with Self-Supervised Models', 'desc': 'This paper presents a novel approach to phone segmentation and recognition by utilizing self-supervised speech models (S3Ms). It introduces a method called S3M-based Phonological Activation Mapping (SPAM) that connects phonetic features to S3M representations. The authors propose two lightweight prediction heads for recognition and segmentation that do not require gradient descent. Their method is efficient, needing minimal phonetic transcriptions, and shows strong performance across various datasets, even with unseen phones during training.'}}}, {'id': 'https://huggingface.co/papers/2607.07673', 'title': 'MedPMC: A Systematic Framework for Scaling High-Fidelity Medical Multimodal Data for Foundation Models', 'url': 'https://huggingface.co/papers/2607.07673', 'abstract': 'Abstract  Medicine is inherently multimodal, requiring clinicians to synthesize information across diverse data streams. Yet the development of multimodal foundation models is constrained by limited access to large-scale, high-quality clinical data. Although PubMed Central (PMC) offers a complementary source of expert-authored image-text data, existing PMC-derived resources remain limited in fidelity, reproducibility, and clinical validation. We introduce MedPMC, an automated, continuously updatable framework that transforms permissively licensed literature into high-fidelity infrastructure for medical multimodal models. Applied to 6.1 million PMC articles, MedPMC curated 11 million medical image-text pairs. Component evaluations showed strong performance for initial screening (F1 = 93.2), multi-panel figure detection (F1 = 96.5), figure separation (mAP = 89.8), caption separation and alignment (F1 = 81.4; ROUGE-L = 85.3), and medical figure classification (F1 = 96.5). Manual review by five annotators, three with medical training, found 95.3% of MedPMC images medically relevant, versus 19.7% in a prior PMC-derived dataset. Across 26 benchmarks spanning 11 specialties, a MedPMC-trained CLIP-style model improved average zero-shot AUC by 7.1 percentage points over the strongest architecture-matched biomedical CLIP baseline despite using fewer than half as many image-text pairs. As the vision encoder in a multimodal large language model, it improved medical visual question-answering by 1.9 and 16.9 percentage points across two benchmarks. In 10,524 Yale New Haven Health System dermatology photographs, it improved morphology-to-image retrieval Recall@5 by 11.7 percentage points. These findings show that high-fidelity literature curation strengthens medical multimodal foundation models across benchmark and clinical settings. We publicly release the framework, corpus, benchmarks, and pretrained models.', 'score': 2, 'issue_id': 2810, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'bc11859bbf7bb64a', 'github_url': '', 'github_stars': 0, 'authors': ['Hyunjae Kim', 'Dain Kim', 'Pan Xiao', 'Serina S. Applebaum', 'Younjoon Chung', 'Xuguang Ai', 'Yu Yin', 'Roy Jiang', 'Yuexi Du', 'Yawen Wei', 'Yiming Kong', 'Tuo Guo', 'Zhiyuan Cao', 'Mengmeng Du', 'Yuelei Fu', 'Yan Hu', 'Rui Shi', 'Gui Yang', 'Kevin W. Jin', 'Yuntian Liu', 'Yuxuan Tian', 'Jonathan Marquez', 'Zhen Chen', 'Sheng Zhang', 'Hoifung Poon', 'Hua Xu', 'Jaewoo Kang', 'Qingyu Chen'], 'affiliations': ['Korea University, Seoul, South Korea', 'Microsoft Research, Redmond, WA, USA', 'The University of Queensland, Brisbane, QLD, Australia', 'The University of Texas Health Science Center at Houston, Houston, TX, USA', 'University of Washington, Seattle, WA, USA', 'Washington University in St. Louis, St. Louis, MO, USA', 'Yale University, New Haven, CT, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.07673.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#open_source', '#science', '#dataset', '#healthcare', '#data'], 'emoji': '🩺', 'ru': {'title': 'Качество данных — ключ к успеху в медицине!', 'desc': 'В данной статье представлен MedPMC — автоматизированная система, которая преобразует лицензионные медицинские статьи в высококачественные данные для многомодальных моделей. MedPMC обработал 6,1 миллиона статей из PubMed Central и создал 11 миллионов пар изображений и текста. Оценки результатов показывают отличные показатели точности для множества задач, таких как классификация и выравнивание изображений с текстом. Эти достижения подчеркивают важность качественной кураторской работы для улучшения многомодальных медицинских моделей.'}, 'en': {'title': 'Transforming Medical Literature into High-Fidelity Multimodal Models', 'desc': 'This paper presents MedPMC, a framework that automates the curation of high-quality medical image-text pairs from PubMed Central literature. By processing 6.1 million articles, MedPMC generated 11 million pairs, significantly improving the fidelity and relevance of multimodal data for medical applications. The framework demonstrated strong performance in various tasks, including figure detection and medical classification, outperforming previous datasets. The results indicate that high-fidelity data curation enhances the capabilities of multimodal foundation models in clinical settings.'}}}, {'id': 'https://huggingface.co/papers/2607.09424', 'title': 'A Sovereign, Open-Source Foundation Model for German and English', 'url': 'https://huggingface.co/papers/2607.09424', 'abstract': 'Abstract  We present Soofi S 30B-A3B, a sovereign, open-source Mixture-of-Experts (MoE) hybrid Mamba Transformer foundation model for German and English. Its hybrid design activates only 3B of 30B parameters per token and keeps the inference cache near-constant as context grows, giving it a decisive throughput advantage over dense models for long-context, high-concurrency deployment. Pretrained on roughly 27 trillion tokens with deliberately up-weighted German, Soofi S matches dense 14 to 27B models on aggregate English and German benchmarks while achieving the best code aggregates in both languages among 17 open base models, and outperforms every European sovereign baseline in our comparison, including ones far larger in active parameters. Among fully open models, Soofi S obtains the highest English and German evaluation scores, ahead of Olmo 3 32B and Apertus 70B. Soofi S was built end-to-end on the German Industrial AI Cloud, a sovereign HPC scale AI infrastructure operated by Deutsche Telekom in Munich. Soofi S will be released under highly permissive, open-access terms: weights, selected intermediate checkpoints, full per-source data accounting, hyperparameters, and training and evaluation code. Where source licenses permit, data-construction artifacts are released under permissive licenses; commercially licensed sources are documented with aggregate statistics and exact mixture accounting.', 'score': 1, 'issue_id': 2808, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'bad154545419c19c', 'github_url': '', 'github_stars': 0, 'authors': ['The Soofi-Team', ':', 'Benedikt Droste', 'David Fitzek', 'Ruben Härle', 'Lukas Helff', 'Maximilian Idahl', 'Alex Jude', 'Abbas Goher Khan', 'Maurice Kraus', 'Timm Ruland', 'Richard Rutmann', 'Sebastian Sztwiertnia', 'Markus Frey', 'Daniil Gurgurov', 'Jan Pfister', 'Tom Röhr', 'Sebastian von Rohrscheidt', 'Jörg Bienert', 'Nicolas Flores-Herr', 'Simon Gottschalk', 'Andreas Hotho', 'Kristian Kersting', 'Joachim Köhler', 'Alexander Löser', 'Wolfgang Nejdl', 'Simon Ostermann', 'Jan Plogsties', 'Patrick Putzky', 'Mehdi Ali', 'Michael Fromm', 'Max Lübbering'], 'affiliations': ['Berliner Hochschule für Technik', 'DFKI', 'Fraunhofer IAIS', 'Fraunhofer IIS', 'KI Bundesverband', 'L3S Research Center', 'Lamarr', 'Merantix Momentum', 'Technische Universität Darmstadt', 'Universität Würzburg', 'ellamind', 'hessian.AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.09424.jpg', 'data': {'categories': ['#multilingual', '#dataset', '#training', '#long_context', '#architecture', '#open_source'], 'emoji': '🌍', 'ru': {'title': 'Soofi S — прорыв в обработке языков!', 'desc': 'В статье представлен Soofi S 30B-A3B, открытая модель смешанных экспертов (MoE), которая предназначена для обработки немецкого и английского языков. Инновационный гибридный дизайн активирует только 3 миллиарда из 30 миллиардов параметров на токен, что обеспечивает высокую производительность при обработке длинного контекста. Модель была предварительно обучена на примерно 27 триллионах токенов, уделяя особое внимание немецкому языку, и показывает отличные результаты как на английских, так и на немецких тестах. Soofi S превосходит другие европейские модели и достигает лучших оценок среди полностью открытых моделей.'}, 'en': {'title': 'Soofi S: The Efficient MoE Model for German and English', 'desc': 'The paper introduces Soofi S 30B-A3B, an open-source Mixture-of-Experts (MoE) model designed for both German and English languages. This model efficiently activates only a portion of its parameters per token, allowing it to maintain high performance even with long contexts. Pretrained on a vast dataset, Soofi S outperforms other models in benchmarks for both languages, achieving top scores among open models. It will be released with comprehensive access to its components, promoting transparency and collaboration in AI development.'}}}, {'id': 'https://huggingface.co/papers/2607.06374', 'title': 'VaseMuseum: Digital Intelligent Museum for Ancient Greek Pottery', 'url': 'https://huggingface.co/papers/2607.06374', 'abstract': 'Abstract  Vision-language models (VLMs) have made interactive digital museums increasingly feasible by connecting 3D digitization with natural-language artifact exploration. However, in cultural heritage domains such as ancient Greek pottery, reliable VLM assistance is limited by two challenges. First, open-ended interpretation requires grounding fine-grained 2D/3D visual evidence in specialized curatorial knowledge, yet the retrieval process may introduce weak sources and unverifiable references. Second, when the available evidence is incomplete, noisy, or ambiguous, VLMs often produce confident but unsupported answers instead of calibrated uncertainty. To address these challenges, we propose VaseMuseum, a lightweight and modular multimodal agent framework for intelligent digital museums of ancient Greek pottery. VaseMuseum combines an interactive virtual museum with VaseAgent, which supports both 2D images and 3D artifacts through multimodal perception, 3D-aware reasoning, external knowledge retrieval, and inference-time reliability control. Specifically, VaseAgent retrieves evidence from authoritative web and museum knowledge sources, and source-level control selects diverse and verifiable evidence before generation. Meanwhile, response-level control checks generated claims against the evidence pool and encourages neutral, evidence-bounded answers when support is insufficient or conflicting. Moreover, a training-free GRPO-style selection mechanism favors responses with valid references and calibrated confidence without updating the VLM backbone. Experiments in a realistic digital museum simulation show that VaseMuseum improves citation validity, reduces hallucinations on knowledge-intensive queries, and produces more neutral answers under ambiguity compared with search-enabled VLM baselines.', 'score': 1, 'issue_id': 2809, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '563456303a12ced0', 'github_url': '', 'github_stars': 0, 'authors': ['Jiazi Wang', 'Nonghai Zhang', 'Qiushi Xie', 'Zeyu Zhang', 'Yufeng Chen', 'Yang Zhao', 'Ling Shao', 'Hao Tang'], 'affiliations': ['Department of Computer Science and Information Technology, La Trobe University, Melbourne VIC 3000, Australia', 'Huazhong University of Science and Technology, Wuhan 430074, China', 'School of Computer Science and Technology, Beijing Jiaotong University, Beijing 100044, China', 'School of Computer Science, Peking University, Beijing 100871, China', 'UCAS-Terminus AI Lab, University of Chinese Academy of Sciences, Beijing 100049, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.06374.jpg', 'data': {'categories': ['#multimodal', '#training', '#retrieval', '#agent_memory', '#inference', '#interpretability', '#hallucinations'], 'emoji': '🏺', 'ru': {'title': 'Интеллектуальные цифровые музеи древнегреческой керамики', 'desc': 'В данной статье рассматривается разработка модели VaseMuseum, предназначенной для цифровых музеев, посвященных древнегреческой керамике. Эта модель решает две основные проблемы: ненадежную интерпретацию визуальных данных и неопределенность в ответах VLM. VaseMuseum использует мультимодальные агенты для взаимодействия с 2D и 3D артефактами и обеспечивает надежный процесс извлечения информации. В экспериментах показано, что система улучшает достоверность цитирования и уменьшает вероятность появления ложной информации.'}, 'en': {'title': 'Enhancing Digital Museums with Reliable Multimodal Agents', 'desc': 'This paper presents VaseMuseum, a multimodal agent framework designed to enhance digital museums focused on ancient Greek pottery. It addresses challenges faced by vision-language models (VLMs) in providing reliable assistance, particularly in grounding visual evidence with specialized knowledge and managing uncertainty in incomplete information. VaseMuseum integrates 2D and 3D artifact perception, external knowledge retrieval, and mechanisms to ensure evidence-based responses. Experimental results demonstrate that VaseMuseum improves the validity of citations, reduces misinformation, and generates more balanced answers in ambiguous situations compared to existing VLMs.'}}}, {'id': 'https://huggingface.co/papers/2607.03118', 'title': 'Vidu S1: A Real-Time Interactive Video Generation Model', 'url': 'https://huggingface.co/papers/2607.03118', 'abstract': 'Abstract Vidu S1 is a real-time interactive video generation model that supports voice-controlled digital character animation with infinite-length output and high frame rate on consumer hardware.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce Vidu S1, a real-time interactive video generation model supporting voice control of digital characters. Users can control video generation content at any moment through voice instructions. Vidu S1 supports infinite-length real-time video generation without blurring, drift, or visual distortion. Built with TurboDiffusion and TurboServe, Vidu S1 outputs 540p real-time videos at up to 42 FPS on regular consumer GPUs. Users can upload custom images of real people, anime, and pets, and choose different voice tones for personalized experiences. Experiments show that Vidu S1 achieves the best performance across all test metrics while fully meeting real-time inference requirements. A playable online demo is available at https://vidu.com/vidu-stream.', 'score': 121, 'issue_id': 2789, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '47790877a22b5feb', 'github_url': '', 'github_stars': 0, 'authors': ['Jintao Zhang', 'Kai Jiang', 'Jintao Chen', 'Xu Wang', 'Yang Luo', 'Yuji Wang', 'Dechuang Chen', 'Jungang Li', 'Chengyang Ye', 'Marco Chen', 'Hongzhou Zhu', 'Min Zhao', 'Yuxuan Jiang', 'Zhengkun Huang', 'Chendong Xiang', 'Kaiwen Zheng', 'Haoxu Wang', 'Xiaohang Wang', 'Qi Jia', 'Xin Chen', 'Yimin Chen', 'Youhe Jiang', 'Fangcheng Fu', 'Zhijie Deng', 'Fan Bao', 'Jianfei Chen', 'Jun Zhu'], 'affiliations': ['Shengshu Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.03118.jpg', 'data': {'categories': ['#inference', '#diffusion', '#audio', '#3d', '#games', '#multimodal'], 'emoji': '🎥', 'ru': {'title': 'Генерация видео в реальном времени с голосовым управлением', 'desc': 'Vidu S1 — это модель генерации видео в реальном времени, которая позволяет анимировать цифровых персонажей при помощи голосового управления. Пользователи могут управлять контентом видео в любое время с помощью голосовых команд. Модель поддерживает бесконечную длину видео без размытия и искажений, обеспечивая высокую частоту кадров. Vidu S1 создает 540p видео в реальном времени на потребительских графических процессорах с качеством, соответствующим самым высоким стандартам.'}, 'en': {'title': 'Voice-Controlled Real-Time Video Generation', 'desc': 'Vidu S1 is a cutting-edge model for generating interactive videos in real-time, allowing users to animate digital characters using voice commands. It can produce videos of any length without losing quality, ensuring smooth visuals without blurring or distortion. The model operates efficiently on standard consumer hardware, delivering 540p videos at up to 42 frames per second. Users can personalize their experience by uploading images and selecting different voice tones for their characters.'}}}, {'id': 'https://huggingface.co/papers/2603.29616', 'title': 'Video-Oasis: Rethinking Evaluation of Video Understanding', 'url': 'https://huggingface.co/papers/2603.29616', 'abstract': 'Abstract Video-Oasis diagnostics reveal that half of existing video benchmarks can be solved without visual input, exposing significant capability gaps in current video understanding models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The inherent complexity of video understanding makes it difficult to determine whether Video-LLM benchmark performance stems from visual perception, linguistic reasoning, or knowledge priors. While many benchmarks have emerged to assess high-level reasoning, shared criteria for evaluating video understanding remain largely overlooked. Instead of introducing yet another benchmark, we take a step back to re-examine the criteria for evaluating video understanding. In this work, we introduce Video-Oasis, a sustainable diagnostic suite for systematically auditing existing video understanding benchmarks. This audit reveals that 55\\% of existing benchmark samples are solvable without visual input or temporal context. After filtering these shortcuts, the remaining video-native challenges expose a substantial capability gap: state-of-the-art models perform only marginally above random guessing. Building on these findings, we use the distilled challenges as a testbed to investigate which algorithmic design choices contribute to robust video understanding. We hope our work provides a practical foundation for constructing rigorous video benchmarks and evaluating future Video-LLMs. Code is available at https://github.com/sejong-rcv/Video-Oasis.', 'score': 51, 'issue_id': 2790, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'b879f81a2b261b24', 'github_url': '', 'github_stars': 0, 'authors': ['Geuntaek Lim', 'Sungjune Park', 'Jaeyun Lee', 'Inwoong Lee', 'Taeoh Kim', 'Dongyoon Wee', 'Minho Shim', 'Yukyung Choi'], 'affiliations': ['NAVER Cloud, South Korea', 'Sejong University, South Korea'], 'pdf_title_img': 'assets/pdf/title_img/2603.29616.jpg', 'data': {'categories': ['#benchmark', '#survey', '#reasoning', '#dataset', '#interpretability'], 'emoji': '🎥', 'ru': {'title': 'Пробелы в понимании видео: время для новых стандартов!', 'desc': 'Статья обсуждает проблему оценки моделей для понимания видео, показывая, что многие существующие бенчмарки могут быть решены без визуального ввода. Авторы вводят новый диагностический набор Video-Oasis, который систематически проверяет текущие бенчмарки и выявляет возможности их улучшения. Выясняется, что 55% образцов могут быть решены без учета визуальной или временной информации. Эти результаты подчеркивают значительные пропуски в текущих моделях видео-LLM и необходимость более строгих критериев оценки.'}, 'en': {'title': 'Bridging the Gap in Video Understanding', 'desc': 'This paper introduces Video-Oasis, a diagnostic tool designed to evaluate existing video understanding benchmarks. The authors found that many benchmarks can be solved without using visual input, indicating a significant gap in the capabilities of current video understanding models. By filtering out these shortcuts, they reveal that state-of-the-art models struggle to perform better than random guessing on genuine video challenges. The study aims to establish a more rigorous framework for assessing video understanding and to guide the development of future Video-LLMs.'}}}, {'id': 'https://huggingface.co/papers/2601.16211', 'title': "Why Can't I Open My Drawer? Mitigating Object-Driven Shortcuts in Zero-Shot Compositional Action Recognition", 'url': 'https://huggingface.co/papers/2601.16211', 'abstract': 'Abstract RCORE addresses object-driven shortcuts in zero-shot compositional action recognition by using co-occurrence prior regularization and temporal order regularization to improve compositional generalization.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Zero-Shot Compositional Action Recognition (ZS-CAR) requires recognizing novel verb-object combinations composed of previously observed primitives. In this work, we tackle a key failure mode: models predict ve
