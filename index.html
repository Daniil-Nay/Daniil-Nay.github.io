    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');
                    currentLang = flag.dataset.lang;
                    localStorage.setItem('selectedLang', currentLang);
                    updateTimeDiffs();
                    updateLocalization();
                    filterAndRenderArticles();
                });
            });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.20145', 'title': 'SLAI T-Rex: Full-Parameter Post-training of the DeepSeek-V4 Family on Ascend SuperPOD', 'url': 'https://huggingface.co/papers/2607.20145', 'abstract': 'Abstract  Full-parameter post-training of trillion-parameter-scale MoE models introduces substantial system-level challenges for large-scale distributed training, including severe memory pressure, non-overlapped communication overhead, and inefficient kernel execution. While most large-scale LLM training systems are built around GPU-based clusters, this report presents an end-to-end optimization practice on the Ascend NPU SuperPOD. Using the DeepSeek-V4 model family as the target workload, we develop a hierarchical optimization framework spanning model-level parallelism, computation-communication orchestration, and low-level kernel execution. The resulting system achieves 34.22% Model FLOPs Utilization (MFU) with a 2.93x improvement over the open-source baseline recipe while maintaining training stability. Building on this optimized infrastructure, we further establish a CPT and SFT workflow for complex Operations Research (OR) tasks. We refer to the integrated framework as SLAI T-Rex. Using DeepSeek-V4-Flash, we develop OR-oriented CPT and SFT data pipelines that combine collected domain resources with solver-verified synthetic optimization documents. The resulting dataset contains 10K high-quality SFT samples spanning four task categories and three problem representations. The specialized model achieves the highest average zero-shot Pass@1 score among the evaluated models, reaching 71.81% and outperforming GPT-5.4-Mini and the base DeepSeek-V4-Flash model by 3.98 and 11.27 percentage points, respectively. Overall, this work demonstrates a full-stack pathway from efficient trillion-parameter model post-training on Ascend infra to domain-specialized Flash models for solver-grounded mathematical modeling, advancing frontier-model systems for complex reasoning.', 'score': 28, 'issue_id': 2883, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'bc7808635b7611bf', 'github_url': '', 'github_stars': 0, 'authors': ['Dongfang Li', 'Xiaodong Luo', 'Ruoyu Sun', 'Xuhui Chen', 'Linyuan Qiu', 'Jian Meng', 'Zhengxuan Lu', 'Yiting Wang', 'Yucheng Xie', 'Tao Guo', 'Tianxiang Fang', 'Jing Li', 'Sihang Chen', 'Shihao Hong', 'Chang Liu', 'Weihua Dai', 'Zirong Zeng', 'Ziwei Zhu', 'Zhuohan Wang', 'Zhengjun Yue', 'Igor Vasilyev', 'Min Liu', 'Weijian Sun', 'Xin Chen', 'Yingmeng Gao', 'Jinhua Zhou', 'Taolue Chen', 'Chenwei Wu', 'Dong Zhang', 'Wenlong Jin', 'Jinmin Xiang', 'Barkova Maria', 'Ushakov Anton', 'Xianfei Jin', 'Tian Ding', 'Zhihang Lin', 'Qian Chen', 'Linxin Yang', 'Mingzhe Yang', 'Bingwei Zhang', 'Hongzhang Yang', 'Fangxue Zhang', 'Shijun Qin', 'Jie Yu', 'Cuihua Hu', 'Tolstykh Vasiliy', 'Nosov Ivan', 'Abdullin Amir', 'Zhichen Zhou', 'Xin Zhang', 'Zhixiong Ning', 'Xutong Zhao', 'Junjie Huang', 'Jiajun Liu', 'Weiyan Kong', 'Zheng Zhang', 'Wenhan Luo', 'Lin Hu', 'Yangbo Guo', 'Li Zeng', 'Shihao Zeng', 'Baotian Hu', 'Min Zhang', 'Haizhou Li', 'Zhiquan Luo'], 'affiliations': ['Shenzhen Loop Area Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.20145.jpg', 'data': {'categories': ['#dataset', '#continual_learning', '#optimization', '#math', '#synthetic', '#training', '#reasoning', '#inference'], 'emoji': '🚀', 'ru': {'title': 'Эффективная тренировка триллионных моделей для сложного размышления', 'desc': 'В данной работе рассматриваются проблемы, связанные с пост-тренировкой моделей MoE на триллионных параметрах. Авторы разработали иерархическую оптимизационную структуру для повышения эффективности распределенного обучения на NPU, что позволяет значительно улучшить использование вычислительных ресурсов. Применение системы SLAI T-Rex в задачах Операционных Исследований позволяет создавать высококачественные наборы данных и тренировать специализированные модели. Итоговые результаты показывают, что новый подход обеспечивает лучшие показатели точности по сравнению с существующими моделями.'}, 'en': {'title': 'Optimizing Trillion-Parameter Models for Complex Reasoning', 'desc': 'This paper addresses the challenges of training trillion-parameter MoE models, focusing on memory pressure and communication inefficiencies. It introduces an optimization framework for the Ascend NPU SuperPOD, achieving significant improvements in Model FLOPs Utilization. The framework supports complex Operations Research tasks through a specialized data pipeline, resulting in high-quality training samples. The optimized model outperforms existing models, showcasing advancements in reasoning capabilities for large-scale machine learning systems.'}}}, {'id': 'https://huggingface.co/papers/2607.20368', 'title': 'Self Gradient Forcing: Native Long Video Extrapolation', 'url': 'https://huggingface.co/papers/2607.20368', 'abstract': 'Abstract  Recent autoregressive video diffusion methods are increasingly built upon Self Forcing, where the student is trained on histories produced by its own rollout rather than ground-truth video contexts. This reduces exposure bias, but the historical key-value cache is still used by future frames only as frozen rollout state. As a result, future losses cannot supervise how earlier generated latents should be written into more useful keys and values for later video-latent generation. We call this the historical context-gradient gap. We propose Self Gradient Forcing (SGF), a two-pass training strategy that restores this missing supervision signal without backpropagating through the full serial rollout. Pass 1 performs a no-gradient autoregressive rollout matching inference and, at a sampled denoising exit step, records both the self-generated context and the noisy latents fed to the model. Pass 2 performs parallel context-gradient reconstruction for the recorded exit step. The generated context is used as stop-gradient clean-latent input, while the model recomputes the context KV representations and future-to-context causal attention. Thus, SGF provides the missing memory-writing supervision within the native autoregressive training objective, using losses on future video latents to train the model to encode context into more effective causal memory. Across extensive long-horizon frame-wise and chunk-wise experiments under different initializations, SGF achieves stronger native long-video extrapolation than Self Forcing, especially in subject identity, background/layout consistency, and temporal stability. Remarkably, using only a 5-second training window, SGF can extrapolate to videos lasting several minutes. Code and models will be released to advance research on autoregressive video generation.', 'score': 19, 'issue_id': 2884, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'ddf5613f128c3fe8', 'github_url': '', 'github_stars': 0, 'authors': ['Junhao Zhuang', 'Shiyi Zhang', 'Yuxuan Bian', 'Yaowei Li', 'Yawen Luo', 'Yijun Liu', 'Weiyang Jin', 'Songchun Zhang', 'Xianglong He', 'Xuying Zhang', 'Haoran Li', 'Haoyang Huang', 'Zeyue Xue', 'Nan Duan'], 'affiliations': ['Joy Future Academy, JD'], 'pdf_title_img': 'assets/pdf/title_img/2607.20368.jpg', 'data': {'categories': ['#training', '#diffusion', '#optimization', '#open_source', '#agent_memory', '#long_context', '#memory'], 'emoji': '🎥', 'ru': {'title': 'Улучшение генерации видео с помощью Self Gradient Forcing', 'desc': 'В данной статье рассматриваются методы диффузии видео на основе автогрессии с использованием концепции Self Forcing. Авторы предлагают новый подход под названием Self Gradient Forcing (SGF), который улучшает обучение, устраняя недостаток в сигнале супервизии, связанный с историческим градиентом контекста. SGF позволяет более эффективно записывать контекст в память при создании видео, что улучшает качество генерации. В результате, метод SGF демонстрирует лучшие результаты в экстраполяции видео продолжительностью до нескольких минут с использованием всего 5-секундного окна обучения.'}, 'en': {'title': 'Enhancing Video Generation with Self Gradient Forcing', 'desc': 'This paper introduces Self Gradient Forcing (SGF), a new training method for autoregressive video generation that addresses the historical context-gradient gap. SGF enhances the training process by allowing the model to learn from its own generated context without needing to backpropagate through the entire video sequence. The method consists of two passes: the first generates video frames while recording key information, and the second reconstructs context to improve future frame generation. Experiments show that SGF outperforms previous methods, achieving better consistency and stability in long videos with minimal training data.'}}}, {'id': 'https://huggingface.co/papers/2607.19747', 'title': 'Beyond Relevance-Centric Retrieval: Rubric-Oriented Document Set Selection and Ranking', 'url': 'https://huggingface.co/papers/2607.19747', 'abstract': 'Abstract  As large language models and AI agents become the primary consumers of search results, document set quality determines the upper bound of downstream generation. Yet existing evaluation systems remain confined to scoring documents independently and aggregating via nDCG, ignoring inter-document interactions (redundancy, conflict, complementarity) and unable to answer what makes one document set better than another. To address these issues, we propose a complete evaluate-diagnose-optimize framework. We design SetwiseEvalKit, a three-level, nine-dimension document set evaluation benchmark covering both short-form and long-form scenarios, comprising approximately 28K high-quality evaluation rubrics. We systematically evaluate 12 rerankers: even the best method achieves no more than 45% coverage, cross-document coordination dimensions are universally weak, and no single method maintains top performance across both settings. Building on this, we propose Rubric4Setwise, a training-free method that converts rubric-based evaluation criteria into document set selection signals, achieving the best downstream generation performance with fewer documents and search rounds. It is the only method that maintains state-of-the-art results across both scenarios, validating the effectiveness of closing the loop from evaluation to optimization.', 'score': 4, 'issue_id': 2884, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'afa8ec3af1011b9f', 'github_url': '', 'github_stars': 0, 'authors': ['Kailin Jiang', 'Lei Liu', 'Jian Xi', 'Hui Xu', 'Junlin Liu', 'Baochen Fu', 'Shaoqing Ren', 'Bin Li', 'Vichwang', 'Yu Lu', 'Haibo Shi'], 'affiliations': ['Shandong University', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China', 'Yuanbao Team, Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2607.19747.jpg', 'data': {'categories': ['#retrieval_eval', '#optimization', '#benchmark', '#evaluation'], 'emoji': '📄', 'ru': {'title': 'Оптимизация оценки наборов документов для ИИ', 'desc': 'В статье рассматривается влияние качества наборов документов на эффективность генерации с использованием больших языковых моделей и агентов ИИ. Авторы предлагают новую структуру для оценки, диагностики и оптимизации наборов документов, включая систему SetwiseEvalKit с около 28 тысячами оценочных критериев. Проведенные эксперименты показывают, что существующие методы повторной сортировки не достигают высоких результатов в оценке взаимодействия между документами. В качестве решения предлагается метод Rubric4Setwise, который преобразует оценочные критерии в сигналы для выбора наборов документов, достигая наилучших результатов генерации при меньших объемах данных.'}, 'en': {'title': 'Revolutionizing Document Set Evaluation for AI', 'desc': 'This paper addresses the limitations of current document set evaluation methods in machine learning, particularly for large language models and AI agents. It introduces a new framework called SetwiseEvalKit, which evaluates document sets based on inter-document interactions and provides a comprehensive benchmark with 28K evaluation rubrics. The authors evaluate various reranking methods and find that existing techniques struggle with cross-document coordination. They propose Rubric4Setwise, a novel approach that translates evaluation criteria into effective document selection signals, achieving superior performance in generating results with fewer documents.'}}}, {'id': 'https://huggingface.co/papers/2607.16165', 'title': 'An Exam for Active Observers', 'url': 'https://huggingface.co/papers/2607.16165', 'abstract': "Abstract  Human vision is a closed loop: gaze is continuously redirected by intermediate hypotheses rather than a single snapshot. Decades of psychophysics and cognitive science have argued that this active observation is essential for a wide range of tasks. Whether today's multimodal large language models (MLLMs) exercise active observation is an empirical question that current vision-language benchmarks do not answer. We introduce ActiveVision, a benchmark that makes active observation measurable for MLLMs, comprising 17 tasks across 3 categories. Tasks are designed to force repeated visual perception rather than a single static description. Frontier MLLMs collapse on ActiveVision: the highest-scoring model we evaluate, GPT-5.5 at the highest exposed reasoning-effort tier, solves only 10.6% of items and scores zero on 11 of the 17 tasks, and even Claude Fable 5, despite topping most reasoning and coding leaderboards, solves just 3.5%, far behind three human participants who average 96.1%. Furthermore, much of the gap persists even when models write and run their own vision code: such code is unreliable on realistic imagery, and catching its failures itself requires the active perception the models lack. Together, these results indicate that current MLLMs lack robust active visual observation, motivating architectures and training objectives that close the perception-reasoning loop.", 'score': 4, 'issue_id': 2884, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '93b4c215b5567e95', 'github_url': '', 'github_stars': 0, 'authors': ['Jiarui Zhang', 'Muzi Tao', 'Shangshang Wang', 'Ollie Liu', 'Xuezhe Ma', 'Willie Neiswanger'], 'affiliations': ['University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2607.16165.jpg', 'data': {'categories': ['#multimodal', '#training', '#benchmark', '#architecture', '#interpretability', '#reasoning'], 'emoji': '👁️', 'ru': {'title': 'Обнаружение недостатков в активном восприятии мультимодальных моделей', 'desc': 'В данной статье обсуждается, как современные мультимодальные большие языковые модели (MLLM) осуществляют активное наблюдение, которое является важным аспектом человеческого зрения. Исследователи предлагают новый бенчмарк под названием ActiveVision, позволяющий измерить активное наблюдение, который включает 17 задач в 3 категориях. Текущие модели не справляются с задачами ActiveVision, что указывает на недостатки их способности к активному восприятию. Результаты показывают, что MLLM требуют доработки архитектуры и целей обучения для улучшения процесса восприятия и рассуждения.'}, 'en': {'title': 'Bridging the Gap: Enhancing MLLMs with Active Visual Observation', 'desc': 'This paper explores the concept of active observation in human vision and its implications for multimodal large language models (MLLMs). It introduces ActiveVision, a benchmark designed to measure how well MLLMs can perform tasks that require repeated visual perception rather than relying on a single static view. The results show that leading MLLMs, including GPT-5.5 and Claude Fable 5, struggle significantly with these tasks, achieving low success rates compared to human participants. The findings suggest that current MLLMs do not effectively incorporate active visual observation, highlighting the need for new architectures and training methods to enhance their perception-reasoning capabilities.'}}}, {'id': 'https://huggingface.co/papers/2607.10169', 'title': 'Beyond Euclidean Clipping: Overcoming Exploration Collapse in LLM RL via Riemannian Isometric Policy Optimization', 'url': 'https://huggingface.co/papers/2607.10169', 'abstract': "Abstract  Reinforcement learning (RL) has become a dominant paradigm for enhancing LLMs' reasoning capabilities. However, RL algorithms with PPO-Clip are inherently limited by exploration collapse. Subsequent works remain primarily heuristic and fail to identify the essential cause of PPO-Clip's failure. This work reveals the fundamental flaw of PPO-Clip: it implicitly measures policy discrepancy using Euclidean metric, which is theoretically inconsistent with the intrinsic geometry on the policy Riemannian manifold. This geometric mismatch results in overly conservative updates in low-probability regions while aggressive in high-probability regions, ultimately collapsing exploration. To correct this geometric flaw, we propose Riemannian Isometric Policy Optimization (RIPO), which guarantees isometric policy updates on the Riemannian manifold, effectively balancing exploration and exploitation. We further show that RIPO achieves a favorable bias-variance trade-off, which stabilizes optimization. Extensive experiments demonstrate that RIPO significantly surpasses existing LLM RL algorithms across seven competition-level benchmarks (up to 60% improvement over GRPO on AIME24).", 'score': 4, 'issue_id': 2884, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '31eb03acae9ac278', 'github_url': '', 'github_stars': 0, 'authors': ['Zhicheng Cai', 'Xinyuan Guo', 'Hanlin Wu', 'Mingxuan Wang', 'Wei-Ying Ma', 'Ya-Qin Zhang', 'Hao Zhou'], 'affiliations': ['ByteDance Seed', 'Institute for AI Industry Research (AIR), Tsinghua University', 'SIA-Lab of Tsinghua AIR and ByteDance Seed'], 'pdf_title_img': 'assets/pdf/title_img/2607.10169.jpg', 'data': {'categories': ['#training', '#rl', '#benchmark', '#optimization', '#rlhf', '#reasoning'], 'emoji': '🎮', 'ru': {'title': 'Оптимизация политики с учетом геометрии', 'desc': 'В данной статье рассматриваются ограничения алгоритмов обучения с подкреплением (RL) на основе метода PPO-Clip, которые могут приводить к исчезновению исследований. Основная причина неэффективности заключается в том, что PPO-Clip использует евклидMetric для измерения различий в политике, что несовместимо с геометрией римановой многообразия. В результате этого возникает избыточная консервативность обновлений в областях с низкой вероятностью. Авторы предлагают метод Riemannian Isometric Policy Optimization (RIPO), который обеспечивает изометрические обновления политики и улучшает баланс между исследованием и эксплуатацией.'}, 'en': {'title': 'RIPO: Balancing Exploration and Exploitation in RL for LLMs', 'desc': "This paper addresses the limitations of reinforcement learning (RL) algorithms, specifically PPO-Clip, in enhancing the reasoning capabilities of large language models (LLMs). It identifies a fundamental flaw in PPO-Clip's approach to measuring policy discrepancy, which leads to ineffective exploration strategies. The authors propose a new method called Riemannian Isometric Policy Optimization (RIPO) that corrects this flaw by ensuring policy updates are consistent with the geometry of the policy space. RIPO not only stabilizes optimization but also significantly improves performance on various benchmarks compared to existing RL algorithms."}}}, {'id': 'https://huggingface.co/papers/2607.13429', 'title': 'Generalizable VLA Finetuning via Representation Anchoring and Language-Action Alignment', 'url': 'https://huggingface.co/papers/2607.13429', 'abstract': 'Abstract  Finetuning a pretrained vision-language model (VLM) on robot demonstrations via behavior cloning (BC) has become the standard recipe for vision-language-action (VLA) policies. However, BC finetuning progressively overwrites the pretrained representations that support visual and semantic generalization. Co-training on web image-text data, a common remedy, does not prevent this; it applies language and action losses to separate observations, leaving VLAs with language-action misalignment that standard manipulation benchmarks do not expose. We propose Anchor-Align, which augments BC with two objectives: Vision-Language Anchoring distills layer-wise representations from a frozen VLM copy to prevent this drift, while Language-Action Alignment converts each action target into a discrete motion-direction label and jointly trains language and action prediction on the same robot observation. On a physical xArm7 robot, across two widely used VLA architectures, Anchor-Align improves real-robot success on both (28% to 54% and 37% to 60%). At scale in simulation, we demonstrate consistent improvements on OOD perturbations, perceptual robustness, and long-horizon control across LIBERO-PRO, LIBERO-Plus, and CALVIN, respectively, suggesting that preserving pretrained representations and effective action learning are not fundamentally at odds. Project page: anchoralignvla.github.io', 'score': 3, 'issue_id': 2884, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '4871e1e4a56a25da', 'github_url': '', 'github_stars': 0, 'authors': ['Dwip Dalal', 'Shivansh Patel', 'Chahit Jain', 'Jeonghwan Kim', 'Utkarsh Mishra', 'Alex Baratian', 'Hyeonjeong Ha', 'Heng Ji', 'Svetlana Lazebnik', 'Unnat Jain'], 'affiliations': ['Texas A&M University', 'University of California, Irvine', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2607.13429.jpg', 'data': {'categories': ['#agi', '#training', '#optimization', '#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Новая эра взаимодействия: улучшение робототехники через Anchor-Align', 'desc': 'Статья предлагает метод Anchor-Align для улучшения работы модели, связывающей визуальные и языковые данные с действиями робота. Этот подход предотвращает ухудшение предварительно обученных представлений, которое наблюдается при использовании традиционного обучения на демонстрациях робота. Anchor-Align использует две цели: якорную привязку визуально-языковых данных и согласование языковых действий, что позволяет совместно обучать предсказание действий и языка. В результате на физическом роботе xArm7 наблюдаются значительные улучшения в успехе выполнения задач.'}, 'en': {'title': 'Aligning Vision and Action for Better Robot Learning', 'desc': 'This paper introduces Anchor-Align, a method to improve the finetuning of vision-language models (VLMs) for robot demonstrations using behavior cloning (BC). The authors highlight that traditional BC can overwrite important pretrained representations, leading to misalignment between language and actions. Anchor-Align addresses this by using Vision-Language Anchoring to maintain layer-wise representations and Language-Action Alignment to train language and action predictions together. The results show significant improvements in real-robot success rates and robustness in various scenarios, indicating that effective action learning can coexist with preserving pretrained knowledge.'}}}, {'id': 'https://huggingface.co/papers/2607.19790', 'title': 'Trace: A Taxonomy-Guided Environment for Multidomain Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.19790', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) has substantially improved language-model reasoning, yet its extension to vision-language models remains constrained by the lack of training data that are simultaneously broad, exactly verifiable, and reproducible. We introduce Trace, a taxonomy-guided environment for multidomain visual reasoning. Trace factorizes task construction into a scene grammar and an executable task program, separating visual realization from answer computation. A shared semantic state determines the rendered image, prompt, typed answer, verifier state, and replayable instance trace. The resulting environment comprises 1,000 tasks over 277 scene grammars and 11 visual domains, with controlled semantic and visual variation. RLVR on 64,000 Trace instances improves the macro-average across 24 external benchmarks by 3.51 percentage points for Qwen2.5-VL-3B and 4.06 points for Qwen2.5-VL-7B, providing evidence that broad procedural training can transfer beyond the generated task distributions. Project page: https://maveryn.github.io/trace/.', 'score': 2, 'issue_id': 2884, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '9494143857512c8c', 'github_url': '', 'github_stars': 0, 'authors': ['Md Tanvirul Alam'], 'affiliations': ['Rochester Institute of Technology, Rochester, NY, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.19790.jpg', 'data': {'categories': ['#rl', '#transfer_learning', '#benchmark', '#dataset', '#reasoning'], 'emoji': '🖼️', 'ru': {'title': 'Новая эволюция визуального рассуждения', 'desc': 'В данной статье представлено новое окружение для многодоменного визуального рассуждения, называемое Trace. Оно разделяет построение задач на грамматику сцен и исполняемую программу задач, что позволяет отделить визуализацию от вычисления ответов. Окружение включает 1000 задач, основанных на 277 грамматиках сцен и 11 визуальных доменах, с контролируемыми семантическими и визуальными вариациями. Использование RLVR на 64,000 экземплярах Trace улучшает результаты на 24 внешних бенчмарках для моделей Qwen2.5-VL-3B и Qwen2.5-VL-7B.'}, 'en': {'title': 'Enhancing Visual Reasoning with Trace: A New Approach', 'desc': 'This paper presents Trace, a new environment designed for improving visual reasoning in language models using reinforcement learning with verifiable rewards (RLVR). Trace organizes tasks using a scene grammar and an executable task program, which helps separate how images are created from how answers are computed. The environment includes 1,000 tasks across various visual domains, allowing for controlled variations in both semantics and visuals. The results show that training on Trace significantly enhances performance on external benchmarks for language models, demonstrating the effectiveness of broad procedural training.'}}}, {'id': 'https://huggingface.co/papers/2607.16190', 'title': 'FVAttn: Adaptive Sparse Attention with Runtime Load Balancing for Video Generation', 'url': 'https://huggingface.co/papers/2607.16190', 'abstract': 'Abstract  Video Diffusion Transformers process long spatio-temporal sequences, making self-attention the main bottleneck in high-resolution video generation. Training-free sparse attention reduces this cost, but adaptive Top-p routing creates uneven per-head workloads under multi-GPU sequence parallelism. The resulting workload heterogeneity turns sparse attention into a rank-level straggler problem. We present , a training-free sparse-attention system that improves the distributed execution efficiency of adaptive sparse attention under multi-GPU sequence parallelism.  uses Top-p routing, a Top-k safety floor, and video-aware block organization as the sparse-routing frontend, then repairs the materialized mask at runtime. Runtime Load Balancing migrates a small number of heavy heads via P2P communication to shorten the current critical path. Slack-Aware Sparse Augmentation fills residual non-critical-rank slack with additional high-value blocks, while overlap hides scheduling and migration overhead behind existing computation. On step-distilled Wan2.2 I2V,  reduces average load imbalance from 1.34 to 1.08 and delivers a 4.41times attention speedup over FlashAttention, while achieving a 2.02--2.11times DiT inference speedup with competitive video quality.', 'score': 2, 'issue_id': 2884, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'd5b70ab333257c89', 'github_url': '', 'github_stars': 0, 'authors': ['Hao Liu', 'Chenghuan Huang', 'Ye Huang', 'Zhiying Wen', 'Hao Liu', 'Mohan Zhang', 'Chen Li', 'Ziyang Ma', 'Jing Lyu', 'Jiangsu Du'], 'affiliations': ['Peking University', 'Sun Yat-sen University', 'WeChat HPC, Tencent Inc.', 'WeChat Vision, Tencent Inc.'], 'pdf_title_img': 'assets/pdf/title_img/2607.16190.jpg', 'data': {'categories': ['#training', '#inference', '#optimization', '#architecture', '#diffusion'], 'emoji': '🎥', 'ru': {'title': 'Эффективное воспроизведение видео с помощью Sparse-Attention', 'desc': 'Статья обсуждает систему Sparse-Attention для эффективной генерации видео, которая использует адаптивное маршрутизирование Top-p. Данная система уменьшает неравномерность нагрузки при работе с многими графическими процессорами, что является проблемой для высокоразрешенных видео. Также внедряются механизмы сбалансировки нагрузки и выделения ресурсов для ускорения вычислений. В результате достигается значительное улучшение скорости обработки с конкурентным качеством видео.'}, 'en': {'title': 'Boosting Video Generation Efficiency with Sparse Attention', 'desc': 'This paper introduces a new system for improving the efficiency of sparse attention in video generation using multi-GPU setups. It addresses the issue of uneven workloads caused by adaptive Top-p routing, which can lead to delays in processing. The proposed method includes techniques like runtime load balancing and slack-aware sparse augmentation to optimize performance. As a result, the system achieves significant speedups in attention processing while maintaining high video quality.'}}}, {'id': 'https://huggingface.co/papers/2607.19691', 'title': 'SLPO: Scaling Latent Reasoning via a Surrogate Policy', 'url': 'https://huggingface.co/papers/2607.19691', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards has become the predominant recipe for eliciting test-time scaling in explicit Chain-of-Thought reasoners. Yet this scaling path remains computationally costly, since every intermediate step must be decoded as a language token. Latent reasoning instead carries intermediate computation as continuous vectors and already matches or surpasses explicit CoT at far shorter horizons. Despite this promise, latent reasoners remain largely imitation-bound, while explicit CoT has already moved past imitation via outcome-reward RL. Latent trajectories lack a tractable per-step likelihood and an adaptive stopping interface under fixed thinking budgets, so outcome rewards cannot elicit latent test-time scaling. We introduce Surrogate Latent Policy Optimization (SLPO) to bring outcome-reward RL to autoregressive latent reasoners: an empirical surrogate policy density over latent transitions for trajectory-level credit assignment, and a correctness-supervised stopping head that outcome-reward optimization refines into a variable-horizon policy. Across continuous and soft thinking settings, SLPO improves Pass@k under parallel sampling and allocates longer latent computation to harder instances with higher deterministic accuracy.', 'score': 1, 'issue_id': 2883, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '9a63b0bf74a588d4', 'github_url': '', 'github_stars': 0, 'authors': ['Runyang You', 'Zhiyuan Liu', 'Yongqi Li', 'Wenjie Li'], 'affiliations': ['Sichuan University', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2607.19691.jpg', 'data': {'categories': ['#rlhf', '#rl', '#optimization', '#training', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Оптимизация скрытых моделей для повышения точности!', 'desc': 'В данной статье обсуждается использование обучения с подкреплением (RL) с проверяемыми наградами для улучшения работы систем, основанных на цепочках размышлений (CoT). Авторы предлагают новый подход под названием Surrogate Latent Policy Optimization (SLPO), который позволяет использовать награды за результаты для управления скрытыми расследованиями. Это решение помогает сократить вычислительные затраты и улучшить точность моделей. В результате, SLPO демонстрирует лучшие результаты по сравнению с традиционными методами на задачах с различной сложностью.'}, 'en': {'title': 'Optimizing Latent Reasoning with Surrogate Policies', 'desc': 'This paper presents Surrogate Latent Policy Optimization (SLPO), a method that enhances reinforcement learning for latent reasoning models. Unlike traditional Chain-of-Thought (CoT) approaches that require decoding each step as a language token, SLPO uses continuous vectors for intermediate computations, making it more efficient. The method introduces a surrogate policy for better credit assignment and a stopping mechanism that adapts based on the complexity of the task. As a result, SLPO achieves improved performance in generating accurate outputs while managing computational resources effectively.'}}}, {'id': 'https://huggingface.co/papers/2607.20379', 'title': 'Train the Model, Not the Reader: Decodability Supervision for Verifiable Activation Explanations', 'url': 'https://huggingface.co/papers/2607.20379', 'abstract': "Abstract  Natural-language autoencoders score explanations of hidden activations by reconstruction: an explanation is deemed faithful if the activation can be regenerated from it. The test is structurally insensitive to individual false claims: if flipping a claim does not change the reconstruction, the claim is never penalized. We show the test is passed in two ways, neither faithful. On a released Qwen-2.5-7B verbalizer, explanations reconstruct well above chance while ~2% of specific claims are reconstruction-dependent, so the score tracks gist, not specific facts. Under exact synthetic ground truth, the standard recipe develops co-adapted private codes (false wording the reconstruction depends on) in 5/5 runs, and fixes that leave the target model unchanged do not help. We contribute two audit protocols, the grounded-vs-true cross and the evaluator swap, and RECAP (Readable Encodings via Co-trained Auxiliary Predictors): linear heads trained alongside the target model to keep designated content decodable. On RECAP-trained sandbox models, fresh verbalizers state the designated content truly and the codes vanish, at a +0.001-nat cost. This replicates on a pretrained Pythia-160M: the content becomes reliably probe-decodable, though a fresh verbalizer conveys it only in part (truth 0.44-0.46 vs a near-zero control). For interpretability, high reconstruction does not certify individual claims. For AI safety, RECAP makes designated internal content independently checkable against probes rather than asserted by prose a model can game: an independent probe scores the verbalizer's true claims above its false ones (AUC 0.96, vs 0.82 without RECAP). Against an adversary that edits an explanation to maximize the reconstruction score while lying (suppressing ~87% of its lie penalty), the RECAP probe still flags the lies (AUC 0.95) while the control probe collapses to chance (0.51).", 'score': 0, 'issue_id': 2884, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'efa55585842de96c', 'github_url': '', 'github_stars': 0, 'authors': ['Hiskias Dingeto'], 'affiliations': ['StackOne Technologies'], 'pdf_title_img': 'assets/pdf/title_img/2607.20379.jpg', 'data': {'categories': ['#training', '#inference', '#data', '#hallucinations', '#interpretability', '#ethics', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Объяснения в автоэнкодерах: истинность под угрозой', 'desc': 'В данной статье рассматривается использование автоэнкодеров на естественном языке для оценки объяснений скрытых активаций через реконструкцию. Объяснение считается достоверным, если активация может быть восстановлена из него. Однако, исследование показывает, что данный тест не всегда выявляет недостоверные утверждения, и большинство из них не штрафуется. Для повышения интерпретируемости и безопасности ИИ предложены новые протоколы аудита и метод RECAP, позволяющий независимо проверять внутреннее содержимое модели.'}, 'en': {'title': 'Enhancing AI Interpretability and Safety with RECAP', 'desc': 'This paper discusses the limitations of natural-language autoencoders in providing faithful explanations of hidden activations through reconstruction. It reveals that the current scoring method can overlook inaccuracies in individual claims, as it focuses on the overall gist rather than specific details. The authors introduce two new audit protocols and a method called RECAP, which improves the decodability of designated content while maintaining model integrity. Ultimately, RECAP enhances interpretability and AI safety by allowing independent verification of internal content against probes, effectively identifying false claims.'}}}, {'id': 'https://huggingface.co/papers/2607.19942', 'title': 'G-MAD: A Game-Based Data Generation Framework for Multi-View RGB-T Aerial Object Detection', 'url': 'https://huggingface.co/papers/2607.19942', 'abstract': 'Abstract  This work introduces G-MAD, an open-source framework that uses Arma3 to generate synchronized multi-view RGB-T data for aerial object detection. G-MAD addresses key limitations of real-world aerial dataset construction, including limited viewpoint control, imperfect RGB-T alignment and high annotation cost. The framework supports structured scenario specification, controllable multi-view camera placement, simultaneous visible/thermal capture, and automatic bounding box annotation using engine-level geometric metadata. These capabilities enable controlled studies of viewpoint variation, multi-modal fusion, and synthetic-to-real transfer in aerial object detection. Besides, using G-MAD, we construct and release AMOD, a new large-scale multi-view aerial RGB-T object detection benchmark. The source code and the dataset are available at https://unique-chan.github.io/G-MAD-Project.', 'score': 0, 'issue_id': 2883, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'c22e769cf0337a14', 'github_url': '', 'github_stars': 0, 'authors': ['Yechan Kim', 'JongHyun Park', 'Dongho Yoon', 'Namhoon Jung', 'Moongu Jeon'], 'affiliations': ['GIST Republic of Korea', 'LIG Defense&Aerospace Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.19942.jpg', 'data': {'categories': ['#dataset', '#transfer_learning', '#synthetic', '#open_source', '#benchmark'], 'emoji': '🛩️', 'ru': {'title': 'G-MAD: новый подход к аэродинамическому обнаружению объектов', 'desc': 'В данной работе представлен G-MAD, открытый фреймворк, который использует Arma3 для генерации синхронизированных многовидовых RGB-T данных для аэродинамического обнаружения объектов. G-MAD решает ключевые проблемы создания реальных аэродинамических наборов данных, такие как ограниченный контроль за точками зрения и высокая стоимость аннотирования. Фреймворк поддерживает спецификацию сценариев, контролируемое размещение камер и автоматическую аннотацию ограничивающих рамок. Используя G-MAD, мы также создали и выпустили AMOD, новый масштабный эталон для обнаружения объектов в многовидовом аэродинамическом RGB-T.'}, 'en': {'title': 'G-MAD: Revolutionizing Aerial Object Detection with Multi-View Data', 'desc': 'This paper presents G-MAD, an open-source framework designed for generating synchronized multi-view RGB-T data to improve aerial object detection. It overcomes challenges in creating real-world datasets, such as controlling viewpoints, aligning RGB and thermal images, and reducing annotation costs. G-MAD allows for structured scenario creation, precise camera placement, and automatic bounding box annotations using geometric data. Additionally, it introduces AMOD, a new large-scale benchmark for multi-view aerial RGB-T object detection, enhancing research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.20207', 'title': 'SeededGrasp: Language-Guided Grasping in Complex Scenes with Multiple Embodiments', 'url': 'https://huggingface.co/papers/2607.20207', 'abstract': 'Abstract  Practical robotic grasping in complex scenes requires both 3D spatial reasoning and alignment with task-specific requirements. Vision-language models (VLMs) offer a natural way to specify these requirements using language, but existing approaches either use a VLM to predict the grasp directly with limited spatial awareness, or train the VLM together with the grasping model, which requires significantly more data and compute. These limitations impede performance and have prevented scaling to multiple embodiments in complex scenes. We address this by proposing SeededGrasp, a novel data-efficient framework that enables a VLM to predict a seed point to be used as conditioning for a subsequent lightweight grasp-generation model. Our architecture decouples high-level semantic reasoning from low-level geometric execution, enabling multi-embodiment support while bypassing the need for expensive end-to-end training. To enable training such models, we release the first multi-embodiment tabletop grasping dataset comprising over 2.5M grasps in cluttered scenes. Experimental results demonstrate that our approach outperforms existing baselines, achieving 72% success in simulation and 78% in real-world grasping experiments. See our project site for data and code: https://uoft-isl.github.io/seeded-grasp/', 'score': 0, 'issue_id': 2883, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '5cb9b4ddfac1bcee', 'github_url': '', 'github_stars': 0, 'authors': ['Yang Xu', 'Gurpreet Singh Mukker', 'Raymond Wang', 'Jasper Gerigk', 'Maria Attarian', 'Igor Gilitschenski'], 'affiliations': ['Google Deepmind', 'University of British Columbia', 'University of Toronto', 'Vector Institute'], 'pdf_title_img': 'assets/pdf/title_img/2607.20207.jpg', 'data': {'categories': ['#architecture', '#agents', '#alignment', '#dataset', '#robotics', '#open_source', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Эффективный захват объектов с SeededGrasp', 'desc': 'В статье представлена новая схема SeededGrasp, которая улучшает захват объектов роботами в сложных сценах. Она использует модели, объединяющие визуальные данные и язык, чтобы предсказать начальную точку захвата, что позволяет снизить требования к вычислительным ресурсам. Разделение семантического анализа и геометрической реализации позволяет поддерживать несколько вариантов захвата без необходимости дорогостоящего обучения от начала до конца. Для тренировки модели представлен новый набор данных с более чем 2,5 миллионами захватов в загроможденных сценах.'}, 'en': {'title': 'Efficient Robotic Grasping with SeededGrasp', 'desc': 'This paper presents SeededGrasp, a framework that enhances robotic grasping in complex environments by combining vision-language models (VLMs) with a lightweight grasp-generation model. Instead of directly predicting grasps, SeededGrasp predicts a seed point that guides the grasping process, allowing for better spatial reasoning and task alignment. The approach separates high-level semantic understanding from low-level geometric actions, making it more efficient and scalable across different robotic embodiments. The authors also introduce a new dataset with over 2.5 million grasps to support training, demonstrating significant improvements in grasping success rates in both simulations and real-world scenarios.'}}}, {'id': 'https://huggingface.co/papers/2607.20417', 'title': 'ATSplat: Compact Feed-forward 3D Gaussian Splatting with Adaptive Token Expansion', 'url': 'https://huggingface.co/papers/2607.20417', 'abstract': 'Abstract  3D Gaussian Splatting (3DGS) achieves high-quality novel-view synthesis by optimizing freely placed primitives in 3D and adaptively densifying them in under-reconstructed regions. However, this scene-adaptive capacity allocation is largely lost in existing feed-forward 3DGS methods, which commonly regress Gaussians at input pixels and lift them along camera rays. Such pixel-aligned formulations make the number and placement of primitives depend on image resolution and input viewpoints rather than scene complexity, resulting in dense and often redundant Gaussian sets. We present ATSplat, a feed-forward 3DGS framework that restores the adaptive allocation capability of 3DGS optimization through Adaptive 3D Tokens. ATSplat first lifts coarse patch-level depth and camera cues into sparse 3D anchor tokens, forming a compact scaffold of the scene. Each token is then regressed into local Gaussians with learnable 3D offsets, decoupling primitive placement from input image grids. An Adaptive Token Expansion module predicts a token-level uncertainty score, supervised by rendering error maps, and selectively expands high-uncertainty tokens through learnable expansion layers. This sparse-to-adaptive formulation enables ATSplat to concentrate primitives in challenging regions while maintaining a compact representation. Experiments on two representative datasets, RealEstate10K and DL3DV, show that ATSplat achieves state-of-the-art rendering quality while reducing the number of Gaussians by more than 5.7times compared with dense feed-forward 3DGS methods. From 12 input images at 512 times 960 resolution, ATSplat completes reconstruction in less than a second using a single commercial GPU, and renders high-quality novel views at 1136 FPS (512 times 960) with only 311K Gaussians.', 'score': 0, 'issue_id': 2883, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '97d0a8fcbf369b7a', 'github_url': '', 'github_stars': 0, 'authors': ['Cho In', 'Jeonghwan Cho', 'Mijin Yoo', 'Gim Hee Lee', 'Seon Joo Kim'], 'affiliations': ['National University of Singapore, Singapore', 'Yonsei University, South Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.20417.jpg', 'data': {'categories': ['#3d'], 'emoji': '🌌', 'ru': {'title': 'Эффективный 3D-синтез с адаптивными токенами', 'desc': 'Статья представляет новый метод под названием ATSplat для синтеза новых видов 3D-графики с использованием адаптивных 3D-токенов. Этот подход улучшает традиционный метод 3D Gaussian Splatting (3DGS) за счёт оптимизации размещения примитивов, что позволяет сосредоточить их в сложных областях сцены. ATSplat уменьшает количество используемых гауссианов более чем в 5.7 раз, сохраняя при этом высокое качество рендеринга. Эксперименты показывают, что метод работает эффективно, обеспечивая быструю реконструкцию и вывод новых видов за секунды на коммерческом графическом процессоре.'}, 'en': {'title': 'Adaptive 3D Tokens for Efficient Novel-View Synthesis', 'desc': 'The paper introduces ATSplat, a novel framework for 3D Gaussian Splatting (3DGS) that enhances the quality of novel-view synthesis by optimizing the placement of 3D primitives. Unlike traditional methods that rely on pixel alignment, ATSplat uses Adaptive 3D Tokens to create a sparse representation of the scene, allowing for more efficient allocation of resources based on scene complexity. This approach enables the model to focus on challenging areas while maintaining a compact set of Gaussians, significantly reducing redundancy. Experimental results demonstrate that ATSplat achieves superior rendering quality and efficiency, processing input images rapidly while using fewer Gaussians than previous methods.'}}}];

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }

                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-23 05:53')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
