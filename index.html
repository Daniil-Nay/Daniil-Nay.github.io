    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

ль Kimi K3, представляющая собой Mixture-of-Experts с 2,8 триллиона параметров и 104 миллиарда активированных параметров. Она обладает возможностями обработки изображений и контекстом в 1 миллион токенов. Kimi K3 демонстрирует улучшение эффективности масштабирования примерно в 2,5 раза по сравнению с Kimi K2 благодаря новым решениям в области обучения и архитектуры. Модель достигает высоких результатов в различных задачах, включая программирование и обработку информации, и доступна для дальнейших исследований.'}, 'en': {'title': 'Kimi K3: Pushing the Boundaries of Mixture-of-Experts Models', 'desc': 'Kimi K3 is a large Mixture-of-Experts model with 2.8 trillion parameters and advanced vision capabilities, designed to handle a context window of up to one million tokens. It utilizes innovative techniques like Kimi Delta Attention and Stable LatentMoE to enhance information flow and efficiency, achieving a significant improvement over its predecessor, Kimi K2. The model excels in various tasks, including coding and reasoning, thanks to its reinforcement learning capabilities and robust training methods. Although it does not surpass the most powerful proprietary models, Kimi K3 outperforms many others and is made available for further research and development.'}}}, {'id': 'https://huggingface.co/papers/2607.23588', 'title': 'JarvisHub: An Open Harness for Canvas-Native Multimodal Creative Agents', 'url': 'https://huggingface.co/papers/2607.23588', 'abstract': "Abstract  Creative AI is moving from single-step asset generation toward long-horizon multimodal production. Although recent generative models can synthesize high-quality images, videos, audio clips, UI elements, storyboards, slides, and other creative assets, real-world creative work requires more than isolated prompt-output interactions. It involves references, drafts, alternatives, edits, failed attempts, version relations, tool actions, evaluation signals, and human feedback, which together form an evolving project state. Existing prompt-based, chat-based, and node-based generation systems only partially support this state, as they often discard intermediate context, rely on linear conversations, or require manually specified workflows. Recent commercial systems indicate a shift toward agent-assisted creative production, but their closed architectures make it difficult to study how agents represent context, choose tools, revise artifacts, recover from failures, and maintain consistency over time. To address this gap, we introduce JarvisHub, a canvas-native creative agent harness for long-horizon multimodal creation. JarvisHub treats an editable canvas as the user workspace, the agent's external memory, action space, and shared project state, representing multimodal artifacts, dependencies, versions, and feedback as typed canvas nodes and links. Through a three-layer architecture of canvas state, protocol bridge, and agent runtime, JarvisHub enables agents to act within an inspectable and editable creative state. This design moves creative agents beyond isolated tool use toward sustained, human-steerable creative automation, where agents can progressively plan, generate, revise, and organize multimodal projects while users remain able to inspect, guide, and intervene throughout the process.", 'score': 72, 'issue_id': 2921, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'bdf5358053461935', 'github_url': '', 'github_stars': 0, 'authors': ['Yunlong Lin', 'Zixu Lin', 'Zhaohu Xing', 'Biqiang Li', 'Chenxin Li', 'Haonan Wang', 'Haitao Wu', 'Hengyu Liu', 'Jianghai Chen', 'Kaituo Feng', 'Kaixin Li', 'Shawn Chen', 'Shijue Huang', 'Sixiang Chen', 'Tsung-Yi Ho', 'Wenxuan Huang', 'Xiangyan Liu', 'Xiaomeng Hu', 'Xuanhua He', 'Yan Sun', 'Yunqing Zhao', 'Zhiqin Yang', 'Zehan Wang', 'Zhengyang Tang', 'Tianyu Pang', 'Xiangyu Yue'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.23588.jpg', 'data': {'categories': ['#long_context', '#agents', '#memory', '#tool_use', '#multimodal', '#agent_memory'], 'emoji': '🎨', 'ru': {'title': 'Новый этап в творческой автоматизации с JarvisHub', 'desc': 'Статья описывает развитие Creative AI от создания отдельных объектов к многомодальному производству на длительные сроки. В отличие от существующих систем, JarvisHub предлагает редактируемое поле для работы, где агент может хранить контекст, управлять действиями и поддерживать обратную связь. Это позволяет агентам работать со сложными проектами, постоянно планируя, генерируя и редактируя результаты. Такой подход делает автоматизацию творческого процесса более устойчивой и управляемой пользователем.'}, 'en': {'title': 'Empowering Creative Automation with JarvisHub', 'desc': 'This paper introduces JarvisHub, a creative agent designed for long-horizon multimodal production. Unlike traditional generative models that focus on single outputs, JarvisHub supports an evolving project state that includes drafts, edits, and user feedback. It utilizes a canvas as a workspace where multimodal artifacts and their relationships are represented as nodes and links. This approach allows for sustained creative automation, enabling agents to plan, generate, and revise projects while keeping users involved in the process.'}}}, {'id': 'https://huggingface.co/papers/2607.21655', 'title': 'Progress Reward Modeling for Robotic Learning: A Comprehensive Survey', 'url': 'https://huggingface.co/papers/2607.21655', 'abstract': 'Abstract  Robotic learning takes place in dynamic environments with large behavior spaces. A terminal success signal only tells the robot whether the task is completed. It does not explain whether the current behavior is making progress, remaining unchanged, or undoing earlier progress. For this reason, recent studies have increasingly explored progress rewards that provide feedback during task execution. However, the current literature lacks a shared framework. Existing methods use different observations, goal specifications, output signals, supervision sources, and evaluation protocols. This makes it difficult to compare them and understand what their results actually validate. In this survey, we provide a unified view of progress reward modeling for robotic learning. We organize the field in three connected steps. We first study the interface of a progress model. This defines the problem from the outside by asking what information the model receives and what form of progress signal it produces. We then move inside the model and study the methods used to construct this signal. This reveals the different assumptions and mechanisms behind progress estimation and reward generation. Finally, we examine the data and benchmarks that support these methods. This shows how progress supervision is obtained and what different evaluations actually measure. Together, these three perspectives connect what a progress model is, how it is built, and how its quality is validated. We further summarize the main limitations of current approaches and discuss future research directions.', 'score': 51, 'issue_id': 2921, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': 'bb4eac6b2a829c41', 'github_url': '', 'github_stars': 0, 'authors': ['Jianshu Zhang', 'Keliang Wu', 'Haoran Lu', 'Anbang Liu', 'Ce Zhang', 'Weijie Yin', 'Chengxuan Qian', 'Xiyuan Yang', 'Zhenyu Pan', 'Guo Ye', 'Han Liu'], 'affiliations': ['Carnegie Mellon University', 'Northwestern University', 'University of California, Santa Barbara', 'University of Illinois Urbana-Champaign', 'University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.21655.jpg', 'data': {'categories': ['#survey', '#agents', '#benchmark', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Успехи в обучении роботов: моделирование прогресса', 'desc': 'В данной статье рассматривается обучение роботов в динамичных условиях с большими пространствами поведения. Обсуждается необходимость в прогресс-вознаграждениях, которые предоставляют обратную связь во время выполнения задач, так как обычный сигнал об успехе не объясняет, достигнут ли прогресс. Авторы предлагают унифицированный подход к моделированию прогресс-вознаграждений, исследуя интерфейсы, методы построения и оценки данных, связанных с этими моделями. В итоге статья выявляет основные недостатки существующих методов и направляет на будущие направления исследований.'}, 'en': {'title': 'Towards Unified Progress Reward Modeling in Robotic Learning', 'desc': "This paper discusses the challenges in robotic learning, particularly in environments where feedback is limited to a success signal. It highlights the need for progress rewards that provide ongoing feedback about a robot's performance during task execution. The authors propose a unified framework to better understand and compare different methods of progress reward modeling. They explore the interface, construction, and evaluation of progress models, identifying limitations and suggesting future research directions."}}}, {'id': 'https://huggingface.co/papers/2607.24280', 'title': 'From Proprietary to Open-Source: Bridging the Distribution Gap via Multi-Agent Protocol Distillation in Agentic Search', 'url': 'https://huggingface.co/papers/2607.24280', 'abstract': 'Abstract  Agentic search enables large language models to solve knowledge-intensive tasks by interleaving multi-step reasoning with retrieval, yet optimizing this with outcome-based reinforcement learning (RL) provides only sparse supervision. Knowledge distillation can supply denser guidance, and advanced proprietary models with their strong reasoning capabilities are promising teachers. While distilling from proprietary models can densify this supervisory signal, conventional logit-matching is precluded by hidden logits and mismatched tokenizers, whereas raw natural language trajectory imitation transfers superficial stylistic artifacts rather than core reasoning competence. To address the heterogeneous distillation problem and bridge the distribution gap, we propose Multi-Agent Protocol Distillation (MAPD), a joint distillation and RL framework uses a structured, style-normalized protocol as an intermediate representation. An offline multi-agent system (MAS) decomposes each query, retrieves supporting evidence, repairs failed searches, and converts the resulting exploration trace into a JSON protocol containing the task type, reasoning plan, and extractive grounding facts. During training, the protocol is provided only to a privileged branch of the student policy, whose token distributions furnish a dense distillation signal alongside the sparse RL objective. Extensive evaluations across seven QA benchmarks demonstrate that MAPD consistently outperforms competitive distillation and RL, achieving average success rates of 39.4\\% on Qwen3-1.7B and 44.4\\% on Qwen3-4B. Crucially, the framework generalizes robustly across diverse proprietary teachers while effectively mitigating the student policy from style drift and verbosity degeneration.', 'score': 50, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '31bf3674090a2caf', 'github_url': '', 'github_stars': 0, 'authors': ['Junlin Liu', 'Jiangwang Chen', 'Zixin Song', 'Shuaiyu Zhou', 'Chunji Lv', 'Hank Wu', 'Kailin Jiang', 'Jinyang Wu', 'Bohan Yu', 'Chenxi Zhou'], 'affiliations': ['Beijing Institute of Technology', 'East China Normal University', 'Peking University', 'Tsinghua University', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24280.jpg', 'data': {'categories': ['#training', '#dataset', '#agents', '#benchmark', '#agent_memory', '#reasoning', '#rl', '#rlhf', '#transfer_learning'], 'emoji': '🤖', 'ru': {'title': 'Эффективное обучение языковых моделей с помощью дистилляции знаний', 'desc': 'Данная статья предлагает новый подход к улучшению обучения языковых моделей, использующего метод Multi-Agent Protocol Distillation (MAPD). Этот метод объединяет обучение с подкреплением и дистилляцию знаний, чтобы обеспечить более плотный и качественный сигнал для обучения. Он использует многоагентную систему для разбиения задач и извлечения необходимой информации, что улучшает процесс обучения. Эксперименты показывают, что MAPD значительно превосходит традиционные методы, демонстрируя высокие уровни успешности в тестах на знание.'}, 'en': {'title': 'Enhancing Language Models with Multi-Agent Protocol Distillation', 'desc': 'This paper introduces Multi-Agent Protocol Distillation (MAPD), a novel framework that enhances the training of large language models by combining reinforcement learning (RL) with knowledge distillation. It addresses the challenges of sparse supervision in RL by using a structured protocol to guide the learning process, allowing models to better understand reasoning tasks. The framework employs an offline multi-agent system to gather evidence and create a detailed JSON protocol that captures the reasoning plan and relevant facts. Evaluations show that MAPD significantly improves performance on various question-answering benchmarks compared to traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2607.22798', 'title': 'StateAct: Program State, before Pixels, for Long-Horizon Computer-Use Agents', 'url': 'https://huggingface.co/papers/2607.22798', 'abstract': "Abstract  Computer-use agents are usually improved by strengthening perception: better models for reading a screenshot and choosing where to click. Yet a screenshot is only a lossy rendering of the underlying program state, e.g., the files, application backends, and DOM that hold the task data. Different states can produce the same pixels, while code can inspect and modify that state directly. StateAct is a code-first, multi-agent harness built around this distinction. Its main agent works directly with program state by using code, while a dedicated GUI subagent handles screenshot-and-click interaction on the few subgoals that need it, just 28 of 108 tasks and 1.1% of main-agent steps. The same direct access to program state also supports verification: an independent finish gate double-checks the saved result for structural failures, e.g., output that is missing, unsaved, or written to the wrong path. To stay on track over hundreds of steps, the main agent hands subgoals to fresh subagents, keeping its own context focused. On OSWorld 2.0, StateAct lifts Claude Opus 4.8 from 20.6% to 26.9% on binary success, and from 54.8% to 61.6% on partial success, at ~ 9x lower cost per task than the same model driven by screenshots alone; a code-only variant with no GUI subagent reaches only 45.9% partial, below that screenshot-based baseline's 54.8%. In general, grounding action, verification, and memory in state, what we call state-grounding, shifts the main bottleneck from perception toward reasoning: failures depend more on what the agent thinks than on what it sees.", 'score': 42, 'issue_id': 2920, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'd767f0c8834a5ffe', 'github_url': '', 'github_stars': 0, 'authors': ['Yan Yang', 'Xiangru Jian', 'Ziyang Luo', 'Zirui Zhao', 'Yutong Dai', 'Ziji Shi', 'Hanshu Yan', 'Jun Hao Liew', 'Silvio Savarese', 'Junnan Li'], 'affiliations': ['Salesforce AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.22798.jpg', 'data': {'categories': ['#agent_memory', '#reasoning', '#agents', '#memory'], 'emoji': '💻', 'ru': {'title': 'Переход от восприятия к мышлению', 'desc': 'В данной статье представлена новая система StateAct, которая улучшает производительность агентов, работающих с компьютерными интерфейсами, благодаря прямому взаимодействию с состоянием программы. Вместо того чтобы полагаться только на скриншоты, основной агент использует код для доступа к данным, что позволяет избежать потерь информации и улучшить проверку результатов. Статья показывает, что такая реализация привела к значительному снижению затрат и повышению эффективности выполнения задач. Также подчеркивается, что успешность выполнения зависит больше от мышления агента, чем от его восприятия.'}, 'en': {'title': 'Revolutionizing Agent Performance with State-Grounded Reasoning', 'desc': "This paper introduces StateAct, a multi-agent system that enhances computer-use agents by allowing them to interact directly with program state instead of relying solely on visual screenshots. By using a main agent that accesses the underlying code and a GUI subagent for limited visual tasks, the system improves efficiency and accuracy in task completion. StateAct also incorporates a verification mechanism to ensure the integrity of results, reducing errors related to output management. Overall, this approach shifts the focus from perception to reasoning, demonstrating that the agent's understanding of the state is crucial for success."}}}, {'id': 'https://huggingface.co/papers/2607.24744', 'title': 'Data Pyramid for Embodied Manipulation', 'url': 'https://huggingface.co/papers/2607.24744', 'abstract': 'Abstract  Multimodal foundation models learned to see and to speak by consuming the whole internet. Embodied agents admit no such shortcut, since they require data that couple observations with physical states and actions. These signals can be provided, to varying degrees, by multiple data sources. In this work, we organize the embodied data ecosystem as a "pyramid" spanning five complementary sources: real-robot data, UMI-style data, egocentric and exocentric data, simulation data, and general vision-language data. We organize the pyramid around the tension between scalability and robot alignment, and further characterize each source in terms of data quality, diversity, reusability, and physical fidelity. We then analyze recent embodied foundation models through the lens of their data recipes, examining how different sources are selected, aligned, and mixed during pretraining. For embodied brain models, vision-language-action models, and world-action models alike, we relate data composition to capabilities in perception, reasoning, planning, action generation, and world prediction. We close by discussing six open challenges: building large-scale tactile datasets, collecting failure and recovery data, developing scalable data-collection pipelines, aligning actions across embodiments, leveraging egocentric data for dexterous manipulation, and designing principled data recipes for robot learning. We hope this work paves the foundation for the design of next-generation embodied systems.', 'score': 29, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'a5fdfd228251ff75', 'github_url': '', 'github_stars': 0, 'authors': ['Yifan Ye', 'Yankai Fu', 'Yaoxu Lv', 'Bohan Hou', 'Jun Cen', 'Lingdong Kong', 'Duo Zheng', 'Tianxing Chen', 'Jiaming Liu', 'Ziang Cao', 'Yunfan Lou', 'Wei Chow', 'Xian Sun', 'Yingshuo Wang', 'Kuangzhi Ge', 'Xiaowei Chi', 'Xidong Zhang', 'Zhibo Pang', 'Yiwu Zhong', 'Sirui Han', 'Zhihe Lu', 'Weihao Yuan', 'Qifeng Chen', 'Michael Yu Wang', 'Yao Mu', 'Ziwei Liu', 'Jianfei Yang', 'Ping Luo', 'Shanghang Zhang'], 'affiliations': ['CUHK', 'Duke', 'GBU', 'HKU', 'HKUST', 'NJU', 'NTU', 'NUS', 'PKU', 'SJTU', 'UCB'], 'pdf_title_img': 'assets/pdf/title_img/2607.24744.jpg', 'data': {'categories': ['#dataset', '#agents', '#data', '#agent_memory', '#robotics', '#reasoning', '#multimodal'], 'emoji': '🤖', 'ru': {'title': 'Создание систем с воплощенной интеллигенцией', 'desc': 'В данной работе обсуждаются многомодальные базовые модели, которые учатся взаимодействовать с физическим миром через данные, объединяющие наблюдения и действия. Авторы организуют экосистему данных для «воплощенных» агентов в форме пирамиды из пяти различных источников. Это включает данные реальных роботов, данные UMI, эгоцентрические и эксцентрические данные, данные симуляции и данные общего видения-языка. Также рассматриваются проблемы масштабируемости и согласованности действий роботов, в том числе шесть открытых вопросов для будущих исследований.'}, 'en': {'title': 'Building the Future of Embodied Learning', 'desc': "This paper discusses the development of embodied agents that learn from various data sources, unlike multimodal foundation models that use internet data. It introduces a 'pyramid' structure to organize these data sources, which include real-robot data, simulation data, and vision-language data. The authors analyze how different data types impact the capabilities of embodied models in tasks like perception and action generation. They also identify challenges in creating effective datasets and data collection methods for improving robot learning."}}}, {'id': 'https://huggingface.co/papers/2607.24027', 'title': 'Sol-Attn: Accelerating Video Generation Inference via On-the-Fly Attention Sparsification', 'url': 'https://huggingface.co/papers/2607.24027', 'abstract': 'Abstract  Diffusion transformers are essential for high-fidelity video generation, but long token sequences make attention a dominant inference bottleneck. Training-free dynamic sparse attention alleviates this bottleneck by computing only selected key-value blocks, yet existing methods struggle to sparsify attention both efficiently and accurately for two reasons: (1) Rigid, unpredictable, and costly routing: selecting a fixed fraction of top-ranked blocks by proxy score imposes fixed budgets, whereas retaining blocks to reach a target cumulative proxy probability mass yields dynamic but potentially imbalanced budgets; both incur non-negligible overhead from computing and materializing proxy scores. (2) Lossy keep-or-drop sparsification: unselected blocks are discarded entirely, degrading accuracy under aggressive sparsity. These limitations motivate cheaper dynamic-budget routing while limiting accuracy degradation. In this paper, we introduce training-free Sol-Attn (Sparsifying online attention), which unifies dynamic routing, sparse computation, and approximation correction in a single online-softmax pass, achieving a better accuracy-efficiency trade-off in sparse attention. The core of Sol-Attn is on-the-fly block thresholding with proxy-score reuse, which selects critical blocks by comparing block proxy scores against a threshold during online softmax. This design enables dynamic yet controllable block budgets without materializing the proxy map, while directly reusing the proxy scores of unselected blocks to approximate their contribution. Experiments across image and video generation tasks show that Sol-Attn advances the quality-efficiency frontier of training-free sparse attention, delivering 2.1 times and 2.3 times end-to-end speedups for video generation and editing, respectively, while preserving visual quality.', 'score': 19, 'issue_id': 2922, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '499e1de96f8702d2', 'github_url': '', 'github_stars': 0, 'authors': ['Haopeng Li', 'Yitong Li', 'Junsong Chen', 'Tian Ye', 'Haozhe Liu', 'Jincheng Yu', 'Duomin Wang', 'Ruihua Zhang', 'Zeke Xie', 'Enze Xie', 'Song Han'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.24027.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#architecture', '#inference', '#training'], 'emoji': '🎥', 'ru': {'title': 'Динамичное внимание для видеогенерации', 'desc': 'В данной статье представлены диффузионные трансформеры, которые важны для генерации видео высокого качества. Авторы предлагают метод Sol-Attn, который позволяет динамически управлять вычислениями и сохранять эффективность внимания без необходимости в обучении. Метод устраняет проблемы, связанные с фиксированными бюджетами и потерей точности при агрессивной разреженности, благодаря динамической маршрутизации блоков. Эксперименты показывают, что Sol-Attn значительно ускоряет процесс генерации и редактирования видео, сохраняя высокое качество визуального материала.'}, 'en': {'title': 'Dynamic Sparse Attention for Efficient Video Generation', 'desc': 'This paper presents Sol-Attn, a novel approach to improve the efficiency of attention mechanisms in video generation using dynamic sparse attention. It addresses the limitations of existing methods by introducing a training-free technique that allows for flexible block selection without the overhead of computing proxy scores. Sol-Attn utilizes on-the-fly block thresholding to dynamically adjust the number of blocks used, ensuring a balance between accuracy and computational efficiency. Experiments demonstrate that this method significantly speeds up video generation and editing while maintaining high visual quality.'}}}, {'id': 'https://huggingface.co/papers/2607.24731', 'title': 'Rethinking Classifier-Free Guidance in On-Policy Diffusion Distillation', 'url': 'https://huggingface.co/papers/2607.24731', 'abstract': "Abstract  On-policy distillation (OPD) adapts diffusion models by querying a teacher along trajectories generated by the current student, but how it should behave under classifier-free guidance (CFG), a default component of modern diffusion systems, remains poorly understood. Existing OPD methods naturally extend velocity matching to the CFG-composed prediction, directly matching teacher and student guided velocities. We show that this objective is under-identified at the branch level: positive- and negative-branch errors can compensate in the guided prediction. Through two contrasting cases, we find that naive matching remains effective under shared negative conditioning, where both branch errors decrease jointly. When the model's native CFG schema retains privileged information in the teacher's negative branch that is unavailable to the student, however, this joint reduction breaks down and the composed objective induces antagonistic branch-error dynamics, reducing the positive-branch error while increasing the negative-branch error. We term this failure mode Negative Branch Asymmetry (NBA). To address NBA, we introduce Positive--Direction Matching (PDM), a branch-aware OPD objective that separately constrains the positive prediction and the CFG conditional direction. We apply PDM to dense-to-sparse video control, where naive guided matching is highly sensitive to inference guidance scales, while branch-aware supervision enables more robust and effective knowledge transfer.", 'score': 17, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '731a1813942fcb94', 'github_url': '', 'github_stars': 0, 'authors': ['Bingnan Li', 'Haozhe Wang', 'Haozhong Xiong', 'Fangtai Wu', 'Jinpeng Yu', 'Yang Shi', 'Jiaming Liu', 'Ruihua Huang'], 'affiliations': ['Qwen Business Unit of Alibaba'], 'pdf_title_img': 'assets/pdf/title_img/2607.24731.jpg', 'data': {'categories': ['#training', '#agents', '#rl', '#transfer_learning', '#diffusion', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Новая стратегия для улучшения моделей диффузии', 'desc': 'Статья рассматривает проблему адаптации моделей диффузии с использованием метода On-policy distillation (OPD), который взаимодействует с учителем по траекториям, созданным текущим учеником. Обсуждается, как этот метод работает с классификаторно-свободным управлением (CFG), важной частью современных диффузионных систем. Исследуются ошибки в положительной и отрицательной ветвях, которые могут компенсировать друг друга, но при наличии у модели конфликта информации между ветвями, это приводит к ухудшению результатов. Для решения этой проблемы предлагается новый подход Positive-Direction Matching (PDM), который обеспечивает более надежный и эффективный перенос знаний.'}, 'en': {'title': 'Enhancing Knowledge Transfer in Diffusion Models with Positive-Direction Matching', 'desc': "This paper discusses On-policy distillation (OPD) in diffusion models, focusing on its behavior under classifier-free guidance (CFG). It identifies a problem called Negative Branch Asymmetry (NBA), where errors in the model's predictions can negatively affect performance when the teacher's information is not fully accessible to the student. The authors propose a new method called Positive-Direction Matching (PDM) to address this issue by separately managing the positive predictions and the CFG direction. By applying PDM to video control tasks, they demonstrate improved robustness and effectiveness in knowledge transfer compared to traditional methods."}}}, {'id': 'https://huggingface.co/papers/2607.23855', 'title': 'OmniVAE: An Audio-Video VAE with Cross-Modal Alignment for Joint Generation', 'url': 'https://huggingface.co/papers/2607.23855', 'abstract': 'Abstract  Recent generative models are moving beyond silent video or standalone audio synthesis toward the joint generation of synchronized audio and video. Despite this progress, jointly generating audio and video with fine-grained cross-modal correspondence remains challenging due to their fundamental structural differences. Most existing methods use audio and video VAEs trained separately. As a result, the two latent spaces lack cross-modal alignment, leaving the downstream generative model to learn cross-modal synchronization from scratch. We present OmniVAE, a jointly trained audio-video VAE that learns fine-grained semantic alignment between audio and video latent representations. Beyond reconstruction, OmniVAE uses a segment-level audio-video contrastive objective to capture temporal-semantic correspondence and align the two latent spaces. In parallel, it distills features from pretrained modality-specific semantic encoders into each modality, improving the downstream learnability of both latent spaces. Extensive experiments show that both objectives consistently improve the learnability of the latent spaces, translating into higher generation quality and more accurate cross-modal synchronization in downstream text-to-audio-video generation. These findings underscore the importance of learning unified representations as a foundation for omnimodal modeling.1', 'score': 16, 'issue_id': 2921, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '4a328b4e9db20aa1', 'github_url': '', 'github_stars': 0, 'authors': ['Jun Zhan', 'Chen Yang', 'Yitian Gong', 'Donghua Yu', 'Kuangwei Chen', 'Wenbo Zhang', 'Kexin Huang', 'Qi Luo', 'Zhe Xu', 'Ying Zhu', 'Jin Wang', 'Tengyue Zhang', 'Qi Chen', 'Cheng Chang', 'Songlin Wang', 'Junqi Dai', 'Jiasheng Ye', 'Xiaogui Yang', 'Tianyi Liang', 'Xiangyu Peng', 'Zhaoye Fei', 'Shimin Li', 'Qinyuan Cheng', 'Xie Chen', 'Xinchi Chen', 'Xipeng Qiu'], 'affiliations': ['Fudan University', 'MOSI Intelligence', 'Shanghai Innovation Institute', 'Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.23855.jpg', 'data': {'categories': ['#multimodal'], 'emoji': '🎥', 'ru': {'title': 'Совместная генерация аудио и видео с OmniVAE', 'desc': 'В данной статье рассматривается новая модель OmniVAE, которая осуществляет совместную генерацию аудио и видео с высокой степенью семантического соответствия. Основная проблема заключается в том, что существующие методы обучают аудио и видео отдельно, что затрудняет их синхронизацию. OmniVAE использует контрастивную цель на уровне сегментов для захвата временного и семантического соответствия между двумя латентными пространствами. Эксперименты показывают, что такой подход значительно улучшает качество генерации и точность синхронизации в задачах генерации текста в аудио и видео.'}, 'en': {'title': 'Unified Audio-Video Generation with OmniVAE', 'desc': 'This paper introduces OmniVAE, a novel approach for jointly generating synchronized audio and video using a variational autoencoder (VAE). Unlike previous methods that train audio and video separately, OmniVAE learns a unified latent space that captures fine-grained semantic alignment between the two modalities. It employs a segment-level audio-video contrastive objective to enhance temporal-semantic correspondence, improving the quality of generated content. The results demonstrate that this unified representation significantly boosts the performance of downstream tasks like text-to-audio-video generation.'}}}, {'id': 'https://huggingface.co/papers/2607.24720', 'title': 'The Physics of Multi-Turn Long-Horizon Planning: From Pre-training to Post-training via Single- and Multi-Teacher On-Policy Agentic Distillation', 'url': 'https://huggingface.co/papers/2607.24720', 'abstract': "Abstract  Multi-turn long-horizon planning is critical for foundation model agents, yet how to fundamentally improve it remains unclear. Existing models are trained on uncontrollable and opaque Internet data, making it difficult to identify how planning ability is acquired, shaped, and integrated. To address this challenge, we introduce a unified and controlled multi-turn environment that enables precise control. It allows systematically study long-horizon planning across three stages. (1) Planning ability acquisition during pre-training. We study data format, distribution, and quality. Explicit world model construction through CoT state transition modeling yields stronger long-horizon generalization. Atomic skills alone are insufficient for compositional generalization, whereas a litte long-horizon data works. Moreover, suboptimal trajectories severely impair performance because errors amplify over long horizons. (2) Planning ability shaping via GRPO and OPD post-training. Through mutual information, we distinguish general planning patterns from task-specific planning knowledge. For planning patterns, we identify three application regions of post-training: unnecessary, effective, and unsupported. OPD has a broader effective region than GRPO under low-quality and long-horizon settings, as it provides more consistent update directions. For planning knowledge, distilling unseen procedures from a teacher with different knowledge may impair student's prior world modeling without fully establishing new knowledge. (3) Planning ability integration through MOPD post-training. We show that multi-teacher on-policy distillation (MOPD) integrates capabilities by converging to shared planning-pattern across environments. Compatible patterns enable cross-environment generalization, partially shared patterns support continual learning, while completely conflicting patterns cause severe interference.", 'score': 13, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '523edb8c1d0a1a19', 'github_url': '', 'github_stars': 0, 'authors': ['Tianyi Men', 'Zhuoran Jin', 'Kang Liu', 'Jun Zhao'], 'affiliations': ['School of Artificial Intelligence, University of Chinese Academy of Sciences, Beijing, China', 'The Key Laboratory of Cognition and Decision Intelligence for Complex Systems, Institute of Automation, Chinese Academy of Sciences, Beijing, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24720.jpg', 'data': {'categories': ['#agents', '#training', '#continual_learning', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Улучшение долгосрочного планирования для моделей на основе крупной базы данных', 'desc': 'В данной статье рассматривается многошаговое планирование на длинные горизонты для агентов моделей на основе крупной базы данных. Авторы предлагают единое контролируемое окружение для изучения долгосрочного планирования через три ключевых этапа. Они подчеркивают важность качества данных и построения моделей мира для улучшения планирования, а также исследуют влияние различных методов на обучение. Результаты показывают, что правильная интеграция способностей планирования через совместное обучение может значительно улучшить обобщение в разных средах.'}, 'en': {'title': 'Enhancing Long-Horizon Planning in AI Agents', 'desc': 'This paper addresses the challenge of improving multi-turn long-horizon planning in foundation model agents. It introduces a controlled environment to study how planning abilities are acquired, shaped, and integrated across three stages: acquisition during pre-training, shaping through post-training methods, and integration via multi-teacher distillation. The research highlights the importance of data quality and the impact of planning patterns on performance, revealing that suboptimal trajectories can significantly hinder long-horizon planning. Ultimately, the findings suggest that effective planning requires a balance of atomic skills and long-horizon data, along with careful integration of knowledge from multiple sources.'}}}, {'id': 'https://huggingface.co/papers/2607.23518', 'title': 'Chamaileon: Cross-Context Binder Design with Contextualized Modeling and Mixed Sampling', 'url': 'https://huggingface.co/papers/2607.23518', 'abstract': 'Abstract  The rapid evolution of generative models has unlocked new potentials in protein binder design, a pivotal task in structural biology, by facilitating end-to-end generation via joint sequence-structure modeling or hallucination. However, existing approaches are predominantly implemented under a single-target, single-state assumption, limiting their ability to model multi-target or multi-state interactions required for advanced function-oriented protein design. Here, we introduce Chamaileon, which unifies multi-target and multi-state binder design by formulating the problem as cross-context binding landscape modeling. The framework is underpinned by a training paradigm termed In-Context Complex Co-Design (I3CD) for context-aware sequence-structure co-modeling. During inference, we employ Mixture-of-Paths Sampling (MoPS), a scalable strategy that optimizes a single sequence across contexts while alleviating the scarcity of high-quality multi-conformational paired data. Extensive evaluation on our newly constructed benchmark, CROSS, demonstrates that Chamaileon effectively generates sequences adaptable to diverse conformational landscapes and multi-target requirements. The code is available on https://github.com/caohengyuan/Chamaileon.', 'score': 6, 'issue_id': 2922, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'b99dddc6a2f4983c', 'github_url': '', 'github_stars': 0, 'authors': ['Hengyuan Cao', 'Shizhuo Cheng', 'Mingxuan Liu', 'Weicheng Huang', 'Yunhong Lu', 'Chenxi Cai', 'Yan Zhang', 'Min Zhang'], 'affiliations': ['Fudan University, Shanghai, China', 'Shanghai Institute for Advanced Study Zhejiang University, Shanghai, China', 'Shanghai Institute for Mathematics and Interdisciplinary Sciences, Shanghai, China', 'Zhejiang University, Hangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.23518.jpg', 'data': {'categories': ['#diffusion', '#optimization', '#hallucinations', '#benchmark', '#dataset', '#open_source', '#training'], 'emoji': '🧬', 'ru': {'title': 'Новый подход к проектированию белковых связывателей', 'desc': 'В данной статье представлено новое поколение генеративных моделей для проектирования белковых связывателей, что является ключевой задачей в структурной биологии. Авторы предлагают метод Chamaileon, который объединяет проектирование многозадачных и многостадийных связывателей, используя моделирование связывания в различных контекстах. Важной частью работы является подход I3CD, позволяющий учитывать контексты во время обучения. В результате полученные модели способны генерировать последовательности, адаптированные под различные конформационные ландшафты и требования к связывателям.'}, 'en': {'title': 'Chamaileon: Revolutionizing Multi-Target Protein Binder Design', 'desc': 'This paper presents Chamaileon, a novel framework for designing protein binders that can adapt to multiple targets and states. It addresses the limitations of existing models that typically focus on single-target interactions by employing cross-context binding landscape modeling. The approach utilizes In-Context Complex Co-Design (I3CD) for effective sequence-structure co-modeling and Mixture-of-Paths Sampling (MoPS) during inference to optimize sequences across different contexts. Evaluation on the CROSS benchmark shows that Chamaileon can generate versatile sequences suitable for complex protein design tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.21694', 'title': 'Oxygen-TryOn: Fashion-Native Foundation Model for Any-item Virtual Try-On', 'url': 'https://huggingface.co/papers/2607.21694', 'abstract': 'Abstract  We present Oxygen-TryOn, a unified foundation model for any-item virtual try-on. Rather than repurposing a general-purpose image editor, Oxygen-TryOn is fashion-native, built for try-on through a dedicated data engine and try-on-specific training. Given one or more reference items (clean product shots or in-the-wild worn-on photos) and a single target subject image, it synthesizes a photorealistic image of the subject wearing the items across virtually any fashion category. Prior systems handle a single garment category in a studio setting, and recent multi-reference methods remain garment-centric; in contrast, Oxygen-TryOn supports diverse items and scenarios, including full- and half-body views, a variable number of references, and free multi-item composition, while faithfully preserving both subject identity and item appearance. Instead of mask-based inpainting, we reformulate try-on as a multi-reference, understanding-driven generation task. We build a data engine that collects, manufactures, annotates, and filters high-quality try-on data at scale, and design a three-stage recipe of continued pre-training (CPT), supervised fine-tuning (SFT), and reinforcement learning (RL). The RL stage uses a hybrid reward combining an in-house try-on reward model with a proprietary, rubric-guided general-purpose model, jointly supervising fine-grained consistency and instruction-level quality. It also follows general editing instructions (e.g., pose changes) in the same pass. Across public benchmarks and our in-house Oxygen-TryOn Bench, it achieves state-of-the-art consistency and realism on single-item try-on and leads on multi-item try-on, matching or surpassing both leading proprietary systems (Nano Banana Pro, GPT-Image-2, Seedream5 Lite) and open-source models (FLUX.2).', 'score': 6, 'issue_id': 2921, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': '8a3d480cea2a23f6', 'github_url': '', 'github_stars': 0, 'authors': ['Yong Liu', 'Xiaolong Fu', 'Zihang Xu', 'Wen Xue', 'Xueheng Li', 'Lin Song', 'Yuan Zhang', 'Chuyang Zhao', 'Haoyang Huang', 'Nan Duan', 'Yipeng Sun', 'Yan Li', 'Simiu Gu'], 'affiliations': ['JD', 'Joy Future Academy', 'Oxygen AIGC Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.21694.jpg', 'data': {'categories': ['#training', '#dataset', '#benchmark', '#data', '#rl', '#open_source', '#multimodal', '#diffusion', '#architecture', '#optimization'], 'emoji': '👗', 'ru': {'title': 'Универсальная примерка: Oxygen-TryOn для любых предметов', 'desc': 'Oxygen-TryOn представляет собой универсальную модель для виртуальной примерки любых предметов одежды. В отличие от традиционных систем, которые фокусируются на одной категории одежды, эта модель поддерживает разнообразные предметы и сценарии, включая примерку целых и половинных образов. Она использует специальный движок данных для создания и аннотирования высококачественных данных примерки и применяет трехступенчатый процесс обучения. Благодаря этому, Oxygen-TryOn демонстрирует наилучшее качество и реализм как в примерке отдельных предметов, так и в многопредметных композициях.'}, 'en': {'title': 'Revolutionizing Virtual Try-On with Oxygen-TryOn', 'desc': 'Oxygen-TryOn is a specialized model designed for virtual try-on of fashion items, allowing users to see how different clothing looks on them. Unlike previous systems that focused on single garment categories, this model can handle various items and scenarios, including full-body and half-body views. It uses a unique data engine to gather and refine high-quality try-on data and employs a three-stage training process that includes continued pre-training, supervised fine-tuning, and reinforcement learning. The model excels in generating realistic images while maintaining the identity of the subject and the appearance of the items, achieving top performance in both single and multi-item try-on tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.24516', 'title': 'DecoupleMix: Decoupled Ratio Search and Convex Allocation for Scalable VLM Data Recipes', 'url': 'https://huggingface.co/papers/2607.24516', 'abstract': 'Abstract  While data curation for Vision Language Models (VLMs) is increasingly active, public practice for constructing pretraining mixtures remains largely heuristic: practitioners stack datasets that pass quality filters, set cross-domain ratios by intuition, and lack a principled, attributable criterion for admitting new data, while frontier recipes remain undisclosed. We formulate data construction as a systematic mixture-optimization problem and turn it into a reproducible engineering discipline by decoupling the mixture into two orthogonal sub-problems: inter-class ratios across capabilities and intra-class ratios within a category. For inter-class allocation, we use a single-variable iterative search; for intra-class composition, we apply a multidimensional, dataset-level assessment scoring Quality and Difficulty, and formulate selection as a constrained convex optimization with a diversity objective. The DecoupleMix framework delivers two critical capabilities: guiding what data to collect next and rendering dataset validation a controlled, attributable experiment. Experiments show our approach consistently surpasses heuristic baselines. Moreover, optimal ratios discovered on small-scale proxies transfer seamlessly to larger scales without retuning. Using 80B additional multimodal continue-pretraining tokens, our VLM is competitive with strong open-source models trained with substantially larger multimodal budgets.', 'score': 5, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '2e62f61c52f7c952', 'github_url': '', 'github_stars': 0, 'authors': ['Jiahao Xie', 'Zhongbin Guo', 'Qianle Wang', 'Ruiqi Lu', 'Dongling Xiao', 'Wanxuan Sun', 'Cheng Yang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.24516.jpg', 'data': {'categories': ['#dataset', '#data', '#benchmark', '#open_source', '#multimodal', '#transfer_learning', '#optimization'], 'emoji': '🖼️', 'ru': {'title': 'Оптимизация смешивания данных для Vision Language моделей', 'desc': 'В статье рассматривается создание наборов данных для моделей Vision Language (VLM), где текущее управление данными осуществляется скорее интуитивно. Авторы предлагают систематический подход к оптимизации смешивания данных, разделяя задачу на две подзадачи: распределение между классами и состав внутри класса. Используя метод декомпозиции, они применяют оптимизацию для выбора качественных и сложных данных. Предложенный метод DecoupleMix показывает превосходство над традиционными подходами и обеспечивает возможность применения на больших масштабах.'}, 'en': {'title': 'Optimizing Data Mixtures for Vision Language Models', 'desc': 'This paper addresses the challenges in data curation for Vision Language Models (VLMs) by proposing a systematic approach to optimize dataset mixtures. It introduces the DecoupleMix framework, which separates the mixture optimization into inter-class and intra-class problems, allowing for more controlled data selection. The framework employs iterative search and constrained convex optimization to enhance dataset quality and diversity. Experiments demonstrate that this method outperforms traditional heuristic approaches and achieves effective scaling from small to large datasets.'}}}, {'id': 'https://huggingface.co/papers/2607.22148', 'title': 'dRAE: Representation Autoencoder with Hyper-Spherical Codes', 'url': 'https://huggingface.co/papers/2607.22148', 'abstract': 'Abstract  In this work, we aim to discretize the high-dimensional visual representations to bridge the gap with language models - a non-trivial challenge, as existing quantization methods suffer from codebook collapse, failing to scale while preserving semantic coherence. We identify the root cause as metric mismatch: standard Euclidean codebook objectives are fundamentally misaligned with the anisotropic geometry of representation space, leading to codebook embeddings with high-variance magnitude scales and uneven angular distributions that hinder scalability. To address this, we propose Hyper-Spherical Quantization (HSQ), which decouples semantic content from feature magnitude via angular routing, preventing code assignment from being dominated by scale rather than meaning. The resulting discrete Representation Autoencoder (dRAE) achieves high-fidelity reconstruction while preserving semantic integrity and supporting scalable codebook budget. Extensive experiments demonstrate consistent performance gains as the vocabulary size scales to 131{,}072, along with 100\\% codebook utilization, simplified training pipeline, and strong performance across understanding and generation tasks.', 'score': 5, 'issue_id': 2921, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '65988d97a7798382', 'github_url': '', 'github_stars': 0, 'authors': ['Tianren Ma', 'Lin Long', 'Chuyan Chen', 'Mu Zhang', 'Junbo Zhao', 'Tong Zhang', 'Qixiang Ye'], 'affiliations': ['Ant Group', 'Peking University', 'University of Chinese Academy of Sciences', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.22148.jpg', 'data': {'categories': ['#training', '#inference', '#data', '#architecture', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Новая эра в сжатии визуальных данных', 'desc': 'В данной работе мы занимаемся дискретизацией высокоразмерных визуальных представлений, чтобы устранить разрыв с языковыми моделями. Существующие методы квантизации сталкиваются с проблемой коллапса кодовой книги и не могут масштабироваться, сохраняя семантическую согласованность. Мы предлагаем метод Hyper-Spherical Quantization (HSQ), который отделяет семантическое содержание от величины признаков, что позволяет избежать доминирования масштаба над значением. Результирующий дискретный Автоэнкодер представлений (dRAE) обеспечивает высокую точность реконструкции и поддерживает масштабируемость кодовой книги.'}, 'en': {'title': 'Bridging Visual and Language Models with Hyper-Spherical Quantization', 'desc': 'This paper addresses the challenge of discretizing high-dimensional visual representations to improve their integration with language models. The authors identify that existing quantization methods struggle due to codebook collapse and metric mismatch, which leads to ineffective scaling and semantic misalignment. They introduce Hyper-Spherical Quantization (HSQ), which uses angular routing to separate semantic meaning from feature magnitude, enhancing code assignment accuracy. The proposed discrete Representation Autoencoder (dRAE) demonstrates improved reconstruction fidelity and scalability, achieving significant performance improvements in various tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.24743', 'title': 'ClinFusion: A Vision-Centric Multimodal LLM System for Holistic Medical Understanding', 'url': 'https://huggingface.co/papers/2607.24743', 'abstract': "Abstract  Multimodal large language models (MLLMs) hold immense potential to revolutionize clinical practice, yet deploying them in the medical domain is fundamentally a vision-centric challenge: models must absorb knowledge from heterogeneous 2D and 3D medical images, and evaluation protocols must align with radiologists' clinical practice and provide an accurate, fine-grained and factualness-driven assessment. In this paper, we introduce ClinFusion, a vision-centric MLLM designed for holistic medical understanding that systematically addresses these limitations. We propose a compositional and cascaded vision encoder architecture featuring a Cascade Spatial-Aware Locality Fusion operator that unifies diverse 2D and native 3D medical image understanding within a fused encoder. We further introduce a vision-grounded evaluation framework, including MedIF-Bench for instruction-following assessment and a region-of-interest-grounded method for clinically aligned and factualness-driven report generation evaluation. We show that ClinFusion sets a new state-of-the-art across a comprehensive suite of 2D and 3D multimodal medical benchmarks---spanning visual question answering, report generation, and instruction following---as well as textual medical tasks, outperforming leading open-source medical MLLMs (e.g., Hulu-Med, Lingshu) on 20 out of 24 benchmarks and demonstrating multimodal capabilities better than powerful proprietary models such as GPT-5.2 and Gemini-3-Flash on 13 out of 16 benchmarks, and can be further augmented with agentic tool use for retrieval-augmented and tool-assisted clinical workflows. A blinded evaluation by board-certified radiologists confirms that ClinFusion produces the highest-ranked reports, and validates our RoI-grounded metric as achieving the strongest correlation with expert judgment among all automatic evaluation metrics examined.", 'score': 3, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '54e00d9dac5c5f4e', 'github_url': '', 'github_stars': 0, 'authors': ['Hangjie Yuan', 'Yichen Qian', 'Zhiwei Tang', 'Xianzhe Xu', 'Lirong Wu', 'Sicheng Yang', 'Jinwang Wang', 'Pengju Wang', 'Zhitao Zeng', 'Yizeng Han', 'Yan Xing', 'Shengxuan Luo', 'Tao Feng', 'Qing Xie', 'Weigen Yao', 'Yi Yang', 'Zuozhu Liu', 'Jiasheng Tang', 'Shaocheng Wang', 'Jitao Wang', 'Jiahong Dong', 'Weihua Chen', 'Feng Xu', 'Fan Wang'], 'affiliations': ['Beijing National Research Center for Information Science and Technology, Tsinghua University, Beijing, China', 'College of Computer Science and Technology, Zhejiang University, Hangzhou, China', 'DAMO Academy, Alibaba Group, Beijing, China', 'DAMO Academy, Alibaba Group, Hangzhou, China', 'Department of Computer Science and Technology, Tsinghua University, Beijing, China', 'Department of Radiology, The Affiliated Yangming Hospital of Ningbo University, Yuyao, China', 'Hepato-Pancreato-Biliary Center, Beijing Tsinghua Changgung Hospital, School of Clinical Medicine, Tsinghua Medicine, Tsinghua University, Beijing, China', 'Hupan Laboratory, Hangzhou, China', 'School of Software, Tsinghua University, Beijing, China', 'Zhejiang University-University of Illinois Urbana-Champaign Institute, Zhejiang University, Haining, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.24743.jpg', 'data': {'categories': ['#retrieval', '#agi', '#benchmark', '#interpretability', '#tool_use', '#healthcare', '#multimodal', '#open_source', '#games', '#agent_memory', '#architecture', '#optimization'], 'emoji': '🩺', 'ru': {'title': 'ClinFusion: Революция в медицинском анализе изображений', 'desc': 'В данной статье рассматриваются многомодальные большие языковые модели (MLLM), способные значительно изменить клиническую практику. Мы представляем ClinFusion, модель, ориентированную на визуальное восприятие, которая решает проблемы интеграции 2D и 3D медицинских изображений. Также предлагается новая методика оценки, включая MedIF-Bench, для оценки генерации отчетов в клинической практике. Результаты показывают, что ClinFusion превосходит существующие модели на большинстве медицинских задач.'}, 'en': {'title': 'ClinFusion: Revolutionizing Medical Understanding with Multimodal AI', 'desc': 'This paper presents ClinFusion, a multimodal large language model (MLLM) specifically designed for medical applications. It integrates knowledge from both 2D and 3D medical images using a unique compositional and cascaded vision encoder architecture. The model is evaluated through a new framework that aligns with clinical practices, ensuring accurate and factual report generation. ClinFusion outperforms existing medical MLLMs and demonstrates superior multimodal capabilities, validated by expert radiologists.'}}}, {'id': 'https://huggingface.co/papers/2607.23687', 'title': 'GNM Head: A Generative aNthropometric Model of the human head', 'url': 'https://huggingface.co/papers/2607.23687', 'abstract': 'Abstract  Parametric models of the human head are essential tools traditionally used in computer vision and graphics for animation, rendering, and reconstruction. More recently, they serve as crucial conditioning signals within generative large vision models, allowing for tight spatial control of generated imagery. However, existing publicly available models are typically limited in anatomical scope, modeling only outer geometry while ignoring intra-oral and ocular structures, and frequently suffer from reduced geometric quality stemming from low-fidelity input datasets. In this report we introduce a new parametric model dubbed Generative aNthropometric Model (GNM), named as a homophone of the human genome. GNM encompasses the head, face, neck, eyeballs, teeth, and tongue, and it is built on an extensive database of high-resolution 3D scans combined with high-quality anatomy specific artist-made samples. This report details the data provenance, the model architecture including the specialized sub-models for the ocular and intra-oral structures, and shows its SotA performance on fitting target 3D face scans. To foster community innovation, the complete GNM framework is made publicly available.', 'score': 3, 'issue_id': 2921, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '1f0f8a5181ff097f', 'github_url': '', 'github_stars': 0, 'authors': ['Stylianos Ploumpis', 'Jan Bednarik', 'Gaspard Zoss', 'Ruslan Guseinov', 'Luca Prasso', 'Prashanth Chandran', 'Oliver Boyne', 'Vasileios Choutas', 'Timo Bolkart', 'Daoye Wang', 'Menglei Chai', 'Di Qiu', 'Sebastian Winberg', 'Gilles Rainer', 'Lewis Bridgeman', 'Delio Vicini', 'Jérémy Riviere', 'Yannick Boetzel', 'Alexander Koumis', 'Jay Busch', 'Cynthia Herrera', 'Jacob Still', 'Scott Ysebert', 'Peter Lincoln', 'Sergio Orts Escolano', 'Christoph Rhemann', 'Erroll Wood', 'Thabo Beeler', 'Stefanos Zafeiriou'], 'affiliations': ['Google'], 'pdf_title_img': 'assets/pdf/title_img/2607.23687.jpg', 'data': {'categories': ['#science', '#dataset', '#3d', '#open_source', '#architecture'], 'emoji': '🧠', 'ru': {'title': 'Новая эра в моделировании человеческой головы', 'desc': 'В статье представлена новая параметрическая модель человеческой головы, названная Generative aNthropometric Model (GNM). Эта модель охватывает не только внешнюю геометрию, но и внутренние органы, такие как зубы и язык. Она строится на основе обширной базы данных высококачественных 3D-сканов и авторских образцов. Также описываются архитектура модели и подмодели, что позволяет достичь выдающихся результатов в моделировании 3D-сканов лиц.'}, 'en': {'title': 'Article', 'desc': ''}}}, {'id': 'https://huggingface.co/papers/2607.24241', 'title': 'FilmBench: A Film-Grade Benchmark for Cinematic Video Generation', 'url': 'https://huggingface.co/papers/2607.24241', 'abstract': 'Abstract  Progress in video generation keeps narrowing the visual gap between AI-generated and professionally produced footage, yet most benchmarks still draw prompts from web sources or LLM templates and score them with untrained, generic multimodal models. More fundamentally, their evaluation taxonomies remain rudimentary (overall visual quality, coarse text alignment and temporal smoothness) rather than the professional Cinematic Language criteria by which films are actually made and judged, so they assess basic video plausibility rather than film-grade craft. We introduce FilmBench, a text-to-video (T2V) and reference-to-video (R2V) benchmark grounded in the professional Cinematic Language of the film- academy tradition and co-developed with directors and faculty from the Beijing Film Academy and the Hujing Digital Media & Entertainment Group film studio. It rests on three choices. First, prompts are reverse-engineered from clips of award-winning films spanning 20 cinematic genres and chosen by professional directors, so every prompt is anchored to a verified live-action reference; the prompts follow real shot lists, and most script multiple shots (1,056 of the 1,169 prompts are multi-shot), unlike prior single-clip benchmarks. Second, evaluation follows a three-level Cinematic taxonomy of 3 axes, 12 components and 35 (T2V) +3 (R2V-only) sub-metrics. Third, we develop an in-house expert-grade automatic evaluation agent and open-source its core suite of Cinematic Language operators (FilmOps). Benchmarking leading video generation models (9 for T2V, 7 for R2V), the evaluator reproduces the human model ranking at model-level Spearman ho = 0.95 (T2V) and 0.96 (R2V). Scores fall well below prior web-style benchmarks, with two consistent gaps in dynamic aesthetics and a marked single- to multi-shot performance drop that widens for weaker models.', 'score': 2, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'b5c348a4fe1a7724', 'github_url': '', 'github_stars': 0, 'authors': ['Shengyi Wang', 'Niantong Li', 'Guangzheng Hu', 'Hong Qi', 'Fei Ding', 'Weixu Qiao', 'Jinlin Wang', 'Xiaotong Lv', 'Peng Han', 'Zimeng Li', 'Fanshu Ding', 'Yushu Wang', 'Han Wu', 'Jingjing Chen', 'Chongxiao Wang', 'Yanhao Wu', 'Chenglong Huang', 'Xiaoqian Zhu', 'Jie Tian', 'Hua Li', 'Jingjing Fan', 'Mingshuang Tang', 'Zhong Li', 'Hengxia Qiang', 'Weibin Chen', 'Jinyang Zhen', 'Bing Zhao', 'Lin Qu', 'Jing Li', 'Hu Wei'], 'affiliations': ['Alibaba Group', 'Beijing Film Academy', 'Moku Lab, Hujing Digital Media & Entertainment Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.24241.jpg', 'data': {'categories': ['#games', '#benchmark', '#multimodal', '#open_source'], 'emoji': '🎬', 'ru': {'title': 'Новый стандарт оценки видео: Учимся у профессионалов', 'desc': 'В статье рассматривается проблема оценки качества видео, генерируемого ИИ. Авторы предлагают новый бенчмарк FilmBench, который основывается на профессиональных критериях киноязыка и разработан совместно с профессиональными режиссерами. Он учитывает множественные элементы съемки и предлагает более точные метрики оценки по сравнению с существующими стандартами. Исследование показывает, что новые модели для генерации видео имеют значительно более низкие оценки по сравнению с предыдущими методами.'}, 'en': {'title': 'Raising the Bar for Video Generation Evaluation', 'desc': 'This paper introduces FilmBench, a new benchmark for evaluating video generation models based on professional cinematic standards. Unlike previous benchmarks that rely on generic metrics, FilmBench uses prompts derived from award-winning films and follows a detailed cinematic taxonomy for evaluation. It incorporates a three-level assessment system with multiple axes and components, ensuring a comprehensive analysis of video quality. The results show that leading models perform significantly below expectations in dynamic aesthetics and multi-shot scenarios, highlighting the need for more sophisticated evaluation methods in video generation.'}}}, {'id': 'https://huggingface.co/papers/2607.23806', 'title': 'A Frozen 12B Beats Frontier Models on Verified Work: 100% Accuracy, 0 Tokens, Bit-Exact, Forever', 'url': 'https://huggingface.co/papers/2607.23806', 'abstract': 'Abstract  Improving a language model today means retraining it: enormous compute, a new opaque model each cycle, non-deterministic output. We take the opposite path: the model stays frozen, and a persistent memory of verified solutions grows beside it. Once a problem family is solved and has passed an independent verification step that never consults the answer key, every new instance of that family is answered at zero generation tokens, bit-exact, deterministically. Across 180 fresh instances spanning nine problem families, four architectures from four vendors - dense and mixture-of-experts - each score 180/180 at zero generation tokens per answer: execution-bound capability decoupled from parameter scaling. A negative control attributes the capability fully to the memory: emptied, it solves nothing. The same verify-before-store contract holds for open-ended reasoning: 88/88 consistency-gated acceptances across all four models, machine-checked formal proof, and reasoning-method transfer at 77/80. Memory selection takes 1.4 microseconds; a full reuse completes in 6-23 ms at 36 mWh. Approximate similarity retrieval selects the wrong item 94.3% of the time on a 4,500-item verified store where exact addressing makes zero errors. The store also serves as working context at a scale no shipped engine matches: a 6,000,000-token movable window on a single 46 GB GPU at flat memory, where vLLM stops at 30,399 tokens and SGLang silently truncates past 32,000. On published benchmarks, frontier models remain far ahead of any 12B at raw from-scratch reasoning; on everything this system has solved and verified, the comparison inverts: a frontier API call pays a fresh generation pass on every query, forever, while verified reuse costs zero tokens and returns the identical bits every time. A public testbench with free, rate-limited access accompanies this report: https://corbenic-galahad-bench.hf.space', 'score': 2, 'issue_id': 2921, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': 'd90bdd4ba5450bc5', 'github_url': '', 'github_stars': 0, 'authors': ['Sietse Schelpe'], 'affiliations': ['Corbenic AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.23806.jpg', 'data': {'categories': ['#retrieval', '#benchmark', '#memory', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Память: ключ к эффективному обучению модели', 'desc': 'В данной статье рассматривается подход к улучшению языковой модели без ее переподготовки. Вместо этого используется постоянная память, в которой сохраняются проверенные решения, позволяя модели отвечать на новые запросы с нулевыми токенами генерации. Эксперименты показывают, что при этом можно достигать максимальной точности на различных типах задач без увеличения параметров модели. Таким образом, авторы демонстрируют, что память играет ключевую роль в достижении эффективных результатов в машинном обучении.'}, 'en': {'title': 'Memory Over Model: Solving Language Tasks with Verified Solutions', 'desc': 'This paper presents a novel approach to improving language models by utilizing a persistent memory of verified solutions instead of retraining the model. The model remains static, and once a problem family is solved and verified, it can answer new instances deterministically and without generating additional tokens. The results show that across various architectures, the system achieves perfect accuracy on new instances while maintaining low computational costs. This method demonstrates that memory-based solutions can outperform traditional model scaling in specific reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.22098', 'title': 'Reasoning Denoiser: Denoising Reasoning Traces for Hallucination Detection in Large Reasoning Models', 'url': 'https://huggingface.co/papers/2607.22098', 'abstract': 'Abstract  Large reasoning models (LRMs) generate long reasoning traces before producing final answers. While these traces may contain useful signals for hallucination detection, harnessing them is non-trivial because long trajectories often include noisy steps that obscure the cues relevant to truthfulness assessment. In this paper, we identify two prevalent forms of reasoning noises, i.e., irrelevant steps and repetitive steps, and show that both substantially degrade hallucination detection performance. Existing confidence-based scores and naive embedding-based filtering fail to reliably separate noisy from informative steps. To address this challenge, we propose REDE, a novel learning framework for denoising reasoning traces for hallucination detection. Specifically, REDE leverages final-answer attention as an automatic supervision signal to shape the step-level representation space, yielding refined embeddings in which noisy steps can be reliably identified and filtered. REDE can be readily plugged into diverse hallucination detectors by operating on the filtered reasoning trajectory after removing noisy steps. Extensive experiments on multiple reasoning benchmarks show that REDE consistently improves detection performance over competitive baselines.', 'score': 2, 'issue_id': 2922, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '03c1cef69d16f590', 'github_url': '', 'github_stars': 0, 'authors': ['Junlin Fang', 'Do Nguyen-Thanh', 'Xiaogang Xu', 'Zhen Fang', 'Sean Du'], 'affiliations': ['Australian Artificial Intelligence Institute, University of Technology Sydney', 'College of Computing and Data Science, Nanyang Technological University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.22098.jpg', 'data': {'categories': ['#data', '#hallucinations', '#benchmark', '#training', '#reasoning'], 'emoji': '🔍', 'ru': {'title': 'Очистка шумов для улучшения обнаружения галлюцинаций', 'desc': 'В данной статье рассматриваются большие модели рассуждений (LRMs), которые создают длинные траектории рассуждений перед выдачей окончательных ответов. Авторы выделяют два основных типа шумов в рассуждениях: нерелевантные и повторяющиеся шаги, которые мешают обнаружению галлюцинаций. Для решения этой проблемы предложена новая структура обучения REDE, которая использует внимание к окончательному ответу для фильтрации шумных шагов. Эксперименты показывают, что REDE значительно улучшает качество обнаружения по сравнению с существующими методами.'}, 'en': {'title': 'Enhancing Hallucination Detection with REDE Framework', 'desc': 'This paper addresses the challenge of detecting hallucinations in large reasoning models (LRMs) by focusing on the reasoning traces they generate. It identifies two main types of reasoning noise: irrelevant steps and repetitive steps, which hinder the accuracy of hallucination detection. The authors propose a new framework called REDE, which uses final-answer attention to improve the representation of reasoning steps, allowing for better identification and filtering of noisy information. Through extensive experiments, REDE demonstrates significant improvements in detection performance compared to existing methods.'}}}, {'id': 'https://huggingface.co/papers/2607.22561', 'title': 'Codifying the Judge: Scalable Evaluation via Program Distillation', 'url': 'https://huggingface.co/papers/2607.22561', 'abstract': "Abstract  LLM-as-a-judge has become the standard for automated evaluation, but it suffers from high cost, significant latency, and opaque decisions -- limitations that undermine its scalability and reliability. We address these with a simple, efficient alternative: program distillation. Instead of prompting an LLM at the evaluation time, we distill its decision logic into a committee of programs that score candidates directly. These programmatic judges offer transparency, are easily inspected or edited, and eliminate per-sample API costs. Building on this notion, we introduce PAJAMA, a system that synthesizes programs as judges, aggregates their decisions into a joint verdict, and incorporates a fallback mechanism to selectively escalate low-confidence cases to an LLM. Across five datasets and four model families, we show that programmatic judges can match the performance of a 13B-size LLM judge. When using program outputs as routing signals, PAJAMA improves both accuracy and throughput and advances the Pareto frontier. Beyond evaluation, programmatic judges produce cheap and effective reward signals: on RewardBench, a reward model distilled from programs' verdicts outperforms one trained on a proprietary LLM's labels at two orders of magnitude lower API cost.", 'score': 2, 'issue_id': 2921, 'pub_date': '2026-05-29', 'pub_date_card': {'ru': '29 мая', 'en': 'May 29', 'zh': '5月29日'}, 'hash': '01ca0a1e15aaa337', 'github_url': '', 'github_stars': 0, 'authors': ['Tzu-Heng Huang', 'Shengqi Qiu', 'Frederic Sala'], 'affiliations': ['University of Wisconsin-Madison'], 'pdf_title_img': 'assets/pdf/title_img/2607.22561.jpg', 'data': {'categories': ['#training', '#dataset', '#benchmark', '#interpretability', '#agent_memory', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Эффективные программные судьи вместо LLM', 'desc': 'Статья обсуждает альтернативу LLM как судьям в автоматизированной оценке, которая страдает от высоких затрат и медленной работы. Мы предлагаем метод дистилляции программ, позволяющий извлечь логику принятия решений из LLM и реализовать ее через группу программ, которые оценивают кандидатов напрямую. Это дает возможность прозрачности решений и уменьшает стоимость API. Мы представляем систему PAJAMA, которая синтезирует программы-судей и показывает, что эти программные судьи могут достигать результатов, сопоставимых с LLM весом 13 миллиардов параметров.'}, 'en': {'title': 'Program Distillation: A Cost-Effective Alternative to LLMs for Evaluation', 'desc': 'This paper presents a new approach called program distillation as an alternative to using large language models (LLMs) for automated evaluation. Instead of relying on LLMs during evaluation, the authors propose creating a committee of programs that can directly score candidates, which enhances transparency and reduces costs. The system, named PAJAMA, synthesizes these programs, aggregates their decisions, and includes a mechanism to escalate uncertain cases to an LLM. The results show that p
