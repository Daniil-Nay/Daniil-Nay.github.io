    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');
                    currentLang = flag.dataset.lang;
                    localStorage.setItem('selectedLang', currentLang);
                    updateTimeDiffs();

                });
            });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.21653', 'title': 'Molt: A Scalable PyTorch-Native Training Framework for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.21653', 'abstract': 'Abstract  Agentic reinforcement learning research is constant algorithm modification, new estimators, new pipeline stages, new rollout schemes, and in mainstream frameworks each change threads through layers of trainer, distributed backend, and rollout glue: the cost lands on the researcher at every iteration. Molt is a PyTorch-native training framework built to keep that cost small: a codebase compact and clean enough for a researcher to hold in their head, and for an AI coding assistant to read and reason about in its entirety, so the algorithm flow can be traced and changed end to end. The agent is an ordinary program, and one asynchronous loop trains multimodal and mixture-of-experts policies while never training on a token it did not generate, consistent in tokens, policy versions, and model semantics. Leanness does not cost performance: under a matched, fully asynchronous protocol, Molt is statistically comparable to a state-of-the-art Megatron-based stack. Molt is open source and provides recipes and containers at https://github.com/NVIDIA-NeMo/labs-molt.', 'score': 9, 'issue_id': 2914, 'pub_date': '2026-07-22', 'pub_date_card': {'ru': '22 июля', 'en': 'July 22', 'zh': '7月22日'}, 'hash': '972751777540b57c', 'github_url': '', 'github_stars': 0, 'authors': ['Jian Hu', 'Huiying Li', 'Hao Zhang', 'Binfeng Xu', 'Yifan Zhang', 'Shaokun Zhang', 'Hemil Desai', 'Michael Demoret', 'Pavlo Molchanov', 'Jan Kautz', 'Yi Dong'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.21653.jpg', 'data': {'categories': ['#open_source', '#rl', '#training', '#optimization'], 'emoji': '🔧', 'ru': {'title': 'Molt: Упрощение обучения агентных моделей', 'desc': 'Статья посвящена разработке новой обучающей системы под названием Molt, написанной на PyTorch. Эта система упрощает процесс обучения агентных моделей, позволяя исследователям легче управлять изменениями в алгоритмах и оценках. Molt обеспечивает связь между различными этапами и компонентами, сохраняя при этом высокую производительность. Также Molt является открытым исходным проектом, доступным для широкой аудитории.'}, 'en': {'title': 'Molt: Simplifying Reinforcement Learning Training', 'desc': 'This paper introduces Molt, a PyTorch-native training framework designed to simplify the process of agentic reinforcement learning. It allows researchers to easily modify algorithms and track changes throughout the training pipeline without overwhelming complexity. Molt supports training multimodal and mixture-of-experts policies while ensuring consistency in generated tokens and model semantics. Despite its compact design, Molt achieves performance levels comparable to advanced frameworks like Megatron, making it a valuable tool for researchers.'}}}, {'id': 'https://huggingface.co/papers/2607.22529', 'title': 'Skill Self-Play: Pushing the Frontier of LLM Capability with Co-Evolving Skills', 'url': 'https://huggingface.co/papers/2607.22529', 'abstract': 'Abstract  LLM training is shifting from manual design and annotation to interaction-driven self-evolution. However, existing self-evolutionary methods face a fundamental dilemma between task diversity and verification reliability: environment-bound methods obtain precise feedback but confine learning to narrow domains, while open-ended self-generation broadens the task space but lacks reliable verification, allowing misleading rewards to pollute the training loop. We identify agent skills as a powerful middle ground to reconcile this tension: each skill ensures deep, verifiable execution in a specific scenario, while dynamic routing across skills maintains open-ended task variety. Leveraging this insight, we introduce Skill Self-Play (Skill-SP), a co-evolutionary framework comprising a proposer, a solver, and a dynamic skill controller. Orchestrated via a reinforcement learning loop, these components co-evolve in a continuous self-play loop: the proposer generates challenging tasks conditioned on dynamically sampled skills; the solver explores candidate solutions to push its capability boundaries; and the skill controller collects execution feedback to update and expand the skill library. This interactive co-evolution effectively bridges the gap between structured verification and open-ended exploration. Empirical evaluations on tool-use and reasoning benchmarks demonstrate that Skill-SP, serving as a robust evolution engine, consistently pushes the performance ceiling of competent backbones while catalyzing striking turnarounds for initially misaligned models. Our code is available at https://github.com/Qwen-Applications/skill-self-play.', 'score': 8, 'issue_id': 2914, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '50c8553c9332b2d4', 'github_url': '', 'github_stars': 0, 'authors': ['Siyuan Huang', 'Pengyu Cheng', 'Haotian Liu', 'Tao Chen', 'Yihao Liu', 'Jingwei Ni', 'Shijie Zhou', 'Ziyi Yang', 'Gangwei Jiang', 'Mengyu Zhou', 'Yu Cheng', 'Xiaoxi Jiang', 'Guanjun Jiang'], 'affiliations': ['ETH Zürich', 'Peking University', 'Qwen Large Model Application Team, Alibaba', 'Renmin University of China', 'Sun Yat-sen University', 'The Chinese University of Hong Kong', 'University at Buffalo', 'University of Zurich'], 'pdf_title_img': 'assets/pdf/title_img/2607.22529.jpg', 'data': {'categories': ['#agent_memory', '#training', '#agents', '#tool_use', '#rl', '#continual_learning', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Новая эволюция LLM через взаимодействие и навыки', 'desc': 'В данной статье обсуждается новый подход к обучению LLM, который основан на самоэволюции через взаимодействие. Основная проблема заключается в балансе между разнообразием задач и надежностью проверки. Авторы предлагают метод Skill Self-Play, который позволяет глубоко и надежно выполнять задачи в конкретных сценариях, сохраняя при этом широкий диапазон задач. Этот метод демонстрирует эффективное взаимодействие между строгой проверкой и открытым исследованием.'}, 'en': {'title': 'Bridging Task Diversity and Verification in LLM Training', 'desc': 'This paper discusses a new approach to training large language models (LLMs) called Skill Self-Play (Skill-SP), which balances task diversity and verification reliability. It introduces a co-evolutionary framework that includes a proposer, a solver, and a dynamic skill controller, all working together in a reinforcement learning loop. The proposer generates tasks based on sampled skills, while the solver finds solutions, and the skill controller updates the skill library based on feedback. This method allows for structured verification of skills while still enabling broad exploration of tasks, leading to improved performance in various benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.22043', 'title': 'Scaling Native Multimodal Pre-Training From Scratch', 'url': 'https://huggingface.co/papers/2607.22043', 'abstract': 'Abstract  Although large language models (LLMs) exhibit remarkable reasoning capabilities, their reliance on text-only pre-training restricts the perception of the multimodal physical world. Native multimodal pre-training avoids this limitation by training models from scratch on multimodal inputs, thereby achieving deep cross-modal integration and mitigating optimization asymmetries inherent to traditional late-fusion architectures. Despite these advantages, the scaling properties of this paradigm remain systematically uncharacterized. To address this gap, we investigate the optimal model size and token count for training a transformer-based vision-language model under a fixed computational budget. We demonstrate that minimal objective loss adheres to a predictable compute law, whereas compute-optimal model sizes and token counts scale as power laws. Notably, language and multimodal objectives manifest distinct scaling behaviors. The language allocation law is largely invariant to the composition of the data, indicating stable language learning regardless of the multimodal data ratio. Conversely, the multimodal allocation law is highly sensitive to this composition. Specifically, text-heavy mixtures become compute-efficient only at larger model scales, shifting the optimal resource allocation toward greater model capacity. Additionally, by modeling the influence of data composition on compute laws and allocation exponents, we derive an efficiency frontier specifying precise configurations of model size, token count, and data mixture. Downstream evaluations further reveal that native multimodal pre-training induces positive cross-modal transfer, thereby enhancing pure-text spatial reasoning and enabling robust multimodal in-context learning. In summary, this empirical research establishes the essential groundwork for predictably scaling multimodal foundation models.', 'score': 6, 'issue_id': 2914, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '4626c84132ad7ced', 'github_url': '', 'github_stars': 0, 'authors': ['Haoyuan Wu', 'Aoqi Wu', 'Hai Wang', 'Jiajia Wu', 'Jinxiang Ou', 'Bei Yu'], 'affiliations': ['LLM Department, Tencent', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.22043.jpg', 'data': {'categories': ['#training', '#multimodal', '#transfer_learning', '#optimization', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Оптимизация мультимодального предобучения для глубокого понимания', 'desc': 'В этой статье исследуется предобучение мультимодальных моделей на основе трансформеров, что позволяет преодолеть ограничения традиционного предобучения на текстовых данных. Авторы демонстрируют, что оптимальные размеры моделей и количество токенов следуют законам масштабирования, которые зависят от структуры данных. Особенно выделяется, что мультимодальные задачи требуют больше ресурсов при высоком содержании текста, что влияет на распределение вычислительных затрат. Это исследование закладывает основу для предсказуемого масштабирования мультимодальных базовых моделей.'}, 'en': {'title': 'Unlocking Multimodal Potential: Scaling Models for Enhanced Learning', 'desc': 'This paper explores the benefits of native multimodal pre-training for large language models (LLMs), which allows them to learn from both text and visual data. It identifies how model size and token count can be optimized under a fixed computational budget, revealing that different scaling behaviors exist for language and multimodal objectives. The research shows that while language learning remains stable across various data compositions, multimodal learning is sensitive to the ratio of text to visual data. Ultimately, the study provides a framework for efficiently scaling multimodal models, enhancing their reasoning capabilities in both text and visual contexts.'}}}, {'id': 'https://huggingface.co/papers/2607.21503', 'title': 'Agentic Context Management: Solving Agent Memory and Cost by Treating Them as Lifecycle and Architecture Problems', 'url': 'https://huggingface.co/papers/2607.21503', 'abstract': "Abstract  Production AI agents' failures are less often due to an inability to reason well and more often because they cannot manage what is in their reasoning context: conversation histories, large prompts, large tool definitions, and ballooning tool outputs. Agents drown in their own accumulating history while paying a token cost that grows every turn, producing missing recalls within and across conversations. The incumbent response treats this as a storage-and-retrieval problem. We argue that framing is too narrow. Actively managing what an agent holds in mind is a lifecycle, not merely a store: it spans deciding what to remember, extracting and structuring it, choosing the right store per data type, consolidating and forgetting while preserving provenance, deciding what is relevant now, anticipating what is needed next, and compacting context to a budget without losing what matters. In serious production this operates not over a single user but across an organizational scope hierarchy. We name this discipline Agentic Context Management (ACM) and decompose it into five primitives: architecting, ingesting, scoping, anticipating, and compacting & consolidation. We then make the economic case: naive context accumulation grows token cost quadratically in conversation length, crude summarization buys linear cost at the price of an accuracy cliff, and only validated compaction achieves linear cost with preserved fidelity. We describe a reference implementation, Maximem Synap, that realizes the five primitives as a multi-tenant service and reports 92% on LongMemEval and 93.2% on LoCoMo under the configuration detailed in Section 6. We close with dimensions existing benchmarks do not yet capture, latency, token efficiency, and context-rot resistance, and the frontier of decision-level and organization-level context the category points toward.", 'score': 4, 'issue_id': 2915, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': '0776b77a92e03ead', 'github_url': '', 'github_stars': 0, 'authors': ['Gaurav Dadhich'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.21503.jpg', 'data': {'categories': ['#session_memory', '#compression', '#optimization', '#agent_memory', '#retrieval_eval', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Управление контекстом для AI-агентов', 'desc': 'В данной статье рассматриваются проблемы, с которыми сталкиваются производственные AI-агенты в управлении контекстом reasoning. Авторы утверждают, что важно активно управлять тем, что запоминает агент, а не рассматривать это как простую задачу хранения и извлечения информации. Также представлена дисциплина Agentic Context Management (ACM), которая включает пять ключевых примитивов для улучшения работы агентов. В заключение, авторы подчеркивают важность эффективного управления контекстом для уменьшения затрат токенов и повышения точности.'}, 'en': {'title': 'Mastering Context: The Key to AI Agent Efficiency', 'desc': 'This paper discusses the challenges faced by AI agents in managing their reasoning context, which includes conversation histories and tool outputs. It argues that the traditional view of context management as a storage problem is too limited, proposing a broader approach called Agentic Context Management (ACM). ACM involves a lifecycle of decisions about what to remember, how to structure information, and when to forget, all while maintaining relevance and efficiency. The authors present a system called Maximem Synap that implements these concepts and demonstrates significant improvements in performance metrics.'}}}, {'id': 'https://huggingface.co/papers/2607.22375', 'title': 'IDEAgent: Agentic Quality-Diversity Search for Research Idea Generation', 'url': 'https://huggingface.co/papers/2607.22375', 'abstract': 'Abstract  Large Language Models (LLMs) have significantly automated the process of scientific discovery over the past few years. However, existing systems share one core limitation: they generate and optimize ideas independently for either Quality or Diversity. This often leads to the generation of ideas in close proximity to one another or to a large set of trivial, unsound, or unclear concepts. In this work, we instead argue that research ideation should be treated as a conjunction of both objectives and framed as a Quality-Diversity (QD) search. In line with this perspective, we introduce IDEAgent, a multi-agent framework that manages the evolution of ideas through lineages. We jointly drive Quality using multi-objective feedback for dedicated repair and refinement, while Diversity is achieved through lightweight sequential memory and explicit comparison against completed ideas, their historical ancestors, and rejected proposals. To systematically evaluate this QD conjunction, we develop Yield, a joint metric that computes the largest set of mutually diverse ideas that satisfy a predetermined quality threshold. Finally, through evaluations across 32 topics spanning 8 domains of Computer Science, we show that IDEAgent outperforms the best baseline by 3.89x on Yield, while achieving non-zero Yield on 8x more topics. We further corroborate these findings through an analysis of quality improvements, showing that repair and refinement are crucial for building logical rigor and clarity while preserving non-obviousness. To encourage future research on QD-search-based ideation, we open-source IDEAgent at https://github.com/declare-lab/IDEAgent.', 'score': 3, 'issue_id': 2914, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '4e2d6469b6b1e812', 'github_url': '', 'github_stars': 0, 'authors': ['Varun Gumma', 'Navonil Majumder', 'Soumitra Sinhahajari', 'Soujanya Poria'], 'affiliations': ['DeCLaRe Lab, Nanyang Technological University, Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.22375.jpg', 'data': {'categories': ['#training', '#science', '#open_source', '#agents', '#optimization'], 'emoji': '💡', 'ru': {'title': 'Новый подход к генерации идей: качество и разнообразие вместе', 'desc': 'Статья посвящена разработке нового подхода к генерации идей в научных исследованиях с использованием LLM. Авторы предлагают рассматривать генерирование идей как соединение двух задач: качества и разнообразия, что помогает избежать создания однотипных или нечетких концепций. В рамках работы представлен фреймворк IDEAgent, который управляет эволюцией идей через линии развития с использованием обратной связи. Результаты показывают, что IDEAgent значительно превосходит существующие системы по оценке качества и разнообразия идей.'}, 'en': {'title': 'Revolutionizing Research Ideation with Quality-Diversity Search', 'desc': 'This paper presents IDEAgent, a multi-agent framework designed to enhance the ideation process in scientific discovery by integrating Quality and Diversity objectives. Traditional systems often focus on either generating high-quality ideas or a diverse set of ideas, leading to limitations in creativity and soundness. IDEAgent addresses this by using multi-objective feedback for quality improvement and a memory system for maintaining diversity among ideas. The framework is evaluated across various topics, demonstrating significant improvements in generating diverse and high-quality research ideas.'}}}, {'id': 'https://huggingface.co/papers/2607.22393', 'title': 'SceneActBench: Can Agents Act on the 3D Scenes They See?', 'url': 'https://huggingface.co/papers/2607.22393', 'abstract': 'Abstract  Vision-language model (VLM) agents increasingly use tools to act on 3D scenes rather than only describe them. Existing 3D benchmarks score textual responses or single-object operations, leaving agent action on complete multi-object 3D scenes under evaluated. We present SceneActBench, a benchmark for visually conditioned action across five 3D tasks under a unified agent-environment loop. Given PNG images or sampled video frames and, where applicable, supplied 3D assets, an agent acts on a 3D environment. We evaluate each final output against hidden ground truth with task-specific geometric metrics. SceneActBench comprises five tasks built from 210 source instances, yielding 520 task cases including paired input conditions. Every task runs through one fixed agent loop to keep the comparison fair. Across eleven proprietary VLM configurations, Overall scores span 38.6-50.2, and none performs consistently well across tasks. We further analyse where and how failures manifest.', 'score': 3, 'issue_id': 2914, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'c32d748e76057d39', 'github_url': '', 'github_stars': 0, 'authors': ['Yifei Zhao', 'Xiangxin Zhou', 'Wenhao Yang', 'Jiaqi Tang', 'Pu Jian', 'Huanjin Yao', 'Jiarui Yao', 'Haowei Lin', 'Chunchao Guo', 'Zhuo Chen', 'Wenkai Lyu', 'Jianzhu Ma', 'Xueqian Wang', 'Wenxi Zhu'], 'affiliations': ['HKUST', 'NJU', 'PKU', 'THU', 'Tencent Hunyuan', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2607.22393.jpg', 'data': {'categories': ['#agent_memory', '#games', '#agents', '#3d', '#benchmark'], 'emoji': '🖼️', 'ru': {'title': 'Новый стандарт оценки действий агентов в 3D-мире', 'desc': 'В данной статье представлен новый бенчмарк SceneActBench для оценки действий агентов на 3D-сценах, который учитывает выполнение множества задач. Этот бенчмарк включает пять различных задач и позволяет агентам взаимодействовать с 3D-средой на основе визуальных данных, таких как изображение или видео. Мы проводим оценку результатов с использованием геометрических метрик для каждой специфичной задачи. Анализ показал, что ни одна из протестированных конфигураций агентов не показывает стабильных результатов по всем задачам.'}, 'en': {'title': 'Enhancing VLMs with SceneActBench for 3D Action Evaluation', 'desc': 'This paper introduces SceneActBench, a new benchmark designed to evaluate vision-language model (VLM) agents in their ability to perform actions in complex 3D environments. Unlike previous benchmarks that focused on single-object tasks, SceneActBench assesses agents on five multi-object tasks, providing a more comprehensive evaluation of their capabilities. The benchmark uses a unified agent-environment loop and evaluates outputs against hidden ground truth using geometric metrics. Results show that while various VLM configurations were tested, none consistently excelled across all tasks, highlighting areas for improvement in agent performance.'}}}, {'id': 'https://huggingface.co/papers/2607.14277', 'title': 'Multi-Head Latent Control: A Unified Interface for LLM Agent Decision Making', 'url': 'https://huggingface.co/papers/2607.14277', 'abstract': "Abstract  Large language models are increasingly deployed as agents, but reliable agentic behavior requires more than next-token prediction. At inference time, it is preferred that an agent can decide whether to proceed with its current reasoning, defer to a stronger model, request additional information, invoke external tools, or abstain under the given setup. Existing approaches address these decisions through prompt-level routing, external orchestration, or task-specific fine-tuning, which primarily rely on input-side signals, and are often costly and difficult to maintain as model backbones evolve. We ask whether such control decisions can be inferred directly from a model's latent generation process. We introduce Multi-Head Latent Control, a lightweight layer that reads hidden-state trajectories from a frozen LLM or VLM to produce deployment-time control signals. A Capability Head predicts whether the current model can solve the instance or should defer to a stronger collaborator, while a Resolution Head predicts appropriate resolution decision Clarification, Tool Use, Abstention, or Direct Answering. Both heads are trained only on latent traces from the same frozen LLM backbone, enabling post hoc adaptation without modifying the model. Across language and vision-language settings, Multi-Head Latent Control consistently improves the quality-cost tradeoff of multi-model systems, enabling early handoff from partial generations and more accurate intervention decisions. In routed execution (small + large model), it reduces large-model usage by up to 90.7 percent on AndroidWorld and 27-53 percent on average across benchmarks, while retaining most of large-model performance. Additionally, the learned control signals improve tool-use decision quality, yielding up to +158 percent relative score gain and 65.5 percent fewer missed-required tool calls.", 'score': 3, 'issue_id': 2915, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'd72914d1ed62da63', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#agent_memory', '#agents', '#tool_use', '#inference'], 'emoji': '🤖', 'ru': {'title': 'Управление решениями для больших языковых моделей', 'desc': 'В данной статье рассматривается, как управлять поведением больших языковых моделей (LLM) в качестве агентов. Авторы предлагают инновационный подход под названием Multi-Head Latent Control, который использует скрытые состояния замороженной модели для принятия решений во время выполнения. Такой подход позволяет агенту определять, стоит ли продолжать свою работу, обращаться к более сильной модели или использовать внешние инструменты. Результаты показывают значительное улучшение в эффективности многомодельных систем без необходимости модификации основной модели.'}, 'en': {'title': 'Empowering Language Models with Latent Control for Smarter Decisions', 'desc': "This paper introduces Multi-Head Latent Control, a method that enhances the decision-making capabilities of large language models (LLMs) during inference. Instead of relying solely on input signals, this approach uses the model's internal hidden states to generate control signals for various actions, such as deferring to a stronger model or using external tools. The method includes two prediction heads: one for determining if the model can handle a task and another for deciding the best course of action. By leveraging latent traces from a frozen LLM, this technique improves efficiency and reduces reliance on larger models while maintaining performance."}}}, {'id': 'https://huggingface.co/papers/2607.22042', 'title': 'LAMAR: An Open Language-Aware Multilingual Alignment Reranker', 'url': 'https://huggingface.co/papers/2607.22042', 'abstract': 'Abstract  In multilingual retrieval augmented generation, a retriever can retrieve relevant documents written in multiple languages, which are subsequently reranked before answer generation. However, it remains unclear whether existing multilingual rerankers consider document language when ordering semantically relevant candidates. Our analysis shows that these rerankers do not consistently prioritize documents written in the same language as the query when semantically equivalent documents are available across languages, even though document language can affect answer generation. We release LAMAR, a language aware multilingual cross encoder trained to account for both semantic relevance and language coherence. LAMAR first uses English anchored relevance distillation to establish consistent relevance scoring across multilingual inputs and then applies preference alignment for language coherence to encourage documents written in the same language as the query to receive higher rankings while retaining semantic relevance. In a controlled experiment designed to assess language coherence, LAMAR achieves the best performance overall and across all languages examined individually. LAMAR also remains competitive on established multilingual reranking benchmarks. In practical retrieval settings, LAMAR achieves the best results across all reported metrics when reranking candidates retrieved in the first stage. These results demonstrate that LAMAR accounts for language coherence while achieving strong performance on general multilingual reranking benchmarks.', 'score': 2, 'issue_id': 2914, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': 'd509368841508292', 'github_url': '', 'github_stars': 0, 'authors': ['Seongtae Hong', 'Youngjoon Jang', 'Jungseob Lee', 'Seungyoon Lee', 'Heuiseok Lim'], 'affiliations': ['Korea University'], 'pdf_title_img': 'assets/pdf/title_img/2607.22042.jpg', 'data': {'categories': ['#retrieval_eval', '#rag', '#alignment', '#multilingual', '#retrieval', '#machine_translation'], 'emoji': '🌍', 'ru': {'title': 'Языковая согласованность для мультиязычной переработки', 'desc': 'В данной статье рассматривается метод мультиязычной переработки информации с использованием модели LAMAR, которая учитывает языковую согласованность при ранжировании документов. Исследование показывает, что существующие многомодульные ранжировщики не всегда придают приоритет документам на том же языке, что и запрос. LAMAR использует двухступенчатый процесс: сначала оценка семантической релевантности, затем выравнивание предпочтений по языковым параметрам. В экспериментах LAMAR демонстрирует наилучшие результаты по всем языкам и метрикам, подтверждая важность языковой согласованности.'}, 'en': {'title': 'Enhancing Multilingual Retrieval with Language Awareness', 'desc': 'This paper introduces LAMAR, a language aware multilingual cross encoder designed to improve the reranking of documents in multilingual retrieval augmented generation. It highlights the importance of considering document language alongside semantic relevance when ordering candidates for answer generation. The model employs English anchored relevance distillation for consistent scoring and preference alignment to prioritize documents in the same language as the query. Experimental results show that LAMAR outperforms existing methods in terms of language coherence and maintains competitive performance on multilingual benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.21848', 'title': 'Closing the Loop: Training-Free Revisit Consistency for Autoregressive Generative Rendering', 'url': 'https://huggingface.co/papers/2607.21848', 'abstract': 'Abstract  Recent conditional video generation models have shown promising potentials to transform 3D engine renderings, such as depth maps and untextured geometry, into photorealistic videos for gaming and immersive content creation. These applications require long-horizon auto-regressive generation that continuously synthesizes new frames while preserving a persistent 3D world. Auto-regressive generators synthesize video chunk by chunk with a bounded KV cache, so when the camera revisits a location after its context has been evicted, the model often regenerates inconsistent appearance, even though the conditioning renderings (e.g., depth) remain perfectly aligned with the underlying geometry.We address this revisit inconsistency without any post-training by exploiting correspondences the 3D engine already provides: temporal correspondence retrieves pose-matched historical latent chunks into the KV cache as loop-closure memory, while spatial correspondence from camera pose and depth reprojection biases token-level attention toward geometrically corresponding regions of the retrieved chunks. We demonstrate our method on loop-closure trajectories mined from TartanAir and TartanGround dataset to mirror complicate real-world application scenarios, where it outperforms existing training-free baselines on revisit consistency without losing overall video quality. Project Page: https://wenchao-m.github.io/ClosetheLoop.github.io/', 'score': 2, 'issue_id': 2914, 'pub_date': '2026-07-23', 'pub_date_card': {'ru': '23 июля', 'en': 'July 23', 'zh': '7月23日'}, 'hash': 'd076d3e68ab77e42', 'github_url': '', 'github_stars': 0, 'authors': ['Wenchao Ma', 'Changran Liu', 'Sharon X. Huang', 'Haomiao Jiang'], 'affiliations': ['Roblox', 'The Pennsylvania State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.21848.jpg', 'data': {'categories': ['#games', '#memory', '#long_context', '#3d', '#retrieval'], 'emoji': '🎮', 'ru': {'title': 'Устранение несоответствий в генерации видео', 'desc': 'В данной статье рассматриваются новые модели генерации видео, которые могут превращать 3D рендеры в фотореалистичные видео для игр. Проблема состоит в том, что при возвращении камеры в уже просмотренные места генераторы часто создают визуальные несоответствия. Мы предлагаем решение этой проблемы, используя временные и пространственные соответствия из 3D движка для улучшения консистентности. Наш метод показывает высокие результаты на данных TartanAir и TartanGround, превосходя существующие методы без обучения.'}, 'en': {'title': 'Enhancing Video Consistency in 3D Environments', 'desc': 'This paper presents a method to improve the consistency of video generation in 3D environments, particularly when the camera revisits locations. It addresses the issue of inconsistent appearances in auto-regressive video generation by utilizing temporal and spatial correspondences from 3D engine data. The approach retrieves historical video segments as memory and biases attention towards relevant areas, ensuring that the generated frames remain coherent. The method is tested on datasets like TartanAir and TartanGround, showing better performance in revisit consistency without compromising video quality.'}}}, {'id': 'https://huggingface.co/papers/2607.12756', 'title': 'VisCo: Leveraging Large Language Models as Intrinsic Encoders for Visual Token Compression', 'url': 'https://huggingface.co/papers/2607.12756', 'abstract': "Abstract  Vision-language models (VLMs) process large numbers of visual tokens, resulting in substantial inference latency and memory overhead. This has motivated extensive research on visual token compression. While training-free strategies rely on heuristic metrics and suffer significant performance degradation under high compression ratios, many training-based methods introduce external compression modules that force the VLM backbone to adapt, incurring substantial retraining cost and compromising VLMs' priors. Effective visual token compression hinges on strong information encoding, a capability already present in pretrained VLMs but underutilized by existing approaches. Motivated by this, we propose VisCo, a training-efficient self-compression framework that reuses the pretrained VLM itself as an intrinsic compressor. VisCo is a parameter-sharing autoencoder that compresses visual information using a small set of memory tokens and transfers hierarchical information from encoding to decoding. Experiments show that VisCo surpasses prior methods across all evaluated compression ratios, with larger gains under more aggressive compression, and remains stable even in the extreme single-token setting. Moreover, when combined with the original visual tokens, the learned memory tokens can even improve the base model, suggesting that VisCo captures complementary representations beyond compression.", 'score': 1, 'issue_id': 2914, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '80bf9d6b6d7148a4', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#inference', '#compression', '#memory', '#optimization'], 'emoji': '📉', 'ru': {'title': 'Эффективное сжатие визуальных токенов с VisCo', 'desc': 'Статья посвящена улучшению эффективности обработки визуальных токенов в моделях визуально-языкового понимания (VLM). Предложен новый подход VisCo, который использует уже обученные VLM для самосжатия информации, минимизируя затраты на переобучение. Этот метод показывает значительное улучшение производительности по сравнению с предыдущими стратегиями, особенно при высокой степени сжатия. VisCo может даже улучшить качество исходной модели, комбинируя изученные токены с оригинальными визуальными токенами.'}, 'en': {'title': 'Efficient Visual Token Compression with VisCo', 'desc': "This paper introduces VisCo, a self-compression framework for vision-language models (VLMs) that efficiently compresses visual tokens. Unlike traditional methods that either rely on heuristics or require extensive retraining, VisCo utilizes the pretrained VLM itself as a compressor, minimizing the need for additional training. The framework employs a parameter-sharing autoencoder to encode and decode visual information using a limited number of memory tokens, effectively transferring hierarchical data. Experimental results demonstrate that VisCo outperforms existing compression techniques, especially under high compression ratios, and can enhance the base model's performance when combined with original visual tokens."}}}];

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agent_memory (4)', '#agents (4)', '#agi', '#alignment (1)', '#architecture', '#audio', '#benchmark (1)', '#compression (2)', '#context_window', '#continual_learning (1)', '#data', '#dataset', '#diffusion', '#ethics', '#games (2)', '#graphs', '#hallucinations', '#healthcare', '#inference (2)', '#interpretability', '#knowledge_graphs', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation (1)', '#math', '#memorization', '#memory (2)', '#multilingual (1)', '#multimodal (1)', '#open_source (2)', '#optimization (5)', '#plp', '#prompt_caching', '#prompting', '#rag (1)', '#reasoning (2)', '#retrieval (2)', '#retrieval_eval (2)', '#rl (2)', '#rlhf', '#robotics', '#science (1)', '#security', '#session_memory (1)', '#small_models', '#story_generation', '#survey', '#synthetic', '#tool_use (2)', '#training (4)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-27 06:29',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-27 06:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-27 06:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
