rogrammatic judges can achieve similar performance to a large LLM while improving efficiency and reducing API costs significantly.'}}}, {'id': 'https://huggingface.co/papers/2607.24651', 'title': 'Evidence Attribution in Visual Document Understanding without Coordinates or Region Labels', 'url': 'https://huggingface.co/papers/2607.24651', 'abstract': 'Abstract  Reliable visual document understanding requires a model to attribute each answer to the evidence regions that support it. Recent benchmarks and systems express this step through a coordinate interface: the model outputs the coordinates of bounding boxes that mark the evidence regions in the document. Under this interface, vision-language models often fail to identify the right regions even when the answer is correct, a failure known as Attribution Hallucination. We present a study that investigates whether this failure is partially limited by what the model can express through coordinates. On a verified bilingual CiteVQA subset, we compare the coordinate interface with a language interface in which the model outputs only text, quoting its evidence verbatim, and a multimodal retriever returns the location of each quote as a page region proposed by a layout parser (tables and figures are quoted through their captions or notes); the comparison is repeated over six open vision-language models. Compared with the coordinate interface, evidence recall rises from at most 8 points to between 26 and 47 and the hallucination rate roughly halves, with little change in answer quality. Building on this comparison, we use the same quote-and-retrieve pipeline as a training scaffold: because region-level evidence labels are expensive to collect for long documents, we introduce a GRPO recipe whose reward is a judge\'s reading of the gold answer and crops of the retrieved regions, training the model to quote better evidence without any region labels and raising an 8B backbone\'s strict attributed accuracy from 22.4 to 33.8. These findings indicate a practical path to improve attribution"without a coordinate interface and without costly region-level supervision.', 'score': 1, 'issue_id': 2921, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'c776bc28c651a758', 'github_url': '', 'github_stars': 0, 'authors': ['Zhuchenyang Liu', 'Yao Zhang', 'Yu Xiao'], 'affiliations': ['Aalto University Espoo, Finland'], 'pdf_title_img': 'assets/pdf/title_img/2607.24651.jpg', 'data': {'categories': ['#retrieval', '#training', '#benchmark', '#hallucinations', '#multimodal', '#optimization'], 'emoji': '📄', 'ru': {'title': 'Улучшение атрибуции без координатного интерфейса', 'desc': 'В статье рассматривается проблема надежного понимания визуальных документов с помощью моделей, основанных на машинном обучении. Исследование показывает, что использование текстового интерфейса вместо координатного может значительно улучшить качество извлечения доказательных данных, снижая уровень ложных атрибуций, известный как Attribution Hallucination. Описанный метод позволяет модели лучше ссылаться на текстовые фрагменты, избегая зависимости от сложной разметки регионов. В результате, точность атрибуции повысилась, а необходимость в дорогой разметке документальных регионов снизилась.'}, 'en': {'title': 'Enhancing Document Understanding: From Coordinates to Quotes', 'desc': 'This paper addresses the challenge of reliable visual document understanding by focusing on how models attribute answers to supporting evidence regions. It highlights a problem called Attribution Hallucination, where models provide correct answers but fail to identify the correct evidence regions using a coordinate interface. The authors compare this approach with a language interface that quotes evidence directly, showing significant improvements in evidence recall and reduced hallucination rates. They propose a novel training method that enhances model performance without the need for expensive region-level labels, demonstrating a practical way to improve attribution in document understanding tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.23242', 'title': 'IndicTalk: A Large-Scale Persona-Based Multilingual Conversational Corpus for Indic Languages', 'url': 'https://huggingface.co/papers/2607.23242', 'abstract': 'Abstract  Large Language Models (LLMs) have transformed conversational AI, yet high-quality multilingual code-mixed dialogue resources remain scarce, particularly for Indic languages where speakers naturally alternate between English and their native language in both native-script and Romanized forms. We present IndicTalk, one of the largest multilingual Indic code-mixed conversational corpora, comprising over 13,28,604 event-grounded multi-turn conversations across 18 language varieties covering 9 Indic languages. The corpus is generated through a fully automated pipeline that combines real-world news grounding, persona-conditioned dialogue generation using multilingual LLMs, and automatic quality validation. Extensive linguistic, automatic, and human evaluations demonstrate that IndicTalk produces fluent, coherent, and naturally code-mixed conversations across both script variants. We will release IndicTalk to support the development and evaluation of multilingual conversational AI for underrepresented Indic languages. The dataset is available at: https://huggingface.co/datasets/LingoIITGN/IndicTalk .', 'score': 1, 'issue_id': 2921, 'pub_date': '2026-07-25', 'pub_date_card': {'ru': '25 июля', 'en': 'July 25', 'zh': '7月25日'}, 'hash': '774005cba5256ce3', 'github_url': '', 'github_stars': 0, 'authors': ['Sahil Deepak Gawande', 'Mayank Singh'], 'affiliations': ['Lingo Research Group IIT Gandhinagar'], 'pdf_title_img': 'assets/pdf/title_img/2607.23242.jpg', 'data': {'categories': ['#dataset', '#multilingual', '#open_source', '#low_resource'], 'emoji': '💬', 'ru': {'title': 'IndicTalk: Корпус для мультиязычных разговоров на языках Индии', 'desc': 'В данной статье представлена база данных IndicTalk, которая является одной из крупнейших многозначных разговорных корпус для языков Индии, смешивающих код. Она содержит более 1,3 миллиона многоповоротных разговоров на 9 индийских языках, где пользователи естественным образом переключаются между английским и своим родным языком. Корпус был создан с помощью автоматизированного процесса, который включает генерацию диалогов и оценку качества. IndicTalk поможет в развитии многозначного AI для недостаточно представленных индийских языков.'}, 'en': {'title': 'Empowering Conversational AI with IndicTalk', 'desc': 'This paper introduces IndicTalk, a large multilingual dataset designed for code-mixed conversations in Indic languages. It includes over 1.3 million multi-turn dialogues that reflect natural language use, combining both native-script and Romanized forms. The dataset is generated using an automated pipeline that incorporates real-world news and multilingual large language models for dialogue generation. IndicTalk aims to enhance the development of conversational AI for underrepresented Indic languages by providing a resource for training and evaluation.'}}}, {'id': 'https://huggingface.co/papers/2607.21936', 'title': 'Leveraging External Knowledge for Historical Document Restoration via Retrieval-Augmented Large Language Models', 'url': 'https://huggingface.co/papers/2607.21936', 'abstract': 'Abstract  Historical documents act as invaluable knowledge archives but often suffer from illegibility due to physical deterioration and damage. While existing restoration methods based on masked language modeling effectively utilize local context, they struggle to restore named entities that require external historical knowledge. To address this limitation, we introduce a novel framework for historical document restoration that leverages large language models with retrieval-augmented generation (RAG). By combining the implicit knowledge of pre-trained LLMs with explicitly retrieved external context, our model ARI effectively mitigates the challenge of inferring context-dependent proper nouns. Extensive experiments on Korean historical documents demonstrate that our approach significantly outperforms baselines, achieving substantial gains in restoring both general characters and named entities. Furthermore, comprehensive evaluations including expert assessments confirm that ARI serves as a practical tool for domain experts, promising to accelerate the analysis of historical records.', 'score': 1, 'issue_id': 2921, 'pub_date': '2026-07-24', 'pub_date_card': {'ru': '24 июля', 'en': 'July 24', 'zh': '7月24日'}, 'hash': '5ea44d51749a9827', 'github_url': '', 'github_stars': 0, 'authors': ['Gabeen Kim', 'Kyeongpil Kang'], 'affiliations': ['Department of AI Convergence, Kangwon National University', 'Department of Computer Science and Engineering, Kangwon National University'], 'pdf_title_img': 'assets/pdf/title_img/2607.21936.jpg', 'data': {'categories': ['#retrieval', '#science', '#rag', '#multimodal', '#retrieval_eval'], 'emoji': '📜', 'ru': {'title': 'Восстановление исторических документов с помощью LLM и RAG', 'desc': 'Исторические документы являются важными архивами знаний, но они часто трудны для чтения из-за физического износа. Существующие методы восстановления с использованием masked language modeling эффективно используют локальный контекст, но имеют сложности с восстановлением именованных сущностей, требующих внешних исторических знаний. Мы представляем новую структуру восстановления исторических документов, которая использует большие языковые модели с извлечением и генерированием (RAG). Наш подход значительно превосходит базовые методы и подтвержден экспертными оценками как полезный инструмент для анализа исторических записей.'}, 'en': {'title': 'Reviving History: Enhanced Restoration of Historical Documents', 'desc': 'This paper presents a new method for restoring historical documents that are often hard to read due to damage. The proposed framework uses large language models combined with retrieval-augmented generation (RAG) to improve the restoration process. By integrating external historical knowledge, the model effectively restores named entities that traditional methods struggle with. Experiments show that this approach significantly outperforms existing techniques, making it a valuable tool for experts analyzing historical records.'}}}, {'id': 'https://huggingface.co/papers/2607.23822', 'title': 'DriveDNA: A Large-Scale Multimodal Naturalistic Driving Dataset and Benchmark for Driving Style Identification', 'url': 'https://huggingface.co/papers/2607.23822', 'abstract': 'Abstract  Driving style captures stable, driver-specific patterns in how a vehicle is driven. In naturalistic data, however, this signal is hard to isolate because drivers are observed in different vehicles, on different roads, and under different conditions, so models may mistake vehicle- or situation-specific regularities for driver-specific style. We introduce DriveDNA, a large-scale naturalistic dataset and benchmark for personalized driving-style modeling, comprising 4,121 drives from 465 drivers across 115 vehicle models and totaling 975 hours of human-controlled driving at 10 Hz with forward video, collected from community drivers in everyday use. DriveDNA defines driving style as a consistent, driver-specific behavioral pattern in how a vehicle moves under similar conditions. The benchmark evaluates this signal through three core tasks: few-shot driver re-identification, personalized behavior prediction, and condition-matched comparison, and provides behavioral annotations plus 276,248 rule-generated maneuver events across six classes with large-scale human auditing. We evaluate baselines spanning classical descriptors, supervised and self-supervised time-series encoders, multimodal fusion, probabilistic prediction, and zero-shot foundation models under a fixed multi-seed protocol. Learned representations substantially outperform classical descriptors on unseen drivers (AUROC .935 vs. .707) and retain driver-specific information under matched driving conditions, while descriptor performance approaches chance. Video-only models achieve comparable re-identification accuracy but exhibit severe route leakage, showing that strong recognition may arise from contextual shortcuts rather than driving behavior. These findings show that reliable driving-style evaluation must assess both the behavioral value of learned representations and their robustness to vehicle, drive, and condition confounds.', 'score': 0, 'issue_id': 2920, 'pub_date': '2026-07-26', 'pub_date_card': {'ru': '26 июля', 'en': 'July 26', 'zh': '7月26日'}, 'hash': '61d42bb9ba4d9200', 'github_url': '', 'github_stars': 0, 'authors': ['Yuhang Wang', 'Lingyao Li', 'Hao Zhou'], 'affiliations': ['University of Arizona', 'University of South Florida'], 'pdf_title_img': 'assets/pdf/title_img/2607.23822.jpg', 'data': {'categories': ['#security', '#transfer_learning', '#dataset', '#benchmark', '#multimodal'], 'emoji': '🚗', 'ru': {'title': 'Новый взгляд на стиль вождения с DriveDNA', 'desc': 'Статья представляет DriveDNA, новый набор данных и бенчмарк для моделирования стиля вождения, включающий 4,121 поездку от 465 водителей на 115 моделях автомобилей. Исследование подчеркивает трудности в выделении стиля вождения водителям из-за влияния различных условий. DriveDNA позволяет оценить стиль вождения через задачи, такие как повторная идентификация водителей и предсказание поведения. Результаты показывают, что обученные представления значительно превосходят традиционные дескрипторы в оценке стиля вождения.'}, 'en': {'title': 'DriveDNA: Unraveling Personalized Driving Styles', 'desc': 'This paper presents DriveDNA, a comprehensive dataset and benchmark designed to model personalized driving styles. It addresses the challenge of distinguishing driver-specific behaviors from vehicle and situational influences in naturalistic driving data. The benchmark includes tasks like few-shot driver re-identification and personalized behavior prediction, supported by extensive behavioral annotations. Results show that advanced learned representations significantly outperform traditional methods in recognizing driver-specific patterns while maintaining robustness against various driving conditions.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (1)', '#agent_memory (6)', '#agents (8)', '#agi (2)', '#alignment', '#architecture (6)', '#audio', '#benchmark (12)', '#compression', '#context_window', '#continual_learning (1)', '#data (5)', '#dataset (9)', '#diffusion (4)', '#ethics', '#games (2)', '#graphs', '#hallucinations (3)', '#healthcare (1)', '#inference (2)', '#interpretability (2)', '#knowledge_graphs', '#leakage', '#long_context (3)', '#low_resource (1)', '#machine_translation', '#math', '#memorization', '#memory (3)', '#multilingual (1)', '#multimodal (10)', '#open_source (8)', '#optimization (11)', '#plp', '#prompt_caching', '#prompting', '#rag (1)', '#reasoning (5)', '#retrieval (4)', '#retrieval_eval (1)', '#rl (5)', '#rlhf (1)', '#robotics (1)', '#science (2)', '#security (1)', '#session_memory', '#small_models', '#story_generation', '#survey (1)', '#synthetic', '#tool_use (2)', '#training (11)', '#transfer_learning (4)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-28 08:32',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-28 08:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-28 08:32')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
