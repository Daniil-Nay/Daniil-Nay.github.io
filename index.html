    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        const articlesData = [{'id': 'https://huggingface.co/papers/2606.19271', 'title': 'TurboServe: Serving Streaming Video Generation Efficiently and Economically', 'url': 'https://huggingface.co/papers/2606.19271', 'abstract': 'Abstract TurboServe is a specialized serving system for streaming video generation that addresses session state management and dynamic resource allocation challenges through integrated scheduling, autoscaling, and migration mechanisms.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Streaming video generation is emerging as a new serving workload in which users interact with long-lived sessions that generate video progressively, chunk by chunk. Unlike offline video generation or typical LLM serving, streaming video generation must preserve session state across active and idle periods, repeatedly schedule ongoing sessions, and deliver each chunk under a tight latency target. This creates two key serving challenges in multi-user, multi-GPU environments: session duration heterogeneity, where long-running sessions make placement decisions suboptimal over time, and temporal user-demand heterogeneity, where the number of active sessions fluctuates sharply across bursts and idle periods.   We present TurboServe, the first serving system designed specifically for streaming video generation workloads. TurboServe formulates serving as an online scheduling problem that jointly coordinates session placement and GPU provisioning. Its closed-loop scheduling algorithm combines a migration-aware placement controller, which rebalances sessions across GPUs to reduce the maximum per-chunk latency, with a load-driven autoscaling controller, which adapts the GPU budget to workload variation for improved cost efficiency. To support these decisions at runtime, TurboServe implements coalesced chunk processing for batching concurrent active sessions on the same GPU, GPU-CPU offloading for session suspension and resumption, and NCCL-based GPU-GPU migration for online rebalancing. We evaluate TurboServe on real-world production traces from Shengshu Technology across multiple model sizes and GPU clusters with up to 64 NVIDIA B300 GPUs. Compared with baseline serving configurations, TurboServe reduces worst-case per-chunk latency by 37.5% and total GPU operating cost by 37.2% on average. Our code is publicly available at https://github.com/shengshu-ai/TurboServe.', 'score': 8, 'issue_id': 2749, 'pub_date': '2026-06-17', 'pub_date_card': {'ru': '17 июня', 'en': 'June 17', 'zh': '6月17日'}, 'hash': 'd6edbd79909d888a', 'github_url': '', 'github_stars': 0, 'authors': ['Youhe Jiang', 'Haoxu Wang', 'Haotong Bao', 'Kai Jiang', 'Jianfei Chen', 'Jun Zhu', 'Fangcheng Fu', 'Jintao Zhang'], 'affiliations': ['Shanghai Jiao Tong University', 'Shengshu Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2606.19271.jpg', 'data': {'categories': ['#optimization', '#inference', '#open_source', '#session_memory', '#agents'], 'emoji': '🎥', 'ru': {'title': 'Эффективное потоковое видео с TurboServe', 'desc': 'Статья описывает систему TurboServe, разработанную для потоковой генерации видео с акцентом на управление состоянием сессий и динамическим распределением ресурсов. TurboServe решает проблему оптимального размещения и выделения GPU посредством алгоритма онлайн-расписания, который учитывает продолжительность сессий и колебания пользовательского спроса. Система использует алгоритмы управления миграцией и авто-масштабирования, что позволяет снижать задержки при генерации видео до 37,5% и оптимизировать затраты на операции GPU. В результате TurboServe улучшает эффективность работы в многопользовательских и много-GPU средах.'}, 'en': {'title': 'TurboServe: Optimizing Streaming Video Generation with Smart Resource Management', 'desc': 'TurboServe is a specialized system designed for streaming video generation, focusing on managing session states and dynamically allocating resources. It addresses challenges like session duration variability and fluctuating user demand by formulating serving as an online scheduling problem. The system employs a closed-loop scheduling algorithm that optimizes session placement and GPU resource allocation to minimize latency and improve cost efficiency. Through techniques like coalesced chunk processing and GPU migration, TurboServe significantly enhances performance, reducing latency and operational costs in multi-GPU environments.'}}}, {'id': 'https://huggingface.co/papers/2607.00666', 'title': 'Domain Arithmetic: One-Shot VLA Adaptation under Environmental Shifts', 'url': 'https://huggingface.co/papers/2607.00666', 'abstract': 'Abstract Vision-Language-Action models can be efficiently adapted to new environments using a single demonstration through weight vector arithmetic that isolates domain-specific information via subspace alignment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) models often fail to perform the same learned tasks under environmental shifts, such as changes in camera pose and shifts to a different but similar robot (e.g., from Panda to UR5e). Adapting these models to the shifted environment (i.e., target domain) often requires training on multiple demonstrations for each task, which are costly to collect. To reduce the burden of data curation and training, we propose an analogy-based method that adapts VLA models under environmental shifts through weight vector arithmetic with domain-specific information addition, named Domain ARiThmetic (DART). Unlike prior approaches, DART requires collecting only a single demonstration, enabling efficient adaptation. To accurately isolate domain-specific information for addition, DART performs subspace alignment between singular components in weight vectors to filter out noisy components. In both simulated and real-world experiments, DART outperforms existing VLA adaptation methods in one-shot scenarios across diverse visual and embodiment shifts. Code is available at https://github.com/snumprlab/dart.', 'score': 6, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'cef66cdb6d3f45e8', 'github_url': '', 'github_stars': 0, 'authors': ['Taewook Kang', 'Taeheon Kim', 'Donghyun Shin', 'Jonghyun Choi'], 'affiliations': ['Seoul National University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00666.jpg', 'data': {'categories': ['#optimization', '#dataset', '#transfer_learning', '#agents', '#training', '#data'], 'emoji': '🔧', 'ru': {'title': 'Эффективная адаптация моделей VLA с помощью одной демонстрации', 'desc': 'Модели, связывающие видение, язык и действия (VLA), могут быть эффективно адаптированы к новым условиям с помощью одной демонстрации, применяя арифметику весов для изоляции специфичной информации. В данной работе представлен метод под названием Domain ARiThmetic (DART), который позволяет адаптировать модели VLA к измененным условиям без необходимости в многократных демонстрациях. DART использует выравнивание подпространства для фильтрации ненужных компонентов в векторах весов, что улучшает точность адаптации. Проведенные эксперименты показывают, что DART превосходит существующие методы адаптации в сценариях с одним примером.'}, 'en': {'title': 'Efficient One-Shot Adaptation for VLA Models', 'desc': 'This paper introduces Domain ARiThmetic (DART), a method for adapting Vision-Language-Action (VLA) models to new environments using only a single demonstration. DART utilizes weight vector arithmetic to isolate and add domain-specific information through subspace alignment, which helps filter out noise. This approach significantly reduces the need for multiple demonstrations, making the adaptation process more efficient. Experimental results show that DART outperforms existing methods in one-shot adaptation scenarios across various visual and embodiment changes.'}}}, {'id': 'https://huggingface.co/papers/2607.01104', 'title': 'CausalMix: Data Mixture as Causal Inference for Language Model Training', 'url': 'https://huggingface.co/papers/2607.01104', 'abstract': 'Abstract CausalMix addresses limitations in LLM data mixing by formulating mixture optimization as a causal inference problem, enabling dynamic adaptation to shifting data distributions without costly retraining.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In Large Language Model (LLM) training, data mixing plays a pivotal role in determining model performance. Recent methods optimize mixture weights via proxy models, but they rely on the assumption of static data distributions. As a result, when the underlying data pool shifts, these methods require costly retraining from scratch. This limitation restricts their ability to scale seamlessly from small settings to larger data pools and model sizes. In this paper, we propose CausalMix to address this limitation by casting data mixture optimization as a causal inference problem. We formulate the statistical features of the data pool as covariates and the domain mixture as the treatment. After fitting a causal model on 512 runs of Qwen2.5-0.5B to estimate the Conditional Average Treatment Effect (CATE), we extrapolate the optimal mixture for an 800K data pool and apply it to train a 7B model. Furthermore, we successfully generalize the framework to long chain-of-thought data on Qwen3-4B-Base. By leveraging causal modeling to isolate confounding biases, CausalMix dynamically infers state-dependent optimal data mixtures. Extensive experiments show that the mixture guided by CausalMix consistently improves performance across multiple downstream tasks, outperforming RegMix and other baselines. In addition, we use the CATE Interpreter to provide visual analysis of the learned mixing strategy. Overall, CausalMix offers a causal and interpretable framework for optimizing LLM data mixtures.', 'score': 5, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '886477985019fb9a', 'github_url': '', 'github_stars': 0, 'authors': ['Zinan Tang', 'Yukun Zhang', 'Shaomian Zheng', 'Zhuoshi Pan', 'Qizhi Pei', 'Dingnan Jin', 'Jun Zhou', 'Yujun Wang', 'Biqing Huang'], 'affiliations': ['Ant Group', 'Renmin University of China', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01104.jpg', 'data': {'categories': ['#interpretability', '#optimization', '#training', '#data'], 'emoji': '🔄', 'ru': {'title': 'Динамическое смешивание данных для LLM', 'desc': 'В статье CausalMix рассматриваются ограничения традиционного подхода к смешиванию данных в обучении LLM. Авторы предлагают новый метод, который формулирует оптимизацию смешивания как задачу причинного вывода, что позволяет динамически адаптироваться к изменяющимся распределениям данных без необходимости дорогого переобучения. Это решение помогает улучшить производительность модели, особенно при работе с большими наборами данных. Эксперименты показывают, что метод CausalMix превосходит другие подходы, обеспечивая более эффективное смешивание данных.'}, 'en': {'title': 'Dynamic Data Mixing through Causal Inference', 'desc': 'CausalMix introduces a new approach to optimize data mixing in large language models (LLMs) by treating it as a causal inference problem. This method allows for dynamic adaptation to changes in data distributions without the need for expensive retraining. By estimating the Conditional Average Treatment Effect (CATE), CausalMix identifies the best data mixtures for different model sizes and tasks. The framework not only enhances performance across various applications but also provides interpretable insights into the mixing strategy used.'}}}, {'id': 'https://huggingface.co/papers/2606.20997', 'title': 'BioInsight: Multi-Agent Orchestration for Interactive Biomedical Knowledge Discovery', 'url': 'https://huggingface.co/papers/2606.20997', 'abstract': 'Abstract BioInsight is a multi-agent system that transforms static biomedical reports into interactive, evidence-centered interfaces by organizing disease-specific evidence through structured artifacts and deterministic citation normalization.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Biomedical researchers increasingly use AI-generated analyses and reports to interpret protein-level signals, but static outputs are often insufficient for research decision-making, where users need to inspect evidence, assess uncertainty, compare mechanisms, and refine hypotheses. We present BioInsight, a multi-agent system that moves from static biomedical report generation to interactive evidence-centered interactive interface generation. Given a disease name, a protein association table, and optional cohort metadata, BioInsight organizes disease-specific evidence through typed intermediate artifacts, including ranked pathways, literature evidence packets, protein-level reasoning notes, citation-grounded reports, dashboard schemas, and rendered interactive interfaces. The system decomposes evidence retrieval from mechanistic reasoning, normalizes citations through deterministic components, and converts the same structured evidence used in the report into an interactive interface. We evaluate BioInsight on standardized biomedical QA, challenging protein-function reasoning, and end-to-end biomedical evidence synthesis. Results show that BioInsight achieves best, and suggest that biomedical AI systems should move beyond text-only and static reports toward provenance-preserving, interactive evidence artifacts.', 'score': 5, 'issue_id': 2749, 'pub_date': '2026-06-19', 'pub_date_card': {'ru': '19 июня', 'en': 'June 19', 'zh': '6月19日'}, 'hash': 'd48ac28c58b21c29', 'github_url': '', 'github_stars': 0, 'authors': ['Jieyi Wang', 'Bingxuan Li', 'Nanyi Jiang', 'Desong Meng', 'Zirui Fan', 'Yuxin Guo', 'Jiayu Liu', 'Kunlun Zhu', 'Eddie Yang', 'Xiusi Chen', 'Pan Lu', 'Bingxin Zhao'], 'affiliations': ['Peking University', 'Purdue University', 'Stanford University', 'University of Illinois at Urbana-Champaign', 'University of Pennsylvania'], 'pdf_title_img': 'assets/pdf/title_img/2606.20997.jpg', 'data': {'categories': ['#agents', '#interpretability', '#reasoning', '#agent_memory', '#healthcare', '#science', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Переход к интерактивным биомедицинским интерфейсам', 'desc': 'BioInsight — это многоагентная система, которая преобразует статические биомедицинские отчеты в интерактивные интерфейсы, ориентированные на доказательства. Она структурирует данные о заболеваниях и нормализует цитаты, обеспечивая более глубокое понимание информации. Исследователи могут взаимодействовать с доказательствами, оценивать неопределенности и сравнивать механизмы на основе информации о белках. Результаты показывают, что такие системы ИИ должны перейти от статических текстовых отчетов к интерактивным артефактам, сохраняющим достоверность.'}, 'en': {'title': 'Transforming Static Reports into Interactive Evidence Interfaces', 'desc': 'BioInsight is a multi-agent system designed to enhance the usability of biomedical reports by transforming them into interactive, evidence-centered interfaces. It organizes disease-specific evidence using structured artifacts and normalizes citations to improve clarity and accessibility. This system allows researchers to inspect evidence, assess uncertainty, and refine hypotheses, moving beyond static outputs. Evaluation results indicate that BioInsight outperforms traditional methods, highlighting the need for interactive and provenance-preserving biomedical AI systems.'}}}, {'id': 'https://huggingface.co/papers/2607.00678', 'title': 'ABot-M0.5: Unified Mobility-and-Manipulation World Action Model', 'url': 'https://huggingface.co/papers/2607.00678', 'abstract': 'Abstract ABot-M0.5 is a World Action Model for mobile manipulation that improves performance through temporal granularity alignment, action space disentanglement, and train-test consistency in autoregressive prediction.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Mobile manipulation is a key capability for general-purpose robots, yet remains challenging for current embodied learning methods. VLA policies are typically reactive and lack explicit world modeling, while existing World Action Models (WAMs) are still poorly aligned with the structure of mobile manipulation: they operate on coarse video chunks, model entangled navigation-manipulation actions, and train inverse dynamics under supervision that does not match autoregressive inference. As a result, they often miss fine-grained contact dynamics, suffer from action-distribution conflicts, and accumulate errors over long-horizon rollouts. We propose ABot-M0.5, a new WAM built on the insight that mobile manipulation requires alignment at three levels: temporal granularity, action space, and train-test consistency. To align temporal granularity, we introduce intermediate latent actions that capture local visual state transitions and serve as an bridging action space between video latents and embodiment-specific controls. To align action space, we design a dual-level Mixture-of-Transformers architecture that disentangles both modality representations and heterogeneous action subspaces such as base movement and arm manipulation. To align inference conditions, we propose the dream-forcing training strategy that progressively trains inverse dynamics on model-predicted videos, improving train-test alignment and robustness during autoregressive prediction. Experiments on challenging mobile and fine-grained manipulation benchmarks demonstrate that ABot-M0.5 achieves state-of-the-art performance in both long-horizon task success and finegrained control accuracy. These results highlight the critical importance of granularity-aligned, action-disentangled, and inference-consistent world-action modeling.', 'score': 2, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '187208957ddebdbd', 'github_url': '', 'github_stars': 0, 'authors': ['Ronghan Chen', 'Yandan Yang', 'Zuojin Tang', 'Dongjie Huo', 'Tong Lin', 'Haoning Wu', 'Haoyun Liu', 'Yuzhi Chen', 'Lulu Zheng', 'Botai Yuan', 'Tianlun Li', 'Mingxin Wang', 'Dekang Qi', 'Bin Hu', 'Wei Mei', 'Yuze Xuan', 'Haolong Yang', 'Yanqing Zhu', 'Mu Xu', 'Zhiheng Ma', 'Xinyuan Chang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.00678.jpg', 'data': {'categories': ['#robotics', '#optimization', '#agents', '#benchmark', '#architecture', '#training', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Новая модель для мобильной манипуляции', 'desc': 'ABot-M0.5 — это новая модель мира для мобильной манипуляции, которая улучшает производительность за счет выравнивания временной гранулярности, разъединения пространства действий и согласованности между обучением и тестированием. Эта модель учитывает, что мобильная манипуляция требует внимания на трех уровнях: временной гранулярности, пространстве действий и условиях вывода. В экспериментах на сложных задачах мобильной манипуляции она достигла выдающихся результатов в долгосрочном успехе задач и точности контроля. Эти результаты подчеркивают важность гранулярного выравнивания и надежного моделирования действий в мире.'}, 'en': {'title': 'Aligning Actions for Superior Mobile Manipulation', 'desc': 'ABot-M0.5 is a World Action Model designed to enhance mobile manipulation in robots by aligning temporal granularity, disentangling action spaces, and ensuring consistency between training and testing. It introduces intermediate latent actions to better capture local visual transitions and connects video data to specific robot controls. The model employs a dual-level Mixture-of-Transformers architecture to separate different types of actions, such as movement and manipulation. Through a novel dream-forcing training strategy, ABot-M0.5 improves the robustness of predictions, achieving state-of-the-art results in complex manipulation tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.01131', 'title': 'Autonomous Scientific Discovery via Iterative Meta-Reflection', 'url': 'https://huggingface.co/papers/2607.01131', 'abstract': 'Abstract An autonomous scientific discovery framework uses large language models and dynamic code generation to conduct open-ended research while maintaining statistical rigor through meta-reflection and multimodal data processing.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Autonomous scientific discovery systems offer the potential to accelerate research by automating the process of hypothesis generation and validation. However, current systems operate within constrained search spaces or require predefined research questions, limiting their capacity for true open-ended inquiry. Furthermore, while they generate hypotheses iteratively, they largely lack the ability to explicitly synthesize their own accumulated findings to uncover complex, interconnected phenomena. We introduce DiscoPER, an autonomous large language model-powered framework that conducts open-ended research by dynamically generating and executing code to explore datasets without pre-specified research objectives. To ensure rigorous scientific validity, every proposed discovery must pass statistical testing. To overcome the limitations of isolated search, our framework introduces a second-order reasoning mechanism that periodically analyzes its own accumulated discoveries. By treating prior discoveries as empirical data, DiscoPER identifies structural patterns, confounds, and epistemic gaps, actively redirecting hypothesis exploration toward uncharted regions of the search space. The search space is further expanded by incorporating tool use, enabling the system to explore hypotheses beyond structured metadata by seamlessly processing and extracting useful information from multimodal sources like images. Evaluated on iNatDisco, a new multimodal ecological knowledge benchmark with pattern-level ground truth obtained from peer-reviewed literature, DiscoPER recovers 8 of 9 known patterns with a 72.7% hypothesis support rate, outperforming both classical causal discovery and LLM-guided baselines. Ablations show that DiscoPER scales with more data, and confirms the benefits of second-order meta-reflection.', 'score': 1, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'ab7073ea73e0dae1', 'github_url': '', 'github_stars': 0, 'authors': ['Bingchen Zhao', 'Sara Beery', 'Oisin Mac Aodha'], 'affiliations': ['Massachusetts Institute of Technology', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2607.01131.jpg', 'data': {'categories': ['#tool_use', '#science', '#multimodal', '#reasoning', '#benchmark', '#agents', '#dataset', '#agi'], 'emoji': '🔍', 'ru': {'title': 'Автономные исследования без границ', 'desc': 'Данная статья представляет новый фреймворк DiscoPER, который использует большие языковые модели для автономного проведения открытых исследований. Он генерирует и выполняет код для анализа данных без заранее определенных исследовательских вопросов, что позволяет проводить более свободные и глубокие исследования. Для обеспечения научной строгости каждая предложенная находка проходит статистическое тестирование. Кроме того, система анализирует свои предыдущие открытия, что помогает выявлять сложные взаимосвязи и расширять пространство поиска.'}, 'en': {'title': 'Unlocking Open-Ended Research with DiscoPER', 'desc': 'This paper presents DiscoPER, an autonomous framework that leverages large language models for open-ended scientific research. It dynamically generates and executes code to explore datasets without needing predefined research questions, allowing for more flexible hypothesis generation. DiscoPER incorporates a second-order reasoning mechanism to analyze its own discoveries, identifying patterns and gaps in knowledge. The framework has been evaluated on a new ecological benchmark, demonstrating its ability to recover known patterns and outperform traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2606.31551', 'title': 'AutoTrainess: Teaching Language Models to Improve Language Models Autonomously', 'url': 'https://huggingface.co/papers/2606.31551', 'abstract': 'Abstract AutoTrainess enables autonomous language model training by providing structured agent-computer interfaces that guide planning, data preparation, training, evaluation, and logging operations more effectively than traditional command-line approaches.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Training language models (LMs) remains a highly human-intensive process, even as frontier language model agents become increasingly capable at software engineering and other long-horizon tasks. A central challenge is that autonomous post-training is not just a coding problem: it requires the agent to repeatedly plan iterations, construct benchmark-aligned data, run stable training jobs, evaluate checkpoints, and preserve experiment state across many hours of interaction. We present AutoTrainess, a LM agent that exposes these operations as a repository of agent-computer interfaces for planning, data preparation, training, evaluation, and logging. Rather than leaving the agent to operate in a raw CLI environment with an underspecified action space, AutoTrainess externalizes prior human experience as explicit workflows, rules, and execution constraints that guide the agent toward effective and reliable training behavior. On PostTrainBench, AutoTrainess consistently outperforms CLI-only baselines, achieving 26.94 average score with GPT-5.4 (Codex) versus 23.21 for CLI-only. It also generalizes across models and harnesses, improving DeepSeek-V4-Flash (OpenCode) from 12.13 to 19.58.', 'score': 1, 'issue_id': 2749, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'e1e7af7362f7ee85', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#agents', '#agent_memory', '#benchmark', '#training', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Автономное обучение языковых моделей с AutoTrainess', 'desc': 'Статья представляет AutoTrainess - новый инструмент для автономного обучения языковых моделей. С помощью интерфейсов взаимодействия агент-компьютер, он облегчает планирование, подготовку данных, обучение и оценку. AutoTrainess использует структурированные рабочие процессы, что позволяет агентам более эффективно справляться с задачами, чем традиционные командные интерфейсы. Результаты показывают, что AutoTrainess обеспечивает значительно лучшие результаты по сравнению с методами, основанными только на CLI.'}, 'en': {'title': 'Streamlining Language Model Training with AutoTrainess', 'desc': 'AutoTrainess is a system that helps automate the training of language models by providing structured interfaces for various tasks like planning, data preparation, and evaluation. This approach is more effective than traditional command-line methods, which can be cumbersome and less organized. The system allows language model agents to follow clear workflows and rules, making the training process more reliable and efficient. In tests, AutoTrainess showed better performance than CLI-only methods, demonstrating its ability to improve training outcomes across different models.'}}}, {'id': 'https://huggingface.co/papers/2607.01191', 'title': 'Perceive-to-Reason: Decoupling Perception and Reasoning for Fine-Grained Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.01191', 'abstract': 'Abstract A unified framework named Perceive-to-Reason (P2R) is introduced that separates visual perception from reasoning in vision-language models through a two-stage process, improving fine-grained visual reasoning performance on high-resolution images.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Fine-grained visual reasoning remains challenging for vision-language models, especially when small but critical visual cues are buried in high-resolution images. Existing approaches rely on repeated cropping or test-time visual search to introduce local evidence, but they typically do not explicitly distinguish perception from reasoning. In this paper, we propose Perceive-to-Reason (P2R), a unified framework that formulates fine-grained visual reasoning as a two-stage process: the model first localizes question-relevant evidence as a Perceiver, and then answers the question as a Reasoner based on the annotated image and cropped regions. To better align training with this decoupled formulation, we further introduce Perception-Reasoning Alternating GRPO (PRA-GRPO), a role-aware reinforcement learning strategy that alternates between perception-focused and reasoning-focused updates using only final-answer supervision. Built on top of Qwen3-VL-Instruct-2B/4B/8B, P2R consistently improves performance across model scales. In particular, P2R-4B achieves 93.2% on V-Star, 81.9% on HR-Bench-4K, and 80.5% on HR-Bench-8K, substantially outperforming its corresponding backbone. Further experiments show that the benefits of P2R extend beyond high-resolution benchmarks to broader multimodal reasoning tasks. These results suggest that explicitly decoupling perception from reasoning provides an effective framework for fine-grained visual reasoning.', 'score': 0, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '7ef72500e48a5ab2', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#rl', '#reasoning', '#benchmark', '#training', '#multimodal'], 'emoji': '🖼️', 'ru': {'title': 'Разделение восприятия и рассуждения для точного визуального анализа', 'desc': 'В статье представлен единый фреймворк под названием Perceive-to-Reason (P2R), который разделяет визуальное восприятие и рассуждение в моделях зрительно-языкового взаимодействия. Этот подход улучшает качество точного визуального рассуждения на высококачественных изображениях, локализуя ключевые визуальные подсказки. P2R формирует процесс визуального рассуждения в два этапа: сначала модель находит важные элементы изображения, а затем отвечает на вопрос на основе этих данных. Также вводится метод обучения PRA-GRPO, который чередует обновления, ориентированные на восприятие и рассуждение, используя только информацию о финальном ответе.'}, 'en': {'title': 'Decoupling Perception and Reasoning for Enhanced Visual Understanding', 'desc': 'The paper introduces a framework called Perceive-to-Reason (P2R) that separates visual perception from reasoning in vision-language models. This two-stage process first identifies relevant visual evidence before answering questions, enhancing fine-grained visual reasoning on high-resolution images. The authors also present a reinforcement learning strategy, PRA-GRPO, which alternates between perception and reasoning updates using final-answer supervision. Results show that P2R significantly improves performance across various benchmarks, indicating that decoupling these processes is beneficial for multimodal reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.00917', 'title': 'Valdi: Value Diffusion World Models', 'url': 'https://huggingface.co/papers/2607.00917', 'abstract': 'Abstract Value Diffusion World Models combine end-to-end online training with latent diffusion dynamics to enable fast, uncertain dynamics prediction for Model Predictive Control in reinforcement learning environments.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct World models can enable Model Predictive Control (MPC), but this requires dynamics prediction that is both fast enough for online use and expressive enough to represent uncertain futures. Diffusion models offer a natural mechanism for modeling uncertain dynamics, yet their iterative inference procedure makes them difficult to use for low-latency latent planning. We bridge this gap with Value Diffusion World Models (Valdi), combining end-to-end online training for MPC with a latent diffusion dynamics model. In preliminary experiments on the CarRacing environment, we show that Valdi, using a single diffusion step at both training and inference, matches a deterministic MLP baseline. Our experiments expose a trade-off between predictive multimodality and control performance in this setup. Code is available at https://github.com/Kit115/ValueDiffusionWorldModels.', 'score': 0, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'fea067ba8398b27f', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#optimization', '#agents', '#rl', '#diffusion', '#training', '#games'], 'emoji': '🚗', 'ru': {'title': 'Эффективное управление неопределенной динамикой', 'desc': 'Статья описывает новый подход к моделированию динамики в контексте управления с помощью Model Predictive Control (MPC) при помощи Value Diffusion World Models (Valdi). Эти модели сочетают онлайн-обучение и латентную диффузионную динамику для быстрого предсказания неопределенных динамик. Они значительно упрощают процесс предсказания за счет использования одного шага диффузии на этапе обучения и вывода. Эксперименты показывают компромисс между многомодальным предсказанием и эффективностью управления.'}, 'en': {'title': 'Fast and Uncertain Dynamics Prediction for Reinforcement Learning', 'desc': 'Value Diffusion World Models (Valdi) integrate online training with latent diffusion dynamics to enhance Model Predictive Control (MPC) in reinforcement learning. This approach allows for rapid and uncertain dynamics prediction, which is crucial for effective decision-making in dynamic environments. By utilizing a single diffusion step during both training and inference, Valdi achieves performance comparable to traditional deterministic models. The research highlights a balance between the ability to predict multiple future scenarios and the overall control performance.'}}}, {'id': 'https://huggingface.co/papers/2606.31292', 'title': 'AtomiMed: Hierarchical Atomic Fact-Checking for Universal Clinical-Aware Medical Report Evaluation', 'url': 'https://huggingface.co/papers/2606.31292', 'abstract': 'Abstract AtomiMed presents a novel evaluation framework for medical report generation that decomposes clinical narratives into atomic facts and uses an agentic cross-verification process to improve accuracy assessment beyond traditional metrics.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Traditional metrics for Medical Report Generation (MRG) predominantly rely on surface-level n-gram overlap, which fails to capture clinical factual accuracy and often overlooks catastrophic diagnostic errors. We address this fundamental limitation by proposing AtomiMed, a universal, modality-agnostic evaluation framework that decomposes complex medical narratives into a standardized, multi-level hierarchy of Atomic Clinical Facts, encompassing Disease-level entities and Attribute-level descriptors, including location, morphology, and severity. By implementing an Agentic Cross-Verification loop between ground-truth and predicted reports, AtomiMed simulates a multi-radiologist peer-review process to verify clinical consistency, thus enabling the decoupled assessment of diagnostic detection and descriptive accuracy. To facilitate standardized evaluation, we introduce MRGEvalKit, an open-source toolkit for automated hierarchical extraction, and curate OmniMRG-Bench, a comprehensive multi-modal benchmark covering X-ray, CT, MRI, and Ultrasound. Extensive experiments on multiple expert-annotated reader studies demonstrate that AtomiMed achieves significantly higher correlation with human radiologist judgment compared to traditional and model-based metrics. Our code are release at https://github.com/Venn2336/MRGEvalkit', 'score': 0, 'issue_id': 2749, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '9c090f8612915941', 'github_url': '', 'github_stars': 0, 'authors': ['Yuan Wang', 'Wanxing Chang', 'Songtao Jiang', 'Shujian Gao', 'Xiaotian Zhang', 'Ruifeng Yuan', 'Weiwei Cao', 'Bowen Shi', 'Ling Zhang', 'Zuozhu Liu', 'Jianpeng Zhang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2606.31292.jpg', 'data': {'categories': ['#evaluation', '#healthcare', '#open_source', '#benchmark'], 'emoji': '🩺', 'ru': {'title': 'Новая эра оценки медицинских отчетов', 'desc': 'AtomiMed представляет новую оценочную платформу для генерации медицинских отчетов, которая разбивает клинические истории на атомарные факты. Она использует процесс кросс-проверки, чтобы улучшить оценку точности за пределами традиционных метрик. Платформа может анализировать сложные медицинские нарративы, создавая стандартизированную иерархию атомарных клинических фактов. AtomiMed проводит проверку согласованности отчетов, имитируя процесс независимой оценки, что позволяет более точно оценивать диагностику и описательную точность.'}, 'en': {'title': 'Revolutionizing Medical Report Evaluation with Atomic Facts', 'desc': 'AtomiMed introduces a new evaluation framework for generating medical reports that breaks down clinical narratives into basic facts. It improves accuracy assessment by using an agentic cross-verification process, which goes beyond traditional metrics that often miss critical diagnostic errors. The framework organizes medical information into a structured hierarchy of Atomic Clinical Facts, allowing for a more detailed evaluation of both diagnosis and description. Additionally, AtomiMed provides an open-source toolkit and a benchmark for standardized assessment across various imaging modalities.'}}}];

        function loadSettings() {

            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agent_memory (2)', '#agents (7)', '#agi (3)', '#alignment', '#architecture (1)', '#audio', '#benchmark (5)', '#compression', '#context_window', '#continual_learning', '#data (2)', '#dataset (2)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs', '#hallucinations', '#healthcare (2)', '#inference (1)', '#interpretability (2)', '#knowledge_graphs', '#leakage', '#long_context', '#low_resource', '#machine_translation', '#math', '#memorization', '#memory', '#multilingual', '#multimodal (3)', '#open_source (2)', '#optimization (6)', '#plp', '#prompt_caching', '#prompting', '#rag', '#reasoning (3)', '#retrieval', '#retrieval_eval', '#rl (2)', '#rlhf', '#robotics (1)', '#science (2)', '#security', '#session_memory (1)', '#small_models', '#story_generation', '#survey', '#synthetic', '#tool_use (1)', '#training (6)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-02 03:44',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-02 03:44')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-02 03:44')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
