reflection.', 'score': 3, 'issue_id': 2749, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'ab7073ea73e0dae1', 'github_url': '', 'github_stars': 0, 'authors': ['Bingchen Zhao', 'Sara Beery', 'Oisin Mac Aodha'], 'affiliations': ['Massachusetts Institute of Technology', 'University of Edinburgh'], 'pdf_title_img': 'assets/pdf/title_img/2607.01131.jpg', 'data': {'categories': ['#tool_use', '#science', '#multimodal', '#reasoning', '#benchmark', '#agents', '#dataset', '#agi'], 'emoji': '🔍', 'ru': {'title': 'Автономные исследования без границ', 'desc': 'Данная статья представляет новый фреймворк DiscoPER, который использует большие языковые модели для автономного проведения открытых исследований. Он генерирует и выполняет код для анализа данных без заранее определенных исследовательских вопросов, что позволяет проводить более свободные и глубокие исследования. Для обеспечения научной строгости каждая предложенная находка проходит статистическое тестирование. Кроме того, система анализирует свои предыдущие открытия, что помогает выявлять сложные взаимосвязи и расширять пространство поиска.'}, 'en': {'title': 'Unlocking Open-Ended Research with DiscoPER', 'desc': 'This paper presents DiscoPER, an autonomous framework that leverages large language models for open-ended scientific research. It dynamically generates and executes code to explore datasets without needing predefined research questions, allowing for more flexible hypothesis generation. DiscoPER incorporates a second-order reasoning mechanism to analyze its own discoveries, identifying patterns and gaps in knowledge. The framework has been evaluated on a new ecological benchmark, demonstrating its ability to recover known patterns and outperform traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2606.32029', 'title': 'When LLMs Read Tables Carelessly: Measuring and Reducing Data Referencing Errors', 'url': 'https://huggingface.co/papers/2606.32029', 'abstract': 'Abstract Large language models exhibit data referencing errors when processing tables, which can be mitigated through critic-based filtering and rejection sampling, with a lightweight 4B-parameter model achieving high detection accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct While large language models (LLMs) perform well on table tasks, they still make data referencing errors (DREs), i.e., incorrectly citing or omitting table values, despite understanding the table structure. Beyond final-answer accuracy, DREs directly compromise the correctness and reliability of intermediate reasoning steps. Yet prior studies have only offered limited, small-scale analyses. In this work, we present the first systematic evaluation of tabular data referencing errors across different models and tasks. Our results show that DREs occur across all tested models (1.7B to 20B parameters). Furthermore, we demonstrate that incorporating data referencing as a critic significantly improves answer accuracy up to 12.0%, through critic-based filtering and rejection sampling. Finally, we trained a lightweight 4B-parameter critic model that achieves an average F1 score of 78.2% in detecting both in-distribution and out-of-distribution DREs, and effectively assists inference for larger models.', 'score': 3, 'issue_id': 2750, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '6fa27f31261d1a07', 'github_url': '', 'github_stars': 0, 'authors': ['Yuqing Yang', 'Qi Zhu', 'Zhen Han', 'Boran Han', 'Zhengyuan Shen', 'Shuai Wang', 'Vassilis N. Ioannidis', 'Huzefa Rangwala'], 'affiliations': ['AWS AI Labs', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2606.32029.jpg', 'data': {'categories': ['#inference', '#data', '#training', '#hallucinations', '#interpretability', '#reasoning', '#benchmark'], 'emoji': '📊', 'ru': {'title': 'Устранение ошибок ссылок на данные в языковых моделях', 'desc': 'В данной статье обсуждаются ошибки ссылок на данные, которые совершают большие языковые модели (LLM) при обработке таблиц. Эти ошибки возникают, когда модели неверно цитируют или упускают значения из таблиц, несмотря на понимание их структуры. Авторы предлагают использовать фильтрацию на основе критиков и отбор с отсеиванием, что значительно повышает точность ответов. Они также создали легковесную модель критика с 4 миллиардами параметров, которая эффективно обнаруживает эти ошибки и улучшает вывод для более крупных моделей.'}, 'en': {'title': 'Enhancing Table Accuracy in Language Models', 'desc': 'This paper addresses data referencing errors (DREs) in large language models (LLMs) when they process tables, which can lead to incorrect citations or omissions of table values. The authors conducted a systematic evaluation of DREs across various models and tasks, revealing that these errors are prevalent in models ranging from 1.7B to 20B parameters. They propose a solution that involves using a critic-based approach, which enhances answer accuracy by up to 12% through filtering and rejection sampling. Additionally, a lightweight 4B-parameter critic model was developed, achieving a high F1 score of 78.2% in detecting DREs, thereby improving the inference process for larger models.'}}}, {'id': 'https://huggingface.co/papers/2606.30124', 'title': 'SciIR: A Large-scale Training Dataset and Benchmark for Scientific Image Reasoning Generation', 'url': 'https://huggingface.co/papers/2606.30124', 'abstract': "Abstract Scientific image generation faces challenges in semantic alignment and logical reasoning, prompting the creation of SciIR-82k dataset and SciIR-Bench evaluation framework to improve scientific reasoning capabilities in text-to-image models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct While Text-to-Image (T2I) models have shown remarkable success in generating photorealistic visual content, they still struggle with the rigorous semantic alignment and logical reasoning required for scientific imagery. Inspired by Peirce's Semiotic Triad, we introduce Scientific Image Reasoning (SciIR), a comprehensive resource for training and evaluation of scientific image generation. We formalize scientific reasoning into three core dimensions: Entity Structure (Icon), Scientific Process (Index), and Scientific Law (Symbol). Specifically, to overcome the scarcity of training data in scientific image generation, we elaborately create SciIR-82k, a large-scale dataset containing over 80,000 high-quality scientific image-text pairs from cutting-edge publications. The dataset is hierarchically organized according to the semiotic dimensions and incorporates a Scientific Reasoning Chain-of-Thought (Sci-RCoT) to explicitly model underlying visual logic. For evaluation, we propose SciIR-Bench, which aligns with these three semiotic levels and employs an Atomic Checklist to convert the outcome-oriented scientific accuracy into process-oriented, verifiable, fine-grained questions. Our extensive experiments reveal significant deficiencies in current models' scientific reasoning capabilities. Furthermore, by fine-tuning on the SciIR-82k dataset, we developed the Qwen-Image-SciIR model, which achieves a substantial improvement on the SciIR-Bench, increasing the final score from 35\\% to 43\\%, laying a solid foundation for future advances in scientific image generation.", 'score': 3, 'issue_id': 2753, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '6d44a8e03a2c4b8f', 'github_url': '', 'github_stars': 0, 'authors': ['Zhiyuan Ma', 'Zhengfeng Shi', 'Yuning An', 'Peize Li', 'Jiabao Wei', 'Ruijie Li', 'Junhao Xiao', 'Jianjun Li', 'Bowen Zhou'], 'affiliations': ['Department of Electronic Engineering, Tsinghua University, China', 'School of Airspace Science and Engineering, Shandong University, China', 'School of Computer Science and Technology, Huazhong University of Science and Technology, China'], 'pdf_title_img': 'assets/pdf/title_img/2606.30124.jpg', 'data': {'categories': ['#science', '#training', '#benchmark', '#reasoning', '#multimodal', '#dataset'], 'emoji': '🧪', 'ru': {'title': 'Поднимаем планку научной генерации изображений!', 'desc': 'В статье рассматриваются проблемы генерации научных изображений, связанные с семантическим соответствием и логическим мышлением. Для решения этих задач была создана база данных SciIR-82k, содержащая более 80,000 высококачественных пар изображений и текстов. Также предложена оценочная система SciIR-Bench, которая учитывает три ключевых аспекта научного мышления. Эксперименты показывают, что обновленная модель Qwen-Image-SciIR значительно улучшила способности к научному мышлению в генерации изображений.'}, 'en': {'title': 'Enhancing Scientific Image Generation through Reasoning and Data', 'desc': 'This paper addresses the challenges in generating scientific images that require semantic alignment and logical reasoning. It introduces the SciIR-82k dataset, which contains over 80,000 high-quality image-text pairs, organized to support scientific reasoning. The authors propose a new evaluation framework, SciIR-Bench, that assesses models based on three semiotic dimensions: Entity Structure, Scientific Process, and Scientific Law. By fine-tuning the Qwen-Image-SciIR model on this dataset, they demonstrate improved performance in scientific reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.00407', 'title': 'Personalization as Inverse Planning: Learning Latent Design Intents for Agentic Slide Generation via Structural Denoising', 'url': 'https://huggingface.co/papers/2607.00407', 'abstract': 'Abstract Page-level slide personalization is addressed through a novel framework that formulates the problem as inverse planning and uses a multi-agent reinforcement learning approach to learn design intents without requiring specific tool knowledge.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Slide design requires personalizing both deck themes and page layouts. Yet, current AI agent-based methods struggle with fine-grained, page-level design. Solely relying on prespecified templates or user verbose instructions, they fail to capture latent design intents, leaving Page-level Slide Personalization (PSP) unresolved. To close this gap, this work formulates PSP as an inverse planning problem. We propose to learn a design intent without assuming any knowledge of the specific executing tools (e.g., PowerPoint, Beamer) being used. However, relinquishing control over these tools makes the problem intractable to optimize end-to-end. To overcome this, we propose SPIRE, a principled framework to solve PSP approximately. By intentionally corrupting the visual structures of clean slides, SPIRE creates a verifiable task to denoise the corruption, whereby two agents learn to collaboratively refine executable designs via reinforcement learning (RL). We present a proof that structural denoising is a consistent surrogate for PSP, and that the multi-agent formulation strictly reduces policy gradient variance in RL. Extensive experiments demonstrate the superiority of SPIRE.', 'score': 2, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'd0ec49ec2e5f1060', 'github_url': '', 'github_stars': 0, 'authors': ['Tianci Liu', 'Zihan Dong', 'Linjun Zhang', 'Haoyu Wang', 'jing Gao', 'Emre Kiciman', 'Ranveer Chandra', 'Wei-Ting Chen'], 'affiliations': ['Microsoft', 'Purdue University', 'Rutgers University', 'University at Albany'], 'pdf_title_img': 'assets/pdf/title_img/2607.00407.jpg', 'data': {'categories': ['#agents', '#training', '#rl', '#optimization', '#games'], 'emoji': '🎨', 'ru': {'title': 'Персонализация слайдов с помощью обучения с подкреплением', 'desc': 'В этой статье рассматривается персонализация слайдов на уровне страниц с помощью новой рамочной структуры, определяющей задачу как обратное планирование. Используя подход многопользовательского обучения с подкреплением, исследователи учатся понимать дизайнерские намерения, не полагаясь на конкретные инструменты. Основная проблема заключается в том, что существующие методы не могут точно захватить скрытые намерения дизайна. Новый фреймворк SPIRE позволяет эффективно решать эту задачу, используя подход коррекции визуальных структур слайдов.'}, 'en': {'title': 'Revolutionizing Slide Design with Multi-Agent Learning', 'desc': 'This paper introduces a new framework for page-level slide personalization (PSP) using multi-agent reinforcement learning. It formulates PSP as an inverse planning problem, allowing the system to learn design intents without needing specific tool knowledge. The proposed method, SPIRE, addresses the limitations of existing AI methods by creating a task that involves denoising corrupted slide structures. Through extensive experiments, the authors demonstrate that SPIRE effectively reduces policy gradient variance and outperforms previous approaches in generating personalized slide designs.'}}}, {'id': 'https://huggingface.co/papers/2607.00529', 'title': 'NoPA: Non-Parametric Online 3D Scene Graph Generation', 'url': 'https://huggingface.co/papers/2607.00529', 'abstract': 'Abstract NoPA introduces a non-parametric distribution-based approach for real-time 3D scene graph generation that preserves geometric details while maintaining computational efficiency through kernel density estimates and particle-based object representation.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Classic 3D scene graph generation approaches fail to work in real-time due to the heavy computational cost of environment mapping and the need to generate intermediate point-cloud representations. To alleviate this issue, a recent work eschews point clouds in favor of a lightweight Gaussian distribution for each object. This approximation drastically speeds up inference and enables real-time 3D scene graph generation. However, the representation has two key weaknesses. 1) Each object is approximated by a single 3D Gaussian, which causes a severe loss of 3D geometric detail. 2) The discrepancy between this approximation and the true object geometry exacerbates the inaccurate merging of object candidates during online inference. To address these issues, we propose NoPA, which represents each object as a separate non-parametric distribution. This formulation retains 3D geometric information while preserving real-time inference of the parametric Gaussian formulation. To build upon our novel object representation, we propose a tailored merging strategy to recover coherent object instances. Specifically, we leverage maximum mean discrepancy on kernel density estimates to enable robust merging of object candidates during online exploration while minimizing added computational complexity. The key is to maintain a fixed particle set per object. Furthermore, to rectify the relation loss caused by misclassified objects, NoPA propagates relationships between objects with high affinity. Experiments show that NoPA substantially outperforms current methods without sacrificing real-time inference speed.', 'score': 2, 'issue_id': 2750, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': 'bf96bca705f70695', 'github_url': '', 'github_stars': 0, 'authors': ['Qi Xun Yeo', 'Seungjun Lee', 'Yan Li', 'Gim Hee Lee'], 'affiliations': ['Department of Computer Science, National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.00529.jpg', 'data': {'categories': ['#inference', '#graphs', '#optimization', '#architecture', '#3d'], 'emoji': '🌐', 'ru': {'title': 'Эффективная генерация 3D сцен в реальном времени', 'desc': 'Статья представляет подход NoPA для генерации 3D графов сцен в реальном времени, который сохраняет геометрические детали при низких вычислительных затратах. Этот метод использует непараметрическое распределение и плотность ядра для представления объектов, что позволяет значительно ускорить процесс вывода. Несмотря на это, у предыдущих подходов были недостатки, связанные с потерей геометрии и неточной слиянием объектов. NoPA решает эти проблемы, сохраняя информацию о форме объектов и обеспечивая правильное объединение кандидатов объектов во время онлайн-исследования.'}, 'en': {'title': 'Real-Time 3D Scene Graphs with Non-Parametric Distributions', 'desc': 'NoPA presents a novel method for generating 3D scene graphs in real-time by using non-parametric distributions to represent objects. This approach maintains important geometric details while improving computational efficiency compared to traditional methods that rely on point clouds. By employing kernel density estimates and a tailored merging strategy, NoPA effectively merges object candidates during online inference. The results demonstrate that NoPA significantly enhances performance without compromising the speed of real-time processing.'}}}, {'id': 'https://huggingface.co/papers/2607.00115', 'title': 'PixelEyes: Decoupling Perception and Reasoning for Pinpoint Visual Evidence Seeking', 'url': 'https://huggingface.co/papers/2607.00115', 'abstract': 'Abstract Multi-turn visual reasoning agents suffer from entangled reasoning and perception that cause redundant trajectories; PixelEyes addresses this by decoupling these processes through mask-guided search and semantic-region breadth-first search, demonstrated on a new benchmark with expert-resynthesized data.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct This paper explores multi-turn visual reasoning and observes that MLLMs repeatedly fail to localize the target, leading to long, redundant trajectories. We attribute this failure to the entanglement of reasoning and perception within a single model, the MLLM reasons and localizes simultaneously, and inaccurate localization triggers additional reasoning turns that bloat the trajectory. To solve this problem, we propose PixelEyes, a multi-turn visual reasoning agent that explicitly decouples reasoning from perception, i.e., the reasoner decides what to look for, while a specialized perception tool answers where it is. Specifically, PixelEyes introduces 1) Mask-guided Visual Search. A referring segmentation model is invoked to provide mask-precise localization, freeing the reasoner from the need to compensate for imprecise grounding. 2) Semantic-region Breadth-first Search (BFS). To eliminate redundant loops caused by repeatedly cropping incorrect sub-regions, we organize exploration as a breadth-first search over semantic regions. To internalize these capabilities, we construct the PixelEyes-6K dataset by resynthesizing expert trajectories from existing data. This explicitly embeds our mask-guided search and BFS logic into the model. We further introduce Pinpoint-Bench, a zero-hint visual search benchmark, i.e., no location cues are provided in the question, with instance-level masks and bounding boxes that separate localization failures from reasoning failures, enabling fine-grained analysis of failure modes such as inattentional blindness. Recent state-of-the-art MLLMs and visual reasoning agents leave large headroom on Pinpoint-Bench, demonstrating its quality and difficulty. Code and models are open-sourced.', 'score': 2, 'issue_id': 2751, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '4813c9ec22a77009', 'github_url': '', 'github_stars': 0, 'authors': ['Dengxian Gong', 'Yuanzheng Wu', 'Haobo Yuan', 'Zhengdong Hu', 'Tao Zhang', 'Yikang Zhou', 'Shihao Chen', 'Quanzhu Niu', 'Kai Wang', 'Jason Li', 'Haochen Wang', 'Lu Qi', 'Shunping Ji', 'Ming-Hsuan Yang'], 'affiliations': ['CASIA', 'NTU', 'NUS', 'UC Merced', 'UTS', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00115.jpg', 'data': {'categories': ['#dataset', '#reasoning', '#games', '#benchmark', '#open_source', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Разделение рассуждения и восприятия для улучшения визуального поиска', 'desc': 'Статья рассматривает проблемы многоповоротного визуального рассуждения, где традиционные подходы комбинируют рассуждение и восприятие, что приводит к избыточным траекториям. Предлагаемый метод PixelEyes разделяет эти процессы, позволяя рассуждению сосредоточиться на том, что искать, а восприятию - на том, где это находится. Метод включает в себя маскированный визуальный поиск и алгоритм поиска по семантическим регионам, что улучшает точность локализации. Созданный набор данных PixelEyes-6K и бенчмарк Pinpoint-Bench позволяют анализировать ошибки визуального поиска и рассуждения.'}, 'en': {'title': 'Decoupling Reasoning and Perception for Efficient Visual Search', 'desc': 'This paper introduces PixelEyes, a multi-turn visual reasoning agent that separates reasoning from perception to improve localization accuracy. Traditional models often entangle these processes, leading to redundant reasoning turns and inefficient trajectories. PixelEyes employs mask-guided visual search for precise localization and a breadth-first search strategy to avoid repetitive exploration of incorrect areas. The authors also present a new benchmark, Pinpoint-Bench, to evaluate visual reasoning capabilities without location hints, highlighting the challenges faced by current models.'}}}, {'id': 'https://huggingface.co/papers/2606.29464', 'title': 'Rank-Aware Hyperbolic Alignment for Vision-Language Dataset Distillation', 'url': 'https://huggingface.co/papers/2606.29464', 'abstract': 'Abstract Vision-language dataset distillation method using rank-aware hyperbolic alignment to optimize synthetic image-text pairs for efficient contrastive model training while preserving modality-specific diversity.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-language dataset distillation (VLDD) compresses a large image-text paired dataset into a small set of synthetic pairs that can efficiently train contrastive vision-language models under strict data and compute budgets. Most existing methods match expert trajectories or cross-modal statistics, yet still enforce full-dimensional alignment in a Euclidean embedding space. This is often overly restrictive due to rank-deficient image--text correlation, with shared semantics concentrated in a low-dimensional range and remaining variation spread across a weakly correlated residual subspace. LoRS relaxes alignment at the similarity level by low-rank factorization, but does not explicitly control dominant alignment capacity and structure in the representation space. We thus propose a rank-aware hyperbolic alignment (RAHA) that combines hierarchical geometry with explicit alignment-capacity control. RAHA lifts multimodal representations to hyperbolic space and optimizes distilled pairs with asymmetric objectives that enforce geodesic alignment in the shared range while regularizing the residual subspace to preserve modality-private diversity and improve transfer robustness. Experiments on benchmarks show that RAHA demonstrates competitive cross-modal retrieval and improved transfer indicators under fixed budgets.', 'score': 2, 'issue_id': 2753, 'pub_date': '2026-06-28', 'pub_date_card': {'ru': '28 июня', 'en': 'June 28', 'zh': '6月28日'}, 'hash': '96a8b86424d427f6', 'github_url': '', 'github_stars': 0, 'authors': ['Jongoh Jeong', 'Sun-Kyung Lee', 'Kuk-Jin Yoon'], 'affiliations': ['Electronics and Telecommunications Research Institute (ETRI), Republic of Korea', 'Korea Advanced Institute of Science and Technology (KAIST), Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2606.29464.jpg', 'data': {'categories': ['#benchmark', '#synthetic', '#data', '#transfer_learning', '#optimization', '#games', '#multimodal', '#dataset'], 'emoji': '🖼️', 'ru': {'title': 'Оптимизация синтетических пар для улучшения обучения моделей', 'desc': 'В статье предложен метод дистилляции наборов данных для взаимодействия между изображениями и текстом, который использует ранговую гиперболическую выравнивание. Этот метод позволяет оптимизировать синтетические пары изображений и текста для эффективного обучения контрастивных моделей. Он сосредоточен на сохранении разнообразия данных, что важно для корректной обработки разных модальностей. Эксперименты показывают, что новый метод превосходит существующие подходы в задачах кросс-модального поиска и повышает устойчивость к переносу.'}, 'en': {'title': 'Efficient Dataset Distillation with Rank-Aware Hyperbolic Alignment', 'desc': "This paper presents a new method for creating smaller, efficient datasets from large image-text pairs, aimed at training contrastive vision-language models. The proposed rank-aware hyperbolic alignment (RAHA) improves upon existing methods by allowing for more flexible alignment in a hyperbolic space, which better captures the complex relationships between images and text. By focusing on low-rank structures, RAHA preserves the unique characteristics of each modality while enhancing the model's ability to transfer knowledge. Experiments show that RAHA achieves strong performance in cross-modal retrieval tasks while adhering to strict data and computational limits."}}}, {'id': 'https://huggingface.co/papers/2606.30030', 'title': 'CogSENet: Blind Image Deblurring with Blur-Conditioned Semantic Routing and Explicit Frequency Fusion', 'url': 'https://huggingface.co/papers/2606.30030', 'abstract': "Abstract CogSENet presents a novel blind image deblurring framework inspired by eagle vision, incorporating semantic-aware modules and frequency decomposition for improved restoration quality and structural fidelity.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Blind image deblurring demands the recovery of high-fidelity details and coherent structures from complex, unknown degradations. Current blind image deblurring methods struggle with real-world, spatially varying degradations, and lack the semantic awareness necessary to reliably differentiate valid textures from artifacts. To bridge this gap, we propose CogSENet, a dynamic, semantic-aligned reconstruction framework inspired by the eagle's visual system. By mimicking the eagle's active saccadic scanning, we devise a Semantic-Driven State Space Module (SDSSM) with semantic-aware token regrouping via differentiable routing, enabling prompt-conditioned long-range dependency modeling. To ensure physically interpretable recovery of textures and structures, a BiFreqFusionBlock (BFFB) mirrors functional differentiation of the eagle's retina by decomposing features into high and low frequencies using wavelet transforms. Finally, we estimate a continuous Blur Field (CBF) from blur image and fuse it with CLIP semantic priors to modulate the deepest latent features, emulating focal adaptation and enabling adaptive restoration under spatially non-uniform blur. Extensive experiments demonstrate that CogSENetoutperforms state-of-the-art deblurring methods in both visual quality and structural fidelity with fewer parameters, while also performing favorably on dehazing, deraining, and denoising tasks.", 'score': 1, 'issue_id': 2752, 'pub_date': '2026-06-29', 'pub_date_card': {'ru': '29 июня', 'en': 'June 29', 'zh': '6月29日'}, 'hash': '99d7f27fb9dfb1d3', 'github_url': '', 'github_stars': 0, 'authors': ['Pan Wang', 'Yihao Hu', 'Xiujin Liu'], 'affiliations': ['University of Michigan, Ann Arbor, MI, USA', 'University of Science and Technology of China, Hefei, China', 'Westlake University, Hangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2606.30030.jpg', 'data': {'categories': ['#dataset', '#architecture'], 'emoji': '🦅', 'ru': {'title': 'CogSENet: Восстановление изображений на основе зрения орлов', 'desc': 'CogSENet представляет собой инновационную систему для устранения размытия изображений, вдохновленную зрением орлов. Она использует семантически осознанные модули и разложение частот для повышения качества восстановления и структурной целостности. Метод позволяет эффективно различать действительные текстуры и артефакты, что является одним из основных недостатков существующих технологий. Эксперименты показывают, что CogSENet превосходит другие методы устранения размытия по качеству визуализации и структурной точности.'}, 'en': {'title': 'Eagle-Inspired Image Deblurring for Superior Quality', 'desc': 'CogSENet is a new framework for blind image deblurring that takes inspiration from how eagles see. It uses semantic-aware modules and frequency decomposition to improve the quality of restored images and maintain their structure. The framework includes a Semantic-Driven State Space Module for better understanding of textures and a BiFreqFusionBlock to separate image features into different frequency components. Experiments show that CogSENet outperforms existing methods in image quality and structure while being efficient in terms of parameters.'}}}, {'id': 'https://huggingface.co/papers/2606.26040', 'title': 'AI translation of literary texts is "fine", but readers still prefer human translations', 'url': 'https://huggingface.co/papers/2606.26040', 'abstract': 'Abstract Human readers prefer human-translated literary works over machine translations, finding the latter less immersive and harder to distinguish from human translations, despite machine translation metrics favoring the automated versions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct AI translation of literary works is increasingly common. While the content may be rendered adequately, we do not know enough about how readers experience it in terms of immersiveness and literary effect, aspects poorly captured by automatic machine translation metrics or human evaluation targeting fluency and adequacy. We ask 15 avid readers to compare recently published human translations (HT) to machine translations (MT) generated with an agentic large language model (LLM)-based pipeline, for 15 recent novels in French, Polish, and Japanese and translated into English. Readers evaluated approximately 8K-word excerpts in two conditions: immersive reading of the whole excerpt (30 comparisons) and close reading of 386 aligned HT-MT chunk pairs (772 comparisons), with two readers per book and in alternating order of presentation. Overall, readers find MT "fine", but prefer HT (slightly at excerpt-level 19/30, more clearly at chunk-level 522/772) for its ease, clarity, and immersive nature. Readers\' highlights show that MT\'s quality varies more within one book than HT\'s does. Crucially, readers cannot reliably tell the two apart (17/30 guess correctly) and tend to prefer the version they believe to be human. Automatic metrics, including LLM-as-a-judge approaches, fail to recover reader preferences and favor MT. We release LAIT (Literary AI Translation), a reader-centered evaluation dataset with 1K reader comments, 2K judgments and preference ratings, and 7.2K span-level annotations, along with our evaluation protocol and supporting interface.', 'score': 1, 'issue_id': 2750, 'pub_date': '2026-06-24', 'pub_date_card': {'ru': '24 июня', 'en': 'June 24', 'zh': '6月24日'}, 'hash': 'cebc278ffaf4a428', 'github_url': '', 'github_stars': 0, 'authors': ['Yves Ferstler', 'Adam Podoxin', 'Ty Brassington', 'Roman Grundkiewicz', 'Maite Taboada', 'Marzena Karpinska'], 'affiliations': ['Université du Québec à Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2606.26040.jpg', 'data': {'categories': ['#machine_translation', '#dataset', '#ethics', '#multilingual'], 'emoji': '📚', 'ru': {'title': 'Читатели выбирают человеческие переводы!', 'desc': 'В данной статье исследуется предпочтение читателей при выборе литературных переводов. Читатели предпочитают переводы, выполненные людьми, а не машинным переводом, несмотря на то, что автоматические метрики могут показывать преимущества машинного перевода. Авторы провели сравнение человеческих и машинных переводов с использованием LLM на 15 новеллах на французском, польском и японском языках, что показало, что качество перевода варьируется, и читатели предпочитают переводы людей за их естественность и погружающий эффект. Также было замечено, что автоматические метрики не отражают истинные предпочтения читателей.'}, 'en': {'title': 'Human Touch Triumphs: Readers Prefer Human Translations Over Machine', 'desc': "This paper investigates how readers perceive human translations (HT) versus machine translations (MT) of literary works. Despite MT being rated favorably by automatic metrics, human readers prefer HT for its clarity and immersive quality. The study involved 15 avid readers comparing excerpts from novels translated by both methods, revealing that while MT is considered 'fine', HT is favored for deeper engagement. The authors introduce the LAIT dataset to better capture reader preferences, highlighting the limitations of current automatic evaluation methods."}}}];

                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-02 16:49',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-02 16:49')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-02 16:49')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
