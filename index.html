    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');
                    currentLang = flag.dataset.lang;
                    localStorage.setItem('selectedLang', currentLang);
                    updateTimeDiffs();
                    updateLocalization();
                    filterAndRenderArticles();
                });
            });
        }
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.11683', 'title': 'RAGU: A Multi-Step GraphRAG Engine with a Compact Domain-Adapted LLM', 'url': 'https://huggingface.co/papers/2607.11683', 'abstract': 'Abstract  Graph retrieval-augmented generation (GraphRAG) enhances large language models with structured knowledge, yet existing systems construct knowledge graphs in a single extraction pass, producing noisy entities and brittle retrieval. RAGU, an open-source modular GraphRAG engine, addresses this by separating extraction from consolidation: entities and relations pass through two-stage typed extraction, DBSCAN-backed deduplication, LLM summarization, and Leiden community detection. A key insight motivates a compact extractor: the skills an in-pipeline LLM needs - comprehension, extraction, reasoning over context - are language skills that grow only weakly with model size, unlike factual world knowledge. Accordingly, we train Meno-Lite-0.1, a 7B model optimized for language skills, which outperforms Qwen2.5-32B on knowledge-graph construction (+12.5% relative harmonic mean) and matches it on English GraphRAG tasks. On GraphRAG-Bench (Medical), RAGU retrieves the most complete context at every factoid level (evidence recall up to 0.84 vs. leq0.76) and overtakes HippoRAG2 on synthesis tasks; on multi-hop factoid QA, the apparent HippoRAG2 advantage is shown to be largely an answer-format artifact. RAGU is installable via pip install graph_ragu, runs on a single GPU, and is released under MIT. The source code is publicly available at https://github.com/RaguTeam/RAGU, and the Meno-Lite-0.1 model can be obtained from https://huggingface.co/bond005/meno-lite-0.1.', 'score': 100, 'issue_id': 2861, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': 'fe6308bc8ae2c770', 'github_url': '', 'github_stars': 0, 'authors': ['Mikhail Komarov', 'Ivan Bondarenko', 'Stanislav Shtuka', 'Oleg Sedukhin', 'Roman Shuvalov', 'Yana Dementyeva', 'Matvey Solovyov', 'Nikolay O. Nikitin'], 'affiliations': ['Far Eastern Federal University', 'ITMO University', 'Independent Researcher', 'Novosibirsk State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.11683.jpg', 'data': {'categories': ['#dataset', '#graphs', '#retrieval', '#rag', '#open_source'], 'emoji': '🔍', 'ru': {'title': 'Новый подход к построению графов знаний в ML', 'desc': 'Статья посвящена улучшению генерации текстов с использованием структурированных знаний в большой модели языка через GraphRAG. Представлена новая система RAGU, которая разделяет процессы извлечения и консолидации данных, что позволяет избежать шума и повысить надежность. В системе обучена модель Meno-Lite-0.1, оптимизированная для языковых навыков, которая превосходит более крупные модели в построении графов знаний. RAGU показывает высокие показатели в тестах по извлечению и синтезу информации, гарантируя качество и полноту контекста.'}, 'en': {'title': 'Enhancing Knowledge Graphs with RAGU', 'desc': 'The paper introduces RAGU, a modular engine for Graph retrieval-augmented generation (GraphRAG) that improves the construction of knowledge graphs. It separates the processes of entity extraction and consolidation, utilizing techniques like DBSCAN for deduplication and LLM summarization. A new model, Meno-Lite-0.1, is trained to enhance language skills, outperforming larger models in knowledge-graph construction. RAGU demonstrates superior performance in retrieving complete context and synthesis tasks, making it a valuable tool for structured knowledge integration.'}}}, {'id': 'https://huggingface.co/papers/2606.29538', 'title': 'RESOURCE2SKILL: Distilling Executable Agent Skills from Human-Created Multimodal Resources', 'url': 'https://huggingface.co/papers/2606.29538', 'abstract': 'Abstract  Skills are a useful abstraction for software agents, turning human and agent experience into reusable procedural knowledge. Yet existing skill libraries are mostly hand-written, text-centric, or derived from agent traces, leaving tutorial videos and other multimodal human resources largely underused. We present RESOURCE2SKILL, a framework that distills multimodal resources, including tutorial videos, repositories, articles, and reference artifacts, into executable skills for software agents. RESOURCE2SKILL organizes these skills as a hierarchical multimodal Skill Wiki, where each entry combines structured text, code, visual examples, metadata, and provenance. This design preserves complementary signals from different resources: videos capture temporal operations and visual effects, code captures executable tool patterns, and articles or artifacts provide conceptual and stylistic grounding. At inference time, agents retrieve and compose relevant skills from the wiki; when coverage is insufficient, the same construction operator can acquire new skills online. Across seven practical authoring domains, RESOURCE2SKILL improves average overall score by +11.9 percentage points over no-skill agents and outperforms strong harness baselines in 26 of 28 main-aggregate model-domain cells. Ablations confirm the value of multimodal skill format, hierarchical organization, source diversity, selection strategy, and online acquisition.', 'score': 87, 'issue_id': 2862, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '422642d8c73cd277', 'github_url': '', 'github_stars': 0, 'authors': ['Yijia Fan', 'Zonglin Di', 'Zimo Wen', 'Yifan Yang', 'Mingxi Cheng', 'Qi Dai', 'Bei Liu', 'Kai Qiu', 'Yue Dong', 'Ji Li', 'Chong Luo'], 'affiliations': ['Microsoft Research', 'Shanghai Jiao Tong University', 'University of California, Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2606.29538.jpg', 'data': {'categories': ['#retrieval', '#multimodal', '#tool_use', '#training', '#agent_memory', '#agents'], 'emoji': '📚', 'ru': {'title': 'Преобразование знаний в навыки для агентов', 'desc': 'В статье представлен RESOURCE2SKILL — фреймворк, который преобразует мультимодальные ресурсы, такие как обучающие видео и статьи, в исполняемые навыки для программных агентов. Эти навыки организованы в иерархическую мультимодальную вики, где каждый элемент сочетает текст, код и визуальные примеры. Такой подход сохраняет информацию из различных источников: видео отражают временные операции, код демонстрирует исполняемые шаблоны, а статьи обеспечивают концептуальные основы. Показано, что RESOURCE2SKILL значительно улучшает производительность агентов по сравнению с теми, у кого нет навыков.'}, 'en': {'title': 'Transforming Multimodal Resources into Executable Skills', 'desc': 'The paper introduces RESOURCE2SKILL, a framework that transforms various multimodal resources, such as tutorial videos and articles, into executable skills for software agents. It organizes these skills in a hierarchical Skill Wiki, combining structured text, code, and visual examples to enhance learning. This approach allows agents to leverage diverse information sources, improving their performance in practical tasks. The framework demonstrates significant improvements in skill acquisition and execution, outperforming traditional methods in multiple domains.'}}}, {'id': 'https://huggingface.co/papers/2607.16051', 'title': 'Loop the Loopies!', 'url': 'https://huggingface.co/papers/2607.16051', 'abstract': 'Abstract  We present Loopie, the most powerful looped Transformer to date. The Loopie series consists of two Mixture-of-Experts (MoE) models: a 20B-parameter model with 2B active parameters and a 6Bparameter model with 0.6B active parameters. Looped Transformers have long faced a challenge: given an N-fold increase in pre-training compute, increasing the parameter count by a factor of N usually outperforms looping a model N times. Loopie addresses this challenge. Extensive ablation studies, including comparisons with a vanilla 30B-A3B model, show that Loopie substantially outperforms vanilla Transformer baselines trained with the same compute budget. Our novel post-training pipeline equips Loopie with strong reasoning abilities. At the 2025 IMO and IPhO, Loopie achieves gold-medal performance without tools.', 'score': 51, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '2e709d98c4009b6f', 'github_url': '', 'github_stars': 0, 'authors': ['Zitian Gao', 'Yilong Chen', 'Yihao Xiao', 'Xinyu Yang', 'Ran Tao', 'Joey Zhou', 'Bryan Dai'], 'affiliations': ['IQuest Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.16051.jpg', 'data': {'categories': ['#architecture', '#training', '#reasoning', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Loopie: Прорыв в трансформерах!', 'desc': 'Статья представляет Loopie, самый мощный трансформер с петлями на сегодняшний день. Серия Loopie включает модели Mixture-of-Experts (MoE) с 20 миллиардами параметров и 6 миллиардами параметров, каждая из которых имеет активные параметры для эффективной работы. Loopie решает проблему, когда увеличение количества параметров не всегда приводит к лучшему качеству в сравнении с увеличением вычислительных мощностей. Проведенные исследования показывают, что Loopie значительно превышает производительность традиционных трансформеров при одинаковом бюджете вычислений и обладает отличными способностями к рассуждению.'}, 'en': {'title': 'Loopie: Revolutionizing Looped Transformers with MoE', 'desc': 'Loopie is a new type of looped Transformer that improves on previous models by using a Mixture-of-Experts (MoE) approach. It includes two models with different parameter sizes, allowing for efficient computation while maintaining high performance. Loopie overcomes the limitations of traditional looping by demonstrating that it can outperform models with a higher parameter count when trained with the same resources. Its advanced post-training techniques enhance its reasoning capabilities, leading to exceptional results in competitive settings.'}}}, {'id': 'https://huggingface.co/papers/2607.15330', 'title': 'Xiaomi-Robotics-1: Scaling Vision-Language-Action Models with over 100K Hours of Real-World Trajectories', 'url': 'https://huggingface.co/papers/2607.15330', 'abstract': 'Abstract  We present Xiaomi-Robotics-1, a foundational vision-language-action (VLA) model capable of (1) following diverse language instructions to perform a wide range of mobile manipulation tasks in unseen environments out-of-the-box, and (2) efficiently adapting to novel downstream tasks with minimal fine-tuning data. We propose a two-stage training recipe consisting of pre-training and post-training. During pre-training, we imbue the model with broad and generalizable action-generation capabilities by training on over 100k hours of real-world manipulation trajectories collected via UMI devices. Crucially, we develop a scalable auto-labeling pipeline that annotates trajectory clips with natural languages describing scene state transitions, providing rich and precise conditioning for action learning. During post-training, we aim to align these capabilities with robot embodiments and imperative instructions that humans naturally use to prompt robots. Extensive experiments demonstrate strong scaling behavior. Xiaomi-Robotics-1 consistently improves with increased data scales and model sizes during pre-training. This scaling behavior directly transfers to post-training, where a stronger pre-training model yields better out-of-the-box real-robot performance in unseen environments. Furthermore, Xiaomi-Robotics-1 serves as a strong robot foundation policy that can be efficiently fine-tuned on complex, dexterous tasks with high data efficiency. Across multiple simulation benchmarks, Xiaomi-Robotics-1 outperforms state-of-the-art methods. Notably, it establishes a new state-of-the-art with a 57.6% success rate on RoboCasa365, surpassing the previous best of 46.6%. Furthermore, it achieves an average score of 20.07 on RoboDojo, significantly outperforming the prior state-of-the-art (13.07). Code and model checkpoints will be released. Project page: https://robotics.xiaomi.com/xiaomi-robotics-1.html', 'score': 50, 'issue_id': 2861, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '56fb694519be82d8', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaomi Robotics Team', 'Jun Guo', 'Piaopiao Jin', 'Jason Li', 'Peiyan Li', 'Yingyan Li', 'Futeng Liu', 'Wanli Peng', 'Optimus Qin', 'Yifei Su', 'Nan Sun', 'Qiao Sun', 'Runze Suo', 'Heyun Wang', 'Yunhong Wang', 'Rujie Wu', 'Caoyu Xia', 'Lina Zhang', 'Jack Zhao', 'Guoliang Chen', 'Wenlong Chen', 'Xinze He', 'Bin Li', 'Qing Li', 'Zhuorong Li', 'Heng Qu', 'Wenxuan Song', 'Diyun Xiang', 'Yifan Xie', 'Peiran Xu', 'Hangjun Ye', 'Wen Ye', 'Han Zhao', 'Quanyun Zhou'], 'affiliations': ['Xiaomi Robotics'], 'pdf_title_img': 'assets/pdf/title_img/2607.15330.jpg', 'data': {'categories': ['#open_source', '#transfer_learning', '#robotics', '#training', '#agents', '#optimization', '#alignment', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Xiaomi-Robotics-1: Новая эра мобильной робототехники', 'desc': 'Мы представляем модель Xiaomi-Robotics-1, которая сочетает в себе возможности восприятия, языка и действий. Она может выполнять различные задачи мобильной манипуляции, следуя языковым инструкциям в новых условиях без дополнительной настройки. Модель проходит двухступенчатое обучение: предобучение на огромном количестве траекторий манипуляции и последующее обучение для адаптации к человеческим инструкциям. Эксперименты показывают, что Xiaomi-Robotics-1 превосходит современные методы и устанавливает новые рекорды в задачах робототехники.'}, 'en': {'title': 'Empowering Robots with Language and Action', 'desc': 'Xiaomi-Robotics-1 is a vision-language-action model designed to follow diverse language instructions for mobile manipulation tasks in new environments without prior training. It uses a two-stage training approach, first pre-training on a large dataset of real-world manipulation actions to develop general action-generation skills. The model is then fine-tuned to align its capabilities with human-like instructions for better performance. Extensive testing shows that it outperforms existing methods, achieving new records in various benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.14530', 'title': 'xHC: Expanded Hyper-Connections', 'url': 'https://huggingface.co/papers/2607.14530', 'abstract': 'Abstract  Hyper-Connections (HC) expand the residual stream of Transformers into N parallel streams, providing a form of memory scaling beyond model width and depth. Manifold-Constrained HC (mHC) stabilizes this formulation at scale. The large gains from N{=}1 to N{=}4 suggest residual-stream expansion as a promising scaling axis. However, existing HC-family methods typically stop at N{=}4. Our experiments reveal why: scaling mHC beyond this point yields diminishing performance gains and rapidly increasing training cost. We attribute this limitation to two bottlenecks: insufficient write-back information for an expanding number of streams and residual-mixing generation whose cost scales cubically with N. To address both bottlenecks, we propose xHC (Expanded Hyper-Connections), the first HC-family method to achieve meaningful expansion beyond N{=}4. xHC combines temporal feature augmentation for richer write-back with a sparse residual-stream architecture that updates only k=4 of the N=16 streams while retaining dense access to the full residual state. Across 18B and 28B MoE models, xHC delivers strong and consistent downstream improvements. On an 18B MoE model, xHC improves the average downstream score by 4.0 points over mHC, while adding only modest training FLOPs over the vanilla baseline. Scaling-law experiments show that the vanilla and mHC require 1.50times and 1.19times the compute of xHC, respectively, to reach the same loss. Practical large-N training also requires controlling memory traffic from the expanded residual state. We therefore introduce xHC-Flash, which reduces the per-sublayer memory traffic from 73.5C to 40C, comparable to the 34C required by mHC at N{=}4, while retaining the gains of full xHC. Together, xHC and xHC-Flash make large-N residual-stream expansion effective and practical for LLM pre-training.', 'score': 45, 'issue_id': 2860, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'f2e72b1f76b2d78b', 'github_url': '', 'github_stars': 0, 'authors': ['Xiangdong Zhang', 'Xiaohan Qin', 'Sunan Zou', 'Tuo Dai', 'Xiaoming Shi', 'Huaijin Wu', 'Yebin Yang', 'Zhuo Xia', 'Shaofeng Zhang', 'Lin Yao', 'Yuliang Liu', 'Yu Cheng', 'Junchi Yan'], 'affiliations': ['Dots Studio, Xiaohongshu Inc.', 'Independent Researcher', 'School of AI, Shanghai Jiao Tong University', 'School of CS, Peking University', 'The Chinese University of Hong Kong', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.14530.jpg', 'data': {'categories': ['#architecture', '#training', '#optimization', '#memory'], 'emoji': '🚀', 'ru': {'title': 'Эффективное расширение памяти в трансформерах', 'desc': 'Статья представляет метод xHC (Expanded Hyper-Connections), который позволяет эффективно расширять память в трансформерах. Он преодолевает ограничения предыдущих методов, таких как mHC, позволяя достигать значительных улучшений при увеличении числа параллельных потоков. Исследования показывают, что xHC обеспечивает стабильные результаты и снижает затраты на обучение по сравнению с традиционными подходами. Новый подход сочетает в себе временное дополнение признаков и разреженную архитектуру потоков, что позволяет эффективно управлять памятью.'}, 'en': {'title': 'Unlocking the Power of Expanded Hyper-Connections in Transformers', 'desc': 'This paper introduces Expanded Hyper-Connections (xHC), a novel method that enhances the residual stream of Transformers by allowing for more parallel streams beyond the traditional limit of N=4. It addresses performance bottlenecks associated with scaling, such as insufficient write-back information and high computational costs. By combining temporal feature augmentation and a sparse architecture, xHC effectively manages memory traffic while improving downstream performance. The results show that xHC significantly outperforms previous methods, making large-scale training of language models more efficient and practical.'}}}, {'id': 'https://huggingface.co/papers/2607.15314', 'title': 'Cura 1T: Specialized Model for Agentic Healthcare', 'url': 'https://huggingface.co/papers/2607.15314', 'abstract': 'Abstract  Healthcare spans high-stakes communication, expert reasoning, and workflow execution, yet specialized LLMs that cover these use cases together remain limited. A healthcare model must handle patient consultation, clinical reasoning over text and images, interactive diagnosis, and electronic health record (EHR) tool use. These capabilities fail in different ways, and a narrow update for one task can degrade another. We present Cura 1T, a healthcare-specialized LLM trained through a human-gated self-evolution loop. In each evolution round, a training agent plans a target capability, trains the model, evaluates benchmark trajectories, and refines the data mixture from observed failures. This data-centered loop improves the model through targeted synthetic and curated examples rather than a single generic medical-data update. Across the healthcare evaluation suite, Cura 1T ranks at or near the top among frontier baselines, while remaining competitive on out-of-domain reasoning and agentic benchmarks.', 'score': 38, 'issue_id': 2860, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'b7b335d45e0c309a', 'github_url': '', 'github_stars': 0, 'authors': ['actAVA AI', ':', 'Haolin Chen', 'Leon Qi', 'Steve Brown', 'Deon Metelski', 'Tao Xia', 'Joonyul Lee', 'Qixuan Wang', 'Kevin Riley', 'Frank Wang', 'Weiran Yao'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.15314.jpg', 'data': {'categories': ['#synthetic', '#training', '#dataset', '#healthcare', '#agents', '#reasoning', '#benchmark', '#continual_learning', '#agi'], 'emoji': '🩺', 'ru': {'title': 'Новая эра в медицинском ИИ', 'desc': 'В данной статье представляется модель Cura 1T, специализированная для здравоохранения, которая решает задачи консультации пациентов, клинического анализа текстов и изображений, интерактивной диагностики и работы с электронными медицинскими записями. Модель использует инновационный подход, включая человеко-центрированную эволюцию, позволяя адаптировать обучение для конкретных задач. Эта модель обучается через итеративные циклы, в которых анализируются показатели работы и уточняется выборка данных. В результате, Cura 1T показывает выдающиеся результаты по сравнению с современными аналогами в области здравоохранения.'}, 'en': {'title': 'Cura 1T: Evolving Healthcare Intelligence', 'desc': 'This paper introduces Cura 1T, a specialized large language model (LLM) designed for healthcare applications. It addresses the challenges of patient consultation, clinical reasoning, and the use of electronic health records by employing a unique human-gated self-evolution loop for training. This approach allows the model to improve iteratively by focusing on specific capabilities and refining its training data based on observed failures. As a result, Cura 1T demonstrates superior performance in healthcare evaluations while maintaining competitiveness in broader reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.15591', 'title': 'RecGPT-V3 Technical Report', 'url': 'https://huggingface.co/papers/2607.15591', 'abstract': 'Abstract  Large language models (LLMs) are transforming recommender systems from matching co-occurrence patterns in historical behavior toward reasoning about the intent that drives it. RecGPT-V1 pioneered this paradigm on Taobao by centering user understanding, and RecGPT-V2 scaled it via coordinated multi-agent reasoning; both are deployed in production with consistent gains in user experience and commercial outcomes. However, operating RecGPT at scale reveals three challenges: (1) stateless behavior modeling, where each request reprocesses full user history, wasting computation and discarding prior analysis; (2) a tag-to-item information bottleneck, where natural-language tags form a lossy channel between user understanding and item grounding; and (3) inefficient explicit reasoning, whose lengthy chain-of-thought incurs untenable latency and compute overhead.   We present RecGPT-V3, a stateful, hybrid-modal recommender that reasons over natural language for open-world knowledge and Semantic IDs (SIDs) for concrete item grounding. A Memory Hub maintains structured, continually evolving user memory that distills long-horizon behavior into condensed units, cutting user-modeling computation by 55.8%. A Hybrid-modal Foundation Model allows the LLM jointly reason over text tags and SIDs, opening a high-bandwidth channel into the item space. Latent Intent Reasoning internalizes verbose rationales into compact learnable latent tokens that remain decodable into readable explanations, lowering output token cost by 200x. Deployed in Taobao\'s "Guess What You Like" feed, RecGPT-V3 achieves consistent gains in large-scale online A/B tests: IPV +1.28%, CTR +1.00%, TC +1.97%, GMV +3.97%, while cutting end-to-end serving resource consumption by 52.4%.', 'score': 24, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'd520c1261fb3b71a', 'github_url': '', 'github_stars': 0, 'authors': ['Bowen Zheng', 'Chao Yi', 'Dian Chen', 'Gaoyang Guo', 'Han Zhu', 'Jiakai Tang', 'Jian Wu', 'Mao Zhang', 'Wen Chen', 'Yifan Lu', 'Yujie Luo', 'Yuning Jiang', 'Zhujin Gao', 'Bo Zheng', 'Dixuan Wang', 'Hao Fang', 'Jiancai Liu', 'Jing Yu', 'Ke Chen', 'Kewei Zhu', 'Mingke Xu', 'Wenjun Yang', 'Xunke Xi', 'Zile Zhou'], 'affiliations': ['Taobao'], 'pdf_title_img': 'assets/pdf/title_img/2607.15591.jpg', 'data': {'categories': ['#optimization', '#training', '#reasoning', '#agents', '#memory'], 'emoji': '📊', 'ru': {'title': 'Революция в рекомендациях: новые подходы для лучшего понимания пользователей', 'desc': 'Статья описывает новый подход к рекомендательным системам с использованием больших языковых моделей (LLM). RecGPT-V3 предлагает решение проблем, таких как моделирование поведения пользователей и использование естественного языка для понимания намерений. Новый метод комбинирует устоявшуюся память и гибридные модели, чтобы улучшить качество рекомендаций и сократить вычислительные затраты. Результаты тестов показывают значительные улучшения в пользовательском опыте и коммерческих показателях на платформе Taobao.'}, 'en': {'title': 'Revolutionizing Recommendations with Intelligent User Understanding', 'desc': 'This paper introduces RecGPT-V3, an advanced recommender system that enhances user understanding by integrating natural language reasoning with structured user memory. It addresses challenges from previous versions by implementing a Memory Hub that reduces computation and improves user modeling efficiency. The system utilizes a Hybrid-modal Foundation Model to effectively connect user intent with item recommendations, while Latent Intent Reasoning compresses complex explanations into simpler, learnable tokens. Deployed on Taobao, RecGPT-V3 shows significant improvements in user engagement and resource efficiency compared to earlier models.'}}}, {'id': 'https://huggingface.co/papers/2607.15161', 'title': 'On-Policy Delta Distillation', 'url': 'https://huggingface.co/papers/2607.15161', 'abstract': "Abstract  On-policy distillation is an alternative post-training method in reinforcement learning that alleviates the constraints imposed by reward models by providing token-level supervision from a teacher model. Although on-policy distillation has been studied and applied across various settings, its fundamental design remains underexplored. In this paper, we introduce a new distillation reward, termed the delta signal, instead of directly imitating the teacher's output distribution. The delta signal is defined as the difference between the teacher model and its base model prior to instruction tuning for reasoning capability. It therefore captures the changes induced by reasoning tuning and provides a more direct signal for transferring reasoning capabilities. Using extensive empirical evidence, we show that the delta signal substantially improves on-policy distillation and refer to the new distillation method as On-Policy Delta Distillation (OPD^2). Experiments across mathematics, science, and code-reasoning benchmarks demonstrate that OPD^2 consistently outperforms conventional on-policy distillation, enabling reasoning LLMs to achieve strong performance with only a short post-training period. Code will be available at https://github.com/naver-ai/opd2", 'score': 24, 'issue_id': 2861, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'bc87d3ea1b96a59d', 'github_url': '', 'github_stars': 0, 'authors': ['Byeongho Heo', 'Jaehui Hwang', 'Sangdoo Yun', 'Dongyoon Han'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.15161.jpg', 'data': {'categories': ['#transfer_learning', '#reasoning', '#training', '#optimization', '#benchmark', '#rl'], 'emoji': '💡', 'ru': {'title': 'Новая эра дистилляции в обучении с подкреплением', 'desc': 'Статья посвящена новому подходу к дистилляции в обучении с подкреплением, который называется On-Policy Delta Distillation (OPD^2). Этот метод использует «дельта-сигнал», определяемый как разница между моделью-учителем и базовой моделью, что позволяет улучшить передачу умственных способностей. Дельта-сигнал обеспечивает более точный и прямой способ для обучения моделей, используя тонкость reasoning tuning. Эксперименты показывают, что OPD^2 превосходит традиционную дистилляцию в задачах математики, науки и кодирования.'}, 'en': {'title': 'Enhancing Reasoning in RL with Delta Distillation', 'desc': 'This paper presents On-Policy Delta Distillation (OPD^2), a novel method in reinforcement learning that enhances on-policy distillation by introducing a new distillation reward called the delta signal. The delta signal measures the difference between a teacher model and its base model before instruction tuning, allowing for more effective transfer of reasoning capabilities. Through extensive experiments, OPD^2 demonstrates significant improvements over traditional on-policy distillation methods across various benchmarks in mathematics, science, and code reasoning. This approach enables large language models to achieve high performance with minimal post-training time.'}}}, {'id': 'https://huggingface.co/papers/2607.13196', 'title': 'From Human-Centric to Agentic Code Review: The Impact of Different Generations of Generative AI Technology on Review Quality', 'url': 'https://huggingface.co/papers/2607.13196', 'abstract': 'Abstract  Code review helps maintain software quality before code integration, but it also imposes a substantial workload on human reviewers. As generative artificial intelligence becomes part of software development, code review is shifting from a primarily human review process toward AI-supported review processes in which large language model (LLM) reviewers and AI agent reviewers participate alongside human reviewers. However, we still lack empirical evidence on how this transition affects review efficiency and review quality. In this paper, we study 1.02 million reviewed pull requests from 207 GitHub projects that transition across three code review eras: human-centric review, LLM-assisted review, and agentic code review. We identify three AI reviewer adoption practices: Gradual AI Adoption, Rapid LLM Adoption, and Rapid AI Agent Adoption. We further model pull request review discussions as reviewer interaction sequences to characterize how human, LLM, and AI agent reviewers collaborate during the review process. Our results show that agent-involved collaboration patterns, especially reviews initiated by AI agents or involving multiple AI agents, are associated with faster review decisions under Gradual AI Adoption and Rapid AI Agent Adoption. However, these efficiency gains do not translate into better review quality. We also find that review activity and pull request type remain important across eras, while human-AI collaboration patterns become the strongest explanatory factor for review efficiency once LLM and AI agent reviewers participate. These findings provide empirical guidance for designing AI-supported code review processes that improve efficiency without weakening review quality.', 'score': 23, 'issue_id': 2860, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': 'b561fa01fe930c24', 'github_url': '', 'github_stars': 0, 'authors': ['Suzhen Zhong', 'Shayan Noei', 'Bram Adams', 'Ying Zou'], 'affiliations': ['Department of Electrical and Computer Engineering, Queens University, Kingston, ON K7L 3N6, Canada', 'Maintenance, Construction and Intelligence of Software Lab (MCIS), School of Computing, Queens University, Kingston, ON K7L 3N6, Canada'], 'pdf_title_img': 'assets/pdf/title_img/2607.13196.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#training', '#agents', '#agent_memory', '#agi'], 'emoji': '🤖', 'ru': {'title': 'ИИ в ревью кода: ускорение при сохранении качества', 'desc': 'В данной статье рассматривается влияние перехода к поддерживаемому ИИ процессу ревью кода на его эффективность и качество. Исследование охватывает более миллиона ревью запросов из 207 проектов на GitHub, разделенных на три этапа: ревью с участием человека, с поддержкой LLM и с участием ИИ-агентов. Были выделены три стратегии внедрения ИИ: постепенное внедрение, быстрое внедрение LLM и быстрое внедрение ИИ-агентов. Результаты показывают, что сотрудничество с участием ИИ-агентов может ускорять процесс ревью, но не всегда повышает качество проводимого анализа.'}, 'en': {'title': 'Enhancing Code Review Efficiency with AI: A Double-Edged Sword', 'desc': 'This paper explores the transition of code review processes from human-centric methods to AI-supported approaches involving large language models (LLMs) and AI agents. By analyzing over a million pull requests from GitHub, the authors identify three adoption practices for AI reviewers and model the interactions between human and AI reviewers. The study finds that while AI involvement can speed up review decisions, it does not necessarily improve the quality of the reviews. The results highlight the importance of human-AI collaboration patterns in enhancing review efficiency, suggesting that careful design of AI-supported processes is crucial for maintaining software quality.'}}}, {'id': 'https://huggingface.co/papers/2607.16097', 'title': 'Understanding Reasoning from Pretraining to Post-Training', 'url': 'https://huggingface.co/papers/2607.16097', 'abstract': 'Abstract  Reinforcement learning (RL) has become central to improving large language models (LLMs) on complex reasoning tasks, yet RL post-training is largely studied in isolation from the pretraining that precedes it. As a result, two basic questions remain open: (1) how do pretraining choices (model size, data) shape the returns to RL compute, and (2) what does RL actually do to the model? These questions are difficult to study in the standard LLM setting: pretraining corpora are vast and uncontrolled, making it hard to attribute behaviors to pretraining versus RL, and systematic compute sweeps across both stages are prohibitively expensive. To address these challenges, we use chess as a controlled testbed for studying reasoning across the full pretraining-to-post-training pipeline. We follow the standard LLM training pipeline by pretraining language models from 5M to 1B parameters on human chess games, supervised fine-tuning on synthetic reasoning traces, and running RL on chess puzzles with verifiable rewards. Using this framework, we find that the post-RL performance at given RL compute level is well-predicted from the pretraining loss, and slope of the RL reward curves improves approximately linearly with the pretraining tokens. Beyond scaling, we find that RL does not simply sharpen the SFT policy: on easy puzzles it amplifies correct moves the SFT policy already preferred, while on hard puzzles it surfaces correct moves that were nearly absent under SFT. We further test whether our findings transfer beyond chess by training a 1B language model on math-domain text, where the same predictive pattern emerges: longer-pretrained checkpoints reach higher post-RL performance and improve faster under RL. In sum, we provide a quantitative account of the pretraining-to-RL interface and a controlled testbed for studying the science of reasoning across the full pretraining-to-post-training pipeline.', 'score': 17, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '0f89244ec60354e4', 'github_url': '', 'github_stars': 0, 'authors': ['Jingyan Shen', 'Ang Li', 'Salman Rahman', 'Yifan Sun', 'Micah Goldblum', 'Matus Telgarsky', 'Pavel Izmailov'], 'affiliations': ['Columbia University', 'New York University', 'University of California, Los Angeles', 'University of Illinois Urbana-Champaign'], 'pdf_title_img': 'assets/pdf/title_img/2607.16097.jpg', 'data': {'categories': ['#training', '#dataset', '#reasoning', '#games', '#rl', '#transfer_learning'], 'emoji': '♟️', 'ru': {'title': 'Влияние предварительного обучения на обучение с подкреплением', 'desc': 'В данной статье рассматривается влияние предварительного обучения на результаты обучения с подкреплением (RL) больших языковых моделей (LLM) в задачах сложного рассуждения. Авторы экспериментируют на шахматах, чтобы проанализировать, как различные параметры предварительного обучения (размер модели, данные) влияют на эффективность RL. Они находят, что производительность после обучения с подкреплением можно предсказать на основе потерь предварительного обучения. Также выясняется, что RL не просто улучшает уже существующую стратегию, а открывает новые эффективные ходы для сложных задач.'}, 'en': {'title': 'Unlocking the Power of Pretraining for Reinforcement Learning in Language Models', 'desc': "This paper explores how pretraining choices affect the performance of reinforcement learning (RL) in large language models (LLMs) using chess as a testbed. It investigates the relationship between pretraining loss and post-RL performance, finding that better pretraining leads to improved RL outcomes. The study reveals that RL not only enhances the model's existing preferences but also uncovers new correct moves in challenging scenarios. Additionally, similar patterns are observed when applying the findings to math-domain text, indicating a broader applicability of the results."}}}, {'id': 'https://huggingface.co/papers/2607.11699', 'title': 'Qwen-Music Technical Report', 'url': 'https://huggingface.co/papers/2607.11699', 'abstract': 'Abstract  In this report, we introduce Qwen-Music, a powerful music generation model capable of producing highly musical and high-fidelity songs with complete vocal singing. Qwen-Music supports two core tasks: Text to Music Generation, which create entirely new songs from text descriptions, lyrics, and musical attributes, and Cover Song Generation, which reinterprets existing songs with different styles and vocal characteristics. Architecturally, Qwen-Music integrates three core components: Qwen-Music-Tokenizer, Qwen-Music-LLM, and Qwen-Music-Render. Qwen-Music-Tokenizer compresses audio into a 25 Hz single-codebook stream of Music Semantic Tokens that preserve semantic and melodic information for LLM prediction. Based on these tokens, Qwen-Music-LLM performs autoregressive music semantic modeling, with a key novelty being a melody-token-based chain-of-thought (Melody-CoT) mechanism that plans melodies before full-song generation, improving creativity, musicality, structural coherence, and reference-audio-based melody cloning. To overcome the fidelity limitations of discrete semantic tokens, Qwen-Music-Render performs generative stereo rendering, enriching acoustic details and producing high-fidelity stereo waveforms. Finally, we train Qwen-Music-LLM on more than 5 million hours of multilingual music data covering hundreds of languages. We first apply quality-aware pre-training curriculum, then use progressive post-training, comprising supervised initialization, offline DPO, and online GSPO, to further improve musicality and instruction-following ability. Across 600 Chinese and English prompts, Qwen-Music achieves state-of-the-art results in 13 of 16 objective musicality and audio-quality metrics. Professional evaluators also prefer Qwen-Music over leading proprietary systems. For cover song generation, Qwen-Music preserves reference melodies more accurately than leading proprietary systems.', 'score': 15, 'issue_id': 2861, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '1d6139dd83502e65', 'github_url': '', 'github_stars': 0, 'authors': ['Jin Xu', 'Kangdi Wang', 'Ruibin Yuan', 'Shun Lei', 'Xiong Wang', 'Xize Cheng', 'Xueyao Zhang', 'Yang Zhang', 'Yiheng Chen', 'Yongqi Wang', 'Yue Wang', 'Zhifang Guo', 'Zihan Liu', 'Zijian Lin', 'Dake Guo', 'Hangrui Hu', 'Lei Xie', 'Linhan Ma', 'Wei Xue', 'Wenxiang Guo', 'Xinfa Zhu', 'Xipin Wei', 'Yangze Li', 'Yuanjun Lv', 'Yuxuan Wang', 'Yunfei Chu', 'Zhiyong Wu'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.11699.jpg', 'data': {'categories': ['#audio', '#music_generation', '#training', '#multilingual', '#multimodal'], 'emoji': '🎶', 'ru': {'title': 'Создание музыки нового поколения с Qwen-Music', 'desc': 'В данном отчете представлен Qwen-Music, мощная модель генерации музыки, способная создавать высококачественные песни с полными вокальными партиями. Она поддерживает две основные задачи: генерацию музыки по тексту и создание кавер-версий существующих песен в различных стилях. Архитектура модели включает три ключевых компонента: Qwen-Music-Tokenizer, Qwen-Music-LLM и Qwen-Music-Render, которые позволяют эффективно обрабатывать и генерировать музыкальные семантические токены. Модель демонстрирует выдающиеся результаты в оценке музыкальности и качества звука, превосходя существующие системы.'}, 'en': {'title': 'Revolutionizing Music Creation with Qwen-Music', 'desc': 'Qwen-Music is an advanced music generation model that creates high-quality songs with vocals. It can generate new music from text descriptions and reinterpret existing songs in different styles. The model uses a unique approach called Melody-CoT to enhance creativity and coherence in music composition. Trained on a vast dataset, Qwen-Music outperforms other systems in musicality and audio quality metrics.'}}}, {'id': 'https://huggingface.co/papers/2607.16169', 'title': 'When Does Muon Help Agentic Reinforcement Learning?', 'url': 'https://huggingface.co/papers/2607.16169', 'abstract': "Abstract  Muon is competitive with AdamW in large-scale pre-training, but its value for reinforcement-learning (RL) post-training remains unclear. We study vanilla Muon in sparse-reward agentic RL through matched single-seed comparisons with AdamW on ALFWorld using Qwen2.5-0.5B-Instruct. Under Group-in-Group Policy Optimization (GiGPO), applying Muon only to hidden weight matrices raises final-window validation success from 0.290 to 0.546 (+88%); high-rate AdamW controls retain no post-update success. The effect depends on the advantage estimator and learning rate. At 3e-5, Muon improves GRPO from 0.161 to 0.268, whereas GraphGPO's late-window gap narrows near saturation. At 1e-5, GraphGPO Muon reaches 0.901, raises normalized validation AUC from 0.399 to 0.556, and reaches 0.5 and 0.75 success 30 and 60 updates earlier, respectively. These exploratory results show that Muon can benefit agentic RL and motivate studying the policy optimizer, advantage estimator, and learning rate jointly. Multi-seed and cross-task validation remain open.", 'score': 11, 'issue_id': 2862, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '075e03e3b3bffda5', 'github_url': '', 'github_stars': 0, 'authors': ['Kai Ruan', 'Jinghao Lin', 'Zihe Huang', 'Ziqi Zhou', 'Qianshan Wei', 'Xuan Wang', 'Hao Sun'], 'affiliations': ['College of Computer Science and Technology, Zhejiang University', 'Duke University', 'Gaoling School of Artificial Intelligence, Renmin University of China', 'Independent Researcher', 'Institute of Automation, Chinese Academy of Sciences', 'Institute of Computing Technology, Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.16169.jpg', 'data': {'categories': ['#optimization', '#rl', '#training', '#agents', '#games'], 'emoji': '🤖', 'ru': {'title': 'Muon: новый взгляд на обучение с частичными вознаграждениями', 'desc': 'В данной статье рассматривается эффективность использования метода Muon в задачах обучения с частичными вознаграждениями, сравнивая его с AdamW. Эксперименты показывают, что Muon значительно улучшает успешность валидации при оптимизации политики. Интересно, что использование Muon в скрытых весах приводит к большему успеху, чем AdamW, который не показывает положительных результатов после обновлений. Результаты анализа зависят от оценщика преимущества и скорости обучения, что указывает на возможности для дальнейших исследований.'}, 'en': {'title': 'Muon Optimizer: A Game Changer for Reinforcement Learning', 'desc': 'This paper investigates the performance of the Muon optimizer in reinforcement learning (RL) tasks, particularly in sparse-reward scenarios. It compares Muon with the widely used AdamW optimizer during post-training on the ALFWorld environment using the Qwen2.5-0.5B-Instruct model. The results show that Muon significantly improves validation success rates when applied to hidden weight matrices, outperforming AdamW in certain configurations. The findings suggest that the choice of optimizer, advantage estimator, and learning rate are crucial for enhancing RL performance, warranting further exploration in these areas.'}}}, {'id': 'https://huggingface.co/papers/2607.15524', 'title': 'Recursive Harness Self-Improvement', 'url': 'https://huggingface.co/papers/2607.15524', 'abstract': "Abstract  Under model--harness co-evolution, harnesses are not merely inference-time scaffolds but data-generating components whose execution traces can shape future foundation models. This motivates harness-in-the-loop learning: optimizing harnesses for both immediate agent performance and the quality of traces used for future model training. However, continually updating provider-built scaffolds is costly and labor-intensive. We therefore investigate whether optimizing user-constructed harnesses in a task-specific manner can improve execution-trace quality while remaining computationally lightweight and requiring only a few update iterations. To this end, we introduce Recursive Harness Self-Improvement (RHI), which represents the harness as a prompt-level specification of the agent loop and iteratively refines it using pairwise feedback over its own revision history. Across 30 synthetic machine-learning research tasks spanning quantitative finance, robotics, and pharmacy, a few RHI iterations suffice to substantially raise the performance ceiling of low-reasoning-effort agents, exceeding the corresponding maximum-reasoning-effort setting while reducing inference cost by up to 60%. We show that these gains arise primarily from improved task-specific context management through more effective inter-agent information flow rather than longer reasoning traces. Finally, we formalize this behavior as an information-theoretic hypothesis for RHI's implicit optimization objective, suggesting RHI as a practical algorithm for continual learning within the paradigm of model--harness co-evolution.", 'score': 10, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '5e30aa96f3e2dd65', 'github_url': '', 'github_stars': 0, 'authors': ['Hyunin Lee', 'Jinglue Xu', 'Jeffrey Seely', 'Donghyun Lee', 'Matei Zaharia', 'Yujin Tang'], 'affiliations': ['Sakana AI', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2607.15524.jpg', 'data': {'categories': ['#optimization', '#training', '#agents', '#continual_learning', '#agent_memory', '#prompting'], 'emoji': '💡', 'ru': {'title': 'Оптимизация обучения через самоулучшение вспомогательных инструментов', 'desc': 'В статье рассматривается концепция сосуществования моделей и вспомогательных инструментов, которые играют важную роль в генерации данных для обучения будущих моделей. Представлен метод Recursive Harness Self-Improvement (RHI), который оптимизирует эти вспомогательные инструменты, улучшая качество данных для обучения при низких вычислительных затратах. RHI позволяет уменьшить стоимость вывода до 60%, одновременно повышая производительность агентов на 30 различных задачах в области финансов, робототехники и фармацевтики. Достижения метода связаны с улучшением управления контекстом заданий и потоком информации между агентами.'}, 'en': {'title': 'Optimizing Harnesses for Better Learning Efficiency', 'desc': 'This paper introduces a new approach called Recursive Harness Self-Improvement (RHI) that optimizes harnesses, which are tools that help improve machine learning models. RHI focuses on enhancing the quality of execution traces generated during the learning process while minimizing computational costs. By using pairwise feedback and refining the harness iteratively, RHI can significantly boost the performance of agents across various tasks. The results show that RHI improves task-specific context management and reduces inference costs, making it a valuable method for continual learning in model-harness co-evolution.'}}}, {'id': 'https://huggingface.co/papers/2607.14614', 'title': 'Beyond Entropy: Correctness-Aware Advantage Shaping via Contrastive Policy Optimization', 'url': 'https://huggingface.co/papers/2607.14614', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) commonly uses entropy for advantage shaping. However, entropy cannot distinguish useful uncertainty from detrimental confusion, limiting its effectiveness as a correctness signal. We propose Contrastive Policy Optimization (CPO), which uses token-level contrastive disagreement between reference-guided and vanilla generation distributions for correctness-aware advantage shaping. Both theoretical and empirical results show that this disagreement reliably indicates token-level correctness. We further show that On-policy Distillation is a special case of CPO, where the posterior distribution is instantiated by an external teacher model. CPO also resolves the zero-advantage problem. Experiments on in-domain and out-of-domain benchmarks demonstrate that CPO substantially outperforms entropy-based RLVR methods while maintaining strong generalization. Further analysis shows that correct and incorrect responses naturally support exploration and exploitation respectively, and balancing both leads to the best performance.', 'score': 7, 'issue_id': 2862, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '55633b53f48f79cd', 'github_url': '', 'github_stars': 0, 'authors': ['Weiwen Xu', 'Jia Liu', 'Hou Pong Chan', 'Long Li', 'Deng Cai', 'Min Chen', 'Hao Zhang'], 'affiliations': ['Nanyang Technological University', 'South China University of Technology', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.14614.jpg', 'data': {'categories': ['#optimization', '#rl', '#training', '#benchmark', '#reasoning', '#rlhf'], 'emoji': '🧠', 'ru': {'title': 'Новый подход к обучению с подкреплением для точного формирования преимущества', 'desc': 'В данной статье предложен новый подход к обучению с подкреплением с проверяемыми наградами, называемый Contrastive Policy Optimization (CPO). Этот метод использует контрастное несогласие на уровне токенов для формирования преимущества, что позволяет лучше различать полезную неопределенность и вредную путаницу. Эксперименты показывают, что CPO значительно превосходит методы, основанные на энтропии, обеспечивая высокую обобщающую способность. Также разработанный алгоритм решает проблему нулевого преимущества, балансируя исследования и эксплуатацию.'}, 'en': {'title': 'Enhancing Reinforcement Learning with Contrastive Policy Optimization', 'desc': 'This paper introduces Contrastive Policy Optimization (CPO) as a new method for reinforcement learning with verifiable rewards. Unlike traditional entropy-based approaches, CPO uses token-level contrastive disagreement to better identify correct actions and improve advantage shaping. The method shows significant improvements in performance on various benchmarks while effectively addressing the zero-advantage problem. Additionally, the research highlights the importance of balancing exploration and exploitation to achieve optimal results.'}}}, {'id': 'https://huggingface.co/papers/2607.14088', 'title': 'VideoRAE: Taming Video Foundation Models for Generative Modeling via Representation Autoencoders', 'url': 'https://huggingface.co/papers/2607.14088', 'abstract': 'Abstract  Video generative models commonly rely on latent spaces learned by 3D Variational Autoencoders (3D-VAEs). However, conventional 3D-VAEs are mainly optimized for pixel-level reconstruction, which can limit the semantic and spatio-temporal structure captured by their latents. Meanwhile, Video Foundation Models (VFMs) such as V-JEPA 2 and VideoMAEv2 show strong video understanding capabilities, yet whether their frozen representations can be transformed into compact, reconstruction-capable, and generation-friendly video latents remains largely unexplored. We answer this question with VideoRAE, a representation autoencoder that leverages multi-scale hierarchical features from a frozen video foundation encoder and compresses them with a lightweight 1D self-attention projector. VideoRAE supports both continuous latents for Diffusion Transformers and discrete tokens for autoregressive models via multi-codebook high-dimensional quantization. During decoding, a local-and-global representation alignment objective with the frozen VFM teacher improves semantic preservation and enables training without KL regularization. Experiments show that VideoRAE achieves strong reconstruction in both continuous and discrete regimes. On UCF-101, it obtains state-of-the-art class-to-video gFVDs of 40 and 93 with AR and DiT generators, respectively, while converging approximately 5x faster than competing autoencoder baselines. In a controlled 2B-scale text-to-video study, replacing LTX-VAE with VideoRAE leads to faster convergence under comparable settings. These results validate frozen VFM representations as versatile and generation-friendly video latents. The model and code will be released on https://zhxie0117.github.io/VideoRAE.', 'score': 7, 'issue_id': 2861, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'de6230c2d5688641', 'github_url': '', 'github_stars': 0, 'authors': ['Zhihao Xie', 'Junfeng Wu', 'Xinting Hu', 'Junchao Huang', 'Li Jiang'], 'affiliations': ['Huazhong University of Science and Technology', 'Shenzhen Loop Area Institute', 'The Chinese University of Hong Kong, Shenzhen', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.14088.jpg', 'data': {'categories': ['#dataset', '#3d', '#architecture', '#training', '#diffusion', '#optimization'], 'emoji': '🎬', 'ru': {'title': 'VideoRAE: новый подход к генерации видео', 'desc': 'В данной статье представлена модель VideoRAE, которая использует замороженные представления Video Foundation Models (VFMs) для генерации видео. Модель сочетает многоуровневые иерархические функции и сжимает их с помощью легкого проектора 1D самовнимания. VideoRAE поддерживает как непрерывные латенты для диффузионных трансформеров, так и дискретные токены для авторегрессионных моделей. В экспериментах модель продемонстрировала высокое качество реконструкции и быструю сходимость по сравнению с конкурентами.'}, 'en': {'title': 'Transforming Video Understanding into Efficient Generation', 'desc': 'This paper introduces VideoRAE, a novel representation autoencoder that transforms frozen representations from Video Foundation Models into efficient video latents. By utilizing multi-scale hierarchical features and a lightweight self-attention projector, VideoRAE enhances both semantic preservation and reconstruction capabilities. It supports various latent formats for different generative models, achieving state-of-the-art performance in video generation tasks. The results demonstrate that VideoRAE converges faster than traditional autoencoders while maintaining high-quality video outputs.'}}}, {'id': 'https://huggingface.co/papers/2607.16107', 'title': 'Audio-Visual Flamingo: Open Audio-Visual Intelligence for Long and Complex Videos', 'url': 'https://huggingface.co/papers/2607.16107', 'abstract': 'Abstract  We present Audio-Visual Flamingo (AV-Flamingo), a fully open state-of-the-art audio-visual large language model (AV-LLM) for joint understanding and reasoning over audio, images, and long-form videos. Unlike prior AV-LLMs that primarily focus on short clips, AV-Flamingo is designed for understanding and reasoning over long and complex real-world (audio-visual) videos. To support this, we make three key contributions: (i) Audio-Visual-Skills, a large-scale collection of real-world videos with ~7M caption and question-answer training instances designed to emphasize temporal, compositional, and cross-modal audio-visual reasoning; (ii) a novel three-stage curriculum that progressively trains the model from short-range perception to long-horizon multi-event reasoning; and (iii) Temporal Audio-Visual Interleaved Chain-of-Thought, a reasoning framework that explicitly grounds intermediate reasoning steps to timestamps in long audio-visual streams, improving temporal alignment and interpretability. Extensive experiments across 15+ audio-visual, omni-modal, audio, and vision benchmarks show that AV-Flamingo outperforms similarly sized open models by clear margins and remains highly competitive with, and in some cases surpasses, much larger open-weight and closed models, particularly on long and complex real-world audio-visual understanding and reasoning tasks. Beyond benchmark performance, AV-Flamingo exhibits strong real-world utility and transfers well to unseen tasks, highlighting its robustness and generalization ability.', 'score': 5, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '74ed12bb6bffe808', 'github_url': '', 'github_stars': 0, 'authors': ['Sreyan Ghosh', 'Arushi Goel', 'Kaousheik Jayakumar', 'Lasha Koroshinadze', 'Nishit Anand', 'Siddharth Gururani', 'Hanrong Ye', 'Pritam Biswas', 'Yuanhang Su', 'Ehsan Hosseini-Asl', 'Sang-gil Lee', 'Zhifeng Kong', 'Jaehyeon Kim', 'Sungwon Kim', 'S Sakshi', 'Ramani Duraiswami', 'Dinesh Manocha', 'Andrew Tao', 'Mohammad Shoeybi', 'Bryan Catanzaro', 'Ming-Yu Liu', 'Wei Ping'], 'affiliations': ['NVIDIA, USA', 'University of Maryland, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.16107.jpg', 'data': {'categories': ['#multimodal', '#training', '#dataset', '#reasoning', '#benchmark', '#audio', '#agi', '#transfer_learning', '#interpretability'], 'emoji': '🎥', 'ru': {'title': 'AV-Flamingo: Понимание длинных аудиовизуальных потоков', 'desc': 'Статья представляет Audio-Visual Flamingo (AV-Flamingo) — открытый аудиовизуальный LLM, который способен понимать и рассуждать на основе аудио, изображений и длинных видео. В отличие от предыдущих моделей, AV-Flamingo ориентирован на работу с длинными и сложными реальными видео. Он включает в себя обширный набор данных, состоящий из 7 миллионов аннотаций и вопросов для тренировки, что подчеркивает аудиовизуальное рассуждение. Модель демонстрирует отличные результаты на реальных задачах и имеет высокую устойчивость и способность к обобщению.'}, 'en': {'title': 'Revolutionizing Long-Form Audio-Visual Understanding', 'desc': "Audio-Visual Flamingo (AV-Flamingo) is a cutting-edge audio-visual large language model designed for understanding and reasoning over long and complex videos. It introduces a large dataset called Audio-Visual-Skills, which includes millions of training instances to enhance reasoning across different modalities. The model employs a three-stage curriculum to progressively develop its capabilities from short to long-range reasoning. Additionally, it features a unique reasoning framework that improves the model's ability to align its reasoning steps with specific timestamps in videos, leading to better interpretability and performance on various benchmarks."}}}, {'id': 'https://huggingface.co/papers/2607.15686', 'title': 'S1-Omni: A Unified Multimodal Reasoning Model for Scientific Understanding, Prediction, and Generation', 'url': 'https://huggingface.co/papers/2607.15686', 'abstract': 'Abstract  We present S1-Omni, a unified multimodal reasoning model for scientific understanding, prediction, and generation. AI for Science (AI4S) has advanced significantly through domain-specific models, tool-augmented LLMs, and scientific language models. However, model capabilities remain highly fragmented, limiting the joint modeling of heterogeneous data, scientific laws, and expert knowledge. S1-Omni addresses this gap by consolidating these capabilities into a single, coherent scientific reasoning model. The architecture of S1-Omni is built upon three core components: unified representation of scientific data, natural-world knowledge alignment, and decoding for domain-specific tasks. First, S1-Omni maps natural-language instructions and scientific objects, including CIF, SMILES, protein sequences, spectra, and scientific images, into a shared representation space. Second, it incorporates scientific laws and expert knowledge into data construction and training, enabling the model to reason from scientific evidence. Third, it performs task-specific decoding to support a broad range of applications, including property prediction, spectrum-to-molecular generation, protein site and structure prediction, and scientific image generation and editing. S1-Omni is trained on S1-Omni-Corpus, which covers 200 scientific tasks and contains millions of reasoning samples, and is evaluated on over 60 scientific benchmarks. It outperforms GPT-5.5 and Gemini-3.1-Pro on most benchmarks and matches or surpasses domain-specific models on several benchmarks. Overall, S1-Omni provides a practical path toward unified scientific modeling.', 'score': 5, 'issue_id': 2862, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '261d11140f02cff5', 'github_url': '', 'github_stars': 0, 'authors': ['Jiahao Zhao', 'Junyi Liu', 'Lifeng Xu', 'Nan Xu', 'Qingli Wang', 'Qingxiao Li', 'Tianle Chen', 'Xiaoyu Wu', 'Yawen Zheng', 'Zikai Wang', 'Guanming Liu', 'Hequn Zhou', 'Jingyi Wang', 'Jingyuan Shu', 'Keqi Wang', 'Li He', 'Songyang Diao', 'Wenhui Xu', 'Xinyu Ren', 'Yaqin Fan', 'Yujin Zhou', 'Zhanao Yao'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.15686.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#architecture', '#reasoning', '#science'], 'emoji': '🔬', 'ru': {'title': 'Единое решение для научного моделирования', 'desc': 'S1-Omni — это единая модель многомодального рассуждения, предназначенная для научного понимания, предсказания и генерации. Она объединяет возможности различных моделей, чтобы улучшить совместное моделирование научных данных, законов и экспертных знаний. Модель преобразует научные объекты и естественно-языковые инструкции в общую пространство представлений, что позволяет осуществлять вывод на основе научных данных. S1-Omni демонстрирует превосходство над аналогичными моделями, что делает ее шагом вперед в унифицированном научном моделировании.'}, 'en': {'title': 'Unified Scientific Reasoning with S1-Omni', 'desc': 'S1-Omni is a comprehensive multimodal reasoning model designed for scientific tasks, integrating various data types and expert knowledge. It creates a unified representation of scientific data, allowing it to process natural language instructions alongside complex scientific objects. The model incorporates scientific laws during training, enhancing its ability to reason based on evidence. S1-Omni excels in diverse applications, outperforming existing models and providing a cohesive approach to scientific understanding and prediction.'}}}, {'id': 'https://huggingface.co/papers/2607.15901', 'title': 'DSWorld: A Data Science World Model for Efficient Autonomous Agents', 'url': 'https://huggingface.co/papers/2607.15901', 'abstract': 'Abstract  Despite strong capabilities in data understanding and decision-making, autonomous data science agents still heavily rely on trial-and-error workflows that involve expensive computation. This bottleneck motivates models that can anticipate the effects of data science operations before real execution. In this paper, we introduce the concept of Data Science World Model, which model the data science execution environment by predicting environment state transitions conditioned on current workflow states and candidate operations. We further propose DSWorld, a practical framework that combines structured state construction, cost-aware routing, lightweight real execution, and an LLM-based simulator for expensive operations. To support training, we construct an 8K-scale transition trajectory dataset and introduce Reflective World Model Optimization, an error-aware reinforcement learning strategy for improving transition prediction. Experiments show that DSWorld accelerates RL-based agent training by approximately 14times and search-based inference by approximately 3-6times while maintaining competitive performance, and outperforms the strongest LLM baseline by 35.6% on transition prediction tasks. The code is available at https://anonymous.4open.science/r/DSWorld.', 'score': 4, 'issue_id': 2860, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': 'aa45f4c04c53a40a', 'github_url': '', 'github_stars': 0, 'authors': ['Zherui Yang', 'Fan Liu', 'Hao Liu'], 'affiliations': ['The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2607.15901.jpg', 'data': {'categories': ['#optimization', '#training', '#dataset', '#reinforcement_learning', '#agents', '#agent_memory', '#rl'], 'emoji': '⚙️', 'ru': {'title': 'Ускорение науки о данных с помощью Мировой Модели', 'desc': 'В статье рассматриваются автономные агенты в области науки о данных, которые используют подходы на основе проб и ошибок, что требует значительных вычислительных ресурсов. Авторы предлагают концепцию Мировой Модели Науки о Данных, которая предсказывает состояние среды выполнения операций на основе текущих этапов рабочего процесса. В предложенной модели DSWorld используется структурированное построение состояния, учитывающее затраты, а также легковесное реальное выполнение и симулятор на основе LLM. Эксперименты показывают, что DSWorld значительно ускоряет обучение агентов, сохраняя при этом конкурентоспособную производительность.'}, 'en': {'title': 'Predicting Data Science Outcomes for Efficient Workflows', 'desc': 'This paper presents a new approach to improve the efficiency of autonomous data science agents by predicting the outcomes of data science operations before they are executed. It introduces the Data Science World Model, which anticipates changes in the data science environment based on current workflows and potential actions. The proposed DSWorld framework integrates structured state construction and a lightweight simulator to enhance decision-making while reducing computational costs. Experiments demonstrate that DSWorld significantly speeds up training and inference processes while outperforming existing models in transition prediction tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.09082', 'title': 'REBASE: Reference-Background Subspace Elimination for Training-Free In-Context Segmentation', 'url': 'https://huggingface.co/papers/2607.09082', 'abstract': 'Abstract  Training-free in-context segmentation enables new object categories to be introduced at inference time from a single annotated reference image, eliminating the retraining and memory overhead of class-incremental learning. Recent approaches achieve this by combining vision foundation models for semantic correspondence with promptable segmentation networks like SAM. However, their performance is fundamentally limited by the quality of the cross-image similarity map; shared contextual backgrounds between the reference and query systematically elevate similarity in non-target regions, degrading prompt localization. We present REBASE, a training-free framework that explicitly suppresses these spurious contextual correspondences. Our method identifies the low-rank background feature subspace from the reference image and project the reference and query features onto its orthogonal complement in closed form, yielding cleaner semantic matching. We then generate positive point prompts using similarity-weighted farthest-point sampling, paired with a refined dense similarity prior. Without any training or parameter updates, our approach establishes a new state of the art among training-free methods on PACO-Part, FSS-1000, and cross-domain datasets such as ISIC2018, demonstrating that explicit background subspace removal is a highly effective principle for one-shot localization.', 'score': 3, 'issue_id': 2864, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'aad14eb1c0a75f5d', 'github_url': '', 'github_stars': 0, 'authors': ['Mantha Sai Gopal', 'Jaison Saji Chacko', 'Harsh Nandwana', 'Sandesh Hegde', 'Debarshi Banerjee', 'Uma Mahesh'], 'affiliations': ['CamCom Technologies Private Limited'], 'pdf_title_img': 'assets/pdf/title_img/2607.09082.jpg', 'data': {'categories': ['#games', '#training', '#optimization', '#dataset', '#multimodal'], 'emoji': '🖼️', 'ru': {'title': 'Сегментация без обучения: новое слово в обрисовке объектов', 'desc': 'Статья представляет метод REBASE, который позволяет сегментировать объекты без необходимости в обучении. Этот метод использует одно аннотированное изображение для идентификации новых категорий объектов во время вывода. REBASE решает проблемы, связанные с шумными контекстными соответствиями, улучшая качество семантического сопоставления. Новый подход демонстрирует высокую эффективность на различных наборах данных, устанавливая рекорды среди методов без обучения.'}, 'en': {'title': 'REBASE: Revolutionizing One-Shot Segmentation Without Training', 'desc': 'This paper introduces REBASE, a training-free method for in-context segmentation that allows new object categories to be identified using just one annotated image. It addresses the limitations of previous approaches by reducing the impact of shared backgrounds that can confuse the model during segmentation. By projecting features onto a background subspace, REBASE enhances the accuracy of semantic matching between reference and query images. The method achieves state-of-the-art results on various datasets without requiring any training or parameter updates.'}}}, {'id': 'https://huggingface.co/papers/2607.11498', 'title': 'See like a Robot: Robot-Centric Pointmaps for Vision-Language-Action Models', 'url': 'https://huggingface.co/papers/2607.11498', 'abstract': "Abstract  Vision-language-action (VLA) models predict robot actions from visual observations and language instructions. These actions are defined in the robot's own 3D coordinate frame, yet most VLAs observe the scene in the camera frame, creating a frame mismatch between where the scene is observed and where actions are defined. The mismatch is benign under a fixed viewpoint, where the policy can memorize a single observation-to-action mapping, but grows harder as large-scale datasets aggregate demonstrations across diverse camera setups and the policy must generalize this mapping across viewpoints. We address this mismatch with robot-centric pointmaps, images whose pixels store the 3D coordinates of scene points in the robot frame. Pointmaps provide robot-frame 3D geometry while preserving the dense H x W grid expected by pretrained 2D VLAs, so they integrate into existing VLAs with minimal architectural change. On RoboCasa, pointmaps improve both pi0.5 and SmolVLA and outperform representative camera-viewpoint and 3D-aware baselines. In real-robot experiments, their advantage over an RGB-only policy widens when the camera is moved to a placement unseen during training.", 'score': 2, 'issue_id': 2863, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '8bd1d85cb87c09ba', 'github_url': '', 'github_stars': 0, 'authors': ['Byungkun Lee', 'Dongyoon Hwang', 'Dongjin Kim', 'Hojoon Lee', 'Minho Park', 'Jaegul Choo'], 'affiliations': ['Holiday Robotics', 'KAIST AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.11498.jpg', 'data': {'categories': ['#transfer_learning', '#games', '#agents', '#3d', '#training'], 'emoji': '🤖', 'ru': {'title': 'Устранение несовпадения координат: точечные карты для роботов', 'desc': 'Модели, объединяющие в
