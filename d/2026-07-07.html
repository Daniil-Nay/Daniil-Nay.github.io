    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {

                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {

        function toggleTheme() {

            const isDarkMode = body.classList.contains('dark-theme');

                const title = document.getElementById('doomgrad');

                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.04438', 'title': 'ResearchStudio-Reel: Automate the Last Mile of Research from Paper to Poster, Video, and Blog', 'url': 'https://huggingface.co/papers/2607.04438', 'abstract': "Abstract ResearchStudio-Reel automates research dissemination by composing specialized skills around a shared paper extractor, generating consistent and editable artifacts including posters, videos, and blogs with hard pass/fail quality gates.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Research dissemination, turning a paper into a poster, a talk video, and a blog post, is still a manual last mile. Prior automation treats each artifact in isolation that each re-extract the paper from scratch, usually ship one-way renders the author cannot reopen in PowerPoint or Word, and gates quality on soft VLM-preference scores that plateau while load-bearing sections still read as empty. We argue this last mile is best built as a composition of skills: thin agent-readable contracts that share one upstream extractor and wrap deterministic primitives in a measured-fill loop whose exits are hard pass/fail render gates. We instantiate this as ResearchStudio-Reel, five Claude Code and Codex skills organized into one shared extractor (Paper2Assets), three editable generators (Paper2Poster, Paper2Video, Paper2Blog), and one interactive convergence layer (Paper2Reel). Paper2Assets extracts each paper once into a shared bundle that can be reused by every downstream skill; The three generators produce a print-ready poster, a synchronized talk video, and a bilingual blog that stay factually consistent and round-trip through PowerPoint or Word; Paper2Reel then binds all three into a self-contained HTML viewer whose section-level clicks jump the video, slides, captions, and blog to matching content. On the Paper2Poster benchmark, our posters lead every aesthetic and information sub-criterion against both prior automated systems and single-shot frontier LLMs, surpassing the authors' own on aesthetics under two held-out VLM judges and winning overall on 84% to 93% of papers; capability audits further show that, by uniquely pairing narration-aligned on-slide highlights with a bilingual blog gated by layout-aware DOCX repair, ResearchStudio-Reel is the only pipeline to ship all three editable artifacts. Project is available at https://aka.ms/ResearchStudio", 'score': 33, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'e13e3bec2b675675', 'github_url': '', 'github_stars': 0, 'authors': ['Lingao Xiao', 'Yalun Dai', 'Yangyu Huang', 'Qihao Zhao', 'Wenshan Wu', 'Hugo He', 'Ruishuo Chen', 'Jin Jiang', 'Qianli Ma', 'Jiahuan Zhang', 'Xin Zhang', 'Ying Xin', 'Yang Ou', 'Yan Xia', 'Scarlett Li', 'Longbo Huang', 'Zhipeng Zhang', 'Yang He', 'Yap Kim Hui', 'Yan Lu'], 'affiliations': ['CFAR, A*STAR', 'Microsoft Research', 'Nanyang Technological University', 'National University of Singapore', 'Peking University', 'Shanghai Jiao Tong University', 'Tsinghua University', 'Westlake University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04438.jpg', 'data': {'categories': ['#benchmark', '#multimodal', '#agents', '#open_source', '#science'], 'emoji': '📑', 'ru': {'title': 'Автоматизация распространения научных исследований', 'desc': 'Исследование представляет собой автоматизацию распространения научных работ с помощью системы ResearchStudio-Reel, которая объединяет навыки для извлечения информации из статей. Создаются редактируемые материалы, такие как постеры, видео и блоги, которые обеспечивают качество на основе строгих критериев. В отличие от предыдущих подходов, которые рассматривали каждый артефакт отдельно, новая система использует один общий экстрактор для всех компонентов. Это позволяет обеспечить согласованность и простоту в обновлении всех созданных материалов.'}, 'en': {'title': 'Automating Research Dissemination with Consistent Artifacts', 'desc': 'ResearchStudio-Reel automates the process of turning academic papers into various formats like posters, videos, and blogs. It uses a shared paper extractor to ensure consistency and allows for editable outputs, overcoming limitations of previous automation methods. The system integrates multiple skills to create high-quality artifacts that can be reused and modified, ensuring factual accuracy across all formats. This approach not only enhances the quality of the generated materials but also allows authors to interactively engage with their work in a cohesive manner.'}}}, {'id': 'https://huggingface.co/papers/2607.04439', 'title': 'ResearchStudio-Idea: An Evidence-Grounded Research-Ideation Skill Suite from ML Conference Outcomes', 'url': 'https://huggingface.co/papers/2607.04439', 'abstract': 'Abstract ResearchStudio-Idea provides a skill suite for effective research ideation that combines literature search, novelty checking, and pattern-guided generation to produce traceable research proposals.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large language models have made research ideation increasingly accessible, yet effective idea development requires more than generating candidate directions. Researchers must ground a problem in current literature, identify meaningful bottlenecks, differentiate from existing solutions, and evaluate risks before committing to implementation. We present ResearchStudio-Idea as a reusable skill suite for this first mile of research ideation. The suite includes Paper-Search, a standalone multi-source literature search skill; Scoop-Check, a standalone prior-art collision checker for novelty claims; and IdeaSpark, the end-to-end skill that composes evidence grounding, pattern-guided generation, collision retrieval, audit, and idea-card rendering into one workflow. IdeaSpark is constructed from a corpus of 1,947 machine learning conference papers collected from ICLR, ICML, and NeurIPS between 2021 and 2025, including Oral papers, a separately tracked high-citation subset, and rejected submissions. Analysis of these outcomes reveals 31 recurring ideation sub-patterns, consolidated into 15 reusable ideation patterns. Each pattern is operationalized as a structured card containing research contexts, bottleneck types, differentiation strategies, supporting precedents, and common failure modes. Given a research problem and an evidence bundle, IdeaSpark evaluates evidence readiness, reconstructs the surrounding research context, identifies unresolved bottlenecks, selects relevant patterns, instantiates one candidate direction, retrieves potentially conflicting prior work, and performs outcome-informed auditing. This workflow transforms reusable ideation patterns into traceable research proposals. Blind automated-judge evaluations show that IdeaSpark consistently produces stronger research proposals than no-skill and generic-skill baselines while maintaining competitive novelty.', 'score': 29, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': '60fd8c420ce99230', 'github_url': '', 'github_stars': 0, 'authors': ['Qihao Zhao', 'Yangyu Huang', 'Yalun Dai', 'Lingao Xiao', 'Jianjun Gao', 'Xin Zhang', 'Wenshan Wu', 'Scarlett Li', 'Yang He', 'Yan Lu', 'Yap Kim Hui'], 'affiliations': ['CFAR, A*STAR', 'Microsoft Research', 'Nanyang Technological University', 'National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.04439.jpg', 'data': {'categories': ['#survey', '#dataset', '#multimodal', '#data', '#science'], 'emoji': '🧠', 'ru': {'title': 'Инновационные идеи с ResearchStudio-Idea', 'desc': 'ResearchStudio-Idea представляет собой набор инструментов для эффективной генерации идей в исследовательской деятельности, который сочетает в себе поиск литературы, проверку новизны и генерацию идей с учетом паттернов. Он помогает исследователям не только генерировать идеи, но и закреплять их в текущей литературе, выявлять узкие места и оценивать риски. Основной компонент, IdeaSpark, использует данные из более чем 1900 статей по машинному обучению, чтобы сформировать структурированные карты идей. Этот подход позволяет преобразовать паттерны генерации идей в отслеживаемые исследовательские предложения.'}, 'en': {'title': 'Transforming Research Ideas into Traceable Proposals', 'desc': 'ResearchStudio-Idea is a skill suite designed to enhance research ideation by integrating literature search, novelty checking, and structured idea generation. It helps researchers ground their problems in existing literature, identify key challenges, and differentiate their proposals from prior work. The suite includes tools like Paper-Search for literature retrieval, Scoop-Check for assessing novelty, and IdeaSpark for generating comprehensive research proposals. By utilizing a corpus of machine learning papers, IdeaSpark identifies recurring ideation patterns and transforms them into traceable proposals, demonstrating superior performance in generating quality research ideas.'}}}, {'id': 'https://huggingface.co/papers/2607.04425', 'title': 'UI-MOPD: Multi-Platform On-Policy Distillation for Continual GUI Agent Learning', 'url': 'https://huggingface.co/papers/2607.04425', 'abstract': 'Abstract Uni-GUI dataset and UI-MOPD method enable cross-platform GUI agent training by addressing limited data and platform-specific capability degradation through multi-teacher on-policy distillation.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recent advances in multimodal foundation models and agent systems have driven GUI agents from single-platform task execution toward cross-platform interaction. However, building multi-platform GUI agents remains challenging. On one hand, high-quality and executable cross-platform interaction trajectories are still scarce, and existing data often suffer from limited platform coverage. On the other hand, different platforms exhibit distinct interaction conventions, making joint or continual training prone to behavioral pattern mixing, platform-specific capability degradation, and catastrophic forgetting. To address these challenges, we construct Uni-GUI, a high-quality cross-platform GUI interaction dataset, and propose UI-MOPD, the first method that incorporates multi-teacher on-policy distillation into continual learning for GUI agents. UI-MOPD dynamically selects a platform-specific teacher according to the current environment and transfers platform-specific behavioral priors to a shared policy through platform-conditioned distillation, enabling adaptation to new platforms while preserving capabilities on existing ones. Experiments on OSWorld and MobileWorld show that UI-MOPD achieves task success rates of 38.2% and 12.0%, respectively, demonstrating its effectiveness in balancing cross-platform capability retention and new-platform adaptation.   Project page: https://elispectre.github.io/UI-MOPD/.', 'score': 29, 'issue_id': 2776, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'df144294b20c4e10', 'github_url': '', 'github_stars': 0, 'authors': ['Niu Lian', 'Alan Chen', 'Zhehao Yu', 'Chengzhen Duan', 'Fazhan Liu', 'Hui Liu', 'Pei Fu', 'Jian Luan', 'Yaowei Wang', 'Shu-Tao Xia', 'Jinpeng Wang'], 'affiliations': ['Harbin Institute of Technology, Shenzhen', 'Peng Cheng Laboratory', 'Tsinghua Shenzhen International Graduate School, Tsinghua University', 'Xiaomi', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04425.jpg', 'data': {'categories': ['#continual_learning', '#agents', '#transfer_learning', '#dataset'], 'emoji': '🌐', 'ru': {'title': 'Многофункциональные GUI-агенты: адаптация и сохранение возможностей', 'desc': 'В статье рассматриваются проблемы, связанные с обучением многофункциональных графических интерфейсов (GUI) на разных платформах. Для решения этих проблем был создан набор данных Uni-GUI и предложен метод UI-MOPD, который использует многопедагогическую дистилляцию. Это позволяет адаптироваться к новым платформам, сохраняя при этом уже приобретенные возможности. Эксперименты показывают, что метод UI-MOPD эффективно справляется с задачей балансировки между сохранением возможностей и адаптацией к новым платформам.'}, 'en': {'title': 'Empowering Cross-Platform GUI Agents with UI-MOPD', 'desc': 'This paper introduces the Uni-GUI dataset and the UI-MOPD method to enhance cross-platform GUI agent training. It addresses the challenges of limited data and platform-specific performance issues by using multi-teacher on-policy distillation. The proposed method allows GUI agents to adapt to new platforms while maintaining their capabilities on existing ones. Experiments demonstrate that UI-MOPD effectively balances the retention of cross-platform skills and the adaptation to new environments.'}}}, {'id': 'https://huggingface.co/papers/2607.02642', 'title': 'GigaWorld-1: A Roadmap to Build World Models for Robot Policy Evaluation', 'url': 'https://huggingface.co/papers/2607.02642', 'abstract': 'Abstract World models for robotic policy evaluation are systematically studied through a new benchmark, revealing that long-horizon rollout consistency and robot-specific controllability are more important than short-term visual realism for reliable policy assessment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Evaluating embodied robot foundation models remains a critical bottleneck; unlike large language models efficiently assessed via digital benchmarks, robotic policies require slow, costly real-world rollouts limited by hardware and human supervision, which has driven interest in world models as surrogate policy evaluators, yet the key properties that make a world model reliable for policy assessment remain poorly understood. This work presents a systematic study of world models for robotic policy evaluation and introduces WMBench, a benchmark constructed from real-robot teleoperation data and matched policy rollouts covering diverse manipulation tasks to enable controlled comparisons across model families, action encodings, rollout horizons, and evaluation metrics. Using WMBench, we analyze 7 video world models, 4 action representation schemes, and over 324,000 simulated policy rollouts paired with real robot executions, further enriching our analysis with large-scale community submissions from the CVPR 2026 GigaBrain Challenge, curated synthetic trajectories, and a training videos spanning more than 12,000 hours. Our experiments deliver three core insights: evaluator quality is dominated by long-horizon, action-faithful rollout consistency rather than short-term visual realism; pretraining gains stem not only from data scale but from balancing general world knowledge with robot-specific controllability; and architectural choices including action encoding, memory design, and evaluator-focused post-training strongly determine alignment with real-world robot behavior. Drawing on these results, we derive a practical design roadmap and realize it in GigaWorld-1, a world model specially optimized for policy evaluation, and we fully release our code, models, datasets, and toolkits to advance scalable evaluation research for embodied foundation models.', 'score': 25, 'issue_id': 2775, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'a93b4fe1650940f6', 'github_url': '', 'github_stars': 0, 'authors': ['GigaWorld Team', 'Angyuan Ma', 'Boyuan Wang', 'Bohan Li', 'Chaojun Ni', 'Guo Li', 'Guan Huang', 'Guosheng Zhao', 'Hao Li', 'Hengtao Li', 'Jingyu Liu', 'Jiwen Lu', 'Qiuping Deng', 'Tingdong Yu', 'Xuancheng Xu', 'Xinyu Zhou', 'Xiuwei Xu', 'Xinze Chen', 'Xiaofeng Wang', 'Xiaoyu Tian', 'Yang Wang', 'Yifan Chang', 'Yukun Zhou', 'Yun Ye', 'Zhenyu Wu', 'Zhanqian Wu', 'Zheng Zhu'], 'affiliations': ['GigaAI', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02642.jpg', 'data': {'categories': ['#survey', '#agent_memory', '#dataset', '#optimization', '#architecture', '#benchmark', '#robotics', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Долгосрочная надежность важнее краткосрочной реалистичности', 'desc': 'В статье исследуется применение мироустройств для оценки роботизированной политики через новый бенчмарк WMBench. Установлено, что важнее долгосрочная согласованность развертывания и управляемость, специфичная для робота, чем краткосрочная визуальная реалистичность. Также обсуждаются ключевые свойства мироустройств, влияющие на их надежность в оценке политик. В результате работы была разработана архитектура GigaWorld-1, специально оптимизированная для оценки политик, и представлены все данные и инструменты для дальнейшего исследования.'}, 'en': {'title': 'Prioritizing Long-Horizon Consistency for Robotic Policy Evaluation', 'desc': 'This paper investigates the effectiveness of world models in evaluating robotic policies, emphasizing the importance of long-horizon rollout consistency and robot-specific controllability over short-term visual realism. It introduces WMBench, a benchmark designed from real-robot data to facilitate comparisons across various model families and evaluation metrics. The study analyzes multiple video world models and action representation schemes, revealing that the quality of evaluators is significantly influenced by their ability to maintain action fidelity over longer horizons. The findings lead to the development of GigaWorld-1, a world model optimized for policy evaluation, with all resources made publicly available to enhance research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.04033', 'title': 'OmniOpt: Taxonomy, Geometry, and Benchmarking of Modern Optimizers', 'url': 'https://huggingface.co/papers/2607.04033', 'abstract': 'Abstract OmniOpt presents a unified framework for optimizer selection in large-scale model training by combining meta-pipeline transformations, norm-constrained linear minimization oracles, and a cross-domain benchmark to systematically analyze optimizer families and their trade-offs across different training objectives and model scales.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Optimizer selection for large-scale model training has become a system-level design decision constrained jointly by compute, memory, tuning budget, and task diversity, yet the landscape of over one hundred methods remains fragmented. We therefore present OmniOpt, a unified survey and benchmark cookbook of optimizers for the research community. OmniOpt rests on four coupled components. First, we treat every optimizer update as a structured transformation through a five-stage meta-pipeline, and show that most methods engage only one or two of these stages. Second, we use norm-constrained linear minimization oracles (LMOs) to unify different optimizers. Third, these two views ground a dual-dimension taxonomy, one dimension assigning each method to a mechanism family and the other recording the measurable training objectives it aims to improve. Fourth, and at the core of this paper, we instantiate the full taxonomy in a unified cross-domain benchmark spanning representative optimizers, model scales, and training regimes from language model pretraining to image classification, systematically analyzing each method family across multiple effect objectives and laying out their trade-offs. OmniOpt thus supplies the research community with an operational coordinate system for selecting optimizers under explicit mechanism and objective assumptions, and charts a direction for the future development of the optimizer community.', 'score': 19, 'issue_id': 2776, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': 'add1731367ae6681', 'github_url': '', 'github_stars': 0, 'authors': ['Siyuan Li', 'Jiabao Pan', 'Yumou Liu', 'Zhuoli Ouyang', 'Xin Jin', 'Xinglong Xu', 'Jingxuan Wei', 'Shengye Pang', 'Jintao Che', 'Xuanhe Zhou', 'Conghui He', 'Cheng Tan'], 'affiliations': ['Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'Shanghai University', 'Southern University of Science and Technology', 'UCAS', 'Westlake University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.04033.jpg', 'data': {'categories': ['#survey', '#training', '#optimization', '#benchmark'], 'emoji': '⚙️', 'ru': {'title': 'OmniOpt: универсальный выбор оптимизаторов для обучения моделей', 'desc': 'Статья представляет OmniOpt — универсальную платформу для выбора оптимизаторов при обучении крупных моделей. Она объединяет преобразования мета-конвейера, нормы-ограниченные линейные минимизационные оракулы и кросс-доменные бенчмарки для систематического анализа семейств оптимизаторов. OmniOpt предлагает единую таксономию, рассматривающую различные подходы к оптимизации и их влияние на задачи обучения. Этот инструмент позволяет исследователям более эффективно выбирать оптимизаторы с учетом механизмов и целей задач.'}, 'en': {'title': 'Streamlining Optimizer Selection for Large-Scale Training', 'desc': 'OmniOpt introduces a comprehensive framework for selecting optimizers in large-scale model training. It combines various techniques, including meta-pipeline transformations and norm-constrained linear minimization oracles, to analyze different optimizer families. The framework categorizes optimizers based on their mechanisms and the training objectives they target, providing a structured approach to understanding their trade-offs. By offering a unified benchmark, OmniOpt aids researchers in making informed decisions about optimizer selection across diverse tasks and model scales.'}}}, {'id': 'https://huggingface.co/papers/2607.02646', 'title': 'EVA-Client: A Unified Data Collection, Inference, and Deployment Framework for Embodied Policies on Real Robots', 'url': 'https://huggingface.co/papers/2607.02646', 'abstract': 'Abstract EVA-Client is an open-source framework that unifies real-robot policy deployment, data collection, and evaluation through a component-decoupled architecture with inspectable execution workflows.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present EVA-Client, an open-source framework for deployment, data collection, and evaluation of trained manipulation policies on real robots. Sitting between a policy server and the physical hardware, EVA-Client unifies the real-robot stages of the policy iteration loop within a single codebase. It makes three contributions. First, a component-decoupled architecture in which robot backends, inference strategies, and transport middlewares form an orthogonal grid: adding a robot or a strategy touches only its own layer. Second, inspectable execution through Debug, Collect, and Eval workflows, with modes ranging from open-loop simulation to continuous real-time control. Third, every evaluation run doubles as a data collection, recording full rollouts in training-ready format alongside exhaustive logs and a side-by-side comparison viewer, so each evaluation feeds the next round of training rather than ending as an unrecorded impression. EVA-Client further consolidates major real-time inference strategies, synchronous and asynchronous execution, ACT-style temporal ensembling, Real-Time Chunking, and a naive-async ablation baseline, behind a single configuration surface.', 'score': 19, 'issue_id': 2776, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'bb96105e747c3109', 'github_url': '', 'github_stars': 0, 'authors': ['Heqing Yang', 'Yang Yi', 'Liyao Wang', 'Linqing Zhong', 'Donglin Yang', 'Ruipu Wu', 'Zitong Bai', 'Fengjiao Chen', 'Manyuan Zhang', 'Linjiang Huang', 'Si Liu'], 'affiliations': ['CoLab, Beihang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02646.jpg', 'data': {'categories': ['#agents', '#training', '#open_source', '#optimization', '#robotics', '#data'], 'emoji': '🤖', 'ru': {'title': 'EVA-Client: единая платформа для работы с реальными роботами', 'desc': 'EVA-Client — это открытая платформа для развертывания, сбора данных и оценки обученных политик манипуляции на реальных роботах. Она объединяет этапы итерационного цикла политики, обеспечивая модульную архитектуру, где добавление нового робота или стратегии затрагивает лишь соответствующий слой. EVA-Client предлагает инспектируемые рабочие процессы, позволяя отлаживать, собирать данные и оценивать действия робота в реальном времени. Каждая оценка также служит для сбора данных, формируя полные впечатления для следующего раунда обучения.'}, 'en': {'title': 'Streamlining Robot Policy Deployment and Evaluation', 'desc': 'EVA-Client is an open-source framework designed to streamline the deployment, data collection, and evaluation of manipulation policies on real robots. It features a component-decoupled architecture that allows for easy integration of different robot backends and inference strategies without affecting other components. The framework includes inspectable execution workflows that support various modes, from simulation to real-time control, enhancing the debugging and evaluation process. Additionally, each evaluation run serves as a data collection opportunity, ensuring that insights gained feed back into the training loop for continuous improvement.'}}}, {'id': 'https://huggingface.co/papers/2607.04443', 'title': 'Wan-Streamer v0.2: Higher Resolution, Same Latency', 'url': 'https://huggingface.co/papers/2607.04443', 'abstract': "Abstract Wan-Streamer v0.2 enhances audio-visual interaction by increasing visual resolution while maintaining low latency through optimized thinker-performer architecture with multi-GPU parallel processing.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present Wan-Streamer v0.2, a latency-preserving upgrade of the native-streaming, end-to-end audio-visual interaction model. v0.2 keeps the v0.1 modeling formulation, but raises the interactive output stream from 192x336 to 640x368 while preserving approximately 200 ms model-side signal-to-signal latency at 25 FPS. The higher-resolution stream supports scene-grounded mid-shot agents whose posture, gaze, hands, nearby objects, and local scene layout remain legible during real-time conversation. To support the larger visual stream without adding user-visible delay, v0.2 keeps the thinker as a single-GPU low-latency path for streaming perception, the short language/state Transformer pass that builds the generation cache, and final decoding. The performer becomes a multi-GPU Ulysses-style context-parallel group for the expensive next-unit latent generation. Each performer rank writes incoming K/V into a pre-sharded local cache. The long high-resolution latent video sequence is split across ranks for denoising and gathered through Ulysses communication, while the much shorter audio latent sequence is generated without sequence sharding. In this split, the thinker's language/state computation reaches the performer only as K/V conditioning, so no separate language sequence has to be communicated inside the performer group. This concentrates additional hardware on visual generation while preserving the compact thinker-performer boundary, keeping total remote interaction latency at approximately 550 ms when a 350 ms bidirectional network budget is included.", 'score': 15, 'issue_id': 2775, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': '2c2747949a87b511', 'github_url': '', 'github_stars': 0, 'authors': ['Lianghua Huang', 'Zhi-Fan Wu', 'Yupeng Shi', 'Wei Wang', 'Mengyang Feng', 'Junjie He', 'Chen-Wei Xie', 'Yu Liu', 'Jingren Zhou', 'Ang Wang', 'Bang Zhang', 'Baole Ai', 'Chen Liang', 'Cheng Yu', 'Chongyang Zhong', 'Jinwei Qi', 'Kai Zhu', 'Pandeng Li', 'Peng Zhang', 'Wenyuan Zhang', 'Xinhua Cheng', 'Yitong Huang', 'Yun Zheng', 'Yuxiang Bao', 'Yuzheng Wang', 'Zoubin Bi'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.04443.jpg', 'data': {'categories': ['#multimodal', '#audio', '#architecture', '#optimization'], 'emoji': '🎤', 'ru': {'title': 'Новая эра аудио-визуального взаимодействия!', 'desc': 'Статья описывает обновление Wan-Streamer v0.2, которое улучшает взаимодействие аудио и видео за счёт повышения разрешения изображения при низкой задержке. Модель сохраняет формулировку v0.1, но увеличивает поток до 640x368 пикселей и поддерживает задержку около 200 мс при 25 FPS. Это позволяет агентам в сцене сохранять читаемость позы, взгляда и объектов вокруг во время реального разговора. Архитектура использует параллельную обработку на нескольких GPU для оптимизации генерации контента без увеличения задержек для пользователя.'}, 'en': {'title': 'Enhancing Visuals Without the Wait', 'desc': "Wan-Streamer v0.2 improves audio-visual interaction by enhancing visual resolution while keeping latency low. It maintains the original model's structure but increases the output resolution significantly, allowing for clearer mid-shot agents during real-time conversations. The architecture utilizes a single-GPU thinker for low-latency perception and a multi-GPU performer for generating high-resolution visuals. This design ensures that the overall interaction latency remains manageable, even with the increased visual complexity."}}}, {'id': 'https://huggingface.co/papers/2607.04988', 'title': 'InternVLA-A1.5: Unifying Understanding, Latent Foresight, and Action for Compositional Generalization', 'url': 'https://huggingface.co/papers/2607.04988', 'abstract': 'Abstract InternVLA-A1.5 integrates pretrained vision-language models with future prediction in latent space to enable efficient robot manipulation with preserved semantics and long-horizon execution.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Unified models for robot manipulation aim to equip one policy with both the semantic priors of pretrained VLMs and the physical dynamics learned through future prediction. In practice, existing designs tend to erode the semantics of the pretrained backbone, suffer interference among heterogeneous objectives, and learn future prediction from scratch in pixel space, leaving the dynamics priors of pretrained video generators unexploited. We present InternVLA-A1.5, which builds the policy on a native VLM backbone that keeps training on VQA and subtask prediction, and attaches a lightweight unified expert for continuous action generation. Future prediction is recast as a latent-querying problem, where a small set of learnable foresight tokens condenses the task-relevant future into a compact latent code under the supervision of a frozen pretrained video generation model, so the policy inherits world-model dynamics priors without ever learning pixel-level generation. The video branch is discarded at inference, keeping real-time control. Pretrained on 1.2M robot episodes and 3M multimodal samples, InternVLA-A1.5 achieves the best overall results on all six simulation benchmarks. In the real world, the preserved semantics deliver the strongest compositional generalization on held-out instruction bindings, and the two designs together sustain long-horizon execution.', 'score': 6, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '6ce96e73e471dc5b', 'github_url': '', 'github_stars': 0, 'authors': ['Haoxiang Ma', 'Junhao Cai', 'Xiaoxu Xu', 'Hao Li', 'Yuyin Yang', 'Yang Tian', 'Jiafei Cao', 'Hongrui Zhu', 'Zherui Qiu', 'Zhaxizhuoma', 'Yuqiang Yang', 'Jiaqi Peng', 'Xueyuan Wei', 'Yangkun Zhu', 'Jiahao Jiang', 'Xing Gao', 'Hanqing Wang', 'Feng Yuan', 'Kailin Li', 'Xueyue Zhu', 'Tai Wang', 'Yan Ding', 'Jiangmiao Pang', 'Jia Zeng', 'Jingjing Zhang', 'Bowen Zhou', 'Yao Mu', 'Chunhua Shen', 'Weinan Zhang'], 'affiliations': ['Physical Intelligence Team, Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.04988.jpg', 'data': {'categories': ['#agents', '#agi', '#multimodal', '#robotics', '#optimization', '#benchmark', '#games'], 'emoji': '🤖', 'ru': {'title': 'Инновационная модель для управления роботами', 'desc': 'Статья описывает модель InternVLA-A1.5, которая объединяет предобученные модели обработки изображений и текста с предсказанием будущего для эффективного управления роботами. Она сохраняет семантику и обеспечивает возможность длительного выполнения задач. Модель использует легкий унифицированный эксперт для генерации непрерывных действий и переопределяет предсказание будущего как задачу латентного запроса. В результате, InternVLA-A1.5 демонстрирует лучшие результаты на шести симуляционных тестах и обеспечивает надежную обобщающую способность в реальном мире.'}, 'en': {'title': 'Efficient Robot Manipulation with Semantic Preservation', 'desc': 'InternVLA-A1.5 combines pretrained vision-language models with future prediction to enhance robot manipulation while maintaining semantic understanding. It utilizes a unified policy that integrates semantic knowledge from pretrained models and physical dynamics learned through future predictions. By treating future prediction as a latent-querying problem, it efficiently condenses relevant future information into a compact latent code, leveraging pretrained video generation dynamics without pixel-level learning. This approach results in superior performance across simulation benchmarks and strong generalization in real-world tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.04428', 'title': 'dOPSD: On-Policy Self-Distillation for Diffusion Language Models', 'url': 'https://huggingface.co/papers/2607.04428', 'abstract': "Abstract Diffusion large language models face challenges in reasoning enhancement through post-training, but a novel on-policy self-distillation method using internal denoising trajectories improves mathematical reasoning and code generation performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Diffusion large language models (dLLMs) generate text by iteratively denoising a masked sequence, offering a parallel alternative to autoregressive models, but eliciting strong reasoning through post-training remains difficult: supervised fine-tuning is off-policy and suffers from exposure bias, while reinforcement learning gives only sparse, sequence-level rewards and is hard to apply without tractable sequence likelihoods. On-policy self-distillation (OPSD) offers a promising alternative, using one model as both student and teacher to provide dense, token-level, on-policy supervision, but its effectiveness hinges on giving the teacher privileged information (PI) - typically an instance-specific ground-truth reference unavailable at inference - so the student ends up distilling a weak PI-free consensus policy that yields little improvement on dLLM reasoning. We introduce dOPSD, which instead derives the teacher's privilege directly from the student's own denoising trajectory, evaluating masked positions using later, more-decoded steps of that same trajectory rather than an external label, so the teacher's advantage emerges from the model's own decoding process; on Dream and LLaDA, dOPSD improves both in-domain math reasoning and out-of-domain code generation, outperforming supervised and on-policy baselines.", 'score': 6, 'issue_id': 2776, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'edf1485217fa46f3', 'github_url': '', 'github_stars': 0, 'authors': ['Phuong Tuan Dat', 'Qi Li', 'Xinchao Wang'], 'affiliations': ['National University of Singapore'], 'pdf_title_img': 'assets/pdf/title_img/2607.04428.jpg', 'data': {'categories': ['#reasoning', '#training', '#math', '#rl', '#optimization', '#diffusion'], 'emoji': '💡', 'ru': {'title': 'Новый подход к самодистилляции для улучшения reasoning в языковых моделях', 'desc': 'В работе предложен новый метод самодистилляции под названием dOPSD, который улучшает способность больших языковых моделей к математическому рассуждению и генерации кода. Этот метод использует внутренние траектории денойзинга, позволяя модели черпать информацию из собственных результатов. В отличие от традиционных методов, dOPSD обеспечивает более плотный уровень супервизии, что способствует улучшению качества выводов. Полученные результаты показывают значительное превосходство над существующими методами, такими как управляемая дополнительная настройка.'}, 'en': {'title': 'Empowering dLLMs with Self-Distillation for Better Reasoning', 'desc': "This paper presents a new method called dOPSD that enhances reasoning in diffusion large language models (dLLMs) through on-policy self-distillation. Unlike traditional methods that rely on external labels, dOPSD uses the model's own denoising trajectory to provide supervision, allowing it to learn from its own decoding process. This approach helps improve mathematical reasoning and code generation performance by leveraging token-level feedback. The results show that dOPSD outperforms existing supervised and on-policy methods in various tasks."}}}, {'id': 'https://huggingface.co/papers/2607.04605', 'title': 'Do All Visual Tokens Matter Equally? Object-Evidence Preserving Token Merging for Vision-Language Retrieval', 'url': 'https://huggingface.co/papers/2607.04605', 'abstract': 'Abstract Object-aware token merging framework SaMer compresses image-side tokens while preserving query-selectable visual evidence, achieving significant storage reduction and improved retrieval performance.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Multi-vector vision-language retrieval preserves fine-grained visual evidence through maximum-similarity late interaction, but dense image-side tokens make storage and scoring expensive. Existing token compression methods reduce this cost, yet they can remove or collapse object- and region-level evidence that future query tokens may need to select. We propose SaMer, an object-aware token merging framework that compresses image-side post-projector tokens into K representative centroids while preserving the original late-interaction interface. SaMer uses object annotations only during training as a merge prior to discourage cross-instance mixing, requires no ground-truth bounding boxes or detectors at inference time, and adapts only the shared projection layer with frozen vision and language backbones. With K=64, SaMer removes more than 93% of image-side tokens and reduces ColPali storage by 16.09times, while improving R@1 on Flickr30K and MSCOCO. These gains arise because object-aware merging preserves query-selectable object evidence that pruning or feature-only pooling can remove or collapse. SaMer also outperforms compression baselines and shows stronger phrase-level grounding, suggesting that efficient multi-vector retrieval depends not only on reducing token count, but on preserving the evidence future query tokens need to select.', 'score': 5, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'fb8c08df9018d651', 'github_url': '', 'github_stars': 0, 'authors': ['Suhyeong Park', 'Junha Jung', 'Jungwoo Park', 'Jaewoo Kang'], 'affiliations': ['AIGEN Sciences Inc.', 'Korea University', 'The Catholic University of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.04605.jpg', 'data': {'categories': ['#compression', '#retrieval'], 'emoji': '🖼️', 'ru': {'title': 'Эффективное сжатие токенов с сохранением визуальных доказательств', 'desc': 'В статье представлен метод SaMer, который сжимает токены на стороне изображения, сохраняя визуальные доказательства, доступные для выбора запросами. Этот подход значительно уменьшает объем хранимых данных и улучшает производительность поиска. Метод использует аннотации объектов только на этапе обучения, что предотвращает смешивание экземпляров, и не требует использования граунд-трастовых ограничений при inference. SaMer позволяет удалить более 93% токенов, улучшая качество поиска на таких датасетах, как Flickr30K и MSCOCO.'}, 'en': {'title': 'Efficient Token Compression with Object Awareness', 'desc': 'The paper introduces SaMer, an object-aware token merging framework designed to compress image-side tokens while maintaining essential visual evidence for queries. This method significantly reduces storage requirements and enhances retrieval performance by merging tokens into representative centroids without losing critical object information. SaMer operates with object annotations only during training, allowing it to function without ground-truth bounding boxes during inference. The results demonstrate that SaMer not only decreases the number of tokens but also improves the accuracy of phrase-level grounding in vision-language tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.05373', 'title': 'PixWorld: Unifying 3D Scene Generation and Reconstruction in Pixel Space', 'url': 'https://huggingface.co/papers/2607.05373', 'abstract': 'Abstract PixWorld presents a unified pixel-space diffusion approach for 3D reconstruction and generation that overcomes limitations of latent-space methods through direct image-level supervision and geometry-aware feature alignment.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct 3D reconstruction and generation are commonly tackled by separate paradigms: pixel-based regression for reconstruction, and latent diffusion for generation. Recent works attempt to unify them in latent space, but with notable drawbacks: the diffusion objective is defined on latent features rather than the underlying 3D representation, and both branches suffer from information loss introduced by latent encoding, while requiring a pretrained Variational Autoencoder (VAE) or Representation Autoencoder (RAE). In this paper, we reformulate these two tasks under a unified pixel-space diffusion paradigm and introduce PixWorld, a single model that jointly addresses 3D reconstruction and generation. By supervising diffusion directly on rendered images, PixWorld removes the above limitations and aligns optimization with 3D scene fidelity. Beyond photometric and perceptual supervision that operates at the 2D image level and lacks 3D geometric awareness, we further introduce a geometry perception loss that aligns rendered views with their ground truth in the geometry-aware feature space of a pretrained 3D foundation model, providing 3D structural supervision. PixWorld consistently outperforms prior latent-space generation methods and matches state-of-the-art reconstruction methods, demonstrating the superiority of a unified pixel-space approach.', 'score': 4, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '3b332251ee08ef60', 'github_url': '', 'github_stars': 0, 'authors': ['Sensen Gao', 'Zhaoqing Wang', 'Qihang Cao', 'Dongdong Yu', 'Changhu Wang', 'Jia-Wang Bian'], 'affiliations': ['AISphere', 'Nanyang Technological University'], 'pdf_title_img': 'assets/pdf/title_img/2607.05373.jpg', 'data': {'categories': ['#diffusion', '#3d', '#architecture', '#optimization'], 'emoji': '🌌', 'ru': {'title': 'Единый подход к 3D реконструкции и генерации', 'desc': 'Статья описывает подход PixWorld, который объединяет методы диффузии в пиксельном пространстве для трехмерной реконструкции и генерации. Он преодолевает ограничения методов, основанных на латентном пространстве, благодаря прямому контролю на уровне изображений и согласованию признаков с учетом геометрии. PixWorld использует единый модельный подход, который совместно решает задачи реконструкции и генерации, улучшая соответствие с 3D сценами. Новый метод доказал свою эффективность, превзойдя предыдущие латентные методы и сопоставив результаты с современными методами реконструкции.'}, 'en': {'title': 'Revolutionizing 3D with Unified Pixel-Space Diffusion', 'desc': 'PixWorld introduces a new method for 3D reconstruction and generation using a unified pixel-space diffusion approach. This method directly supervises the diffusion process on images, avoiding the pitfalls of latent-space methods that can lose important information. By aligning the optimization with the actual 3D scene, PixWorld enhances both photometric and geometric accuracy. The results show that this approach outperforms previous methods and achieves state-of-the-art performance in 3D tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.05391', 'title': 'LLM-as-a-Verifier: A General-Purpose Verification Framework', 'url': 'https://huggingface.co/papers/2607.05391', 'abstract': "Abstract LLM-as-a-Verifier introduces a probabilistic verification framework that scales across multiple dimensions to improve solution correctness assessment and agent performance across various benchmarks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scaling pre-training, post-training, and test-time compute have become the central paradigms for improving the capabilities of LLMs. In this work, we identify verification, the ability to determine the correctness of a solution, as a new scaling axis. To unlock this and demonstrate its effectiveness, we introduce LLM-as-a-Verifier, a general-purpose verification framework that provides fine-grained feedback for agentic tasks without requiring additional training. Unlike standard LM judges that prompt LLMs to produce discrete scores for candidate solutions, LLM-as-a-Verifier computes the expectation over the distribution of scoring token logits to generate continuous scores. This probabilistic formulation enables verification to scale along multiple dimensions: (1) score granularity, (2) repeated evaluation, and (3) criteria decomposition. In particular, we show that scaling the scoring granularity leads to better separation between positive and negative solutions, resulting in more calibrated comparisons. Moreover, scaling repeated evaluation and criteria decomposition consistently lead to additional gains in verification accuracy through variance and complexity reduction. We further introduce a cost-efficient ranking algorithm for selecting the best solution among candidates using the verifier's continuous scores. LLM-as-a-Verifier achieves state-of-the-art performance on Terminal-Bench V2 (86.5%), SWE-Bench Verified (78.2%), RoboRewardBench (87.4%), and MedAgentBench (73.3%). Beyond verification, the fine-grained signals from LLM-as-a-Verifier can also serve as a proxy for estimating task progress. We build an extension for Claude Code, enabling developers to monitor and improve their own agentic systems. Finally, we show that LLM-as-a-Verifier can provide dense feedback for RL, improving the sample efficiency of SAC and GRPO on robotics and mathematical reasoning benchmarks.", 'score': 3, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '5111f1e8e7c4d04e', 'github_url': '', 'github_stars': 0, 'authors': ['Jacky Kwok', 'Shulu Li', 'Pranav Atreya', 'Yuejiang Liu', 'Yixing Jiang', 'Chelsea Finn', 'Marco Pavone', 'Ion Stoica', 'Azalia Mirhoseini'], 'affiliations': ['NVIDIA Research', 'Stanford University', 'UC Berkeley'], 'pdf_title_img': 'assets/pdf/title_img/2607.05391.jpg', 'data': {'categories': ['#agents', '#reasoning', '#robotics', '#training', '#math', '#rl', '#agent_memory', '#benchmark', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Новый подход к проверке решений с помощью LLM', 'desc': 'Статья представляет новый метод проверки решений с использованием LLM как проверяющего инструмента. Этот подход позволяет более точно оценивать корректность результатов, предоставляя непрерывные оценки вместо дискретных. Авторы утверждают, что улучшение градации оценок и многократные проверки способствуют повышению точности верификации. В результате, LLM-as-a-Verifier достигает высоких показателей в различных бенчмарках, демонстрируя свою эффективность.'}, 'en': {'title': 'Enhancing Solution Verification with LLM-as-a-Verifier', 'desc': 'The paper presents LLM-as-a-Verifier, a new framework for verifying the correctness of solutions generated by language models. It introduces a probabilistic approach that allows for fine-grained feedback without needing extra training. This method enhances the evaluation process by providing continuous scores instead of discrete ones, improving the distinction between correct and incorrect solutions. The framework demonstrates state-of-the-art performance across various benchmarks and offers insights for monitoring agentic systems and improving reinforcement learning efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.05352', 'title': 'Multiplayer Interactive World Models with Representation Autoencoders', 'url': 'https://huggingface.co/papers/2607.05352', 'abstract': "Abstract A large-scale multiplayer world model trained on extensive gameplay data demonstrates stable long-horizon rollouts in a complex physics-based environment while maintaining coherence across multiple agents' actions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce the first multiplayer world model for highly dynamic environments governed by complex physical interactions. Whereas single-player world models treat the other agents as part of the environment, ours conditions on the action streams of multiple agents, learning to attribute changes in the scene to the correct player and to stay coherent under arbitrary combinations of their actions. We study this problem in the game of Rocket League, where players compete and cooperate under fast, tightly coupled dynamics. Trained on 10,000 hours of gameplay collected with publicly available bots, our 5-billion-parameter latent diffusion model generates four-player matches in real time, producing 20 frames per second on a single Nvidia B200 GPU. Although trained only on short clips, its rollouts stay stable far beyond the training horizon: distributional quality holds steady out to five minutes, the longest horizon we measure, and in practice we observe rollouts continuing for hours with no sign of collapse. We systematically investigate the central design choices: the video codec, the generative objective, and the multiplayer conditioning scheme. In addition, we characterize how behavior changes with model and data scale, including the capabilities that emerge and the failure modes that persist. We further develop targeted evaluations that probe the model's physical understanding rather than visual appearance alone. To support continued research on multiplayer world models, we release our dataset, our full training and inference codebase, and a live demo.", 'score': 3, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '760f7398ee64af0f', 'github_url': '', 'github_stars': 0, 'authors': ['Anthony Hu', 'Václav Volhejn', 'Adrien Ramanana Rahary', 'Chris Mulder', 'Aditya Makkar', 'Amélie Royer', 'Manu Orsini', 'Alyx Liao', 'Adam Jelley', 'Eloi Alonso', 'Florian Laurent', 'Fredrik Norén', 'James Swingos', 'Jan Hünermann', 'Kent Rollins', 'Lucas Hosseini', 'Matthieu Le Cauchois', 'Maxim Peter', 'Pim de Witte', 'Tim Brown', 'Vincent Micheli', 'Moritz Böhle', 'Gabriel de Marmiesse', 'Viktoriia Sharmanska', 'Lucia Specia', 'Michael Black', 'Patrick Pérez'], 'affiliations': ['Epic Games'], 'pdf_title_img': 'assets/pdf/title_img/2607.05352.jpg', 'data': {'categories': ['#agents', '#training', '#rl', '#open_source', '#diffusion', '#games', '#dataset'], 'emoji': '⚽', 'ru': {'title': 'Инновационная мультиплеерная модель мира для динамических игр', 'desc': 'В данной статье представлен новый мультиплеерный мир модель, обученная на большом объеме игровых данных, которая демонстрирует стабильные долгосрочные результаты в сложной физической среде. Эта модель учитывает действия нескольких агентов и обеспечивает согласованность их взаимодействий. Исследование проводилось на примере игры Rocket League, где игроки соревнуются и сотрудничают. Модель способна генерировать матчи в реальном времени с высоким качеством и стабильностью, даже при долгосрочных интервалах.'}, 'en': {'title': 'Revolutionizing Multiplayer Dynamics with Stable World Models', 'desc': 'This paper presents a novel multiplayer world model designed for dynamic environments with complex physics, specifically applied to the game Rocket League. Unlike traditional single-player models, this approach conditions on the actions of multiple agents, allowing for coherent interactions and scene changes attributed to the correct player. The model, trained on extensive gameplay data, demonstrates impressive stability in long-horizon rollouts, maintaining quality for up to five minutes and even longer in practice. The authors also explore key design choices and provide resources for further research in multiplayer world modeling.'}}}, {'id': 'https://huggingface.co/papers/2607.05155', 'title': 'EdgeBench: Unveiling Scaling Laws of Learning from Real-World Environments', 'url': 'https://huggingface.co/papers/2607.05155', 'abstract': 'Abstract Analysis of 38,000 hours of real-world agent interactions reveals log-sigmoid scaling laws for performance and exponential learning speed improvements across 134 diverse tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Pretraining scaling laws reveal that model capability improves predictably with data and compute. But learning from real world environments after deployment remains far less understood. Analyzing roughly 38,000 hours of agent interaction with the environment across 134 real world tasks, we find, to the best of our knowledge, the first evidence that overall performance during environment learning follows a log-sigmoid scaling law with remarkably high precision, reaching R^2 = 0.998. Across model generations, we also find that agent learning speed roughly doubles every three months. This discovery stems from EdgeBench, a suite of 134 real world tasks with ultra-long horizons, spanning scientific discovery, software engineering, combinatorial optimization, professional knowledge work, formal mathematics, and interactive games. Each task sustains at least 12 hours of continuous agent operation under rich, multilevel feedback, and is built through substantial expert effort. We publicly release 51 tasks and our full evaluation framework to accelerate the study of how agents learn from real world experience.', 'score': 2, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '6e1a4655107681ee', 'github_url': '', 'github_stars': 0, 'authors': ['Deyao Zhu', 'Xin Zhou', 'Shengling Qin', 'Xuekai Zhu', 'Hangliang Ding', 'Shu Zhong', 'Zixin Wen', 'Zhonglin Xie', 'Chenhui Gou', 'Linxuan Ren', 'Yueyang Wang', 'Junfeng Zhong', 'Rui Liu', 'Tian Gao', 'Yangguang Lin', 'Jingyuan Zhang', 'Maojia Song', 'Xuan Qi', 'Jinhong Wu', 'Chenyang Zhang', 'Yinzhu Piao', 'Ziru Niu', 'Hongbin Lin', 'Lingxiang Meng', 'Peng Tang', 'Chengyao Tang', 'Shanyu Wu', 'Huanyu Zheng', 'Yu Liu', 'Liya Zhu', 'He Wang', 'Ming Ding', 'Ziyu Wan', 'Hao Liu', 'Sibo Wang', 'Haotian Zhu', 'Xintian Zhang', 'Nan Chai', 'Yipeng Liu', 'Panhao Lai', 'Sihang Yuan', 'Zixin Su', 'Ge Zhang', 'Wangchunshu Zhou', 'Yantao Du', 'Wenhao Huang', 'Guang Shi'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.05155.jpg', 'data': {'categories': ['#agents', '#continual_learning', '#training', '#open_source', '#agent_memory', '#benchmark', '#optimization', '#games', '#dataset'], 'emoji': '📈', 'ru': {'title': 'Лог-сигмоидальное масштабирование производительности агентов в реальном мире', 'desc': 'В данной статье исследуется влияние взаимодействия агентов с реальным миром на их производительность и скорость обучения. Анализ 38 000 часов взаимодействий показываeт, что производительность агентов следует лог-сигмоидальному закону масштабирования. Установлено, что скорость обучения агентов удваивается примерно каждые три месяца. Также представлено 51 задание для ускорения изучения обучения агентов на реальном опыте.'}, 'en': {'title': 'Unlocking Agent Learning: Scaling Laws in Real-World Tasks', 'desc': 'This paper analyzes 38,000 hours of real-world agent interactions to uncover log-sigmoid scaling laws that describe performance improvements and exponential learning speed across 134 diverse tasks. The findings indicate that as models are exposed to more data and computational resources, their capabilities improve predictably. However, the process of learning from real-world environments post-deployment is still not well understood. The study introduces EdgeBench, a comprehensive evaluation framework that includes 51 publicly released tasks, facilitating further research into agent learning from real-world experiences.'}}}, {'id': 'https://huggingface.co/papers/2607.05247', 'title': 'Vision Pretraining for Dense Spatial Perception', 'url': 'https://huggingface.co/papers/2607.05247', 'abstract': 'Abstract Boundary modeling enables dense spatial perception by learning sub-pixel representations that enhance depth estimation and support embodied AI applications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Dense spatial perception is essential for physical intelligence, where visual systems are expected to recover structured, metric, and actionable representations from pixel observations. Modern visual foundation models tend to prioritize semantic invariance, often at the expense of detailed spatial understanding. In this work, we study vision pretraining through a boundary-centric lens, motivated by the premise that boundaries and shape discontinuities offer essential cues for perceiving geometric properties. Concretely, we propose masked boundary modeling, a self-supervised paradigm that dynamically learns sub-pixel boundary representations and subsequently leverages the discovered boundary-bearing tokens as masked targets to facilitate dense visual token learning. By scaling this framework, we develop LingBot-Vision and demonstrate its efficacy across a diverse set of downstream vision tasks with DINOv3 as a strong baseline. Remarkably, LingBot-Vision drives the progression from LingBot-Depth 1.0 to LingBot-Depth 2.0 for depth completion, and thereby yields enhanced depth estimation, a key pillar for embodied artificial intelligence. Our findings reveal that boundary modeling goes beyond simple line segments and instead serves as a scalable pretraining principle for learning spatially structured visual representations.', 'score': 2, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'ecadf887c94f4549', 'github_url': '', 'github_stars': 0, 'authors': ['Zelin Fu', 'Bin Tan', 'Changjiang Sun', 'Shaohui Liu', 'Kecheng Zheng', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Nan Xue'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.05247.jpg', 'data': {'categories': ['#agents', '#agi', '#3d', '#games'], 'emoji': '🔍', 'ru': {'title': 'Моделирование границ для глубокого пространственного восприятия', 'desc': 'В этой статье рассматривается моделирование границ как способ улучшения пространственного восприятия для задач глубинногоEstimations и воплощенного ИИ. Мы предлагаем метод masked boundary modeling, который динамически обучает субпиксельные представления границ. Это позволяет эффективно извлекать визуальные токены и улучшает качество оценки глубины. Исследования показывают, что моделирование границ является важным принципом предварительного обучения для создания структурированных визуальных представлений.'}, 'en': {'title': 'Enhancing Depth Estimation through Boundary Modeling', 'desc': 'This paper introduces a method called masked boundary modeling to improve depth estimation in visual systems. By focusing on boundaries and shape discontinuities, the approach enhances the learning of sub-pixel representations, which are crucial for understanding spatial structures. The authors present LingBot-Vision, a framework that utilizes these boundary representations to boost performance in various vision tasks. The results show that this boundary-centric approach significantly advances depth completion, which is vital for embodied AI applications.'}}}, {'id': 'https://huggingface.co/papers/2607.01793', 'title': 'Safety Testing LLM Agents at Scale: From Risk Discovery to Evidence-Grounded Verification', 'url': 'https://huggingface.co/papers/2607.01793', 'abstract': 'Abstract Automated safety testing framework Vera uses a three-stage pipeline to identify and test safety risks in LLM agents through structured risk taxonomies, combinatorial case generation, and adaptive sandbox execution with evidence-based verification.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct LLM agents increasingly perform autonomous actions through external tools, leading to complex and evolving safety risks. However, existing safety testing targets expert-designed safety violations, and the corresponding outcomes are evaluated by hard-coded rules, making them costly to extend as agents evolve. To this end, we present Vera, an end-to-end automated safety testing framework that instantiates software engineering testing principles for non-deterministic agents through a three-stage, self-reinforcing pipeline. First, a literature-driven exploration continuously discovers and structures emerging risks into taxonomies of safety risks, attack methods, and tool execution environments. Second, combinatorial composition across taxonomy dimensions produces executable safety cases, each specifying a concrete safety goal, a programmatically constructed initial state, and a deterministic verification predicate grounded in observable artifacts. Third, adaptive execution runs heterogeneous agents in isolated sandboxes where a control agent steers multi-turn interaction based on runtime observations, while evidence-grounded verifiers judge outcomes from environment state and tool-call evidence rather than model self-report. We evaluate Vera on four production agent frameworks (OpenClaw, Hermes, Codex, Claude Code), revealing substantial safety weaknesses, with average attack success rates reaching 93.9\\% under multi-channel attacks; we also release Vera-Bench, comprising 1600 executable safety cases spanning 124 risk categories across three execution settings. These results indicate that modular, executable testing infrastructure is essential for rigorous and maintainable safety evaluation of rapidly evolving agentic systems at scale. The code is publicly available at https://github.com/Yunhao-Feng/Vera.', 'score': 2, 'issue_id': 2775, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '505249af88025d1a', 'github_url': '', 'github_stars': 0, 'authors': ['Yunhao Feng', 'Ruixiao Lin', 'Ming Wen', 'Qinqin He', 'Yanming Guo', 'Yifan Ding', 'Yutao Wu', 'Jialuo Chen', 'Yunhao Chen', 'Xiaohu Du', 'Jianan Ma', 'Zixing Chen', 'Zhuoer Xu', 'Xingjun Ma', 'Xinhao Deng'], 'affiliations': ['Alibaba Group', 'AntGroup', 'Deakin University', 'Fudan University', 'Hunan Institute of Advanced Technology', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01793.jpg', 'data': {'categories': ['#agent_memory', '#dataset', '#benchmark', '#agents', '#security', '#open_source'], 'emoji': '🛡️', 'ru': {'title': 'Новая эра в тестировании безопасности LLM-агентов', 'desc': 'Автоматизированная система тестирования безопасности Vera использует трехступенчатый процесс для выявления и тестирования рисков безопасности в LLM-агентах. Эта система организует риски в таксономии и генерирует проверочные случаи через комбинаторные композиции. Vera позволяет оценивать нештатных агентов в изолированных песочницах, где контрольный агент направляет взаимодействие на основе наблюдений. Результаты работы показывают, что модульная и исполняемая инфраструктура тестирования необходима для масштабной и поддерживаемой оценки безопасности быстро развивающихся систем агентов.'}, 'en': {'title': 'Vera: A Dynamic Safety Testing Framework for LLM Agents', 'desc': 'The paper presents Vera, an automated safety testing framework designed to identify and mitigate safety risks in large language model (LLM) agents. It employs a three-stage pipeline that includes risk taxonomy structuring, combinatorial case generation, and adaptive sandbox execution for evidence-based verification. Unlike traditional methods that rely on hard-coded rules, Vera dynamically generates safety cases and evaluates outcomes based on real-time observations. The framework has been tested on various agent frameworks, revealing significant safety vulnerabilities and emphasizing the need for modular testing infrastructures in evolving agentic systems.'}}}, {'id': 'https://huggingface.co/papers/2607.01764', 'title': 'Mastermind: Strategy-grounded Learning for Repository-Scale Vulnerability Reproduction', 'url': 'https://huggingface.co/papers/2607.01764', 'abstract': 'Abstract A dual-loop framework named Mastermind is introduced that separates strategy learning from task-specific experience to improve vulnerability reproduction capabilities in software engineering agents.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Repository-level vulnerability reproduction is a demanding software engineering (SE) task: an agent must inspect a codebase, infer the input grammar that reaches a vulnerable path, construct a proof-of-conceptv(PoC), and verify that the crash disappears on the patched build. Recent LLM agents can often execute these steps when the approach is correct, yet they still fail by choosing the wrong strategy. This paper argues that strategy, rather than the full action trajectory, is the right learning unit for such SE agents: it is compact enough to optimize, concrete enough to guide execution, and stable enough to store and reuse across attempts. We present Mastermind, a dual-loop framework that separates transferable strategy learning from task-specific experience. A trainable planner learns reusable vulnerability-reproduction strategies through SFT and milestone-based GRPO, while an experience loop maintains task-local strategy records that guide subsequent attempts. The planner is trained independently of the executor, allowing strategy learning to improve multiple frozen executors without modifying their action-generation capability. We evaluate Mastermind on CyberGym using 260 training tasks and 200 held-out evaluation tasks. With GPT-5.5 as the frozen executor, Mastermind achieves an 84.5% pass rate, outperforming open-book PoC context (60.0%), Best-of-8 sampling (63.0%), and iterative improvement (77.0%). The same planner also improves GPT-5.4 mini and GLM~5.1 from 45.0% and 58.5% to 60.0% and 71.0%. These results demonstrate that learning high-level strategies is an effective and transferable mechanism for improving repository-scale SE agents.', 'score': 2, 'issue_id': 2775, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '4b51db410895bce4', 'github_url': '', 'github_stars': 0, 'authors': ['Mingzhe Du', 'Luu Anh Tuan', 'Tianyi Wu', 'Renyang Liu', 'Zhijiang Guo', 'Dong Huang', 'See-Kiong Ng'], 'affiliations': ['Nanyang Technological University', 'National University of Singapore', 'The Hong Kong University of Science and Technology (Guangzhou)'], 'pdf_title_img': 'assets/pdf/title_img/2607.01764.jpg', 'data': {'categories': ['#training', '#optimization', '#transfer_learning', '#agents'], 'emoji': '🛠️', 'ru': {'title': 'Mastermind: стратегическое обучение для улучшения воспроизводимости уязвимостей', 'desc': 'В статье представлена двухконтурная структура под названием Mastermind, которая отделяет обучение стратегий от специфического опыта задач для улучшения способности воспроизводить уязвимости в программной инженерии. Агентам необходимо анализировать код, выявлять грамматику ввода для уязвимого пути, создавать доказательства концепции и проверять исправления. Mastermind обучает планировщика, который разрабатывает переиспользуемые стратегии воспроизведения уязвимостей, в то время как локальный цикл опыта поддерживает записи стратегий для последующих попыток. Результаты показывают, что изучение высокоуровневых стратегий эффективно улучшает работу агентов программной инженерии на уровне репозитория.'}, 'en': {'title': 'Mastermind: Elevating Software Agents with Strategic Learning', 'desc': 'The paper introduces Mastermind, a dual-loop framework designed to enhance the ability of software engineering agents to reproduce vulnerabilities. It emphasizes the importance of learning strategies separately from task-specific experiences, allowing agents to optimize their approach to vulnerability reproduction. By using a trainable planner for strategy learning and an experience loop for task-specific records, Mastermind enables agents to improve their performance without altering their action generation. The framework shows significant improvements in pass rates for vulnerability reproduction tasks, demonstrating the effectiveness of high-level strategy learning in software engineering.'}}}, {'id': 'https://huggingface.co/papers/2607.05390', 'title': 'Deform360: A Massive Multi-view Visuotactile Dataset for Deformable World Models', 'url': 'https://huggingface.co/papers/2607.05390', 'abstract': 'Abstract A large-scale visuotactile dataset called Deform360 is introduced to study deformable object dynamics, enabling comparison between 2D video and 3D particle world models for robotic manipulation tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Predicting object dynamics (i.e., world modeling) is a fundamental challenge for robotic manipulation, and modeling deformable objects presents a particularly difficult case due to their high-dimensional state spaces and complex material properties. While current world models approach this through two distinct paradigms: learning the dynamics over the 2D pixel space or more explicit 3D geometric space. A systematic understanding of their relative strengths and limitations remains elusive due to the lack of diverse, large-scale real-world data. To address this, we present Deform360, a large-scale visuotactile dataset featuring 198 daily-life objects, 1,980 interaction sequences, and over 215 hours of observations from 41 surround-view cameras and bimanual tactile grippers to capture both global motion and contact-induced local deformations. Leveraging a novel markerless visuotactile 3D tracking pipeline to extract dense geometry and motion, we systematically evaluate current state-of-the-art world models, comparing 2D video models against 3D particle models. Finally, we provide a preliminary demonstration indicating the real-world applicability of our dataset by performing robot planning tasks on deformable objects. Our analysis reveals key insights into the trade-offs between structural priors and scalability, providing a solid benchmark for future research in generalizable deformable object-centric world modeling. Project website: https://deform360.lhy.xyz', 'score': 1, 'issue_id': 2776, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'ea2f0b8a60fbfad3', 'github_url': '', 'github_stars': 0, 'authors': ['Hongyu Li', 'Wanjia Fu', 'Xiaoyan Cong', 'Zekun Li', 'Binghao Huang', 'Hanxiao Jiang', 'Xintong He', 'Yiqing Liang', 'Rao Fu', 'Tao Lu', 'Srinath Sridhar', 'Kevin A. Smith', 'George Konidaris', 'Yunzhu Li'], 'affiliations': ['Brown University, Providence, RI', 'Columbia University, New York, NY', 'Massachusetts Institute of Technology, Cambridge, MA'], 'pdf_title_img': 'assets/pdf/title_img/2607.05390.jpg', 'data': {'categories': ['#3d', '#benchmark', '#robotics', '#science', '#games', '#dataset'], 'emoji': '🤖', 'ru': {'title': 'Исследуем динамику деформируемых объектов!', 'desc': 'В статье представлено крупномасштабное датасет Deform360, предназначенное для изучения динамики деформируемых объектов. Этот датасет включает в себя 198 объектов повседневного обихода и более 200 часов наблюдений с использованием камер и тактильных захватов. Авторы сравнивают подходы моделирования динамики объектов в 2D и 3D пространствах и анализируют их сильные и слабые стороны. Результаты показывают важность этого датасета для будущих исследований в области моделирования деформируемых объектов и роботов.'}, 'en': {'title': 'Unlocking Deformable Object Dynamics with Deform360', 'desc': 'The paper introduces Deform360, a large-scale visuotactile dataset designed to enhance the understanding of deformable object dynamics for robotic manipulation. It compares two approaches to world modeling: 2D video-based models and 3D particle-based models, highlighting the challenges posed by the complex nature of deformable objects. The dataset includes extensive observations of various daily-life objects, captured through advanced tracking techniques to analyze both global and local deformations. This work aims to provide a benchmark for future research, revealing insights into the trade-offs between different modeling strategies.'}}}, {'id': 'https://huggingface.co/papers/2607.02881', 'title': 'PraMem: Practice-derived Experiential Memory for Long-horizon Behavior Prediction', 'url': 'https://huggingface.co/papers/2607.02881', 'abstract': "Abstract Long-horizon behavior prediction is enhanced through PraMem, which transforms lengthy historical sequences into experiential memory for improved accuracy.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Long-horizon behavior prediction aims to infer a user's next action based on a lengthy historical sequence, playing a crucial role in artificial intelligence field. The rise of large language models (LLMs) offers a promising direction for sequential behavior prediction, yet LLMs struggle with latent behavioral pattern induction and model-intrinsic cognitive biases when tackling long-horizon behavior prediction. Prior memory management methods follow a context-compression paradigm that attempts to address this task by alleviating the historical sequence burden, yet fail to resolve the core challenges. In this paper, we advocate a paradigm shift that reframes the len
