tps://huggingface.co/papers/2607.17986', 'title': 'Self-State Attacks on Self-Hosted AI Agents: How Far Can OS Defenses Go?', 'url': 'https://huggingface.co/papers/2607.17986', 'abstract': 'Abstract  Self-hosted AI agents read and write their own memory and configuration files to function. An agent may get compromised via corruption of its own state -- a compromise realized via legitimate OS system call invocation. We refer to this class of threats as self-state attacks. In this paper, we investigate the OS resilience to this class of attacks. Formally, we characterize a four-axis attack space (Target, Mechanism, Granularity, Temporal); investigate the structural limits of prevention, detection, and recovery; and introduce a workload-conditioned view of detectability. To instantiate the framework, we collect live activity traces from a representative self-hosted agent running across distinct workload profiles, and realize the attack space as a 23-cell matrix, 43 concrete operations on real self-state files, and injected into those traces. We then evaluate both canonical and workload-conditioned defense strategies. The empirical results show that a layered defense stack (access-control prevention on the instruction and configuration layers, workload-conditioned detection on the memory layer, and periodic backup for recovery) is effective on most attack cells while a small residual attack surface remains structurally indistinguishable at the OS level. These findings suggest that against the newly established class of self-state attacks, OS-level defense needs to be reconsidered, potentially opening new research directions in the field.', 'score': 3, 'issue_id': 2869, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'dbd62ad7817286c4', 'github_url': '', 'github_stars': 0, 'authors': ['Yimeng Chen', 'Nathanaël Denis', 'Roberto Di Pietro', 'Jürgen Schmidhuber'], 'affiliations': ['Center of Excellence for Generative AI King Abdullah University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.17986.jpg', 'data': {'categories': ['#security', '#agents', '#memory', '#agent_memory'], 'emoji': '🔒', 'ru': {'title': 'Новые угрозы для самохостящихся AI-агентов', 'desc': 'В данной статье исследуются уязвимости самохостящихся AI-агентов, которые могут быть компрометированы через коррупцию своего состояния. Авторы вводят класс угроз, называемый атаками на собственное состояние, и формально описывают пространство атак по четырем осям. Они анализируют пределы предотврашения, обнаружения и восстановления, а также оценивают стратегии защиты. Результаты показывают, что многоуровневая система защиты эффективна против большинства атак, однако остается небольшая область уязвимости, требующая дальнейшего изучения.'}, 'en': {'title': 'Reinforcing OS Resilience Against Self-State Attacks', 'desc': "This paper explores the vulnerabilities of self-hosted AI agents to a new type of threat called self-state attacks, where an agent's own state can be compromised through legitimate system calls. The authors define a framework to analyze these attacks across four dimensions: Target, Mechanism, Granularity, and Temporal. They collect data from real agents to create a detailed attack matrix and evaluate various defense strategies. The results indicate that a multi-layered defense approach is effective, but some vulnerabilities remain that require further research in operating system resilience."}}}, {'id': 'https://huggingface.co/papers/2607.16074', 'title': 'JoyNexus: Service-Oriented Multi-Tenant Post-Training for VLA Models', 'url': 'https://huggingface.co/papers/2607.16074', 'abstract': 'Abstract  The post-training of Vision-Language-Action (VLA) models is essential due to the diversity of simulators, robot embodiments, and task objectives. Existing compute services, whether offered as direct accelerator rental or batch-workload submission, typically allocate an exclusive set of GPU and CPU resources to a single tenant. While this paradigm maximizes client flexibility, it burdens users with infrastructure adaptation, and the fixed card-hour accounting model renders short or bursty workloads both expensive for tenants and inefficient for the service provider. To address these challenges, we present JoyNexus, a unified service for multi-tenant VLA supervised fine-tuning, reinforcement learning, and evaluation. JoyNexus decouples the Training Model Service, Inference Model Service, and Environment Service, each accessed through APIs and backed by resident shared base models with tenant-specific slots. Tenants can directly invoke high-level semantic APIs for training, rollout, and evaluation, or compose custom algorithms using lower-level APIs and their assigned endpoints. Multiple tenants submit workloads concurrently; their action modules, optimizers, rollout records, and policy versions remain isolated, and the service is scheduled by the global Training Queue and Inference Queue. To further improve multi-tenant training efficiency, JoyNexus introduces group batching for heterogeneous VLA data schemas that share a compatible model-facing prefix, enabling a single shared backbone forward pass over grouped samples. Finally, we evaluate JoyNexus through workload simulation and a group-batching pipeline in a realistic embodied scenario. Results show that, compared with isolated single-tenant execution, JoyNexus reduces aggregate GPU time and improves service utilization via cross-tenant scheduling on shared resources.', 'score': 3, 'issue_id': 2867, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '3efd39e7bc3d3f91', 'github_url': '', 'github_stars': 0, 'authors': ['Haoran Sun', 'Wentao Zhang', 'Junyang Hua', 'Hedan Yang', 'Yongjian Guo', 'Yifei Zhang', 'Xiaolong Xiang', 'Mingxi Luo', 'Jing Long', 'Chen Zhao', 'Chen Zhou', 'Wanting Xu', 'Qiming Yang', 'Hui Zhang', 'Song Wang', 'Xiaodong Bai', 'Shuai Di', 'Xu Chu', 'Xiaotie Deng', 'Yicheng Gong', 'Junwu Xiong'], 'affiliations': ['Beihang University', 'Beijing Institute of Technology', 'JDT AI Infra', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.16074.jpg', 'data': {'categories': ['#agents', '#rl', '#training', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Эффективное совместное обучение для моделей VLA', 'desc': 'Статья описывает JoyNexus, унифицированный сервис для совместной настройки моделей Vision-Language-Action (VLA). Он позволяет нескольким арендаторам параллельно использовать ресурсы, упрощая адаптацию инфраструктуры. JoyNexus отделяет сервисы обучения, вывода и среды, предоставляя доступ через API. Это приводит к более эффективной работе и снижает затраты на ресурсы для арендаторов.'}, 'en': {'title': 'Efficient Multi-Tenant Training with JoyNexus', 'desc': 'This paper introduces JoyNexus, a service designed to enhance the post-training process of Vision-Language-Action (VLA) models by allowing multiple tenants to share resources efficiently. It separates the training, inference, and environment services, enabling users to access them through APIs while maintaining isolation of their workloads. JoyNexus employs group batching to optimize training efficiency for diverse data schemas, allowing for better resource utilization. The evaluation shows that JoyNexus significantly reduces GPU time and improves overall service efficiency compared to traditional single-tenant setups.'}}}, {'id': 'https://huggingface.co/papers/2607.18084', 'title': 'WorldCupArena: Fine-Grained Evaluation of Language Models and Deep-Research Agents on Football Forecasting', 'url': 'https://huggingface.co/papers/2607.18084', 'abstract': 'Abstract  Predicting a football match before kickoff requires more than knowing past results: a model must use changing information and make a clear prediction before the answer is available. We present WorldCupArena, a dynamic benchmark for language models and deep-research agents. The 2026 FIFA World Cup is its first evaluation, and the same process can be reused for future leagues and cups. Before each match, a model either receives a common evidence package or searches for information itself. It predicts the result and score, likely players and events, match statistics, and the outcome of the competition. After the match, these predictions are compared with the recorded result. We report result accuracy, exact-score accuracy, and a scoreline score that gives some credit when a predicted score is close but not exact, together with scores for the other prediction tasks. Across 104 matches and 13 systems, models with similar result accuracy differ more clearly on detailed predictions. Compared with betting-market and human-fan baselines, the best system shows only small gains in result and exact-score accuracy, but a clearer gain in Scoreline. New schedules can be added as they begin, allowing the benchmark to evaluate future models without using outcomes that are already known. Code, prompts, predictions, and evaluation scripts are open sourced at https://github.com/wzk1015/WorldCupArena.', 'score': 2, 'issue_id': 2869, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '27a68ae5db247970', 'github_url': '', 'github_stars': 0, 'authors': ['Zhaokai Wang', 'Tianlin Gui', 'Jiayuan Rao', 'Shangzhe Di', 'Yihong Tang', 'Dingli Liang'], 'affiliations': ['McGill University, Montreal, Canada', 'Nanjing University, Shanghai, China', 'Shanghai Jiao Tong University, Shanghai, China', 'University College London, London, UK'], 'pdf_title_img': 'assets/pdf/title_img/2607.18084.jpg', 'data': {'categories': ['#games', '#benchmark', '#dataset', '#open_source'], 'emoji': '⚽', 'ru': {'title': 'Новая эра предсказаний футбольных матчей', 'desc': 'Статья описывает WorldCupArena, динамическую платформу для оценки языковых моделей и глубоких аналитических агентов в предсказании результатов футбольных матчей. Модель использует изменяющуюся информацию для предсказания результата, статистики матча и вероятных событий до начала игры. В рамках эксперимента сравниваются предсказания моделей с реальными результатами матчей, что позволяет оценить их точность. WorldCupArena также предоставляет возможность добавления новых турниров и лиг, что делает его актуальным инструментом для будущих исследований.'}, 'en': {'title': 'Dynamic Predictions for Football Matches', 'desc': 'This paper introduces WorldCupArena, a dynamic benchmark designed for evaluating language models and deep learning agents in predicting football match outcomes. It emphasizes the importance of using real-time information to make predictions before the match starts. The benchmark was first tested during the 2026 FIFA World Cup and can be adapted for future sporting events. The results show that while some models have similar overall accuracy, they differ significantly in their detailed predictions, particularly in scoreline accuracy.'}}}, {'id': 'https://huggingface.co/papers/2607.17524', 'title': 'Token-Level Off-Policy Learning for Faithful Generation Under Distribution Shift', 'url': 'https://huggingface.co/papers/2607.17524', 'abstract': 'Abstract  We propose Token-Level Off-Policy Labeling (TOPL), an off-policy training paradigm that reframes post-training as a token-level correctness prediction task. Our key intuition is that by training the model to distinguish good and bad tokens in a response, we naturally guide the model towards generating good tokens, while avoiding the pitfalls that come with directly training the model to generate off-policy tokens. Experiments on document summarization tasks show that TOPL achieves strong out-of-distribution generalization across 11 datasets against a diverse set of sequence-level and token-level baselines. We further demonstrate that TOPL transfers effectively to machine translation, suggesting that its benefits generalize across different faithful generation tasks. Through ablation studies, we confirm that our token-level learning signal is critical to good performance; sequence-level analogues do not confer similar benefits. Finally, we show that TOPL induces interpretable model updates: the LoRA adapters learned through TOPL function as linear classification heads and steering vectors.', 'score': 2, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '775b5f0e4e6dc92e', 'github_url': '', 'github_stars': 0, 'authors': ['Zitong Huang', 'Gustavo Lucas Carvalho', 'Deqing Fu', 'Robin Jia'], 'affiliations': ['University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2607.17524.jpg', 'data': {'categories': ['#transfer_learning', '#machine_translation', '#rlhf', '#training', '#interpretability'], 'emoji': '📄', 'ru': {'title': 'Умное обучение на уровне токенов для лучших результатов', 'desc': 'В статье предлагается новый подход к обучению моделей машинного обучения под названием Token-Level Off-Policy Labeling (TOPL). Этот метод пересматривает процесс постобучения как задачу предсказания правильности токенов, что помогает модели лучше различать хорошие и плохие токены. Эксперименты показывают, что TOPL демонстрирует отличную обобщаемость на различных задачах, таких как резюмирование документов и машинный перевод. Также исследование подтверждает, что использование обучающих сигналов на уровне токенов критически важно для достижения высоких результатов.'}, 'en': {'title': 'Enhancing Token Quality with TOPL', 'desc': 'The paper introduces Token-Level Off-Policy Labeling (TOPL), a new training method that focuses on predicting the correctness of individual tokens in generated responses. This approach helps the model learn to produce better tokens by distinguishing between good and bad ones, rather than directly generating off-policy tokens. Experiments show that TOPL significantly improves performance in document summarization and transfers well to machine translation tasks. The study also highlights the importance of token-level learning signals for effective model updates, as opposed to sequence-level methods.'}}}, {'id': 'https://huggingface.co/papers/2607.18171', 'title': 'FlashRT: Agent Harness for Guiding Agents to Deploy Real-Time Multimodal Applications', 'url': 'https://huggingface.co/papers/2607.18171', 'abstract': 'Abstract  Real-time multimodal applications, including voice agents and interactive video generation, compose heterogeneous models into pipelines whose efficient deployment requires application-specific decisions about placement, streaming, and intra-model parallelism. Existing serving systems and auto-parallelism compilers commit to limited transformations and fixed workload assumptions, so achieving high performance on a new application requires hand-crafting an efficient implementation. We present FlashRT, an agent harness that guides coding agents to lift simple developer-written reference implementations into optimized multi-GPU deployments that flexibly weigh target metrics like latency and throughput. Using a new chain-of-program paradigm, FlashRT directs a generic coding agent through a multi-pass transformation process where an agent transforms the reference into an intermediate representation (IR) to capture data dependencies and persistent-state scopes, validates this IR via a sequential interpreter, and performs static analyses to identify candidate transformations. Then, the agent iteratively implements, verifies, and benchmarks each candidate under a measurement-gated optimization loop to produce effective deployments that span different hardware budgets. Across various applications, including video world models and multimodal LLMs, FlashRT converts reference implementations into highly efficient deployments, delivering up to ~70x latency reduction and 2.8x throughput improvement on NVIDIA B200 GPUs. On AMD MI355X GPUs, FlashRT matches the peak latency reduction while increasing peak throughput improvement to 3.6x, demonstrating that agent-driven optimization can be more scalable on platforms with less mature expert optimization. In fact, for Qwen3-Omni text-to-audio inference, FlashRT reduces response latency by 65% compared to the expert vLLM-Omni implementation on AMD MI355X.', 'score': 2, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'f2ae2a2a571b527d', 'github_url': '', 'github_stars': 0, 'authors': ['Krish Agarwal', 'Zhuoming Chen', 'Yanyuan Qin', 'Zhenyu Gu', 'Atri Rudra', 'Beidi Chen'], 'affiliations': ['AMD', 'Carnegie Mellon University', 'University at Buffalo'], 'pdf_title_img': 'assets/pdf/title_img/2607.18171.jpg', 'data': {'categories': ['#multimodal', '#optimization', '#agent_memory', '#training', '#inference', '#agents'], 'emoji': '🚀', 'ru': {'title': 'Оптимизация многомодальных приложений с помощью FlashRT', 'desc': 'Статья представляет FlashRT, инструмент для оптимизации многомодальных приложений, таких как голосовые агенты и интерактивная генерация видео. FlashRT помогает разработчикам преобразовывать простые исходные реализации в эффективные развертывания для нескольких графических процессоров (GPU), учитывая такие параметры, как задержка и пропускная способность. Система использует новую парадигму цепочки программирования, позволяя агентам проводить многократные преобразования и проверку промежуточных представлений данных. Благодаря этому FlashRT демонстрирует значительное улучшение производительности, включая уменьшение задержки до 70% и увеличение пропускной способности до 3.6x на различных устройствах.'}, 'en': {'title': 'Optimizing Multimodal Applications with FlashRT', 'desc': 'This paper introduces FlashRT, a system designed to optimize the deployment of multimodal applications by transforming simple reference implementations into efficient multi-GPU setups. It utilizes a chain-of-program paradigm where a coding agent iteratively refines the implementation through a multi-pass transformation process, focusing on metrics like latency and throughput. FlashRT captures data dependencies and validates intermediate representations to ensure effective optimization. The results show significant performance improvements, achieving up to 70x latency reduction and 3.6x throughput enhancement on various GPU platforms.'}}}, {'id': 'https://huggingface.co/papers/2607.17675', 'title': 'ShotPlan: Cinematic Video Generation with Learnable Planning Token', 'url': 'https://huggingface.co/papers/2607.17675', 'abstract': 'Abstract  Current video generation models achieve impressive results in single-shot generation, yet remain limited in cinematic video generation, where coherent narratives and effective multi-shot composition require explicit shot planning. To address this challenge, we propose ShotPlan, a framework for explicit multi-shot cinematic video generation built upon a video diffusion foundation model. Our method introduces learnable planning tokens that capture shot-level transition cues and can be seamlessly integrated with the original video generation tokens to control transition timestamps. Unlike standard video generation tokens, the proposed planning tokens are equipped with Fractional Temporal Rotary Position Embedding (FRoPE), enabling shot transitions to be modeled at the frame level. Experiments demonstrate that ShotPlan significantly outperforms existing cinematic video generation methods, offering more flexible shot management and stronger inter-shot consistency.', 'score': 2, 'issue_id': 2871, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '795ed3668c2ba983', 'github_url': '', 'github_stars': 0, 'authors': ['Su Guo', 'Guangce Liu', 'Haosen Yang', 'Jiepeng Wang', 'Cong Liu', 'Junqi Liu', 'Haibin Huang', 'Hongxun Yao', 'Chi Zhang', 'Xuelong Li'], 'affiliations': ['Harbin Institute of Technology', 'Institute of Artificial Intelligence (TeleAI), China Telecom'], 'pdf_title_img': 'assets/pdf/title_img/2607.17675.jpg', 'data': {'categories': ['#3d', '#games', '#diffusion'], 'emoji': '🎥', 'ru': {'title': 'Новая эра генерации киношных видео!', 'desc': 'В статье представлена новая модель ShotPlan для генерации киношных видео с помощью многосъемочных планов. Основная innovation заключается в использовании обучаемых токенов планирования, которые помогают управлять переходами между кадрами. Эти токены используют встроенное позиционное кодирование, позволяющее моделировать переходы на уровне кадров. Эксперименты показывают, что ShotPlan значительно превосходит существующие методы генерации видео, обеспечивая лучшую согласованность между сценами.'}, 'en': {'title': 'Revolutionizing Cinematic Video Generation with Shot Planning', 'desc': 'This paper presents ShotPlan, a new framework for generating cinematic videos that require careful planning of multiple shots. It builds on a video diffusion model and introduces learnable planning tokens to manage transitions between shots effectively. These tokens use a technique called Fractional Temporal Rotary Position Embedding (FRoPE) to enhance the modeling of transitions at the frame level. The results show that ShotPlan outperforms existing methods by providing better control over shot management and improving the consistency between shots.'}}}, {'id': 'https://huggingface.co/papers/2607.07050', 'title': 'Diagnosing and Calibrating Tool-Call Boundary Drift in Multi-Teacher On-Policy Distillation', 'url': 'https://huggingface.co/papers/2607.07050', 'abstract': 'Abstract  Agentic language models must learn when to call tools, when to consume tool responses, and when to answer directly. This makes multi-teacher on-policy distillation a natural training strategy: one teacher can specialize in tool calls, another in direct responses, and the student can learn from both on   its own generated distribution. We show that this strategy can induce a behavior shift that is invisible from aggregate losses alone. In a two-teacher tool-use setting, vanilla generalized knowledge distillation improves tool-call recall but also moves the model toward over-calling, where it calls tools   on examples that should be answered directly. Aggregate explanations are insufficient: tool-call samples do not receive more token exposure, and full-sequence per-token divergence is not larger for the tool-call teacher. We instead analyze behavior leverage imbalance: local token-level signals at mode-   entry and structural positions, such as <tool_call> and function names, can have disproportionate control over the global generation mode. We propose Soft Clamp, a per-token divergence calibration method that dynamically compresses extreme token-level Jensen-Shannon divergence while preserving nonzero   gradients. On APIGen-MT, Soft Clamp reduces over-calling from 13.7% to 9.0% relative to vanilla GKD while matching its decision accuracy. In a BFCL multi-turn diagnostic, it also lowers tool-call loops and repeated calls among GKD variants. These results suggest that multi-teacher OPD should monitor   where teacher signals act, not only how large they are in aggregate.', 'score': 2, 'issue_id': 2871, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '86865cb0f63a8059', 'github_url': '', 'github_stars': 0, 'authors': ['Jiabin Shen', 'Guang Chen', 'Chengjun Mao'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07050.jpg', 'data': {'categories': ['#agents', '#agent_memory', '#training', '#tool_use', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Умное использование инструментов в языковых моделях', 'desc': 'В этой статье рассматривается обучение агентов с использованием языковых моделей через многовчительскую дистилляцию. Один учитель обучает модель делать вызовы к инструментам, а другой - давать прямые ответы. Этот подход позволяет улучшить запоминание вызовов инструментов, но может привести к избыточным вызовам, когда модель использует инструменты там, где можно дать прямой ответ. Мы предлагаем метод Soft Clamp, который помогает избежать избыточных вызовов, сохраняя при этом точность решений модели.'}, 'en': {'title': 'Optimizing Tool Use in Language Models with Multi-Teacher Learning', 'desc': "This paper discusses how agentic language models can effectively learn to use tools by employing a multi-teacher on-policy distillation approach. One teacher focuses on making tool calls while another specializes in providing direct answers, allowing the student model to learn from both. The study reveals that simply looking at overall performance metrics can be misleading, as it may not reflect the model's tendency to over-call tools. To address this, the authors introduce Soft Clamp, a method that fine-tunes the model's responses to reduce unnecessary tool calls while maintaining accuracy."}}}, {'id': 'https://huggingface.co/papers/2607.09655', 'title': 'OpenLongTail: Generative Scaling of Long-Tail Driving Data', 'url': 'https://huggingface.co/papers/2607.09655', 'abstract': 'Abstract  Scaling robust driving policies is fundamentally bottlenecked by the scarcity of edge cases in curated datasets. While the real world continuously captures these critical events, such long-tail events remain underutilized when collected from heterogeneous sources. Specifically, diverse but valuable in-the-wild long-tail videos lack the full view coverage required for training policy models, often missing multi-view poses or originating solely from monocular dash cameras. This modality gap prevents these ubiquitous observations from being converted into scalable training data for long-tail generalization. We introduce OpenLongTail, an open-source generative data engine for scaling autonomous driving policies under long-tail events. To transform heterogeneous data sources into view-aligned and temporally coherent multi-view assets that are useful for policy learning, we develop a pose-informed extrapolative view synthesis pipeline that generates the missing views. We further enhance cross-view consistency and the temporal alignment for the newly generated views by injecting Plücker ray geometry into the scalable generation engine. By synthesizing heterogeneous long-tail data, we observe a significant improvement in closed-loop driving robustness in handling long-tail events. By measuring the extrapolative view synthesis and pose metrics, we validate the effectiveness of OpenLongTail in visual fidelity, cross-view consistency, and ego-trajectory recovery.', 'score': 2, 'issue_id': 2868, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': '2567361884a5ada1', 'github_url': '', 'github_stars': 0, 'authors': ['Lulin Liu', 'Nuo Chen', 'Yan Wang', 'Bangya Liu', 'Wenyan Cong', 'Hezhen Hu', 'Boris Ivanovic', 'Hao Wang', 'Ziyao Zeng', 'Xinyu Gong', 'Yang Zhou', 'Zixiang Xiong', 'Dilin Wang', 'Zhangyang Wang', 'Weisong Shi', 'Ruohan Zhang', 'Marco Pavone', 'Zhiwen Fan'], 'affiliations': ['Adobe', 'Meta', 'NVIDIA', 'Stanford University', 'Texas A&M University', 'UT Austin', 'UWMadison', 'University of Delaware', 'Yale University'], 'pdf_title_img': 'assets/pdf/title_img/2607.09655.jpg', 'data': {'categories': ['#optimization', '#open_source', '#synthetic', '#dataset', '#agents'], 'emoji': '🚗', 'ru': {'title': 'Повышение надежности автономного вождения с помощью OpenLongTail', 'desc': 'Статья обсуждает проблему нехватки крайних случаев в отборных наборах данных для обучения автономного вождения. Авторы представляют OpenLongTail, открытый генеративный движок, который преобразует разнородные источники данных в многоракурсные и временно согласованные активы. Это решает проблему недостатка видов, позволяя улучшить обучение моделей управления при редких событиях. Благодаря синтезу данных, статья демонстрирует существенное улучшение надежности автономного вождения в сложных ситуациях.'}, 'en': {'title': 'Enhancing Autonomous Driving with OpenLongTail Data Synthesis', 'desc': 'This paper addresses the challenge of training robust driving policies using limited edge case data from curated datasets. It introduces OpenLongTail, a generative data engine that synthesizes multi-view assets from diverse, real-world long-tail video sources. By employing a pose-informed extrapolative view synthesis pipeline, the system generates missing views to enhance training data quality. The results show improved driving robustness in handling long-tail events, validated through metrics on visual fidelity and cross-view consistency.'}}}, {'id': 'https://huggingface.co/papers/2607.17790', 'title': 'ReViV: Reconstructing the Viewer and the View in 4D from Monocular Egocentric Video', 'url': 'https://huggingface.co/papers/2607.17790', 'abstract': 'Abstract  Egocentric devices, such as wearable front-facing cameras, provide a unique perspective for capturing the continuous interaction between a human viewer and the surrounding environment. A holistic and efficient multimodal model capable of reconstructing this 4D representation is therefore highly desirable. However, existing approaches often rely on auxiliary inputs such as pre-computed camera trajectories, treat scene perception and human ego-motion modeling as separate problems despite their strong interdependency, and suffer from slow inference time. To address these limitations, we present ReViV, the first unified framework for holistic egocentric 4D reconstruction that extracts both viewer and view dynamics from a single monocular RGB video. We formulate the task as learning the full joint probability distribution over multimodal signals, including RGB video, camera trajectory, gaze direction, full-body motion, hand motion, and depth. Powered by a Masked Generative Egocentric Transformer, ReViV operates within a single feed-forward architecture to simultaneously reconstruct the temporally consistent 4D reconstruction across the viewer and the view with fast inference speed. Extensive experiments on diverse benchmarks, including HoloAssist, HOT3D, ARCTIC, Aria Digital Twin, and TACO, demonstrate that ReViV achieves state-of-the-art accuracy and efficiency across holistic ego-body, hand, and gaze reconstruction, camera tracking, while maintaining highly competitive egocentric depth estimation without relying on heavy task-specific priors. Code and models are fully open-sourced: https://reviv4d.github.io/.', 'score': 1, 'issue_id': 2871, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'fd3ea125fd705873', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaozhong Lyu', 'Gen Li', 'Zhiyin Qian', 'Xucong Zhang', 'Marc Pollefeys', 'Siyu Tang'], 'affiliations': ['Delft University of Technology, Netherlands', 'ETH Zurich, Switzerland', 'Microsoft, Switzerland'], 'pdf_title_img': 'assets/pdf/title_img/2607.17790.jpg', 'data': {'categories': ['#architecture', '#open_source', '#multimodal', '#benchmark'], 'emoji': '👁️', 'ru': {'title': 'Новая эра егоцентрической 4D-реконструкции', 'desc': 'В статье представлен новый подход к 4D-реконструкции с использованием егоцентрических устройств, таких как носимые камеры. Модель ReViV объединяет в себе анализ видео, траектории камеры и движение наблюдателя, что позволяет эффективно взаимодействовать с окружающей средой. Благодаря архитектуре Masked Generative Egocentric Transformer, она обеспечивает быструю обработку и высокую точность результатов. Эксперименты показывают, что ReViV достигает передового уровня точности в сравнении с существующими методами.'}, 'en': {'title': 'ReViV: Unified 4D Reconstruction from Egocentric Video', 'desc': 'This paper introduces ReViV, a novel framework for egocentric 4D reconstruction using a single monocular RGB video. It effectively combines the tasks of scene perception and human motion modeling into a unified model, addressing the limitations of previous methods that treated these as separate problems. ReViV leverages a Masked Generative Egocentric Transformer to achieve fast inference while maintaining high accuracy in reconstructing viewer dynamics and environmental interactions. Extensive experiments show that ReViV outperforms existing approaches in accuracy and efficiency across various benchmarks.'}}}, {'id': 'https://huggingface.co/papers/2607.17972', 'title': 'DiFA: Inference-Time Forward-Process Alignment for Diffusion Models', 'url': 'https://huggingface.co/papers/2607.17972', 'abstract': 'Abstract  The prevailing inference framework for diffusion models formulates generation fundamentally as a problem of numerical integration. This perspective casts the model as an exact estimator, neglecting the inherent statistical uncertainty of the denoising process. In this work, we propose Forward-Process Aligned Diffusion prediction (DiFA), a training-free framework that reframes inference-time data prediction refinement as a sequential state estimation problem. Rather than reusing past outputs solely for numerical integration, DiFA treats iterative data predictions along the reverse trajectory as correlated observations to build a forward-aligned temporal consensus. Inspired by Kalman filtering, this consensus aggregates historical predictions according to structural consistency and noise-level compatibility. To counteract the over-smoothing tendency of temporal consensus, we introduce a deviation guidance mechanism to adaptively preserve residual details. Empirically, DiFA yields significant improvements on CIFAR-10 and ImageNet across the evaluated metrics, including FID, IS, and FD-DINOv2, demonstrating that aligning inference with the forward statistical structure substantially improves generative fidelity.', 'score': 1, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '7e537168897bc68f', 'github_url': '', 'github_stars': 0, 'authors': ['Shigui Li', 'Delu Zeng'], 'affiliations': ['School of Electronic and Information Engineering, South China University of Technology, Guangzhou, China', 'School of Mathematics, South China University of Technology, Guangzhou, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.17972.jpg', 'data': {'categories': ['#optimization', '#inference', '#diffusion'], 'emoji': '✨', 'ru': {'title': 'Улучшение качества генерации с DiFA', 'desc': 'В данной статье представлено новое решение для улучшения качества генерации данных с помощью диффузионных моделей, называемое DiFA. Этот подход рассматривает предсказание данных на этапе вывода как проблему последовательной оценки состояния, что позволяет учитывать статистическую неопределенность. Вместо простого численного интегрирования, DiFA использует предыдущие предсказания для создания временного консенсуса, что улучшает точность генерации. Исследования показывают, что этот метод значительно превосходит существующие техники на наборах данных CIFAR-10 и ImageNet.'}, 'en': {'title': 'Enhancing Diffusion Models with Forward-Process Alignment', 'desc': 'This paper introduces a new approach called Forward-Process Aligned Diffusion prediction (DiFA) for improving the generation of data using diffusion models. Instead of treating the generation process as a simple numerical integration, DiFA views it as a sequential state estimation problem, which allows for better handling of statistical uncertainty. By leveraging past predictions as correlated observations, DiFA creates a consensus that enhances the quality of generated outputs. The method also includes a deviation guidance mechanism to maintain important details, leading to significant improvements in generative performance on datasets like CIFAR-10 and ImageNet.'}}}, {'id': 'https://huggingface.co/papers/2607.16609', 'title': 'Can Multimodal Large Language Models Understand OCT?', 'url': 'https://huggingface.co/papers/2607.16609', 'abstract': 'Abstract  Optical coherence tomography (OCT) imaging is oint SDU-NTU Centre for Artificial Intelligence Research', 'Shandong Provincial Qianfoshan Hospital', 'Shandong University', 'State Key Laboratory for Novel Software Technology', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.16609.jpg', 'data': {'categories': ['#benchmark', '#survey', '#multimodal', '#science', '#reasoning', '#healthcare'], 'emoji': '🩺', 'ru': {'title': 'Новый бенчмарк для глубокого понимания OCT', 'desc': 'Статья описывает OCT-Bench, новый комплексный бенчмарк для понимания изображений оптической когерентной томографии (OCT). Он включает 10,076 качественных вопросов на выбор, основанных на 4,137 изображениях OCT из семи публичных наборов данных. Бенчмарк охватывает три уровня оценки: восприятие, когниция и рассуждение, включая задачи по характеристикам изображений, анатомии сетчатки и оценке заболеваний. Результаты показывают, что текущие модели многомодальных языковых моделей (MLLMs) недостаточно развиты для надежного понимания OCT.'}, 'en': {'title': 'Advancing OCT Understanding with OCT-Bench', 'desc': 'This paper introduces OCT-Bench, a new benchmark for evaluating the understanding of optical coherence tomography (OCT) images in medical contexts. It addresses the limitations of existing models by providing a comprehensive set of 10,076 multiple-choice questions based on 4,137 OCT images. The benchmark includes a hierarchical taxonomy of 20 tasks that assess perception, cognition, and reasoning related to retinal diseases. The evaluation of 20 different multimodal large language models (MLLMs) reveals that current models struggle with reliable OCT understanding, highlighting the need for further advancements in this area.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (6)', '#agent_memory (6)', '#agents (12)', '#agi (4)', '#alignment (1)', '#architecture (3)', '#audio (1)', '#benchmark (11)', '#compression', '#context_window', '#continual_learning (1)', '#data (4)', '#dataset (10)', '#diffusion (5)', '#ethics', '#games (3)', '#graphs', '#hallucinations', '#healthcare (1)', '#inference (3)', '#interpretability (1)', '#knowledge_graphs', '#leakage', '#long_context (4)', '#low_resource (1)', '#machine_translation (1)', '#math (1)', '#memorization', '#memory (2)', '#multilingual (1)', '#multimodal (8)', '#open_source (7)', '#optimization (14)', '#plp', '#prompt_caching', '#prompting (1)', '#rag', '#reasoning (6)', '#retrieval', '#retrieval_eval (1)', '#rl (6)', '#rlhf (4)', '#robotics (1)', '#science (1)', '#security (1)', '#session_memory (1)', '#small_models', '#story_generation (1)', '#survey (2)', '#synthetic (3)', '#tool_use (2)', '#training (18)', '#transfer_learning (5)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-21 13:46',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-21 13:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-21 13:46')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
