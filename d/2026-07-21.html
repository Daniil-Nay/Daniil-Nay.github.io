    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');

                    updateTimeDiffs();
                    updateLocalization();
                    filterAndRenderArticles();
                });

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.17423', 'title': 'TimeLens2: Generalist Video Temporal Grounding with Multimodal LLMs', 'url': 'https://huggingface.co/papers/2607.17423', 'abstract': 'Abstract  Video multimodal large language models (MLLMs) can describe what happens in a video, but rarely identify when the supporting evidence occurs. We study generalist video temporal grounding, in which one model predicts a variable-cardinality set of evidence intervals across video lengths, domains, query forms, and viewpoints. Existing training strategies are misaligned with this set-valued task: long-video labels often rely on brittle one-pass annotation, while reinforcement-learning rewards either fail to distinguish non-overlapping predictions or require fragile segment matching. TimeLens2 treats temporal evidence as an interval set throughout supervision and optimization. TimeLens2-93K constructs reliable multi-span supervision through caption-derived proposals, independent localization, cross-agent consensus, semantic verification, and boundary refinement. Our temporal Wasserstein reward computes exact one-dimensional \\(W_1\\) between uniform distributions over merged interval supports, providing dense, matching-free feedback under unequal cardinalities and equivalent fragmentation; temporal IoU complements it with precise-overlap feedback. Across seven benchmarks, TimeLens2-2B outperforms all size-matched baselines on every benchmark, while the 4B and 8B variants achieve state-of-the-art performance, surpassing open-source models with up to 397B parameters. The 2B, 4B, and 8B variants improve over their Qwen3-VL backbones by 14.2, 13.0, and 18.1 mIoU points, respectively.', 'score': 90, 'issue_id': 2869, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': 'ec8817e42aea6856', 'github_url': '', 'github_stars': 0, 'authors': ['Yuhan Zhu', 'Changlian Ma', 'Xiangyu Zeng', 'Xinhao Li', 'Zhiqiu Zhang', 'Songze Li', 'Jun Zhang', 'Tianxiang Jiang', 'Yuandong Yang', 'Ziang Yan', 'Zikang Wang', 'Xinyu Chen', 'Haoran Chen', 'Shaowei Zhang', 'Limin Wang'], 'affiliations': ['Fudan University', 'Nanjing University', 'Shanghai AI Laboratory', 'Shanghai Jiao Tong University', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.17423.jpg', 'data': {'categories': ['#optimization', '#training', '#agents', '#benchmark', '#agi', '#multimodal', '#rl'], 'emoji': '⏳', 'ru': {'title': 'Точное определение временных интервалов в видео', 'desc': 'В данной статье исследуются мультимодальные большие языковые модели видео (MLLM), которые могут описывать события в видео, но редко определяют, когда происходят соответствующие доказательства. Авторы предлагают новый подход к временной основке, позволяя одной модели предсказывать набор временных интервалов доказательства на различных видео. Разработанная модель TimeLens2 использует улучшенные методы обучения для точной идентификации и классификации интервалов. Результаты экспериментов показывают, что TimeLens2 превосходит существующие методы, достигая лучшей производительности на нескольких задачах.'}, 'en': {'title': 'Revolutionizing Video Understanding with TimeLens2', 'desc': 'This paper introduces TimeLens2, a model designed for video temporal grounding, which identifies when specific events occur in videos. Unlike previous methods, TimeLens2 treats temporal evidence as a set of intervals, allowing for more accurate predictions across various video types and query forms. The model employs innovative training strategies, including a temporal Wasserstein reward for better feedback on interval predictions. TimeLens2 demonstrates superior performance on multiple benchmarks, outperforming existing models, even those with significantly larger parameters.'}}}, {'id': 'https://huggingface.co/papers/2607.17250', 'title': 'EvolvingWorld: An Open-Schema Framework for Co-Evolving Role-Play Agents and World Model in Interactive Literary World', 'url': 'https://huggingface.co/papers/2607.17250', 'abstract': 'Abstract  This paper introduces EvolvingWorld, a framework and benchmark for character and world co-evolution in interactive literary worlds. Existing systems either treat interactive literary simulation as static persona imitation or isolated scene generation, failing to capture how characters and worlds evolve together over time. To address this, EvolvingWorld models literary simulation as a long-horizon process where characters interact, scenes progress, and character and world states are persistently updated. Unlike prior systems relying on fixed schemas, EvolvingWorld adopts an open-schema framework to support simulation across diverse literary worlds. The framework consists of two coupled modules: a Character Agent for multi-character role-play and persistent profile evolution, and an LLM-based World Model for global and location/entity-level state maintenance and scene progression. Based on this architecture, we formulate 7 trainable tasks for scene initialization, interaction generation, and state update. We construct a dataset from 57 books, producing 138,596 supervised training samples and 222 snapshots for testing. Furthermore, we introduce a trajectory-level LLM-as-Judge evaluation protocol spanning 10 dimensions and 20 metrics. Experiments show that EvolvingWorld can improve long-horizon simulation by effectively maintaining persistent, coherent character and world development.', 'score': 64, 'issue_id': 2868, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': 'c48e2a0e2f0baf1a', 'github_url': '', 'github_stars': 0, 'authors': ['Qing Zong', 'Yue Guo', 'Mengxin Yang', 'Yiwen Guo', 'Yangqiu Song'], 'affiliations': ['Hong Kong University of Science and Technology', 'Huazhong University of Science and Technology', 'Independent Researcher', 'LIGHTSPEED'], 'pdf_title_img': 'assets/pdf/title_img/2607.17250.jpg', 'data': {'categories': ['#multimodal', '#benchmark', '#long_context', '#architecture', '#dataset', '#story_generation', '#training', '#agents'], 'emoji': '📖', 'ru': {'title': 'Эволюция персонажей и миров в интерактивной литературе', 'desc': 'Статья представляет EvolvingWorld, новую структуру и бенчмарк для совместной эволюции персонажей и миров в интерактивных литературных системах. В отличие от существующих систем, которые ограничены статичным имитированием персонажей или изолированным созданием сцен, EvolvingWorld рассматривает литературную симуляцию как длинный процесс, где персонажи взаимодействуют и развиваются. Эта структура включает два связанных модуля: Агент Персонажа для многоперсонажной игры и эволюции профиля, а также Модель Мира на основе LLM для поддержания состояния и прогрессии сцен. Результаты показывают, что EvolvingWorld значительно улучшает долгосрочную симуляцию, обеспечивая согласованное развитие как персонажей, так и миров.'}, 'en': {'title': 'Evolving Characters and Worlds Together', 'desc': 'This paper presents EvolvingWorld, a framework designed for the co-evolution of characters and worlds in interactive literary simulations. Unlike previous systems that treat characters and scenes as static or isolated, EvolvingWorld models the simulation as a dynamic process where both characters and worlds evolve together over time. It features two main components: a Character Agent for role-playing and character development, and an LLM-based World Model for maintaining the state of the world and progressing scenes. The framework includes seven trainable tasks and is evaluated using a comprehensive protocol, demonstrating improved long-term simulation capabilities.'}}}, {'id': 'https://huggingface.co/papers/2607.07820', 'title': 'DeepSearch-World: Self-Distillation for Deep Search Agents in a Verifiable Environment', 'url': 'https://huggingface.co/papers/2607.07820', 'abstract': 'Abstract  Training tool-use agents to improve from their own experience remains challenging, as supervised fine-tuning relies on fixed teacher-distilled trajectories, while sparse-reward reinforcement learning provides weak supervision for long-horizon interactions. We present DeepSearch-Evolve, a self-distillation framework for web agents built on DeepSearch-World, a deterministic and verifiable environment with reproducible search and page-reading tools. DeepSearch-World contains 420K multi-hop QA tasks constructed from entity-level random walks and supports key agentic cognitive behaviors useful for self-evolving, including progress verification, grounded reflection, and failure recovery. DeepSearch-Evolve iteratively performs trajectory generation, filtering, data mixing, and fine-tuning to train stronger agents. Without distillation from more capable models, DeepSearch-World-9B achieves competitive performance compared with open-source agents, reaching 31.2% on BrowseComp, 61.5% on GAIA, and 93.4% on HotpotQA, showing that verifiable environments enable scalable self-evolution for long-horizon web agents. We will release the environment, 420K training pool, validation set, model, and code to facilitate future research on self-improving deep search agents.', 'score': 63, 'issue_id': 2869, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '4bb9fa77853f6bb5', 'github_url': '', 'github_stars': 0, 'authors': ['Xinyu Geng', 'Xuanhua He', 'Sixiang Chen', 'Yanjing Xiao', 'Fan Zhang', 'Shijue Huang', 'Haitao Mi', 'Zhenwen Liang', 'Tianqing Fang', 'Yi R. Fung'], 'affiliations': ['HKUST', 'HKUST(GZ)', 'Tencent'], 'pdf_title_img': 'assets/pdf/title_img/2607.07820.jpg', 'data': {'categories': ['#training', '#agents', '#open_source', '#agent_memory', '#tool_use', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Самообучение агентов для веб-поиска', 'desc': 'Статья описывает DeepSearch-Evolve, новую методику обучения агентов для использования инструментов в веб-среде. Она основана на среде DeepSearch-World, которая предоставляет детерминированные и проверяемые условия для выполнения многоходовых задач. В рамках этого подхода агенты учатся через самодистилляцию, путем создания, фильтрации и смешивания траекторий. Результаты показывают, что без учителей более мощных моделей агенты могут достигать конкурентоспособных показателей в различных задачах.'}, 'en': {'title': 'Empowering Web Agents to Self-Evolve through DeepSearch', 'desc': 'This paper introduces DeepSearch-Evolve, a framework designed to help web agents learn from their own experiences without relying on fixed teacher models. It utilizes DeepSearch-World, a controlled environment that allows agents to perform multi-hop question answering and develop cognitive skills like progress verification and failure recovery. The framework iteratively generates and refines training data to enhance agent performance over time. Results show that agents trained in this environment can compete effectively with existing models, demonstrating the potential for self-evolution in long-horizon tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.18213', 'title': 'SWE-Pruner Pro: The Coder LLM Already Knows What to Prune', 'url': 'https://huggingface.co/papers/2607.18213', 'abstract': "Abstract  Pruning long context for coding agents has been a vital technology for efficient context management. While existing context pruning methods such as SWE-Pruner realize this by attaching a separate code classifier, we find the agent itself encodes internal representations indicating the relevance of code context when reading tool output. Based on this finding, we propose SWE-Pruner Pro, which prunes tool outputs directly inside the agent. Concretely, a small head turns the agent's own internal representations into a keep-or-prune label for each line, with a length-aware embedding keyed to each tool output's line count. Across two open-weight backbones and four multi-turn benchmarks, SWE-Pruner Pro saves up to 39% of prompt and completion tokens while preserving task quality, with bounded inference overhead. Notably, on MiMo-V2-Flash SWE-Pruner Pro additionally raises the SWE-Bench Verified resolve rate by +3.8% and the long-context Oolong accuracy by +2.2 points.", 'score': 62, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '3a67d07c8210eac9', 'github_url': '', 'github_stars': 0, 'authors': ['Yuhang Wang', 'Yuling Shi', 'Shaoqiu Zhang', 'Jialiang Liang', 'Shilin He', 'Siyu Ye', 'Yuting Chen', 'Kai Cai', 'Xiaodong Gu'], 'affiliations': ['Douyin Group', 'LLM4SE Lab, Shanghai Jiao Tong University'], 'pdf_title_img': 'assets/pdf/title_img/2607.18213.jpg', 'data': {'categories': ['#long_context', '#optimization', '#training', '#inference', '#agents', '#prompting'], 'emoji': '🪄', 'ru': {'title': 'Оптимизация контекста с помощью SWE-Pruner Pro', 'desc': 'Статья обсуждает метод сокращения контекста для агентов, работающих с кодом, с целью повышения эффективности управления контекстом. Авторы представляют SWE-Pruner Pro, который использует внутренние представления агента для определения значимости контекста. Этот подход позволяет напрямую обрабатывать выходные данные инструментов внутри агента, значительно уменьшая количество токенов при сохранении качества задач. В экспериментах данный метод показал уменьшение на 39% токенов, а также улучшение точности решений.'}, 'en': {'title': 'Efficient Context Management with SWE-Pruner Pro', 'desc': "This paper introduces SWE-Pruner Pro, a new method for efficiently managing context in coding agents by directly pruning tool outputs within the agent itself. Unlike previous methods that used a separate code classifier, SWE-Pruner Pro leverages the agent's internal representations to determine which lines of code to keep or prune. The approach utilizes a small head to generate keep-or-prune labels based on a length-aware embedding related to the tool output's line count. The results show significant reductions in prompt and completion tokens while maintaining task quality, with improvements in resolve rates and accuracy on specific benchmarks."}}}, {'id': 'https://huggingface.co/papers/2607.18217', 'title': 'HOMIE: Human-object Centric Video Personalization via Multimodal Intelligent Enchancement', 'url': 'https://huggingface.co/papers/2607.18217', 'abstract': 'Abstract  Human-object centric video personalization (HOCVP) is a core task within subject-driven video generation. However, existing methods suffer from two key limitations. First, most approaches focusing on inter-subject personalization still struggle to strike a balance between high subject fidelity and accurate interaction patterns between humans and diverse objects, especially when objects represent abstract concepts such as logos. Second, while intra-subject references (e.g., OCR maps, multi-view inputs) are expected to enhance subject fidelity, most existing works lack mechanisms to understand such latent correspondence. To address both challenges, we propose HOMIE, an HOCVP framework that tackles both inter- and intra-subject input settings in a unified manner. Compared to previous approaches, HOMIE proposes a better MLLM integration strategy to extract knowledge of reference-level relationships without compromising the controllability of text encoders or incurring costly re-alignment. Specifically, we introduce global multimodal guidance within self-attention to better align MLLM-derived semantic features with VAE tokens. Furthermore, we propose modality-reference embedding to differentiate tokens from MLLM features and VAE tokens and associate intra-subject reference image tokens. Extensive experiments validate that our method achieves state-of-the-art performance across various HOCVP tasks. Project Page: https://yiyangcai.github.io/homie-page.github.io/', 'score': 40, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'd405dcee42656b65', 'github_url': '', 'github_stars': 0, 'authors': ['Yiyang Cai', 'Nan Chen', 'Rongchang Xie', 'Junwen Pan', 'Chunyang Jiang', 'Cheng Chen', 'Wen Zhou', 'Zhenbang Sun', 'Wei Xue', 'Wenhan Luo', 'Yike Guo'], 'affiliations': ['Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.18217.jpg', 'data': {'categories': ['#multimodal', '#3d'], 'emoji': '🎥', 'ru': {'title': 'Персонализация видео с HOMIE: новое слово в HOCVP', 'desc': 'Статья представляет новую рамочную концепцию HOMIE для персонализации видео, ориентированную на человека и объекты. Основное внимание уделяется улучшению точности взаимодействия между людьми и разнообразными объектами, включая абстрактные концепции, такие как логотипы. HOMIE объединяет подходы к меж- и внутричеловеческой персонализации, используя эффективные стратегии интеграции MLLM для извлечения знаний. Эксперименты показывают, что HOMIE показывает лучшие результаты по сравнению с предыдущими методами в различных задачах HOCVP.'}, 'en': {'title': 'HOMIE: Unifying Human-Object Video Personalization', 'desc': 'The paper introduces HOMIE, a framework for human-object centric video personalization (HOCVP) that addresses challenges in both inter-subject and intra-subject personalization. It improves the balance between subject fidelity and accurate interactions with diverse objects, including abstract concepts like logos. HOMIE employs a novel integration strategy for multimodal large language models (MLLM) to enhance the understanding of reference-level relationships without losing control over text encoders. The framework also utilizes global multimodal guidance and modality-reference embedding to effectively align semantic features with video tokens, achieving state-of-the-art results in HOCVP tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.16401', 'title': 'Apple-π: Benchmarking Thinking with Video Towards Law-Grounded Physical Intelligence', 'url': 'https://huggingface.co/papers/2607.16401', 'abstract': "Abstract  Modern video generation models are increasingly hailed as emerging world models with an internalized grasp of physical law. Yet existing benchmarks largely evaluate physical plausibility only at the output level, without verifying whether the model arrives there through a faithful, law-grounded reasoning process. We introduce Apple-PI, the first benchmark that anchors video-model evaluation explicitly in physical laws. Apple-PI comprises three components. 1) Orchard: a dataset of 400 videos covering ten canonical tasks in classical mechanics. It separates single-law tasks for confounder-free diagnosis from multi-law tasks for probing generalization. 2) Benchmark Protocol: a three-stage protocol based on scientific reasoning, including Perception, Formulation, and Deduction. It uses chain-of-frames prompting on infographic-annotated first frames, treating the generated video as the model's visible reasoning trace. 3) Evaluation Suite: a hybrid evaluation suite that combines MLLM-based subjective scoring with physics-law-grounded objective measures. This enables stage-resolved diagnosis of not only whether a model fails, but where it fails. Benchmarking 11 models shows that current video models remain far from reliable law-grounded world simulators, with the best video model scoring only 0.473. Our stage-, pillar-, and source-resolved analyses further expose a Perception-to-Formulation-to-Deduction bottleneck, weak multi-law state transfer, and a persistent Sim-to-Real gap. These findings position Apple-PI as a diagnostic foundation for guiding future video models toward world models with law-grounded physical intelligence.", 'score': 34, 'issue_id': 2869, 'pub_date': '2026-07-17', 'pub_date_card': {'ru': '17 июля', 'en': 'July 17', 'zh': '7月17日'}, 'hash': '898667e3dec97ca0', 'github_url': '', 'github_stars': 0, 'authors': ['Runmao Yao', 'Kairui Hu', 'Yukang Cao', 'Ruisi Wang', 'Shulin Tian', 'Ziang Cao', 'Weichen Fan', 'Ziqi Huang', 'Yuhao Dong', 'Hao Li', 'Zhaoxi Chen', 'Zhongang Cai', 'Lei Yang', 'Ziwei Liu'], 'affiliations': ['S-Lab, Nanyang Technological University', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.16401.jpg', 'data': {'categories': ['#reasoning', '#benchmark', '#dataset', '#survey'], 'emoji': '🎥', 'ru': {'title': 'Новый стандарт оценки видео-моделей через призму физических законов', 'desc': 'В данной статье представлено новое направление в оценке моделей генерации видео, основанное на физических законах. Мы разработали Apple-PI — первый бенчмарк, который позволяет проверять модели не только по их результатам, но и по тому, как они используют физику в процессе генерации. Бенчмарк включает в себя набор данных, протокол и оценочную систему, что позволяет более точно выявлять недостатки моделей. Результаты показывают, что современные видео-модели далеки от надежных симуляторов мира, основанных на законах физики.'}, 'en': {'title': 'Apple-PI: Benchmarking Video Models with Physical Laws', 'desc': 'This paper introduces Apple-PI, a new benchmark for evaluating video generation models based on physical laws. It includes a dataset of 400 videos that test models on both single and multi-law tasks in classical mechanics. The evaluation process is structured into three stages: Perception, Formulation, and Deduction, allowing for detailed analysis of model reasoning. Results show that current models struggle with law-grounded reasoning, highlighting areas for improvement in future video generation systems.'}}}, {'id': 'https://huggingface.co/papers/2607.17977', 'title': 'RynnBrain 1.1: Towards More Capable and Generalizable Embodied Foundation Model', 'url': 'https://huggingface.co/papers/2607.17977', 'abstract': 'Abstract  We present RynnBrain 1.1, a family of embodied foundation models spanning 2B, 9B, and 122B-A10B scales. Trained with a unified spatio-temporal and physically grounded framework, RynnBrain 1.1 supports embodied perception, spatial reasoning, localization, and planning. Compared with RynnBrain 1.0, it further introduces contact-point prediction across the model family and native 3D grounding for the 2B and 9B models, yielding representations and outputs that are more directly aligned with robot manipulation. We also develop RynnBrain-VLA with a unified cross-embodiment action space and embodiment-specific masking, and deploy it on Unitree G1, Astribot-S1, and Tianji-Wuji. RynnBrain 1.1 achieves strong results on embodied cognition, localization, and 3D grounding, with the 122B-A10B model outperforming all evaluated proprietary and open-source models on VSI-Bench, MMSI, and RefSpatial-Bench. Real-robot experiments show that RynnBrain-initialized policies outperform Qwen-based and representative generalist VLAs, while joint multi-task and multi-embodiment training improves process scores and success rates over per-task training.', 'score': 30, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '063066fcd018a5de', 'github_url': '', 'github_stars': 0, 'authors': ['Kehan Li', 'Bohan Hou', 'Minghao Zhu', 'Tianyi Zhang', 'Zesen Cheng', 'Zhikai Wang', 'Sicong Leng', 'Xin Li', 'Xiao Lin', 'Biying Yao', 'Minghua Zeng', 'Jiangpin Liu', 'Ronghao Dang', 'Jiayan Guo', 'Siteng Huang', 'Haoyu Zhao', 'Heng Ping', 'Yaxi Zhao', 'Kexiang Wang', 'Tong Lu', 'Shengke Xue', 'Jiahao Tang', 'Yulei Wang', 'Zejing Wang', 'Jianwei Gao', 'Shijian Lu', 'Chengju Liu', 'Jianfei Yang', 'Mingxiu Chen', 'Deli Zhao'], 'affiliations': ['DAMO Academy, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.17977.jpg', 'data': {'categories': ['#benchmark', '#3d', '#reasoning', '#optimization', '#agi', '#training', '#agents', '#robotics'], 'emoji': '🤖', 'ru': {'title': 'Эволюция моделей с телесным воплощением', 'desc': 'В статье представлен RynnBrain 1.1 — семейство моделей с телесным воплощением, охватывающее масштабы от 2B до 122B-A10B. Модели были обучены с использованием единой пространственно-временной и физически обоснованной структуры, что позволяет им поддерживать телесное восприятие, пространственное Reasoning, локализацию и планирование. Новая версия также включает предсказание контактных точек и поддержку 3D-основы для моделей 2B и 9B, что улучшает качество манипуляций роботов. Эксперименты показали, что политики, инициализированные RynnBrain, превосходят другие модели в заданиях по локализации и когнитивным процессам.'}, 'en': {'title': 'Empowering Robots with RynnBrain 1.1', 'desc': 'RynnBrain 1.1 is a new set of large-scale models designed for tasks involving robots, with sizes ranging from 2B to 122B parameters. It uses a framework that combines spatial and temporal understanding, allowing robots to perceive their environment, reason about space, and plan actions effectively. This version improves upon its predecessor by adding features like contact-point prediction and 3D grounding, which help in better robot manipulation. The models have shown superior performance in various benchmarks and real-world robot tasks compared to existing models.'}}}, {'id': 'https://huggingface.co/papers/2607.09759', 'title': 'ReflectWorld-MM: An Entity-Oriented Multimodal Memory System for Open-Ended Video Streams', 'url': 'https://huggingface.co/papers/2607.09759', 'abstract': 'Abstract  Building assistants that can continually watch the world, remember what they see, and reason over their accumulated experience is a long-standing goal, and recently multimodal agents equipped with long-term memory over video streams have attracted increasing interest. Unfortunately, existing systems either keep their memory inside the model context or in a flat feature store, and organize it around frames rather than around the persistent entities a stream is really about, which confines them to bounded videos and weakens their ability to track who and what reappears over time. In this paper, we propose ReflectWorld-MM, an entity-oriented multimodal memory system for open-ended video streams. It consists of three parts. The first is a perception front-end that turns an audiovisual stream into entity-resolved observations under a bounded short-term memory. The second is a hierarchical long-term memory, grounded in human memory theory, that couples a multi-scale episodic memory, an evolving entity-centric semantic memory, and a procedural memory. The third is a complete realization, built for real-world operation, that ingests arbitrary streams and plugs into off-the-shelf assistants. Across six long-video and lifelong-memory benchmarks, ReflectWorld-MM achieves the best accuracy on all six, outperforming strong memory agents and a frontier model.', 'score': 21, 'issue_id': 2868, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '636c03e62b0c977d', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaokang Ma', 'Yifan Sun', 'Zhihong Jin', 'Jie Gu', 'Yudong Luo', 'Shenyi Shao', 'Chu Tang', 'Jingmin Chen', 'Li Pu'], 'affiliations': ['Hangzhou Institute for Advanced Study, UCAS', 'Rightly Robotics', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.09759.jpg', 'data': {'categories': ['#multimodal', '#long_context', '#agent_memory', '#retrieval_eval', '#session_memory', '#training', '#agents', '#continual_learning', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Новая эра многомодальной памяти для видео', 'desc': 'В данной статье представлена система многомодальной памяти ReflectWorld-MM, которая предназначена для обработки открытых видеопотоков. Она включает в себя компоненты, которые обеспечивают преобразование аудиовизуального потока в наблюдения, ориентированные на сущности, и организуют долгосрочную память, основанную на теории человеческой памяти. Система сочетает в себе эпизодическую, семантическую и процедурную память, что помогает отслеживать сущности во времени. Результаты показывают превышение точности по сравнению с другими памятью и моделями.'}, 'en': {'title': 'Revolutionizing Video Memory with Entity-Centric Tracking', 'desc': 'This paper introduces ReflectWorld-MM, a multimodal memory system designed for processing open-ended video streams. Unlike existing systems that store memory in a flat structure, ReflectWorld-MM organizes memory around persistent entities, enhancing its ability to track and reason about them over time. The system features a perception front-end for entity-resolved observations, a hierarchical long-term memory inspired by human memory theory, and a practical implementation for real-world applications. It demonstrates superior performance across multiple benchmarks, outperforming other memory agents and advanced models.'}}}, {'id': 'https://huggingface.co/papers/2607.16850', 'title': 'Group Entropy-Controlled Policy Optimization', 'url': 'https://huggingface.co/papers/2607.16850', 'abstract': 'Abstract  Entropy control has become an effective tool in reinforcement learning (RL) of large language models (LLMs), helping balance exploration-exploitation trade-off during alignment process. Such RL paradigm is often conducted on mixtures of heterogeneous tasks, which induce distinct entropy regimes under the same policy, making global or token-level entropy regulation insufficient to corresponding heterogeneous needs of exploration. This heterogeneity further makes GRPO-style normalized advantages induce an entropy-dependent bias, making advantage signals across prompt groups statistically non-comparable. To address this issue, we propose Group Entropy-Controlled Policy Optimization (GEPO), a lightweight extension to GRPO that uses group entropy, estimated from existing grouped samples to perform entropy-conditioned asymmetric advantage shaping. GEPO attenuates positive advantages in low-entropy groups to reduce over-exploitation, and negative advantages in high-entropy groups to preserve exploration, with adaptive thresholds derived from historical entropy statistics. Extensive experiments on two base models across thirteen benchmarks spanning mathematics, physics, science, code generation, and instruction following show that GEPO consistently outperforms GRPO and recent entropy-controlled methods, delivering balanced cross-task improvements while preserving task-specific exploration levels throughout training.', 'score': 20, 'issue_id': 2868, 'pub_date': '2026-07-18', 'pub_date_card': {'ru': '18 июля', 'en': 'July 18', 'zh': '7月18日'}, 'hash': 'dc06f63146e22554', 'github_url': '', 'github_stars': 0, 'authors': ['Guangran Cheng', 'Chengqi Lyu', 'Songyang Gao', 'Wenwei Zhang', 'Kai Chen'], 'affiliations': ['Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.16850.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#rl', '#optimization', '#rlhf', '#training'], 'emoji': '⚖️', 'ru': {'title': 'Оптимизация с контролем энтропии для эффективного обучения', 'desc': 'В данной статье рассматривается использование контроля энтропии в обучении с подкреплением (RL) для больших языковых моделей (LLM). Авторы предлагают метод Group Entropy-Controlled Policy Optimization (GEPO), который адаптирует преимущества для разных групп задач, учитывая их уникальные уровни энтропии. Этот подход помогает сбалансировать исследование и эксплуатацию, уменьшая влияние наивысших положительных преимуществ в группах с низкой энтропией и отрицательных в группах с высокой энтропией. Эксперименты показывают, что GEPO превышает результаты существующих методов и обеспечивает баланс между задачами, сохраняя уровни исследования.'}, 'en': {'title': 'Balancing Exploration and Exploitation with GEPO', 'desc': 'This paper introduces Group Entropy-Controlled Policy Optimization (GEPO), a method designed to improve reinforcement learning in large language models by managing exploration and exploitation. It addresses the challenges posed by heterogeneous tasks that require different levels of entropy regulation, which traditional methods struggle to handle. GEPO adapts advantage signals based on group entropy, reducing over-exploitation in low-entropy groups and encouraging exploration in high-entropy groups. Experimental results demonstrate that GEPO outperforms existing methods, achieving better performance across various tasks while maintaining appropriate exploration levels.'}}}, {'id': 'https://huggingface.co/papers/2607.10371', 'title': 'GigaAM Multilingual: Foundation Model for Underrepresented Languages', 'url': 'https://huggingface.co/papers/2607.10371', 'abstract': 'Abstract  Despite recent scaling successes, multilingual ASR performance remains highly uneven, with long-tail languages suffering from severe data scarcity. This work addresses the challenge of building robust foundation models for underrepresented Central Asian languages (Kazakh, Kyrgyz, Uzbek). We present GigaAM Multilingual, a Conformer encoder pre-trained on 2M hours of audio using a HuBERT-style objective. Crucially, we introduce a cluster-level data balancing strategy during pre-training and a domain-aware sampling method during fine-tuning to mitigate head-language dominance. In controlled comparisons, our approach outperforms strong open pretrained encoders (Whisper Large v3, Omnilingual-1B) on target languages, achieving significant gains on spontaneous speech while maintaining efficiency. We release the foundation encoder and ASR model, offering a proven recipe for effective multilingual adaptation under realistic data imbalance.', 'score': 20, 'issue_id': 2870, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '4e38e98d793afb18', 'github_url': '', 'github_stars': 0, 'authors': ['Andrei Kuzmenko', 'Alexandr Maximenko', 'Aleksandr Kutsakov', 'Georgii Gospodinov', 'Dmitrii Bolotov', 'Oleg Kutuzov', 'Pavel Bogomolov', 'Fyodor Minkin'], 'affiliations': ['SaluteDevices, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2607.10371.jpg', 'data': {'categories': ['#training', '#dataset', '#multilingual', '#open_source', '#data', '#low_resource'], 'emoji': '🌍', 'ru': {'title': 'Улучшение распознавания речи для малоизвестных языков', 'desc': "В данной статье рассматривается проблема неравномерной работы многоязычных ASR систем, особенно для малоизвестных языков Центральной Азии, таких как казахский, киргизский и узбекский. Авторы предлагают модель GigaAM Multilingual, которая использует предобучение на 2 миллионах часов аудиоданных с целью улучшить качество распознавания. Для борьбы с преобладанием 'главных' языков внедряются стратегия балансировки данных на уровне кластеров и метод выборки на основе осведомленности о домене. Это позволяет модели значительно улучшить результаты для целевых языков, сохраняя при этом эффективность."}, 'en': {'title': 'Empowering Underrepresented Languages in ASR', 'desc': 'This paper focuses on improving automatic speech recognition (ASR) for underrepresented Central Asian languages like Kazakh, Kyrgyz, and Uzbek, which often lack sufficient training data. The authors introduce GigaAM Multilingual, a Conformer encoder pre-trained on a large dataset of 2 million hours of audio using a HuBERT-style objective. They implement a cluster-level data balancing strategy during pre-training and a domain-aware sampling method during fine-tuning to reduce the dominance of more common languages. The results show that their approach significantly outperforms existing models on these target languages, especially in recognizing spontaneous speech, while also being efficient.'}}}, {'id': 'https://huggingface.co/papers/2607.10387', 'title': 'GigaChat Audio: Time-aware Large Audio Language Model', 'url': 'https://huggingface.co/papers/2607.10387', 'abstract': 'Abstract  Temporal grounding in long recordings remains challenging for audio-conditioned LLMs. We present a time-aware audio LLM that answers questions with explicit timestamps over up to 120 minutes of input. Our approach interleaves periodic time markers with continuous audio tokens using large-scale synthetic supervision from a cascaded pipeline. Our model achieves strong temporal-grounding accuracy on short and long benchmarks and supports time-anchored fragment descriptions and summaries. Extensive ablations examine how time representation, marker frequency, tokenization, and duration-mixture design affect accuracy and computational cost. We release model weights and datasets to support further research on time-aware audio understanding, available at https://huggingface.co/ai-sage/GigaChat3.1-Audio-10B-A1.8B.', 'score': 20, 'issue_id': 2870, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': 'b5854adca1ee7d83', 'github_url': '', 'github_stars': 0, 'authors': ['Aleksandr Kutsakov', 'Mariia Sadovina', 'Georgii Gospodinov', 'Alexandr Maximenko', 'Oleg Kutuzov', 'Pavel Bogomolov', 'Fyodor Minkin'], 'affiliations': ['SaluteDevices, Russia'], 'pdf_title_img': 'assets/pdf/title_img/2607.10387.jpg', 'data': {'categories': ['#long_context', '#dataset', '#synthetic', '#benchmark', '#audio', '#open_source'], 'emoji': '🕒', 'ru': {'title': 'Временные метки для аудио: новый уровень понимания!', 'desc': 'В данной статье рассматривается задача временной привязки в длительных аудиозаписях для LLM, работающих с аудиоданными. Мы представляем временно-осведомлённую аудиомодель LLM, которая отвечает на вопросы с указанием явных временных меток на основе аудиовходов продолжительностью до 120 минут. Наш подход сочетает периодические временные маркеры с непрерывными аудиотокенами, используя масштабное синтетическое обучение. Модель демонстрирует высокую точность временной привязки на различных тестах и поддерживает описание и резюме фрагментов с временной привязкой.'}, 'en': {'title': 'Revolutionizing Audio Understanding with Time Awareness', 'desc': 'This paper introduces a time-aware audio language model (LLM) that can answer questions with specific timestamps from long audio recordings. The model processes up to 120 minutes of audio by combining periodic time markers with continuous audio tokens, utilizing large-scale synthetic supervision. It demonstrates high accuracy in temporal grounding for both short and long audio benchmarks, enabling detailed time-anchored descriptions and summaries. The study also explores various factors affecting model performance, such as time representation and tokenization, and provides resources for further research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.18227', 'title': 'FlowMimic: Mask-free Visual Editing and Generation with Pixel-pair Warped Flow Field for Online Video Editing Data Generation and Modality Mimicry', 'url': 'https://huggingface.co/papers/2607.18227', 'abstract': 'Abstract  In line with the prevailing direction of vision research, we explore the integration of both generation and editing capabilities for video and image modalities within a single model. Current approaches to collecting video editing data typically depend on labour-intensive, time-consuming curated procedures--involving object mask annotation, the use of error-introducing pair synthesis via I2V model and ControlNet-like guidance, and VLM-based quality filtering or refinement--and demonstrate limited task scalability. As a result, the diversity of editing tasks remains substantially narrower than that available for image editing models. We develop a pixel-pair temporal warped flow field that can directly generate corresponding video editing samples in real time from image editing samples, and we demonstrate across multiple levels of video editing tasks that a model can learn video editing using only such data. We regard the image modality as a particular form of the video modality. Accordingly, we design a modality mimic generation loss and a modality mimic editing loss to relatively align the capabilities--and thereby the output distributions--of the two modalities through mutual imitation. Moreover, language-based visual editing entails the comprehension of the editing instruction and the reference visual content, the localization of the region corresponding to that instruction within the reference visual contents, and the modification of that region alone. Existing approaches predominantly rely on external aids, such as fine-tuning an additional MLLM or explicitly supplying a mask sequence as auxiliary input during inference. In contrast, we aspire for the model to internalize this capability. To that end, we introduce sense-related tasks--for instance, referring expression segmentation--along with corresponding editing-region-aware latent-level loss and attention-level loss.', 'score': 14, 'issue_id': 2869, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'be2441ba7a1924ff', 'github_url': '', 'github_stars': 0, 'authors': ['Dingyun Zhang', 'Lixue Gong', 'Wei Liu'], 'affiliations': ['ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2607.18227.jpg', 'data': {'categories': ['#training', '#multimodal', '#data'], 'emoji': '🎥', 'ru': {'title': 'Интеграция редактирования видео и изображений в одной модели', 'desc': 'В данной статье рассматривается интеграция возможностей генерации и редактирования для видео и изображений в одной модели. Исследования показывают, что существующие методы сбора данных для редактирования видео требуют много времени и усилий, что ограничивает разнообразие задач редактирования. Мы разработали метод, который позволяет модели генерировать видео в реальном времени, используя только данные редактирования изображений. Также предлагаются новые задачи и потери, которые помогают модели лучше воспринимать инструкции для редактирования и осуществлять соответствующие изменения.'}, 'en': {'title': 'Unifying Video Generation and Editing in a Single Model', 'desc': 'This paper presents a unified model that integrates both video generation and editing capabilities, addressing the limitations of current video editing data collection methods. By developing a pixel-pair temporal warped flow field, the model can generate video editing samples in real time from image editing samples, enhancing task scalability. The authors introduce modality mimic generation and editing losses to align the output distributions of image and video modalities through mutual imitation. Additionally, the model aims to internalize language-based visual editing tasks without relying on external aids, using sense-related tasks to improve its understanding and execution of editing instructions.'}}}, {'id': 'https://huggingface.co/papers/2607.14183', 'title': 'Open-AoE: An Open Egocentric Manipulation Dataset and Toolchain for Embodied Learning', 'url': 'https://huggingface.co/papers/2607.14183', 'abstract': 'Abstract  Egocentric videos of human manipulation provide scalable supervision for embodied intelligence, yet existing resources rarely combine low-cost continuous capture, manipulation-level structured annotations, and reusable tools for robot learning. We present Open-AoE, an open, community-oriented egocentric manipulation dataset and toolchain spanning the full pipeline from smartphone capture to model training. Its first release contains approximately 2,000 hours of manipulation video collected in natural environments by 500+ contributors using 400+ smartphones. The dataset provides text annotations, MANO-based hand poses, camera trajectories, and temporally localized atomic actions. Open-AoE further includes a data processing pipeline that transforms raw recordings into structured samples through temporal action segmentation, semantic annotation, hand reconstruction, and camera trajectory reconstruction. Meanwhile, we provide a separate downstream toolchain supports visualization, cross-embodiment retargeting, model-specific data conversion, and training recipes for VLA policies, WAMs, and World Models. By integrating scalable capture, structured processing, and downstream adaptation, Open-AoE reduces the barriers to both data contribution and reuse, providing practical open infrastructure for embodied model training, human-to-robot transfer, and world modeling.', 'score': 13, 'issue_id': 2871, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'f4043b9bb2ec4874', 'github_url': '', 'github_stars': 0, 'authors': ['Zishuo Li', 'Bowen Yang', 'Changtao Miao', 'Kai Zhu', 'Hao Chen', 'Qingze Guan', 'Zhengxing Wu', 'Wanke Zhan', 'Yang Sun', 'Zhiyi Huang', 'Zitong Shan', 'Zhenchao Jin', 'Jiadong Hong', 'Taowen Wang', 'Yushi Feng', 'You Liu', 'Yibo Wang', 'Yifan Yang', 'Zhaowen Zhou', 'Man Luo', 'Hao Cheng', 'Bo Zhang', 'Jianshu Li', 'Jiansheng Cai', 'Guocai Yao', 'Jize Zhang', 'Chenhao Lin', 'Renjing Xu', 'Lequan Yu', 'Chao Shen', 'Chunhua Shen', 'Zhe Li'], 'affiliations': ['Ant Digital Technologies, Ant Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.14183.jpg', 'data': {'categories': ['#open_source', '#data', '#transfer_learning', '#dataset', '#games'], 'emoji': '🤖', 'ru': {'title': 'Открытые данные для обучения манипуляциям роботов', 'desc': 'В статье представляется Open-AoE — открытый набор данных и инструментарий для изучения манипуляций в эгоцентрических видео. Набор содержит около 2000 часов видео, зафиксированного 500 участниками с помощью более 400 смартфонов в естественных условиях. Он включает текстовые аннотации, позы рук и траектории камеры, что позволяет эффективно обучать модели. Open-AoE облегчает сбор данных и их повторное использование, предоставляя необходимую инфраструктуру для обучения моделей и переноса знаний от человека к роботу.'}, 'en': {'title': 'Empowering Robot Learning with Open-AoE Dataset', 'desc': 'Open-AoE is a new dataset and toolchain designed for egocentric videos of human manipulation, which helps in training robots. It includes around 2,000 hours of video collected from over 500 contributors using smartphones, making it a large and diverse resource. The dataset features structured annotations like hand poses and camera trajectories, along with a processing pipeline for transforming raw data into usable samples. This initiative aims to simplify data contribution and reuse, enhancing the development of embodied intelligence and facilitating human-to-robot learning.'}}}, {'id': 'https://huggingface.co/papers/2607.16900', 'title': 'Environment-free Synthetic Data Generation for API-Calling Agents', 'url': 'https://huggingface.co/papers/2607.16900', 'abstract': 'Abstract  Training API-calling large language model (LLM) agents demands massive amounts of high-quality trajectories. However, collecting such data at scale typically requires fully implemented environments with executable APIs and realistic, pre-populated backend databases, creating a major bottleneck for scalability. To overcome this, we propose an environment-free synthetic data generation approach that leverages LLMs as on-the-fly digital world models. Given only API specifications, our method generates trajectories mimicking interactions between an agent and a stateful environment. Specifically, an LLM first generates diverse tasks solvable with the provided APIs. A teacher agent then iteratively solves each task while an LLM simulator generates coherent synthetic API responses conditioned on the task context and simulation history. Finally, an LLM judge filters the trajectories to ensure the quality of the resulting dataset. We evaluate our approach on the challenging AppWorld and OfficeBench benchmarks, which include both information-retrieval and state-changing tasks. Fine-tuning models on our synthetic data yields significant performance gains, demonstrating that effective supervision for API-calling agents can be generated without any executable environment. Our results establish LLM-based API simulation as a practical, scalable solution for training agents across diverse API ecosystems.', 'score': 12, 'issue_id': 2868, 'pub_date': '2026-07-18', 'pub_date_card': {'ru': '18 июля', 'en': 'July 18', 'zh': '7月18日'}, 'hash': '9f1b34d6c6160663', 'github_url': '', 'github_stars': 0, 'authors': ['Seanie Lee', 'Sanjoy Chowdhury', 'Chao Jiang', 'Cheng-Yu Hsieh', 'Ting-Yao Hu', 'Alexander T Toshev', 'Oncel Tuzel', 'Raviteja Vemulapalli'], 'affiliations': ['Apple'], 'pdf_title_img': 'assets/pdf/title_img/2607.16900.jpg', 'data': {'categories': ['#benchmark', '#agent_memory', '#dataset', '#synthetic', '#training', '#agents', '#data'], 'emoji': '🤖', 'ru': {'title': 'Синтетические данные для обучения агентов без физического окружения', 'desc': 'В данной работе обсуждается метод генерации синтетических данных для обучения агентов, использующих API, без необходимости в физических средах. Мы предлагаем использовать LLM в качестве генераторов моделей цифрового мира, что позволяет создавать высококачественные траектории взаимодействия. Метод включает генерацию задач, их решение агентом и фильтрацию результатов для обеспечения качества данных. Исследование показывает, что обучение на этих синтетических данных приводит к значительным улучшениям в производительности агентов.'}, 'en': {'title': 'Synthetic Data Generation for Scalable API-Calling Agents', 'desc': 'This paper presents a novel method for generating synthetic training data for API-calling large language model (LLM) agents without needing fully implemented environments. By using LLMs as digital world models, the approach creates realistic trajectories based on API specifications, allowing for scalable data collection. A teacher agent solves tasks while an LLM simulator generates context-aware API responses, and a judge LLM ensures the quality of the data. The method shows significant performance improvements when fine-tuning models on the synthetic data, proving its effectiveness in training agents across various API ecosystems.'}}}, {'id': 'https://huggingface.co/papers/2607.18144', 'title': 'Do Language Models Dream of Binding Molecules? Benchmarking LLMs under Spatial Constraints', 'url': 'https://huggingface.co/papers/2607.18144', 'abstract': 'Abstract  Structure-based drug design (SBDD) leverages the 3D structure of protein targets, often complemented by other spatial constraints, to generate candidate binding molecules. While diffusion models have dominated as a leading paradigm for high-quality 3D molecule generation, LLM-based methods are rapidly emerging in molecular design and have shown competitive performance in pocket-conditioned molecular generation. However, their ability to reason about physics and 3D spatial environments is largely underexplored. In this work, we systematically analyze whether current general-purpose LLMs are capable of navigating complex 3D constraints compared to established baselines such as specialized diffusion models. We consider 3D ligand generation conditioned on protein pockets together with ligand- and interaction-derived spatial constraints, including anchor fragments, pharmacophore points, and mandatory pocket-ligand interactions. To enable this evaluation, we introduce 3D-Fit - a token-efficient benchmarking strategy for assessing LLM performance on multi-conditioned spatial molecule generation. Our findings reveal a clear pattern in LLM spatial capabilities: while they still lag behind state-of-the-art approaches, they are promising and can handle multiple spatial constraints simultaneously, enabling scaling to heterogeneous setups.', 'score': 10, 'issue_id': 2871, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '21bf40e7f56cdc1a', 'github_url': '', 'github_stars': 0, 'authors': ['Thomas MacDougall', 'Maksim Kuznetsov', 'Roman Schutski', 'Rim Shayakhmetov', 'Maxim Malkov', 'Vladimir Aladinskiy', 'Alex Aliper', 'Alex Zhavoronkov'], 'affiliations': ['Insilico Medicine AI Limited', 'Insilico Medicine Canada Inc.', 'Insilico Medicine Hong Kong Ltd.'], 'pdf_title_img': 'assets/pdf/title_img/2607.18144.jpg', 'data': {'categories': ['#benchmark', '#diffusion', '#reasoning', '#3d', '#dataset', '#optimization'], 'emoji': '🔬', 'ru': {'title': 'LLM: Новые горизонты в дизайне молекул', 'desc': 'Статья исследует применение LLM в области дизайна молекул на основе 3D структуры белков. Конкретно, авторы анализируют, как эти модели могут справляться с сложными пространственными ограничениями, сравнивая их с современными моделями диффузии. Результаты показывают, что, хотя LLM все еще уступают в качестве, они способны обрабатывать несколько пространственных условий одновременно. В статье также представлено новое средство оценки производительности LLM для генерации молекул с многими условиями.'}, 'en': {'title': 'Unlocking 3D Molecular Design with LLMs', 'desc': 'This paper explores the use of large language models (LLMs) in structure-based drug design (SBDD) for generating 3D molecules. It compares the performance of LLMs with established diffusion models, particularly in generating ligands conditioned on protein pockets and various spatial constraints. The authors introduce a new benchmarking strategy called 3D-Fit to evaluate the ability of LLMs to navigate complex 3D environments. The results indicate that while LLMs are not yet as effective as diffusion models, they show potential in handling multiple spatial constraints simultaneously.'}}}, {'id': 'https://huggingface.co/papers/2607.13365', 'title': 'DiffGI: Differentiable Geometry Images for High-Fidelity Thin-Shell 3D Generation', 'url': 'https://huggingface.co/papers/2607.13365', 'abstract': 'Abstract  Existing 3D generative models predominantly rely on implicit volumetric representations, which enforce watertight topology and struggle to represent thin-shell and non-manifold geometries such as garments. Geometry image-based approaches offer a surface-centric alternative, but existing methods rely on discrete binary occupancy maps whose resolution-dependent boundary encoding causes staircase artifacts and information loss upon downsampling, while surface reconstruction remains a non-differentiable post-processing step disconnected from the learning pipeline. To address this, we propose Differentiable Geometry Image (DiffGI), an end-to-end 3D-to-2D mapping framework that seamlessly integrates surface representation and geometric optimization. DiffGI replaces binary maps with a continuous 2D Truncated Signed Distance Function (TSDF), which encodes boundary position at subpixel precision within a fixed grid resolution, eliminating resolution-dependent staircase artifacts even under aggressive downsampling. Building on this continuous field, we introduce a differentiable Marching Squares algorithm based on analytical linear interpolation, allowing gradients from 3D surface losses to propagate back to the 2D latent space. Leveraging this differentiable pipeline, we train a DiffGI-VAE augmented with a geometry-aware normal rendering loss to compress complex 3D surfaces into an ultra-compact 32X32 latent space, and instantiate a transformer-based latent diffusion model with a flow-matching objective on top of this space for conditional 3D generation. Extensive experiments on garment and object datasets demonstrate that our method achieves superior reconstruction fidelity and boundary precision compared to prior geometry-image and voxel-based approaches, while requiring significantly fewer computational resources.', 'score': 10, 'issue_id': 2867, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '5b908a79d7ac6d23', 'github_url': '', 'github_stars': 0, 'authors': ['Eungjune Shim', 'Hansol Lee', 'Eunjung Ju'], 'affiliations': ['CLO Virtual Fashion Inc., South Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.13365.jpg', 'data': {'categories': ['#3d', '#diffusion', '#optimization'], 'emoji': '🧵', 'ru': {'title': 'Новая эпоха в 3D-генерации с использованием дифференцируемых методов', 'desc': 'В статье представлена новая модель генерации 3D-объектов под названием Differentiable Geometry Image (DiffGI), которая улучшает представление геометрии. Она заменяет бинарные карты на непрерывную 2D Функцию Объема (TSDF), что устраняет артефакты при понижении разрешения. Также разработан дифференцируемый алгоритм Marching Squares для улучшения обучения и восстановления поверхности. Результаты показывают, что метод обеспечивает более высокую точность реконструкции при меньших вычислительных затратах по сравнению с предыдущими подходами.'}, 'en': {'title': 'Revolutionizing 3D Surface Representation with Differentiable Geometry Images', 'desc': 'This paper introduces Differentiable Geometry Image (DiffGI), a novel framework for 3D-to-2D mapping that enhances surface representation and geometric optimization. Unlike traditional methods that use binary occupancy maps, DiffGI employs a continuous 2D Truncated Signed Distance Function (TSDF) to achieve high precision in boundary encoding. The framework includes a differentiable Marching Squares algorithm, allowing gradients to flow from 3D surface losses back to the 2D latent space, facilitating end-to-end training. Experiments show that DiffGI outperforms existing geometry-image and voxel-based methods in reconstruction fidelity and boundary precision while being more computationally efficient.'}}}, {'id': 'https://huggingface.co/papers/2607.18110', 'title': 'LLM-as-a-Coach: Experiential Learning for Non-Verifiable Tasks', 'url': 'https://huggingface.co/papers/2607.18110', 'abstract': "Abstract  Reinforcement learning (RL) on open-ended tasks compresses an LLM's rubric-based evaluation into a scalar reward, discarding rich textual feedback and conflating responses with distinct quality profiles. We propose Experiential Learning (EL), which repurposes the feedback model from an LLM-as-a-Judge into an LLM-as-a-Coach. The coach distills its assessment of each on-policy response into transferable experiential knowledge, which conditions a teacher model and is internalized by the policy through on-policy context distillation. Compared with scalar rewards, this higher-bandwidth feedback channel provides dense supervision and preserves fine-grained preferences among high-quality responses. Across two policy families, with feedback from the policy itself or a proprietary model, EL consistently outperforms rubric-based RL on held-out and unseen open-ended tasks. Notably, EL generalizes better beyond the training distribution, and mitigates reward hacking. These findings establish experiential knowledge as a richer and more generalizable learning signal for post-training on non-verifiable tasks.", 'score': 7, 'issue_id': 2868, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'fa2bbf04e45dcdfc', 'github_url': '', 'github_stars': 0, 'authors': ['Tianzhu Ye', 'Li Dong', 'Guanheng Chen', 'He Zhu', 'Xun Wu', 'Shaohan Huang', 'Furu Wei'], 'affiliations': ['Microsoft Research', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.18110.jpg', 'data': {'categories': ['#transfer_learning', '#rl', '#optimization', '#rlhf', '#training', '#reinforcement_learning'], 'emoji': '🤖', 'ru': {'title': 'Опытное обучение для повышения качества обратной связи', 'desc': 'В данной статье обсуждается подход к обучению с подкреплением (RL), который улучшает оценку больших языковых моделей (LLM). Авторы предлагают метод под названием Experiential Learning (EL), который преобразует оценку в более богатый канал обратной связи, позволяя LLM выступать в роли коуча. Этот метод использует опытное знание для улучшения обучения, сохраняя при этом тонкие предпочтения среди качественных ответов. Результаты показывают, что EL превосходит традиционные методы и лучше обобщает результаты на новых задачах.'}, 'en': {'title': 'Transforming Feedback: From Judge to Coach in RL', 'desc': 'This paper introduces Experiential Learning (EL), a method that enhances reinforcement learning by using an LLM as a coach instead of just a judge. EL captures detailed feedback from the LLM, transforming it into valuable experiential knowledge that informs a teacher model. This approach allows for richer, more nuanced feedback compared to traditional scalar rewards, leading to better performance on open-ended tasks. The results show that EL not only improves generalization beyond training data but also reduces issues like reward hacking.'}}}, {'id': 'https://huggingface.co/papers/2607.17097', 'title': 'HarmoHOI: Harmonizing Appearance and 3D Motion for Multi-view Hand-Object Interaction Synthesis', 'url': 'https://huggingface.co/papers/2607.17097', 'abstract': 'Abstract  Hand-Object Interaction (HOI) synthesis is a cornerstone for animation production and embodied AI. Despite the strong priors of video foundation models, multi-view consistent HOI synthesis remains challenging due to complex hand motions and occlusions. We present HarmoHOI, a unified diffusion framework that jointly and harmoniously generates synchronized multi-view HOI videos and globally aligned 3D point tracks. Our core insight is that robust multi-view consistency fundamentally requires globally aligned 3D geometry and motion. To this end, we propose a Mixture of Multi-view Diffusion Transformer that co-models RGB videos and 3D point tracks. By representing point tracks as pseudo-videos, we align 3D geometric signals with the 2D latent space of foundation models, thereby minimizing the domain gap and easing adaptation of priors. To further ensure geometry consistency, we introduce Global Motion Aligning Diffusion, which refines coarse point tracks into metric-scale, globally aligned 3D trajectories. HarmoHOI enables on-the-fly co-evolution of 2D appearance and 3D motion during denoising. To overcome the scarcity of multi-view HOI data, we employ a hybrid data curriculum learning strategy that successfully transfers generic priors from single-view data to synchronized multi-view generation. Experimental results show that HarmoHOI achieves state-of-the-art performance in visual quality, motion plausibility, and multi-view geometric consistency. Project page available at https://droliven.github.io/HarmoHOI_project.', 'score': 7, 'issue_id': 2869, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': '7c38db1c829ae31b', 'github_url': '', 'github_stars': 0, 'authors': ['Lingwei Dang', 'Juntong Li', 'Zonghan Li', 'Hongwen Zhang', 'Liang An', 'Wei Min', 'Yebin Liu', 'Qingyao Wu'], 'affiliations': ['Beijing Normal University, China', 'Shadow AI, China', 'South China University of Technology, China', 'Tsinghua University, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.17097.jpg', 'data': {'categories': ['#training', '#3d', '#transfer_learning', '#diffusion', '#dataset'], 'emoji': '🖐️', 'ru': {'title': 'Синхронизация движений рук и объектов в видео', 'desc': 'Статья описывает HarmoHOI, новую диффузионную модель для синтеза взаимодействия объектов с руками в нескольких перспективах. При помощи этой модели удается создавать синхронизированные видео и 3D траектории движения, что позволяет добиться мультивидовой консистенции. Основное внимание уделяется согласованию 3D геометрии и движения для улучшения качества визуализации и достоверности движений. Результаты экспериментов показывают, что HarmoHOI достигает лучших показателей по качеству изображения и интеграции движений по сравнению с существующими методами.'}, 'en': {'title': 'HarmoHOI: Harmonizing 2D and 3D for Realistic Hand-Object Interactions', 'desc': 'The paper introduces HarmoHOI, a novel framework for generating synchronized multi-view videos of hand-object interactions (HOI). It addresses challenges like complex hand motions and occlusions by ensuring multi-view consistency through globally aligned 3D geometry and motion. The framework utilizes a Mixture of Multi-view Diffusion Transformer to co-model RGB videos and 3D point tracks, effectively bridging the gap between 2D and 3D representations. HarmoHOI also employs a hybrid data curriculum learning strategy to enhance performance, achieving state-of-the-art results in visual quality and motion plausibility.'}}}, {'id': 'https://huggingface.co/papers/2607.17247', 'title': 'Distilled Reinforcement Learning for LLM Post-training', 'url': 'https://huggingface.co/papers/2607.17247', 'abstract': 'Abstract  Large language model (LLM) post-training is essential for improving reasoning, adaptation, and alignment. Existing methods mainly follow two paradigms: reinforcement learning (RL) and on-policy distillation (OPD). However, RL relies on coarse-grained outcome supervision, resulting in difficult credit assignment and limited capability to acquire new knowledge. OPD, meanwhile, unconditionally matches teacher logits through KL divergence, which creates a dilemma: similar teachers provide little new knowledge, while substantially different teachers often yield ineffective guidance, largely restricting OPD to within-family distillation. We propose Distilled Reinforcement Learning (Distilled RL), which integrates teacher supervision into the RL objective to provide fine-grained guidance, selectively transfer new knowledge and avoid unconditional imitation. Distilled RL contains three components: reverse importance sampling with clipping, negative sample reset, and sequence-level geometric normalization. Through a concise and interpretable case study, we demonstrate that Distilled RL can effectively transfer previously unavailable knowledge from a teacher model to a student model. Extensive experiments across both within-family and cross-family distillation settings show that Distilled RL substantially outperforms standard RL and OPD in terms of both pass@1 and pass@k. Our code is available at https://github.com/597358816/Distilled-RL.', 'score': 4, 'issue_id': 2868, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': '5290acc080cc0204', 'github_url': '', 'github_stars': 0, 'authors': ['Chen Wang', 'Zhaochun Li', 'Jionghao Bai', 'Yining Zhang', 'Hexuan Deng', 'Ge Lan', 'Yue Wang'], 'affiliations': ['Beijing Institute of Technology', 'College of Elite Engineers, Nankai University', 'College of Software, Nankai University', 'Harbin Institute of Technology', 'Institute of Automation, Chinese Academy of Sciences', 'Zhejiang University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2607.17247.jpg', 'data': {'categories': ['#transfer_learning', '#reasoning', '#rl', '#optimization', '#alignment', '#rlhf', '#agi', '#training'], 'emoji': '📚', 'ru': {'title': 'Постобучение LLM с помощью Distilled RL', 'desc': 'В статье рассматривается метод постобучения больших языковых моделей (LLM), называемый Distilled Reinforcement Learning (Distilled RL). Этот метод сочетает обучение с подкреплением и контроль со стороны учителя для более тонкого руководства в процессе обучения. Мы показываем, что Distilled RL позволяет эффективно передавать новое знание от модели-учителя к модели-ученик, преодолевая ограничения традиционных методов. Эксперименты показывают, что Distilled RL значительно превосходит стандартное обучение с подкреплением и distillation на различных задачах.'}, 'en': {'title': 'Enhancing Knowledge Transfer with Distilled Reinforcement Learning', 'desc': 'This paper introduces Distilled Reinforcement Learning (Distilled RL), a novel approach that enhances the post-training of large language models (LLMs) by integrating teacher supervision into the reinforcement learning framework. Unlike traditional methods that struggle with credit assignment and knowledge transfer, Distilled RL offers fine-grained guidance, allowing for selective knowledge transfer without unconditional imitation. The method includes components like reverse importance sampling, negative sample reset, and sequence-level geometric normalization to improve performance. Experimental results show that Distilled RL significantly outperforms existing techniques in both within-family and cross-family distillation tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.17146', 'title': 'The Geometry of Semantic Space: A Continuous Geometric Framework for the Transformer Architecture', 'url': 'https://huggingface.co/papers/2607.17146', 'abstract': 'Abstract  We present a continuous geometric framework that models the discrete algebraic operations of the Transformer architecture as an integro-differential equation (IDE) on a semantic fiber bundle calE = calM times R^d. Beginning from a single geometric axiom -- that the token sequence forms a discrete 1-manifold equipped with a canonical measure lattice -- we translate every core component of the modern Transformer (RMSNorm, RoPE, Softmax Attention, FFN, Residual Stream, SGD, Weight Decay) into a cohesive vocabulary of differential geometry, measure theory, and stochastic calculus. The resulting framework yields quantitative predictions spanning entropic optimal transport (Attention as a Schrödinger bridge) and non-equilibrium thermodynamics (SGD as Itô diffusion violating detailed balance). We conduct a six-part experimental campaign across five architectures (Qwen3, LLaMA\\nobreakdash-3.1, Gemma\\nobreakdash-3, GPT-2, Mistral) spanning 124M to 8B parameters. The empirical observables are quantitatively consistent with the geometric predictions: the ε^{-1/2} Lipschitz scaling calibration at machine precision (R^2 = 1.000), the Lie--Trotter operator-splitting torsion, the symmetric ablation instability confirming the Dual-Law of Topological Stability, the calO(1/k) thermodynamic suppression of Poincaré recurrence on the RoPE torus, the thermodynamic context-limit phase transition, and the Non-Equilibrium Steady State parameter vortex -- verified across two optimizers (AdamW and Pure SGD) to exclude momentum artifacts. The results demonstrate that analyzing Transformers through the lens of continuous stochastic differential geometry provides a predictive descriptive vocabulary for the stability limits, context bounds, and optimization dynamics of Large Language Models.', 'score': 4, 'issue_id': 2870, 'pub_date': '2026-07-19', 'pub_date_card': {'ru': '19 июля', 'en': 'July 19', 'zh': '7月19日'}, 'hash': '53b0b662b188a409', 'github_url': '', 'github_stars': 0, 'authors': ['Zhihua Liang'], 'affiliations': ['INFN, Sezione di Cagliari, I-09042 Monserrato (CA), Italy'], 'pdf_title_img': 'assets/pdf/title_img/2607.17146.jpg', 'data': {'categories': ['#architecture', '#training', '#math', '#agi', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Геометрический подход к архитектуре Transformer', 'desc': 'В данной статье представлен непрерывный геометрический подход, который моделирует дискретные алгебраические операции архитектуры Transformer как интегро-дифференциальное уравнение на семантическом волокне. Основываясь на одном геометрическом аксиоме, статья переводит ключевые компоненты современного Transformer в словарь дифференциальной геометрии и стохастического анализа. Результирующая структура позволяет делать количественные предсказания и предлагает новую перспективу для анализа стабильности и динамики оптимизации больших языковых моделей. Проводимые эксперименты подтверждают соответствие эмпирических наблюдений с геометрическими предсказаниями.'}, 'en': {'title': 'Transforming Transformers: A Geometric Approach', 'desc': 'This paper introduces a continuous geometric framework that interprets the operations of the Transformer architecture as an integro-differential equation. By treating the token sequence as a discrete 1-manifold, the authors translate key components of Transformers into terms from differential geometry and stochastic calculus. The framework allows for predictions related to optimal transport and thermodynamics, validated through extensive experiments on various architectures. The findings suggest that this geometric perspective can effectively describe the stability and optimization dynamics of Large Language Models.'}}}, {'id': 'ht
