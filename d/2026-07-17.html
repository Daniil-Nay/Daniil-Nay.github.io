проактивные напоминания, ответ на визуальные вопросы и взаимодействие с окружающей средой. Результаты показывают, что текущие MLLM имеют трудности в оказании полноценной поддержки, особенно в задаче проактивных напоминаний, что подчеркивает необходимость дальнейших исследований в этой области.'}, 'en': {'title': 'Enhancing Assistance for the Visually Impaired with VIABench', 'desc': 'This paper addresses the challenges faced by visually impaired individuals (VIIs) in accessing visual information. It introduces VIABench, a video benchmark designed to evaluate Multimodal Large Language Models (MLLMs) in assisting VIIs using first-person videos. The benchmark includes three tasks: Proactive Reminder, Visual Question Answering (VQA), and Vision-Guided Interaction, each targeting specific needs for visual assistance. The findings reveal that current MLLMs struggle with providing effective support, particularly in anticipating navigation-critical events, highlighting the need for further research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.15058', 'title': 'SUFLECA: Scaling Up Feature Learning for CAD-to-image Alignment', 'url': 'https://huggingface.co/papers/2607.15058', 'abstract': "Abstract  CAD-to-image alignment aims to estimate an object's 9D pose (rotation, translation, and anisotropic scale) from a single RGB image, enabling applications in robotics and augmented reality. Recent zero-shot methods use visual foundation models to match image regions to CAD models, yet typically their correspondences are appearance-driven and degrade under occlusion or sim-to-real domain shift. To address these limitations, we introduce SUFLECA (Scaling Up Feature LEarning for CAD Alignment), a weakly-supervised framework for zero-shot CAD alignment with two key contributions. First, SUFLECA scales up geometry-grounded feature learning from pretrained visual representations through Normalized Object Coordinates (NOCs) supervision on 674K images spanning 12 real and synthetic datasets, learning compact geometry-aware features that generalize across domains. Second, we propose a geometrically consistent matching algorithm that establishes reliable one-to-one CAD-to-image correspondences. Together, these contributions enable accurate, sub-second alignment per object instance without iterative pose refinement. On ScanNet25k, SUFLECA achieves 33.4%/42.3% category/instance accuracy, outperforming, with a smaller computational footprint, the strongest zero-shot baseline by 10.3/12.2 percentage points and, for the first time on this benchmark, even surpassing fully supervised methods. Code is available at: https://github.com/snt-arg/SUFLECA", 'score': 7, 'issue_id': 2840, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'f74cc008101e51db', 'github_url': '', 'github_stars': 0, 'authors': ['Saad Ejaz', 'Miguel Fernandez-Cortizas', 'Javier Civera', 'Holger Voos', 'Jose Luis Sanchez-Lopez'], 'affiliations': ['Automation and Robotics Research Group, Interdisciplinary Centre for Security, Reliability, and Trust (SnT), University of Luxembourg, Luxembourg', 'Faculty of Science, Technology, and Medicine, University of Luxembourg, Luxembourg', 'I3A, Universidad de Zaragoza'], 'pdf_title_img': 'assets/pdf/title_img/2607.15058.jpg', 'data': {'categories': ['#open_source', '#3d', '#transfer_learning', '#optimization', '#dataset', '#benchmark'], 'emoji': '🖼️', 'ru': {'title': 'Точное выравнивание CAD с помощью слабого обучения', 'desc': 'В статье рассматривается метод выравнивания CAD-моделей по изображениям, с помощью которого можно оценить 9D позу объекта на основе одного RGB изображения. Предложенный метод SUFLECA использует слабое обучение для выравнивания CAD без примеров, обучая компактные геометрически осведомленные функции на большом количестве изображений. Кроме того, разрабатывается алгоритм геометрически устойчивого сопоставления, который обеспечивает надежные соответствия между CAD и изображениями. Этот подход позволяет достигать высокой точности выравнивания, не требуя итеративной доработки позы.'}, 'en': {'title': 'Revolutionizing CAD-to-Image Alignment with SUFLECA', 'desc': "This paper presents SUFLECA, a weakly-supervised framework for aligning CAD models with images to estimate an object's 9D pose. It improves upon existing zero-shot methods by incorporating geometry-grounded feature learning using Normalized Object Coordinates (NOCs) from a large dataset. SUFLECA also introduces a geometrically consistent matching algorithm to ensure reliable correspondences between CAD models and image regions. The approach achieves high accuracy in alignment while being computationally efficient, outperforming both zero-shot and fully supervised methods on the ScanNet25k benchmark."}}}, {'id': 'https://huggingface.co/papers/2607.15277', 'title': 'Partition, Prompt, Aggregate: Statistical Self-Consistency in Language Models', 'url': 'https://huggingface.co/papers/2607.15277', 'abstract': "Abstract  In-context learning is commonly interpreted as a form of conditional inference, in which the prompt specifies a context and the model's output is treated as an estimate of the corresponding conditional distribution. If this interpretation holds, then LLM estimates should satisfy basic probabilistic identities. In particular, the law of total probability asserts that prior-weighted conditional distributions aggregate into population-level marginals over any valid partition of the population. In this work, we investigate to what extent LLM estimates adhere to this self-consistency principle. We use binary trees as an evaluation scaffold to recursively partition a population into increasingly fine-grained subpopulations. We then prompt LLMs with verbalized subpopulation descriptions in context, aggregate the resulting estimates back into population-level estimates, and compare them across partitions of varying granularity. Applying this protocol across problem domains and state-of-the-art frontier models, we show widespread violations of basic consistency properties. An in-depth study of persona prompting reveals a pattern we call the macro fallacy: estimates reconstructed from more fine-grained subpopulation responses are often better aligned with human reference data than direct population-level estimates. This effect persists across variations in tree structure and estimation task, and can be partially recovered through implicit prompting. Together, these findings suggest that models possess relevant subpopulation knowledge but do not reliably propagate it into aggregate estimates. This gap establishes statistical self-consistency as an unsaturated, reference-free criterion for evaluating LLMs.", 'score': 7, 'issue_id': 2838, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '3f83327f3608f430', 'github_url': '', 'github_stars': 0, 'authors': ['Patrik Wolf', 'Thomas Kleine Buening', 'Andreas Krause', 'Celestine Mendler-Dünner'], 'affiliations': ['ELLIS Institute, Tübingen', 'ETH Zürich', 'Max Planck Institute for Intelligent Systems, Tübingen, Germany', 'Tübingen AI Center'], 'pdf_title_img': 'assets/pdf/title_img/2607.15277.jpg', 'data': {'categories': ['#benchmark', '#hallucinations', '#prompting', '#inference'], 'emoji': '🔍', 'ru': {'title': 'Проблема самосогласованности в оценках LLM', 'desc': 'В этой работе рассматривается концепция ин контекстного обучения, где LLM производит выводы на основе заданного контекста. Исследуется, насколько оценки моделей соответствуют принципу самосогласованности, основанному на законе полной вероятности. Мы используем двоичные деревья для разбиения популяции на подпопуляции и анализируем, как модели агрегируют оценочные данные. Результаты показывают, что модели не всегда корректно учитывают информацию о подгруппах, что приводит к нарушениям основных свойств согласованности.'}, 'en': {'title': 'Unveiling the Macro Fallacy in LLM Estimates', 'desc': 'This paper explores in-context learning in large language models (LLMs) and its relationship with conditional inference. It examines whether LLM outputs align with the law of total probability, which states that conditional distributions should aggregate into overall population estimates. The authors find that LLMs often violate these consistency properties, revealing a phenomenon called the macro fallacy, where finer subpopulation estimates are more accurate than direct population-level estimates. The study suggests that while LLMs have knowledge of subpopulations, they struggle to integrate this knowledge into their overall predictions.'}}}, {'id': 'https://huggingface.co/papers/2607.10995', 'title': 'AsySplat: Efficient Asymmetric 3D Gaussian Splatting for Long-Sequence Scene Modeling', 'url': 'https://huggingface.co/papers/2607.10995', 'abstract': 'Abstract  Recent generalizable 3D Gaussian Splatting models have advanced long-sequence novel view synthesis (NVS), but at the cost of substantial redundant computation. We identify that the redundancy can be mitigated based on two observations: (i) high-precision geometry is not strictly required for high-quality NVS; (ii) appearance learning is generally easier than geometry recovery. Motivated by these insights, we propose an asymmetric architecture that decouples geometry and appearance modeling. The geometry branch processes coarse-grained tokens with most of the parameters for multi-view reconstruction, while the appearance branch operates on fine-grained tokens to capture details using significantly fewer parameters. The two branches interact through bilateral connections, enabling mutual guidance for their respective tasks. This task-aware asymmetry reduces the computational redundancy and allocates the computation more judiciously, thereby increasing parameter efficiency and enabling smaller models to achieve strong performance. On 32-view 960P inputs, our model matches optimization-based methods while delivering nearly 800x speedup, and surpasses the zero-shot performance of state-of-the-art generalizable models with markedly fewer parameters and reduced training/inference overhead, achieving an overall efficiency improvement.', 'score': 7, 'issue_id': 2839, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '59bf2e5fceb8c056', 'github_url': '', 'github_stars': 0, 'authors': ['Yingji Zhong', 'Dave Zhenyu Chen', 'Fuzhao Ou', 'Youyu Chen', 'Zhihao Li', 'Lanqing Hong', 'Dan Xu'], 'affiliations': ['CityU', 'HKUST', 'Huawei Noahs Ark Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.10995.jpg', 'data': {'categories': ['#small_models', '#training', '#3d', '#architecture', '#optimization'], 'emoji': '⚙️', 'ru': {'title': 'Эффективный синтез видов с уменьшением избыточных вычислений', 'desc': 'В этой статье рассматриваются новые модели 3D Gaussian Splatting для синтеза новых видов из длинных последовательностей. Проблема избыточных вычислений решается за счет разделения обработки геометрии и внешнего вида. Геометрическая ветвь обрабатывает грубые токены, а ветвь внешнего вида — тонкие токены, что позволяет сократить количество параметров. Это улучшает эффективность модели и ускоряет процесс, обеспечивая высокое качество без необходимости в сложной геометрии.'}, 'en': {'title': 'Efficient 3D View Synthesis through Asymmetric Modeling', 'desc': 'This paper presents a new approach to 3D Gaussian Splatting for novel view synthesis (NVS) that reduces redundant computations. It introduces an asymmetric architecture that separates geometry and appearance modeling, allowing for more efficient processing. The geometry branch focuses on coarse tokens for multi-view reconstruction, while the appearance branch captures finer details with fewer parameters. This design leads to significant speed improvements and better performance with smaller models, achieving a nearly 800x speedup compared to traditional methods.'}}}, {'id': 'https://huggingface.co/papers/2607.14106', 'title': 'Token Time Continuous Diffusion for Language Modeling', 'url': 'https://huggingface.co/papers/2607.14106', 'abstract': 'Abstract  In this paper we introduce token time continuous diffusion (TTCD), a new diffusion language model which (a) operates in continuous space, deterministically mapping Gaussian noise to a final token canvas with no further sampling, and crucially (b) incorporates a new notion of per-token times, with some tokens proceeding from noise to token at a faster rate than others. Continuous space modeling helps TTCD avoid the parallel sampling of multiple tokens, which is a key source of inaccuracy at high speedups for models that iterate purely in discrete space. The notion of per-token times helps TTCD to better model conditional generation, allows for more sure tokens to proceed at a faster rate, and allows for differentiated inter-token influences during refinement. TTCD outperforms discrete models at high speedups. We train a 160M parameter TTCD model on OpenWebText, and then self-distill it; we find that at high speedups we are comparable in unconditional generation quality, and outperform in conditional generation, several existing models of similar size trained, on the same data, and self-distilled. We achieve similar gains in Sudoku solving as well.', 'score': 7, 'issue_id': 2841, 'pub_date': '2026-05-07', 'pub_date_card': {'ru': '7 мая', 'en': 'May 7', 'zh': '5月7日'}, 'hash': '90df1c737139b742', 'github_url': '', 'github_stars': 0, 'authors': ['Parikshit Bansal', 'Sujay Sanghavi'], 'affiliations': ['UT Austin'], 'pdf_title_img': 'assets/pdf/title_img/2607.14106.jpg', 'data': {'categories': ['#diffusion', '#training', '#architecture', '#optimization'], 'emoji': '⚡', 'ru': {'title': 'Диффузионная модель для высокой скорости генерации', 'desc': 'В данной работе представлен новый диффузионный языковой модель — TTCD, который работает в непрерывном пространстве и детерминированно отображает гауссовский шум в окончательный токен. Модель вводит новую концепцию временных характеристик для токенов, что позволяет некоторым токенам переходить от шума к токену быстрее других. Использование непрерывного моделирования помогает TTCD избежать параллельной выборки нескольких токенов, что улучшает точность при высоких увеличениях скорости. Модель TTCD показывает лучшие результаты в условной генерации по сравнению с дискретными моделями.'}, 'en': {'title': 'Revolutionizing Token Generation with Continuous Diffusion', 'desc': 'This paper presents a novel diffusion language model called token time continuous diffusion (TTCD). TTCD operates in continuous space, allowing it to deterministically convert Gaussian noise into tokens without the need for sampling. It introduces the concept of per-token times, enabling some tokens to transition from noise to final output more quickly than others, which enhances conditional generation. The model demonstrates superior performance over traditional discrete models, especially at high speedups, achieving comparable quality in unconditional generation and outperforming in conditional tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.12227', 'title': 'Rethinking the Evaluation of Harness Evolution for Agents', 'url': 'https://huggingface.co/papers/2607.12227', 'abstract': 'Abstract  We revisit the evaluation of automatic harness evolution for LLM agents. Existing harness evolution methods use unit test cases to search for harness configurations and then report final performance on the same public benchmark. This protocol raises two fundamental concerns. First, harness evolution is itself an iterative search procedure that repeatedly evaluates and revises candidate harnesses using task feedback. As in agentic test-time scaling, it should therefore be compared with simple task-level search baselines under matched feedback and inference budgets to determine whether its gains arise from improved harness design or from additional search alone. Second, because the search and the final evaluation share the same benchmark, the reported gains risk overfitting to that specific task set. To address these concerns, we conduct an extensive evaluation comparing harness evolution with simple test-time scaling and discovery baselines under comparable feedback and inference budgets, and also evaluate evolved harnesses on held-out tasks to assess whether the discovered improvements generalize. Experiments on Terminal-Bench 2.1 with GPT-5.4 and Claude Opus 4.6 show that automatic harness evolution does not consistently outperform simple test-time scaling methods and exhibits limited generalization. Our results raise important questions about the effectiveness of automatic harness evolution and highlight the need for fairer evaluation protocols and benchmarks for automatic harness design. Our code is available at https://github.com/rethinking-harness-evolution.', 'score': 5, 'issue_id': 2844, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '149b4e374086b1fc', 'github_url': '', 'github_stars': 0, 'authors': ['Yike Wang', 'Huaisheng Zhu', 'Zhengyu Hu', 'Yige Yuan', 'Zhengyu Chen', 'Shakti Senthil', 'Hannaneh Hajishirzi', 'Yulia Tsvetkov', 'Pradeep Dasigi', 'Teng Xiao'], 'affiliations': ['Allen Institute for AI', 'Independent', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2607.12227.jpg', 'data': {'categories': ['#benchmark', '#retrieval', '#survey', '#training', '#agents', '#optimization'], 'emoji': '🧪', 'ru': {'title': 'Пересмотр автоматической эволюции хранилищ для LLM агентов', 'desc': 'В данной работе мы пересматриваем методы оценки автоматической эволюции хранилищ для LLM агентов. Обнаружено, что существующие методы используют единичные тесты, что может привести к переобучению результатов на одинаковых наборах задач. Мы проводим обширные эксперименты, чтобы сравнить эволюцию хранилищ с простыми методами масштабирования, а также проверяем общие результаты на удерживаемых задачах. Результаты показывают, что автоматическая эволюция хранилищ не всегда превосходит простые методы и требует более справедливых протоколов оценки.'}, 'en': {'title': 'Rethinking Automatic Harness Evolution for LLMs', 'desc': 'This paper examines the effectiveness of automatic harness evolution for large language model (LLM) agents. It highlights concerns about the evaluation methods used, particularly the risk of overfitting to specific benchmarks and the need for fair comparisons with simpler task-level search methods. The authors conduct experiments to compare harness evolution with these baselines under controlled conditions and assess generalization on new tasks. The findings suggest that automatic harness evolution does not consistently outperform simpler methods and calls for improved evaluation protocols in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.10463', 'title': 'GRASP: GRanularity-Aware Search Policy for Agentic RAG', 'url': 'https://huggingface.co/papers/2607.10463', 'abstract': "Abstract  Agentic retrieval-augmented generation (RAG) extends static RAG by allowing language models to iteratively reason, generate search queries, retrieve evidence, and predict answers. However, it remains challenging for models to decide when to retrieve, whether to use lexical matching or semantic similarity, and how to control context granularity to prevent irrelevant tokens from interfering with agent reasoning. In this paper, we introduce GRASP, a reinforcement learning (RL) framework for training agents to adaptively coordinate complementary retrieval tools during multi-step reasoning. GRASP provides the agent with semantic search, keyword search, and paragraph-reading actions, enabling it to retrieve sentence-level evidence and expand further context only when needed. We train the policy with a reward that jointly accounts for answer accuracy, grounded reading, complementary search, and turn efficiency. Experiments on multi-hop reasoning benchmarks show that GRASP improves both retrieval recall and downstream question answering performance compared with single-step retrieval, prompting-based agentic RAG, and RL-based retrieval baselines. Qualitative and ablation analyses show that the learned policy develops interpretable skimming and scanning behavior: it uses semantic search for broad exploration, paragraph reading for local verification, and keyword search for entity-specific evidence. These results suggest that learning to coordinate retrieval signals and context granularity is critical for agent's correct reasoning.", 'score': 5, 'issue_id': 2838, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '181cc012cafef6c6', 'github_url': '', 'github_stars': 0, 'authors': ['Varun Gandhi', 'Jaewook Lee', 'Shantanu Todmal', 'Franck Dernoncourt', 'Ryan Rossi', 'Zichao Wang', 'Andrew Lan'], 'affiliations': ['Adobe Research', 'University of Massachusetts Amherst'], 'pdf_title_img': 'assets/pdf/title_img/2607.10463.jpg', 'data': {'categories': ['#rl', '#benchmark', '#retrieval', '#rag', '#agent_memory', '#reasoning', '#agents'], 'emoji': '🧠', 'ru': {'title': 'Интеллектуальный поиск для правильного вывода!', 'desc': 'Статья описывает метод GRASP, который улучшает агентный подход к поиску и генерации ответов с помощью обучения с подкреплением. Он позволяет языковым моделям эффективно решать, когда и как использовать разные инструменты поиска для получения релевантной информации. Благодаря адаптивной координации действий, таких как семантический поиск и чтение параграфов, модель может собирать необходимые данные только в нужный момент. Эксперименты показывают, что GRASP значительно повышает точность ответов и качество поиска информации по сравнению с традиционными методами.'}, 'en': {'title': 'Enhancing RAG with Adaptive Retrieval Coordination', 'desc': 'This paper presents GRASP, a reinforcement learning framework that enhances retrieval-augmented generation (RAG) by enabling language models to reason and retrieve information iteratively. It addresses challenges in deciding when to retrieve information and how to balance lexical and semantic search methods. GRASP allows agents to use different retrieval actions, such as semantic search and paragraph reading, to gather relevant evidence effectively. The results show that GRASP improves retrieval accuracy and question answering performance by coordinating retrieval strategies and managing context granularity.'}}}, {'id': 'https://huggingface.co/papers/2607.14387', 'title': 'Chat2Scenic: An Iterative RAG-Based Framework for Scenario Generation in Autonomous Driving', 'url': 'https://huggingface.co/papers/2607.14387', 'abstract': 'Abstract  Validating autonomous driving systems requires diverse, regulation-compliant test scenarios. In simulation-based testing, scenarios are defined as executable scripts. Yet automatically generating such scripts from regulatory descriptions remains an open challenge, and existing approaches face fundamental trade-offs. Retrieval-assemble methods achieve reasonable compilation rates but lack scalability, whereas retrieval-based full-script generation suffers from low compilation success rates. We present Chat2Scenic, the first iterative retrieval-augmented framework to generate scenario scripts in Domain Specific Language (DSL). Specifically, Chat2Scenic provides a chatbot interface that supports interactive scenario refinement and integrates Retrieval-augmented Generation (RAG) to ground scenario generation in regulatory knowledge and DSL syntax. Furthermore, we propose an open benchmark for scenario generation comprising 123 scenarios from various regulations, including NHTSA and United Nations Vehicle Regulations, as well as other sources. Extensive evaluation with State-of-the-Art (SOTA) Large Language Models (LLMs) demonstrates that Chat2Scenic achieves 76.42% Compilation Success Rate (CSR) and 58.17% Framework Accuracy (FA), outperforming existing methods (Retrieval Assemble with 30.08% CSR, 11.03% FA and Retrieval full script generation with 16.26% CSR, 10.86% FA). To facilitate future research, we release our code as open source at https://github.com/TUM-AVS/chat2scenic.', 'score': 4, 'issue_id': 2842, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'd04051ceef91c6b6', 'github_url': '', 'github_stars': 0, 'authors': ['Yuan Gao', 'Wenting Miao', 'Mattia Piccinini', 'Haoyu Wang', 'Qunying Song', 'Johannes Betz'], 'affiliations': ['Munich Institute of Robotics and Machine Intelligence (MIRMI)', 'Professorship of Autonomous Vehicle Systems, TUM School of Engineering and Design, Technical University of Munich, 85748 Garching, Germany', 'University College London, London, United Kingdom'], 'pdf_title_img': 'assets/pdf/title_img/2607.14387.jpg', 'data': {'categories': ['#retrieval', '#rag', '#agents', '#benchmark', '#survey', '#open_source'], 'emoji': '🚗', 'ru': {'title': 'Инновации в тестировании автономного вождения', 'desc': 'Статья представляет Chat2Scenic, новый фреймворк для генерации сценариев тестирования автономных систем вождения. Он использует подход, основанный на Retrieval-augmented Generation (RAG), что позволяет создавать сценарии на основе регуляторных требований. Chat2Scenic включает интерфейс чат-бота для интерактивной доработки сценариев и достигает высокой успешности компиляции. Результаты оценок показывают, что он превосходит существующие методы по важным метрикам.'}, 'en': {'title': 'Revolutionizing Scenario Generation for Autonomous Driving', 'desc': 'This paper introduces Chat2Scenic, a novel framework for generating test scenarios for autonomous driving systems using a Domain Specific Language (DSL). It combines a chatbot interface for interactive refinement with Retrieval-augmented Generation (RAG) to ensure compliance with regulatory standards. The framework addresses the challenges of existing methods by achieving a higher Compilation Success Rate (CSR) and Framework Accuracy (FA). An open benchmark of 123 scenarios from various regulations is also provided to support future research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.15278', 'title': 'Hierarchical Denoising For Multi-Step Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.15278', 'abstract': "Abstract  Video models are evolving into vision foundation models, yet they still lack human-like multi-step reasoning. Streaming autoregressive diffusion models are efficient but limited in reasoning, while bidirectional diffusion enables global revision with high inference costs due to dense frame-level denoising. Both paradigms struggle to achieve logical consistency and low-latency streaming for complex reasoning tasks. We propose HDR (Hierarchical Denoising for Visual Reasoning), a unified framework that integrates hierarchical latents into causal video generation for multi-step reasoning. HDR organizes video latents into a tree-structured hierarchy, enabling coarse-to-fine reasoning before streaming output. Coarse denoising layers preserve uncertain hypotheses for global planning, while finer layers progressively refine them into concrete visual states. A sparse hierarchical attention pattern (SHAP) further reduces temporal attention costs. We introduce a level-stratified multi-step video reasoning benchmark with out-of-distribution cases, covering six tasks: maze navigation, Tower of Hanoi, one-line drawing, sliding puzzle, Sokoban, and water pouring. Compared with streaming autoregressive diffusion baselines, HDR improves success from 34.22 to 60.29 (76.2% relative gain) and increases average progress from 76.00 to 89.56, demonstrating more consistent reasoning trajectories. HDR maintains low-latency streaming at 0.70 seconds per latent, achieving 54.2 times faster inference than bidirectional diffusion. It also retains 82.9% of full-data performance with only 2% training data, compared with 52.0% for bidirectional diffusion. Real-world robot experiments further demonstrate HDR's potential for physical interaction and world modeling. Project demo: https://hierarchical-diffusion-reasoning.github.io/.", 'score': 3, 'issue_id': 2842, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '47d660f0506ae450', 'github_url': '', 'github_stars': 0, 'authors': ['Zezhong Qian', 'Xiaowei Chi', 'Chak-Wing Mak', 'Tianze Zhou', 'Ruibin Yuan', 'Yuhan Rui', 'Hengzhe Sun', 'Zhuoqun Wu', 'Yuming Li', 'Siyuan Qian', 'Sirui Han', 'Shanghang Zhang'], 'affiliations': ['Beihang University', 'Fuzhou University', 'Muka Robotics', 'Multimodal Art Projection', 'State Key Laboratory of Multimedia Information Processing, School of Computer Science, Peking University', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.15278.jpg', 'data': {'categories': ['#diffusion', '#reasoning', '#optimization', '#rl', '#architecture', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Новая эра видеомоделей: иерархическое рассуждение', 'desc': 'В статье представлена новая архитектура HDR (Hierarchical Denoising for Visual Reasoning) для видеомоделей, которая улучшает многоступенчатое логическое рассуждение. HDR использует иерархическую структуру латентов, позволяя осуществлять последовательное дообучение и плавный вывод. Это позволяет достигать большей последовательности в рассуждениях с меньшими временными задержками по сравнению с существующими моделями. Эксперименты показывают значительное улучшение точности и скорости вывода, что открывает новые возможности для дальнейших исследований в области машинного обучения.'}, 'en': {'title': 'Empowering Video Models with Human-like Reasoning', 'desc': 'This paper presents HDR (Hierarchical Denoising for Visual Reasoning), a new framework that enhances video models by enabling multi-step reasoning similar to human thought processes. HDR organizes video data into a tree-like structure, allowing for a systematic approach to reasoning that starts broadly and refines details over time. It introduces a sparse hierarchical attention pattern to reduce computational costs while maintaining low-latency streaming. The framework shows significant improvements in reasoning tasks, outperforming existing models in both efficiency and accuracy, making it suitable for real-world applications like robotics.'}}}, {'id': 'https://huggingface.co/papers/2607.09061', 'title': 'On Locality and Length Generalization in Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.09061', 'abstract': 'Abstract  A striking feature of the human visual system is that it ingests visual information through a series of local foveated glimpses, rather than a single global computation. This makes human vision distinctly different from most popular computer vision models in use today, which input images globally and in a single shot. A natural question therefore is whether local, sequential vision models may provide any fundamental computational benefits in addition to being biologically more plausible than global models. In this work, we investigate this question from the perspective of visual state tracking and length generalization. Inspired by recent studies of length generalization in language models, we study the behavior of vision models trained on simple vision tasks that require the aggregation of local information across an image. Our experiments reveal that, similar to language models, vision models can learn to exploit global shortcuts and thereby fail to generalize over task length or complexity. We also show that recurrent vision policies based on strictly local perception can mitigate these failures, thereby allowing models to generalize on these tasks. Our results show that local attention may be an essential overlooked requirement for robust compositional generalization.', 'score': 2, 'issue_id': 2844, 'pub_date': '2026-07-10', 'pub_date_card': {'ru': '10 июля', 'en': 'July 10', 'zh': '7月10日'}, 'hash': 'b66bee0d93e75839', 'github_url': '', 'github_stars': 0, 'authors': ['Pulkit Madan', 'Sanjay Haresh', 'Reza Ebrahimi', 'Sunny Panchal', 'Apratim Bhattacharyya', 'Roland Memisevic'], 'affiliations': ['Qualcomm AI Research'], 'pdf_title_img': 'assets/pdf/title_img/2607.09061.jpg', 'data': {'categories': ['#reasoning', '#multimodal', '#games', '#agents', '#optimization'], 'emoji': '👁️', 'ru': {'title': 'Локальное восприятие для лучшего обобщения в компьютерном зрении', 'desc': 'В данной работе рассматривается, как человеческая система зрения обрабатывает информацию через последовательные локальные взгляды, в отличие от большинства современных моделей компьютерного зрения, которые анализируют изображение глобально. Авторы исследуют, могут ли локальные модели зрения дать вычислительные преимущества и быть более последовательными в заданиях, требующих агрегации локальной информации. Эксперименты показывают, что, подобно языковым моделям, модели зрения могут находить глобальные сокращения, что затрудняет обобщение по длине или сложности задач. Однако рекуррентные модели зрения, основанные на строгом локальном восприятии, способны смягчить эти недостатки и обеспечить лучшее обобщение задач.'}, 'en': {'title': 'Local Vision: A Key to Better Generalization', 'desc': 'This paper explores how human vision processes information through local glimpses rather than a single global view, contrasting it with traditional computer vision models. The authors investigate whether local, sequential vision models can offer computational advantages and improve generalization in visual tasks. Their experiments show that, like language models, vision models can struggle with generalization when relying on global shortcuts. However, they find that using recurrent vision policies with local perception can enhance generalization capabilities, highlighting the importance of local attention in robust visual processing.'}}}];

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (2)', '#agent_memory (3)', '#agents (10)', '#agi (1)', '#alignment (1)', '#architecture (7)', '#audio (2)', '#benchmark (14)', '#compression (1)', '#context_window', '#continual_learning', '#data (2)', '#dataset (5)', '#diffusion (5)', '#ethics (1)', '#games (7)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference (4)', '#interpretability (1)', '#knowledge_graphs', '#leakage', '#long_context (3)', '#low_resource', '#machine_translation', '#math (1)', '#memorization', '#memory (2)', '#multilingual (1)', '#multimodal (8)', '#open_source (5)', '#optimization (15)', '#plp', '#prompt_caching', '#prompting (1)', '#rag (2)', '#reasoning (9)', '#retrieval (4)', '#retrieval_eval', '#rl (7)', '#rlhf (2)', '#robotics (3)', '#science', '#security (1)', '#session_memory', '#small_models (2)', '#story_generation', '#survey (4)', '#synthetic', '#tool_use (2)', '#training (11)', '#transfer_learning (2)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-19 08:15',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-19 08:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-19 08:15')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
