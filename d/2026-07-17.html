    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.14952', 'title': 'LongStraw: Long-Context RL Beyond 2M Tokens under a Fixed GPU Budget', 'url': 'https://huggingface.co/papers/2607.14952', 'abstract': 'Abstract  A growing gap separates inference context lengths from RL post-training: inference systems are approaching million-token contexts, while post-training workloads often remain at 256K tokens or below and rely on length generalization at deployment. The gap is especially important for AI agents, whose observations, tool outputs, documents, and prior decisions accumulate over long trajectories. LongStraw is an architecture-aware execution stack for million-token RL post-training under a fixed GPU budget, instantiated with Group Relative Policy Optimization (GRPO). It evaluates the shared prompt without autograd, retains only model-specific state needed by later tokens, and replays short response branches one at a time, reducing the live training graph at the cost of additional replay time. We implement it for the hybrid recurrent and full-attention Qwen3.6-27B and the compressed-attention mixture-of-experts GLM-5.2. On eight H20 GPUs, LongStraw completes grouped Qwen scoring and response backward at 2.1M positions for groups of 2 and 8; increasing the group size adds only 0.21 GB of peak allocated memory, while a separate stress test reaches 4.46M positions. On 32 H20 GPUs, we validate the end-to-end LongStraw execution path for a 2.1M-token prompt across all 78 layers of GLM-5.2. These experiments establish execution capacity rather than complete training correctness because the captured prompt state is detached and some distributed forward and gradient composition paths remain incomplete.', 'score': 174, 'issue_id': 2839, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '3cb8bd3aa82740e4', 'github_url': '', 'github_stars': 0, 'authors': ['Changhai Zhou', 'Kieran Liu', 'Yuhua Zhou', 'Qian Qiao', 'Jun Gao', 'Harry Zhang', 'Irvine Lu', 'Nolan Ho', 'Lucian Li', 'Andrew Lei', 'Cleon Cheng', 'Steven Chiang', 'Yihang Zeng', 'Di Zhang', 'Rio Yang', 'Kaijie Chen', 'Andrew Chen', 'Pony Ma', 'Weizhong Zhang', 'Cheng Jin'], 'affiliations': ['Fudan University', 'MindLab'], 'pdf_title_img': 'assets/pdf/title_img/2607.14952.jpg', 'data': {'categories': ['#inference', '#rl', '#long_context', '#architecture', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Оптимизация постобучения RL для миллиона токенов', 'desc': 'В данной статье рассматривается проблема разрыва между длиной контекста при выводе и постобучением в RL. Исследуется архитектура LongStraw, которая оптимизирует выполнение с использованием Group Relative Policy Optimization (GRPO) для работы с миллионом токенов. Этот метод уменьшает размер активной графа обучения за счет выполнения более коротких ответов, что позволяет эффективно использовать графический процессор. Эксперименты проводятся на моделях Qwen3.6-27B и GLM-5.2, чтобы продемонстрировать увеличение пропускной способности выполнения.'}, 'en': {'title': 'Bridging the Gap: Efficient Million-Token RL Post-Training', 'desc': "This paper addresses the challenge of using long context lengths in reinforcement learning (RL) post-training, where current systems often fall short. It introduces LongStraw, a new architecture that efficiently manages million-token contexts while staying within GPU memory limits. LongStraw utilizes Group Relative Policy Optimization (GRPO) to optimize the execution of long prompts by minimizing the model's memory footprint during training. The results demonstrate that LongStraw can handle large token prompts effectively, paving the way for improved performance in AI agents that require extensive context for decision-making."}}}, {'id': 'https://huggingface.co/papers/2607.14935', 'title': 'VideoChat3: Fully Open Video MLLM for Efficient and Generalist Video Understanding', 'url': 'https://huggingface.co/papers/2607.14935', 'abstract': "Abstract  Recent advances in video understanding have spanned motion, long video, and streaming interaction, driving this field toward real-world applications. Despite this progress, current open-source models remain limited in several ways. They often struggle to generalize across diverse video types, making them effective only in specific domains. High computational demands further restrict their efficiency and scalability. Moreover, most models are only partially open, with key components such as training code, strategy, or datasets unavailable, which hinders reproducibility and slows community-driven development. To address these issues, we introduce VideoChat3, a fully open, efficient, and generalist video-centric MLLM. VideoChat3 advances video understanding through two complementary designs. For efficiency, we introduce Inflated 3D Vision Transformer (I3D-ViT) and Adaptive Frame Resolution for Streaming Video Perception, which enables efficient spatiotemporal representation and reduces the cost of processing video inputs during training and inference. For effectiveness, we develop a scalable video data synthesis pipeline that curates three diverse, high-quality training datasets: VideoChat3-Academic2M, VideoChat3-LV116K, and VideoChat3-OL617K, covering general, long-form, and streaming video scenarios, improving the model's generalization across domains. By integrating these designs, VideoChat3 achieves a rare balance of broad generalization and computational efficiency. Experiments across general, long-form, and streaming benchmarks demonstrate that VideoChat3 surpasses prior open-source models with equal or larger parameter counts with only 4B parameters and higher efficiency.", 'score': 123, 'issue_id': 2837, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '2435413ceab0fa5c', 'github_url': '', 'github_stars': 0, 'authors': ['Xinhao Li', 'Yuhan Zhu', 'Xiangyu Zeng', 'Yuhao Dong', 'Haoning Wu', 'Zhiqiu Zhang', 'Yuandong Yang', 'Changlian Ma', 'Qingyu Zhang', 'Yansong Shi', 'Xinyu Chen', 'Haoran Chen', 'Zizheng Huang', 'Jun Zhang', 'Kun Ouyang', 'Lin Sui', 'Ziang Yan', 'Yicheng Xu', 'Chenting Wang', 'Yinan He', 'Hongjie Zhang', 'Yi Wang', 'Yu Qiao', 'Yali Wang', 'Ziwei Liu', 'Kai Chen', 'Limin Wang'], 'affiliations': ['Nanjing University', 'Nanyang Technological University', 'Peking University', 'Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.14935.jpg', 'data': {'categories': ['#transfer_learning', '#open_source', '#dataset', '#training', '#architecture', '#optimization', '#benchmark', '#data'], 'emoji': '🎥', 'ru': {'title': 'Эффективное видео-понимание с VideoChat3', 'desc': 'В статье представлен VideoChat3 — полностью открытая и эффективная MLLM для понимания видео. Она улучшает качество обработки видео за счет новых технологий, таких как Inflated 3D Vision Transformer и адаптивное разрешение кадров. Модель обучается на трех разнообразных наборах данных, что повышает ее универсальность и позволяет работать с различными типами видео. VideoChat3 демонстрирует высокую эффективность и превосходит предыдущие открытые модели с большим количеством параметров.'}, 'en': {'title': 'VideoChat3: Efficient and Generalist Video Understanding', 'desc': 'This paper presents VideoChat3, a fully open and efficient video-centric machine learning model designed to improve video understanding. It addresses limitations of existing models, such as poor generalization across video types and high computational demands. VideoChat3 incorporates an Inflated 3D Vision Transformer and Adaptive Frame Resolution to enhance efficiency, while a scalable data synthesis pipeline provides diverse training datasets. The model demonstrates superior performance in various video scenarios with only 4 billion parameters, achieving a balance between generalization and computational efficiency.'}}}, {'id': 'https://huggingface.co/papers/2607.14777', 'title': 'SEED: Self-Evolving On-Policy Distillation for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.14777', 'abstract': 'Abstract  Large language models are increasingly trained as interactive agents for long-horizon tasks involving multi-turn interaction, tool use, and environment feedback. Outcome-based reinforcement learning (RL) provides a practical optimization paradigm, but its sparse trajectory-level rewards offer limited guidance on intermediate decisions, leaving a supervision gap between episode-level outcomes and token-level policy learning. We propose SEED (SElf-Evolving On-Policy Distillation), a self-evolving framework that converts completed on-policy trajectories into training-time hindsight skills and distills their behavioral effect back into the policy model. SEED first fine-tunes the policy to analyze completed trajectories and generate natural-language skills that capture reusable workflows, decisive observations, or failure-avoidance rules. During RL, the current policy both collects trajectories and serves as the analyzer that extracts hindsight skills from them. Policy updates therefore improve subsequent decision making and skill analysis together, allowing hindsight supervision to evolve with the policy. SEED then re-scores the sampled actions under ordinary and skill-augmented contexts, converting the skill-induced probability shift into a dense token-level on-policy distillation signal. This signal is jointly optimized with outcome-based RL, keeping the auxiliary supervision aligned with the current trajectory distribution. Extensive experiments on text-based and vision-based agentic tasks show that SEED consistently improves performance and sample efficiency, exhibiting robust generalization to unseen scenarios. Our code is available at https://github.com/jinyangwu/SEED.', 'score': 84, 'issue_id': 2836, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '30b0dd72d53bf074', 'github_url': '', 'github_stars': 0, 'authors': ['Jinyang Wu', 'Shuo Yang', 'Zhengxi Lu', 'Fan Zhang', 'Yuhao Shen', 'Lang Feng', 'Haoran Luo', 'Zheng Lian', 'Shuai Zhang', 'Zhengqi Wen', 'Jianhua Tao'], 'affiliations': ['Nanyang Technological University', 'The Chinese University of Hong Kong', 'Tongji University', 'Tsinghua University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.14777.jpg', 'data': {'categories': ['#rlhf', '#training', '#agents', '#rl', '#tool_use', '#agent_memory', '#optimization'], 'emoji': '🌱', 'ru': {'title': 'SEED: Эффективное саморазвивающееся обучение', 'desc': 'В данной статье рассматривается метод SEED (SElf-Evolving On-Policy Distillation), который улучшает обучение ИИ с помощью саморазвивающегося анализа траекторий. Он преобразует завершенные траектории в навыки, которые затем используют для оптимизации принимаемых решений во время обучения с подкреплением (RL). Это позволяет улучшать взаимодействие агента с окружающей средой, эффективно обучая его навыкам через анализ прошедших эпизодов. Эксперименты показывают, что SEED повышает производительность и эффективность выборок, что делает его полезным для сложных задач.'}, 'en': {'title': 'Empowering Language Models with Self-Evolving Skills', 'desc': "This paper introduces SEED, a framework that enhances reinforcement learning for large language models by converting completed interactions into useful skills. It addresses the challenge of sparse rewards in traditional RL by distilling insights from past experiences into the policy model. SEED fine-tunes the policy to generate natural-language skills that help in decision-making and avoiding failures. The approach improves both the learning process and the model's performance on various tasks by providing more frequent and relevant feedback during training."}}}, {'id': 'https://huggingface.co/papers/2607.15257', 'title': 'SearchOS-V1: Towards Robust Open-Domain Information-Seeking Agent Collaboration', 'url': 'https://huggingface.co/papers/2607.15257', 'abstract': "Abstract  Recent advances in Tool-Integrated Large Language Models have made web search a core capability of information-seeking agents. However, as interaction histories grow, agents increasingly struggle to track task progress. When search attempts fail to yield useful evidence, current single- and multi-agent systems can become trapped in repetitive loops, wasting search budgets and ultimately compromising the quality and completeness of the final output. We introduce SearchOS, a system-level multi-agent framework that turns fragile, implicit search progress into explicit, persistent, and shared state. First, we formulate open-domain information seeking as relational schema completion with grounded citations, where agents discover entities, populate attributes across linked tables, and anchor each value to source evidence. Then we design Search-Oriented Context Management (SOCM), which externalizes the evolving state into Frontier Task, an Evidence Graph, a Coverage Map, and Failure Memory. Built on SOCM, SearchOS applies a pipeline-parallel scheduling mechanism that overlaps the execution of sub-agents and continuously refills freed slots with tasks targeting unresolved coverage gaps to improve utilization and throughput. To schedule and control the execution of search agents, SearchOS introduces a Search Tool Middleware Harness that intercepts model and tool interactions to record grounded evidence and react to stalls or budget exhaustion, and provides a reusable hierarchical skill system comprising strategy and access skills to augment the agents' search process and avoid repeating failed search patterns across runs. On WideSearch and GISA, SearchOS leads all metrics among the evaluated single- and multi-agent baselines, paving the way toward robust information-seeking collaboration.", 'score': 58, 'issue_id': 2837, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'b1fd761244cc76a9', 'github_url': '', 'github_stars': 0, 'authors': ['Yuyao Zhang', 'Junjie Gao', 'Zhengxian Wu', 'Jiaming Fan', 'Jin Zhang', 'Shihan Ma', 'Yao Yao', 'Weiran Qi', 'Chuyan Jin', 'Guiyu Ma', 'Xingzhong Xu', 'Kai Yang', 'Ji-Rong Wen', 'Zhicheng Dou'], 'affiliations': ['Ant Group', 'Gaoling School of Artificial Intelligence, Renmin University of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.15257.jpg', 'data': {'categories': ['#memory', '#agent_memory', '#tool_use', '#retrieval', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Улучшение поиска информации с помощью SearchOS', 'desc': 'В этой статье представлена система SearchOS, которая улучшает взаимодействие многоагентных моделей для поиска информации в Интернете. Она решает проблему повторяющихся попыток поиска, превращая неявный прогресс в явное состояние, которое можно совместно использовать. Система использует управление контекстом, чтобы отслеживать задачи и сохранять результаты, а также включает в себя механизмы, минимизирующие затраты на повторяющиеся поисковые операции. В конечном итоге, SearchOS демонстрирует превосходство в эффективности и качестве результатов по сравнению с существующими системами.'}, 'en': {'title': 'Enhancing Information-Seeking with SearchOS', 'desc': "This paper presents SearchOS, a multi-agent framework designed to enhance the efficiency of information-seeking tasks by managing search progress more effectively. It addresses the issue of agents getting stuck in repetitive search loops by externalizing the search state into structured components like an Evidence Graph and Coverage Map. The framework employs a pipeline-parallel scheduling mechanism to optimize the execution of sub-agents and ensure continuous task engagement. By introducing a Search Tool Middleware Harness, SearchOS improves the agents' ability to record evidence and adapt to search challenges, leading to superior performance in information retrieval tasks."}}}, {'id': 'https://huggingface.co/papers/2607.15207', 'title': 'BadWAM: When World-Action Models Dream Right but Act Wrong', 'url': 'https://huggingface.co/papers/2607.15207', 'abstract': "Abstract  World-action models (WAMs) are emerging as a promising foundation for embodied control: rather than predicting actions alone, they learn representations that couple action generation with future world prediction. This coupling is often viewed as a source of robustness, interpretability, and safety, as a robot's action can in principle be checked against its imagined future. In this paper, we show that this assumption is fragile. We introduce BadWAM, a unified framework for modeling and evaluating World-Action Drift Attacks: a new class of WAM-specific adversarial attacks that use small visual perturbations to break the alignment between what a WAM imagines and what it executes. BadWAM characterizes this attack surface along two natural criteria: attack strength and stealthiness. When the adversary prioritizes disruption, BadWAM instantiates an action-only adversarial attack, which directly drives the model toward task-failing actions. When the adversary additionally prioritizes stealth, BadWAM instantiates an imagination-preserving adversarial attack, which seeks to induce harmful action shifts while keeping the model's predicted future close to its clean imagination. Together, these two attacks capture a spectrum of WAM-specific failures: from overt action hijacking to stealthier cases where the model appears to imagine a plausible future but executes a desynchronized action. We evaluate BadWAM across different variants of WAMs. Results show that our attacks substantially reduce task success rates under closed-loop execution. For example, our action-only attack reduces the model performance from 96.5% to 43.1% success. The results of our imagination-preserving attack further exposes a WAM-specific vulnerability: moderate future-preserving regularization can maintain strong attack performance while reducing future imagination drift.", 'score': 44, 'issue_id': 2837, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '794be9bd2a774397', 'github_url': '', 'github_stars': 0, 'authors': ['Qi Li', 'Xingyi Yang', 'Xinchao Wang'], 'affiliations': ['National University of Singapore', 'The Hong Kong Polytechnic University'], 'pdf_title_img': 'assets/pdf/title_img/2607.15207.jpg', 'data': {'categories': ['#security', '#alignment', '#robotics', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Уязвимость моделей мировых действий', 'desc': 'Модели мировых действий (WAM) становятся основой для управления роботами, связывая генерацию действий с предсказанием будущего. Однако данная связь может быть нарушена с помощью атак, которые мы назвали BadWAM. Эти атаки используют небольшие визуальные искажения, чтобы разорвать соответствие между предсказанием модели и ее действиями. Мы показываем, что такие атаки снижают эффективность управления, и исследуем их влияние на различные варианты WAM.'}, 'en': {'title': 'Unveiling Vulnerabilities in World-Action Models', 'desc': "This paper introduces World-Action Models (WAMs) that link action generation with future predictions, enhancing robustness and safety in robotic control. However, the authors reveal that this connection can be fragile, leading to vulnerabilities. They present BadWAM, a framework for understanding and evaluating World-Action Drift Attacks, which disrupt the alignment between a WAM's predictions and its actions through visual perturbations. The study demonstrates that these attacks can significantly decrease task success rates, highlighting the need for improved defenses against such adversarial threats."}}}, {'id': 'https://huggingface.co/papers/2607.14202', 'title': 'KeyFrame-Compass: Towards Comprehensive Evaluation of Keyframe-Conditioned Video Generation', 'url': 'https://huggingface.co/papers/2607.14202', 'abstract': 'Abstract  Video generation increasingly relies on keyframe-based workflows, where creators specify a sequence of reference images to guide generation. Although recent models support multi-keyframe conditioning, it remains unclear whether they can faithfully reproduce the prescribed keyframes while maintaining overall video quality. We present KeyFrame-Compass, the first comprehensive benchmark for evaluating keyframe-conditioned video generation. The benchmark contains 386 carefully curated samples spanning three application domains, two video structures, two prompt granularities, two conditioning formats, and four keyframe densities, enabling controlled analysis under diverse generation settings. We further introduce an automated evaluation framework that jointly measures keyframe execution and overall video quality. Specifically, we decompose keyframe execution into six complementary metrics covering presence, fidelity, temporal ordering, localization, persistence, and uniqueness, while assessing overall video quality through evidence-grounded MLLM judgments augmented with specialized perception models. Experiments on nine representative video generation systems reveal several fundamental limitations. Current models exhibit a clear trade-off between faithful keyframe execution and natural video synthesis. Their performance further degrades as keyframe constraints become denser and most open-source models also fail to interpret storyboard-grid inputs as temporally ordered keyframe sequences.', 'score': 35, 'issue_id': 2837, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '7bfbeb322dd33947', 'github_url': '', 'github_stars': 0, 'authors': ['Yuqi Tang', 'Tengfei Liu', 'Yizheng Lai', 'Yuran Wang', 'Yang Shi', 'Wanshun Su', 'Zhuoran Zhang', 'Qixun Wang', 'Xiaohan Zhang', 'Xinlei Yu', 'Xuehai Bai', 'Xuanyu Zhu', 'Bohan Zeng', 'Bozhou Li', 'Shujie Li', 'Yifan Dai', 'Yujie Wei', 'Shixuan Liu', 'Haotian Wang', 'Jialu Chen', 'Yuanxing Zhang'], 'affiliations': ['CUHK', 'FDU', 'HKU', 'HKUST(GZ)', 'Kling Team', 'NJU', 'NWPU', 'PKU', 'RUC', 'THU'], 'pdf_title_img': 'assets/pdf/title_img/2607.14202.jpg', 'data': {'categories': ['#survey', '#open_source', '#multimodal', '#games', '#benchmark'], 'emoji': '🎥', 'ru': {'title': 'Ключевые кадры для качественной генерации видео', 'desc': 'Статья представляет новый бенчмарк KeyFrame-Compass для оценки генерации видео на основе ключевых кадров. Этот бенчмарк включает 386 тщательно отобранных примеров из трех областей применения и предлагает контроль анализа в различных настройках генерации. Также в статье предложена автоматизированная оценочная рамка, которая измеряет выполнение ключевых кадров и общее качество видео. Проведенные эксперименты выявили основные ограничения современных моделей, которые не могут одновременно обеспечивать точное выполнение ключевых кадров и естественную синтезацию видео.'}, 'en': {'title': 'Navigating the Trade-offs in Keyframe-Conditioned Video Generation', 'desc': 'This paper introduces KeyFrame-Compass, a benchmark designed to evaluate video generation models that use keyframes for guidance. It assesses how well these models can reproduce specified keyframes while also maintaining high video quality. The benchmark includes a diverse set of samples and an automated evaluation framework that measures both keyframe execution and overall video quality through various metrics. The findings reveal significant trade-offs in current models, particularly as the density of keyframe constraints increases, leading to challenges in achieving both fidelity and natural synthesis.'}}}, {'id': 'https://huggingface.co/papers/2607.14189', 'title': 'MultiRef-Compass: Towards Comprehensive Evaluation of Multi-Reference-to-Audio-Video Generation', 'url': 'https://huggingface.co/papers/2607.14189', 'abstract': 'Abstract  Multi-reference-to-audio-video (MR2AV) generation aims to generate coherent audio-video content conditioned on multiple references and textual instructions. Existing benchmarks mainly focus on text-driven generation, single-reference subject preservation, or isolated audio-video alignment, leaving the emerging MR2AV setting largely unexplored. Compared with these settings, MR2AV requires models to jointly reason over multiple references while generating synchronized visual and audio content. Models must not only preserve each reference faithfully but also correctly bind and compose multiple referenced entities into coherent audio-visual events. To address this gap, we introduce MultiRef-Compass, a unified benchmark for MR2AV generation. It comprises 350 carefully curated samples constructed through a scalable and controllable asset-composition pipeline, covering multi-view subject preservation, multi-entity binding, and human-object-scene composition. To provide interpretable assessment, MultiRef-Compass defines an evaluation protocol with four dimensions: Basic Quality, Reference Consistency, Audio-Visual Consistency, and Instruction Following, using 14 sub-metrics. MultiRef-Compass integrates automatic metrics with a rejudging-enhanced MLLM-as-a-Judge framework, enabling scalable and auditable evaluation of both perceptual fidelity and reference-conditioned composition. Extensive experiments on eight representative MR2AV systems reveal substantial room for improvement across multiple evaluation dimensions, underscoring the need for a comprehensive benchmark and positioning MultiRef-Compass as a foundation for future MR2AV research.', 'score': 31, 'issue_id': 2837, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'f9fc647d33b68daf', 'github_url': '', 'github_stars': 0, 'authors': ['Xiaohan Zhang', 'Yuqing Wen', 'Junlin Chen', 'Yuqi Tang', 'Yiting He', 'Lizhuo Shao', 'Weiming Zhu', 'Tengfei Liu', 'Yang Shi', 'Jialu Chen', 'Yuanxing Zhang', 'Huaxiong Li'], 'affiliations': ['Hong Kong University of Science and Technology (Guangzhou)', 'Kling Team', 'Nanjing University', 'National University of Singapore', 'Peking University', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.14189.jpg', 'data': {'categories': ['#survey', '#reasoning', '#multimodal', '#benchmark', '#interpretability'], 'emoji': '🎥', 'ru': {'title': 'Новый эталон для генерации многоссылочного контента', 'desc': 'Генерация многоссылочного видеоаудио (MR2AV) направлена на создание согласованного контента с учетом нескольких источников и текстовых инструкций. Существующие эталоны в основном сосредоточены на текстовом управлении, сохранении одиночных ссылок или изолированной синхронизации аудио и видео, что оставляет MR2AV недостаточно исследованным. Для успешной генерации требуется, чтобы модели учитывали сразу несколько источников и создавали синхронизированные визуальные и аудиоэлементы. Мы представили MultiRef-Compass — единый эталон для MR2AV, который включает 350 тщательно подобранных образцов и определяет оценочные параметры для комплексной оценки качества.'}, 'en': {'title': 'Advancing Multi-Reference Audio-Video Generation', 'desc': 'This paper introduces MultiRef-Compass, a benchmark for Multi-reference-to-audio-video (MR2AV) generation, which focuses on creating synchronized audio and video content based on multiple references and textual instructions. Unlike previous benchmarks that primarily address single-reference scenarios, MR2AV requires models to effectively combine and represent multiple entities in a coherent manner. The benchmark includes 350 curated samples and evaluates models on four key dimensions: Basic Quality, Reference Consistency, Audio-Visual Consistency, and Instruction Following. The findings highlight significant areas for improvement in current MR2AV systems, establishing MultiRef-Compass as a crucial resource for advancing research in this field.'}}}, {'id': 'https://huggingface.co/papers/2607.14076', 'title': 'From Pixels to States: Rethinking Interactive World Models as Game Engines', 'url': 'https://huggingface.co/papers/2607.14076', 'abstract': 'Abstract  Building interactive worlds that respond coherently to player actions has long been a shared goal of computer graphics, games, and artificial intelligence. Recent video generative models provide a data-driven route toward this goal by predicting future observations conditioned on user actions, and are increasingly regarded as potential next-generation game engines. Realizing a genuinely interactive game world, however, requires interaction outcomes that follow rules over evolving game conditions, consequences that persist over long horizons, and a generation loop that operates in real time. Conventional game engines realize these properties through a recurrent action-state-observation loop, in which player actions update an explicit game state according to predefined rules and observations are rendered from the resulting state. Taking this loop as an organizing lens, this paper examines interactive game world modeling along four dimensions: player action control, game state dynamics, state-observation persistence, and real-time interactive generation. For each dimension, we start from the capabilities required by an interactive game world, group existing approaches into representative families, and discuss the strengths and trade-offs of each family. Complementing this analysis, we present a scalable data engine for Black Myth: Wukong that collects over 90 hours of gameplay with frame-aligned player actions, ground-truth game states, and visual observations, together with structured and semantic annotations, as a resource for state-aware game world modeling. We hope this paper offers a clear picture of where the field stands and fosters progress toward interactive game worlds.', 'score': 28, 'issue_id': 2837, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '547dde71a45f44f4', 'github_url': '', 'github_stars': 0, 'authors': ['Zhen Li', 'Zian Meng', 'Shuwei Shi', 'Mingliang Zhai', 'Jiaming Tan', 'Chuanhao Li', 'Kaipeng Zhang'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.14076.jpg', 'data': {'categories': ['#dataset', '#data', '#games', '#agents'], 'emoji': '🎮', 'ru': {'title': 'Создание интерактивных игровых миров', 'desc': 'В статье рассматривается создание интерактивных игровых миров, которые адекватно реагируют на действия игроков, что является целью компьютерной графики, игр и искусственного интеллекта (AI). Используя модели генерации видео, авторы предлагают способ создания динамичных игровых ситуаций, основываясь на действиях пользователей. Они анализируют четыре ключевых аспекта моделирования игровых миров: контроль действия игрока, динамика состояния игры, постоянство состояния и взаимодействие в реальном времени. Кроме того, авторы представляют масштабный датасет на основе игры Black Myth: Wukong, который может служить ресурсом для углубленного моделирования игровых миров с учетом состояния.'}, 'en': {'title': 'Building Real-Time Interactive Game Worlds', 'desc': 'This paper explores the creation of interactive game worlds that respond logically to player actions using video generative models. It highlights the importance of maintaining game rules, long-term consequences, and real-time interactions in game design. The authors analyze existing methods for modeling game worlds based on four key dimensions: player action control, game state dynamics, state-observation persistence, and real-time generation. Additionally, they introduce a data engine for Black Myth: Wukong, which collects extensive gameplay data to aid in developing state-aware game world models.'}}}, {'id': 'https://huggingface.co/papers/2607.12800', 'title': 'UniVR: Thinking in Visual Space for Unified Visual Reasoning', 'url': 'https://huggingface.co/papers/2607.12800', 'abstract': 'Abstract  Learning broad world knowledge directly from raw visual data is a fundamental capability of intelligence. We introduce UniVR, the first investigation into simultaneously learning complex reasoning, fine-grained physical dynamics, and long-term planning from pure visual demonstrations. At its core, UniVR features VR-GRPO, a reinforcement learning paradigm with complementary global and step-level rewards. This approach enforces logical coherence and physical consistency throughout the reasoning process without requiring task-specific heuristics or image-text pairs. To train and evaluate UniVR, we construct VR-X, a large-scale benchmark curated from 16 diverse sources spanning long-horizon manipulation, spatial puzzles, and physical reasoning. It is the first comprehensive suite to assess these heterogeneous capabilities under a purely visual protocol. Remarkably, UniVR achieves up to a 25% improvement on VR-X, and its superior visual reasoning also boosts performance on various multimodal understanding benchmarks. These findings underscore the vast potential of reasoning within visual spaces, with all code, data, and models are open-sourced for further research.', 'score': 28, 'issue_id': 2837, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '0563b75a6a643fed', 'github_url': '', 'github_stars': 0, 'authors': ['Zhongwei Ren', 'Yunchao Wei', 'Yao Zhao', 'Weibo Gong', 'Xiao Liu', 'Anran Wang', 'Xiangtai Li', 'Xiaojie Jin'], 'affiliations': ['Beijing Jiaotong University', 'ByteDance'], 'pdf_title_img': 'assets/pdf/title_img/2607.12800.jpg', 'data': {'categories': ['#open_source', '#reasoning', '#multimodal', '#games', '#benchmark', '#rl'], 'emoji': '🧠', 'ru': {'title': 'Новый уровень мышления с UniVR', 'desc': 'В статье представлено новое направление в обучении моделей, посвященное обучению сложному логическому мышлению и физической динамике на основе визуальных данных. UniVR использует метод обучения с подкреплением VR-GRPO, который объединяет глобальные и локальные награды. Это позволяет достигать логической согласованности и физической последовательности в процессе рассуждения без использования специфических эвристик и пар изображений с текстом. Исследование проверяется с помощью нового бенчмарка VR-X, который оценивает разнообразные навыки в визуальной среде.'}, 'en': {'title': 'Unlocking Visual Intelligence with UniVR', 'desc': 'The paper presents UniVR, a novel approach to learning complex reasoning and physical dynamics from visual data without relying on additional text or heuristics. It utilizes a reinforcement learning method called VR-GRPO, which combines global and step-level rewards to ensure logical and physical consistency in reasoning. The authors introduce a benchmark called VR-X, which evaluates long-term planning and manipulation tasks purely through visual inputs. UniVR demonstrates significant improvements in visual reasoning capabilities, highlighting the potential of visual-based learning in machine intelligence.'}}}, {'id': 'https://huggingface.co/papers/2607.13188', 'title': 'Concurrent Image Understanding and Generation: Self-Correcting Coupled Markov Jump Processes', 'url': 'https://huggingface.co/papers/2607.13188', 'abstract': "Abstract  Human cognition does not separate understanding and generation. A teacher at a whiteboard speaks and draws together, each modality reshapes the other. In this paper, we bring this coupled loop to artificial systems. Masked Diffusion Models (MDMs) are ideally suited to this task, yet existing samplers either decode text and image interleavedly or independently update them in parallel branches that share only previous-step history, but not the other modality's latest decisions within the same step; combined with MDMs' inability to remask, cross-modal contradictions are neither detected nor repaired. We introduce Self-Correcting Coupled Markov Jump Processes (SC-CMJP), a framework in which one modality's transition rates are functionals of the other modality's confidence score, as weighted by cross-modal attention. Furthermore, a remasking jump retracts commitments the moment cross-modal evidence turns against them. In conjunction with SC-CMJP, we introduce CO_2Jump (Self-text{CO}rrecting text{CO}upled text{Jump}), a novel training-free single-pass sampler for joint multimodal geneneration. For training and evaluation purposes, we have created and will release three large-scale joint multimodal generation corpora: JEdit-1M, JMaze-200K, JNono-200K, with matching in- and out-of-distribution benchmarks. CO_2Jump achieves best joint performance for image understanding and editing as well as visual reasoning (maze and nonogram solving). The performance of the sampler scales monotonically with the number of denoising steps, evidence that the benefits of cross-modal coupling compound across the trajectory. Project page: https://coupled-jump.github.io", 'score': 28, 'issue_id': 2837, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': 'd5c413b4755db5ec', 'github_url': '', 'github_stars': 0, 'authors': ['Minh-Quan Le', 'Armand Comas', 'Alexandros Lattas', 'Stylianos Moschoglou', 'Pedro Vélez', 'Amit Raj', 'Aaron Germuth', 'Thabo Beeler', 'Dimitris Samaras', 'Di Qiu'], 'affiliations': ['Google', 'Google DeepMind', 'Stony Brook University'], 'pdf_title_img': 'assets/pdf/title_img/2607.13188.jpg', 'data': {'categories': ['#diffusion', '#dataset', '#multimodal', '#games', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Объединение понимания и генерации в ИИ', 'desc': 'В статье рассматривается, как искусственные системы могут объединять понимание и генерацию, аналогично тому, как это делает человек. Предложена новая структура SC-CMJP, которая использует взаимное влияние между текстом и изображениями для улучшения результатов генерации. Разработан CO_2Jump — новый сэмплер, который не требует обучения и позволяет эффективно генерировать мультимодальные данные в одном проходе. Результаты показывают, что этот подход значительно улучшает качество понимания и редактирования изображений, а также решение задач визуального мышления.'}, 'en': {'title': 'Integrating Understanding and Generation in AI', 'desc': 'This paper presents a new approach to artificial intelligence that mimics human cognition by integrating understanding and generation across different modalities, like text and images. It introduces Self-Correcting Coupled Markov Jump Processes (SC-CMJP), which allows one modality to influence the other based on confidence scores, enhancing the interaction between them. The proposed CO_2Jump sampler enables efficient joint multimodal generation without the need for extensive training. The authors also provide large-scale datasets for evaluation, demonstrating that their method improves performance in tasks like image understanding and visual reasoning.'}}}, {'id': 'https://huggingface.co/papers/2607.14187', 'title': 'RxBrain: Embodied Cognition Foundation Model with Joint Language-Visual Reasoning and Imagination', 'url': 'https://huggingface.co/papers/2607.14187', 'abstract': 'Abstract  Embodied cognition requires agents to connect high-level task reasoning with the physical states to be achieved. We introduce Hy-Embodied-RxBrain, an embodied cognition foundation model with joint language-visual reasoning and imagination. Unlike vision-language models that emphasize scene understanding and textual decision making, or generative world models that mainly predict future visual states, RxBrain represents embodied plans in a single planning sequence where language and visual imagination play complementary roles. Language provides the abstract structure of a plan, including task decomposition, planning primitives, constraints, temporal order, and decision logic, while visual imagination grounds this structure through world state prediction and joint subgoal planning, associating each planning step with intermediate and final physical states. RxBrain adopts a unified multimodal Mixture-of-Transformers architecture that supports language, image, and video understanding and generation within one model. To train this capability, we build an automatic pipeline that converts embodied videos into joint text-visual planning supervision by decomposing videos into planning steps and aligning them with visual state transitions. We further introduce RxBrain-Bench to evaluate whether models can represent embodied plans through joint textual and visual components rather than separate understanding or generation. Experiments show that RxBrain maintains embodied understanding and generation abilities, and produces plans with coupled textual reasoning, world state prediction, and joint subgoal planning. We also extend RxBrain to continuous robot action generation, where it shows promising real-robot performance without large-scale action-data pretraining. These results provide an initial step toward foundation models for embodied cognition.', 'score': 22, 'issue_id': 2842, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'a147a80618797c53', 'github_url': '', 'github_stars': 0, 'authors': ['Haotian Liang', 'Mingkang Chen', 'Yufei Huang', 'Yuchun Guo', 'Xiaomeng Zhu', 'Xiangli Shi', 'Kaixuan Wang', 'Yunxuan Mao', 'Weijie Zhou', 'Ling Chen', 'Shirong Zeng', 'Yueyu Long', 'Yuchen Si', 'Yajuan Zhu', 'Xingyu Zhou', 'Minghui Wang', 'Wanjia He', 'Xin Yang', 'Lingzhu Xiang', 'Zhiqing Liu', 'Bohan Ma', 'Xiran Huang', 'Tianshuo Yang', 'Zhiheng Liu', 'Xuantang Xiong', 'Zisheng Lu', 'Ping Luo', 'Yao Mu', 'Han Hu', 'Zhengyou Zhang'], 'affiliations': ['Futian Laboratory', 'Hy Team', 'Tencent', 'Tencent Robotics Team'], 'pdf_title_img': 'assets/pdf/title_img/2607.14187.jpg', 'data': {'categories': ['#multimodal', '#agents', '#reasoning', '#games', '#architecture', '#robotics', '#benchmark'], 'emoji': '🤖', 'ru': {'title': 'Новый подход к воплощённому познанию с помощью модели RxBrain', 'desc': 'Статья представляет новый подход в области воплощённого познания с использованием модели Hy-Embodied-RxBrain, которая объединяет языковое и визуальное мышление. В отличие от традиционных моделей, которые фокусируются на понимании сцен или предсказании визуальных состояний, RxBrain предлагает интегрированный подход, где язык задаёт структуру плана, а визуальное воображение отвечает за предсказание состояний мира. Модель использует архитектуру Mixture-of-Transformers для работы с текстом, изображениями и видео в рамках одной системы. Результаты экспериментов показывают, что RxBrain может успешно генерировать планы, объединяя текстовое рассуждение, предсказание состояний и планирование подцелей.'}, 'en': {'title': 'Integrating Language and Vision for Embodied Cognition', 'desc': 'The paper presents Hy-Embodied-RxBrain, a foundation model designed for embodied cognition that integrates language and visual reasoning. This model uniquely combines high-level task planning with physical state predictions, allowing for a cohesive planning sequence. It utilizes a Mixture-of-Transformers architecture to process and generate language, images, and videos simultaneously. The training pipeline converts embodied videos into structured planning supervision, enabling RxBrain to effectively generate and understand embodied plans in real-world scenarios.'}}}, {'id': 'https://huggingface.co/papers/2607.03065', 'title': 'Spectral Rewiring for Exploration, Purification, and Model Merging', 'url': 'https://huggingface.co/papers/2607.03065', 'abstract': "Abstract  Reinforcement learning has become a standard post-training recipe for large language models, but dense full-parameter updates create two deployment-relevant bottlenecks: suppressed reasoning performance, often reflected by premature saturation of test-time scaling, and interference when consolidating multiple capabilities through multi-domain training or model merging. We show that the reasoning-effective component of these updates is largely concentrated in the base model's spectral space, motivating Subspace-Aligned Rewiring (SAR), a post-hoc editing method that retains this spectral core while removing orthogonal components. SAR therefore preserves reasoning gains and filters residual update directions that suppress performance or amplify cross-domain interference. Across several model families and scales, SAR extracts compact reasoning cores using as little as approximately 0.58% of total parameters: it preserves over 99% of post-training performance and improves high-k exploration in mathematical reasoning, and generalizes to agentic coding by improving six of seven open benchmarks on an in-house model. SAR also purifies mixed-domain training updates by releasing suppressed coding capability while maintaining math reasoning and instruction following. It further enables model merging across experts, yielding cross-domain generalization that surpasses previous merging baselines and even the best single-domain experts. Overall, SAR shows that extracting reasoning-effective updates from parameter geometry can serve as a training-free mechanism to improve reasoning and multi-domain performance.", 'score': 22, 'issue_id': 2838, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '3aa05339b22cafab', 'github_url': '', 'github_stars': 0, 'authors': ['Zhilong Zhang', 'Hongli Yu', 'Huan-ang Gao', 'Hanlin Wu', 'Yuxuan Song', 'Wei-Ying Ma', 'Ya-Qin Zhang', 'Hao Zhou'], 'affiliations': ['Institute for AI Industry Research (AIR), Tsinghua University', 'SIA-Lab of Tsinghua AIR and ByteDance Seed'], 'pdf_title_img': 'assets/pdf/title_img/2607.03065.jpg', 'data': {'categories': ['#rl', '#optimization', '#training', '#math', '#reasoning', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Эффективное рассуждение с помощью SAR в обучении моделей', 'desc': 'Статья рассматривает методы обучения с подкреплением для больших языковых моделей, выявляя проблемы, связанные с обновлением всех параметров модели. Авторы предлагают метод Subspace-Aligned Rewiring (SAR), который сохраняет эффективность рассуждений, удаляя ортогональные компоненты обновлений. Этот метод позволяет сохранить более 99% производительности после обучения и улучшает производительность в математических рассуждениях. SAR также улучшает многодоменное обучение, позволяя моделям объединяться и демонстрируя лучшие результаты по сравнению с ранее существующими моделями.'}, 'en': {'title': 'Enhancing Reasoning in Language Models with Subspace-Aligned Rewiring', 'desc': "This paper introduces Subspace-Aligned Rewiring (SAR), a method that enhances the reasoning capabilities of large language models after training. SAR focuses on retaining the essential spectral components of the model while eliminating less relevant parts that can hinder performance. By doing so, it preserves over 99% of the model's effectiveness and improves its ability to handle complex tasks like mathematical reasoning and coding. The approach also facilitates better integration of multiple skills and improves cross-domain generalization, making it a significant advancement in post-training model optimization."}}}, {'id': 'https://huggingface.co/papers/2607.15275', 'title': 'RoboTTT: Context Scaling for Robot Policies', 'url': 'https://huggingface.co/papers/2607.15275', 'abstract': 'Abstract  Recent robot foundation models operate with single-step or short-history visuomotor context. We introduce Test-Time-Training Robot Policies (RoboTTT), a robot model and training recipe that scale visuomotor context to 8K timesteps, three orders of magnitude beyond state-of-the-art policies, without growing inference latency. At this context length, we unlock new robot capabilities: one-shot in-context imitation from human video demonstrations, on-the-fly policy improvement, robustness to perturbations, and stronger performance on multi-stage, long-horizon tasks. We also observe, for the first time, steady gains in closed-loop performance as pretraining context length scales. At its core, RoboTTT integrates Test-Time Training into robot foundation models such as Vision-Language-Action policies, yielding a sequence model whose recurrent state consists of fast weights, parameters updated by gradient descent during both training and inference, compressing histories into weight space and retrieving contextual information for long-context conditioning. To scale training context length, the recipe combines sequence action forcing with truncated backpropagation through time. On challenging real-robot manipulation tasks, RoboTTT improves overall performance by 87% over the single-step context baseline and fully completes a five-minute, ten-stage assembly task, which no baseline ever does. RoboTTT trained with 8K-timestep context outperforms the same model pretrained with 1K timesteps by 62%, suggesting context length as a new scaling axis for robot foundation models. Videos are available at https://research.nvidia.com/labs/gear/robottt/', 'score': 18, 'issue_id': 2836, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '2467f8d5782eab8a', 'github_url': '', 'github_stars': 0, 'authors': ['Yunfan Jiang', 'Yevgen Chebotar', 'Ruijie Zheng', 'Fengyuan Hu', 'Yunhao Ge', 'Jimmy Wu', 'Tianyuan Dai', 'Scott Reed', 'Li Fei-Fei', 'Yuke Zhu', 'Linxi "Jim" Fan'], 'affiliations': ['NVIDIA', 'Stanford University', 'The University of Texas at Austin'], 'pdf_title_img': 'assets/pdf/title_img/2607.15275.jpg', 'data': {'categories': ['#robotics', '#optimization', '#long_context', '#training'], 'emoji': '🤖', 'ru': {'title': 'Роботы с новыми возможностями: учимся на длительном контексте', 'desc': 'В данной статье представлен новый подход к обучению роботов под названием Test-Time-Training Robot Policies (RoboTTT). Этот метод позволяет работать с контекстом видеомоторных действий длиной до 8000 временных шагов, что значительно превосходит предыдущие достижения в этой области. Благодаря этому роботы могут успешно имитировать действия человека с одного примера, улучшать свои стратегии и справляться с многослойными задачами. Также было обнаружено, что увеличение длины контекста в процессе предобучения приводит к постоянному улучшению производительности роботов.'}, 'en': {'title': 'Unlocking Robot Potential with 8K Timesteps', 'desc': 'This paper presents RoboTTT, a novel robot model that enhances visuomotor context to 8K timesteps, significantly surpassing existing models. By integrating Test-Time Training, RoboTTT allows for real-time policy improvements and better performance on complex tasks. The model demonstrates remarkable capabilities such as one-shot imitation from human videos and improved robustness to disturbances. Overall, RoboTTT achieves an 87% performance increase over traditional single-step contexts, highlighting the importance of context length in robot training.'}}}, {'id': 'https://huggingface.co/papers/2607.15038', 'title': 'Video = World + Event Stream', 'url': 'https://huggingface.co/papers/2607.15038', 'abstract': "Abstract  We present Wan-Streamer v0.3, which reframes our native-streaming interaction model under a single organizing view: a video is a world plus an event stream. The world is the persistent context in which a video unfolds, including the environment, scene, subjects, ambient acoustic conditions, voice characteristics, and other relatively stable conditions. The event stream is everything that changes over time within that world, including scene or environmental changes, subject behavior, speech, and other sounds. This yields a general-purpose pretraining task over large amounts of real video: given a world and incoming input, predict how the world moves, changes, and responds in real time. The resulting competence can be specialized to a broad family of real-time downstream tasks. We instantiate it on real-time full-duplex audio-visual interaction, where the event stream is the agent's speech together with free-form behavior. Functionally, the model's multimodal understanding process is vision-language-action-like: it maps multimodal user input to language-form speech and behavior actions. Wan-Streamer v0.3 preserves the v0.2 operating point: 640x368 video at 25 FPS, a 160 ms streaming unit, approximately 200 ms model-side response latency, and approximately 550 ms total interaction latency under a 350 ms bidirectional network budget.", 'score': 17, 'issue_id': 2836, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '7e06d03e3f766305', 'github_url': '', 'github_stars': 0, 'authors': ['Lianghua Huang', 'Zhi-Fan Wu', 'Yupeng Shi', 'Wei Wang', 'Mengyang Feng', 'Cheng Yu', 'Chen Liang', 'Junjie He', 'Chen-Wei Xie', 'Yu Liu', 'Jingren Zhou', 'Ang Wang', 'Bang Zhang', 'Baole Ai', 'Chongyang Zhong', 'Jinwei Qi', 'Kai Zhu', 'Pandeng Li', 'Peng Zhang', 'Wenyuan Zhang', 'Xinhua Cheng', 'Yitong Huang', 'Yun Zheng', 'Yuxiang Bao', 'Yuzheng Wang', 'Zhiwei Lin', 'Zoubin Bi'], 'affiliations': ['Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.15038.jpg', 'data': {'categories': ['#multimodal', '#audio'], 'emoji': '🎥', 'ru': {'title': 'Новый взгляд на взаимодействие через видео и события', 'desc': 'В статье представлен Wan-Streamer v0.3, который переосмысляет модель взаимодействия в режиме реального времени. Видео рассматривается как мир, полон постоянного контекста, и поток событий, который меняется со временем. Модель предсказывает, как мир движется и изменяется в ответ на входящие данные, что делает её подходящей для различных задач взаимодействия. Также описана реализация модели для двухстороннего аудио-визуального взаимодействия в реальном времени.'}, 'en': {'title': 'Revolutionizing Video Understanding with Wan-Streamer v0.3', 'desc': 'Wan-Streamer v0.3 introduces a new way to understand video by viewing it as a combination of a stable context (the world) and a dynamic sequence of events (the event stream). The world includes elements like the environment and subjects, while the event stream captures changes over time, such as actions and sounds. This model allows for predicting how the world evolves in real-time based on incoming data, making it versatile for various applications. It is particularly effective in real-time audio-visual interactions, where it translates multimodal inputs into speech and actions.'}}}, {'id': 'https://huggingface.co/papers/2607.13399', 'title': 'Demystifying On-Policy Distillation: Roles, Pathologies, and Regulations', 'url': 'https://huggingface.co/papers/2607.13399', 'abstract': 'Abstract  On-policy distillation (OPD) has become a key paradigm in LLM post-training, yet its training dynamics remain poorly understood. We present a systematic study examining the role, pathologies, and regulations of OPD. We first clarify the role of OPD as an exploration catalyst: it steers the student toward correct reasoning paths via dense token-level guidance, without expanding capability ceiling. We confirm this by showing that prompt diversity matters more than per-problem sampling numbers, and critically, that the effectiveness of OPD hinges entirely on the quality of its guiding signal. This dependency exposes two pathologies that derail exploration. The Student-Teacher Mismatch occurs when a large teacher-student distributional gap causes the guiding signal to misalign with task correctness, steering exploration in counterproductive directions. Length Exploitation arises when the aggregated token-level objective creates length-dependent shortcuts, allowing the student to game the reward landscape through response truncation or redundant padding, exploring degenerate length modes rather than reasoning strategies. To tame these pathologies, we investigate lightweight signal regulations: advantage clipping and log-scale compression, ensuring exploration is guided by faithful signals. Experiments across seven benchmarks demonstrate that these regulations alleviate length exploitation and enable effective distillation, stably surpassing OPD variants and RLVR baselines, thereby confirming that well-regulated signal quality, rather than mere teacher scale, governs successful exploration in OPD.', 'score': 17, 'issue_id': 2837, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': 'e5990238f3cf3a12', 'github_url': '', 'github_stars': 0, 'authors': ['Rui Wang', 'Hongru Wang', 'Yi Chen', 'Boyang Xue', 'Tianqing Fang', 'Wenhao Yu', 'Kam-Fai Wong'], 'affiliations': ['Tencent AI Lab', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.13399.jpg', 'data': {'categories': ['#benchmark', '#reasoning', '#training', '#optimization'], 'emoji': '🔍', 'ru': {'title': 'Управление качеством сигнала в он-политической дистилляции', 'desc': 'Статья рассматривает метод он-политической дистилляции (OPD) в процессе дообучения LLM. Исследуются роль OPD как катализатора для исследования и проблемы, с которыми она сталкивается. Подчеркивается важность качества сигнала, который направляет студента, и описываются две проблемы: несоответствие между студентом и учителем и эксплуатация длины ответа. Также предлагаются решения для улучшения качества сигнала, что позволяет добиться более эффективной дистилляции.'}, 'en': {'title': 'Enhancing Exploration in OPD through Signal Regulation', 'desc': "This paper investigates On-policy Distillation (OPD) in large language models (LLMs) and its training dynamics. It highlights OPD's role in guiding student models towards correct reasoning paths through effective token-level signals. The study identifies two main issues: the Student-Teacher Mismatch and Length Exploitation, which can hinder effective exploration. To address these problems, the authors propose lightweight signal regulations that improve the quality of guidance, leading to better performance in various benchmarks."}}}, {'id': 'https://huggingface.co/papers/2607.13491', 'title': 'DeepLoop: Depth Scaling for Looped Transformers', 'url': 'https://huggingface.co/papers/2607.13491', 'abstract': 'Abstract  Looped Transformers scale sequential computation by applying a compact stack of physical blocks for multiple rounds, increasing unrolled depth without increasing stored parameters. This reuse changes the residual-scaling problem: in an untied Transformer, each residual branch receives and applies its own parameter update, whereas in a looped Transformer one shared update aggregates gradients from repeated visits and is read back by those same visits in the next linearized forward pass. We formalize this tied-depth effect through a first-order perturbation bound controlled by a visit-alignment coefficient κ_R. The bound recovers the DeepNorm exponent when visits decorrelate, but in the conservative aligned regime it requires the exponent to increase from 1/4 to 1/2 as loop count grows at fixed physical depth. The resulting method, DeepLoop, keeps the Post-LN DeepNorm architecture and sets α=(2N)^{1/2} and β=(8N)^{-1/2} for unrolled depth N. On GPT-style looped language models at GPT-2 small and GPT-2 medium scale, DeepLoop is neutral when no physical block is revisited and improves validation loss and downstream accuracy once recurrent depth is activated. These results show that stable recurrent depth requires residual scaling rules that account for parameter visits, not only nominal layer count.', 'score': 13, 'issue_id': 2837, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '87a8d3433bdaed78', 'github_url': '', 'github_stars': 0, 'authors': ['Shuzhen Li', 'Yifan Zhang', 'Jiacheng Guo', 'Quanquan Gu', 'Mengdi Wang'], 'affiliations': ['Princeton University', 'University of California, Los Angeles'], 'pdf_title_img': 'assets/pdf/title_img/2607.13491.jpg', 'data': {'categories': ['#training', '#architecture', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Улучшение моделей с помощью зацикленных трансформеров', 'desc': 'В данной работе представлена новая архитектура моделей машинного обучения под названием DeepLoop, которая использует зацикленные трансформеры для улучшения последовательных вычислений. Она позволяет увеличить глубину развертки без необходимости увеличения количества хранимых параметров. Это достигается за счет совместного обновления параметров в рамках повторных обращений к одноименным блокам, что помогает решить проблему масштабирования остаточных связей. Эксперименты показывают, что этот подход улучшает точность и снижает потерю валидации при использовании повторяющихся глубин.'}, 'en': {'title': 'Enhancing Transformers with DeepLoop for Better Performance', 'desc': 'This paper introduces DeepLoop, a method that enhances Transformers by allowing them to reuse computation across multiple rounds without increasing the number of parameters. It addresses the residual-scaling issue by using a shared parameter update for all visits in a looped Transformer, which aggregates gradients more effectively. The authors formalize the impact of this approach through a visit-alignment coefficient, showing how it influences the scaling of residuals. The results demonstrate that DeepLoop improves performance in language models by stabilizing recurrent depth and optimizing residual scaling rules.'}}}, {'id': 'https://huggingface.co/papers/2607.14749', 'title': 'WanSong v1.0 Technical Report', 'url': 'https://huggingface.co/papers/2607.14749', 'abstract': 'Abstract  Music generation foundation models have recently attracted significant industry attention. However, achieving efficient generation and high-fidelity long-form audio while supporting controllability remains challenging. To address these needs, we present WanSong, a simple yet powerful approach for long-form, commercial-grade song generation. Unlike autoregressive (AR) and cascaded multi-stage pipelines (\\eg, AR followed by diffusion), WanSong is a pure diffusion-based model that directly generates high-fidelity, multilingual songs up to 5 minutes and outputs dual stems (vocals and background music) in a single run. In addition, our diffusion framework enables faster inference through step-distillation, and offers an efficient pathway for fine-tuning and customization to support downstream editing tasks.', 'score': 12, 'issue_id': 2837, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'c979599c35ccc9d1', 'github_url': '', 'github_stars': 0, 'authors': ['Binghui Chen', 'Pandeng Li', 'Yu Liu', 'Jingren Zhou'], 'affiliations': ['Wan Team, Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.14749.jpg', 'data': {'categories': ['#audio', '#diffusion', '#multilingual', '#training', '#inference'], 'emoji': '🎶', 'ru': {'title': 'Новая эра генерации музыки с WanSong', 'desc': 'В данной статье представлен новый подход к генерации музыки под названием WanSong. Этот модельный метод основан на диффузии и способен создавать высококачественные многоголосые песни длительностью до 5 минут за один запуск. WanSong предлагает эффективную реализацию с использованием дистилляции шагов, что ускоряет процесс вывода. Кроме того, данная модель позволяет легко настраивать и кастомизировать результаты для последующего редактирования.'}, 'en': {'title': 'Revolutionizing Music Generation with WanSong', 'desc': 'This paper introduces WanSong, a novel approach for generating long-form music using a diffusion-based model. Unlike traditional methods that rely on autoregressive techniques, WanSong can create high-quality, multilingual songs up to 5 minutes long in a single pass. It produces dual stems, separating vocals and background music efficiently. Additionally, the model supports faster inference and allows for easy fine-tuning and customization for various editing tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.15273', 'title': 'MeanFlowNFT: Bringing Forward-Process RL to Average-Velocity Generators', 'url': 'https://huggingface.co/papers/2607.15273', 'abstract': "Abstract  MeanFlow generators achieve fast few-step sampling by predicting average velocities over time intervals, making them attractive for efficient generation. Reinforcement learning (RL) has become a powerful way to align diffusion and flow models with human preferences and task-specific objectives. In particular, DiffusionNFT offers an efficient forward-process RL framework that does not require reverse-process trajectories or likelihood estimation. However, applying such RL methods to MeanFlow remains underexplored. DiffusionNFT optimizes instantaneous velocities, whereas MeanFlow samples with average velocities. To bridge this gap, we introduce MeanFlowNFT. Inspired by the MeanFlow identity, which bridges average and instantaneous velocities, we construct an induced instantaneous-velocity predictor. We apply the DiffusionNFT objective to this predictor, making reward optimization well-defined for MeanFlow. Sampling remains based on the average velocity, preserving MeanFlow's fast few-step generation. We further prove that MeanFlowNFT inherits DiffusionNFT's strict policy-improvement guarantee. Experiments on image and video generation show that MeanFlowNFT consistently improves baselines. Moreover, it outperforms prior state-of-the-art RL-tuned few-step generators on most metrics (6 of 8 on SD3.5-M), and can even surpass multi-step RL-tuned diffusion while using only a few sampling steps. For instance, on Wan 2.1, 4-step MeanFlowNFT reaches a VBench score of 84.33, surpassing 50-step LongCat-Video RL (82.57).", 'score': 12, 'issue_id': 2837, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'fc68023a76c0c1c3', 'github_url': '', 'github_stars': 0, 'authors': ['Yushi Huang', 'Xiangxin Zhou', 'Jun Zhang', 'Liefeng Bo', 'Tianyu Pang'], 'affiliations': ['Tencent Hunyuan', 'The Hong Kong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.15273.jpg', 'data': {'categories': ['#agi', '#diffusion', '#rlhf', '#training', '#optimization', '#rl'], 'emoji': '🎨', 'ru': {'title': 'Эффективная генерация с помощью MeanFlowNFT', 'desc': 'В статье рассматривается метод генерации изображений и видео под названием MeanFlowNFT. Он использует стратегию обучения с подкреплением для оптимизации мгновенных скоростей, что позволяет улучшить производительность генераторов, основанных на среднем значении скоростей. Этот метод сохраняет быстроту генерации, использующую всего несколько шагов, и показывает лучшие результаты по сравнению с предыдущими методами. Эксперименты показывают, что MeanFlowNFT превосходит существующие генераторы на большинстве метрик.'}, 'en': {'title': 'Bridging Average and Instantaneous Velocities for Efficient Sampling', 'desc': 'This paper introduces MeanFlowNFT, a novel approach that combines MeanFlow generators with reinforcement learning (RL) to enhance few-step sampling efficiency. By leveraging the MeanFlow identity, it creates an instantaneous-velocity predictor that aligns with the DiffusionNFT framework, allowing for effective reward optimization. The method maintains the fast generation capabilities of MeanFlow while improving performance metrics over existing state-of-the-art models. Experiments demonstrate that MeanFlowNFT outperforms traditional RL-tuned generators, achieving superior results with fewer sampling steps.'}}}, {'id': 'https://huggingface.co/papers/2607.14431', 'title': 'Smarter and Cheaper at Once: Byte-Exact KV-Cache Grafting Turns a Frozen Small Model into a Verified-Knowledge Flywheel', 'url': 'https://huggingface.co/papers/2607.14431', 'abstract': "Abstract  We report a way to make a frozen small language model both more capable and dramatically cheaper at once, without changing any weights. Verified knowledge is deposited once as a byte-exact key-value (KV) state artifact and later restored, by graft, into a fresh inference context. The restore is bit-exact: under a pinned deterministic configuration, the grafted logits are byte-for-byte identical to a fresh computation (SHA-256 equality), with zero KL divergence and 100% argmax agreement over fifty samples. We show that own-position graft is the unique numerically exact operating point on a model with floating-point rotary encoding, and we verify byte-exactness on two model scales (12B, 31B) and two GPU targets, one through a pre-registered replay. On AIME 2025, a frozen Gemma-4-12B moves from 80.0% to 93.3% once a verified solution library is grafted, above its own 77.5% and its 31B sibling's 89.2% published anchors. On the recurring case, eight problems the base model never solves within a 401,026-token budget are answered from cached verified solutions in 61 total decode tokens, a factor of 6,574 fewer tokens and about 8,700x less energy; the capability claim proper rests on held-out transfer (7 of 7 at 31B). The same byte-exact store widens usable context from 32,768 to 2,854,766 tokens at zero extra accelerator memory, and moves byte-identical between machines of the same architecture. We describe the system at the behavior level; the engine is proprietary, and every reported number is backed by committed input and output hashes so the scoring can be re-checked without it.", 'score': 10, 'issue_id': 2836, 'pub_date': '2026-07-15', 'pub_date_card': {'ru': '15 июля', 'en': 'July 15', 'zh': '7月15日'}, 'hash': '5a5c116838ac1b86', 'github_url': '', 'github_stars': 0, 'authors': ['Sietse Schelpe'], 'affiliations': ['Corbenic AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.14431.jpg', 'data': {'categories': ['#small_models', '#compression', '#inference', '#optimization', '#memory', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Повышение возможностей языковой модели без изменений весов', 'desc': 'В этой статье описывается метод повышения возможностей малой языковой модели, одновременно снижая ее стоимость, без изменения весов. Знания закрепляются в виде точных артефактов состояния (KV) и восстанавливаются в новом контексте вывода. Восстановление является точным, где логиты идентичны свежему вычислению, подтвержденные на разных моделях и графических процессорах. Система позволяет значительно увеличивать контекст использования и требует при этом нулевой дополнительной памяти для ускорителей.'}, 'en': {'title': 'Boosting Language Model Efficiency with Byte-Exact Knowledge Grafting', 'desc': "This paper presents a method to enhance the performance of a frozen small language model while significantly reducing costs, without altering its weights. The approach involves storing verified knowledge as a byte-exact key-value state, which can be restored into a new inference context. The restoration process ensures that the outputs are identical to those produced by a fresh computation, achieving high accuracy and efficiency. The results demonstrate that this method can dramatically increase the model's capability and extend its usable context without additional memory requirements."}}}, {'id': 'https://huggingface.co/papers/2607.14660', 'title': 'VIABench: A Comprehensive Video Benchmark Collected from Blind Individuals for Visual Impairment Assistance', 'url': 'https://huggingface.co/papers/2607.14660', 'abstract': "Abstract  Visually impaired individuals (VIIs) encounter significant daily challenges due to limited access to visual information. Although Multimodal Large Language Models (MLLMs) have achieved impressive results on general vision and language tasks, their practical utility in real-world blind assistance still remains largely underexplored. To fill this gap, we introduce VIABench, a comprehensive video benchmark specifically designed to evaluate MLLMs in Visually Impaired Assistance scenarios using first-person videos recorded or shared by VIIs themselves. VIABench defines three core tasks, each targeting a distinct requirement in visual assistance. Proactive Reminder: Assesses the model's ability to interpret ongoing video content while proactively anticipating and verbally describing upcoming navigation-critical events; Visual Question Answering (VQA): Evaluates the model's capacity to answer user-posed questions about the environment or objects within the video; Vision-Guided Interaction: Tests context-aware reasoning to accomplish intentional interactions between user and environment. To ensure a robust and fair evaluation, we propose a rigorous benchmarking pipeline that supports both online (real-time) and offline settings. Our experiments demonstrate that current MLLMs still struggle to deliver comprehensive support for VIIs, especially in the Proactive Reminder task, which demands accurate anticipation and real-time responsiveness. We hope VIABench will drive future research toward developing customized MLLMs for real-world assistance, ultimately improving navigation and interaction experiences for visually impaired individuals. Code and data will be released at https://github.com/MCG-NJU/VIABench.", 'score': 8, 'issue_id': 2838, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': '9c671fc9c83d752c', 'github_url': '', 'github_stars': 0, 'authors': ['Yunfeng Liu', 'Yuandong Yang', 'Jiarui Han', 'Zhenpeng Huang', 'Yuqing Tang', 'Xiangyu Zeng', 'Gangshan Wu', 'Limin Wang'], 'affiliations': ['Nanjing University', 'Shanghai AI Laboratory'], 'pdf_title_img': 'assets/pdf/title_img/2607.14660.jpg', 'data': {'categories': ['#benchmark', '#healthcare', '#multimodal', '#dataset', '#ethics', '#games', '#reasoning'], 'emoji': '👁️\u200d🗨️', 'ru': {'title': 'Помощь людям с нарушениями зрения с помощью MLLM', 'desc': 'В данной статье представлено исследование, посвященное помощи людям с нарушениями зрения с помощью мультимодальных больших языковых моделей (MLLM). Авторы вводят новый инструмент под названием VIABench, который оценивает эффективность MLLM в реальных сценариях помощи людям с нарушениями зрения, используя видео, снятые самими пользователями. VIABench определяет три ключевых задачи, которые необходимы для визуальной помощи:
