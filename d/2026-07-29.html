    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.24368', 'title': 'Keep It InMind: Benchmarking the Implicit-Association Blind Spot in Agent Memory', 'url': 'https://huggingface.co/papers/2607.24368', 'abstract': 'Abstract  Long-term memory systems store what a user says in an external store and retrieve it when a related query arrives. This interface rests on an assumption so natural that it is rarely stated: a memory that is needed will resemble the query that needs it. World knowledge breaks the assumption. A tree-nut allergy should change the answer to a macaron request through their almond-flour ingredient, yet the two texts share no cue a retriever can see. We call this failure mode the implicit-association blind spot and introduce InMind, a 125-task, expert-verified benchmark spanning ten life domains, with 113 tasks grounded in citable public sources. Its paired controls separate three explanations that existing evaluations conflate: the fact was never stored, the model lacks the bridging knowledge, or the fact was stored and never surfaced. The verdict is clean. With the decisive memory placed in context, the backbone answers 84.0 percent of indirect queries; when the same memory must be retrieved, six vector, graph, and agentic memory systems reach at most 14.4 percent, even though they recall the same facts on demand at up to 100 percent. An embedding with eight times the dimensionality raises answer-blind target recall for every system yet leaves the gap essentially intact. A minimal diagnostic probe that keeps memory visible before the query arrives recovers most of the gap, locating the failure in the query-conditioned interface itself and pointing to routing, deciding which facts must stay visible, as the open problem InMind is built to score.', 'score': 8, 'issue_id': 2928, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': 'b67c5b812a3cfde2', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#retrieval', '#benchmark', '#memory', '#retrieval_eval', '#agent_memory'], 'emoji': '🧠', 'ru': {'title': 'Проблемы памяти: как улучшить извлечение информации?', 'desc': 'Статья обсуждает системы долгосрочной памяти, которые хранят информацию и извлекают её при поступлении запроса. Проблема заключается в том, что знания о мире могут нарушать предположение, что память будет создавать запрос. Авторы вводят InMind, новый набор задач для проверки систем памяти, который позволяет различать причины ошибок в извлечении информации. Исследование показывает, что использование специальной диагностики может значительно улучшить точность ответа на косвенные запросы.'}, 'en': {'title': 'Bridging the Gap: Enhancing Memory Retrieval in Machine Learning', 'desc': "This paper discusses the limitations of long-term memory systems in machine learning, particularly when retrieving information related to user queries. It introduces the concept of the 'implicit-association blind spot,' where relevant knowledge may not be retrieved due to a lack of visible cues. The authors present InMind, a benchmark designed to evaluate memory retrieval across various tasks and identify the reasons for retrieval failures. The findings reveal that while models can recall facts accurately, they struggle with indirect queries unless memory is kept visible before the query is made."}}}, {'id': 'https://huggingface.co/papers/2607.25895', 'title': 'HiFi-UMI: Learning Deployable Manipulation Policies from High-Fidelity UMI Data Alone', 'url': 'https://huggingface.co/papers/2607.25895', 'abstract': 'Abstract  Learning deployable manipulation policies is bottlenecked by the scarcity of data that is both high-fidelity and scalable. Real-robot teleoperation is accurate but costly to scale; robot-free UMI capture scales readily, and current practice uses the resulting data mainly for pre-training, adding a small real-robot "anchor" at post-training. We ask whether raising the fidelity of robot-free UMI data, rather than shrinking the real-robot fraction, can remove that anchor. We present HiFi-UMI, a portable UMI data-production system co-designed for trajectory accuracy, inter-gripper relative pose, synchronization, and field of view: head-mounted offline stereo-inertial SLAM, native rather than reconstructed relative pose, a shared microsecond GPIO trigger, and two wide-angle cameras per hand covering ~200 degrees. It reaches 3 mm workspace-local end-effector accuracy without external tracking infrastructure. Using this corpus, we demonstrate zero-robot post-training: a policy post-trained solely on HiFi-UMI demonstrations deploys directly on a real robot and matches in-domain teleoperation across three backbones spanning the vision-language-action and world-action-model families, with success-rate differences of -2.5, +3.1, and -0.6 percentage points on StarVLA-QwenPI, OpenPI-pi_0.5, and LingBot-VA; the strongest policy reaches 85% on a precision insertion task, even though the teleoperation baseline is collected in the evaluation scene and no HiFi-UMI trajectory is. Pre-training on 4,000 hours from the same corpus lowers action error on ten unseen tasks by 41% and, on StarVLA-QwenPI, raises real-robot success by a further 18.1 percentage points. We open-source HiFi-UMI-2K, 2,000 hours of microsecond-synchronized, ultra-wide-FoV demonstrations, each automatically reconstructed and validated through simulation replay, as a large-scale, high-fidelity resource for the robot-learning community.', 'score': 3, 'issue_id': 2928, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'db4748a1646ae9fb', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#dataset', '#data', '#robotics', '#transfer_learning', '#open_source'], 'emoji': '🤖', 'ru': {'title': 'Высококачественные данные для обучения роботов без реальных манипуляций', 'desc': 'В данной статье представлена система HiFi-UMI, которая решает проблему нехватки качественных данных для обучения роботов. Она обеспечивает высокую точность при сборе данных без использования реального робота, что значительно упрощает процесс масштабирования. Исследователи показывают, что обучение на данных HiFi-UMI позволяет достигать результатов, сопоставимых с телеприсутствием, без необходимости в реальном роботе. Кроме того, они открывают доступ к 2000 часам высококачественных демонстраций, что станет важным ресурсом для сообщества роботостроителей.'}, 'en': {'title': 'High-Fidelity Data for Direct Robot Deployment', 'desc': 'This paper addresses the challenge of creating effective manipulation policies for robots by improving the quality of robot-free data collection. The authors introduce HiFi-UMI, a system designed to produce high-fidelity data that captures accurate trajectories and poses without the need for real-robot involvement. By using this data, they demonstrate that a policy can be trained and deployed directly on a real robot, achieving performance comparable to traditional teleoperation methods. The study also highlights the benefits of pre-training on a large dataset, significantly reducing action errors in unseen tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.25537', 'title': 'Visual prompt engineering for video models', 'url': 'https://huggingface.co/papers/2607.25537', 'abstract': 'Abstract  In the age of foundation models, a model is only as good as its prompt. For this reason, prompt engineering has become an essential technique for improving language model performance. Since video models are currently becoming foundation models for visual tasks (e.g., visual reasoning), we here ask whether they similarly benefit from visual prompt engineering: automatically modifying the task image to improve model performance. For example, for a visual physics reasoning task ("Where does the ball land, after passing a set of obstacles?"), an abstract sketch-like scene can be turned into a photorealistic version with a simple call to an image editing model. We find that visual prompt engineering, or VIPE for short, improves video reasoning performance across tasks. In fact, for video models, visual prompt engineering can be even more effective than classic text-based prompt engineering or test-time scaling. Ultimately, just as text-based prompt engineering systematically improves language model performance, visual prompt engineering can serve as a simple, compute-efficient approach to elicit better visual reasoning performance from video models. Example videos on our project page at https://visual-prompt-engineering.github.io/.', 'score': 1, 'issue_id': 2928, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '268275b91f8d21e5', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#prompting', '#multimodal', '#games'], 'emoji': '🎥', 'ru': {'title': 'Улучшение видеомоделей с помощью визуальной инженерии запросов', 'desc': 'В эпоху фундаментальных моделей важно правильно формулировать запросы. Статья обсуждает, как визуальная инженерия запросов может улучшить производительность видеомоделей в задачах визуального мышления. Например, изменение абстрактных сцен на фотореалистичные может значительно повысить качество ответов модели. Визуальная инженерия запросов может оказаться более эффективной, чем традиционные текстовые методы.'}, 'en': {'title': 'Enhancing Video Models with Visual Prompt Engineering', 'desc': 'This paper explores the concept of visual prompt engineering (VIPE) for enhancing the performance of video models in visual reasoning tasks. It demonstrates that modifying task images, such as converting abstract sketches to photorealistic images, can significantly improve model outcomes. The authors find that VIPE can be more effective than traditional text-based prompt engineering methods. Ultimately, this approach offers a simple and efficient way to boost visual reasoning capabilities in video models.'}}}, {'id': 'https://huggingface.co/papers/2607.26037', 'title': 'Wonder: Video World Model Done Better', 'url': 'https://huggingface.co/papers/2607.26037', 'abstract': "Abstract  We present Wonder, a general-purpose video world model for real-time, camera-controllable world exploration. Given an image or a conditional video, Wonder constructs a playable world where users can navigate interactively by moving the camera, discovering unseen regions, and revisiting previously observed areas in real time and over a long-term horizon. Achieving this capability requires a system-level co-design of control method, memory mechanism, and training strategy. We introduce a novel camera conditioning with a dense coordinate field whose renderings provide spatially aligned motion and orientation cues, allowing the model to interpret camera motion directly as visual evidence. To support fast and precise memory retrieval over a growing generation context, we propose an efficient sparse attention-based memory mechanism, enabling the model to selectively attend to a small set of relevant context tokens at inference time, regardless of actual context length. We further develop several techniques to rectify the self-forcing-style distillation pipeline, improving the student model's ability to respect control signals, as well as maintaining diverse generation modes and long-term memory from the teacher. Together, these components enable Wonder to synthesize diverse, minute-scale videos at 16 FPS while preserving coherent geometry, appearance, and dynamics across long rollouts. Beyond image-to-video generation, Wonder naturally supports video-conditioned generation, allowing existing dynamic scenes to be re-shot in real time.", 'score': 1, 'issue_id': 2928, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '14c1f31bf54cb390', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#training', '#long_context', '#optimization', '#agents', '#diffusion', '#memory'], 'emoji': '🌍', 'ru': {'title': 'Исследуй мир с Wonder в реальном времени', 'desc': 'В статье представлен Wonder, универсальная модель мира для видеопроекций, которая позволяет пользователям исследовать виртуальные миры в реальном времени и управлять ими с помощью камеры. Эта система объединяет методы управления, механизмы памяти и стратегии обучения для создания интерактивного игрового опыта. Используя плотное поле координат, модель может интерпретировать движения камеры как визуальные данные, что улучшает качество генерации видео. Wonder может синтезировать разнообразные видео с частотой 16 кадров в секунду, сохраняя последовательность геометрии и динамики на протяжении времени.'}, 'en': {'title': 'Explore Your World in Real Time with Wonder', 'desc': "Wonder is a versatile video world model that allows users to explore and interact with generated environments in real time. It uses a unique camera conditioning method that aligns motion and orientation cues, enabling the model to understand camera movements as visual input. The system incorporates a sparse attention-based memory mechanism for efficient retrieval of relevant context, ensuring quick responses during navigation. Additionally, it enhances the training process to improve the model's adherence to control signals while maintaining diverse video generation capabilities."}}}, {'id': 'https://huggingface.co/papers/2607.25669', 'title': 'OmniDelta: Skill-Driven Budget Allocation for Token Compression in OmniLLMs', 'url': 'https://huggingface.co/papers/2607.25669', 'abstract': 'Abstract  Emerging Omni-modal Large Language Models (OmniLLMs) enable unified understanding of text, audio, and video, but their long audio-video token sequences introduce substantial memory and inference costs. Existing compression methods mainly focus on selecting important tokens under fixed budgets, leaving the preceding budget-allocation problem underexplored. We show that direct query-to-audio/video similarity is unreliable for inter-modal budget allocation, and that uniform intra-modal budgets can miss key evidence while retaining redundant content. To address these limitations, we propose OmniDelta, a training-free, skill-driven framework that couples intent-aware inter-modal allocation with content-aware intra-modal allocation. OmniDelta first constructs audio and video skill pools to shift the fixed retained-token budget according to query demand, then reallocates modality budgets over audio segments and video frames using local complexity and temporal redundancy. The resulting local budgets can be combined with existing pruning strategies, preserving the total retained-token ratio while changing where the budget is spent. Experiments on four audio-video benchmarks with two Qwen2.5-Omni models show that OmniDelta establishes a new accuracy-efficiency Pareto frontier across pruning ratios. At 25% token retention on Qwen2.5-Omni-7B, OmniDelta reduces GPU memory by 22.0% and achieves a 1.64x end-to-end speedup over full-token inference.', 'score': 0, 'issue_id': 2928, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '69cead419fb6e904', 'github_url': '', 'github_stars': 0, 'authors': ['Haoyang Huang', 'Wenjie Huang', 'Tianqi Xu', 'Hongyaoxing Gu', 'Kang Tan', 'Yikai Fu', 'Yuhao Shen', 'Tianyu Liu', 'Baolin Zhang', 'Jun Zhang', 'Xinyi Hu', 'Jun Dai', 'Shuang Ge', 'Lei Chen', 'Yue Li', 'Mingchen Wang', 'Meng Zhang'], 'affiliations': ['Carnegie Mellon University', 'Qwen Application, Alibaba', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25669.jpg', 'data': {'categories': ['#multimodal', '#long_context', '#inference', '#optimization', '#benchmark', '#compression'], 'emoji': '🎥', 'ru': {'title': 'Оптимизация распределения токенов для OmniLLM', 'desc': 'Статья описывает новую модель для оптимизации распределения бюджета токенов в OmniLLM, которая работает с текстом, аудио и видео. Представленный подход называется OmniDelta и позволяет более эффективно распределять ресурсы между различными модальностями, используя информацию о запросах. Вместо того чтобы просто отбирать важные токены, OmniDelta перераспределяет бюджет токенов на основе сложности и временной избыточности контента. Исследования показывают, что этот метод значительно снижает затраты на память и ускоряет обработку по сравнению с традиционными методами.'}, 'en': {'title': 'Optimizing Resource Allocation in Omni-modal Models', 'desc': 'This paper introduces OmniDelta, a novel framework for optimizing the allocation of resources in Omni-modal Large Language Models (OmniLLMs) that process text, audio, and video. It addresses the challenges of memory and inference costs caused by long audio-video token sequences by reallocating budgets based on query demands. OmniDelta enhances inter-modal and intra-modal budget allocation, ensuring that important content is prioritized while reducing redundancy. Experimental results demonstrate that OmniDelta achieves significant improvements in accuracy and efficiency, reducing memory usage and increasing processing speed.'}}}, {'id': 'https://huggingface.co/papers/2607.25857', 'title': 'Shieldstral', 'url': 'https://huggingface.co/papers/2607.25857', 'abstract': 'Abstract  We introduce Shieldstral, a 3B-parameter policy-adaptive multimodal safety classifier that matches or outperforms models nearly 7times its size on text safety benchmarks and sets a new state of the art on multimodal safety classification. Shieldstral formulates content moderation as a binary question-answering task. This simple formulation unifies diverse moderation tasks into a single yes/no problem, enabling heterogeneous safety datasets with divergent taxonomies to be consolidated under one training framework. We present the data construction recipe, covering curation and generation of approximately 54.1M samples and a fine-grained evaluation set to evaluate policy adaptability. Together, these enable a small adaptive model to match or outperform much larger models.', 'score': 0, 'issue_id': 2928, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '9c2876252b023daa', 'github_url': '', 'github_stars': 0, 'authors': ['Antonia Calvi', 'Avinash Sooriyarachchi', 'Giada Pistilli', 'Guillaume Lample', 'Maarten Buyl', 'Maximilian Augustin', 'Maximilian Müller', 'Pierre Stock', 'Tom Bewley', 'Wassim Bouaziz', 'Yimu Pan'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.25857.jpg', 'data': {'categories': ['#training', '#multimodal', '#dataset', '#data', '#benchmark', '#ethics'], 'emoji': '🛡️', 'ru': {'title': 'Новая эра безопасности контента с Shieldstral', 'desc': "В статье представлен Shieldstral, классификатор безопасности с 3 миллиардами параметров, который адаптируется к политике и демонстрирует превосходство над моделями в 7 раз большими на тестах безопасности текста. Shieldstral рассматривает модерацию контента как задачу бинарного вопросов-ответов, что позволяет объединить различные задачи модерации в единую задачу с ответами 'да/нет'. Это упрощенное представление позволяет консолидировать разнородные наборы данных безопасности в рамках одной обучающей структуры. Предложенный рецепт построения данных охватывает подготовку и генерацию примерно 54,1 миллиона образцов для оценки адаптивности политики."}, 'en': {'title': "Small Model, Big Safety: Shieldstral's Breakthrough in Multimodal Classification", 'desc': "Shieldstral is a multimodal safety classifier with 3 billion parameters that excels in text safety benchmarks, outperforming larger models. It simplifies content moderation by treating it as a binary question-answering task, which allows for the integration of various moderation tasks into one framework. This approach enables the use of diverse safety datasets with different categories for training. The model's design, including the creation of 54.1 million samples and a detailed evaluation set, allows it to adapt effectively and achieve high performance."}}}, {'id': 'https://huggingface.co/papers/2607.24957', 'title': 'PerceptionBench: Evaluating Atomic Visual Perception in Multimodal Large Language Models', 'url': 'https://huggingface.co/papers/2607.24957', 'abstract': 'Abstract  We introduce PerceptionBench, a benchmark specifically designed to evaluate the atomic visual perception capabilities of Multimodal Large Language Models (MLLMs). Existing benchmarks often fail to isolate perception: holistic evaluations conflate perceptual errors with failures in reasoning or domain knowledge, while application-driven benchmarks only cover narrow, fragmented domains shaped by heuristic designs. To address these limitations, PerceptionBench adopts a bottom-up approach: by diagnosing the earliest failure points in the responses of frontier MLLMs across 42 existing benchmarks, we construct an error taxonomy whose perception branch defines ten atomic perceptual capabilities. Guided by this taxonomy, we construct 3,000 verified questions with short, unambiguous answers, each isolating a single capability, with difficulty stemming from perception rather than reasoning or knowledge. Benchmark results across sixteen frontier MLLMs reveal that atomic perception remains largely unsolved---no model reaches 60\\% accuracy, perception-related hallucination is the weakest capability on average, and similar overall scores conceal sharply divergent capability profiles. PerceptionBench thus provides a capability-level standard for measuring and diagnosing the visual perception boundaries of MLLMs.', 'score': 0, 'issue_id': 2928, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '622bf9fcc7af32cf', 'github_url': '', 'github_stars': 0, 'pdf_title_img': 'img/title_stub.png', 'data': {'categories': ['#benchmark', '#multimodal', '#interpretability', '#hallucinations'], 'emoji': '🖼️', 'ru': {'title': 'Тест для оценки визуального восприятия больших языковых моделей', 'desc': 'Мы представляем PerceptionBench, тест для оценки атомных возможностей визуального восприятия мультимодальных больших языковых моделей (MLLM). Существующие тесты не могут точно выделить восприятие, смешивая ошибки восприятия с ошибками логики или знания в данной области. PerceptionBench строится на базовом уровне: мы анализируем ошибки в ответах MLLM и создаем таксономию ошибок, которая определяет десять атомных возможностей восприятия. Результаты тестирования показывают, что атомное восприятие остается в значительной степени нерешенной задачей, и PerceptionBench предоставляет стандарт для измерения и диагностики границ визуального восприятия MLLM.'}, 'en': {'title': 'Isolating Visual Perception in MLLMs', 'desc': 'PerceptionBench is a new benchmark created to assess the visual perception skills of Multimodal Large Language Models (MLLMs). Unlike previous benchmarks, it focuses solely on perception, separating it from reasoning and domain knowledge errors. The benchmark includes a detailed error taxonomy that identifies ten specific perceptual capabilities and features 3,000 carefully crafted questions that test these capabilities. Results show that current MLLMs struggle with atomic perception, highlighting the need for improved models in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.25091', 'title': 'Towards Robust Reinforcement Learning for Small-Scale Language Model Agents', 'url': 'https://huggingface.co/papers/2607.25091', 'abstract': 'Abstract  The alignment of Small Language Models (SLMs) in the 70--500M parameter range using reinforcement learning is often considered unstable, though the underlying failure mechanisms have not been systematically investigated. In the State-of-the-Art (SOTA) research, fifteen (model, corpus) configurations were trained using Proximal Policy Optimization (PPO). The experiments included Pythia-70M, 160M, 410M and SmolLM2-135M, 360M on the TinyStories, CNN/DailyMail, and Wikitext-103 corpora. Three reproducible failure modes were identified in small-scale language models: silent LoRA parameter freezing in standard PEFT/TRL pipelines, numerical overflow in importance ratios when using bfloat16, and catastrophic policy collapse due to reward-model error. These issues were addressed using a merge-and-reinitialize adapter technique, float32 precision during PPO updates, and a three-layer safety mechanism comprising reward whitening, importance-ratio guarding, and weight rollback. In this paper, a capacity-headroom hypothesis is proposed, which states that PPO performance at the SLM scale depends on both a fluent supervised model (PPL<20) and a discriminative reward signal, rather than on the number of model parameters. The proposed system converged stably in all experiments and improved preference win rate over the SFT baseline in configurations with a fluent prior and an informative reward signal. Furthermore, it outperformed instruction-tuned baselines while requiring significantly less training data. All checkpoints, preference datasets, and training scripts are publicly released^§.', 'score': 0, 'issue_id': 2928, 'pub_date': '2026-07-27', 'pub_date_card': {'ru': '27 июля', 'en': 'July 27', 'zh': '7月27日'}, 'hash': '5b2dcfcc82a34562', 'github_url': '', 'github_stars': 0, 'authors': ['Md Rezwanul Haque', 'Md. Milon Islam', 'Fakhri Karray'], 'affiliations': ['Centre for Pattern Analysis and Machine Intelligence, Department of Electrical and Computer Engineering, University of Waterloo, N2L 3G1, Ontario, Canada', 'Department of Computer Science and Engineering, Khulna University of Engineering & Technology, Khulna, Bangladesh', 'Department of Machine Learning, Mohamed bin Zayed University of Artificial Intelligence, Abu Dhabi, United Arab Emirates'], 'pdf_title_img': 'assets/pdf/title_img/2607.25091.jpg', 'data': {'categories': ['#training', '#optimization', '#alignment', '#rl', '#rlhf', '#small_models', '#open_source'], 'emoji': '📈', 'ru': {'title': 'Стабильность малых языковых моделей: новые горизонты', 'desc': 'В статье рассматривается проблема выравнивания малых языковых моделей (SLMs) с использованием метода обучения с подкреплением, что часто приводит к нестабильным результатам. Проведённые эксперименты выявили три основные причины неудач, включая заморозку параметров LoRA, числовой переполнение и катастрофическое падение политики. Для решения этих проблем были предложены новые техники, такие как адаптер слияния и переинициализации, а также использование более точных форматов данных. В результате предложенная система продемонстрировала стабильное сходимость и улучшила результаты по сравнению с исходными моделями, требуя при этом значительно меньше обучающих данных.'}, 'en': {'title': 'Stabilizing Small Language Models with Reinforcement Learning', 'desc': 'This paper investigates the challenges of aligning Small Language Models (SLMs) using reinforcement learning, particularly focusing on models with 70 to 500 million parameters. It identifies three main failure modes during training, including issues with parameter freezing, numerical overflow, and policy collapse. To address these problems, the authors propose techniques such as a merge-and-reinitialize adapter and a three-layer safety mechanism. The results show that their approach leads to stable convergence and improved performance compared to existing methods, emphasizing the importance of a fluent supervised model and a strong reward signal.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agent_memory (1)', '#agents (1)', '#agi', '#alignment (1)', '#architecture', '#audio', '#benchmark (4)', '#compression (1)', '#context_window', '#continual_learning', '#data (2)', '#dataset (2)', '#diffusion (1)', '#ethics (1)', '#games (1)', '#graphs', '#hallucinations (1)', '#healthcare', '#inference (1)', '#interpretability (1)', '#knowledge_graphs', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math', '#memorization', '#memory (2)', '#multilingual', '#multimodal (4)', '#open_source (2)', '#optimization (3)', '#plp', '#prompt_caching', '#prompting (1)', '#rag', '#reasoning', '#retrieval (1)', '#retrieval_eval (1)', '#rl (1)', '#rlhf (1)', '#robotics (1)', '#science', '#security', '#session_memory', '#small_models (1)', '#story_generation', '#survey', '#synthetic', '#tool_use', '#training (3)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-29 02:29',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-29 02:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-29 02:29')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
