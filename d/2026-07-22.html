    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                titleSign.classList.add('rotate');

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.19191', 'title': 'ABot-World-0: Infinite Interactive World Rollout on a Single Desktop GPU', 'url': 'https://huggingface.co/papers/2607.19191', 'abstract': 'Abstract  We present ABot-World-0, an action-conditioned video world model for real-time, long-horizon closed-loop interaction, supported by a multi-source data infrastructure spanning AAA games, simulation engines, and internet videos to learn controllable world dynamics. WorldExplorer performs agent-driven collection guided by training feedback, while a unified pipeline applies 14 deterministic quality checks, VLM-based assessment, and synchronized action and text annotation. We progressively distill a bidirectional action-conditioned teacher into a causal student through teacher forcing and ODE distillation, and introduce LongForcing to align long student self-rollouts with an extended-horizon teacher, mitigating accumulated distribution shift and autoregressive drift. Raw keyboard actions provide a unified control interface for scene roaming and third-person character interaction, while reference-character memory provides persistent appearance cues for identity consistency during third-person rollouts. For deployment, we co-design a streaming inference stack with a lightweight VAE decoder, efficient attention, memory-aware scheduling, and low-bit DiT inference. Across optimized low-bit configurations, ABot-World-0 streams 720P video at up to 16 FPS on a single NVIDIA RTX 5090 desktop GPU, with 1.2s action-to-first-frame latency and approximately 19GiB peak VRAM. Experiments on WorldRoamBench and extended interactive rollouts demonstrate competitive controllability and coherent long-horizon world evolution.', 'score': 111, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '03a55a7ef194035d', 'github_url': '', 'github_stars': 0, 'authors': ['Fan Jiang', 'Zhaoxu Sun', 'Mengchao Wang', 'Ziyu Zhu', 'Chiyu Wang', 'Yunpeng Zhang', 'Wenlin Liu', 'Yun Wang', 'Xue Zheng', 'Rui Sun', 'Junfeng Ni', 'Hongyu Pan', 'Zhongxu Sun', 'Fei Yu', 'Zengye Ge', 'Mengmeng Du', 'Nianfei Fan', 'Mingchao Sun', 'Yu Liu', 'Yongchang', 'Yanqing Zhu', 'Jiahang Wang', 'Ning Ying', 'Yuze Xuan', 'Di Yang', 'Zhicheng Liu', 'Zhe Gao', 'Tingbing Xu', 'Jiacheng Sui', 'Wenjin Yang', 'Junnan Lai', 'Shufeng Liu', 'Yuan Liu', 'Zheng Zhou', 'Yingliang Peng', 'Dawei Cao', 'Kaifeng Sheng', 'Yuxiang Cai', 'Fei Lu', 'Mu Xu', 'Ning Guo'], 'affiliations': ['AMAP CV Lab Alibaba Group'], 'pdf_title_img': 'assets/pdf/title_img/2607.19191.jpg', 'data': {'categories': ['#training', '#memory', '#inference', '#agents', '#optimization', '#dataset', '#long_context', '#games'], 'emoji': '🎮', 'ru': {'title': 'Управление игровым миром в реальном времени', 'desc': 'В статье представлен ABot-World-0 - модель видеомира, которая позволяет взаимодействовать с игровым миром в реальном времени и на длительных горизонтах. Она использует данные из видеоигр, симуляторов и интернет-видео для изучения динамики управляемого мира. Модель обеспечивает взаимодействие персонажа и анализирует действия с помощью многократных проверок качества и аннотаций. Эксперименты показывают высокую управляемость и последовательное развитие мира на больших временных горизонтах.'}, 'en': {'title': 'Real-Time Control in Dynamic Video Worlds', 'desc': 'The paper introduces ABot-World-0, a video world model that allows for real-time interactions in complex environments using action conditioning. It leverages diverse data sources, including video games and simulations, to learn how to control world dynamics effectively. The model employs a unique training approach that includes teacher forcing and ODE distillation to improve long-term decision-making. Additionally, it features a streamlined inference system that enables efficient video streaming and interaction, demonstrating strong performance in maintaining coherence over extended periods.'}}}, {'id': 'https://huggingface.co/papers/2607.16617', 'title': 'DataFlow-Harness: A Grounded Code-Agent Platform for Constructing Editable LLM Data Pipelines', 'url': 'https://huggingface.co/papers/2607.16617', 'abstract': 'Abstract  Large language models (LLMs) are increasingly used to automate data-processing workflows, yet coding agents typically produce scripts that are not automatically materialized as persistent, editable platform artifacts. We call this disconnect the NL2Pipeline gap. To bridge it, we introduce DataFlow-Harness, a platform that guides an LLM agent to construct platform-native directed acyclic graphs (DAGs) through typed, incremental mutations rather than free-form scripts. The platform combines DataFlow-Skills for procedural guidance, a Model Context Protocol (MCP) layer that exposes the live operator registry and current pipeline state, and DataFlow-WebUI, which synchronizes conversational authoring with a visual DAG editor. On a 12-task data-engineering benchmark, DataFlow-Harness achieves a 93.3\\% observed end-to-end pass rate. Relative to Vanilla Claude Code, it reduces measured monetary cost by 72.5\\% and generation latency by 49.9\\%; its observed pass rate is within 0.9 percentage points of the Context-Aware Claude Code baseline while its cost is 42.8\\% lower. Per-task analysis indicates that Skills are most useful when construction depends on implicit procedural knowledge. These results show that live platform grounding can produce persistent, editable workflow artifacts with an observed reliability close to script-generation baselines and with lower measured construction cost and latency.', 'score': 102, 'issue_id': 2876, 'pub_date': '2026-07-18', 'pub_date_card': {'ru': '18 июля', 'en': 'July 18', 'zh': '7月18日'}, 'hash': '5f1c605ab335af1a', 'github_url': '', 'github_stars': 0, 'authors': ['Runming He', 'Zhen Hao Wong', 'Hao Liang', 'Zimo Meng', 'Chengyu Shen', 'Xiaochen Ma', 'Wentao Zhang'], 'affiliations': ['Institute for Advanced Algorithms Research, Shanghai', 'Peking University', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2607.16617.jpg', 'data': {'categories': ['#training', '#data', '#benchmark', '#agents', '#agent_memory', '#games'], 'emoji': '🛠️', 'ru': {'title': 'Мост между языковыми моделями и рабочими процессами', 'desc': 'В данной работе рассматривается проблема NL2Pipeline, связанная с тем, что агенты, использующие большие языковые модели (LLM), часто не создают редактируемые артефакты на платформах. Для её решения предлагается платформа DataFlow-Harness, которая помогает LLM-агенту строить направленные ациклические графы (DAG) через типизированные инкрементальные мутации. Платформа включает DataFlow-Skills для процедурного управления, протокол контекста модели (MCP) и визуальный редактор DAG через DataFlow-WebUI. Результаты показывают высокую производительность и снижение затрат, достигая 93.3% уровня успешных выполнения задач на тестовом наборе данных.'}, 'en': {'title': 'Bridging the NL2Pipeline Gap with DataFlow-Harness', 'desc': 'This paper addresses the challenge of converting scripts generated by large language models (LLMs) into usable, editable data-processing workflows, which is referred to as the NL2Pipeline gap. The authors present DataFlow-Harness, a platform that enables LLMs to create directed acyclic graphs (DAGs) through structured, incremental changes instead of unstructured scripts. The platform integrates procedural guidance, a Model Context Protocol for real-time updates, and a visual editor to enhance user interaction. Results show that DataFlow-Harness significantly improves efficiency and cost-effectiveness in data engineering tasks while maintaining high reliability in workflow creation.'}}}, {'id': 'https://huggingface.co/papers/2607.19139', 'title': 'Text Template Tokens Are Implicit Semantic Registers in Diffusion Transformers', 'url': 'https://huggingface.co/papers/2607.19139', 'abstract': 'Abstract  Text-to-image diffusion transformers (DiTs) jointly process text and image tokens, yet their internal computation during denoising remains poorly understood. We introduce a causal interpretability framework for modern large-scale DiTs that combines attention decomposition with targeted interventions across token spans, heads, and layers. Using it to separate prompt-content tokens from structural template tokens, we find that the structural tokens carry little prompt-specific information at the encoder output. Yet surprisingly, they emerge as dominant image-to-text attention sinks and causally maintain object identity inside the DiT, acting as implicit semantic registers. We show that they acquire this identity indirectly, with prompt semantics first injected into the image latents and then read back into the template tokens rather than transferred directly from the prompt tokens. Inspired by the above findings, we design a training-free pruning rule for DiTs. Heads that attend most strongly to prompt tokens are dispensable, and pruning them removes 20% of attention FLOPs with only a 1.4-point drop on GenEval. We further reveal how generative computation in DiTs is organized across heads and depth, separating semantic routing from visual synthesis and progressing from identity formation to propagation and refinement. Our work not only reveals that the tokens encoding semantics at input need not be those that maintain it during generation, but also provides a causal view of internal mechanisms in DiTs.', 'score': 65, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'f02e92ea7eb26be8', 'github_url': '', 'github_stars': 0, 'authors': ['Maohua Li', 'Qirui Li', 'Yanke Zhou', 'Yiduo Li', 'Zhaosheng Chi', 'Chao Xu', 'Cuifeng Shen', 'Yixuan Xu', 'Hanlin Tang', 'Kan Liu', 'Tao Lan', 'Lin Qu', 'Shao-Qun Zhang'], 'affiliations': ['Alibaba Group', 'Nanjing University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.19139.jpg', 'data': {'categories': ['#architecture', '#diffusion', '#training', '#interpretability'], 'emoji': '🎨', 'ru': {'title': 'Понимание внутренней работы трансформеров для генерации изображений', 'desc': 'В данной статье рассматриваются трансформеры для генерации изображений по текстовым описаниям (DiTs) и их внутренние механизмы работы. Авторы представляют новый подход к интерпретации, который комбинирует разложение внимания с целенаправленными вмешательствами. Обнаружено, что структурные токены, хотя и обладают небольшой специфической информацией о запросе, играют важную роль в поддержании идентичности объектов. В результате предложены новые правила обрезки, которые позволяют уменьшить вычислительные затраты без значительной потери качества генерации.'}, 'en': {'title': 'Unlocking the Secrets of Text-to-Image Diffusion Transformers', 'desc': 'This paper explores how text-to-image diffusion transformers (DiTs) process information during image generation. It introduces a framework to interpret the internal workings of DiTs by analyzing attention mechanisms and their effects on different token types. The study finds that structural tokens, which do not carry specific prompt information, play a crucial role in maintaining object identity in generated images. Additionally, the authors propose a method to prune unnecessary attention heads, improving efficiency without significantly affecting performance.'}}}, {'id': 'https://huggingface.co/papers/2607.18703', 'title': 'Generative World Renderer at the Speed of Play', 'url': 'https://huggingface.co/papers/2607.18703', 'abstract': "Abstract  Generative world renderer AlayaRenderer receives structured world states exported from physics engines and synthesizes RGB frames. Unlike models that generate frames from text/control-hints prompts, AlayaRenderer preserves scene structure without altering the underlying world dynamics. This demonstrates an alternative path toward interactive world modeling and user-controllable play. However, the original AlayaRenderer is too computationally expensive for real-time deployment. This technical report introduces AlayaRenderer-Flash, a real-time-oriented generative forward world renderer that pushes AlayaRenderer from 0.56 FPS to 31.54 FPS, reaching the speed of play. AlayaRenderer-Flash reformulates the original renderer as a few-step autoregressive streaming model and introduces lightweight distilled codecs for efficient latent encoding and frame reconstruction. It retains the teacher model's G-buffer and text-prompt interfaces while enabling continuous rendering over input streams of unbounded length. We evaluate AlayaRenderer-Flash on G-buffer streams across content preservation, temporal consistency, cross-window stability, prompt controllability, and runtime efficiency. Our results show that AlayaRenderer-Flash substantially reduces inference cost while preserving the core rendering capabilities of the teacher model. By integrating AlayaRenderer-Flash with a physics engine, we build a fully playable generative world running at 30 FPS.", 'score': 63, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '8bbce9ed72c262fe', 'github_url': '', 'github_stars': 0, 'authors': ['Guixu Lin', 'Zheng-Hui Huang', 'Siqi Yang', 'Ming-Hsuan Yang', 'Kaipeng Zhang', 'Zhixiang Wang'], 'affiliations': ['Alaya Lab', 'University of California, Merced'], 'pdf_title_img': 'assets/pdf/title_img/2607.18703.jpg', 'data': {'categories': ['#3d', '#training', '#inference', '#optimization', '#games'], 'emoji': '🌍', 'ru': {'title': 'Динамичный рендеринг миров в реальном времени', 'desc': 'AlayaRenderer — это генеративный рендерер мира, который получает структурированные состояния мира из физических движков и создает RGB-кадры. В отличие от моделей, которые генерируют кадры на основе текстовых подсказок, AlayaRenderer сохраняет структуру сцены и динамику мира. Однако оригинальная версия требует слишком много вычислительных ресурсов для работы в реальном времени. AlayaRenderer-Flash улучшает производительность, достигая 31.54 FPS, сохраняя при этом основные возможности оригинальной модели.'}, 'en': {'title': 'Real-Time Generative World Rendering Revolutionized', 'desc': "AlayaRenderer is a generative model that creates RGB frames from structured world states provided by physics engines, maintaining the scene's structure and dynamics. The original version was too slow for real-time use, operating at only 0.56 frames per second (FPS). The new AlayaRenderer-Flash improves this speed to 31.54 FPS by using a few-step autoregressive streaming model and lightweight codecs for efficient processing. This allows for continuous rendering and integration with physics engines, enabling interactive and controllable gameplay while preserving the quality of the original model."}}}, {'id': 'https://huggingface.co/papers/2607.19064', 'title': 'Mage-Flow: An Efficient Native-Resolution Foundation Model for Image Generation and Editing', 'url': 'https://huggingface.co/papers/2607.19064', 'abstract': 'Abstract  Large-scale visual generators are increasingly capable but costly to train, fine-tune, and deploy. We introduce Mage-Flow, a compact 4B-scale generative stack for efficient text-to-image generation and instruction-based image editing. The stack is built from two co-designed components: Mage-VAE, a lightweight high-fidelity latent tokenizer, and a Native-Resolution Multimodal Diffusion Transformer trained with rectified flow matching. Mage-VAE uses one-step diffusion-style encoding and decoding with anchor-latent regularization, preserving the reconstruction quality of strong public VAEs while reducing tokenization cost by more than an order of magnitude. Together with native-resolution packing and stack-level CUDA kernel fusion, the stack supports flexible-resolution training and improves end-to-end training throughput by about 2.5times. Built on this foundation, we develop a complete model family with Base, RL-aligned, and Turbo variants for both generation and editing. Diffusion-NFT improves prompt following, text rendering, aesthetic quality, and editing fidelity, while few-step distillation with adversarial perceptual guidance produces 4-step Turbo models for low-latency inference. Despite its compact scale, Mage-Flow and Mage-Flow-Edit achieves competitive performance across standard generation and editing benchmarks. More importantly, the Turbo variants make high-resolution generation and editing practical for interactive use: at 1024^2 resolution on a single NVIDIA A100 GPU, Mage-Flow-Turbo generates an image in 0.59s, and Mage-Flow-Edit-Turbo edits an image in 1.02s, while maintaining a small memory footprint. These results show that careful tokenizer--backbone--system co-design can deliver strong high-resolution generation and editing within an efficient 4B model family.', 'score': 55, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '3072d0743ba9fbe5', 'github_url': '', 'github_stars': 0, 'authors': ['Xinjie Zhang', 'Peng Zhang', 'Shicheng Zheng', 'Jinghao Guo', 'Zhaoyang Jia', 'Yifei Shen', 'Xun Guo', 'Yuxuan Luo', 'Jiahao Li', 'Wenxuan Xie', 'Fanyi Pu', 'Xiaoyi Zhang', 'Kaichen Zhang', 'Zongyu Guo', 'Tianci Bi', 'Dongnan Gui', 'Zhening Liu', 'Zimo Wen', 'Zihan Zheng', 'Senqiao Yang', 'Xiao Li', 'Jinglu Wang', 'Bin Li', 'Yan Lu'], 'affiliations': ['Microsoft'], 'pdf_title_img': 'assets/pdf/title_img/2607.19064.jpg', 'data': {'categories': ['#architecture', '#training', '#inference', '#multimodal', '#optimization', '#dataset', '#diffusion'], 'emoji': '🎨', 'ru': {'title': 'Эффективная генерация и редактирование изображений с Mage-Flow', 'desc': 'В статье представлен Mage-Flow, компактная генеративная модель для эффективного преобразования текста в изображения и редактирования изображений. Она состоит из двух компонентов: Mage-VAE — легковесного токенизатора, и многомодального диффузионного трансформера, тренированного с использованием согласования потока. Mage-Flow обеспечивает высокое качество генерации и редактирования, при этом значительно снижая затраты на токенизацию и повышая скорость обучения. Благодаря различным вариантам модели, включая Turbo, достигается высокая производительность и оперативность, что делает её практичной для интерактивного использования.'}, 'en': {'title': 'Efficient High-Resolution Image Generation and Editing with Mage-Flow', 'desc': 'Mage-Flow is a compact generative model designed for efficient text-to-image generation and image editing. It combines a lightweight tokenizer, Mage-VAE, with a Multimodal Diffusion Transformer to enhance performance while reducing training costs. The model achieves high-quality outputs and fast processing times, making it suitable for interactive applications. With its Turbo variants, Mage-Flow demonstrates competitive results in generation and editing tasks, all while maintaining a small memory footprint.'}}}, {'id': 'https://huggingface.co/papers/2607.18367', 'title': 'AlayaWorld: Interactive Long-Horizon World Modeling -- Full Technical Report', 'url': 'https://huggingface.co/papers/2607.18367', 'abstract': 'Abstract  Unlike conventional video game development, which relies on labor-intensive pipelines for asset production, animation, physics, and programming, video world models generate interactive environments from user inputs instantly. It enable us to create customized, explorable, and continuously evolving virtual world from text, an image, or video. Realizing this vision requires four tightly coupled capabilities: interaction, persistent spatiotemporal consistency, stable long-horizon generation, and efficient response. We present AlayaWorld, an interactive long-horizon video world model that generates 24-fps video at 540p and 720p. Built on a 15B video diffusion transformer, AlayaWorld generates short latent chunks autoregressively under camera trajectories and switchable text prompts. Its bounded visual context combines a persistent sink frame, compressed temporal history, geometry-aligned spatial memory, and recent-frame conditioning. To reduce long-term drift, the model is trained with corrupted histories and prediction residuals collected from its own roll-outs. We further introduce a discrete autoregressive distillation formulation that combines distribution-matching distillation, self-forcing++, and consistency distillation, reducing inference from approximately 30 sampling steps to four steps per chunk. On iWorld-Bench, AlayaWorld achieves the best performance over long-horizon generation. Conceived as a full-stack, open-source, and long-term project, AlayaWorld is intended to provide an extensible foundation for future research on interactive video world models.', 'score': 44, 'issue_id': 2876, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '8d94dbbca630f047', 'github_url': '', 'github_stars': 0, 'authors': ['AlayaWorld Team', 'Kaipeng Zhang', 'Chuanhao Li', 'Yifan Zhan', 'Yongtao Ge', 'Yuanyang Yin', 'Jiaming Tan', 'Kang He', 'Liaoyuan Fan', 'Mingliang Zhai', 'Ruicong Liu', 'Xiaojie Xu', 'Xuangeng Chu', 'Zhen Li', 'Zhengyuan Lin', 'Zhixiang Wang', 'Zian Meng', 'Zihui Gao'], 'affiliations': ['Alaya Lab'], 'pdf_title_img': 'assets/pdf/title_img/2607.18367.jpg', 'data': {'categories': ['#3d', '#training', '#open_source', '#agents', '#long_context', '#diffusion', '#games'], 'emoji': '🌍', 'ru': {'title': 'Создание интерактивных видео миров с AlayaWorld', 'desc': 'Статья описывает AlayaWorld, интерактивную модель видео миров, которая мгновенно генерирует виртуальные среды из пользовательских вводов. Модель использует архитектуру диффузионного трансформера для создания видео с частотой 24 кадра в секунду. Она сочетает в себе несколько возможностей, таких как взаимодействие и долговременная стабильность генерации. AlayaWorld также предлагает улучшенную эффективность вывода, сокращая количество шагов до всего четырех для генерации фрагментов видео.'}, 'en': {'title': 'Revolutionizing Interactive Video Worlds with AlayaWorld', 'desc': 'This paper presents AlayaWorld, an innovative interactive video world model that generates dynamic virtual environments based on user inputs like text, images, or videos. It leverages a 15B video diffusion transformer to produce 24-fps video at resolutions of 540p and 720p, ensuring persistent spatiotemporal consistency and stable long-horizon generation. The model incorporates advanced techniques such as autoregressive generation and a unique distillation approach to enhance efficiency, reducing the number of sampling steps significantly. AlayaWorld aims to serve as a foundational tool for future research in interactive video world models, promoting customization and exploration in virtual spaces.'}}}, {'id': 'https://huggingface.co/papers/2607.18722', 'title': 'Stale but Stable: Staleness-Adaptive Trust Regions for Stabilizing Asynchronous Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.18722', 'abstract': 'Abstract  Asynchronous reinforcement learning improves throughput by decoupling rollout generation from optimization, but staleness is an inevitable byproduct compounded by policy lag, engine delays, and mixture-of-experts routing. From a trust-region perspective, this mismatch is critical: training-inference divergence governs approximation error in finite-horizon bounds, whereas PPO clipping only gates sampled outward updates, acting as a sampled surrogate rather than a full-policy constraint. As a result, high-staleness updates remain weakly controlled in the asynchronous regime where stale rollouts matter most.   We introduce the Staleness-Adaptive Trust Region (SAT), which uses the detached sampled log-ratio as a practical staleness proxy, identifies high-mismatch tails within each batch via staleness-based kernel scaling, and contracts only the sign-selected endpoint of the nominal PPO interval. This preserves baseline behavior on ordinary tokens while enforcing more conservative updates on newly intercepted outward bands. We prove local interval containment and pointwise pessimism relative to PPO, showing how the adaptive rule reshapes update geometry under heterogeneous staleness.   We evaluate SAT in a decoupled asynchronous RL setup built on Qwen3-30B-A3B-Base, using SGLang as the inference engine and Megatron for training. In this setting, SAT-GSPO w/ R3 achieves the best observed AIME24 avg@8, reaching 35.83 at lag 1 and 34.79 at lag 8, while SAT-GSPO reaches 34.17 at lag 1. Adaptive clipping and routing replay act as complementary stabilizers targeting mismatch tails and routing inconsistency, respectively. Overall, aligning clip intervals with staleness heterogeneity effectively stabilizes asynchronous RL.', 'score': 28, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '23d8347c1670a436', 'github_url': '', 'github_stars': 0, 'authors': ['Junyao Yang', 'Yucheng Shi', 'Zongxia Li', 'Zhongzhi Li', 'Ruhan Wang', 'Xiangxin Zhou', 'Kishan Panaganti', 'Haitao Mi', 'Leowei Liang'], 'affiliations': ['Indiana University', 'National University of Singapore', 'Tencent', 'University of Georgia', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2607.18722.jpg', 'data': {'categories': ['#optimization', '#rl', '#training', '#reasoning'], 'emoji': '📈', 'ru': {'title': 'Адаптация к устареванию для улучшения асинхронного обучения с подкреплением', 'desc': 'Статья описывает новый подход в асинхронном обучении с подкреплением, который называется Staleness-Adaptive Trust Region (SAT). Этот метод использует обновления, адаптированные к устаревшим данным, чтобы улучшить устойчивость и качество обучения. SAT идентифицирует и корректирует проблемы, связанные с устаревшими выборками, обеспечивая более надежные обновления. Результаты эксперимента показывают, что использование SAT значительно улучшает эффективность обучения в установках асинхронного RL.'}, 'en': {'title': 'Stabilizing Asynchronous RL with Staleness-Adaptive Trust Regions', 'desc': 'This paper presents a method called Staleness-Adaptive Trust Region (SAT) to improve asynchronous reinforcement learning by addressing the issue of staleness in updates. It introduces a way to measure staleness and adaptively adjust the training process to ensure more reliable updates, especially when there are delays in policy execution. The method enhances the Proximal Policy Optimization (PPO) algorithm by allowing for more conservative updates when staleness is high, while maintaining performance on regular updates. The results show that SAT significantly stabilizes the learning process in environments with asynchronous rollouts, leading to better overall performance.'}}}, {'id': 'https://huggingface.co/papers/2607.18754', 'title': 'AgentDebugX: An Open-Source Toolkit for Failure Observability, Attribution, and Recovery in LLM Agents', 'url': 'https://huggingface.co/papers/2607.18754', 'abstract': 'Abstract  LLM agent failures are difficult to debug because the step where an error surfaces is often not the one that caused it. Existing observability tools replay execution traces but provide little support for identifying the root cause or translating diagnosis into recovery. We present AgentDebugX, an open-source debugging framework that organizes debugging as a closed loop of Detect, Attribute, Recover, and Rerun. At its core, DeepDebug performs multi-turn root-cause diagnosis through global trajectory understanding, structure-guided investigation, and cross-examination. On the Who and When benchmark, DeepDebug achieves the best strict attribution accuracy among the evaluated methods on both tested open-weight backbones, reaching 28.8 percent exact agent-and-step accuracy on qwen3.5-9b versus 21.7 percent for the strongest single-pass baseline. On GAIA, DeepDebug repairs 13 of 73 failed tasks in a single rerun, compared with 4 to 6 for three decoupled self-correction baselines, improving overall accuracy from 55.8 percent to 63.6 percent. AgentDebugX exposes this workflow through a Python library, CLI, web console, and installable agentic skill, and provides an opt-in Error Hub for sharing scrubbed failure-diagnosis-repair bundles and reusing them as debugging memory.', 'score': 16, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '109038f38ebe92b6', 'github_url': '', 'github_stars': 0, 'authors': ['Kunlun Zhu', 'Xuyan Ye', 'Zhiguang Han', 'Yuchen Zhao', 'Bingxuan Li', 'Weijia Zhang', 'Muxin Tian', 'Xiangru Tang', 'Pan Lu', 'James Zou', 'Jiaxuan You', 'Heng Ji'], 'affiliations': ['Google', 'Stanford University', 'University of Illinois Urbana-Champaign', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2607.18754.jpg', 'data': {'categories': ['#session_memory', '#memory', '#inference', '#open_source', '#agents', '#agent_memory'], 'emoji': '🔧', 'ru': {'title': 'Инновационный подход к отладке LLM агентов', 'desc': 'Статья описывает AgentDebugX, открытый фреймворк для отладки LLM агентов. Основная идея заключается в организации процесса отладки как замкнутого цикла, включающего обнаружение, атрибуцию, восстановление и повторный запуск. DeepDebug, центральный компонент AgentDebugX, использует многократную диагностику коренной причины на основе глобального понимания траектории и структурного руководства. Эксперименты показывают, что DeepDebug значительно превосходит существующие методы в точности и эффективности восстановления задач.'}, 'en': {'title': 'Revolutionizing LLM Debugging with AgentDebugX', 'desc': 'The paper introduces AgentDebugX, a debugging framework designed to address the challenges of diagnosing failures in LLM agents. It organizes the debugging process into a closed loop of Detect, Attribute, Recover, and Rerun, enhancing the ability to identify root causes of errors. The core component, DeepDebug, utilizes multi-turn root-cause diagnosis and global trajectory understanding to improve accuracy in fault attribution. Experimental results show that DeepDebug significantly outperforms existing methods in both attribution accuracy and task recovery, providing a comprehensive tool for debugging LLM agents.'}}}, {'id': 'https://huggingface.co/papers/2607.18091', 'title': 'SciForma: Structure-Faithful Generation of Scientific Diagrams', 'url': 'https://huggingface.co/papers/2607.18091', 'abstract': 'Abstract  Structural fidelity is essential to scientific methodology diagrams. To communicate research logic, these diagrams must faithfully render components, directional relations, and textual annotations. Since a single error, such as a reversed arrow or an unreadable equation, can invalidate the entire figure, structural fidelity is inherently conjunctive: correctness on one axis cannot compensate for failure on another. Current open-source models fail to satisfy this criterion. Supervised fine-tuning (SFT) learns plausible layouts but cannot reliably ensure structural correctness, while scalar reward-based post-training obscures which structural dimension has failed. To address this, we introduce SciForma, a framework for the structure faithful generation of scientific methodology diagrams. Specifically, SciForma decomposes diagram quality into three structural axes: Component, Arrow, and Text, guided by a structural inventory. Built on this foundation, we curate SciFormaData-700K for structured training and SciFormaBench-2K for logic-verified evaluation. To close the gap left by SFT, we develop Multi-Dimensional Conjunctive Preference Optimization (M-DPO), which enforces simultaneous correctness across all axes and adaptively routes gradients to the most deficient dimension in post-training. The same structural inventory also enables iterative editing at inference time to correct residual errors. This combination allows SciForma-9B to exceed all open-source baselines and GPT-Image-1.5 on both SciFormaBench-2K and AIBench, bringing open scientific diagram generation close to proprietary-level structural fidelity. Our code and data will be available at: https://github.com/microsoft/SciForma.', 'score': 15, 'issue_id': 2876, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': '1b0463203c649e71', 'github_url': '', 'github_stars': 0, 'authors': ['Yuxuan Luo', 'Peng Zhang', 'Xinjie Zhang', 'Xun Guo', 'Zhouhui Lian', 'Yan Lu'], 'affiliations': ['Microsoft Research Asia', 'State Key Lab of CAD & CG, Zhejiang University, China', 'Wangxuan Institute of Computer Technology, Peking University, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.18091.jpg', 'data': {'categories': ['#training', '#open_source', '#data', '#benchmark', '#optimization', '#dataset', '#science'], 'emoji': '📊', 'ru': {'title': 'Создание научных схем с высокой точностью!', 'desc': 'Статья посвящена созданию SciForma, фреймворка для генерации схем научных методологий с высокой структурной точностью. Это важно, так как даже небольшая ошибка в виде стрелки может сделать диаграмму недействительной. SciForma делит качество диаграмм на три оси: компоненты, стрелки и текст, что позволяет улучшить точность структурирования. Мы также разработали метод оптимизации M-DPO, который обеспечивает одновременную корректность по всем осям.'}, 'en': {'title': 'Achieving Structural Fidelity in Scientific Diagrams', 'desc': 'This paper presents SciForma, a framework designed to generate scientifically accurate methodology diagrams with high structural fidelity. It identifies three critical structural axes: Component, Arrow, and Text, ensuring that all elements are correctly represented. The framework utilizes Multi-Dimensional Conjunctive Preference Optimization (M-DPO) to maintain correctness across these axes during training and post-training adjustments. By introducing a structured dataset and evaluation benchmarks, SciForma significantly outperforms existing models in generating reliable scientific diagrams.'}}}, {'id': 'https://huggingface.co/papers/2607.18839', 'title': 'HPD-Parsing: Hierarchical Parallel Document Parsing', 'url': 'https://huggingface.co/papers/2607.18839', 'abstract': 'Abstract  Efficient teamwork typically combines global coordination with parallel execution, a principle not yet fully reflected in unified Vision-Language Model (VLM)-based document parsers. Existing unified parsers process an entire page jointly but generate its output through a single token-by-token autoregressive trajectory, creating a sequential bottleneck that grows with document length. Such full-page sequential generation overlooks a key property of document parsing: layout must be analyzed globally, whereas block content can be parsed in parallel. Based on this observation, we introduce HPD-Parsing, which replaces full-page autoregressive generation with a Hierarchical Parallel Decoding paradigm. A main layout branch organizes the overall document structure and dynamically assigns block-level content decoding to concurrent branches, while progressive multi-token prediction (P-MTP) further reduces the decoding steps within each branch. Experiments on public benchmarks show that HPD-Parsing achieves 4,752 tokens per second, delivering 2.62times the throughput of the fastest existing document parsing model and 3.06times that of the vanilla autoregressive baseline, while maintaining competitive parsing accuracy. These results establish hierarchical parallel decoding as an effective alternative to full-page autoregressive generation, opening a new direction for efficient unified document parsing.', 'score': 7, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'f2ad8c7a9d0dd818', 'github_url': '', 'github_stars': 0, 'authors': ['Shu Wei', 'Jingjing Wu', 'Lingshu Zhang', 'Qunyi Xie', 'Hao Zou', 'Le Xiang', 'Xu Fan', 'Yangliu Xu', 'Manhui Lin', 'Xiaolong Ma', 'Cheng Cui', 'Tengyu Du', 'YY'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.18839.jpg', 'data': {'categories': ['#optimization', '#architecture', '#benchmark', '#training'], 'emoji': '📄', 'ru': {'title': 'Эффективная обработка документов с HPD-Parsing', 'desc': 'Статья обсуждает новую методику обработки документов под названием HPD-Parsing, которая сочетает глобальную координацию и параллельное выполнение задач. В отличие от традиционного подхода, где вывод создается последовательно, HPD-Parsing использует иерархическую параллельную декодировку. Этот метод позволяет эффективно анализировать структуру документа и одновременно обрабатывать различные блоки контента. Эксперименты показывают, что HPD-Parsing значительно увеличивает скорость обработки документов при сохранении высокой точности.'}, 'en': {'title': 'Revolutionizing Document Parsing with Hierarchical Parallel Decoding', 'desc': 'This paper presents HPD-Parsing, a new approach to document parsing that improves efficiency by combining global layout analysis with parallel content decoding. Traditional methods use a single token-by-token generation process, which slows down performance as document length increases. HPD-Parsing introduces a Hierarchical Parallel Decoding paradigm that allows for concurrent processing of document blocks while maintaining an organized structure. Experiments demonstrate that this method significantly increases throughput while preserving accuracy, marking a shift towards more efficient unified Vision-Language Models.'}}}, {'id': 'https://huggingface.co/papers/2607.19322', 'title': 'Two-Level Meta-Rubrics for Evaluating Open-Ended Generation: GAMUT, a Benchmark for Factual Completeness', 'url': 'https://huggingface.co/papers/2607.19322', 'abstract': 'Abstract  Evaluating the factuality of long-form generations has focused predominantly on precision, measuring whether the claims a model makes are correct. The dominant decompose-search-verify pipeline catches incorrect claims well but says little about whether a response contains all the information it should. Measuring factual completeness, the missing half of factuality, is harder: it requires enumerating the full set of facts a complete answer should contain, and these facts rarely form a flat list. They often involve open-ended sets where coverage is what matters, ordered processes, and relationships among facts that a list of independent boolean checks fails to capture. We introduce a two-level meta-rubric framework for evaluating open-ended generation, and instantiate it as Gamut (Grounded Assessment of Multimodal Factuality), a benchmark for factual completeness in long-form generation. The framework rests on a two-level rubric representation: a structured meta-rubric captures the organization and importance of the required content, which is then mechanically compiled into a flat checklist of binary, machine-gradable rubrics that an LLM judge scores reliably. We construct 1,813 questions grounded in real wearable imagery across 10 diverse domains, each paired with an evidence-backed rubric verified by expert human annotators. Because the framework is modality-agnostic, we also release a text-only variant. Evaluating 14 frontier and open-weight models, we find the benchmark genuinely challenging (best score 58.7% from Gemini 3.1 Pro), highly discriminative, and robust to the choice of judge.', 'score': 6, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'c7d6b354cc0847cb', 'github_url': '', 'github_stars': 0, 'authors': ['Xilun Chen', 'Zhaleh Feizollahi', 'Ross Goodwin', 'Seungwhan Moon', 'Scott Yih', 'Pinar Donmez', 'Babak Damavandi', 'Luna Dong'], 'affiliations': ['Meta AI'], 'pdf_title_img': 'assets/pdf/title_img/2607.19322.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#evaluation', '#multimodal', '#hallucinations'], 'emoji': '📝', 'ru': {'title': 'Оценка фактической полноты в долгих текстах', 'desc': 'В данной статье рассматривается оценка фактической полноты долгих текстов, что является важной частью анализа машинного обучения. Предложена двухуровневая мета-рубрика для оценки открытых генераций, называемая Gamut, которая помогает выявить, содержит ли ответ все необходимые факты. Этот метод позволяет учитывать не только правильность фактов, но и их организацию и взаимосвязи. В рамках исследования была создана база из 1,813 вопросов, проверенных экспертами, что демонстрирует универсальность и сложность предложенной методики.'}, 'en': {'title': 'Enhancing Factual Completeness in Long-Form Generation', 'desc': 'This paper addresses the challenge of evaluating the factuality of long-form text generations by introducing a new framework for measuring factual completeness. While traditional methods focus on precision, they often overlook whether all necessary information is included in the response. The authors propose a two-level meta-rubric framework, named Gamut, which organizes required content and translates it into a machine-gradable checklist for evaluation. By testing this framework on a diverse set of questions, they demonstrate its effectiveness in assessing the completeness of generated content across various domains.'}}}, {'id': 'https://huggingface.co/papers/2607.19331', 'title': 'ISO: An RLVR-Native Optimization Stack', 'url': 'https://huggingface.co/papers/2607.19331', 'abstract': "Abstract  Reinforcement learning with verifiable rewards (RLVR) is rapidly advancing the reasoning capabilities of language models, yet the optimization layer that converts reward feedback into weight-space updates remains poorly understood. Building on our prior analysis (Zhu et al., 2025), we study this missing layer through the singular structure of model weights and identify spectral inheritance: RLVR can reuse the base model's weight spectra while acquiring new behavior through changes in the associated input and output singular frames.   We operationalize spectral inheritance as Isospectral Optimization (ISO), an RLVR-native, fixed-spectrum optimization framework with complementary offline and online instantiations. Offline, ISO-Merger combines the frame changes of shared-base specialists into a single fixed-spectrum model, requiring no post-merge data, rollouts, gradient updates, or on-policy distillation (OPD). It recovers complementary specialist capabilities and achieves the strongest aggregate performance among the compared data-free merging methods. Online, ISO-Optimizer applies a chosen base optimizer, including AdamW and Muon, to the frame variables while keeping the base spectra fixed. Across reasoning and coding tasks ranging from 1.5B to 8B parameters, ISO-Optimizer improves accuracy in the reported runs and reaches matched scores with substantially fewer training steps. On Qwen3-8B-Base, AdamW reaches an aggregate accuracy of 0.495 after 270 training steps. ISO-AdamW reaches the same accuracy after only 100 training steps and improves further to 0.509 after 210 training steps. Together, ISO offers a concrete answer to RLVR's missing optimization layer: rather than inheriting pre-training optimization wholesale, design post-training around the structure of reward-driven adaptation: inherit the spectrum, optimize the frames.", 'score': 3, 'issue_id': 2876, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '04dba8a05ec708b5', 'github_url': '', 'github_stars': 0, 'authors': ['Hanqing Zhu', 'Wenyan Cong', 'Zhizhou Sha', 'Sagnik Mukherjee', 'Xinyuan Song', 'David González-Martínez', 'Xiaoxia Wu', 'Yuandong Tian', 'Shiwei Liu', 'David Z. Pan', 'Zhangyang "Atlas" Wang'], 'affiliations': ['ELLIS Institute Tübingen', 'Emory University', 'Recursive Superintelligence Inc', 'The University of Texas at Austin', 'Together AI', 'UIUC'], 'pdf_title_img': 'assets/pdf/title_img/2607.19331.jpg', 'data': {'categories': ['#optimization', '#reasoning', '#rl', '#training'], 'emoji': '🔍', 'ru': {'title': 'Оптимизация спектров для достижения новых высот в RLVR', 'desc': 'Данная статья посвящена изучению оптимизационного слоя в обучении с подкреплением с проверяемыми наградами (RLVR). Авторы вводят концепцию спектрального наследования, которая позволяет использовать весовые спектры базовой модели для освоения нового поведения. Для реализации этой идеи они предлагают метод Isospectral Optimization (ISO), который улучшает производительность без необходимости наличия дополнительных данных для слияния. Этот подход демонстрирует значительное улучшение точности в задачах мышления и кодирования, сокращая количество необходимых шагов обучения.'}, 'en': {'title': 'Revolutionizing RLVR with Isospectral Optimization', 'desc': 'This paper introduces Isospectral Optimization (ISO), a new framework for reinforcement learning with verifiable rewards (RLVR) that enhances the optimization process of language models. It identifies a concept called spectral inheritance, which allows the model to reuse its existing weight structure while adapting to new tasks. ISO operates in both offline and online modes, improving performance without the need for extensive retraining or data. The results show that ISO can achieve higher accuracy with fewer training steps compared to traditional optimization methods.'}}}, {'id': 'https://huggingface.co/papers/2607.18934', 'title': 'Transcription Policy as a Latent Variable: Activating Controllable Verbatim ASR with Word-Level Timing', 'url': 'https://huggingface.co/papers/2607.18934', 'abstract': 'Abstract  Modern ASR models trained on heterogeneously annotated data treat transcription style (verbatim vs. intended) as an uncontrolled latent variable, causing measurable decoding instability, evaluation confounding (up to 60% of reported WER attributable to style mismatch), and unreliable word-level timing. We show that models already encode both styles; the challenge is controlled activation. Using coverage-aware decoder task tokens trained on parallel verbatim/intended transcript pairs, we raise German disfluency F1 from 10% to 79% zero-shot, despite English-only training. Full English-only fine-tuning surpasses all baselines in verbatim accuracy, disfluency detection, and intended-mode quality across both languages. We further introduce supervised cross-attention fine-tuning that improves word-level timestamps on disfluent speech beyond forced-alignment baselines. Finally, we propose verbatimize, a new task enabling scalable creation and enrichment of speech corpora with high-quality canonical verbatim transcriptions.', 'score': 3, 'issue_id': 2879, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '91c1764e3f0ec52d', 'github_url': '', 'github_stars': 0, 'authors': ['Laurin Wagner', 'Mario Zusag', 'Bernhard Thallinger'], 'affiliations': ['nyra labs, Austria'], 'pdf_title_img': 'assets/pdf/title_img/2607.18934.jpg', 'data': {'categories': ['#transfer_learning', '#audio', '#training', '#dataset', '#optimization'], 'emoji': '🗣️', 'ru': {'title': 'Устойчивость и качество распознавания речи', 'desc': "Современные модели автоматического распознавания речи (ASR), обученные на данных с разнородной аннотацией,Treat transcription style как неконтролируемую скрытую переменную, что приводит к нестабильности декодирования и искажению оценки. Мы показываем, что модели уже кодируют оба стиля, и вызов заключается в контролируемой активации. Мы используем токены задач декодера, учитывающие охват, чтобы значительно повысить точность распознавания и обнаружения неуверенной речи. Также мы представляем новую задачу 'verbatimize' для создания и обогащения корпусов речи с высококачественными каноническими транскрипциями."}, 'en': {'title': 'Enhancing ASR with Controlled Transcription Style Activation', 'desc': "This paper addresses the challenges in automatic speech recognition (ASR) models that arise from using data with different transcription styles, leading to decoding instability and evaluation issues. The authors demonstrate that existing models can differentiate between verbatim and intended styles, and they propose a method to control this activation using coverage-aware decoder task tokens. Their approach significantly improves disfluency detection and overall accuracy in both German and English, even with English-only training. Additionally, they introduce a new task called 'verbatimize' to enhance the creation of high-quality speech corpora with accurate verbatim transcriptions."}}}, {'id': 'https://huggingface.co/papers/2607.19343', 'title': 'Masked Visual Actions for Unified World Modeling', 'url': 'https://huggingface.co/papers/2607.19343', 'abstract': "Abstract  Video models absorb rich priors over how the visual world moves, interacts, and responds to contact, making them promising substrates for robotic world modeling. The central challenge is how to communicate action to such models in a form aligned with the visual space in which they learned these interaction priors, yet still grounded in physical manipulation. We introduce Masked Visual Actions, a pixel-space control interface that expresses action as a partially revealed trajectory of an arbitrary entity in a video. Revealing robot motion makes the model act as a forward dynamics model that predicts the scene's response to low-level robot actions, while revealing desired object motion makes the same model recover robot behavior consistent with that outcome. Finetuned with only 15 hours of masked examples from real videos and simulation, a single checkpoint achieves strong visual fidelity and controllability across diverse scenes and multiple embodiments. In downstream manipulation settings, the model produces imagined rollouts whose outcomes correlate with real-world execution for policy evaluation, improves decision making by ranking candidate futures in model-based planning, and supports inverse modeling by synthesizing robot motion from desired object motion.", 'score': 3, 'issue_id': 2875, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'f0b912edf310d58b', 'github_url': '', 'github_stars': 0, 'authors': ['Hadi Alzayer', 'Wenlong Huang', 'Haonan Chen', 'Christopher Luey', 'Lvmin Zhang', 'Maneesh Agrawala', 'Gordon Wetzstein', 'Li Fei-Fei', 'Yilun Du', 'Jiajun Wu', 'Jia-Bin Huang'], 'affiliations': ['Harvard University', 'Stanford University', 'University of Maryland, College Park'], 'pdf_title_img': 'assets/pdf/title_img/2607.19343.jpg', 'data': {'categories': ['#robotics', '#agents', '#training'], 'emoji': '🤖', 'ru': {'title': 'Интеллектуальное управление роботами через видео-модели', 'desc': 'В данной статье представлена новая модель, которая позволяет роботам взаимодействовать с видео-контентом для обучения манипуляциям. Используя интерфейс Masked Visual Actions, модель может предсказывать, как сцена будет реагировать на действия робота через неполное раскрытие траектории объектов. Модель была дообучена на основе 15 часов видео и демонстрирует высокую визуальную точность и управляемость в различных сценах. Это открывает новые возможности для планирования действий и синтеза движения робота на основе желаемого поведения объектов.'}, 'en': {'title': 'Empowering Robots with Visual Action Control', 'desc': 'This paper presents a novel approach called Masked Visual Actions, which allows video models to control robotic actions by using a pixel-space interface. The method involves revealing parts of a trajectory in a video to communicate actions that align with how the model understands visual interactions. By finetuning the model with a limited amount of masked examples, it achieves high visual fidelity and effective control across various scenarios. The model can predict outcomes of robot actions, enhance decision-making in planning, and generate robot movements based on desired object motions.'}}}, {'id': 'https://huggingface.co/papers/2607.18955', 'title': 'H^2SD: Hybrid Hindsight Self-Distillation', 'url': 'https://huggingface.co/papers/2607.18955', 'abstract': 'Abstract  Reinforcement learning with verifiable rewards (RLVR) has substantially improved the reasoning capabilities of large language models on tasks such as mathematical reasoning and code generation. However, most RLVR methods assign a scalar outcome reward to an entire trajectory, resulting in sparse supervision and limited token-level credit assignment. On-policy distillation (OPD) provides denser supervision by distilling token-level distributions from a stronger teacher model, but requires an additional teacher and typically assumes a shared vocabulary. On-policy self-distillation (OPSD) removes this dependency by conditioning the same model on privileged information to construct a teacher policy. However, directly matching the teacher distribution may cause information leakage and unstable optimization. RLSD avoids direct matching by using the teacher signal only to modulate update magnitudes, but it cannot provide an explicit correction direction when the sampled reasoning fails. To address this tradeoff, we introduce H^{2}SD, a hybrid hindsight self distillation framework that uses the teacher differently according to trajectory correctness. For successful trajectories, the teacher receives the student response confirmed as correct together with a rephrasing instruction, and its probabilities on the original response tokens are used to modulate update magnitudes without changing the direction determined by the reward. For failed trajectories, we condition the teacher on a reference hint containing key reasoning steps and a verified answer, and minimize the reverse KL divergence from the student to the teacher. Experiments on multiple challenging reasoning benchmarks show that H^2SD consistently outperforms representative RLVR, OPSD, and RLSD baselines while maintaining stable optimization and favorable generation efficiency.', 'score': 3, 'issue_id': 2875, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'fae9befcdbe4ced6', 'github_url': '', 'github_stars': 0, 'authors': ['Qiye Cai', 'Yichuan Ma', 'Linyang Li', 'Peiji Li', 'Yongkang Chen', 'Qipeng Guo', 'Yicheng Zou', 'Tao Gui', 'Xiaocheng Feng', 'Bing Qin'], 'affiliations': ['Fudan University', 'Harbin Institute of Technology', 'Shanghai Artificial Intelligence Laboratory', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.18955.jpg', 'data': {'categories': ['#optimization', '#rl', '#reasoning', '#training', '#benchmark'], 'emoji': '🧠', 'ru': {'title': 'Гибридное самодистиллирование для улучшения моделей!', 'desc': 'В статье рассматривается новая гибридная структура H^{2}SD для обучения с подкреплением с проверяемыми наградами (RLVR). Она улучшает способности моделей с языком к математическому рассуждению и генерации кода. Вместо того чтобы напрямую сопоставлять распределения учителя и ученика, H^{2}SD использует информацию от учителя для модуляции величин обновлений, что позволяет избежать утечки информации. Эксперименты показывают, что H^{2}SD превосходит предыдущие методы, обеспечивая стабильную оптимизацию и высокую эффективность генерации.'}, 'en': {'title': 'Enhancing Reasoning in Language Models with H^{2}SD', 'desc': 'This paper presents H^{2}SD, a novel hybrid hindsight self-distillation framework that enhances reinforcement learning with verifiable rewards (RLVR) for large language models. It improves reasoning tasks by using a teacher model to guide updates based on the correctness of trajectories, allowing for better token-level credit assignment. For successful trajectories, it modulates update magnitudes without altering the direction of the reward, while for failed ones, it minimizes divergence from a teacher conditioned on key reasoning steps. Experiments demonstrate that H^{2}SD outperforms existing methods, achieving stable optimization and efficient generation.'}}}, {'id': 'https://huggingface.co/papers/2607.19069', 'title': 'Delineate Anything v2: A Global Foundation Model for Field Delineation', 'url': 'https://huggingface.co/papers/2607.19069', 'abstract': 'Abstract  Accurate agricultural field boundary delineation at large scale is a foundational task for food security, supply chain transparency, and carbon accounting. While vision foundation models like SAM show remarkable zero-shot capabilities, they frequently fail in geospatial domains due to topological complexity, cropland texturing patterns, and a lack of physical scale awareness. In this work, we introduce Delineate Anything v2, a globally scalable foundation model designed specifically for wide-area field boundary mapping. We construct FBIS-73M, a 73-million-instance multi-resolution dataset spanning 61 countries. To address the pervasive issue of multi-field administrative parcel merging, we introduce a resolution-specific data curation pipeline that leverages topological image-space adaptation to homogenize merged parcels and strengthen weak physical boundaries. Furthermore, we establish a novel, manually curated evaluation benchmark covering 100 countries to assess independent zero-shot generalization. Our results show that Delineate Anything v2 surpasses the current state-of-the-art, including the Delineate Anything framework, by 0.284 mAP@0.5 (+103.3% relative gain), while maintaining execution speeds suitable for rapid national- and global-scale deployment, as demonstrated by nationwide mapping of Ukraine (603,000 km^2) in 5.4 hours on a consumer-grade workstation. Code, pre-trained weights, the FBIS-73M dataset, and ready-to-use national-scale vector boundary products are publicly available at https://github.com/Lavreniuk/Delineate-Anything.', 'score': 3, 'issue_id': 2878, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'c679fb5365b6330a', 'github_url': '', 'github_stars': 0, 'authors': ['Mykola Lavreniuk', 'Nataliia Kussul', 'Andrii Shelestov', 'Yevhenii Salii', 'Volodymyr Kuzin', 'Charlotte Julia Li-Xing Wang', 'Zoltan Szantoi'], 'affiliations': ['European Space Agency, Frascati, Italy', 'National Technical University of Ukraine Igor Sikorsky Kyiv Polytechnic Institute, Kyiv, Ukraine', 'Space Research Institute NASU-SSAU, Kyiv, Ukraine', 'University of Maryland, College Park, Maryland, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.19069.jpg', 'data': {'categories': ['#open_source', '#benchmark', '#dataset', '#data', '#science'], 'emoji': '🌾', 'ru': {'title': 'Новая модель для определения границ сельскохозяйственных полей', 'desc': 'Данная статья представляет новый модельный подход для точного определения границ сельскохозяйственных полей в больших масштабах. Модель Delineate Anything v2 использует уникальный датасет FBIS-73M, состоящий из 73 миллионов экземпляров и охватывающий 61 страну. Авторы впровадили новый процесс обработки данных, который улучшает определение границ, учитывая топологические особенности. Результаты показывают, что новая модель превышает существующие аналоги по эффективности, обеспечивая быстрое выполнение задач на глобальном уровне.'}, 'en': {'title': 'Revolutionizing Agricultural Mapping with Delineate Anything v2', 'desc': 'This paper presents Delineate Anything v2, a foundation model tailored for accurately mapping agricultural field boundaries on a large scale. It addresses challenges faced by existing models, such as topological complexity and the merging of multi-field parcels, by introducing a specialized dataset called FBIS-73M and a resolution-specific data curation pipeline. The model demonstrates significant improvements in performance, achieving a 0.284 mAP@0.5 increase over previous state-of-the-art methods. Additionally, it showcases rapid execution speeds, enabling efficient nationwide mapping, exemplified by a comprehensive mapping of Ukraine in just 5.4 hours.'}}}, {'id': 'https://huggingface.co/papers/2607.19058', 'title': 'Where Should Optimizer State Live? Tiered State Allocation for Memory-Efficient Mixture-of-Experts Training', 'url': 'https://huggingface.co/papers/2607.19058', 'abstract': "Abstract  Optimizer state is the largest single line item in the memory budget of mixture-of-experts (MoE) training: on a 6.78B-parameter MoE language model, AdamW keeps 50.6 GB of first and second moments to update 12.6 GB of bfloat16 weights. We study SkewAdam, an optimizer built on the observation that the three parameter populations of an MoE - the dense backbone, the experts, and the router - differ enough in size and gradient statistics that they should not receive the same state. SkewAdam keeps float32 momentum plus a factored second moment for the backbone (5% of parameters), a factored second moment alone for the experts (95%), and an exact second moment for the router (<0.01%). The resulting state occupies 1.29 GB, 2.6% of AdamW's, and peak training memory falls from 81.4 GB to 31.3 GB, within the budget of a 40 GB accelerator. In a controlled comparison from identical initializations over 82M tokens, SkewAdam reaches validation perplexity 108.4, ahead of AdamW (126.8), Muon (120.2), and Lion (393.7), and settles router load balance to within 1% of its uniform floor. The allocation is not what earns that perplexity: a tier ablation matches it with twenty times the state, and Adafactor, which shares the factored estimator but drops momentum, plateaus 40 points behind. The tiers buy memory at no cost to accuracy; the accuracy comes from keeping momentum, which a uniform optimizer shares too. Sweeping the baselines' learning rates narrows but does not close the gap: the best tuned AdamW reaches 118.5, tuned Adafactor 139.7. Where optimizer state lives, these results suggest, matters at least as much as how much of it there is.", 'score': 3, 'issue_id': 2877, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': 'd2e3a678cdd46587', 'github_url': '', 'github_stars': 0, 'authors': ['Nuemaan Malik'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.19058.jpg', 'data': {'categories': ['#training', '#optimization', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Оптимизация памяти для лучших результатов в MoE', 'desc': 'В статье рассматривается оптимизация состояния оптимизатора в процессе тренировки моделей смешанных экспертов (MoE). Авторы предлагают новый оптимизатор SkewAdam, который учитывает различия в размерах и градиентной статистике между тремя группами параметров MoE. SkewAdam значительно уменьшает использование памяти, сохраняя только 1.29 ГБ состояния при этом достигая более низкой перплексии валидирования по сравнению с AdamW. Результаты показывают, что распределение состояния оптимизатора не менее важно, чем его объем для достижения высокой точности.'}, 'en': {'title': 'SkewAdam: Optimizing Memory for Mixture-of-Experts Training', 'desc': 'This paper introduces SkewAdam, a new optimizer designed for mixture-of-experts (MoE) models that significantly reduces memory usage during training. By recognizing that different parameter groups in MoE have distinct characteristics, SkewAdam allocates optimizer states differently for the backbone, experts, and router components. This approach decreases the memory footprint from 50.6 GB to just 1.29 GB while maintaining high accuracy, achieving better validation perplexity than traditional optimizers like AdamW. The findings suggest that the organization of optimizer state is crucial for efficient training in large-scale models.'}}}, {'id': 'https://huggingface.co/papers/2607.18529', 'title': 'EduPanel: A Three-Agent LLM Judge for Teaching Videos -- Reliability, Complementarity, and Human Trust Calibration', 'url': 'https://huggingface.co/papers/2607.18529', 'abstract': 'Abstract  Teaching videos are becoming a major medium for education, creating a growing need for scalable evaluation of their pedagogical quality. Existing automatic judges do not fully address this setting because teaching quality depends on multimodal evidence and should be evaluated with respect to the intended learner rather than as a universal property. We present EduPanel, a rubric-grounded, learner-conditioned LLM judge that decomposes evaluation across specialized agents to produce interpretable assessments for different aspects of teaching quality. Across expert studies, architecture ablations, and learner-persona analyses, EduPanel achieves reliability comparable to a median human expert. In expert evaluation, its feedback improves scoring accuracy (MAE 0.87 to 0.73), while experts remain able to detect unreliable outputs (AUC = 0.77) instead of accepting them blindly. These results suggest that EduPanel can serve as effective assistants for educational evaluation rather than replacements for human experts.', 'score': 3, 'issue_id': 2876, 'pub_date': '2026-07-20', 'pub_date_card': {'ru': '20 июля', 'en': 'July 20', 'zh': '7月20日'}, 'hash': 'ca0bfd9e811702f1', 'github_url': '', 'github_stars': 0, 'authors': ['Jia-Kai Dong', 'Yi-Cheng Lin', 'Hung-yi Lee'], 'affiliations': ['NTU Artificial Intelligence Center of Research Excellence', 'National Taiwan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.18529.jpg', 'data': {'categories': ['#training', '#education', '#interpretability', '#agents', '#multimodal'], 'emoji': '📚', 'ru': {'title': 'EduPanel: новый уровень оценки образовательных видео', 'desc': 'В статье представлено решение проблемы оценки качества образовательных видео, которое становится всё более актуальным. Оценка качества обучения зависит от нескольких факторов и должна проводиться с учетом конкретных учеников. Разработанная система EduPanel использует LLM и специализированные агенты для интерпретации различных аспектов образовательного процесса. Результаты показали, что EduPanel показывает надежность, сопоставимую со средним уровнем экспертов, и может эффективно помогать в оценке, не заменяя человека.'}, 'en': {'title': 'EduPanel: Tailored Evaluations for Teaching Quality', 'desc': "This paper introduces EduPanel, a novel evaluation system designed to assess the quality of teaching videos. Unlike traditional methods, EduPanel uses a learner-conditioned approach, meaning it tailors evaluations based on the specific needs of different learners. It employs multiple specialized agents to provide detailed and interpretable assessments of various teaching quality aspects. The results show that EduPanel's evaluations are as reliable as those of human experts, enhancing scoring accuracy while allowing experts to identify unreliable outputs."}}}, {'id': 'https://huggingface.co/papers/2607.19344', 'title': 'Appearance Pointers -- Multimodal Region Control of Diffusion Transformers', 'url': 'https://huggingface.co/papers/2607.19344', 'abstract': 'Abstract  Controllable image generation remains challenging for creative professionals, who often require precise regional control over materials, object identities, and spatial arrangements that cannot be reliably achieved through text prompting alone. Diffusion Transformers (DiTs) can natively ingest heterogeneous tokens stemming from texts and images, but they lack mechanisms for determining where and how these tokens should influence the output. We introduce appearance pointers, compact tokens that guide DiTs toward the correct appearance cues at the correct spatial locations by aligning text or image inputs with user-specified masks. Appearance pointers are produced by a region correspondence network and refined through a spatial aggregation mechanism, enabling the model to handle multiple regional descriptions without significantly increasing token load. Our approach introduces the first modality-agnostic interface for localized multimodal control in a DiT without retraining the base model from scratch. Across a range of metrics, our single model reaches or surpasses the performance of modality-specific state of the art methods, offering a simple and extensible path toward precise, region-aware, multimodal guidance in generative image synthesis.', 'score': 2, 'issue_id': 2875, 'pub_date': '2026-07-21', 'pub_date_card': {'ru': '21 июля', 'en': 'July 21', 'zh': '7月21日'}, 'hash': '13b17fdede50f456', 'github_url': '', 'github_stars': 0, 'authors': ['Rahul Sajnani', 'Yulia Gryaditskaya', 'Radomír Měch', 'Srinath Sridhar', 'Matheus Gadelha'], 'affiliations': ['Adobe Research', 'Brown University'], 'pdf_title_img': 'assets/pdf/title_img/2607.19344.jpg', 'data': {'categories': ['#diffusion', '#3d', '#multimodal'], 'emoji': '🎨', 'ru': {'title': 'Точный контроль генерации изображений для творцов', 'desc': "В данной статье рассматривается задача управления генерацией изображений для творческих профессионалов, которым необходима точная региональная контроль над материалами и объектами. Авторы предлагают новую технологию под названием 'appearance pointers', которая направляет модели Diffusion Transformers на правильные визуальные подсказки с учетом пространственных местоположений. Эта система позволяет обрабатывать различные региональные описания, не увеличивая при этом нагрузку на токены. Новый подход обеспечивает простой и расширяемый способ для достижения точного многомодального управления в генеративной синтезе изображений."}, 'en': {'title': 'Precise Control in Image Generation with Appearance Pointers', 'desc': 'This paper addresses the challenge of controllable image generation, which is important for creative professionals needing specific control over image elements. The authors introduce Diffusion Transformers (DiTs) enhanced with appearance pointers, which are tokens that help guide the model in generating images based on user-defined spatial cues. These pointers are created through a region correspondence network and refined to manage multiple regional inputs efficiently. The proposed method allows for precise multimodal control without the need to retrain the model, achieving performance that meets or exceeds existing specialized methods.'}}}, {'id': 'https://huggingface.co/papers/2607.15491', 'title': 'Trajectory-aware Cross-view Geo-localization with Sequential Observations', 'url': 'https://huggingface.co/papers/2607.15491', 'abstract': 'Abstract  Cross-view geo-localization matches ground-level observations against geo-tagged satellite imagery. Recent methods show that sequential queries such as video clips yield richer spatiotemporal cues than single images, yet they overlook a complementary sequential modality: route descriptions -- which capture the same trajectory at a higher level of abstraction and are often the only input available (e.g., a user directing an autonomous vehicle to a pickup point). To bridge this gap, we introduce SeqGeo-VL, a dataset of sim39K video-text-satellite triplets, and TrajLoc, a unified framework capable of processing both video clips and route descriptions. By leveraging both dense visual and abstract linguistic semantics, TrajLoc enables these modalities to mutually reinforce cross-view matching. We further propose TrajMod, a lightweight module that conditions query embeddings on trajectory geometry, yielding spatially-aware representations. Experiments show that TrajLoc achieves substantial gains over state-of-the-art methods on both video and text geo-localization. The project page is available at https://humblegamer.github.io/trajloc/.', 'score': 2, 'issue_id': 2876, 'pub_date': '2026-07-16', 'pub_date_card': {'ru': '16 июля', 'en': 'July 16', 'zh': '7月16日'}, 'hash': 'd8abfc387c26561b', 'github_url': '', 'github_stars': 0, 'authors': ['Tianyi Gao', 'Jiayu Lin', 'Danielle Beaulieu', 'Nathan Jacobs'], 'affiliations': ['Washington University in St. Louis, St. Louis, MO 63130, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.15491.jpg', 'data': {'categories': ['#training', '#transfer_learning', '#multimodal', '#dataset', '#games'], 'emoji': '🛰️', 'ru': {'title': 'Новый уровень геолокации: видео и описания маршрутов', 'desc': 'В данной работе рассматривается задача кросс-вижуальной геолокации, которая сопоставляет наземные наблюдения с геометками спутниковых изображений. Авторы представляют новый подход SeqGeo-VL, который включает набор данных из 39 000 триплетов видео-текст-спутниковые изображения, а также унифицированную рамочную структуру TrajLoc. Эта структура обрабатывает как видеофрагменты, так и описания маршрутов, позволяя им взаимно усиливать сопоставление. Эксперименты показывают, что TrajLoc значительно превосходит существующие методы в области геолокации как видео, так и текста.'}, 'en': {'title': 'Bridging Ground and Sky: Enhanced Geo-Localization with Video and Route Descriptions', 'desc': 'This paper presents a new approach to cross-view geo-localization by matching ground-level observations with geo-tagged satellite images. It introduces SeqGeo-VL, a dataset containing video-text-satellite triplets, and TrajLoc, a framework that processes both video clips and route descriptions. By combining visual data and abstract language, TrajLoc enhances the matching process between different views. The authors also propose TrajMod, a module that improves query embeddings based on trajectory geometry, leading to better performance in geo-localization tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.19011', 'title': 'Computational Humor with Multimodal LLMs: Methods, Datasets, Evaluation, and Challenges', 'url': 'https://huggingface.co/papers/2607.19011', 'abstract': "Abstract  Multimodal humor in memes, cartoons, and comics remains difficult for AI systems because intended meaning depends on non-literal mechanisms, shared cultural knowledge, and communicative intent rather than literal scene description. This survey focuses on visual humor understanding in single-image and multi-panel artifacts, while treating humor ge
