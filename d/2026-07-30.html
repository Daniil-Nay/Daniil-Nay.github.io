    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.27205', 'title': 'TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with <1 GB VRAM', 'url': 'https://huggingface.co/papers/2607.27205', 'abstract': 'Abstract  Vision-language-action (VLA) models commonly adopt an LLM-centric V to L to A pathway, where visual observations are projected into the representation space of a large language model before being decoded into robot actions. Although effective, this design incurs substantial computation and memory overhead at every policy invocation. In this work, we introduce TurboVLA, a new VLA paradigm that reformulates the conventional V to L to A pathway as a direct V + L to A mapping. Instead of using a large language model as the central interface between perception and action, TurboVLA independently encodes visual observations and language instructions, directly exchanges information between them through lightweight bidirectional vision-language interaction, and predicts continuous action chunks with a compact decoder. This simple design constructs task-conditioned representations directly from visual and linguistic features, significantly reducing the computational and memory costs of VLA inference. On LIBERO, TurboVLA achieves 97.7% average success with only 0.2B parameters, 31.2 ms inference latency, and 0.9 GB inference VRAM on a consumer-grade RTX 4090, matching or outperforming substantially larger VLA policies. These results establish TurboVLA as a simple and effective alternative to the prevailing LLM-centric VLA paradigm, offering a new perspective on how vision, language, and action can be connected for efficient robotic manipulation. Code is available at https://github.com/H-EmbodVis/TurboVLA.', 'score': 46, 'issue_id': 2937, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '0fcc2c05a80e7d95', 'github_url': '', 'github_stars': 0, 'authors': ['Hengyi Xie', 'Chenfei Yao', 'Xianjin Wu', 'Xuanyang Xi', 'Yiping Tang', 'Di Xu', 'Yingying Zhu', 'Dingkang Liang', 'Xiang Bai', 'Han Ding'], 'affiliations': ['Huawei Technologies Co. Ltd, China', 'Huazhong University of Science and Technology'], 'pdf_title_img': 'assets/pdf/title_img/2607.27205.jpg', 'data': {'categories': ['#robotics', '#architecture', '#small_models', '#optimization', '#agents', '#agent_memory'], 'emoji': '🤖', 'ru': {'title': 'TurboVLA: Эффективная связь зрения, языка и действий', 'desc': 'В данной статье представлен новый подход для моделей, связывающих визуальные данные, язык и действия роботов, называющийся TurboVLA. Этот метод напрямую преобразует визуальные и языковые данные в действия, исключая использование крупных языковых моделей как центрального элемента. В результате достигается значительное снижение вычислительных и оперативных затрат. TurboVLA демонстрирует высокую точность при малом количестве параметров, что подтверждает его эффективность по сравнению с традиционными методами.'}, 'en': {'title': 'TurboVLA: Streamlining Vision-Language-Action for Efficient Robotics', 'desc': 'This paper presents TurboVLA, a novel approach to vision-language-action (VLA) models that simplifies the traditional pathway of visual input to language processing and then to action execution. Instead of relying on a large language model as the intermediary, TurboVLA directly maps visual and language inputs to actions through a lightweight interaction mechanism. This method reduces the computational and memory demands typically associated with VLA systems while maintaining high performance. TurboVLA demonstrates impressive results on the LIBERO benchmark, achieving high success rates with significantly fewer parameters and lower latency compared to existing models.'}}}, {'id': 'https://huggingface.co/papers/2607.27180', 'title': 'HumanCLAW: Can Vision-Language Models Act Through a Body?', 'url': 'https://huggingface.co/papers/2607.27180', 'abstract': "Abstract  Evaluating whether a vision-language model (VLM) can act through a physical body is challenging. The outcome of an action couples the VLM's decision with motor control. When a task fails, it is hard to tell whether the VLM made a bad choice or the motor controller simply failed to execute it, e.g., losing balance and falling. In this work, we introduce HumanCLAW, an evaluation framework that decouples action decision-making from low-level execution. At every step, a harnessed, off-the-shelf VLM issues an atomic skill command, and the command is translated into a sub-second chunk of continuous full-body motion with real physical consequences, including gravity and collisions. The body can therefore act freely in the physical world, while execution-side disturbances, balance and motor errors, are factored out. What remains measurable is the model's action intelligence: its moment-to-moment choice of what the body should execute next. Based on this framework, we build HumanCLAW-Bench: 1,218 long-horizon, egocentric find-navigate-interact episodes across 41 indoor scenes. We test nine state-of-the-art VLMs and find that none solves the benchmark; the best model reaches only a 16.8% success rate. Recognizing the target is not the bottleneck. What current VLMs lack is embodied self-awareness: they lose track of their own body, failing to tell where it is, whether it has reached the goal, or whether it has hit an obstacle.", 'score': 36, 'issue_id': 2937, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'd53672bb4c67fbd3', 'github_url': '', 'github_stars': 0, 'authors': ['Siyao Li', 'Jiawei Gu', 'Shuai Liu', 'Kairui Hu', 'Zekun Li', 'Linjie Li', 'Chengcheng Tang', 'Po-Chen Wu', 'Ivan Shugurov', 'Lingni Ma', 'Michael Zollhoefer', 'Sizhe An', 'Abhay Mittal', 'Amy Zhao', 'Ranjay Krishna', 'Manling Li', 'Ziwei Liu', 'Chuan Guo'], 'affiliations': ['Brown University', 'Meta', 'Nanyang Technological University', 'Northwestern University', 'University of Washington'], 'pdf_title_img': 'assets/pdf/title_img/2607.27180.jpg', 'data': {'categories': ['#benchmark', '#interpretability', '#agents', '#agi', '#games'], 'emoji': '🤖', 'ru': {'title': 'Оценка интеллекта действий в моделях VLM', 'desc': 'В данной работе представлена оценка, может ли модель визуально-языкового взаимодействия (VLM) действовать через физическое тело. Проблема заключается в разделении принятия решений VLM и низкоуровневого исполнения действий. Авторы разработали HumanCLAW, который позволяет оценивать интеллектуальные действия модели без влияния ошибок исполнения. Тестирование девяти современных VLM показало, что ни одна из них не справилась с заданием, так как им не хватает телесной самоосознанности.'}, 'en': {'title': 'Decoupling Decision-Making from Execution in Vision-Language Models', 'desc': 'This paper presents HumanCLAW, a framework designed to evaluate vision-language models (VLMs) by separating decision-making from physical execution. It allows VLMs to issue commands that translate into real-time body movements, while accounting for disturbances like balance and motor errors. The study reveals that current VLMs struggle with embodied self-awareness, failing to accurately track their own position and interactions in the environment. The authors introduce HumanCLAW-Bench, a benchmark with 1,218 episodes to test VLMs, highlighting that none achieved satisfactory performance, with the best model only reaching a 16.8% success rate.'}}}, {'id': 'https://huggingface.co/papers/2607.25675', 'title': 'DecoEvo: Score-Decoupled Co-Evolution of Solver and Rubric-Generator Skills in Text Space', 'url': 'https://huggingface.co/papers/2607.25675', 'abstract': "Abstract  Text-space optimization adapts large language models (LLMs) by editing external natural-language artifacts rather than model weights, so the optimized artifacts remain inspectable and the model can be treated as a black box. However, most existing text-space methods keep evaluation fixed. On open-ended tasks, this can become a bottleneck: once the solver improves on the criteria a rubric measures, omitted dimensions remain invisible to the optimization signal. Simply evolving the rubric is also unreliable when updates are selected by the current solver's score, because apparent progress can come from making the rubric easier to satisfy. We introduce DecoEvo (Decoupled Co-Evolution), which co-evolves a solver skill and a rubric-generator skill under decoupled objectives without using gold rubrics during optimization. The solver skill is updated using criterion-level feedback, while the rubric-generator skill is revised through complementary audits of requirement coverage and response discrimination that are independent of aggregate solver score. This separation focuses generator updates on newly exposed solver weaknesses, reducing repeated emphasis on criteria the solver already satisfies. Under each benchmark's official evaluation, DecoEvo outperforms all compared methods across five benchmarks and three LLM backbones, yielding 2.8--5.0\\% relative gains over SkillOpt in the five-benchmark average.", 'score': 29, 'issue_id': 2937, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'f034ff7faf105541', 'github_url': '', 'github_stars': 0, 'authors': ['Jiangwang Chen', 'Zixin Song', 'Junlin Liu', 'Shuaiyu Zhou', 'Haiyan Wu', 'Haihan Shi', 'Chenxi Zhou', 'Hanqing Li', 'Xiao Yang', 'Da Zhu', 'Guanjun Jiang', 'Hai Wan', 'Xibin Zhao'], 'affiliations': ['Peking University', 'Qwen Business Unit of Alibaba', 'Tsinghua University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.25675.jpg', 'data': {'categories': ['#training', '#benchmark', '#optimization', '#rl'], 'emoji': '📈', 'ru': {'title': 'Эволюция навыков для оптимизации языковых моделей', 'desc': 'В статье рассматривается метод оптимизации текстового пространства для крупных языковых моделей (LLMs), который предлагает редактирование внешних артефактов естественного языка вместо изменения весов модели. Метод DecoEvo (Декуплированная коэволюция) позволяет одновременно развивать навыки решателя и генератора рубрик, что позволяет избежать зависимостей от фиксированных рубрик. Это помогает сосредоточиться на выявлении слабостей решателя и улучшении критериев оценки без необходимости полагаться на золотые рубрики. Результаты показывают, что DecoEvo превосходит другие методы в тестах на различных бенчмарках.'}, 'en': {'title': 'DecoEvo: Evolving Skills and Rubrics for Better LLM Optimization', 'desc': "This paper presents DecoEvo, a novel approach for optimizing large language models (LLMs) by co-evolving a solver skill and a rubric-generator skill. Unlike traditional methods that rely on fixed evaluation criteria, DecoEvo allows for dynamic updates to the rubric based on the solver's performance, focusing on areas where the solver struggles. This decoupled approach ensures that improvements in the solver do not come at the cost of making the evaluation easier. The results show that DecoEvo significantly outperforms existing methods across multiple benchmarks, demonstrating its effectiveness in enhancing LLM capabilities."}}}, {'id': 'https://huggingface.co/papers/2607.25308', 'title': 'CAST: Game Solvers as Turn-Level Teachers for LLM Agents', 'url': 'https://huggingface.co/papers/2607.25308', 'abstract': "Abstract  Training large language models (LLMs) to act in long-horizon games is a promising step toward generalist decision-making, yet reinforcement learning with verifiable rewards (RLVR) relies on sparse final rewards that reveal little about which decisions determine success. Denser process signals could supply this missing turn-level credit, but existing sources are hard to keep both cheap and accurate. We observe that changes in a game solver's state value reveal whether an action advances the state toward success. Building on this insight, we propose CAST (Credit Assignment from Solver Teachers), which converts these value changes into solver advantages and injects them into RLVR as turn-level signals. We further show that, under a soft-optimal solver assumption, maximizing the solver advantage is equivalent to on-policy distillation from the solver, requiring only scalar values rather than teacher logits. Across Sokoban, Minesweeper, and Rush Hour, CAST outperforms all trained baselines on every game under both in-domain and unseen-difficulty evaluation and achieves the highest average zero-shot performance on ALFWorld and WebShop. Our code is available at https://github.com/Wloner0809/CAST.", 'score': 19, 'issue_id': 2937, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'd25ed1861cb6effa', 'github_url': '', 'github_stars': 0, 'authors': ['Yu Wang', 'Yi-Kai Zhang', 'Wentao Shi', 'Ziang Ye', 'Yuchun Miao', 'Yueqing Sun', 'Qi Gu', 'Xunliang Cai', 'Lan-Zhe Guo', 'Han-Jia Ye', 'Fuli Feng'], 'affiliations': ['Meituan, China', 'Nanjing University', 'University of Science and Technology of China', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.25308.jpg', 'data': {'categories': ['#training', '#optimization', '#rl', '#games'], 'emoji': '🎮', 'ru': {'title': 'Новый подход к обучению моделей в долгосрочных играх', 'desc': 'В статье представлено новое решение для обучения больших языковых моделей (LLM) в долгосрочных играх, используя метод, называемый CAST. Основная идея заключается в том, что изменения в значении состояния игрового решателя могут подсказать, приводит ли действие к успеху. CAST преобразует эти изменения в преимущества решателя и использует их в обучении с подкреплением с проверяемыми вознаграждениями (RLVR). Эксперименты показывают, что метод CAST превосходит все обученные основы в различных играх.'}, 'en': {'title': 'Enhancing RL with Solver Insights for Better Game Performance', 'desc': "This paper introduces CAST (Credit Assignment from Solver Teachers), a method that enhances reinforcement learning with verifiable rewards (RLVR) by providing denser turn-level signals. It leverages changes in a game solver's state value to indicate whether an action is beneficial for achieving success. By converting these value changes into solver advantages, CAST improves the learning process in long-horizon games. The results show that CAST outperforms existing methods across various games, demonstrating its effectiveness in both familiar and challenging scenarios."}}}, {'id': 'https://huggingface.co/papers/2607.25294', 'title': 'CLBench-V: Evaluating Multimodal Context Learning from Grounding to Knowledge Acquisition', 'url': 'https://huggingface.co/papers/2607.25294', 'abstract': 'Abstract  Real-world tasks often require models to learn from task-specific context rather than relying only on pre-trained knowledge. While recent work has highlighted this capability as context learning, existing evaluations mainly focus on textual contexts. In many practical settings, however, the context to be learned from is multimodal: scientific findings are conveyed through figures and tables, financial indicators are scattered across converted reports, and spatial decisions depend on maps, scenes, or web pages. We introduce CLBench-V, a benchmark for multimodal context learning that addresses the difficulty of localizing where context use breaks down by organizing tasks around three dimensions: context grounding, new information application, and new knowledge learning. CLBench-V combines converted public benchmarks with newly constructed datasets spanning domains such as science, finance, long-document understanding, spatial reasoning, and web-based visual question answering. To reduce the cost of constructing domain-specific context-learning tasks, we further use automated construction and filtering procedures for our newly built datasets. Across 3,443 instances and six recent multimodal models, the best overall score is only 0.2847, indicating that multimodal context learning remains far from saturated. Moreover, InternVL3.5-30B-A3B performs best on context grounding and new knowledge learning, while Qwen3.5-Plus performs best on new information application. We further analyze judge reliability, context length, image count, and representative failure cases. Code is available at https://github.com/IamLihua/CLBench-V.', 'score': 15, 'issue_id': 2937, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '5d81028f3c452c3a', 'github_url': '', 'github_stars': 0, 'authors': ['Lai Wei', 'Chengqi Li', 'Jiapeng Li', 'Ruina Hu', 'Yue Wang', 'Weiran Huang'], 'affiliations': ['School of Computer Science, Shanghai Jiao Tong University', 'Shanghai Innovation Institute', 'Zhongguancun Academy'], 'pdf_title_img': 'assets/pdf/title_img/2607.25294.jpg', 'data': {'categories': ['#long_context', '#benchmark', '#multimodal', '#dataset', '#continual_learning', '#compression'], 'emoji': '📊', 'ru': {'title': 'Новый взгляд на многомодальное обучение контексту', 'desc': 'В настоящей статье представлено исследование, в котором обсуждается необходимость моделей машинного обучения учитывать многомодальные контексты, а не полагаться только на предварительно обученные знания. Мы представляем новый бенчмарк CLBench-V, который оценивает обучение контексту в задачах, связанных с наукой, финансами и пространственными решениями. Бенчмарк включает как общедоступные наборы данных, так и новые наборы для обучения, обеспечивая автоматическое создание и фильтрацию задач. Результаты показывают, что обучение многомодальному контексту ещё не достигло высокой степени развития, с лучшим результатом всего лишь 0.2847.'}, 'en': {'title': 'Unlocking Multimodal Context Learning with CLBench-V', 'desc': 'This paper introduces CLBench-V, a benchmark designed for evaluating multimodal context learning, which is essential for real-world tasks that involve various types of data like text, images, and tables. Unlike previous evaluations that focused mainly on textual contexts, CLBench-V addresses the need for models to learn from diverse sources of information across different domains. The benchmark includes a wide range of tasks and utilizes automated methods to create and filter datasets, making it easier to develop context-learning tasks. The results show that current multimodal models still struggle with context learning, highlighting the need for further research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.26784', 'title': 'SkillRise: Agentic Reinforcement Learning for Cross-Task Skill Evolution', 'url': 'https://huggingface.co/papers/2607.26784', 'abstract': 'Abstract  Large language model agents often encounter related yet distinct tasks that share reusable solution patterns. Yet standard agentic reinforcement learning treats tasks as independent episodes, while existing approaches to skill learning either focus on repeated attempts of one task or use pipelines with multiple stages that entangle extraction, retrieval, and execution. We introduce SkillRise, a unified reinforcement learning framework for learning skills across tasks. SkillRise organizes related instances into progressively challenging sequences and uses a single policy to alternate between task solving and curating an evolving skill document passed directly to the next task. Decoupled credit assignment across tasks supervises solving with the current task outcome and curation with discounted downstream outcomes. Experiments on ALFWorld, WebShop, and ScienceWorld show that SkillRise achieves the strongest Pass@1 performance among the compared methods, with gains over the strongest baseline ranging from 2.3 to 8.5 percentage points. Although trained across distinct tasks, its learned curation policy remains effective for repeated attempts on the same task. Further analysis reveals scaling at test time across tasks: performance improves with longer sequences of related tasks even when each task is attempted only once. This trend suggests that SkillRise reuses transferable skills across tasks rather than benefiting from repeated sampling of the same task. SkillRise further retains strong performance while substantially reducing the runtime overhead of skill learning pipelines with multiple stages. Together, these results provide a simple and efficient training paradigm for LLM agents to extract, refine, and reuse transferable skills across tasks.', 'score': 12, 'issue_id': 2937, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': 'dd474669a67efa94', 'github_url': '', 'github_stars': 0, 'authors': ['Zhiyuan Yao', 'Yuxin Chen', 'Zhengxi Lu', 'Zishan Xu', 'Yueqing Sun', 'Yifu Guo', 'Yuquan Lu', 'Zhengzhou Cai', 'Kangning Zhang', 'Zhuowen Han', 'Zi-Han Wang', 'Ziang Ye', 'Qi Gu', 'Xunliang Cai', 'Weiwen Liu', 'Yongliang Shen'], 'affiliations': ['Meituan', 'National University of Singapore', 'Shanghai Jiao Tong University', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.26784.jpg', 'data': {'categories': ['#reasoning', '#training', '#transfer_learning', '#agents', '#continual_learning', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Объединение навыков для эффективного обучения моделей', 'desc': 'В данной статье представлена новая модель SkillRise, которая объединяет методы обучающего подкрепления для изучения навыков на различных задачах. В отличие от традиционного подхода, SkillRise организует связанные задачи в последовательности различной сложности, используя одну политику для решения задач и создания документа навыков. Модель демонстрирует улучшенные результаты по сравнению с существующими методами, а также показывает, что навыки могут быть эффективно перенесены между задачами. Эксперименты показывают, что SkillRise достигла значительных повышений производительности, сохраняя при этом снижение временных затрат на обучение.'}, 'en': {'title': 'SkillRise: Unifying Skill Learning Across Tasks', 'desc': 'The paper introduces SkillRise, a novel reinforcement learning framework designed for large language model agents to learn transferable skills across related tasks. Unlike traditional methods that treat tasks independently, SkillRise organizes tasks into sequences that progressively increase in difficulty, allowing for better skill curation and application. It employs a single policy to manage both task solving and skill documentation, enhancing efficiency and performance. Experimental results demonstrate that SkillRise outperforms existing methods, achieving significant improvements in task performance while reducing the complexity of skill learning processes.'}}}, {'id': 'https://huggingface.co/papers/2607.25659', 'title': 'CoRT: Counterfactual Replay for Token-Level Rubric-Guided Policy Optimization', 'url': 'https://huggingface.co/papers/2607.25659', 'abstract': 'Abstract  Rubric-based reinforcement learning enriches language model training by evaluating model outputs against explicit criteria. Yet in GRPO-style pipelines, these structured judgments are reduced to a scalar response-level reward and converted into a response-level advantage, which is broadcast uniformly to all generated tokens. This leaves no explicit mechanism for allocating credit within a response, even when different criteria are grounded in different spans, formatting decisions, or semantic choices. We propose CoRT, a token-level credit weighting method for rubric-conditioned GRPO. Instead of training an auxiliary token scoring model, CoRT uses counterfactual replay to rescore the same sampled response under the original rubric-conditioned prompt and a matched criteria-free prompt. The resulting tokenwise log-likelihood contrasts serve as a proxy for dependence on the rubric context. CoRT maps these contrasts to bounded, response-normalized weights and uses them to redistribute the signed GRPO advantage across tokens, without introducing an auxiliary scorer or changing the response-level reward. Experiments across instruction-tuned models and reward granularities show that CoRT improves over matched response-level GRPO in the vast majority of comparisons, with an average gain of 4.4 percentage points. The method remains competitive with learned token-level credit baselines while avoiding a separate relevance-learning stage. These results suggest that policy-internal counterfactual likelihood contrasts provide an effective training signal for within-response credit allocation while retaining the simplicity and stability of GRPO.', 'score': 6, 'issue_id': 2937, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': 'ea4ce8a79746d748', 'github_url': '', 'github_stars': 0, 'authors': ['Bo-Wen Zhang', 'Junwei He', 'Wen Wang', 'Song-Lin Lv', 'Wentao Ma', 'Rongyi Lin', 'Shuhan Zhong', 'Lan-Zhe Guo'], 'affiliations': ['ByteDance', 'School of Intelligence Science and Technology, Nanjing University', 'State Key Laboratory of Novel Software Technology, Nanjing University', 'University of Chinese Academy of Sciences'], 'pdf_title_img': 'assets/pdf/title_img/2607.25659.jpg', 'data': {'categories': ['#reasoning', '#training', '#optimization', '#rlhf', '#rl'], 'emoji': '📊', 'ru': {'title': 'Новый взгляд на распределение вознаграждений в языковых моделях', 'desc': 'Статья посвящена улучшению обучения языковых моделей с помощью методов подкрепляющего обучения, основанных на критериях. Предлагается новый метод под названием CoRT, который распределяет преимущества между токенами, учитывая их зависимость от заданных критериев. Вместо создания отдельной модели оценки токенов, CoRT использует контрфактическую реплею для перераспределения вознаграждений. Эксперименты показали, что метод CoRT значительно улучшает результаты по сравнению с традиционными подходами.'}, 'en': {'title': 'Token-Level Credit Allocation for Enhanced Language Model Training', 'desc': 'This paper introduces CoRT, a method that improves how language models are trained using rubric-based reinforcement learning. Instead of giving a single reward for an entire response, CoRT assigns credit to individual tokens based on their relevance to specific criteria. It does this by using counterfactual replay to compare responses under different prompts, allowing for a more nuanced understanding of which tokens contribute to the overall quality. The results show that CoRT significantly enhances performance compared to traditional methods, making it a valuable approach for refining language model outputs.'}}}, {'id': 'https://huggingface.co/papers/2607.27155', 'title': 'OmegaUse-OfficeVal: Benchmarking LLM Agents on Long-Horizon Office-Suite Tasks with Economic Grounding', 'url': 'https://huggingface.co/papers/2607.27155', 'abstract': 'Abstract  Large language model (LLM) agents are increasingly expected to assist users in completing tasks. However, existing benchmarks provide limited support for evaluating whether agents can carry out office-suite workflows at a reasonable cost. We introduce OmegaUse-OfficeVal, a benchmark for evaluating LLM agents on long-horizon office-suite tasks with task-level economic grounding. The benchmark comprises 100 tasks derived from office-suite requests proposed by practitioners and adapted through a privacy-preserving process. On average, these tasks require 2.32 hours of human labor to complete. An important feature of the benchmark is that each task is paired with two economic signals: human labor time and task price proxy. These signals enable direct comparisons between human costs and LLM inference costs, as well as value-weighted evaluation. To support stable evaluation, we develop code-based verifiers from fine-grained rubrics. We evaluate several frontier LLMs together with a human baseline. Although all evaluated LLMs are substantially cheaper and faster than human workers, they have not yet approached human-level deliverable quality. The code and dataset are fully open-sourced, and more information is available on our project website: https://omegause-officeval.github.io.', 'score': 5, 'issue_id': 2937, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '8360174c9e04d802', 'github_url': '', 'github_stars': 0, 'authors': ['Jingbo Zhou', 'Yusai Zhao', 'Qi Bao', 'Jingjia Cao', 'Zhenghai Chen', 'Chang Gao', 'Kaiqi Guo', 'Muxin Guo', 'Mingxuan Li', 'Xinjiang Lu', 'Yanru Ma', 'Yixiong Xiao', 'Zenghui Zhang', 'Le Zhang', 'Hua Wu'], 'affiliations': ['Agent Frontier Team, Large Model Frontier Research Department, Baidu Inc., China'], 'pdf_title_img': 'assets/pdf/title_img/2607.27155.jpg', 'data': {'categories': ['#long_context', '#benchmark', '#open_source', '#agent_memory'], 'emoji': '🧑\u200d💼', 'ru': {'title': 'Эффективность LLM в офисных задачах: быстрее, но не лучше', 'desc': 'В статье представлена новая база данных OmegaUse-OfficeVal для оценки агентов на основе LLM в задачах офисного рабочего процесса. База данных включает 100 задач, которые требуют в среднем 2.32 часа человеческого труда для завершения. Каждая задача имеет связывающиеся экономические сигналы, позволяющие сравнить затраты на выполнение задач между людьми и LLM. Результаты показывают, что хотя LLM быстрее и дешевле людей, качество их работы все еще не достигает уровня человека.'}, 'en': {'title': 'Evaluating LLMs in Office Tasks: Cost vs. Quality', 'desc': 'This paper introduces OmegaUse-OfficeVal, a benchmark designed to evaluate large language model (LLM) agents on complex office-suite tasks. It includes 100 tasks that reflect real-world office requests and incorporates economic metrics like human labor time and task price proxies. The benchmark allows for a comparison of costs between human workers and LLMs, highlighting the efficiency of LLMs, which are faster and cheaper but still lack the quality of human output. The authors provide open-source access to the code and dataset to encourage further research in this area.'}}}, {'id': 'https://huggingface.co/papers/2607.27191', 'title': 'Can AI agents conduct open-ended AI research? Early evidence from two case studies', 'url': 'https://huggingface.co/papers/2607.27191', 'abstract': "Abstract  Forecasts of explosive AI progress hinge on AI agents automating AI research. But evidence on whether agents can carry out open-ended AI research is thin. Current evaluations either test agents on narrow, verifiable tasks, which excludes open-ended research, or submit AI-generated papers to blind peer review, which is overstretched, stochastic, and suffers from poor review quality. We introduce a third way to measure progress towards AI R\\&D automation. An agent takes on the central, open-ended research question of a high-quality unpublished paper, and the paper's original authors grade its output. We call these shadow evaluations. We ran shadow evaluations on two unpublished NeurIPS 2026 submissions, giving frontier agents six days and thousands of dollars of compute. The agents completed all of the engineering without human help, yet could not make substantial progress towards answering the research questions. As a result, both papers were unambiguously rejected by the authors. We identify five recurring failure modes: poor judgment about the bar for publishable research, uncreative responses to shortcomings in the research design, ineffective backtracking from dead ends, poor resource awareness, and instruction drift. A robustness check with a second model and scaffold reproduced these failures. We release the expert reviews, survey responses, agent repositories, and logs. Our results provide early evidence that today's agents can do the engineering of AI research, but struggle with critical parts of the research lifecycle.", 'score': 5, 'issue_id': 2937, 'pub_date': '2026-07-29', 'pub_date_card': {'ru': '29 июля', 'en': 'July 29', 'zh': '7月29日'}, 'hash': '1b7ac6a207e606da', 'github_url': '', 'github_stars': 0, 'authors': ['Peter Kirgis', 'Sayash Kapoor', 'Andrew Schwartz', 'Stephan Rabanser', 'David Africa', 'Konstantinos Voudouris', 'Viet Nguyen', 'Toby Pilditch', 'Magda Dubois', 'Harry Coppock', 'Cozmin Ududec', 'Nitya Nadgir', 'Matilda Orona', 'Tilman Bayer', 'Derrick Chan-Sew', 'Yue Ling', 'Abhishek Shetty', 'Helen Toner', 'Gillian Hadfield', 'Seth Lazar', 'Steve Newman', 'Shoshannah Tekofsky', 'Rishi Bommasani', 'Arvind Narayanan'], 'affiliations': ['Cornflower Labs', 'Georgetown University (CSET)', 'Golden Gate Institute for AI', 'Independent', 'Johns Hopkins University', 'Princeton University', 'Stanford University', 'UC Berkeley', 'UK AI Security Institute', 'University of Toronto'], 'pdf_title_img': 'assets/pdf/title_img/2607.27191.jpg', 'data': {'categories': ['#reasoning', '#training', '#survey', '#optimization', '#benchmark', '#agents', '#agi'], 'emoji': '🤖', 'ru': {'title': 'Автоматизация исследований в AI: реальность или миф?', 'desc': "Статья исследует возможность автоматизации исследовательской деятельности в области AI с помощью агентов. Авторы провели так называемую 'теневую оценку', где агенты пытались ответить на открытые исследовательские вопросы из неопубликованных статей. Несмотря на успешное выполнение инженерных задач, агенты не смогли продвинуться в решении исследовательских вопросов. Исследование выявило пять основных неудач, связанных с оценкой качества исследований и креативностью подходов."}, 'en': {'title': 'AI Agents: Engineering Success, Research Failure', 'desc': "This paper explores the ability of AI agents to automate open-ended AI research, a crucial step for future advancements in the field. The authors introduce a novel evaluation method called shadow evaluations, where AI agents tackle complex research questions from unpublished papers and are graded by the original authors. Despite the agents successfully handling engineering tasks, they failed to make significant progress on the research questions, leading to rejections from the authors. The study identifies key failure modes in the agents' performance, highlighting their limitations in judgment, creativity, and resource management during the research process."}}}, {'id': 'https://huggingface.co/papers/2607.26115', 'title': 'GPT-Red: Automated Red Teaming via Self-Play at Scale', 'url': 'https://huggingface.co/papers/2607.26115', 'abstract': 'Abstract  We introduce GPT-Red, an automated red-teaming agent that is trained to discover novel prompt injection attacks against frontier LLMs. The goal of this model is to evaluate and improve the robustness of our production systems. To this end, we use it to adversarially train GPT-5.6, our most robust model to prompt injections to date. To create GPT-Red, we design a scalable self-play algorithm where the model is tasked with attacking a diverse population of simultaneously-trained defender agents. We train the model on realistic red-teaming environments using compute on the same scale as some of our largest RL post-training runs, making it the single-largest LLM safety training run ever documented. GPT-Red excels at red-teaming: it reliably breaks our past models up to GPT-5.5, it finds more successful attacks than human red-teamers, and it generalizes to held-out environments, defender models, and harnesses. In the future, we expect that as we improve the robustness of each new GPT model, it will in turn will provide better learning signal for even stronger red-teamer agents, thus unlocking a self-improvement flywheel.', 'score': 3, 'issue_id': 2936, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '834014844a20f658', 'github_url': '', 'github_stars': 0, 'authors': ['Eric Wallace', 'Christopher A. Choquette-Choo', 'Nikhil Kandpal', 'Sam Toyer', 'Dylan Hunn', 'Stephanie Lin', 'Yuxin Wen', 'Xiangyu Qi', 'Christopher Wolff', 'Zizhao Wang', 'Milad Nasr', 'Sicheng Zhu', 'Chuan Guo', 'Juan Felipe Cerón Uribe', 'Kaiwen Wang', 'Aiden Low', 'Kai Xiao', 'Kai Chen'], 'affiliations': ['OpenAI'], 'pdf_title_img': 'assets/pdf/title_img/2607.26115.jpg', 'data': {'categories': ['#rl', '#security', '#agents', '#training'], 'emoji': '🛡️', 'ru': {'title': 'Новая эпоха защиты LLM с GPT-Red', 'desc': 'В статье представлен GPT-Red, автоматизированный агент для обнаружения новых атак через инъекции подсказок против современных LLM. Модель оценивает и улучшает надежность производственных систем, занимаясь противостоянием по обучению с использованием GPT-5.6. GPT-Red использует масштабируемый алгоритм самоигры, где он атакует различных защитников, что делает его крупнейшим проектом по обучению безопасности LLM. Эта модель превосходит человеческие команды в нахождении успешных атак и демонстрирует способность к обобщению на новых средах.'}, 'en': {'title': 'Revolutionizing LLM Security with GPT-Red', 'desc': 'The paper presents GPT-Red, an automated agent designed to identify new prompt injection attacks on advanced large language models (LLMs). Its primary purpose is to enhance the security and robustness of production systems by adversarially training the latest model, GPT-5.6. GPT-Red employs a self-play algorithm to simulate attacks against multiple defender agents, making it the largest safety training run for LLMs documented to date. The results show that GPT-Red outperforms human red-teamers in discovering successful attacks and demonstrates strong generalization capabilities across different environments and models.'}}}, {'id': 'https://huggingface.co/papers/2607.25802', 'title': 'Explicit Layer Modeling for Video Object Insertion and Layer Decomposition', 'url': 'https://huggingface.co/papers/2607.25802', 'abstract': 'Abstract  Most video editing systems still lack explicit layered video representations, limiting their ability to perform realistic compositing, object reuse, and consistent manipulation. This limitation is especially pronounced in video object insertion and video layer decomposition, where existing methods rely on implicit inference or per-scene optimization due to the absence of explicit foreground-layer supervision. We introduce TriLayer, a large-scale triplet video dataset containing aligned composite, background, and foreground videos, where the foreground layers include both object appearance and associated visual effects. This explicit supervision enables models to learn layered video representations directly rather than inferring them implicitly. Building on this dataset, we propose DBL-Diffusion, a dual-branch diffusion framework that jointly models RGB composites and RGBA foreground layers through shared denoising and cross-branch interaction. We instantiate the framework in two tasks: DBL-Insert for layered object insertion, which generates explicit RGBA layers for realistic compositing and flexible post-editing, and DBL-Decompose for video layer decomposition, which recovers foreground and background layers using triplet supervision. Experiments demonstrate that explicit layer modeling substantially improves both insertion fidelity and decomposition quality.', 'score': 3, 'issue_id': 2936, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '45ed298290571dde', 'github_url': '', 'github_stars': 0, 'authors': ['Kyujin Han', 'Seungjoo Shin', 'Sunghyun Cho'], 'affiliations': ['POSTECH, Republic of Korea'], 'pdf_title_img': 'assets/pdf/title_img/2607.25802.jpg', 'data': {'categories': ['#benchmark', '#dataset', '#data', '#diffusion', '#games'], 'emoji': '🎬', 'ru': {'title': 'Явное моделирование слоев для реалистичного видеомонтажа', 'desc': 'В данной статье представлен метод TriLayer, который предлагает явные слоистые представления видео для улучшения видеомонтажа. Он использует большое количество данных, состоящих из композитных, фоновый и передних слоев видео с визуальными эффектами. Это позволяет моделям обучаться явным слоистым представлениям видео, а не полагаться на неявное извлечение информации. Приложенные задачи DBL-Insert и DBL-Decompose значительно улучшают качество вставки объектов и разложения слоев видео.'}, 'en': {'title': 'Revolutionizing Video Editing with Explicit Layer Modeling', 'desc': 'This paper addresses the limitations of current video editing systems that do not use explicit layered video representations. It introduces TriLayer, a large dataset that provides aligned composite, background, and foreground videos, allowing for better supervision in video editing tasks. The authors propose a dual-branch diffusion framework called DBL-Diffusion, which effectively models RGB composites and RGBA foreground layers. Their experiments show that using explicit layer modeling significantly enhances the quality of object insertion and video layer decomposition.'}}}, {'id': 'https://huggingface.co/papers/2607.26314', 'title': 'StealthBench: Measuring Operational Stealth in Autonomous Offensive-Security Agents', 'url': 'https://huggingface.co/papers/2607.26314', 'abstract': 'Abstract  Stealth, the discipline of achieving an objective without revealing your presence, capabilities, or collected intelligence, is what separates sophisticated operators from detectable ones. Elite security researchers and advanced persistent threats achieve their objectives unnoticed; autonomous agents increasingly inherit the same offensive tasks, but do they inherit the tradecraft? We introduce StealthBench,a benchmark that measures operational stealth in autonomous offensive-security agents across six operational security (OPSEC) dimensions. We extract 11 hand-verified OPSEC incidents from real bug-bounty and red-team trajectories, expanded into 14 dockerized task scenarios, where agents, despite finding real vulnerabilities, committed stealth failures inconsistent with standard operational tradecraft: embedding credentials in public uploads, deleting production resources to prove access, force-adding uninvolved users to demonstrate a race condition.   We evaluate agent trajectories using a 3-model large language model (LLM) judge panel with majority-vote aggregation, measuring safe success rate (solved and stealthy), Stealth@Solve (tradecraft quality among successful solves), and reckless solve rate (solved but cover blown). Our results show that no model exceeds 54% safe success rate (the compound metric requiring both task completion and stealth), confirming that OPSEC failures are systematic across model families. We release StealthBench as a public benchmark to support both the development of stealth-aware agents and automated OPSEC monitoring for autonomous offensive-security deployments. The interactive leaderboard, evaluation harness, and dataset are available at https://stealthbench.com.', 'score': 2, 'issue_id': 2937, 'pub_date': '2026-07-28', 'pub_date_card': {'ru': '28 июля', 'en': 'July 28', 'zh': '7月28日'}, 'hash': '088d930912d42f2d', 'github_url': '', 'github_stars': 0, 'authors': ['Ads Dawson', 'Adrian Wood'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.26314.jpg', 'data': {'categories': ['#benchmark', '#agents', '#security', '#agent_memory'], 'emoji': '🕵️\u200d♂️', 'ru': {'title': 'Скрытность автономных агентов в безопасности', 'desc': 'В данной статье представлена новая методика оценки скрытности автономных агентов в области безопасности с использованием StealthBench. Исследователи извлекли реальные инциденты, чтобы создать набор задач для определения уровня оперативной безопасности (OPSEC). Результаты показывают, что ни одна из моделей не достигла более 54% успеха при выполнении задач с учетом скрытности. StealthBench будет полезен для разработки агентов, учитывающих стандарты скрытности, и автоматического мониторинга OPSEC.'}, 'en': {'title': 'Measuring Stealth in Autonomous Security Agents', 'desc': 'This paper introduces StealthBench, a benchmark designed to evaluate the operational stealth of autonomous offensive-security agents across six dimensions of operational security (OPSEC). The study reveals that these agents, while capable of identifying real vulnerabilities, often fail to adhere to established stealth practices, leading to detectable actions. Using a panel of large language models to assess agent performance, the research highlights that no model achieved a safe success rate above 54%, indicating widespread OPSEC failures. StealthBench aims to facilitate the development of stealth-aware agents and improve automated monitoring for offensive-security operations.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agent_memory (3)', '#agents (6)', '#agi (2)', '#alignment', '#architecture (1)', '#audio', '#benchmark (7)', '#compression (1)', '#context_window', '#continual_learning (2)', '#data (1)', '#dataset (2)', '#diffusion (1)', '#ethics', '#games (3)', '#graphs', '#hallucinations', '#healthcare', '#inference', '#interpretability (1)', '#knowledge_graphs', '#leakage', '#long_context (2)', '#low_resource', '#machine_translation', '#math', '#memorization', '#memory', '#multilingual', '#multimodal (1)', '#open_source (1)', '#optimization (5)', '#plp', '#prompt_caching', '#prompting', '#rag', '#reasoning (3)', '#retrieval', '#retrieval_eval', '#rl (5)', '#rlhf (1)', '#robotics (1)', '#science', '#security (2)', '#session_memory', '#small_models (1)', '#story_generation', '#survey (1)', '#synthetic', '#tool_use', '#training (6)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-30 05:40',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-30 05:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-30 05:40')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
