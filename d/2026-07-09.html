    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";

                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.07708', 'title': 'Accurate, Interdisciplinary and Transparent Structure-property Understanding with Deep Native Structural Reasoning', 'url': 'https://huggingface.co/papers/2607.07708', 'abstract': 'Abstract SciReasoner is a multimodal scientific foundation model that enables interpretable structural reasoning across proteins, molecules, and crystals by discretizing structural elements into a unified vocabulary for enhanced prediction and scientific inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Structure-property relationships are foundational to biology, chemistry and materials science, where function, reactivity and physical response emerge from spatial, chemical and periodic organization. Mechanistically explaining these relationships requires interpreting structural evidence through scientific principles and physical constraints, from stereochemistry and bonding to symmetry, energetics and periodic order. However, applying artificial intelligence to this process presents a joint challenge of representation and reasoning: models must preserve domain-native structural information while showing how specific evidence supports predictions under these constraints. Here we introduce SciReasoner, a multimodal scientific foundation model for native structural reasoning across proteins, small molecules and inorganic crystals. SciReasoner discretizes coordinates, topologies and periodic connectivities into a unified structure-aware vocabulary, treating structural tokens as addressable evidence units during reasoning. In homology-controlled Gene Ontology prediction, SciReasoner improves Cellular Component annotation for low-homology and orphan-like proteins, increasing F_{max} from 0.42 to 0.55. In chemistry, it raises single-step retrosynthesis accuracy from 0.63 to 0.72 while generating fragment-level disconnection and precursor-verification traces. In materials science, its representations separate elemental and compound phases and resolve high- and low-band-gap regimes. Across 86 benchmarks, SciReasoner achieves state-of-the-art performance on 67 tasks. Double-blind expert evaluation rates its reasoning traces as preferred or at least comparable to those of a frontier large language model in 98% of cases. By making structure an inspectable substrate for reasoning under scientific constraints, SciReasoner connects accurate prediction with interpretable scientific inference.', 'score': 70, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '8363cd358aac1a83', 'github_url': '', 'github_stars': 0, 'authors': ['Chen Tang', 'Yizhou Wang', 'Jianyu Wu', 'Lintao Wang', 'Shixiang Tang', 'Pengze Li', 'Encheng Su', 'Jun Yao', 'Jiabei Xiao', 'Yuqi Shi', 'Jielan Li', 'Hongxia Hao', 'Zhangyang Gao', 'Fang Wu', 'Ben Fei', 'Xiangyu Yue', 'Pan Tan', 'Bozitao Zhong', 'Jinouwen Zhang', 'Aoran Wang', 'Yan Lu', 'Jiaheng Liu', 'Xinzhu Ma', 'Liang Hong', 'Mingyue Zheng', 'Phil Torr', 'Bowen Zhou', 'Wanli Ouyang', 'Lei Bai'], 'affiliations': ['Drug Discovery and Design Center, State Key Laboratory of Drug Research, Shanghai Institute of Materia Medica, Chinese Academy of Sciences, China', 'Fudan University, China', 'Nanjing University, China', 'Shanghai Artificial Intelligence Laboratory, China', 'Shanghai Jiao Tong University, China', 'Stanford University, USA', 'The Chinese University of Hong Kong, Hong Kong', 'The University of Science and Technology of China, China', 'University of Chinese Academy of Sciences, China', 'University of Oxford, UK', 'University of Sydney, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2607.07708.jpg', 'data': {'categories': ['#multimodal', '#reasoning', '#interpretability', '#science'], 'emoji': '🔬', 'ru': {'title': 'Новая эра интерпретируемого структурного моделирования', 'desc': 'SciReasoner — это мультимодальная научная модель, которая позволяет интерпретировать структурные связи между белками, молекулами и кристаллами. Модель использует унифицированный словарь для дискретизации структурных элементов, что улучшает предсказание и научные выводы. SciReasoner достигает выдающихся результатов в различных задачах, повышая точность аннотации и синтеза по сравнению с предыдущими методами. Она соединяет точные предсказания с интерпретируемыми научными выводами, что важно для биологии, химии и науки о материалах.'}, 'en': {'title': 'Unlocking Scientific Insights through Structural Reasoning', 'desc': 'SciReasoner is a multimodal foundation model designed for structural reasoning in the fields of biology, chemistry, and materials science. It converts structural elements into a unified vocabulary, allowing for better predictions and scientific inferences. The model excels in interpreting complex relationships between structure and function, improving accuracy in tasks like protein annotation and retrosynthesis. With state-of-the-art performance across numerous benchmarks, SciReasoner enhances the interpretability of AI predictions by linking them to scientific principles and constraints.'}}}, {'id': 'https://huggingface.co/papers/2607.07608', 'title': 'Dual Latent Memory in Vision-Language-Action Models for Robotic Manipulation', 'url': 'https://huggingface.co/papers/2607.07608', 'abstract': 'Abstract LaMem-VLA introduces a latent-memory-native framework that integrates historical experience into vision-language-action reasoning through coordinated memory components operating in the same latent space.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Mainstream Vision-Language-Action (VLA) models predict actions primarily from the current observation under a Markovian assumption, thus struggling with long-horizon, temporally dependent tasks. Existing memory-augmented VLAs either expand the observation window or retrieve history from the memory bank as auxiliary policy-side context. However, they leave memory outside the native latent embedding space of VLA reasoning, preventing historical experience from being fluidly interleaved with multimodal reasoning and action formation. To this end, we introduce LaMem-VLA, a latent-memory-native framework that reconstructs historical experience into latent memory tokens and directly interweaves them with VLA reasoning. At its core, LaMem-VLA introduces four coordinated components: (i) a curator that organizes historical experience into two complementary short-term and long-term memory vaults; (ii) a seeker that queries both vaults using the multimodal cognition to retrieve context-relevant evidence; (iii) a condenser that reconstructs the retrieved evidence into compact short-term and long-term latent memory tokens; and (iv) a weaver that injects these memory tokens with the current observation and instruction into one continuous embedding sequence. By representing, retrieving, and consuming historical experience entirely in the same continuous latent space, LaMem-VLA enables memory to directly participate in VLA reasoning and guide action generation under a bounded context. Extensive experiments on SimplerEnv and LIBERO demonstrate the superiority of our LaMem-VLA.', 'score': 44, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '4260145f557b0252', 'github_url': '', 'github_stars': 0, 'authors': ['Hongyu Qu', 'Jianzhe Gao', 'Xiaobin Hu', 'Shaohuan Yang', 'Xinlei Yu', 'Rui Yan', 'Wenguan Wang', 'Xiangbo Shu', 'Shuicheng Yan'], 'affiliations': ['Nanjing University of Science and Technology', 'National University of Singapore', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.07608.jpg', 'data': {'categories': ['#multimodal', '#agent_memory', '#memory'], 'emoji': '🧠', 'ru': {'title': 'Интеграция памяти в рассуждения VLA', 'desc': 'Статья представляет модель LaMem-VLA, которая интегрирует исторический опыт в рассуждения по зрению, языку и действиям (VLA) через координированные компоненты памяти. Этот подход позволяет эффективно использовать как краткосрочную, так и долгосрочную память, что улучшает обработку временно зависимых задач. Модель реконструирует исторический опыт в латентные токены памяти, которые плавно вписываются в многомодальное рассуждение. Эксперименты показывают, что LaMem-VLA превосходит существующие модели, улучшая генерацию действий на основе ограниченного контекста.'}, 'en': {'title': 'Integrating Memory for Enhanced VLA Reasoning', 'desc': "LaMem-VLA is a new framework that enhances vision-language-action (VLA) reasoning by integrating historical experiences directly into the reasoning process. It uses coordinated memory components that operate in the same latent space, allowing for a more fluid interaction between past experiences and current observations. The framework includes a curator for organizing memories, a seeker for retrieving relevant information, a condenser for creating memory tokens, and a weaver for combining these tokens with current inputs. This approach improves the model's ability to handle long-term tasks by making memory an integral part of the decision-making process."}}}, {'id': 'https://huggingface.co/papers/2607.07675', 'title': 'Scaling Mixture-of-Experts Video Pretraining for Embodied Intelligence', 'url': 'https://huggingface.co/papers/2607.07675', 'abstract': 'Abstract LingBot-Video presents a DiT-based video pretraining framework with Mixture-of-Experts architecture, specialized data augmentation, and multi-dimensional reward system for embodied intelligence applications.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Despite the recent promise in robot control, video generative models suffer from a domain mismatch due to their primary focus on content creation. For example, their design inherently prioritizes visual fidelity and creativity over computational efficiency and physical realism. In this work, we present LingBot-Video, a DiT-based video pretraining paradigm specifically tailored for embodied intelligence. From the architecture perspective, we adopt the Mixture-of-Experts (MoE), instead of dense, framework to achieve a better trade-off between modeling capacity and inference efficiency, and manage to scale it up from scratch. From the data perspective, we construct a data profiling engine that augments standard internet videos with extensive robot-oriented footage, encompassing manipulation, navigation, and egocentric perspectives, to equip the base model with an intrinsic understanding of actions and world dynamics. From the training perspective, we develop a multi-dimensional reward system to enforce the alignment regarding physical rationality and task completion, going beyond standard criteria such as aesthetics, prompt-following, and motion consistency. Comprehensive evaluations validate its performance and efficiency as a video foundation model. We contribute LingBot-Video as the inaugural large-scale, open-source MoE video foundation model to the community, in a pioneering effort to bridge digital creativity and physical actuation.', 'score': 38, 'issue_id': 2783, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'd4086358994a5dbe', 'github_url': '', 'github_stars': 0, 'authors': ['Shuailei Ma', 'Jiaqi Liao', 'Xinyang Wang', 'Jingjing Wang', 'Chaoran Feng', 'Zijing Hu', 'Chong Bao', 'Zichen Xi', 'Yuqi Gan', 'Weisen Wang', 'Yanhong Zeng', 'Qin Zhao', 'Zifan Shi', 'Wei Wu', 'Hao Ouyang', 'Qiuyu Wang', 'Shangzhan Zhang', 'Jiahao Shao', 'Yipengjing Sun', 'Liangxiao Hu', 'Lunke Pan', 'Nan Xue', 'Kecheng Zheng', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Ka Leong Cheng'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07675.jpg', 'data': {'categories': ['#architecture', '#agents', '#alignment', '#dataset', '#open_source', '#training', '#games'], 'emoji': '🤖', 'ru': {'title': 'LingBot-Video: новый подход к обучению видео для интеллекта', 'desc': 'Статья представляет LingBot-Video — фреймворк предварительного обучения видео, основанный на DiT и архитектуре Mixture-of-Experts. Он использует специализированное увеличение данных и многомерную систему вознаграждений для приложений в области встраиваемого интеллекта. LingBot-Video направлен на преодоление разницы между генерацией видео и робототехническим контролем, фокусируя внимание на физической реалистичности и эффективности вычислений. Проведенные оценки подтверждают его производительность как видео базовой модели и вносят вклад в сообщество как первый крупномасштабный открытый MoE видео фреймворк.'}, 'en': {'title': 'Bridging Digital Creativity and Physical Intelligence', 'desc': "LingBot-Video introduces a video pretraining framework based on DiT and utilizes a Mixture-of-Experts architecture to enhance efficiency and modeling capacity for embodied intelligence tasks. It addresses the limitations of existing video generative models by focusing on physical realism and computational efficiency rather than just visual quality. The framework incorporates specialized data augmentation techniques to enrich the training dataset with robot-centric video content, improving the model's understanding of actions and environmental dynamics. Additionally, a multi-dimensional reward system is implemented to ensure alignment with physical rationality and task completion, making it a significant advancement in video foundation models."}}}, {'id': 'https://huggingface.co/papers/2607.07534', 'title': 'Infinite Worlds with Versatile Interactions', 'url': 'https://huggingface.co/papers/2607.07534', 'abstract': 'Abstract An advanced world modeling system with extended interaction capabilities, real-time processing, diverse interactive elements, and multi-agent behavior control for collaborative virtual environments.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We present LingBot-World 2.0 (also known as LingBot-World-Infinity), an advanced iteration of LingBot-World featuring four distinct upgrades. (1) Our model achieves an unbounded interaction horizon while maintaining consistent output quality, benefiting from a carefully crafted causal pretraining paradigm. (2) Through distilling a real-time variant from the base model, our system guarantees rapid response time, sufficient to drive 720p video streams at 60 fps. (3) Compared to the previous version, this update introduces highly diverse interactive elements, comprising a broader spectrum of actions (e.g., attacking, archery, spell-casting, and shooting) alongside a richer variety of text-driven events. (4) We pioneer the integration of an agentic harness within the domain of world modeling, wherein a pilot agent is tasked with planning and executing character behaviors, while a director agent is responsible for synthesizing novel environmental elements as the scene progresses. Additionally, to facilitate a shared experience, we develop an interface that permits multiple players to simultaneously immerse themselves in this vivid world simulator. We pair our primary 14B model with a lightweight 1.3B counterpart, which supports effortless deployment on a single GPU.', 'score': 20, 'issue_id': 2784, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '9d84744c34237508', 'github_url': '', 'github_stars': 0, 'authors': ['Zelin Gao', 'Qiuyu Wang', 'Jiapeng Zhu', 'Jingye Chen', 'Zichen Liu', 'Qingyan Bai', 'Jiahao Wang', 'Yufeng Yuan', 'Hanlin Wang', 'Yichong Lu', 'Ka Leong Cheng', 'Haojie Zhang', 'Jian Gao', 'Tianrui Feng', 'Yuzheng Liu', 'Yao Yao', 'Yinghao Xu', 'Xing Zhu', 'Yujun Shen', 'Hao Ouyang'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07534.jpg', 'data': {'categories': ['#agents', '#agent_memory', '#games', '#multimodal', '#architecture'], 'emoji': '🌍', 'ru': {'title': 'Мир нового взаимодействия: LingBot-World 2.0', 'desc': 'В статье представлена новая версия модели мироощущения LingBot-World 2.0 с расширенными возможностями взаимодействия и многопользовательскими функциями. Модель обеспечивает быструю обработку данных в реальном времени и богатый набор интерактивных элементов. Она использует новый подход к предобучению, что улучшает качество вывода и позволяет поддерживать плавность видео в разрешении 720p при 60 кадрах в секунду. Также в системе внедрены агенты, которые управляют поведением персонажей и создают новые элементы окружения в процессе игры.'}, 'en': {'title': 'Article', 'desc': ''}}}, {'id': 'https://huggingface.co/papers/2607.04434', 'title': 'RoboDojo: A Unified Sim-and-Real Benchmark for Comprehensive Evaluation of Generalist Robot Manipulation Policies', 'url': 'https://huggingface.co/papers/2607.04434', 'abstract': 'Abstract RoboDojo presents a unified sim-and-real benchmark for evaluating generalist robot manipulation policies across diverse tasks and evaluation dimensions.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Generalist robot manipulation policies have advanced rapidly, yet existing benchmarks remain limited in systematically evaluating their capabilities. Many rely on simple, short-horizon, or skill-narrow tasks with limited capability coverage, and are often conducted only in simulation or only in the real world. Simulation enables scalable feedback but misses physical deployment challenges, while real-world evaluation is costly, time-consuming, and difficult to reproduce. We introduce RoboDojo, a unified sim-and-real benchmark for comprehensive evaluation of generalist robot manipulation policies. RoboDojo includes 42 simulation tasks and 18 real-world tasks covering diverse and complementary manipulation capabilities. The simulation benchmark evaluates five dimensions: generalization, memory, precision, long-horizon execution, and open-vocabulary instruction following, while the real-world benchmark exposes policies to challenging physical-world deployment conditions. RoboDojo supports scalable evaluation through heterogeneous parallel simulation in Isaac Sim and provides RoboDojo-RealEval, a reproducible real-world evaluation system with remote cloud access, standardized hardware, scene reset, evaluation protocol, and deployment interface. Together with XPolicyLab, policies can be integrated once and evaluated across simulation and real-world settings with minimal adaptation. We integrate 30 policies into XPolicyLab and evaluate them on RoboDojo, establishing a public leaderboard and systematic analysis of current policy performance. The website is available at http://robodojo-benchmark.com/.', 'score': 6, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '30aeccef8021ca46', 'github_url': '', 'github_stars': 0, 'authors': ['Tianxing Chen', 'Yue Chen', 'Zixuan Li', 'Junyuan Tang', 'Kailun Su', 'Haoran Lu', 'Weijie Wan', 'Baijun Chen', 'Songling Liu', 'Haowen Yan', 'Honghao Su', 'Zhiyang Dou', 'Kaixuan Wang', 'Dandan Zhang', 'Yunze Liu', 'Yan Qin', 'Qiwei Liang', 'Qiwei Wu', 'Zijian Lin', 'Wenwei Lin', 'Yuran Wang', 'Minghua He', 'Tianshu Wu', 'Ruihai Wu', 'Jingquan Zhou', 'Kai-Chong Lei', 'Haibao Yu', 'Yuanfeng Ji', 'Weiyang Jin', 'Guanyu Lin', 'Xiaofan Li', 'Qi Xiong', 'Renjing Xu', 'Zhongyu Li', 'Wenhao Chai', 'Enze Xie', 'Ziwei Wang', 'Yao Mu', 'Hao Dong', 'Wojciech Matusik', 'Mingyu Ding', 'Wenbo Ding', 'Ping Luo', 'Masayoshi Tomizuka'], 'affiliations': ['CMU', 'CUHK', 'HKUST (GZ)', 'IC', 'MIT', 'MMLab@HKU', 'NTU', 'NU', 'NUS', 'PKU', 'Princeton', 'SJTU', 'Stanford', 'THU', 'UC Berkeley', 'UNC', 'Yale', 'ZJU'], 'pdf_title_img': 'assets/pdf/title_img/2607.04434.jpg', 'data': {'categories': ['#long_context', '#open_source', '#benchmark', '#robotics', '#memory', '#games'], 'emoji': '🤖', 'ru': {'title': 'Универсальная бенчмарка для роботов', 'desc': 'Статья представляет RoboDojo — универсальную бенчмарку для оценки общих политик манипуляции роботами в различных задачах. RoboDojo включает 42 задачи в симуляции и 18 задач в реальном мире, обеспечивая разнообразие и взаимодополняемость навыков манипуляции. Бенчмарк оценивает такие параметры, как обобщение, память, точность и выполнение длительных инструкций. Это решение упрощает и делает воспроизводимой оценку робототехнических политик как в симуляции, так и в реальном мире.'}, 'en': {'title': 'RoboDojo: Bridging Sim and Real for Robot Evaluation', 'desc': 'RoboDojo is a new benchmark designed to evaluate generalist robot manipulation policies in both simulated and real-world environments. It addresses the limitations of existing benchmarks by providing a comprehensive set of tasks that cover various manipulation capabilities. The benchmark includes 42 simulation tasks and 18 real-world tasks, assessing dimensions like generalization, precision, and long-horizon execution. With tools for scalable evaluation and a public leaderboard, RoboDojo aims to enhance the reproducibility and effectiveness of robot policy assessments.'}}}, {'id': 'https://huggingface.co/papers/2607.07386', 'title': 'Sparse Delta Memory: Scaling the State of Linear RNNs through Sparsity', 'url': 'https://huggingface.co/papers/2607.07386', 'abstract': 'Abstract Sparse Delta Memory extends gated linear RNNs with sparse addressing to dramatically increase hidden state capacity for improved long-context learning and retrieval while maintaining computational efficiency.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Linear attention models allow a fixed state size and a fixed amount of compute per token. However, due to their limited state size, linear attention models fall behind in long-context recall compared to softmax-attention-based transformer architectures. Increasing the state size of linear attention improves recall performance but at the cost of higher FLOPs. In this work, we introduce Sparse Delta Memory (SDM), an architecture that scales the hidden state of gated linear RNNs to orders of magnitude higher capacity using a sparse addressing scheme. SDM extends the Gated DeltaNet architecture by replacing the dense key-value outer product with sparse reads and writes to a large explicit memory. We show that, under an isoFLOP constraint and with an identical number of parameters, a higher state memory capacity significantly improves performance on in-context learning and long-context retrieval tasks. Moreover, by learning the initial state of the SDM memory and therefore using it as a parametric memory, we show that the model further improves on a wide range of common-knowledge and reasoning tasks.', 'score': 4, 'issue_id': 2785, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'e4f9d4baa623c3ea', 'github_url': '', 'github_stars': 0, 'authors': ['Loïc Cabannes', 'Pierre-Emmanuel Mazaré', 'Gergely Szilvasy', 'Matthijs Douze', 'Maria Lomeli', 'Ilze Amanda Auzina', 'Justin Carpentier', 'Gabriel Synnaeve', 'Hervé Jégou'], 'affiliations': ['Inria Paris & ENS-PSL University', 'Meta FAIR', 'University of Tübingen'], 'pdf_title_img': 'assets/pdf/title_img/2607.07386.jpg', 'data': {'categories': ['#retrieval', '#architecture', '#long_context', '#memory', '#session_memory', '#reasoning'], 'emoji': '🧠', 'ru': {'title': 'Новый подход к обучению длинного контекста с помощью SDM', 'desc': 'Статья представляет архитектуру Sparse Delta Memory (SDM), которая увеличивает ёмкость скрытого состояния в линейных RNN с использованием разреженной адресации. Это позволяет улучшить обучение и извлечение информации из длинного контекста, сохраняя при этом вычислительную эффективность. SDM заменяет плотный ключ-значение на разреженные операции чтения и записи в большую явную память. В результате, при одинаковом количестве параметров, увеличение ёмкости памяти значительно улучшает результаты задач по обучению и извлечению информации в контексте.'}, 'en': {'title': 'Boosting Long-Context Learning with Sparse Delta Memory', 'desc': 'The paper introduces Sparse Delta Memory (SDM), an advanced architecture that enhances gated linear RNNs by incorporating sparse addressing to significantly boost hidden state capacity. This improvement allows for better long-context learning and retrieval while keeping computational efficiency in check. Unlike traditional linear attention models, which struggle with long-context recall, SDM achieves higher performance without increasing the number of floating-point operations (FLOPs). Additionally, by utilizing a learned initial state as a parametric memory, SDM excels in various common-knowledge and reasoning tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.06838', 'title': 'WildCity: A Real-World City-Scale Testbed for Rendering, Simulation, and Spatial Intelligence', 'url': 'https://huggingface.co/papers/2607.06838', 'abstract': 'Abstract WildCity presents a large-scale multimodal dataset for urban navigation and spatial representation, enabling research into AI systems that can perceive and reason about city-scale environments similar to human cognitive capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Humans can navigate an unfamiliar city and gradually form a coherent spatial mental map spanning tens of square kilometers. Can AI build spatial representations at a comparable scale? Although recent foundation models have advanced scene reconstruction and embodied intelligence, scaling to entire cities remains an open challenge, primarily due to the lack of city-scale data. To bridge the gap, we introduce WildCity, a real-world multimodal dataset collected by autonomous fleets traversing complex urban environments. Our dataset includes 18 trajectories, each averaging 83.7 kilometers in length, and preserves the core challenges of in-the-wild perception, e.g., dynamic objects, lighting variations, and imperfect camera poses. We further establish an urban-tailored reconstruction baseline and convert the reconstructed environments into a closed-loop simulator. Beyond the dataset and baseline, we systematically analyze the key challenges on the path to simulation-ready urban digital twins: scalability, extrapolation, and uncertainty. Ultimately, WildCity aims to catalyze progress not only in city-scale rendering, but more broadly in the pursuit of AI that can perceive, remember, and reason across space at a scale comparable to human cognition. Project page: https://han-xiangyu.github.io/Wild-City/', 'score': 4, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '9c6125052d8526f6', 'github_url': '', 'github_stars': 0, 'authors': ['Xiangyu Han', 'Mengyu Yang', 'Jiaqi Li', 'Bowen Chang', 'Ziyu Chen', 'Hexu Zhao', 'Rahul Kumar Agrawal', 'Anthony Rodriguez', 'Fiona Hua', 'Marco Pavone', 'Chen Feng', 'Yiming Li'], 'affiliations': ['May Mobility, Ann Arbor, MI, USA', 'NVIDIA, Santa Clara, CA, USA', 'New York University, New York, NY, USA', 'Stanford University, Stanford, CA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.06838.jpg', 'data': {'categories': ['#reasoning', '#agents', '#dataset', '#survey', '#multimodal'], 'emoji': '🏙️', 'ru': {'title': 'Создание цифровых двойников городов с помощью AI', 'desc': 'Статья представляет датасет WildCity, который был создан для исследования навигации и пространственного представления в городских условиях. Датасет включает в себя 18 маршрутов, каждый из которых в среднем составляет 83.7 километра и отражает сложности восприятия в реальных условиях. Авторы также предлагают базовый метод реконструкции городского окружения и обсуждают ключевые проблемы, такие как масштабируемость и неопределенность. Целью WildCity является продвижение вперед в области создания цифровых двойников городов и разработки AI, способного воспринимать и размышлять о пространстве на уровне, сопоставимом с человеческим восприятием.'}, 'en': {'title': 'Navigating Cities: Bridging AI and Human Spatial Understanding', 'desc': 'WildCity introduces a large dataset designed for urban navigation and spatial understanding, allowing AI to learn how to perceive city environments like humans do. It consists of 18 long trajectories collected by autonomous vehicles, capturing real-world challenges such as moving objects and varying light conditions. The dataset aims to help AI systems build spatial representations of entire cities, addressing the current limitations in city-scale data. Additionally, it provides a baseline for urban reconstruction and explores key challenges in creating accurate digital twins of urban spaces.'}}}, {'id': 'https://huggingface.co/papers/2606.30111', 'title': 'Automating the Design of Embodied Agent Architectures', 'url': 'https://huggingface.co/papers/2606.30111', 'abstract': 'Abstract Automated agent architecture search demonstrates potential for improving embodied agent performance while revealing challenges related to optimization signals, local optima, and credit assignment in simulation-based training.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Embodied agents are typically built as hand-designed compositions of perception, memory, planning, and action modules. This modularity exposes a large architectural design space, but current systems still rely on researcher intuition to choose where information is stored, how observations are processed, and how model calls are connected. Agent Architecture Search (AAS) automates such design for text-domain agents, but has not been systematically evaluated on perceptual embodied agents through simulator rollouts. We study this transfer. We introduce AgentCanvas, a typed-graph runtime that hosts embodied executors as editable node-and-wire programs with simulator-aware execution and episode-level logs, and KDLoop, a coding-agent search procedure that cycles through proposal, critique, experiment, and distillation, with triggered reflection after stalls. We evaluate three AAS variants across four embodied executors spanning vision-language navigation, embodied question answering, and language-conditioned manipulation. The resulting 3x4 matrix shows that architecture-level search can produce deployable and directional success-rate gains on embodied tasks, while one apparent high-scoring candidate is rejected as leak-bearing. At the same time, the experiments expose constraints that are muted in text-domain AAS: optimization signals can be masked by rollout noise, search can become trapped in local edit basins, and episode-level credit assignment only partially emerges even when detailed logs are available. These results characterize both the promise and the current limits of automated architecture search for embodied agents.', 'score': 4, 'issue_id': 2784, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': 'd5bfe9e24f2d6b0b', 'github_url': '', 'github_stars': 0, 'authors': ['Jian Zhou', 'Sihao Lin', 'Jin Li', 'Shuai Fu', 'Gengze Zhou', 'Qi Wu'], 'affiliations': ['Australian Institute for Machine Learning, University of Adelaide, SA, Australia'], 'pdf_title_img': 'assets/pdf/title_img/2606.30111.jpg', 'data': {'categories': ['#transfer_learning', '#training', '#agents', '#agent_memory', '#architecture', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Автоматизированный поиск архитектур для встроенных агентов', 'desc': 'В данной статье рассматривается автоматизированный поиск архитектур агентов, что может улучшить производительность встроенных агентов. Исследуются проблемы, связанные с сигналами оптимизации, локальными минимумами и назначением заслуг в обучении с использованием симуляций. Авторы представляют AgentCanvas, среду для редактируемых программ с учетом симуляторов, и KDLoop, процедуру поиска, которая включает предложения, критику, эксперименты и дистилляцию. Результаты показывают, что поиск на уровне архитектуры может повысить успешность выполнения задач, однако также выявляют ограничения, которые отсутствуют в текстовых задачах.'}, 'en': {'title': 'Automating Agent Design for Better Performance', 'desc': 'This paper explores the use of automated agent architecture search (AAS) to enhance the performance of embodied agents, which are systems that interact with the physical world. The authors introduce AgentCanvas, a framework that allows for the flexible design of agent architectures, and KDLoop, a method for iteratively improving these designs through experimentation and feedback. The study evaluates various AAS approaches on tasks like vision-language navigation and embodied question answering, revealing both successes and challenges in optimization and credit assignment. Ultimately, the findings highlight the potential benefits of AAS while also addressing the limitations faced in real-world applications compared to text-based agents.'}}}, {'id': 'https://huggingface.co/papers/2607.07508', 'title': 'Single-Rollout Asynchronous Optimization for Agentic Reinforcement Learning', 'url': 'https://huggingface.co/papers/2607.07508', 'abstract': 'Abstract Asynchronous reinforcement learning with single-rollout optimization addresses stability issues in LLM training for complex tasks, outperforming existing methods in coding and reasoning benchmarks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning (RL) is becoming increasingly important for post-training large language models (LLMs). Previous RL pipelines for LLMs were mostly synchronous and batch-interleaved, which is inefficient for long-horizon agentic tasks. Recently, asynchronous RL has emerged as a more efficient alternative by updating the model as rollouts arrive. However, existing asynchronous RL systems often emphasize throughput, while leaving training stability and task effectiveness largely underexplored. For example, a key challenge is that group-wise sampling in the widely-used GRPO framework does not naturally fit asynchronous agentic training. In this paper, we present Single-rollout Asynchronous Optimization (SAO) to address the stability and off-policy challenges in asynchronous RL. To reduce off-policy effects and improve generalization, we replace group-wise sampling with single-rollout sampling, that is, using one rollout per prompt. We further improve this single-rollout strategy with practical value-model training designs. To improve optimization stability, we introduce a strict double-side token-level clipping strategy. SAO is able to train stably for one thousand steps and consistently outperform GRPO and its variants on agentic coding and reasoning benchmarks, such as SWE-Bench Verified, BeyondAIME, and IMOAnswerBench. We also demonstrate that single-rollout RL is particularly effective in a simulated online learning setting, where the model must adapt to changing evolving environments. To this end, SAO is successfully deployed in the agentic RL pipeline for training the open GLM-5.2 model (750B-A40B).', 'score': 3, 'issue_id': 2785, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'cdd9cf0fdd089529', 'github_url': '', 'github_stars': 0, 'authors': ['Zhenyu Hou', 'Yujiang Li', 'Jie Tang', 'Yuxiao Dong'], 'affiliations': ['Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.07508.jpg', 'data': {'categories': ['#training', '#optimization', '#agi', '#games', '#benchmark', '#agents', '#rl', '#reasoning'], 'emoji': '🤖', 'ru': {'title': 'Стабильное обучение крупных языковых моделей с помощью SAO', 'desc': 'В статье рассматривается метод асинхронного обучения с подкреплением (RL) для крупных языковых моделей (LLM), который решает проблемы стабильности при обучении на сложных задачах. Предложенный метод, называемый Single-rollout Asynchronous Optimization (SAO), использует индивидуальные прогоны для улучшения генерализации и стабильности обучения. Это позволяет модели эффективно обновляться по мере поступления данных, улучшая результаты по сравнению с традиционными методами. Кроме того, SAO успешно применяется в симулированной настройке онлайн-обучения, что делает его особенно полезным для адаптации к изменяющимся условиям.'}, 'en': {'title': 'Stability Meets Efficiency in Asynchronous RL for LLMs', 'desc': 'This paper introduces Single-rollout Asynchronous Optimization (SAO) to enhance the stability and effectiveness of asynchronous reinforcement learning (RL) for large language models (LLMs). Traditional RL methods often struggle with stability during training, especially for complex tasks, but SAO improves this by using single-rollout sampling instead of group-wise sampling. The authors also implement a double-side token-level clipping strategy to further stabilize optimization. As a result, SAO outperforms existing methods on various coding and reasoning benchmarks, demonstrating its effectiveness in dynamic learning environments.'}}}, {'id': 'https://huggingface.co/papers/2607.06624', 'title': 'AgentLens: Production-Assessed Trajectory Reviews for Coding Agent Evaluation', 'url': 'https://huggingface.co/papers/2607.06624', 'abstract': 'Abstract  We present AgentLens, a production-assessed benchmark for interactive code agents. Most code-agent benchmarks reduce a run to a single bit -- did the task pass? -- but the people who actually use these agents experience the entire trajectory: how the agent follows instructions, uses its tools, verifies its own work, recovers from mistakes, and talks to them along the way. AgentLens evaluates that whole trajectory. It pairs formal verification, where an objective check exists, with LLM-written trajectory reviews and side-by-side comparisons, so that each run yields a readable explanation of why the score is what it is. This makes AgentLens useful for more than ranking models: we use it to diagnose model behavior, compare successive versions of our own agent, and catch product regressions in a nightly evaluation pipeline. We release the benchmark as open source at https://github.com/agent-lens/agent-lens-bench.', 'score': 3, 'issue_id': 2786, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': '20c3194bd2576d47', 'github_url': '', 'github_stars': 0, 'authors': ['Andrey Podivilov', 'Vadim Lomshakov', 'Sergey Savin', 'Matvei Startsev', 'Roman Pozharskiy', 'Maksim Parshin', 'Sergey Nikolenko'], 'affiliations': ['Explyt', 'St. Petersburg Department of the Steklov Institute of Mathematics', 'St. Petersburg State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.06624.jpg', 'data': {'categories': ['#open_source', '#interpretability', '#benchmark', '#agent_memory', '#agents'], 'emoji': '🔍', 'ru': {'title': 'Полный анализ работы кодовых агентов', 'desc': 'Статья представляет новый метод оценки интерактивных кодовых агентов под названием AgentLens. В отличие от традиционных методов, которые оценивают лишь итоговый результат, AgentLens анализирует весь процесс выполнения задания, включая взаимодействие агента с инструментами и исправление ошибок. Такой подход позволяет не только ранжировать модели, но и диагностировать поведение агентов и отслеживать изменения в их производительности. Бенчмарк будет доступен в открытом доступе для использования и анализа.'}, 'en': {'title': 'Evaluating the Full Journey of Code Agents', 'desc': "AgentLens is a new benchmark designed to evaluate interactive code agents by assessing their entire performance trajectory rather than just a pass/fail outcome. It combines formal verification with reviews generated by large language models (LLMs) to provide detailed explanations of the agent's actions and decisions. This comprehensive evaluation helps in diagnosing model behavior, comparing different versions of the agent, and identifying regressions in product performance. By making this benchmark open source, it encourages broader use and improvement in the field of code agents."}}}, {'id': 'https://huggingface.co/papers/2607.04939', 'title': 'Teaching LLMs a Low-Resource Language: Enhancing Code Completion in Pharo', 'url': 'https://huggingface.co/papers/2607.04939', 'abstract': "Abstract Large language models can be adapted for low-resource programming languages through specialized training pipelines and benchmarks, achieving superior code completion performance compared to general-purpose models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large Language Models (LLMs) unlocked new possibilities in automated code writing, becoming the backbone of most code completion tools. While LLMs excel in mainstream languages, they often lack support for the so-called low-resource languages where training data is scarce. As a result, these languages lag behind in the quality of code completion tooling available to their communities. A concrete example is Pharo, a Smalltalk-inspired language whose IDE currently offers only single-token completion. In this work, we report on our experience bringing LLM-based code completion to Pharo. First, we describe an end-to-end pipeline that combines Pharo-specific data curation, continued pre-training and fine-tuning of open code LLMs. Second, we introduce a set of Pharo code completion benchmarks designed to evaluate whether models (i) learn Pharo's syntax and (ii) accurately complete masked Pharo code from real-world GitHub repositories. Third, we show empirically that Pharo-specialized models substantially outperform their original base checkpoints and also exceed the accuracy of substantially larger code LLMs on Pharo completion. Overall, our case study demonstrates the feasibility of bringing strong LLM-based code completion to low-resource programming languages, with models small enough to provide ``real-time'' in-IDE support.", 'score': 2, 'issue_id': 2784, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': 'e2852eaacf4174d7', 'github_url': '', 'github_stars': 0, 'authors': ['Kilian Kier', 'Alessandro Giagnorio', 'Omar AbedelKader', 'Oleksandr Zaitsev', 'Robert Peharz', 'Romain Robbes', 'Gabriele Bavota', 'Stéphane Ducasse'], 'affiliations': ['CIRAD, UMR SENS', 'CNRS, University of Bordeaux Bordeaux INP, LaBRI, UMR5800', 'Graz University of Technology', 'Graz University of Technology and Lifeware SA', 'Software Institute USI Università della Svizzera italiana', 'Univ. Lille, Inria, CNRS, Centrale Lille UMR 9189 CRIStAL'], 'pdf_title_img': 'assets/pdf/title_img/2607.04939.jpg', 'data': {'categories': ['#data', '#open_source', '#benchmark', '#training', '#small_models', '#dataset', '#low_resource'], 'emoji': '💻', 'ru': {'title': 'Улучшение автозавершения кода для языков с ограниченными ресурсами', 'desc': 'Статья описывает, как большие языковые модели (LLMs) могут быть адаптированы для языков программирования с ограниченными ресурсами, таких как Pharo. Авторы разработали специализированный процесс обучения и тестирования для улучшения качества автоматической генерации кода. В ходе исследования они показали, что модели, адаптированные под Pharo, превосходят более крупные модели по точности завершения кода. Это открывает новые возможности для создания инструментов разработки на низкоресурсных языках.'}, 'en': {'title': 'Empowering Low-Resource Languages with Specialized LLMs', 'desc': "This paper discusses how large language models (LLMs) can be effectively adapted for low-resource programming languages, specifically focusing on Pharo. It presents a specialized training pipeline that includes data curation, continued pre-training, and fine-tuning to enhance code completion capabilities. The authors introduce benchmarks to evaluate the models' understanding of Pharo's syntax and their ability to complete code accurately. Results show that Pharo-specialized models significantly outperform general-purpose models, demonstrating the potential for improved code completion in low-resource languages."}}}, {'id': 'https://huggingface.co/papers/2607.05966', 'title': 'Imagined Rollouts are Kinematic, Not Dynamic: A Diagnosis of Long-Horizon World-Model Failure', 'url': 'https://huggingface.co/papers/2607.05966', 'abstract': "Abstract World models exhibit long-horizon failures due to kinematic rather than dynamic imagination, as demonstrated by measuring imagined kinematic-consistency error which remains flat while policy rewards collapse across friction boundaries.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Long-horizon failure in world models is conventionally attributed to compounding error, a generic framing that does not distinguish what kind of error compounds. We propose a kinematic-vs-dynamic reframing: world models tend to imagine kinematically rather than dynamically. We operationalize this as the imagined Kinematic-Consistency Error, a per-step diagnostic that measures how far a rollout departs from a closed-form kinematic null, paired with a perturbation protocol that tests whether iKCE responds when physical conditions cross a regime boundary. We instantiate the diagnostic on a released DreamerV3 checkpoint trained on DMC walker-walk, where imagined iKCE runs roughly two orders of magnitude above that of matched real-physics rollouts. Across a friction sweep that crosses the gait-collapse boundary, the model's iKCE stays statistically flat even as the trained policy's reward collapses through the same range, providing the kinematic-not-dynamic signature. The diagnostic distinguishes kinematic from dynamic imagination at horizons longer than the embodiment's gait period.", 'score': 1, 'issue_id': 2784, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'c4ab3b0fb38f5a90', 'github_url': '', 'github_stars': 0, 'authors': ['Finn Rasmus Schäfer', 'Korbinian Moller', 'Yuan Gao', 'Christian Oefinger', 'Sebastian Schmidt', 'Johannes Betz'], 'affiliations': ['Autonomous Vehicle Systems Lab Technical University of Munich, Garching b. Munchen, Germany', 'Data Analytics and Machine Learning Group Technical University of Munich, Garching b. Munchen, Germany'], 'pdf_title_img': 'assets/pdf/title_img/2607.05966.jpg', 'data': {'categories': ['#agents', '#long_context', '#rl', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Кинематическое против динамического воображения', 'desc': 'В данной статье рассматриваются проблемы долгосрочного прогнозирования в моделях мира, которые связаны с кинематическим и динамическим воображением. Исследование показывает, что ошибка кинематической согласованности остается постоянной, в то время как вознаграждение политики падает на границах трения. Авторы предлагают новый подход к диагностике, который позволяет различить кинематическое и динамическое воображение. Проведенные эксперименты демонстрируют, что ошибка кинематической согласованности значительно выше у моделей, чем у реальных физических процессоров.'}, 'en': {'title': 'Understanding Kinematic vs. Dynamic Imagination in World Models', 'desc': "This paper discusses the limitations of world models in long-horizon predictions, specifically focusing on the difference between kinematic and dynamic imagination. It introduces the concept of imagined Kinematic-Consistency Error (iKCE) to measure how accurately a model's predictions align with kinematic principles. The authors demonstrate that while the model's rewards decline when facing changes in physical conditions, the iKCE remains constant, indicating a failure to adapt dynamically. This distinction helps to better understand the types of errors that compound in world models over time."}}}, {'id': 'https://huggingface.co/papers/2607.00302', 'title': 'Wake up for Touch! Mask-isolated Tactile Alignment Learning in MLLMs', 'url': 'https://huggingface.co/papers/2607.00302', 'abstract': 'Abstract Splash is a mask-isolated tactile alignment learning framework that enables multimodal LLMs to acquire tactile sensing capabilities without sacrificing vision-language reasoning through selective parameter updating that prevents catastrophic forgetting.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Touch supplies the physical grounding needed to perceive intrinsic material properties, such as friction and compliance, that vision alone often cannot resolve. Recent efforts for equipping multimodal LLMs with this tactile sense, however, expose a zero-sum trade-off: the limited parameter budget of compact models forces a choice between acquiring the new sensory modality and preserving the established vision-language reasoning. We present Splash, a mask-isolated tactile alignment learning framework for MLLMs. Splash quantifies the significance of each pretrained parameter, and partitions the parameter space into a dormant and critical subspace. While the frozen critical subspace acts as a stable anchor to safeguard general visual knowledge, Splash updates the isolated dormant subspace to internalize tactile alignment towards LLMs. This selective, non-destructive expansion effectively prevents catastrophic forgetting and ensures non-destructive modality expansion. Extensive experiments show that Splash effectively achieves tactile reasoning without additional inference overhead in the LLM part, demonstrating state-of-the-art performance on visuo-tactile benchmarks, including SSVTP, TVL, and TacQuad, while preserving its original general-purpose capabilities.', 'score': 0, 'issue_id': 2785, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '4ca6bcfa5eb0028b', 'github_url': '', 'github_stars': 0, 'authors': ['Yoonhyung Park', 'Minji Kim', 'Sungwon Moon', 'Jiyoung Lee'], 'affiliations': ['Division of Artificial Intelligence & Software, Ewha Womans University'], 'pdf_title_img': 'assets/pdf/title_img/2607.00302.jpg', 'data': {'categories': ['#training', '#continual_learning', '#multimodal', '#optimization'], 'emoji': '🖐️', 'ru': {'title': 'Новая эра многомодального обучения с тактильными ощущениями', 'desc': 'Splash представляет собой фреймворк обучения тактильной согласованности для многомодальных LLM, который позволяет моделям развивать тактильные способности, не жертвуя зрительно-языковыми рассуждениями. Он использует выборочное обновление параметров, предотвращая катастрофическое забвение информации. Фреймворк выделяет важность предобученных параметров и разделяет их на критическую и неактивную подпространства. Эксперименты показывают, что Splash достигает высоких результатов в тактильном рассуждении, сохраняя при этом оригинальные возможности модели без дополнительных затрат на вывод.'}, 'en': {'title': 'Enhancing LLMs with Tactile Sensing Without Sacrificing Vision', 'desc': 'The paper introduces Splash, a framework designed to enhance multimodal large language models (LLMs) with tactile sensing abilities while maintaining their vision-language reasoning. It addresses the challenge of catastrophic forgetting by selectively updating parameters in a dormant subspace, allowing the model to learn new tactile information without losing existing visual knowledge. By quantifying the importance of each parameter, Splash ensures that critical visual capabilities remain stable while integrating tactile alignment. The framework demonstrates impressive performance on visuo-tactile benchmarks, achieving state-of-the-art results without increasing inference overhead.'}}}];
        const articlesContainer = document.getElementById('articles-container');

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);

            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);

        document.getElementById('filter-logic-or').addEventListener('change', () => {

        }

            categories.forEach(category => {

            if (index === -1) {

                selectedCategories.splice(index, 1);
                button.classList.remove('active');

            }

        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {

            } else if (sortBy === 'pub_date') {

            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-09 17:25',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-09 17:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-09 17:25')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
