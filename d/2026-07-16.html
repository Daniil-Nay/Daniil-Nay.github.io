    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

                flag.addEventListener('click', () => {

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.10400', 'title': 'SynthDocBench: Controlled Benchmark for Long-Context Visual Document Understanding', 'url': 'https://huggingface.co/papers/2607.10400', 'abstract': 'Abstract  Vision language models (VLMs) have achieved strong performance on visual document understanding benchmarks such as DocVQA, ChartQA, and MMLongBench-Doc. However, real-world documents combine multiple factors such as length, layout complexity, modality, and question difficulty, which makes it difficult to attribute model failures to specific causes. We introduce SynthDocBench, a fully synthetic benchmark for long-context visual document understanding that systematically controls factors including document length, layout structure, modality composition, and question type. The benchmark is constructed using a combinatorial design, each factor is varied independently across generated documents, enabling controlled analysis of model behavior. Documents are generated end to end using an LLM pipeline across six layout archetypes, with a 40 percent random override to prevent models from exploiting spurious correlations. Additionally, SynthDocBench spans long-context documents with substantially greater length and structural diversity than existing benchmarks. Evaluating seven frontier VLMs, we uncover three failure modes that existing benchmarks cannot surface: sharp degradation with document length, a systematic positional sensitivity in which the middle third of a document is hardest for five of six models and five of six models show a negative Early-to-Late trend (steepest decline: 8.3 percentage points), and breakdown of chart comprehension in long-document settings. These results suggest that current models may be overfitting to benchmark artifacts rather than achieving robust long-context visual document understanding.', 'score': 50, 'issue_id': 2826, 'pub_date': '2026-07-11', 'pub_date_card': {'ru': '11 июля', 'en': 'July 11', 'zh': '7月11日'}, 'hash': '34ff49c9c8a40817', 'github_url': '', 'github_stars': 0, 'authors': ['Abhigya Verma', 'Khyati Mahajan', 'Amit Kumar Saha', 'Shruthan Radhakrishna', 'Sagar Davasam', 'Vikas Yadav', 'Sai Rajeswar Mudumba'], 'affiliations': ['Mila', 'ServiceNow AI', 'Université de Montréal'], 'pdf_title_img': 'assets/pdf/title_img/2607.10400.jpg', 'data': {'categories': ['#multimodal', '#synthetic', '#long_context', '#benchmark'], 'emoji': '📄', 'ru': {'title': 'Новый подход к оценке моделей понимания документов', 'desc': 'В данной статье представлен новый синтетический бенчмарк SynthDocBench для оценки моделей визуального документального понимания. Он контролирует такие факторы, как длина документа, структура макета, состав модальностей и тип вопросов. Это позволяет проводить тщательный анализ поведения моделей и выявлять их слабые места, которые не обнаруживаются на существующих бенчмарках. Результаты показывают, что современные модели могут переобучаться на артефактах бенчмарков, а не достигать надежного понимания визуальных документов в длинном контексте.'}, 'en': {'title': 'Unveiling VLM Limitations with SynthDocBench', 'desc': 'This paper introduces SynthDocBench, a synthetic benchmark designed to evaluate visual language models (VLMs) on long-context visual document understanding. It systematically varies factors like document length, layout complexity, and question types to analyze model performance more effectively. The study reveals that existing VLMs struggle with specific challenges, such as increased document length and positional sensitivity, which are not captured by current benchmarks. The findings indicate that these models may be overfitting to existing benchmarks rather than demonstrating true understanding of complex documents.'}}}, {'id': 'https://huggingface.co/papers/2607.11886', 'title': 'Read It Back: Pretrained MLLMs Are Zero-Shot Reward Models for Text-to-Image Generation', 'url': 'https://huggingface.co/papers/2607.11886', 'abstract': "Abstract  In this paper, we propose SpectraReward, a training-free reward function that turns pretrained MLLMs into off-the-shelf reward models for image-generation reinforcement learning. Instead of asking the MLLM to judge a generated image or answer decomposed verification questions, SpectraReward measures how well the original prompt can be recovered from the generated image through a single image-conditioned, teacher-forced forward pass. We use the average image-conditioned prompt log-likelihood as the reward, directly reusing the MLLM's pretrained image-text alignment ability without preference labels, reward-model fine-tuning. We further introduce Self-SpectraReward, a special case for unified multimodal models where the policy's own understanding branch serves as the reward model for its generation branch, forming a closed-loop self-improving framework without external reward models or external knowledge. Extensive experiments validate SpectraReward through a broad image-generation RL study covering two diffusion models, three RL algorithms, nine reward MLLM backbones from four MLLM families spanning 4B to 235B parameters, and five out-of-distribution text-to-image benchmarks. Results show that both SpectraReward and Self-SpectraReward significantly and consistently improve generation performance and outperform prior MLLM-derived reward training methods. Further analysis reveals that larger reward MLLMs are not always better, while Self-SpectraReward can match or surpass much larger external reward models, suggesting that reward-policy alignment is a key factor for effective image-generation RL. Project Page: https://huangrh99.github.io/SpectraReward/", 'score': 40, 'issue_id': 2822, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '6cd66e079f508eef', 'github_url': '', 'github_stars': 0, 'authors': ['Runhui Huang', 'Qihui Zhang', 'Zhe Liu', 'Yu Gao', 'Jie Wu', 'Hengshuang Zhao'], 'affiliations': ['ByteDance Seed', 'Peking University', 'The University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.11886.jpg', 'data': {'categories': ['#diffusion', '#rlhf', '#games', '#training', '#optimization', '#multimodal', '#rl'], 'emoji': '✨', 'ru': {'title': 'Новая эра вознаграждений для генерации изображений', 'desc': 'В данной статье представлен SpectraReward, функция вознаграждения, не требующая обучения, которая преобразует предварительно обученные MLLM в модели вознаграждения для обучения с подкреплением в задачах генерации изображений. SpectraReward оценивает, насколько хорошо можно восстановить исходный запрос из сгенерированного изображения, используя встроенные возможности MLLM без необходимости настройки модели вознаграждения. Также предлагается Self-SpectraReward, который использует собственное понимание модели как функцию вознаграждения, что создает замкнутую систему самосовершенствования. Эксперименты показывают, что оба подхода значительно улучшают качество генерации изображений и превосходят предыдущие методы обучения моделей вознаграждения.'}, 'en': {'title': 'Transforming MLLMs into Reward Models for Image Generation', 'desc': "This paper introduces SpectraReward, a novel reward function that utilizes pretrained Multimodal Language Models (MLLMs) for image generation in reinforcement learning without the need for additional training. It evaluates how well a generated image can recreate the original prompt by measuring the log-likelihood of the prompt given the image. The method leverages the MLLM's existing image-text alignment capabilities, eliminating the need for preference labels or fine-tuning. Additionally, Self-SpectraReward is proposed, allowing the model to use its own understanding to improve its generation process in a self-reinforcing manner, leading to enhanced performance in image generation tasks."}}}, {'id': 'https://huggingface.co/papers/2607.05382', 'title': 'Search Beyond What Can Be Taught: Evolving the Knowledge Boundary in Agentic Visual Generation', 'url': 'https://huggingface.co/papers/2607.05382', 'abstract': 'Abstract  Visual generators excel at rendering, but they confidently fabricate what they do not know. User requests are unbounded, evolving, and deeply long-tailed: new characters, trending entities, post-cutoff events, and more. This world-knowledge bottleneck is structural: generators are trained on fixed corpora, but the visual world is open-ended. We construct SearchGen-20K and SearchGen-Bench, with 20,839 prompts spanning twelve failure categories and twenty-two domains, paired with a pre-executed multimodal SearchGen-Corpus-1M to support offline, reproducible research. On SearchGen-Bench, frontier open generators score only 21 to 28 out of 100, a 40-point collapse invisible to existing benchmarks. The natural remedy is to employ search tools, enabling agentic visual generation. However, we find that naive search fails: it retrieves indiscriminately, injecting noise into prompts the generator already handles. We trace the root cause to a generator-specific, evolving knowledge boundary: the divide between what a generator can internalize through training and what must remain in external context. Although this boundary is hard to specify in advance, we show that it is discoverable through a teach-then-search co-training framework. Even a minimal version of this co-training recipe produces monotonic improvement, laying the foundation for recursive self-improvement in visual generation that can meet world-knowledge-grounded requests. We release the full dataset, co-training corpus, and search corpus as a replayable harness for tool-augmented, world-knowledge-grounded visual generation.', 'score': 26, 'issue_id': 2826, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': 'c290bb51e208eaf0', 'github_url': '', 'github_stars': 0, 'authors': ['Haozhe Wang', 'Weijia Feng', 'Jinpeng Yu', 'Che Liu', 'Ping Nie', 'Fangzhen Lin', 'Jiaming Liu', 'Ruihua Huang', 'Jimmy Lin', 'Wenhu Chen', 'Cong Wei'], 'affiliations': ['Hong Kong University of Science and Technology', 'Imperial College London', 'Qwen Applications', 'University of Waterloo'], 'pdf_title_img': 'assets/pdf/title_img/2607.05382.jpg', 'data': {'categories': ['#multimodal', '#hallucinations', '#agents', '#training', '#dataset', '#tool_use', '#retrieval'], 'emoji': '🖼️', 'ru': {'title': 'Преодоление барьеров знания в визуальной генерации', 'desc': 'В этой работе рассматриваются проблемы визуальных генераторов, которые создают изображения, основываясь на ограниченных знаниях. Авторы вводят новые наборы данных SearchGen-20K и SearchGen-Bench, чтобы продемонстрировать недостатки генераторов при выполнении сложных запросов. Они отмечают, что традиционные методы поиска для помощи генераторам неэффективны из-за добавления шумов в запросы. Решением является использование совместного обучения, что позволяет улучшить качество генерации, обеспечивая адаптацию моделей к изменяющимся требованиям пользователей.'}, 'en': {'title': 'Bridging the Knowledge Gap in Visual Generation', 'desc': "This paper addresses the limitations of visual generators that often create inaccurate content when faced with unfamiliar requests. It introduces SearchGen-20K and SearchGen-Bench, which consist of a large set of prompts to evaluate the performance of these generators across various domains. The authors identify a knowledge boundary that restricts generators from accessing up-to-date information, leading to poor performance in real-world scenarios. To overcome this, they propose a teach-then-search co-training framework that enhances the generator's ability to meet evolving user demands by integrating search tools effectively."}}}, {'id': 'https://huggingface.co/papers/2607.08317', 'title': 'Blind-Spots-Bench: Evaluating Blind Spots in Multimodal Models', 'url': 'https://huggingface.co/papers/2607.08317', 'abstract': 'Abstract  Modern AI models achieve strong performance on many established benchmarks, yet they still fail on tasks that humans find almost trivial, such as manipulating a string or drawing a dog with five legs. These examples suggest that existing benchmarks may under-measure persistent blind spots in current systems. We introduce blind-spots-bench, a benchmark designed to expose such blind spots through tasks that appear simple for humans but remain challenging for modern AI. We collect raw questions from students in an AI course, clean and annotate them with structured reference solutions, and propose a task taxonomy tailored to the resulting dataset of 235 samples. We further develop an automated grading pipeline to evaluate a wide range of models, including open-weight and closed-source language, vision-language, and image-generation models. Our analysis on blind-spots-bench reveals that closed-source frontier models can substantially outperform open-weight models with even approx10% gap, even when they attain comparable performance on existing benchmarks. A more fine-grained analysis shows that no single model dominates across all task types, and that some tasks remain challenging for all evaluated models. These results highlight the value of blind-spots-bench as a diagnostic stress test for identifying concrete weaknesses in current modern models.', 'score': 19, 'issue_id': 2825, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '129523b77195e42c', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Santelmo', 'Xiuying Wei', 'Israa Fakih', 'Felix Bauer', 'Juan Garcia Giraldo', 'Chengkun Li', 'Etienne Bamas', 'Emmanuel Abbé'], 'affiliations': ['Ecole Polytechnique Federale de Lausanne (EPFL), Switzerland'], 'pdf_title_img': 'assets/pdf/title_img/2607.08317.jpg', 'data': {'categories': ['#data', '#interpretability', '#dataset', '#benchmark', '#survey', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Выявление слепых зон в современных моделях ИИ', 'desc': 'Современные модели ИИ показывают высокие результаты на многих стандартизированных тестах, но продолжают сталкиваться с задачами, которые для людей кажутся простыми, такими как манипуляция строками или рисование собаки с пятью ногами. Эта работа представляет новый набор тестов blind-spots-bench, который предназначен для выявления слепых зон в текущих системах через задачи, которые кажутся легкими для человека, но остаются сложными для ИИ. Мы собрали вопросы от студентов курса ИИ, обработали их и предложили таксономию задач для набора из 235 примеров. Наши результаты показывают, что модели с закрытыми весами значительно превышают открытые модели по ряду задач, что подчеркивает ценность blind-spots-bench как инструмента для диагностики недостатков современных моделей.'}, 'en': {'title': "Uncovering AI's Hidden Weaknesses with Blind-Spots-Bench", 'desc': 'This paper introduces blind-spots-bench, a new benchmark aimed at revealing the limitations of modern AI models on tasks that are easy for humans but difficult for machines. The authors collected and annotated a dataset of 235 samples from AI students, creating a taxonomy of tasks to evaluate various AI models. They developed an automated grading system to assess both open-weight and closed-source models, finding significant performance gaps. The results indicate that no single model excels across all tasks, emphasizing the importance of this benchmark for diagnosing weaknesses in AI systems.'}}}, {'id': 'https://huggingface.co/papers/2607.11111', 'title': 'Know Before Fix: QA-Driven Repository Knowledge Acquisition for Software Issue Resolution', 'url': 'https://huggingface.co/papers/2607.11111', 'abstract': "Abstract  LLM-based coding agents have significantly advanced automated software issue resolution, yet they remain highly prone to factual errors caused by insufficient repository understanding. Recent methods attempt to mitigate this limitation through pre-repair repository exploration; however, their fix-driven strategies explore repositories without identifying the agent's knowledge gaps, often yielding imprecise context that fails to bridge the underlying understanding deficit. In this paper, we propose ACQUIRE, a QA-driven framework for software issue resolution. Mirroring how experienced developers first comprehend unfamiliar code before attempting a fix, ACQUIRE explicitly acquires repository knowledge prior to repair. The framework decouples knowledge acquisition from patch generation through two stages: in the first stage, a Questioner and an Answerer collaborate to acquire structured repository knowledge, where the Questioner poses targeted questions and the Answerer produces evidence-grounded answers through autonomous exploration; in the second stage, the Resolver leverages the resulting QA knowledge to generate informed patches. By transforming implicit knowledge gaps into explicit, factually reliable understanding, ACQUIRE accelerates knowledge-intensive repair stages and enables more accurate resolution. Experiments on SWE-bench Verified demonstrate that ACQUIRE consistently outperforms representative pre-repair methods, raising Pass@1 by up to 4.4 percentage points with modest additional cost and time.", 'score': 6, 'issue_id': 2821, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '8b4ea103d176a81b', 'github_url': '', 'github_stars': 0, 'authors': ['Haotian Lin', 'Silin Chen', 'Xiaodong Gu', 'Yuling Shi', 'Chengxi Pan', 'Jiaqi Ge', 'Mengfan Li', 'Jianghong Huang', 'Mengchieh Chuang', 'Beijun Shen', 'Haibing Guan'], 'affiliations': ['Guangdong Technion-Israel Institute of Technology, Shantou, China', 'Shanghai Jiao Tong University, Shanghai, China', 'University of Pittsburgh, Pittsburgh, PA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.11111.jpg', 'data': {'categories': ['#agents', '#optimization', '#reasoning', '#training', '#rl'], 'emoji': '🤖', 'ru': {'title': 'Новый подход к решению программных ошибок с помощью ACQUIRE', 'desc': 'В данной статье рассматривается новый подход к автоматическому решению программных проблем с использованием LLM. Предложенный фреймворк ACQUIRE обучает агента прежде всего понимать репозиторий, прежде чем предлагать исправления, что позволяет избежать фактических ошибок. Процесс включает два этапа: сначала агент задает вопросы для получения структурированных знаний, а затем использует эти знания для генерации более точных исправлений. Эксперименты показывают, что ACQUIRE значительно превосходит традиционные методы, улучшая точность решений.'}, 'en': {'title': 'Bridging Knowledge Gaps for Better Code Fixes', 'desc': "This paper introduces ACQUIRE, a framework designed to improve automated software issue resolution by addressing knowledge gaps in coding agents. Unlike previous methods that explore repositories without understanding the agent's limitations, ACQUIRE uses a two-stage process to first gather structured knowledge through a Questioner and Answerer system. This approach allows the agent to gain a reliable understanding of the code before attempting to generate fixes. Experiments show that ACQUIRE significantly enhances the accuracy of software repairs compared to existing methods, demonstrating its effectiveness in knowledge-intensive tasks."}}}, {'id': 'https://huggingface.co/papers/2607.08168', 'title': 'MuScriptor: An Open Model for Multi-Instrument Music Transcription', 'url': 'https://huggingface.co/papers/2607.08168', 'abstract': 'Abstract  Existing methods for automatic music transcription are often limited to single-instrument recordings or fail on complex, real music mixes. Although previous work utilizes synthetic training data, the resulting models generalize poorly, leading to largely unusable transcription output in realistic, multi-instrument settings. In this work, we analyze the effectiveness of synthetic data for pre-training while combining it with fine-tuning on real music audio and post-training using reinforcement learning. We further introduce conditioning on instrument presence to customize transcriptions. Finally, we release MuScriptor, an open-weight multi-instrument music transcription model that works on real-world music recordings from across a diverse range of musical genres.', 'score': 5, 'issue_id': 2825, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '580c349e859aa58e', 'github_url': '', 'github_stars': 0, 'authors': ['Simon Rouard', 'Michael Krause', 'Axel Roebel', 'Carl-Johann Simon-Gabriel', 'Alexandre Défossez'], 'affiliations': ['Kyutai', 'Mirelo AI', 'UMR STMS, IRCAM-CNRS Sorbonne Univ.'], 'pdf_title_img': 'assets/pdf/title_img/2607.08168.jpg', 'data': {'categories': ['#data', '#training', '#dataset', '#open_source', '#synthetic', '#rl'], 'emoji': '🎶', 'ru': {'title': 'Автоматическая транскрипция музыки для многоголосых записей', 'desc': 'В статье рассматриваются проблемы автоматической транскрипции музыки, особенно в сложных музыкальных записях с несколькими инструментами. Исследуется эффективность использования синтетических данных для предварительного обучения моделей и их последующей настройки на реальной музыке. Авторы представляют MuScriptor — модель для многоголосой транскрипции музыки, способную работать с реальными аудиозаписями из различных музыкальных жанров. Включение информации о наличии инструментов позволяет улучшить качество транскрипций.'}, 'en': {'title': 'Revolutionizing Music Transcription with MuScriptor', 'desc': 'This paper addresses the challenges of automatic music transcription, particularly in complex, multi-instrument recordings. It explores the use of synthetic data for pre-training models, which often struggle to generalize to real-world music. The authors propose a method that combines synthetic data with fine-tuning on actual audio and reinforcement learning for improved performance. They also introduce MuScriptor, a versatile transcription model that adapts to various musical genres and instrument presence.'}}}, {'id': 'https://huggingface.co/papers/2607.11562', 'title': 'MonkeyOCRv2: A Visual-Text Foundation Model for Document AI', 'url': 'https://huggingface.co/papers/2607.11562', 'abstract': 'Abstract  Mainstream visual encoders are pretrained on natural images and cannot be effectively applied to document images without document-oriented adaptation, as dense text and fine-grained character strokes demand character-level visual perception. We present MonkeyOCRv2, a visual-text pretrained model for document AI. First, we construct MonkeyDoc v2, to our knowledge the largest document-image pretraining corpus, comprising 113 million images spanning 17 languages. Second, we propose a pretraining strategy that jointly learns image-to-text generation and pixel-level document reconstruction: the former aligns visual representations with textual content, while the latter preserves character strokes and layout details. Extensive experiments are conducted on five representative document analysis tasks, including text recognition, formula recognition, text detection, document tampering detection, and overlapping text segmentation. Replacing the original encoders with MonkeyOCRv2 consistently improves performance across all five tasks. Finally, we validate its effectiveness as the vision encoder of multimodal large language models on the more challenging tasks of document parsing and document understanding. Kept frozen and paired with a lightweight language model, it yields a 0.7B document parsing model that sets a new open-source state-of-the-art on MDPBench, a recent benchmark spanning digital-born and photographed documents across 17 languages, surpassing the previous best 3B dots.mocr by 2.8% absolute with a vision encoder roughly 11times smaller. The frozen encoder also powers a document understanding model that outperforms counterparts built on CLIP, DINO, and SAM across eight benchmarks under identical training settings. These results suggest that document-oriented visual pretraining can serve as a foundation for document intelligence in its own right.', 'score': 4, 'issue_id': 2826, 'pub_date': '2026-07-13', 'pub_date_card': {'ru': '13 июля', 'en': 'July 13', 'zh': '7月13日'}, 'hash': '10d3b1a039c5b81d', 'github_url': '', 'github_stars': 0, 'authors': ['Yuliang Liu', 'Zhang Li', 'Ziyang Zhang', 'Shuo Zhang', 'Qiang Liu', 'Jiajun Song', 'Zidun Guo', 'Xinhan Wang', 'Handong Zheng', 'Yang Liu', 'Dongliang Luo', 'Zhiyin Ma', 'Jiarui Zhang', 'Xiang Bai'], 'affiliations': ['Huazhong University of Science and Technology', 'Kingsoft Office'], 'pdf_title_img': 'assets/pdf/title_img/2607.11562.jpg', 'data': {'categories': ['#data', '#multimodal', '#multilingual', '#benchmark', '#low_resource', '#open_source', '#dataset'], 'emoji': '📄', 'ru': {'title': 'MonkeyOCRv2: Новации в обработке документных изображений', 'desc': 'В статье представлена модель MonkeyOCRv2, предназначенная для работы с документами и обученная на большом наборе изображений. Эта модель учитывает сложности, связанные с восприятием текста и деталей, что делает её более подходящей для документных изображений, чем традиционные визуальные кодировщики. Проведенные эксперименты показывают, что MonkeyOCRv2 улучшает результаты в различных задачах анализа документов, таких как распознавание текста и обнаружение подделок. Наконец, модель демонстрирует превосходные результаты при использовании в многомодальных LLM для понимания и обработки документов.'}, 'en': {'title': 'Revolutionizing Document AI with MonkeyOCRv2', 'desc': 'This paper introduces MonkeyOCRv2, a visual-text pretrained model specifically designed for document images. It utilizes the MonkeyDoc v2 dataset, the largest of its kind, to enhance character-level visual perception across 113 million images in 17 languages. The model employs a unique pretraining strategy that combines image-to-text generation with pixel-level document reconstruction, improving performance on various document analysis tasks. Results show that MonkeyOCRv2 outperforms existing models in document parsing and understanding, establishing a new state-of-the-art in the field.'}}}, {'id': 'https://huggingface.co/papers/2607.07769', 'title': 'Principled Analysis of Deep Reinforcement Learning Evaluation and Design Paradigms', 'url': 'https://huggingface.co/papers/2607.07769', 'abstract': 'Abstract  Starting from the utilization of deep neural networks to approximate the state-action value function that led to winning one of the most challenging games, to algorithmic advancements that allowed solving problems without even explicitly stating the rules of the challenge at hand, reinforcement learning research has been the center of remarkable scientific progress for the past decade. In this paper, we focus on the key ingredients of this research progress and we analyze the canonical evaluation and design paradigms in reinforcement learning. We introduce the theoretical foundations of scaling laws in reinforcement learning and show that the asymptotic performance of reinforcement learning algorithms does not have a monotone relationship between performance rankings and data-regimes. We conduct large-scale experiments and our results demonstrate that a line of reinforcement learning research under the canonical design and evaluation paradigms resulted in incorrect conclusions. Our analysis and results provide a core analysis on scaling, capacity and complexity of deep reinforcement learning.', 'score': 4, 'issue_id': 2825, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': 'dcce3f59cd558a05', 'github_url': '', 'github_stars': 0, 'authors': ['Ezgi Korkmaz'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.07769.jpg', 'data': {'categories': ['#benchmark', '#rl', '#survey', '#optimization', '#games'], 'emoji': '📈', 'ru': {'title': 'Новые горизонты в обучении с подкреплением', 'desc': 'В этой статье рассматриваются ключевые аспекты развития исследований в области обучения с подкреплением, которое добилось больших успехов за последнее десятилетие. Мы анализируем основные парадигмы оценки и проектирования в этой области и вводим теоретические основы законов масштабирования. Наши результаты показывают, что производительность алгоритмов обучения с подкреплением не всегда соответствует ожиданиям в зависимости от режимов данных. Мы также указываем на ошибки в выводах, полученных в рамках традиционных подходов к оценке и проектированию.'}, 'en': {'title': 'Rethinking Reinforcement Learning: Scaling and Performance Insights', 'desc': 'This paper explores the advancements in reinforcement learning, particularly focusing on deep neural networks used to approximate state-action value functions. It examines the evaluation and design paradigms that have shaped recent research in this field. The authors introduce theoretical foundations related to scaling laws in reinforcement learning, revealing that performance does not always correlate with data availability. Through large-scale experiments, they highlight flaws in previous conclusions drawn from standard evaluation methods, emphasizing the importance of understanding scaling, capacity, and complexity in deep reinforcement learning.'}}}, {'id': 'https://huggingface.co/papers/2607.12450', 'title': 'Let RGB Be the Language of Vision', 'url': 'https://huggingface.co/papers/2607.12450', 'abstract': 'Abstract  This work introduces a unified formulation for vision models, where diverse forms of visual information beyond natural images, such as masks, depth maps, and other structured visual signals, are all represented as RGB images, while general visual tasks can be converted into a common RGB-to-RGB image editing problem. In this paradigm, different types of visual information internally share the same encoding and decoding architecture and parameters as natural images, enabling a single model to transfer across tasks through a unified visual interface, in a way analogous to how language models operate over text. We refer to this formulation as RGB In and RGB Out (RINO). Built upon a generic image editing backbone without task-specific fine-tuning, RINO demonstrates robust and competitive zero-shot performance on both dense understanding tasks such as segmentation and depth estimation (where we unify outputs as RGB), and dense-conditioned generation tasks such as pose-to-image generation (where we unify inputs as RGB). We hope this study provides useful insights toward general unified vision-language systems, where diverse visual tasks can be expressed, interpreted, and solved through a shared visual language. Code is available at https://github.com/yangtiming/RINO.', 'score': 3, 'issue_id': 2826, 'pub_date': '2026-07-14', 'pub_date_card': {'ru': '14 июля', 'en': 'July 14', 'zh': '7月14日'}, 'hash': '6a7f02e0fff62d78', 'github_url': '', 'github_stars': 0, 'authors': ['Timing Yang', 'Jinrui Yang', 'Xinlong Li', 'Yuhan Wang', 'Haoran Li', 'Yanqing Liu', 'Guoyizhe Wei', 'Jixuan Ying', 'Chen Wei', 'Rama Chellappa', 'Yuyin Zhou', 'Cihang Xie', 'Alan Yuille', 'Feng Wang'], 'affiliations': ['Carnegie Mellon University', 'Johns Hopkins University', 'Rice University', 'UC Santa Cruz'], 'pdf_title_img': 'assets/pdf/title_img/2607.12450.jpg', 'data': {'categories': ['#optimization', '#multimodal', '#transfer_learning', '#survey', '#architecture'], 'emoji': '🖼️', 'ru': {'title': 'Унифицированный подход к визуальной информации', 'desc': 'В данной работе представлена универсальная формулировка для визуальных моделей, которая объединяет различные формы визуальной информации, такие как маски и карты глубины, в единый формат RGB. Все задачи визуальной обработки можно преобразовать в общую задачу редактирования изображений RGB. Эта парадигма позволяет модели использовать один и тот же архитектурный кодер и декодер для разных типов визуальной информации, аналогично тому, как работают языковые модели с текстом. Мы надеемся, что это исследование даст полезные идеи для создания унифицированных систем визуально-языкового взаимодействия.'}, 'en': {'title': 'Unified Vision Processing with RINO', 'desc': 'This paper presents a new approach called RGB In and RGB Out (RINO) for handling various types of visual information, such as masks and depth maps, by treating them all as RGB images. It allows different visual tasks to be framed as a common problem of editing RGB images, similar to how language models work with text. By using a single model architecture for encoding and decoding, RINO can perform multiple tasks without needing specific adjustments for each one. The method shows strong performance in both understanding and generating visual content, aiming to advance unified vision-language systems.'}}}, {'id': 'https://huggingface.co/papers/2607.10522', 'title': 'Towards Autonomous and Auditable Medical Imaging Model Development', 'url': 'https://huggingface.co/papers/2607.10522', 'abstract': 'Abstract  Large language model (LLM) agents are beginning to automate machine learning engineering (MLE) by coupling planning, code execution, debugging, and empirical feedback. Translating this capability to medical imaging remains difficult because each task imposes modality-specific experimentation and strict requirements for validation protocols and prediction artifacts. Here we introduce AMID, an autonomous multi-agent framework for medical imaging model development. AMID first proposes Data-Conditioned Method Planning, which refines coarse task-level search spaces into executable, parallelizable method lanes grounded in task-specific data analysis and runnable medical-imaging resources. It then develops Verification-Guided Two-Stage Optimization, moving from broad early exploration of diverse method lanes to selective exploitation of promising candidates while enforcing strict verification of validation protocols, metric computation, and prediction artifacts throughout the optimization. Across 20 medical imaging challenge tasks spanning diverse modalities and prediction types, AMID outperformed evaluated general-purpose MLE systems and, on several tasks, approached or matched strong human-designed challenge solutions. These results suggest that AMID can turn task-specific medical imaging model development from bespoke manual engineering into an agentic workflow for producing high-performing and auditable model artifacts across heterogeneous tasks.', 'score': 3, 'issue_id': 2825, 'pub_date': '2026-07-12', 'pub_date_card': {'ru': '12 июля', 'en': 'July 12', 'zh': '7月12日'}, 'hash': '72518496c216db01', 'github_url': '', 'github_stars': 0, 'authors': ['Shengyuan Liu', 'Jia-Xuan Jiang', 'Boyun Zheng', 'Cheng Wang', 'Zipei Wang', 'Wentao Pan', 'Hongtao Wu', 'Houwen Peng', 'Yu Gu', 'Lichao Sun', 'Yixuan Yuan'], 'affiliations': ['Independent Researcher', 'Institute of Automation, Chinese Academy of Sciences', 'Lehigh University', 'Microsoft Research', 'The Chinese University of Hong Kong'], 'pdf_title_img': 'assets/pdf/title_img/2607.10522.jpg', 'data': {'categories': ['#training', '#agent_memory', '#agents', '#healthcare', '#science', '#optimization'], 'emoji': '🩺', 'ru': {'title': 'Автоматизация разработки моделей в медицинской визуализации', 'desc': 'Статья представляет AMID - автономную многоагентную систему для разработки моделей в области медицинской визуализации. Она сочетает в себе планирование, исполнение кода и проверку результатов, что позволяет автоматизировать процессы, связанные с машинным обучением. AMID использует методы, основанные на анализе данных, чтобы оптимизировать процессы разработки моделей и обеспечить строгую проверку на всех этапах. Результаты экспериментов показывают, что AMID превзошел существующие системы машинного обучения и приближается к решениям, разработанным экспертами.'}, 'en': {'title': 'Automating Medical Imaging Model Development with AMID', 'desc': 'This paper presents AMID, an autonomous framework designed to enhance the development of medical imaging models using large language model (LLM) agents. AMID employs Data-Conditioned Method Planning to streamline the search for effective methods based on specific data analysis and available resources. It also incorporates Verification-Guided Two-Stage Optimization to ensure rigorous validation and performance metrics throughout the model development process. The results demonstrate that AMID significantly outperforms traditional machine learning engineering systems in various medical imaging tasks, indicating its potential to automate and improve model creation in this field.'}}}, {'id': 'https://huggingface.co/papers/2607.08046', 'title': "What LLM Forecasters Know but Don't Say: Probing Internal Representations for Calibration and Faithfulness", 'url': 'https://huggingface.co/papers/2607.08046', 'abstract': "Abstract  Large language models fine-tuned for forecasting can be accurate yet poorly calibrated, and their chain-of-thought (CoT) reasoning may not faithfully reflect the evidence behind a forecast. We ask whether internal representations offer a more direct window into both. Working with Eternis-Forecaster 8B on OpenForesight, we train representation-pooling probes on intermediate activations and find they achieve substantially better calibration; a result that also holds for GLM-4.7-Flash and GLM-4.5-Air. We then assess CoT faithfulness through evidence ablation and diversionary injection: removing an influential source in the prompt often changes the model's forecast while leaving the reasoning trace untouched. The same probes function as lie detectors: their activations track behavioral shifts far better than the reasoning trace does, and they also predict the direction of change in 84% of cases, including when the CoT conceals the perturbation's influence. Finally, forced answering reveals that forecasts are largely fixed before reasoning begins: a single pre-reasoning pass recovers the committed answer and confidence, and routing ques         const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agent_memory (1)', '#agents (3)', '#agi', '#alignment', '#architecture (1)', '#audio', '#benchmark (4)', '#compression', '#context_window', '#continual_learning', '#data (3)', '#dataset (4)', '#diffusion (1)', '#ethics', '#games (2)', '#graphs', '#hallucinations (1)', '#healthcare (1)', '#inference', '#interpretability (2)', '#knowledge_graphs', '#leakage', '#long_context (1)', '#low_resource (1)', '#machine_translation', '#math', '#memorization', '#memory (1)', '#multilingual (1)', '#multimodal (5)', '#open_source (2)', '#optimization (6)', '#plp', '#prompt_caching', '#prompting (1)', '#rag', '#reasoning (2)', '#retrieval (1)', '#retrieval_eval', '#rl (4)', '#rlhf (1)', '#robotics', '#science (1)', '#security', '#session_memory', '#small_models', '#story_generation', '#survey (3)', '#synthetic (2)', '#tool_use (1)', '#training (6)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-15 22:00',lang=currentLang);
        }

                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');

            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-15 22:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-15 22:00')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
