    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

        function initializeLanguageFlags() {
            const flags = document.querySelectorAll('.flag-svg');
            flags.forEach(flag => {
                if (flag.dataset.lang === currentLang) {
                    flag.classList.add('active');
                }
                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));
                    flag.classList.add('active');
                    currentLang = flag.dataset.lang;

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);
            
            if (isDarkMode) {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }
        }

        const articlesData = [{'id': 'https://huggingface.co/papers/2606.29526', 'title': 'The Mirage of Optimizing Training Policies: Monotonic Inference Policies as the Real Objective for LLM Reinforcement Learning', 'url': 'https://huggingface.co/papers/2606.29526', 'abstract': 'Abstract Training-inference mismatch in reinforcement learning for large language models leads to instability, which is addressed through a new policy optimization objective and framework that ensures consistent policy improvements between training and inference phases.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning (RL) has gained growing attention in large language model (LLM) post-training, yet RL training remains fragile and can suffer from instability or collapse. One vital cause is training-inference mismatch: LLM adopts separate inference and training engines for generation efficiency and training precision, which in practice exhibits inconsistent probabilities for the same trajectories on training and inference sides, even with synchronized model parameters. This naturally induces a special type of off-policyness ever existing and poisoning the training. Prior works have made various efforts in addressing the off-policyness to stabilize the training policies under the mismatch. In this paper, we point out the objective misalignment neglected by existing works that an effective update to the policy in the training engine not necessarily ensures the improvement of the inference policy, i.e., the one used in deployment. To this end, we propose a new policy optimization objective for LLM RL, named Monotonic Inference Policy Improvement (MIPI). Following this principle, we introduce Monotonic Inference Policy Update (MIPU), a two-step LLM RL framework that constructs sampler-referenced candidate updates and selectively accepts synchronized candidates using an inference-side gap proxy. Experiments conducted on two model scales under high mismatch show that MIPU improves average reasoning performance and training stability.', 'score': 38, 'issue_id': 2770, 'pub_date': '2026-06-28', 'pub_date_card': {'ru': '28 июня', 'en': 'June 28', 'zh': '6月28日'}, 'hash': 'e04605df9c9148f1', 'github_url': '', 'github_stars': 0, 'authors': ['Jing Liang', 'Hongyao Tang', 'Yi Ma', 'Yancheng He', 'Weixun Wang', 'Xiaoyang Li', 'Ju Huang', 'Wenbo Su', 'Jinyi Liu', 'Yan Zheng', 'Jianye Hao', 'Bo Zheng'], 'affiliations': ['Alibaba', 'Tianjin University'], 'pdf_title_img': 'assets/pdf/title_img/2606.29526.jpg', 'data': {'categories': ['#reasoning', '#optimization', '#rl', '#training'], 'emoji': '📈', 'ru': {'title': 'Оптимизация политики для стабильного обучения больших языковых моделей', 'desc': 'В данной статье рассматривается проблема несоответствия между обучением и выводом в области Reinforcement Learning (RL) для больших языковых моделей (LLM). Это несоответствие приводит к нестабильности, и авторы предлагают новую цель оптимизации политики, чтобы обеспечить последовательные улучшения между этапами обучения и вывода. Вводится также двухступенчатая структура, называемая Monotonic Inference Policy Update (MIPU), которая помогает улучшить производительность вывода и стабильность обучения. Эксперименты показывают, что MIPU приводит к увеличению средней производительности рассуждений при высоком уровне несоответствия.'}, 'en': {'title': 'Stabilizing RL in LLMs with Monotonic Policy Improvements', 'desc': 'This paper addresses the instability in reinforcement learning (RL) for large language models (LLMs) caused by training-inference mismatch. The authors introduce a new policy optimization objective called Monotonic Inference Policy Improvement (MIPI) to ensure consistent policy updates between training and inference phases. They also propose a two-step framework, Monotonic Inference Policy Update (MIPU), which selectively accepts updates based on an inference-side gap proxy. Experiments demonstrate that MIPU enhances reasoning performance and stabilizes training under conditions of high mismatch.'}}}, {'id': 'https://huggingface.co/papers/2607.01804', 'title': 'VLA-Corrector: Lightweight Detect-and-Correct Inference for Adaptive Action Horizon', 'url': 'https://huggingface.co/papers/2607.01804', 'abstract': 'Abstract VLA-Corrector addresses limitations of action chunking in vision-language-action models by introducing a lightweight latent-space vision monitor that enables adaptive corrective replanning, improving robustness in contact-rich manipulation tasks.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Vision-Language-Action (VLA) foundation models have recently achieved strong progress in embodied intelligence. To reduce policy-call frequency while preserving temporal coherence, most generative policies adopt an action chunk mechanism, executing multiple future actions in an open-loop manner under a fixed action horizon. However, this "predict-then-blindly-execute" paradigm sacrifices closed-loop reactivity: in contact-rich physical interactions, even small local perturbations can rapidly amplify within the open-loop blind spot, leading to compounding errors and ultimately task failure. To address this limitation, we propose VLA-Corrector, a lightweight corrective inference framework for action-chunked VLA policies. Without modifying the backbone policy weights, VLA-Corrector introduces a lightweight Latent-space Vision Monitor (LVM) that continuously compares predicted and actual visual feature evolution, enabling online detection of visual dynamics deviations. Once persistent deviation is detected, the system triggers a truncation event, discards the remaining stale actions, and invokes corrective replanning via Online Gradient Guidance (OGG). The detect-and-correct mechanism of VLA-Corrector naturally induces an event-triggered adaptive action horizon: it preserves long-horizon execution when the current chunk remains reliable, and invokes short-horizon corrective replanning when execution begins to drift. In doing so, VLA-Corrector mitigates the trade-off imposed by static horizons between execution robustness and policy-call frequency. It can be integrated into different VLA models without further retraining the VLA backbone, interrupting compounding errors while preserving much of the efficiency benefit of action chunking and substantially improving robustness in long-horizon, contact-rich robotic manipulation tasks.', 'score': 17, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'e032c4d775628526', 'github_url': '', 'github_stars': 0, 'authors': ['Yi Pan', 'Miao Pan', 'Qi Lu', 'Jiaming Huang', 'Man Zhang', 'Siteng Huang', 'Xin Li', 'Jie Zhang', 'Yongliang Shen', 'Xuhong Zhang', 'Wenqi Zhang'], 'affiliations': ['Alibaba DAMO Academy', 'Zhejiang University'], 'pdf_title_img': 'assets/pdf/title_img/2607.01804.jpg', 'data': {'categories': ['#inference', '#robotics', '#agi', '#optimization', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Коррекция действий для устойчивого взаимодействия', 'desc': 'Статья представляет модель VLA-Corrector, которая решает проблемы с механизмом разбиения действий в моделях взаимодействия между восприятием, языком и действиями. Модель использует легковесный монитор визуального пространства, который позволяет адаптивно корректировать выполнение действий и повышает устойчивость в задачах манипуляции с контактами. При обнаружении отклонений в визуальных данных система отменяет устаревшие действия и запускает процесс коррекции. Эта модель можно интегрировать в разные VLA модели без дополнительного обучения, что делает ее полезной для повышения надежности выполнения задач с долгосрочными планами.'}, 'en': {'title': 'Adaptive Correction for Robust Robotic Manipulation', 'desc': 'The VLA-Corrector improves vision-language-action models by addressing the limitations of action chunking in robotic manipulation tasks. It introduces a lightweight Latent-space Vision Monitor that detects deviations between predicted and actual visual features, allowing for adaptive corrective replanning. This system enhances robustness by enabling a dynamic action horizon, where the model can switch between long-horizon execution and short-horizon corrections based on real-time feedback. By doing so, VLA-Corrector reduces errors in contact-rich environments without needing to retrain the underlying policy models.'}}}, {'id': 'https://huggingface.co/papers/2607.02501', 'title': 'Embodied.cpp: A Portable Inference Runtime of Embodied AI Models on Heterogeneous Robots', 'url': 'https://huggingface.co/papers/2607.02501', 'abstract': 'Abstract Embodied.cpp is a portable C++ runtime that enables efficient deployment of vision-language-action and world-action models across heterogeneous edge devices through modular execution layers and optimized inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Embodied AI models now span vision-language-action (VLA) models and world-action models (WAMs), but practical deployment remains fragmented across model-specific Python stacks, backend assumptions, and robot-side glue code, especially on heterogeneous edge devices. Existing inference runtimes are designed mainly for request-response serving and therefore do not satisfy the runtime contract of embodied deployment: multi-rate execution inside closed-loop control, latency-first batch-1 inference on heterogeneous hardware, and extensible embodied interfaces beyond fixed token I/O. We present Embodied.cpp, a portable C++ inference runtime for embodied models. Based on an architectural analysis of representative VLA models and WAMs, Embodied.cpp captures a shared execution path and organizes it into five layers: input adapters, sequence builders, backbone execution, head plugins, and deployment adapters. The runtime provides modular multi-rate execution, latency-first fused inference, and extensible operator and I/O support, enabling deployment across heterogeneous devices, robots, and simulators through one backend abstraction. We evaluate Embodied.cpp on two VLA models, HY-VLA and pi0.5, and on a preliminary WAM benchmark using a LingBot-VA Transformer block. The VLA deployments achieve successful closed-loop execution with 100.0% and 91.0% task success rates, respectively. The WAM benchmark reduces block memory from 312.2 MiB to 88.1 MiB. These results show that Embodied.cpp improves deployment efficiency while preserving high accuracy across diverse embodied model architectures.', 'score': 13, 'issue_id': 2770, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '0b9ba0ee6f0747df', 'github_url': '', 'github_stars': 0, 'authors': ['Ling Xu', 'Chuyu Han', 'Borui Li', 'Hao Wu', 'Shiqi Jiang', 'Ting Cao', 'Chuanyou Li', 'Sheng Zhong', 'Shuai Wang'], 'affiliations': ['Institute for AI Industry Research (AIR), Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.02501.jpg', 'data': {'categories': ['#inference', '#robotics', '#games', '#architecture', '#optimization'], 'emoji': '🤖', 'ru': {'title': 'Эффективное развертывание моделей в мире действия', 'desc': 'Статья представляет Embodied.cpp, переносимый C++ рантайм, который позволяет эффективно развертывать модели, основанные на взаимодействии языка, зрения и действия на различных устройствах. Он организует выполнение в пять модульных слоев, что способствует немедленной обработке данных и гибкости для работы с разными аппаратными платформами. Embodied.cpp поддерживает многоуровневое выполнение и оптимизацию производительности, обеспечивая высокую точность выполнения задач. Это решение улучшает эффективность развертывания моделей, сохраняя при этом высокие показатели успешного выполнения.'}, 'en': {'title': 'Streamlined Deployment for Embodied AI Models', 'desc': 'Embodied.cpp is a C++ runtime designed for efficiently deploying vision-language-action (VLA) and world-action models (WAMs) on various edge devices. It addresses the challenges of fragmented deployment across different Python stacks and backend systems by providing a modular architecture with five execution layers. This runtime supports multi-rate execution and latency-optimized inference, making it suitable for real-time applications in robotics. Evaluation shows that it achieves high task success rates while significantly reducing memory usage, enhancing deployment efficiency across diverse models.'}}}, {'id': 'https://huggingface.co/papers/2607.02461', 'title': 'OrbitQuant: Data-Agnostic Quantization for Image and Video Diffusion Transformers', 'url': 'https://huggingface.co/papers/2607.02461', 'abstract': 'Abstract OrbitQuant enables efficient post-training quantization for diffusion transformers by using a normalized rotated basis that eliminates the need for recalibration across different timesteps and modalities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Diffusion transformers (DiTs) achieve state-of-the-art image and video generation, but their multi-step sampling and growing parameter count make inference expensive. Post-training quantization (PTQ) is the natural remedy, yet DiT activations shift across timesteps, prompts, and guidance branches, forcing prior methods to re-fit calibration data for every new checkpoint or modality. We present OrbitQuant, a data-agnostic weight-activation quantizer that bypasses range estimation by quantizing in a normalized, rotated basis. In this basis, a randomized permuted block-Hadamard (RPBH) rotation concentrates each coordinate around one fixed, known marginal regardless of the input, so a single Lloyd-Max codebook serves all timesteps, prompts, and layers of a given input dimension. We extend the same quantizer to weight rows offline, absorbing the rotation into the weights so that it cancels inside each linear layer and only a forward rotation on the activations remains at runtime. The same recipe transfers from image to video with no per-modality tuning. Across FLUX.1, Z-Image-Turbo, Wan 2.1, and CogVideoX, it sets the state of the art for PTQ at several low-bit settings. It also pushes PTQ of image diffusion transformers to W2A4 with usable generation quality.', 'score': 11, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'c66ee6dcac3c7333', 'github_url': '', 'github_stars': 0, 'authors': ['Donghyun Lee', 'Jitesh Chavan', 'Duy Nguyen', 'Sam Huang', 'Liming Jiang', 'Priyadarshini Panda', 'Timo Mertens', 'Saurabh Shukla'], 'affiliations': ['Cantina Labs', 'University of Illinois Urbana-Champaign', 'University of Southern California'], 'pdf_title_img': 'assets/pdf/title_img/2607.02461.jpg', 'data': {'categories': ['#inference', '#compression', '#diffusion', '#optimization'], 'emoji': '🚀', 'ru': {'title': 'Эффективная квантизация для диффузионных трансформеров', 'desc': 'Статья описывает метод OrbitQuant, который позволяет эффективно производить пост-тренировочную квантизацию диффузионных трансформеров. Этот подход устраняет необходимость в перерасчете калибровочных данных благодаря использованию нормализованного вращенного базиса. Он обеспечивает высокое качество генерации изображений и видео при низком уровне битности без дополнительной настройки для различных модальностей. OrbitQuant устанавливает новые стандарты эффективности квантизации, позволяя использовать одну и ту же кодовую книгу для всех временных шагов и размерностей.'}, 'en': {'title': 'Efficient Quantization for Diffusion Transformers', 'desc': 'OrbitQuant introduces a novel approach for post-training quantization (PTQ) of diffusion transformers, which are known for their high-quality image and video generation. By utilizing a normalized rotated basis, it eliminates the need for recalibrating quantization parameters across different timesteps and modalities. This method allows for a single codebook to be used across various inputs, significantly reducing the computational cost during inference. The results demonstrate that OrbitQuant achieves state-of-the-art performance in PTQ, enabling efficient low-bit quantization without sacrificing generation quality.'}}}, {'id': 'https://huggingface.co/papers/2606.31227', 'title': 'Securing the AI Agent: A Unified Framework for Multi-Layer Agent Red Teaming', 'url': 'https://huggingface.co/papers/2606.31227', 'abstract': 'Abstract AI-Infra-Guard is an open-source framework that addresses AI infrastructure security through layered detection paradigms spanning infrastructure, protocol, agent behavior, and model layers.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The fast growth of open-source AI infrastructure, from model serving engines and agent platforms to the Model Context Protocol (MCP) ecosystem and the language models themselves, has outpaced the security tooling available to defend it. We present AI-Infra-Guard, an open-source framework that organizes AI red teaming around a single observation: the attack surface of an AI agent is stratified across layers (infrastructure, protocol/tool, agent behavior, and model), and no single detection paradigm fits all of them. The framework therefore matches a paradigm to each layer, from deterministic rule matching over 75+ AI components and 1{,}400+ vulnerability rules, through LLM-driven agentic auditing of MCP servers and agent-skill packages and multi-turn black-box agent red teaming, to a jailbreak harness with 26+ attack operators over sixteen datasets. To our knowledge it is the only open-source framework to span all of these, including supply-chain auditing of the agent skills that increasingly extend AI agents. We release AI-Infra-Guard as open source so that layer-paradigm matching can serve as a practical foundation for agent security and a shared base for the community to build on.', 'score': 6, 'issue_id': 2771, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': '75aea8d9dfa61d00', 'github_url': '', 'github_stars': 0, 'authors': ['Yong Yang', 'Xing Zheng', 'Huiyu Wu', 'Huangsheng Cheng', 'Xiaorong Shi', 'Jing Guo', 'Bo Yang', 'Yi Zhou', 'Xiangfan Wu', 'Zonghao Ying'], 'affiliations': ['Tencent Zhuque Lab'], 'pdf_title_img': 'assets/pdf/title_img/2606.31227.jpg', 'data': {'categories': ['#agents', '#open_source', '#security'], 'emoji': '🛡️', 'ru': {'title': 'Безопасность ИИ инфраструктуры на новом уровне', 'desc': 'AI-Infra-Guard — это открытая платформа, предназначенная для обеспечения безопасности инфраструктуры ИИ через многослойные методы обнаружения. Она анализирует безопасность на различных уровнях: инфраструктуры, протоколов, поведения агентов и моделей. Платформа сопоставляет каждый уровень с определенной парадигмой обнаружения, что позволяет более эффективно выявлять уязвимости. Мы выпустили AI-Infra-Guard как открытый код, чтобы она стала практической основой для безопасности агентов в сообществе.'}, 'en': {'title': 'Layered Defense for AI Infrastructure Security', 'desc': 'AI-Infra-Guard is an open-source framework designed to enhance the security of AI infrastructure by employing multiple detection strategies across different layers. It recognizes that the attack surface of AI agents is complex and varies across infrastructure, protocols, agent behavior, and models. The framework utilizes a combination of deterministic rule matching, LLM-driven auditing, and red teaming techniques to address vulnerabilities effectively. By providing a comprehensive approach to AI security, AI-Infra-Guard aims to serve as a foundational tool for the community to improve agent safety.'}}}, {'id': 'https://huggingface.co/papers/2606.28551', 'title': 'DataComp-VLM: Improved Open Datasets for Vision-Language Models', 'url': 'https://huggingface.co/papers/2606.28551', 'abstract': 'Abstract DataComp for VLMs (DCVLM) establishes a comprehensive benchmark for evaluating data curation strategies in vision-language models, demonstrating that data mixing rather than filtering significantly improves model performance at scale.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Building performant Vision-Language Models (VLMs) requires carefully curating large-scale training datasets, yet the community lacks systematic benchmarks for evaluating such curation strategies. We introduce DataComp for VLMs (DCVLM), a benchmark for controlled data-centric experiments to improve VLM training. As part of DCVLM, we collect 160 datasets spanning four data types -- image-caption pairs, multimodal interleaved documents, text-only, and instruction-tuning data -- into a corpus of 6T multimodal tokens. DCVLM allows participants to test curation strategies (filtering, mixing, formatting, sampling) across 1B-8B models and 6.25B-200B token budgets. Models are then evaluated on a carefully selected suite of up to 52 downstream benchmarks across 9 domains. We conduct extensive experiments on DCVLM and find that data mixing, not filtering, is key to a high-quality training dataset: instruction-heavy mixtures scale better than caption-heavy ones, with gains widening at larger scales. The resulting dataset, DCVLM-Baseline, enables training an 8B VLM to 63.6% accuracy on our 33-task core suite with 200B training tokens. Compared to FineVision, the state-of-the-art open VLM training dataset, this represents an improvement of +5.4pp. DCVLM and all accompanying artifacts will be made publicly available at https://www.datacomp.ai/dcvlm/.', 'score': 6, 'issue_id': 2771, 'pub_date': '2026-06-26', 'pub_date_card': {'ru': '26 июня', 'en': 'June 26', 'zh': '6月26日'}, 'hash': '11bdb8c98281e4f6', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Farina', 'Vishaal Udandarao', 'Thao Nguyen', 'Selim Kuzucu', 'Maximilian Böther', 'Andreas Hochlehnert', 'Adhiraj Ghosh', 'Marianna Nezhurina', 'Karsten Roth', 'Joschka Struber', 'Yuhui Zhang', 'Sebastian Dziadzio', 'Elaine Sui', 'Soumya Jahagirdar', 'Dhruba Ghosh', 'Hasan Hammoud', 'Thomas De Min', 'Simone Caldarella', 'Jehanzeb Mirza', 'Sedrick Keh', 'Mehdi Cherti', 'Hilde Kuehne', 'Bernt Schiele', 'Serena Yeung-Levy', 'Muhammad Ferjad Naeem', 'Federico Tombari', 'Ana Klimovic', 'Elisa Ricci', 'Matthias Bethge', 'Sewoong Oh', 'Ameya Prabhu', 'Alessio Tonioni', 'Jenia Jitsev', 'Massimiliano Mancini', 'Ludwig Schmidt', 'Nikhil Parthasarathy'], 'affiliations': ['1', '10', '11', '12', '13', '14', '15', '2', '3', '4', '5', '6', '7', '8', '9'], 'pdf_title_img': 'assets/pdf/title_img/2606.28551.jpg', 'data': {'categories': ['#open_source', '#data', '#dataset', '#benchmark', '#survey'], 'emoji': '📊', 'ru': {'title': 'Смешивание данных — ключ к эффективным VLM', 'desc': 'Статья представляет новый бенчмарк DataComp для моделей зрения-языка (VLM), который помогает оценить стратегии курации данных. Мы выяснили, что смешивание данных, а не их фильтрация, значительно улучшает производительность моделей. В рамках DCVLM было собрано 160 наборов данных, охватывающих различные типы данных, включая изображения и подписи. Результаты показали, что смеси с упором на инструкции демонстрируют лучшие результаты на больших масштабах.'}, 'en': {'title': 'Mixing Data is Key for Vision-Language Model Success', 'desc': 'The paper introduces DataComp for VLMs (DCVLM), a benchmark designed to evaluate data curation strategies for vision-language models. It highlights that mixing data, rather than filtering it, leads to better model performance, especially at larger scales. The benchmark includes a diverse collection of datasets and allows for testing various curation methods across different model sizes. The findings show that instruction-heavy data mixtures significantly enhance training outcomes, achieving notable accuracy improvements over existing datasets.'}}}, {'id': 'https://huggingface.co/papers/2607.00052', 'title': 'AGE: Adaptive-masking for Graph Embedding in Graph Retrieval-Augmented Generation', 'url': 'https://huggingface.co/papers/2607.00052', 'abstract': 'Abstract GraphRAG extends RAG by incorporating graph-structured data for LLMs, addressing latent feature misalignment through Adaptive-masking for Graph Embedding (AGE) that uses Transformer-based self-supervised learning with learnable node sampling.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct GraphRAG is an extension of retrieval-augmented generation (RAG) that supports large language models (LLMs) by referring to graph-structured data as external knowledge. While this technique ideally captures intricate relationships, it often struggles with graph representations for LLMs, particularly for frozen LLMs, due to the misalignment between graph-based and text-based latent features. We tackle this issue by introducing the {\\it Adaptive-masking for Graph Embedding (AGE)}. AGE employs a Transformer in a mask-based self-supervised learning (SSL) approach. We designed the architecture similar to text embedding encoders, addressing the latent feature misalignment. In contrast to natural language texts, graphs are concise representations, and there exist {\\it key nodes} that hold dominant contextual information, which are challenging to predict from their surroundings. Masking such key nodes leads to inefficiency in the SSL process. Therefore, AGE focuses on predicting nodes apart from key nodes, utilizing a learnable node sampler. Our experimental results indicate that AGE significantly improves approaches using non-parametric search component in GraphQA tasks, achieving superior accuracy across four benchmark datasets with distinct characteristics.', 'score': 3, 'issue_id': 2771, 'pub_date': '2026-06-30', 'pub_date_card': {'ru': '30 июня', 'en': 'June 30', 'zh': '6月30日'}, 'hash': 'cf310dfddbfbd177', 'github_url': '', 'github_stars': 0, 'authors': ['Bao Long Nguyen Huu', 'Atsushi Hashimoto'], 'affiliations': ['OMRON Corporation', 'OMRON SINIC Corporation'], 'pdf_title_img': 'assets/pdf/title_img/2607.00052.jpg', 'data': {'categories': ['#graphs', '#benchmark', '#architecture', '#optimization', '#rag', '#retrieval'], 'emoji': '📊', 'ru': {'title': 'Улучшение обработки графовых данных для LLM', 'desc': 'Статья описывает метод GraphRAG, который расширяет подход RAG, добавляя графо-структурированные данные для больших языковых моделей (LLM). Для решения проблемы несоответствия между латентными признаками графов и текстов используется метод Adaptive-masking for Graph Embedding (AGE). AGE применяет механизмы самонаблюдения на основе трансформеров, позволяя более эффективно извлекать информацию из графов. Эксперименты показывают, что AGE значительно улучшает результаты в задачах GraphQA, обеспечивая более высокую точность на различных наборах данных.'}, 'en': {'title': 'Enhancing LLMs with Graph-Structured Data', 'desc': 'GraphRAG enhances retrieval-augmented generation (RAG) by integrating graph-structured data to improve large language models (LLMs). It addresses the challenge of latent feature misalignment through a novel method called Adaptive-masking for Graph Embedding (AGE), which utilizes Transformer-based self-supervised learning. AGE focuses on predicting non-key nodes to improve efficiency in the learning process, as key nodes often contain critical contextual information that is hard to predict. Experimental results show that AGE significantly boosts accuracy in GraphQA tasks across various benchmark datasets.'}}}, {'id': 'https://huggingface.co/papers/2607.02471', 'title': 'Interpretation-Oriented Cloud Removal via Observation-Anchored Residual Flow with Geo-Contextual Alignment', 'url': 'https://huggingface.co/papers/2607.02471', 'abstract': 'Abstract Geo-Anchored Cloud Removal framework addresses semantic drift in cloud removal by combining physically grounded residual inversion with semantic manifold constraints from vision foundation models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Cloud removal (CR) is essential for optical remote sensing, serving as a prerequisite for reliable downstream interpretation, such as semantic segmentation and change detection. However, existing CR approaches often prioritize visual realism while overlooking their impact on subsequent analytical tasks, leading to semantic drift and degraded downstream performance. To address this issue, we propose Geo-Anchored Cloud Removal (GACR), a unified framework that jointly ensures faithful reconstruction and robust interpretability. At its core, GACR incorporates Observation-Anchored Residual Flow (OAR-Flow), which reformulates CR as a physically grounded residual inversion process. By anchoring the generative trajectory to the cloudy observation rather than pure noise, OAR-Flow enables fast, stable, and faithful reconstruction. To further preserve semantic structures critical for downstream interpretation, GACR integrates Geo-Contextual Prior Alignment (GCPA) to constrain the reconstruction within a semantic manifold induced by a Vision Foundation Model (VFM). Consequently, GACR strictly maintains the spatial-semantic integrity of complex landscapes. Extensive experiments across six CR datasets and twelve downstream tasks demonstrate that GACR produces superior reconstruction quality while consistently improving downstream task accuracy. The code is available at https://github.com/wzy6055/GACR.', 'score': 2, 'issue_id': 2771, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '492a880402889305', 'github_url': '', 'github_stars': 0, 'authors': ['Ziyao Wang', 'Maonan Wang', 'Yucheng He', 'Xianping Ma', 'Ziyi Wang', 'Hongyang Zhang', 'Yirong Cheng', 'Man-on Pun'], 'affiliations': ['Faculty of Geosciences and Engineering, Southwest Jiaotong University, Chengdu, China', 'School of Science and Engineering, The Chinese University of Hong Kong, Shenzhen, Shenzhen, China', 'Shanghai Ai Lab, Shanghai, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.02471.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#data', '#dataset', '#healthcare', '#benchmark', '#optimization'], 'emoji': '☁️', 'ru': {'title': 'Надежное удаление облаков для точного анализа изображений', 'desc': 'В статье представлена структура Geo-Anchored Cloud Removal, которая решает проблему семантического дрейфа при удалении облаков. Метод сочетает физически обоснованное восстановление остатков с семантическими ограничениями, полученными от моделей компьютерного зрения. Это обеспечивает надежное восстановление изображений и улучшает результаты последующих аналитических задач, таких как семантическая сегментация. Проведенные эксперименты показывают, что предложенная методика значительно повышает качество восстановления и точность последующих задач.'}, 'en': {'title': 'Enhancing Cloud Removal with Semantic Integrity', 'desc': 'The Geo-Anchored Cloud Removal (GACR) framework addresses the issue of semantic drift in cloud removal for optical remote sensing. It combines physically grounded residual inversion with semantic constraints from vision foundation models to ensure accurate reconstruction. By using Observation-Anchored Residual Flow (OAR-Flow), GACR anchors the reconstruction process to actual observations, enhancing stability and fidelity. This approach not only improves the quality of cloud removal but also boosts the performance of downstream tasks like semantic segmentation and change detection.'}}}, {'id': 'https://huggingface.co/papers/2607.01420', 'title': 'MultAttnAttrib: Training-Free Multimodal Attribution in Long Document Question Answering', 'url': 'https://huggingface.co/papers/2607.01420', 'abstract': "Abstract MultAttnAttrib is a training-free multimodal attribution method that locates source evidence in documents using attention heads and calibrated thresholds, achieving superior accuracy and efficiency compared to existing approaches.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct As grounded QA systems are increasingly deployed in AI assistants, accurately attributing generated answers to evidence is critical for user trust and model safety. While unimodal attributions have been explored in depth, the multimodal setting remains relatively under-researched. As a result, we introduce MultAttnAttrib, a training-free attribution-generation method that leverages a model's prefill pass, selected attention heads, and calibrated thresholds to locate source evidence within a document. To establish baseline results for the method, we introduce MultAttrEval, a complementary benchmark dataset annotated with fine-grained, ground-truth attributions for answer components grounded in multimodal source documents. To our knowledge, this is the first evaluation dataset designed specifically for multimodal attribution in long-form documents. Experimental results show that MultAttnAttrib consistently outperforms a variety of attribution-generation methods, including several strong prompting-based approaches and matches the latest frontier models such as GPT 5.4. Our method not only substantially improves attribution accuracy for both unimodal and multimodal attribution types, but also produces attributions at up to one-seventh of the direct inference latency compared to prompting on the same base model.", 'score': 2, 'issue_id': 2771, 'pub_date': '2026-07-01', 'pub_date_card': {'ru': '1 июля', 'en': 'July 1', 'zh': '7月1日'}, 'hash': '5ce6a6cf54c09d2e', 'github_url': '', 'github_stars': 0, 'authors': ['Dang Quang Thien Tran', 'Quang V. Dang', 'Vinamra Tyagi', 'Sai Soorya Rao Veeravalli', 'Trang Nguyen', 'Ryan A. Rossi', 'Franck Dernoncourt', 'Nedim Lipka', 'Koustava Goswami', 'Samyadeep Basu'], 'affiliations': [], 'pdf_title_img': 'assets/pdf/title_img/2607.01420.jpg', 'data': {'categories': ['#multimodal', '#interpretability', '#benchmark', '#dataset', '#long_context', '#prompting'], 'emoji': '🔍', 'ru': {'title': 'Новый подход к многомодальной атрибуции', 'desc': 'Статья представляет метод MultAttnAttrib, который не требует обучения и предназначен для атрибуции многомодальных данных. Он использует головы внимания и откалиброванные пороги для локализации источников информации в документах с высокой точностью и эффективностью. Авторы также вводят набор данных MultAttrEval, который предоставляет базовые результаты для оценки методов атрибуции. Экспериментальные результаты показывают значительные улучшения в точности атрибуции по сравнению с существующими подходами.'}, 'en': {'title': 'Revolutionizing Multimodal Attribution with MultAttnAttrib', 'desc': 'MultAttnAttrib is a novel method for multimodal attribution that identifies source evidence in documents without requiring training. It utilizes attention heads and calibrated thresholds to enhance both accuracy and efficiency in generating attributions. This method addresses the gap in multimodal attribution research, providing a new benchmark dataset called MultAttrEval for evaluating attribution in long-form documents. Experimental results demonstrate that MultAttnAttrib outperforms existing methods and significantly reduces inference latency.'}}}];
        const articlesContainer = document.getElementById('articles-container');

        }

                : window.location.pathname;

            window.history.pushState({}, '', newUrl);

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';

                document.body.classList.remove('light-theme');

                settingSortBy = 'issue_id';

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d', '#agent_memory', '#agents (2)', '#agi (1)', '#alignment', '#architecture (2)', '#audio', '#benchmark (4)', '#compression (1)', '#context_window', '#continual_learning', '#data (2)', '#dataset (3)', '#diffusion (1)', '#ethics', '#games (1)', '#graphs (1)', '#hallucinations', '#healthcare (1)', '#inference (3)', '#interpretability (2)', '#knowledge_graphs', '#leakage', '#long_context (1)', '#low_resource', '#machine_translation', '#math', '#memorization', '#memory', '#multilingual', '#multimodal (2)', '#open_source (2)', '#optimization (6)', '#plp', '#prompt_caching', '#prompting (1)', '#rag (1)', '#reasoning (1)', '#retrieval (1)', '#retrieval_eval', '#rl (1)', '#rlhf', '#robotics (2)', '#science', '#security (1)', '#session_memory', '#small_models', '#story_generation', '#survey (1)', '#synthetic', '#tool_use', '#training (1)', '#transfer_learning'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-06 10:17',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-06 10:17')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-06 10:17')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
