wer numerical precision to fit tight memory budgets, saving memory in place rather than adding to it. Because the runtime owns every internal tensor, it also exposes activation steering, a low-cost way to steer what the model generates. We judge the quality cost with three independent measures of the output (prompt adherence, overall audio quality, taste preservation), each compared against the ordinary variation between random seeds. Eight-bit precision shows no measurable quality loss on any measure while sharply cutting memory, and it is the fastest mode on the GPU; four-bit adds a small, bounded cost but shrinks the footprint enough to run the 1.2-billion-parameter model on an 8\\,GB Pi. Against the official implementation, aria matches or exceeds generation speed and starts about seven times faster. A case study of the steering interface generates music carrying taste associations (sonic seasoning), with genuine but bounded control for a subset of attributes. These results make a compact, quantized runtime with built-in control a practical basis for on-device semantic audio in Internet-of-Sounds settings. The aria runtime is released at https://github.com/matteospanio/aria.', 'score': 3, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '2148aea50674fdf5', 'github_url': '', 'github_stars': 0, 'authors': ['Matteo Spanio', 'Antonio Rodà'], 'affiliations': ['Centro di Sonologia Computazionale (CSC) Dept. of Information Engineering, University of Padova Padova, Italy'], 'pdf_title_img': 'assets/pdf/title_img/2607.08526.jpg', 'data': {'categories': ['#inference', '#open_source', '#audio', '#optimization'], 'emoji': '🎶', 'ru': {'title': 'Эффективная генерация музыки на встроенных устройствах', 'desc': 'Данная статья представляет новый исполняемый код aria, который позволяет эффективно генерировать музыку из текста на встроенных устройствах без зависимостей от фреймворков. Основным достижением является исследование квантизации, что позволяет запускать модели с меньшей точностью, экономя память и улучшая производительность. Также реализована функция управления активацией, позволяющая четко направлять процесс генерации. Результаты показывают, что квантизация до восьми бит не приводит к потере качества, сохраняя скорость работы на высоком уровне.'}, 'en': {'title': 'Efficient Text-to-Music Generation for Embedded Devices', 'desc': 'This paper introduces aria, a lightweight runtime for text-to-music generation that operates without dependencies, making it suitable for embedded devices. It utilizes quantization to reduce memory usage while maintaining audio quality, allowing it to run on various hardware, including Raspberry Pi. The runtime also features activation steering, enabling controlled generation of music attributes. The results demonstrate that aria can achieve fast generation speeds and high-quality output, making it a practical solution for on-device audio applications.'}}}, {'id': 'https://huggingface.co/papers/2607.08093', 'title': 'CausalDS: Benchmarking Causal Reasoning in Data-Science Agents', 'url': 'https://huggingface.co/papers/2607.08093', 'abstract': 'Abstract CausalDS is a benchmark for evaluating causal reasoning in data-science workflows that combines synthetic causal structures with realistic observational data and natural-language stories across Pearl\'s three rungs of causal inference.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Large language models (LLMs) increasingly act as integrated data-science agents, combining abstract reasoning with advanced tool use. Yet the relevant benchmark landscape largely divides into symbolic causal reasoning benchmarks without realistic data analysis or data analysis benchmarks without a principled causal data-generating structure. Furthermore, existing causal evaluation datasets are often restricted to curated examples from existing sources, with diversity coming from limited templatized variations rather than from systematic generation of novel synthetic causal structures. We introduce CausalDS, a benchmark for evaluating causal reasoning in agentic data-science workflows. Each benchmark instance is a scene consisting of a sampled structural causal model (SCM) with generated observational data and an accompanying synthetic natural-language story grounded in a realistic domain. We optionally ground the composition of the benchmark components in empirical distributions obtained from real-world datasets, thus retaining empirical structure while reducing the "causal parrot" risk through completely synthetic generation. From each scene, we then derive tasks spanning all three of Pearl\'s rungs, with typical data-science prediction tasks appearing as Rung 1. Most tasks include a data science coding component, where the model typically needs to use several tools to arrive at the final answer due to the frequent presence of imperfect observations, which are generated by an observation model. Additionally, recognizing when a question admits no warranted answer and abstaining is treated as a first-class scored outcome. The benchmark thus jointly evaluates symbolic causal reasoning, data science, uncertainty quantification, abstention, and tool use/coding.', 'score': 3, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '40bd10a0ddb10842', 'github_url': '', 'github_stars': 0, 'authors': ['Andrej Leban', 'Yuekai Sun'], 'affiliations': ['Department of Statistics, University of Michigan, Ann Arbor, MI, United States'], 'pdf_title_img': 'assets/pdf/title_img/2607.08093.jpg', 'data': {'categories': ['#tool_use', '#benchmark', '#reasoning', '#data', '#synthetic', '#agents'], 'emoji': '🔍', 'ru': {'title': 'CausalDS: новый подход к оценке причинного мышления!', 'desc': 'CausalDS — это бенчмарк для оценки причинного мышления в рамках рабочих процессов в области анализа данных. Он сочетает синтетические причинные структуры с реалистичными наблюдательными данными и историями на естественном языке. Бенчмарк включает задачи, отражающие все три уровня причинного вывода по Пирлу, при этом каждая задача требует применения различных инструментов и кодирования для получения окончательного ответа. CausalDS позволяет оценивать не только причинные рассуждения, но и анализ данных, количествование неопределенности и возможность отказа от ответа.'}, 'en': {'title': 'CausalDS: Bridging Causal Reasoning and Data Science', 'desc': 'CausalDS is a new benchmark designed to assess causal reasoning in data science workflows by integrating synthetic causal models with realistic data and natural-language narratives. It addresses the gap between symbolic causal reasoning and practical data analysis by providing diverse, systematically generated causal structures. The benchmark includes tasks that span all three levels of causal inference as defined by Pearl, focusing on data science coding and the ability to handle imperfect observations. Additionally, it emphasizes the importance of recognizing when a question cannot be answered, treating abstention as a valuable outcome in the evaluation process.'}}}, {'id': 'https://huggingface.co/papers/2607.03936', 'title': 'Can Dialects Be Steered Like Languages? Sparse Neurons and Distributed Directions in Arabic LLMs', 'url': 'https://huggingface.co/papers/2607.03936', 'abstract': 'Abstract Arabic language models exhibit dialect-specific neural representations that can be manipulated at inference time to control dialectal output without requiring additional training.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct A key challenge in Arabic NLP is the scarcity of dialectal data relative to Modern Standard Arabic (MSA), causing LLMs to overproduce MSA and struggle with dialectally accurate generation. From an interpretability perspective, this raises a fundamental question: where and how are dialectal features encoded within model internals, and can these representations be leveraged to improve dialect generation without fine-tuning? This study investigates two complementary inference-time approaches that serve simultaneously as interpretability probes and control mechanisms. First, we conduct a neuron-level analysis, identifying sparse neuron populations that encode dialect-specific features and showing that amplifying or suppressing these neurons can steer model outputs toward target dialects. Second, motivated by the entanglement of dialectal features at the single-neuron level, we apply a vector-steering approach that extracts dialect-specific activation directions and injects them during inference. Together, these methods illuminate the geometry of dialectal knowledge in Arabic LLMs and offer a principled, interpretability-grounded framework for dialect control without requiring dialect-specific fine-tuning.', 'score': 3, 'issue_id': 2790, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '16a855ee0cf62adf', 'github_url': '', 'github_stars': 0, 'authors': ['Kareem Elozeiri', 'Mervat Abassy', 'Omar Kallas', 'Fahim Dalvi', 'Preslav Nakov', 'Kentaro Inui', 'Nadir Durrani'], 'affiliations': ['Mohamed bin Zayed University of Artificial Intelligence', 'Qatar Computing Research Institute, Hamad Bin Khalifa University', 'RIKEN', 'Tohoku University'], 'pdf_title_img': 'assets/pdf/title_img/2607.03936.jpg', 'data': {'categories': ['#training', '#inference', '#transfer_learning', '#multilingual', '#interpretability'], 'emoji': '🗣️', 'ru': {'title': 'Управление диалектами арабских LLM без переобучения', 'desc': 'Исследование посвящено особенностям арабских языковых моделей, которые могут генерировать текст на различных диалектах без дополнительного обучения. В статье рассматриваются две стратегии управления генерацией диалектов на этапе вывода, которые также позволяют лучше понять, как диалектные характеристики закодированы в модели. Первая стратегия включает анализ нейронов, помогающий выявить группы нейронов, отвечающих за диалектные особенности. Вторая стратегия использует векторный подход для встраивания активаций, специфичных для диалектов, в процессе генерации.'}, 'en': {'title': 'Controlling Dialect Output in Arabic LLMs Without Fine-Tuning', 'desc': "This paper explores how Arabic language models can generate dialect-specific outputs without needing extra training. It addresses the challenge of limited dialectal data compared to Modern Standard Arabic (MSA), which often leads to models producing more MSA than desired. The authors analyze neuron-level representations to identify which neurons encode dialect features and demonstrate how manipulating these neurons can influence the model's output. Additionally, they introduce a vector-steering method to enhance dialect generation, providing insights into the internal workings of Arabic LLMs and offering a framework for dialect control."}}}, {'id': 'https://huggingface.co/papers/2607.04690', 'title': 'PAST-TIDE: Prototype-Anchored Statement Tuning with Topic-Invariant Normalization for Stance Detection', 'url': 'https://huggingface.co/papers/2607.04690', 'abstract': 'Abstract  We introduce PAST-TIDE, our stance detection system addressing both subtasks of the StanceNakba Shared Task at NakbaNLP@LREC-COLING 2026. The main idea is statement tuning. We redefine stance as cloze-style masked language modeling (MLM), letting a verbalizer map label words to stance categories through the pre-trained MLM head rather than appending a randomly initialized classification head. We complement this with prototypical contrastive learning, which uses learnable class prototypes for batch-size independent contrastive training, and topic-conditional layer normalization for cross-topic Arabic stance detection. PAST-TIDE achieves macro-F1 scores of 0.75 for Subtask A and 0.74 for Subtask B on the official leaderboard, indicating that minimal architectural additions to a pre-trained model can remain competitive in low-resource settings.', 'score': 1, 'issue_id': 2793, 'pub_date': '2026-07-06', 'pub_date_card': {'ru': '6 июля', 'en': 'July 6', 'zh': '7月6日'}, 'hash': '67dfd9a514c46349', 'github_url': '', 'github_stars': 0, 'authors': ['Md. Shakhoyat Rahman Shujon', 'MD Jahid Hasan Jim', 'Md. Milon Islam', 'Md Rezwanul Haque', 'Fakhri Karray'], 'affiliations': ['Department of Computer Science and Engineering, Khulna University of Engineering & Technology', 'Department of Electrical and Computer Engineering, University of Waterloo', 'Department of Machine Learning, Mohamed bin Zayed University of Artificial Intelligence'], 'pdf_title_img': 'assets/pdf/title_img/2607.04690.jpg', 'data': {'categories': ['#dataset', '#training', '#low_resource'], 'emoji': '🧠', 'ru': {'title': 'Новая эра в обнаружении позиции с PAST-TIDE', 'desc': 'В данной работе представлена система обнаружения позиции PAST-TIDE, которая решает две подзадачи конкурса StanceNakba на NakbaNLP@LREC-COLING 2026. Основная идея заключается в настройке утверждений, где позиция определяется с помощью моделирования языка в стиле cloze. Мы используем прототипическое контрастивное обучение и нормализацию слоя, зависящую от темы, для улучшения обнаружения позиции в арабском языке. Результаты показывают, что минимальные изменения в архитектуре предварительно обученной модели позволяют достичь конкурентоспособных результатов в условиях нехватки ресурсов.'}, 'en': {'title': 'Efficient Stance Detection with PAST-TIDE', 'desc': 'PAST-TIDE is a stance detection system designed for the StanceNakba Shared Task. It innovatively uses statement tuning by redefining stance detection as a cloze-style masked language modeling task. The system employs prototypical contrastive learning to enhance training efficiency and incorporates topic-conditional layer normalization for better performance in Arabic stance detection. PAST-TIDE demonstrates strong results with macro-F1 scores of 0.75 and 0.74, showing that small modifications to pre-trained models can yield competitive outcomes in low-resource environments.'}}}];
        const articlesContainer = document.getElementById('articles-container');
        const sortDropdown = document.getElementById('sort-dropdown');
        const categoryFiltersContainer = document.getElementById('category-filters');
        const categoryFiltersLogicOptions = document.getElementById('category-options');
        const categoryToggle = document.getElementById('category-toggle');
        const clearCategoriesButton = document.getElementById('clear-categories');
        let selectedCategories = [];
        let selectedArticles = [];
        let sortBy = 'issue_id';     
        let showLimitHint = false; 
        let filterLogicIsAnd = false;

        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriesParam = urlParams.get('cat');
            let categories = categoriesParam ? categoriesParam.split(',') : [];
            categories = categories.map(element => `#${element}`);
            return categories
        }

        function updateUrlWithCategories() {
            let cleanedCategories = selectedCategories.map(element => element.replace(/^#/, ''));
            const newUrl = cleanedCategories.length > 0 
                ? `${window.location.pathname}?cat=${cleanedCategories.join(',')}`
                : window.location.pathname;
            console.log("cleanedCategories", cleanedCategories)
            window.history.pushState({}, '', newUrl);
        }

        function loadSettings() {
            const themeToggle = document.getElementById('theme-toggle');
            const sortDropdown = document.getElementById('sort-dropdown');

            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            let settingSortBy = localStorage.getItem('sort_by');
            filterLogicIsAnd = localStorage.getItem('filter_logic_is_and') === 'true';
            
            if (isDarkMode) {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }

            if ((!settingSortBy) || (settingSortBy === 'null')) {
                settingSortBy = 'issue_id';
            }

            if (filterLogicIsAnd) {
                document.getElementById('filter-logic-and').checked = true;
            } else {
                document.getElementById('filter-logic-or').checked = true;
            }

            sortDropdown.value = settingSortBy;
            sortBy = settingSortBy;
        }

        document.getElementById('theme-toggle').addEventListener('change', toggleTheme);
        document.getElementById('filter-logic-and').addEventListener('change', () => {
            filterLogicIsAnd = true;
            localStorage.setItem('filter_logic_is_and', 'true');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });
        document.getElementById('filter-logic-or').addEventListener('change', () => {
            filterLogicIsAnd = false;
            localStorage.setItem('filter_logic_is_and', 'false');
            filterAndRenderArticles();
            updateSelectedArticlesTitle();
        });

        function getUniqueCategories(articles) {
            const categories = new Set();
            articles.forEach(article => {
                if (article.data && article.data.categories) {
                    article.data.categories.forEach(cat => categories.add(cat));
                }
            });
            let res = Array.from(categories);
            res.sort();
            return res;
        }

        function createCategoryButtons() {
            //const categories = getUniqueCategories(articlesData);
            const categories = ['#3d (3)', '#agent_memory (2)', '#agents (4)', '#agi', '#alignment', '#architecture (4)', '#audio (2)', '#benchmark (8)', '#compression (1)', '#context_window', '#continual_learning (1)', '#data (4)', '#dataset (8)', '#diffusion (3)', '#ethics', '#games (5)', '#graphs', '#hallucinations', '#healthcare (2)', '#inference (6)', '#interpretability (2)', '#knowledge_graphs', '#leakage', '#long_context (4)', '#low_resource (1)', '#machine_translation', '#math', '#memorization', '#memory (3)', '#multilingual (1)', '#multimodal (3)', '#open_source (5)', '#optimization (14)', '#plp', '#prompt_caching', '#prompting', '#rag (1)', '#reasoning (6)', '#retrieval', '#retrieval_eval', '#rl (4)', '#rlhf', '#robotics', '#science (3)', '#security', '#session_memory', '#small_models', '#story_generation', '#survey (1)', '#synthetic (2)', '#tool_use (1)', '#training (12)', '#transfer_learning (1)'];

            categories.forEach(category => {
                let catNameSplitted = category.split(/(\s+)/);
                let catName = catNameSplitted[0];
                const button = document.createElement('span');
                button.textContent = catName;
                button.className = 'category-button';
                if (catNameSplitted.length < 2) {
                    button.classList.add('inactive');
                };
                button.onclick = () => toggleCategory(catName, button);
                categoryFiltersContainer.appendChild(button);
            });
        }

        function toggleCategory(category, button) {
            const index = selectedCategories.indexOf(category);
            if (index === -1) {
                selectedCategories.push(category);
                button.classList.add('active');
            } else {
                selectedCategories.splice(index, 1);
                button.classList.remove('active');
            }         
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
            setFilterOptionsVisibility();
        }

        function saveCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify(selectedCategories));
        }

        function updateSelectedArticlesTitle() {
            if ((selectedArticles.length === articlesData.length) & (selectedCategories.length === 0)) {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]}`;
            } else {
                categoryToggle.textContent = `🏷️ ${filterLabel[currentLang]} (${formatArticlesTitle(selectedArticles.length, currentLang)})`;
            }
        }

        function cleanCategorySelection() {
            localStorage.setItem('selectedCategories', JSON.stringify('[]'));
        }

        function loadCategorySelection() {
            const urlCategories = getUrlParameters();
            if (urlCategories.length > 0) {
                selectedCategories = urlCategories;
                saveCategorySelection();
            } else {
                const savedCategories = localStorage.getItem('selectedCategories');
                if (savedCategories && savedCategories !== '"[]"') {
                    selectedCategories = JSON.parse(savedCategories);                    
                }
            }
            updateCategoryButtonStates();
        }

        function updateCategoryButtonStates() {
            const buttons = categoryFiltersContainer.getElementsByClassName('category-button');
            Array.from(buttons).forEach(button => {
                if (selectedCategories.includes(button.textContent)) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        function filterAndRenderArticles() {
            console.log(selectedCategories);
            let filteredArticles; 

            if (filterLogicIsAnd) {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        selectedCategories.every(cat => article.data.categories.includes(cat))
                );
            } else {
                filteredArticles = selectedCategories.length === 0
                    ? articlesData
                    : articlesData.filter(article => 
                        article.data && article.data.categories && 
                        article.data.categories.some(cat => selectedCategories.includes(cat))
                    );            
            }

            console.log('filteredArticles', filteredArticles)

            selectedArticles = filteredArticles;
            sortArticles(selectedArticles);
        }

        function clearAllCategories() {
            selectedCategories = [];
            updateCategoryButtonStates();
            filterAndRenderArticles();
            saveCategorySelection();
            updateSelectedArticlesTitle();
            updateUrlWithCategories();
        }

        function renderArticles(articles) {
            if (articles.length > 50) {
                articles = articles.slice(0, 50);
                showLimitHint = true;
            } else {
                showLimitHint = false;
            }
            console.log(articles);
            articlesContainer.innerHTML = '';
            articles.forEach((item, index) => {
                if ("error" in item) {
                    console.log(`Omitting JSON. ${item["raw_data"]}`);
                    return;
                }
                
                let explanation = item["data"][currentLang]["desc"];
                let title = item["data"][currentLang]["title"];

                const cats = item["data"]["categories"].slice(0, 5).join(" ");
                const githubStars = Number(item["github_stars"]);
                let githubBlock = "";
                if (item["github_url"]) {
                    const starsText = Number.isFinite(githubStars) ? githubStars : 0;
                    githubBlock = `<span class="github-link"><span class="github-stars">⭐ ${starsText}</span><a href="${item['github_url']}" target="_blank">GitHub</a></span>`;
                }
                
                let affiliations = ""
                if ('affiliations' in item) {
                    affiliations = item["affiliations"].slice(0, 10).join(", ");
                }

                let pdfImg = "img/title_stub.png"
                if ('pdf_title_img' in item) {
                    pdfImg = '' + item['pdf_title_img']
                    
                }                

                const articleHTML = `
                    <article class='x${item["hash"]}'>
                        <div class="article-content" onclick="toggleAbstract(${index})">
                            <div class="background-digit">${index + 1}</div>
                            <div class="article-title-cont">
                                <div style="display:table-cell; vertical-align: middle;">
                                    <div class="article-title"><h2>${item['data']['emoji']} ${title}</h2></div>
                                </div>
                            </div>
                            <p class="meta">
                            🔺 ${item['score']}. ${item['title']}</p>
                            <p class="pub-date">${publishedLabel[currentLang]}${item['pub_date_card'][currentLang]}</p>
                            
                            <div class="article-pdf-title-img-cont"><img class="article-pdf-title-img" src="${pdfImg}"/></div>
                            
                            <div id="abstract-${index}" class="abstract">
                                <p>${explanation}</p>
                                <div id="toggle-${index}" class="abstract-toggle">...</div>
                            </div>

                            

                            <div class="links">
                                <a href="${item['url']}" target="_blank">${paperLabel[currentLang]}</a>
                                ${githubBlock}
                            </div>

                            <div class="affiliations">${affiliations}</div>

                            <div class="tags">${cats}</div>
                        </div>
                    </article>
                `;
                articlesContainer.innerHTML += articleHTML;
            });
        }
        
        function sortArticles() {
            let sortedArticles = [...selectedArticles];
            if (sortBy === 'issue_id') {
                sortedArticles.sort((a, b) => b.issue_id - a.issue_id);
            } else if (sortBy === 'pub_date') {
                sortedArticles.sort((a, b) => b.pub_date.localeCompare(a.pub_date));
            } else if (sortBy === 'github') {
                sortedArticles.sort((a, b) => (Number(b.github_stars) || 0) - (Number(a.github_stars) || 0));
            } else {
                sortedArticles.sort((a, b) => b.score - a.score);
            }
            renderArticles(sortedArticles);
            localStorage.setItem('sort_by', sortBy);
        }
        
        sortDropdown.addEventListener('change', (event) => {
            sortBy = event.target.value;
            sortArticles(event.target.value);
        });

        categoryToggle.addEventListener('click', () => {
            categoryFiltersContainer.classList.toggle('expanded');
            setFilterOptionsVisibility();
        });

        clearCategoriesButton.addEventListener('click', () => {
            clearAllCategories();
            setFilterOptionsVisibility();
        });

        function setFilterOptionsVisibility() {
            if (selectedCategories.length > 0) {
                categoryFiltersLogicOptions.style.display = 'inline-block';
            } else {
                categoryFiltersLogicOptions.style.display = 'none';
            }
        } 
        
        function updateTimeDiffs() {
            const timeDiff = document.getElementById('timeDiff');
            timeDiff.innerHTML = '🔄 ' + getTimeDiff('2026-07-12 05:57',lang=currentLang);
        }
        function updateSortingOptions() {
            const sortingLabels = {
                ru: {
                    default: "рейтингу",
                    pub_date: "дате публикации",
                    issue_id: "добавлению на HF",
                    github: "звёздам GitHub"
                },
                en: {
                    default: "rating",
                    pub_date: "publication date",
                    issue_id: "HF addition date",
                    github: "GitHub stars"
                },
                zh: {
                    default: "评分",
                    pub_date: "发布日期",
                    issue_id: "HF 收录日期",
                    github: "GitHub 星标"
                }
            };

            const dropdown = document.getElementById('sort-dropdown');
            const options = dropdown.options;

            for (let i = 0; i < options.length; i++) {
                const optionValue = options[i].value;
                options[i].text = sortingLabels[currentLang][optionValue];
            }
        }

        function updateLocalization() {
            const titleDate = document.getElementById('title-date');
            const prevDate = document.getElementById('prev-date');
            const nextDate = document.getElementById('next-date');
            const topMonth = document.getElementById('top-month-label');
            const topDay = document.getElementById('top-day-label');
            const papersCount = document.getElementById('title-articles-count');
            const sortLabelText = document.getElementById('sort-label-text');
            titleDate.innerHTML = feedDate[currentLang];
            prevDate.innerHTML = feedDatePrev[currentLang];
            nextDate.innerHTML = feedDateNext[currentLang];
            papersCount.innerHTML = formatArticlesTitle(articlesData.length, currentLang);
            sortLabelText.innerHTML = sortLabel[currentLang];
            if (topMonth) {
                topMonth.innerHTML = topMonthLabel[currentLang];
            }  
            if (topDay) {
                topDay.innerHTML = topDayLabel[currentLang];
            }             
            updateSelectedArticlesTitle();
            updateSortingOptions();
        } 
        function hideNextLink(format) {
            if (format === 'monthly') {
                if (isCurrentMonth('2026-07-12 05:57')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            } else {            
                if (isToday('2026-07-12 05:57')) {
                    const element = document.getElementById('nav-next');
                    if (element) {    
                        element.style.display = 'none';
                    }
                }
            }
        }

        loadSettings();
        createCategoryButtons();
        loadCategorySelection();
        filterAndRenderArticles();
        updateSelectedArticlesTitle();
        updateTimeDiffs();
        hideNextLink('daily'); 
        initializeLanguageFlags();
        updateLocalization();
        setFilterOptionsVisibility();
    </script>
</body>
</html>
