    <script>
    function toggleAbstract(id) {
        var abstract = document.getElementById('abstract-' + id);
        var toggle = document.getElementById('toggle-' + id);
        if (abstract.classList.contains('expanded')) {
            abstract.classList.remove('expanded');
            toggle.textContent = '...';
        } else {
            abstract.classList.add('expanded');
            toggle.textContent = '';
        }
    }
    function getTimeDiff(dateString, lang='ru') {
        const timeUnits = {
            ru: {
                minute: ["минуту", "минуты", "минут"],
                hour: ["час", "часа", "часов"],
                day: ["день", "дня", "дней"],
                justNow: "только что",
                ago: "назад"
            },
            en: {
                minute: ["minute", "minutes", "minutes"],
                hour: ["hour", "hours", "hours"],
                day: ["day", "days", "days"],
                justNow: "just now",
                ago: "ago"
            },
            zh: {
                minute: ["分钟", "分钟", "分钟"],
                hour: ["小时", "小时", "小时"],
                day: ["天", "天", "天"],
                justNow: "刚刚",
                ago: "前"
            }
        };

        function getPlural(number, words, lang) {
            if (lang === 'ru') {
                if (number % 10 === 1 && number % 100 !== 11) {
                    return words[0];
                } else if (number % 10 >= 2 && number % 10 <= 4 && (number % 100 < 10 || number % 100 >= 20)) {
                    return words[1];
                } else {
                    return words[2];
                }
            } else if (lang === 'en') {
                return number === 1 ? words[0] : words[1];
            } else {
                return words[0];
            }
        }

        function formatTimeDiff(number, unit, lang) {
            const unitWord = getPlural(number, timeUnits[lang][unit], lang);
            
            return `${number} ${unitWord} ${timeUnits[lang].ago}`;
        }

        if (!['ru', 'en'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en');
        }

        const pastDate = new Date(dateString.replace(" ", "T") + ":00Z");
        const currentDate = new Date();
        const diffInSeconds = Math.floor((currentDate - pastDate) / 1000);
        
        const minutes = Math.floor(diffInSeconds / 60);
        const hours = Math.floor(diffInSeconds / 3600);
        const days = Math.floor(diffInSeconds / 86400);

        if (minutes === 0) {
            return timeUnits[lang].justNow;
        } else if (minutes < 60) {
            return formatTimeDiff(minutes, 'minute', lang);
        } else if (hours < 24) {
            return formatTimeDiff(hours, 'hour', lang);
        } else {
            return formatTimeDiff(days, 'day', lang);
        }
    }
    function isToday(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth() &&
            inputDate.getDate() === today.getDate()
        );
    }
    function isCurrentMonth(dateString) {
        const inputDate = new Date(dateString);
        const today = new Date();
        return (
            inputDate.getFullYear() === today.getFullYear() &&
            inputDate.getMonth() === today.getMonth()
        );
    }
    function formatArticlesTitle(number, lang='ru') {
        const lastDigit = number % 10;
        const lastTwoDigits = number % 100;
        let word;

        if (!['ru', 'en', 'zh'].includes(lang)) {
            throw new Error('Unsupported language. Supported languages are: ru, en, zh');
        }

        if (lang === 'ru') {
            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                word = "статей";
            } else if (lastDigit === 1) {
                word = "статья";
            } else if (lastDigit >= 2 && lastDigit <= 4) {
                word = "статьи";
            } else {
                word = "статей";
            }
        } else if (lang === 'en') {
            if (number === 1) {
                word = 'paper'
            } else {
                word = 'papers'
            }
        } else if (lang === 'zh') {
            word = "篇论文"
        }

        if (lang === 'zh') {
            return `${number}${word}`;
        } else {
            return `${number} ${word}`;
        }
    }

            const flags = document.querySelectorAll('.flag-svg');

                    flag.classList.add('active');

                flag.addEventListener('click', () => {
                    flags.forEach(f => f.classList.remove('active'));

        function toggleTheme() {

            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');

            const isDarkMode = body.classList.contains('dark-theme');
            localStorage.setItem('darkMode', isDarkMode);

                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf nightly";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.add('rotate');
            }  else {
                const title = document.getElementById('doomgrad');
                title.innerHTML = "hf daily";
                const titleSign = document.getElementById('doomgrad-icon');
                titleSign.classList.remove('rotate');
            }

        const articlesData = [{'id': 'https://huggingface.co/papers/2607.03118', 'title': 'Vidu S1: A Real-Time Interactive Video Generation Model', 'url': 'https://huggingface.co/papers/2607.03118', 'abstract': 'Abstract Vidu S1 is a real-time interactive video generation model that supports voice-controlled digital character animation with infinite-length output and high frame rate on consumer hardware.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct We introduce Vidu S1, a real-time interactive video generation model supporting voice control of digital characters. Users can control video generation content at any moment through voice instructions. Vidu S1 supports infinite-length real-time video generation without blurring, drift, or visual distortion. Built with TurboDiffusion and TurboServe, Vidu S1 outputs 540p real-time videos at up to 42 FPS on regular consumer GPUs. Users can upload custom images of real people, anime, and pets, and choose different voice tones for personalized experiences. Experiments show that Vidu S1 achieves the best performance across all test metrics while fully meeting real-time inference requirements. A playable online demo is available at https://vidu.com/vidu-stream.', 'score': 119, 'issue_id': 2789, 'pub_date': '2026-07-03', 'pub_date_card': {'ru': '3 июля', 'en': 'July 3', 'zh': '7月3日'}, 'hash': '47790877a22b5feb', 'github_url': '', 'github_stars': 0, 'authors': ['Jintao Zhang', 'Kai Jiang', 'Jintao Chen', 'Xu Wang', 'Yang Luo', 'Yuji Wang', 'Dechuang Chen', 'Jungang Li', 'Chengyang Ye', 'Marco Chen', 'Hongzhou Zhu', 'Min Zhao', 'Yuxuan Jiang', 'Zhengkun Huang', 'Chendong Xiang', 'Kaiwen Zheng', 'Haoxu Wang', 'Xiaohang Wang', 'Qi Jia', 'Xin Chen', 'Yimin Chen', 'Youhe Jiang', 'Fangcheng Fu', 'Zhijie Deng', 'Fan Bao', 'Jianfei Chen', 'Jun Zhu'], 'affiliations': ['Shengshu Technology', 'Tsinghua University'], 'pdf_title_img': 'assets/pdf/title_img/2607.03118.jpg', 'data': {'categories': ['#inference', '#diffusion', '#audio', '#3d', '#games', '#multimodal'], 'emoji': '🎥', 'ru': {'title': 'Генерация видео в реальном времени с голосовым управлением', 'desc': 'Vidu S1 — это модель генерации видео в реальном времени, которая позволяет анимировать цифровых персонажей при помощи голосового управления. Пользователи могут управлять контентом видео в любое время с помощью голосовых команд. Модель поддерживает бесконечную длину видео без размытия и искажений, обеспечивая высокую частоту кадров. Vidu S1 создает 540p видео в реальном времени на потребительских графических процессорах с качеством, соответствующим самым высоким стандартам.'}, 'en': {'title': 'Voice-Controlled Real-Time Video Generation', 'desc': 'Vidu S1 is a cutting-edge model for generating interactive videos in real-time, allowing users to animate digital characters using voice commands. It can produce videos of any length without losing quality, ensuring smooth visuals without blurring or distortion. The model operates efficiently on standard consumer hardware, delivering 540p videos at up to 42 frames per second. Users can personalize their experience by uploading images and selecting different voice tones for their characters.'}}}, {'id': 'https://huggingface.co/papers/2603.29616', 'title': 'Video-Oasis: Rethinking Evaluation of Video Understanding', 'url': 'https://huggingface.co/papers/2603.29616', 'abstract': 'Abstract Video-Oasis diagnostics reveal that half of existing video benchmarks can be solved without visual input, exposing significant capability gaps in current video understanding models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The inherent complexity of video understanding makes it difficult to determine whether Video-LLM benchmark performance stems from visual perception, linguistic reasoning, or knowledge priors. While many benchmarks have emerged to assess high-level reasoning, shared criteria for evaluating video understanding remain largely overlooked. Instead of introducing yet another benchmark, we take a step back to re-examine the criteria for evaluating video understanding. In this work, we introduce Video-Oasis, a sustainable diagnostic suite for systematically auditing existing video understanding benchmarks. This audit reveals that 55\\% of existing benchmark samples are solvable without visual input or temporal context. After filtering these shortcuts, the remaining video-native challenges expose a substantial capability gap: state-of-the-art models perform only marginally above random guessing. Building on these findings, we use the distilled challenges as a testbed to investigate which algorithmic design choices contribute to robust video understanding. We hope our work provides a practical foundation for constructing rigorous video benchmarks and evaluating future Video-LLMs. Code is available at https://github.com/sejong-rcv/Video-Oasis.', 'score': 50, 'issue_id': 2790, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': 'b879f81a2b261b24', 'github_url': '', 'github_stars': 0, 'authors': ['Geuntaek Lim', 'Sungjune Park', 'Jaeyun Lee', 'Inwoong Lee', 'Taeoh Kim', 'Dongyoon Wee', 'Minho Shim', 'Yukyung Choi'], 'affiliations': ['NAVER Cloud, South Korea', 'Sejong University, South Korea'], 'pdf_title_img': 'assets/pdf/title_img/2603.29616.jpg', 'data': {'categories': ['#benchmark', '#survey', '#reasoning', '#dataset', '#interpretability'], 'emoji': '🎥', 'ru': {'title': 'Пробелы в понимании видео: время для новых стандартов!', 'desc': 'Статья обсуждает проблему оценки моделей для понимания видео, показывая, что многие существующие бенчмарки могут быть решены без визуального ввода. Авторы вводят новый диагностический набор Video-Oasis, который систематически проверяет текущие бенчмарки и выявляет возможности их улучшения. Выясняется, что 55% образцов могут быть решены без учета визуальной или временной информации. Эти результаты подчеркивают значительные пропуски в текущих моделях видео-LLM и необходимость более строгих критериев оценки.'}, 'en': {'title': 'Bridging the Gap in Video Understanding', 'desc': 'This paper introduces Video-Oasis, a diagnostic tool designed to evaluate existing video understanding benchmarks. The authors found that many benchmarks can be solved without using visual input, indicating a significant gap in the capabilities of current video understanding models. By filtering out these shortcuts, they reveal that state-of-the-art models struggle to perform better than random guessing on genuine video challenges. The study aims to establish a more rigorous framework for assessing video understanding and to guide the development of future Video-LLMs.'}}}, {'id': 'https://huggingface.co/papers/2601.16211', 'title': "Why Can't I Open My Drawer? Mitigating Object-Driven Shortcuts in Zero-Shot Compositional Action Recognition", 'url': 'https://huggingface.co/papers/2601.16211', 'abstract': 'Abstract RCORE addresses object-driven shortcuts in zero-shot compositional action recognition by using co-occurrence prior regularization and temporal order regularization to improve compositional generalization.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Zero-Shot Compositional Action Recognition (ZS-CAR) requires recognizing novel verb-object combinations composed of previously observed primitives. In this work, we tackle a key failure mode: models predict verbs via object-driven shortcuts (i.e., relying on the labeled object class) rather than temporal evidence. We argue that sparse compositional supervision and verb-object learning asymmetry can promote object-driven shortcut learning. Our analysis with proposed diagnostic metrics shows that existing methods overfit to training co-occurrence patterns and underuse temporal verb cues, resulting in weak generalization to unseen compositions. To address object-driven shortcuts, we propose Robust COmpositional REpresentations (RCORE) with two components. Co-occurrence Prior Regularization (CPR) adds explicit supervision for unseen compositions and regularizes the model against frequent co-occurrence priors by treating them as hard negatives. Temporal Order Regularization for Composition (TORC) enforces temporal-order sensitivity to learn temporally grounded verb representations. Across Sth-com and EK100-com, RCORE reduces shortcut diagnostics and consequently improves compositional generalization.', 'score': 47, 'issue_id': 2790, 'pub_date': '2026-07-02', 'pub_date_card': {'ru': '2 июля', 'en': 'July 2', 'zh': '7月2日'}, 'hash': '2b3b97a8e654ac3c', 'github_url': '', 'github_stars': 0, 'authors': ['Geo Ahn', 'Inwoong Lee', 'Taeoh Kim', 'Minho Shim', 'Dongyoon Wee', 'Jinwoo Choi'], 'affiliations': ['Kyung Hee University', 'NAVER Cloud'], 'pdf_title_img': 'assets/pdf/title_img/2601.16211.jpg', 'data': {'categories': ['#rl', '#reasoning', '#training', '#optimization'], 'emoji': '🔄', 'ru': {'title': 'Преодоление коротких путей в распознавании действий', 'desc': 'Статья рассматривает проблему объектно-ориентированных кратких путей в распознавании действий без обучения (zero-shot). Для улучшения генерализации композиций предлагается метод, который включает регуляризацию предварительных соотношений и учёт временного порядка. Анализ показывает, что существующие методы не учитывают временные подсказки и переобучаются на паттернах соизмеримости. Новый подход RCORE с двумя компонентами помогает преодолеть эти недостатки и улучшить обобщение на ранее невидимые композиции.'}, 'en': {'title': 'Enhancing Action Recognition by Tackling Object-Driven Shortcuts', 'desc': "The paper introduces RCORE, a method to enhance zero-shot compositional action recognition by addressing object-driven shortcuts. It identifies that models often rely on object labels instead of temporal evidence to predict actions, leading to poor generalization. RCORE employs Co-occurrence Prior Regularization to mitigate reliance on frequent co-occurrence patterns and Temporal Order Regularization to ensure models learn from the timing of actions. The proposed approach shows improved performance on benchmark datasets by reducing shortcut learning and enhancing the model's ability to recognize novel verb-object combinations."}}}, {'id': 'https://huggingface.co/papers/2607.08758', 'title': 'Ideas Have Genomes: Benchmarking Scientific Lineage Reasoning and Lineage-Grounded Idea Generation', 'url': 'https://huggingface.co/papers/2607.08758', 'abstract': 'Abstract A benchmark for scientific lineage reasoning and idea generation is introduced, organizing scientific works as genetic-like Idea Genome objects and evaluating both reasoning and generation capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Scientific ideas rarely start from a blank page. They inherit mechanisms, repair known limitations, and recombine pieces of earlier work, much like biological genomes. Current benchmarks still say little about whether AI systems can follow this inheritance structure. We present IdeaGene-Bench (IG-Bench), a benchmark for scientific lineage reasoning and lineage-grounded idea generation. IG-Bench is organized around the IdeaGene framework: each paper or proposal is represented as a set of minimal, typed, evidence-grounded Idea Genome objects, and a GenomeDiff aligns these objects to record inheritance, mutation, loss, external import, and novel insertion under six operational evolutionary dynamics. The benchmark contains 1,961 golden lineage traces, 1,085 curated Idea Genome objects, and 920 pairwise GenomeDiff records across 10 scientific domains. It supports two evaluations. IG-Exam (42 task types, 1,029 instances) tests closed-form lineage reasoning across Idea Genome abstraction, inheritance tracing, evolutionary reasoning, and lineage verification. IG-Arena evaluates generation with a lineage-conditioned Population-Evolution Score(PES), asking whether a proposal can be inserted as a coherent descendant of a given lineage population: it should inherit the right Idea Genome objects, vary meaningfully from nearby work, and offer selection value for future research. Experiments on 14 LLM-based scientists expose a compositional bottleneck. The strongest system reaches only 27.3% exact accuracy on lineage reasoning, and structured lineage context reshuffles system rankings rather than helping every participant uniformly.', 'score': 30, 'issue_id': 2789, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '4e051e29ba070c51', 'github_url': '', 'github_stars': 0, 'authors': ['Yifan Zhou', 'Qihao Yang', 'Yan Li', 'Donggang Li', 'Xiru Hu', 'Hokin Deng', 'Ziyang Gong', 'Xuanyi Zhou', 'Huacan Wang', 'Xiangchao Yan', 'Wanghan Xu', 'Wenlong Zhang', 'Shaofeng Zhang', 'Yue Zhou', 'Yifan Yang', 'Zhihang Zhong', 'Xue Yang'], 'affiliations': ['Carnegie Mellon University', 'East China Normal University', 'Microsoft Corporation', 'Shanghai Artificial Intelligence Laboratory', 'Shanghai Jiao Tong University', 'University of Chinese Academy of Sciences', 'University of Science and Technology of China'], 'pdf_title_img': 'assets/pdf/title_img/2607.08758.jpg', 'data': {'categories': ['#reasoning', '#science', '#benchmark'], 'emoji': '🧬', 'ru': {'title': 'Наследие идей: анализ и генерация', 'desc': 'В этой статье представлен бенчмарк для рассуждений о научном родословии и генерации идей, организующий научные работы как объекты Idea Genome, похожие на генетические. Эта система анализа позволяет оценить, могут ли ИИ системы следовать структуре наследования, которая характерна для научных идей. Бенчмарк IdeaGene-Bench включает 1961 золотую линию родословия и 1085 объектов Idea Genome, что охватывает 10 научных областей. Проведенные эксперименты показывают, что существующие модели LLM сталкиваются с трудностями при работе с концепциями наследования, достигая лишь 27,3% точности в рассуждениях о родословии.'}, 'en': {'title': 'Unlocking Scientific Creativity through Lineage Reasoning', 'desc': "This paper introduces a benchmark called IdeaGene-Bench (IG-Bench) for evaluating how well AI systems can reason about and generate scientific ideas based on their lineage. It organizes scientific works into genetic-like structures called Idea Genome objects, which capture the inheritance and evolution of ideas. The benchmark includes various tasks to test lineage reasoning and idea generation, revealing that current AI models struggle with these complex relationships. The findings highlight a significant challenge in AI's ability to understand and build upon existing scientific knowledge effectively."}}}, {'id': 'https://huggingface.co/papers/2607.08770', 'title': 'LongE2V: Long-Horizon Event-based Video Reconstruction, Prediction, and Frame Interpolation with Video Diffusion Models', 'url': 'https://huggingface.co/papers/2607.08770', 'abstract': 'Abstract LongE2V enables high-quality video recovery from sparse event streams by leveraging pre-trained video diffusion priors and addressing temporal stability and frame interpolation challenges.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Recovering high-quality video from sparse event streams is a challenging task. Regression methods often blur textures, while existing generative models struggle with long-term stability. We propose LongE2V, a novel approach that leverages pre-trained video diffusion priors to jointly handle event-based video reconstruction, prediction, and frame interpolation. By fine-tuning a foundational video model, our approach achieves high data efficiency and superior perceptual quality. We introduce Autoregressive Unrolling and Adaptive Context Switching to mitigate temporal drift in extremely long sequences. We also propose Reencoding Alignment with Cross Residual Correction to ensure precise bidirectional consistency during frame interpolation. Furthermore, Event Voxel Density Augmentation ensures robustness across varying sensor resolutions. Extensive experiments on real-world benchmarks demonstrate that LongE2V outperforms state-of-the-art methods across all three tasks, exhibiting exceptional temporal coherence and zero-shot generalization. Project page: https://cdfan0627.github.io/LongE2V-page/', 'score': 26, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': 'fd589736bd963b6e', 'github_url': '', 'github_stars': 0, 'authors': ['Cheng-De Fan', 'Chun-Wei Tuan Mu', 'Chen-Wei Chang', 'Chin-Yang Lin', 'Kun-Ru Wu', 'Yu-Chee Tseng', 'Yu-Lun Liu'], 'affiliations': ['National Yang Ming Chiao Tung University, Taiwan'], 'pdf_title_img': 'assets/pdf/title_img/2607.08770.jpg', 'data': {'categories': ['#diffusion', '#training', '#benchmark', '#optimization', '#dataset', '#data'], 'emoji': '🎥', 'ru': {'title': 'Новая эра восстановления видео с LongE2V', 'desc': 'Статья представляет новый метод LongE2V, который позволяет восстанавливать высококачественное видео из разреженных событийных потоков. Этот подход использует заранее обученные диффузионные модели видео для решения задач реконструкции, предсказания и интерполяции кадров. Метод включает такие техники, как Авто-регрессионное развертывание и Адаптивное переключение контекста, чтобы уменьшить временное дрift в длинных последовательностях. Эксперименты показывают, что LongE2V превосходит существующие методы по качеству и устойчивости.'}, 'en': {'title': 'Revolutionizing Video Recovery from Sparse Events', 'desc': 'LongE2V is a novel method for recovering high-quality videos from sparse event streams by using pre-trained video diffusion models. It addresses challenges like temporal stability and frame interpolation, which are common in video generation. The approach includes techniques like Autoregressive Unrolling and Adaptive Context Switching to reduce temporal drift in long sequences. Extensive testing shows that LongE2V outperforms existing methods, providing better visual quality and consistency across various tasks.'}}}, {'id': 'https://huggingface.co/papers/2607.08768', 'title': 'UniClawBench: A Universal Benchmark for Proactive Agents on Real-World Tasks', 'url': 'https://huggingface.co/papers/2607.08768', 'abstract': 'Abstract UniClawBench introduces a capability-driven benchmark for evaluating proactive agents in real-world environments using live Docker container evaluation and closed-loop assessment with multiple agent roles.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The rapid development of large language models and multimodal large language models has accelerated the emergence of proactive agents capable of operating everyday tools and assisting users in real-world environments. However, existing benchmarks struggle to evaluate such agents effectively, as they often rely on sandboxed environments and single-turn evaluation paradigms. Moreover, their scenario-based task taxonomies mix multiple model capabilities within the same task category, making it difficult to identify the root causes of agent failures. To address these limitations, we introduce UniClawBench, the first capability-driven benchmark designed to evaluate proactive agents in dynamic, real-world settings. UniClawBench is built around five foundational model capabilities: Skill Usage, Exploration, Long-Context Reasoning, Multimodal Understanding, and Cross-Platform Coordination. Based on these capabilities, we design 400 bilingual real-world tasks. Unlike previous benchmarks that rely on static, pre-recorded answers, our benchmark evaluates agents in live Docker containers using fine-grained, step-by-step completion checkpoints. Furthermore, we design a closed-loop evaluation strategy comprising an executor agent, a hidden supervisor agent, and a user agent to simulate realistic multi-turn human feedback without leaking grading criteria. To disentangle base model capabilities from framework-level design choices, we evaluate state-of-the-art models under multiple agent frameworks. Through comprehensive comparisons across both models and frameworks, we show how base model capabilities and agent framework designs jointly shape performance in real-world environments. To facilitate future research, we make our benchmark and code publicly available at https://github.com/HKU-MMLab/UniClawBench.', 'score': 26, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': 'fd9ed6aec14e6631', 'github_url': '', 'github_stars': 0, 'authors': ['Zhekai Chen', 'Chengqi Duan', 'Kaiyue Sun', 'Bohao Li', 'Yuqing Wang', 'Manyuan Zhang', 'Xihui Liu'], 'affiliations': ['HKU MMLab', 'Meituan'], 'pdf_title_img': 'assets/pdf/title_img/2607.08768.jpg', 'data': {'categories': ['#agent_memory', '#games', '#benchmark', '#long_context', '#multimodal', '#open_source', '#agents'], 'emoji': '🤖', 'ru': {'title': 'Новый взгляд на оценку проактивных агентов', 'desc': 'Статья представляет UniClawBench, новый бенчмарк для оценки проактивных агентов в реальных условиях. Он базируется на пяти ключевых возможностях моделей и включает 400 двуязычных задач. В отличие от предыдущих бенчмарков, UniClawBench использует реальную среду Docker и оценку с замкнутым контуром. Это позволяет более точно выявлять причины неудач агентов и улучшать их производительность.'}, 'en': {'title': 'Evaluating Proactive Agents in Real-World Scenarios', 'desc': 'UniClawBench is a new benchmark designed to evaluate proactive agents in real-world environments, focusing on their capabilities rather than just task completion. It addresses the limitations of existing benchmarks by using live Docker containers and a closed-loop evaluation system that simulates realistic human feedback. The benchmark is based on five key capabilities: Skill Usage, Exploration, Long-Context Reasoning, Multimodal Understanding, and Cross-Platform Coordination, with 400 bilingual tasks to assess these skills. By comparing various models and frameworks, UniClawBench helps identify how different capabilities and designs influence agent performance in dynamic settings.'}}}, {'id': 'https://huggingface.co/papers/2607.08765', 'title': 'Enhancing In-context Panoramic Generation via Geometric-aware Pretraining', 'url': 'https://huggingface.co/papers/2607.08765', 'abstract': 'Abstract Canvas360 is a two-stage framework for in-context panoramic generation that combines geometry-aware pretraining with fine-tuning, featuring a large-scale dataset and novel modeling techniques for improved geometric consistency and global coherence.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In this work, we present Canvas360, a two-stage framework for in-context panoramic generation that combines geometry-aware pretraining with downstream task-specific fine-tuning. To address the lack of large-scale, high-quality training data tailored to in-context panoramic tasks, we propose Canvas360Dataset, a collection of 1M high-quality paired panoramic samples for style transfer, inpainting, outpainting, and editing, enabling effective supervision across diverse in-context generation scenarios. On the modeling side, Canvas360 enhances text-to-panorama generation through parallel depth generation, velocity circular padding, and similarity loss regularization, enabling the model to learn geometry-aware representations, capture object distortion details, and improve geometric consistency and global coherence. Furthermore, empowered by strong panoramic priors, Canvas360 enables a unified in-context panoramic generation framework that supports diverse downstream tasks via token-level concatenation, surpassing prior methods in both task coverage and modeling flexibility. Extensive experiments show that Canvas360 improves panoramic image fidelity, achieving particularly strong performance on the panorama-specific FAED metric and competitive or leading results across the reported quantitative evaluations. More information can be found on our project page: https://zry000.github.io/Canvas360/', 'score': 17, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '0ae354aa6ea7024c', 'github_url': '', 'github_stars': 0, 'authors': ['Haoran Feng', 'Ruiyang Zhang', 'Longyi Zhang', 'Dizhe Zhang', 'Lu Qi'], 'affiliations': ['Beihang University', 'Insta360 Research', 'Tsinghua University', 'Wuhan University'], 'pdf_title_img': 'assets/pdf/title_img/2607.08765.jpg', 'data': {'categories': ['#games', '#optimization', '#architecture', '#dataset', '#synthetic'], 'emoji': '🖼️', 'ru': {'title': 'Canvas360: новая эра панорамной генерации', 'desc': 'Статья представляет фреймворк Canvas360, который предназначен для генерации панорамных изображений в контексте. Он использует двухступенчатый подход: предобучение с учетом геометрии и последующую настройку для конкретных задач. Для решения проблемы нехватки больших качественных наборов данных была создана база данных Canvas360Dataset, включающая 1 миллион пар панорамных изображений для различных задач. Canvas360 значительно улучшает геометрическую согласованность и глобальную когерентность панорамных изображений за счет новых моделей и техник.'}, 'en': {'title': 'Revolutionizing Panoramic Image Generation with Canvas360', 'desc': 'Canvas360 is a two-stage framework designed for generating panoramic images in context. It utilizes geometry-aware pretraining followed by fine-tuning to enhance the quality of generated images. The framework is supported by a large dataset, Canvas360Dataset, which contains 1 million high-quality panoramic samples for various tasks like style transfer and inpainting. By implementing advanced modeling techniques, Canvas360 achieves improved geometric consistency and global coherence, outperforming previous methods in both task coverage and flexibility.'}}}, {'id': 'https://huggingface.co/papers/2607.08404', 'title': 'DrugGen 2: A disease-aware language model for enhancing drug discovery', 'url': 'https://huggingface.co/papers/2607.08404', 'abstract': 'Abstract DrugGen-2 generates small molecules conditioned on disease ontology and target protein sequences through fine-tuning GPT-2 with supervised learning and reinforcement learning using GRPO, achieving superior molecular diversity and binding affinity compared to baseline models.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Current computational approaches for drug design typically focus on generating molecules conditioned on specific targets or general molecular properties, often neglecting the influence of disease context on target behavior and therapeutic outcomes. To address this gap, we introduce DrugGen-2, a novel generative model that designs small molecules conditioned on both disease ontology and target protein sequences. DrugGen-2 was developed by fine-tuning a pre-trained GPT-2 model on a curated dataset of approved drugs linked to their diseases and targets, using a two-step strategy of supervised fine-tuning followed by reinforcement learning via group relative policy optimization (GRPO). This process was guided by reward functions optimizing for chemical validity, novelty, diversity, and high predicted binding affinity. When evaluated on five protein targets relevant to diabetic nephropathy, DrugGen-2 significantly outperformed baseline models (DrugGPT and DrugGen). It demonstrated a superior capacity to generate unique molecules, exhibited greater structural similarity to approved drugs, and achieved improved predicted binding affinities across all targets. Molecular docking analyses further supported these findings, identifying candidate ligands with strong binding potential, including compounds with predicted affinities (-9.917, -9.485, and -9.367) exceeding those of reference drugs such as enalapril for angiotensin-converting enzyme (-8.283). By integrating disease-specific context into molecular generation, DrugGen-2 advances AI-assisted drug discovery, offering a powerful tool for de novo design and drug repurposing that accounts for the complex interplay between diseases and molecular targets.', 'score': 16, 'issue_id': 2790, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': 'c5fcfac715cf9bd0', 'github_url': '', 'github_stars': 0, 'authors': ['Ali Motahharynia', 'Mohammadreza Ghaffarzadeh-Esfahani', 'Mahsa Sheikholeslami', 'Navid Mazrouei', 'Matin Irajpour', 'Yousof Gheisari', 'Hajar Sirous'], 'affiliations': ['Bioinformatics Research Center, Isfahan University of Medical Sciences, Isfahan, Iran', 'Department of Genetics and Molecular Biology, Isfahan University of Medical Sciences, Isfahan, Iran', 'Department of Medicinal Chemistry, School of Pharmacy, Isfahan University of Medical Sciences, Isfahan, Iran', 'Isfahan Cardiovascular Research Center, Cardiovascular Research Institute, Isfahan University of Medical Sciences, Isfahan, Iran', 'Isfahan Neuroscience Research Center, Isfahan University of Medical Sciences, Isfahan, Iran', 'Regenerative Medicine Research Center, Isfahan University of Medical Sciences, Isfahan, Iran'], 'pdf_title_img': 'assets/pdf/title_img/2607.08404.jpg', 'data': {'categories': ['#rl', '#training', '#optimization', '#dataset', '#science', '#healthcare'], 'emoji': '💊', 'ru': {'title': 'Новые молекулы для борьбы с заболеваниями', 'desc': 'DrugGen-2 представляет собой новый генеративный модель, которая разрабатывает маломолекулярные соединения с учетом онтологии заболеваний и последовательностей целевых белков. Модель была дообучена на наборе данных, содержащем одобренные препараты, связанный с их заболеваниями и целями, используя стратегию, включающую контролируемое дообучение и обучение с подкреплением. DrugGen-2 значительно превзошел базовые модели по молекулярному разнообразию и связывающей способности, что подтверждается анализом молекулярного докинга. Итак, этот инструмент предлагает новые возможности для открытия лекарств с учетом специфики заболеваний.'}, 'en': {'title': 'Revolutionizing Drug Design with Disease Context', 'desc': 'DrugGen-2 is a generative model that creates small molecules based on disease context and target protein sequences. It improves drug design by fine-tuning the GPT-2 model using supervised learning and reinforcement learning techniques. This model outperforms existing methods by generating diverse and effective molecules with better binding affinities. By considering disease-specific information, DrugGen-2 enhances AI-assisted drug discovery and offers new possibilities for drug design and repurposing.'}}}, {'id': 'https://huggingface.co/papers/2607.07740', 'title': 'Jet-Long: Efficient Long-Context Extension with Dynamic Bifocal RoPE', 'url': 'https://huggingface.co/papers/2607.07740', 'abstract': 'Abstract A novel zero-shot method called Jet-Long enables efficient long-context processing for large language models by dynamically adapting rescaling factors and utilizing a bifocal attention mechanism that maintains high performance across varying sequence lengths.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Modern LLMs are increasingly deployed in long-context applications such as retrieval-augmented generation, repository-level coding, and agentic workflows whose accumulated reasoning and tool traces routinely push the input an order of magnitude past the pretraining window, making zero-shot context extension the dominant deployment path for open-weight checkpoints. Most existing zero-shot methods fix a single rescaling factor up front, so an aggressive factor sacrifices short-context fidelity while a conservative one breaks down at long contexts. We propose Jet-Long, a tuning-free zero-shot method that pairs a local RoPE-faithful window with a long-range window whose rescaling factor adapts dynamically to the current sequence length, recovering the base model exactly at short inputs while extrapolating cleanly at long ones. An inclusion-exclusion attention merge and an on-the-fly RoPE correction rotation make the bifocal construction essentially free at inference; fused into a single CuTe kernel, long-context prefill reaches up to 1.39times FA2 throughput on H100 (approaching the Hopper-only FA4), and single-batch generation incurs le 4% overhead at every length. On Qwen3-1.7B/4B/8B up to 128K context, Jet-Long leads RULER by +4.79/+2.18/+2.03~pp over the strongest baseline at 1.7B/4B/8B, achieves the best overall accuracy on HELMET-RAG (a benchmark identified by HELMET as the most efficient predictor of downstream long-context performance) and attains the lowest PG-19 perplexity. Jet-Long also generalizes to hybrid attention architectures such as Jet-Nemotron for further long-context improvement without retraining, and remains hyperparameter-resilient for ease of deployment.', 'score': 14, 'issue_id': 2789, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '110bfb35ba5bdb6a', 'github_url': '', 'github_stars': 0, 'authors': ['Haozhan Tang', 'Zerui Wang', 'Yuxian Gu', 'Song Han', 'Han Cai'], 'affiliations': ['NVIDIA'], 'pdf_title_img': 'assets/pdf/title_img/2607.07740.jpg', 'data': {'categories': ['#inference', '#training', '#rag', '#long_context', '#optimization', '#architecture', '#multimodal'], 'emoji': '🔍', 'ru': {'title': 'Эффективная обработка длинного контекста с Jet-Long', 'desc': 'В статье представлен новый метод нулевого обучения под названием Jet-Long, который обеспечивает эффективную обработку длинного контекста для крупных языковых моделей. Он использует динамическое изменение коэффициентов рескалирования и механизм двуокулярного внимания, чтобы поддерживать высокую производительность при различных длинах последовательностей. Jet-Long адаптируется к текущей длине последовательности, что позволяет сохранять точность на коротких входах и добиваться чистого экстраполирования на длинных. Этот метод также демонстрирует высокую производительность на различных архитектурах внимания без необходимости дообучения.'}, 'en': {'title': 'Jet-Long: Dynamic Zero-Shot Long-Context Processing', 'desc': 'The paper introduces Jet-Long, a zero-shot method designed for efficient long-context processing in large language models. It dynamically adjusts rescaling factors and employs a bifocal attention mechanism to maintain performance across different sequence lengths. Unlike traditional methods that use a fixed rescaling factor, Jet-Long adapts to the input length, ensuring high fidelity for short contexts and effective extrapolation for long ones. The method shows significant improvements in throughput and accuracy on various benchmarks, making it suitable for applications requiring extensive context handling without the need for retraining.'}}}, {'id': 'https://huggingface.co/papers/2607.03803', 'title': 'CineMobile: On-Device Image-to-Video Diffusion for Cinematic Camera Motion Generation', 'url': 'https://huggingface.co/papers/2607.03803', 'abstract': 'Abstract CineMobile enables efficient image-to-video generation on mobile devices through distillation-guided pruning, diffusion distillation, and hybrid quantization techniques while maintaining visual quality and achieving significant speedup.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct The growing demand for image-to-video creation on mobile devices has increasingly focused on cinematic motion effects like bullet time, dolly zoom, slow motion, etc. While Diffusion Transformers (DiTs) exhibit strong performance in video generation, their large parameter sizes and multi-step iterative denoising processes lead to substantial computational overhead, making efficient generation on mobile devices challenging. We propose CineMobile to bridge the gap. In particular, CineMobile adopts a three-fold optimization strategy: (1) leveraging a distillation-guided pruning approach to derive a compact yet efficient model that retains the essential video generation capabilities required for cinematic effects; (2) optimizing the compressed model into a 4-step generator via a combination of diffusion distillation and reinforcement learning; (3) employing a hybrid post-training quantization strategy to compress the model footprint to under 1 GB. Experimental results show that compared to the teacher model with the Wan 2.1 architecture, CineMobile achieves a 40x speedup in generation while maintaining comparable visual quality. Specifically, CineMobile generates 49-frame 480p videos with a per-step denoising latency of 0.6s on an NVIDIA H200 GPU and 20s on the MediaTek Dimensity 8400 Ultimate 5G platform, with a peak memory usage of 1.8 GB, demonstrating its practical applicability for mobile-based image-to-video creation.', 'score': 12, 'issue_id': 2790, 'pub_date': '2026-07-04', 'pub_date_card': {'ru': '4 июля', 'en': 'July 4', 'zh': '7月4日'}, 'hash': '47f7956573227786', 'github_url': '', 'github_stars': 0, 'authors': ['Xuyao Huang', 'Zelai Deng', 'Xu Wang', 'Xizhong Xiao', 'Zhijie Deng'], 'affiliations': ['Nankai University', 'Shanghai Jiao Tong University', 'Transsion'], 'pdf_title_img': 'assets/pdf/title_img/2607.03803.jpg', 'data': {'categories': ['#compression', '#diffusion', '#training', '#optimization', '#inference'], 'emoji': '🎥', 'ru': {'title': 'Эффективная генерация видео на мобильных устройствах', 'desc': 'CineMobile предоставляет эффективную генерацию видео из изображений на мобильных устройствах с использованием методов, таких как направленная дистилляция и квантование. Основное внимание уделяется созданию кинематографических эффектов, таких как замедленная съемка и дольный зум. Модель проходит три этапа оптимизации, включая обрезку, дистилляцию и гибридное квантование. Результаты показывают, что CineMobile достигает ускорения генерации в 40 раз при сохранении приемлемого качества изображения.'}, 'en': {'title': 'Efficient Image-to-Video Generation for Mobile Devices', 'desc': 'CineMobile is a new method for creating videos from images on mobile devices, focusing on cinematic effects like slow motion and bullet time. It uses a combination of techniques including distillation-guided pruning to create a smaller, efficient model that still performs well. The model is further optimized through diffusion distillation and reinforcement learning, making it faster and less resource-intensive. Experimental results show that CineMobile can generate videos significantly faster than previous models while keeping high visual quality, making it suitable for mobile applications.'}}}, {'id': 'https://huggingface.co/papers/2607.08763', 'title': 'OpenCoF: Learning to Reason Through Video Generation', 'url': 'https://huggingface.co/papers/2607.08763', 'abstract': 'Abstract OpenCoF framework introduces a reasoning video dataset and model that improve temporal reasoning through diverse supervision and explicit reasoning tokens for visual and textual cues.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reasoning has become a core capability for large models, especially when reliable decisions require understanding logical consequences. Recent video generation models offer a reasoning path distinct from previous Chain-of-Thought (CoT): reasoning can unfold through temporally connected frames, known as Chain-of-Frame (CoF) reasoning. However, existing video generators are primarily trained on general video corpora, still lacking diverse supervision and dedicated designs for CoF reasoning. To address this gap, we introduce OpenCoF, a framework comprising the OpenCoF-17K dataset, a reasoning video dataset spanning 11 task families, and Wan-CoF, a fine-tuned video model for studying whether diverse temporal supervision improves CoF behavior. Across four video reasoning benchmarks, Wan-CoF achieves considerable gains over the Wan2.2-I2V-A14B baseline. Building on this, we empirically explore more advanced designs for CoF capabilities, i.e., equipping the model with visual and textual reasoning tokens. This mechanism respectively captures low-level visual cues and high-level semantic priors for spatial and temporal reasoning. Through performance comparisons and attention analysis, we examine how these tokens contribute across model depth, denoising steps, space, and time. Our results suggest that stronger video reasoning requires both broad temporal supervision and explicit mechanisms for organizing intermediate reasoning state. We open-source the dataset, model, and code to facilitate future research on reasoning-oriented video generation.', 'score': 11, 'issue_id': 2789, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '652aebe2f14f50f3', 'github_url': '', 'github_stars': 0, 'authors': ['Xinyan Chen', 'Ziyu Guo', 'Renrui Zhang', 'Dongzhi Jiang', 'Hongsheng Li'], 'affiliations': ['ByteDance Seed', 'CUHK IMIXR', 'CUHK MMLab'], 'pdf_title_img': 'assets/pdf/title_img/2607.08763.jpg', 'data': {'categories': ['#reasoning', '#open_source', '#benchmark', '#dataset'], 'emoji': '🎥', 'ru': {'title': 'OpenCoF: новое слово в видео рассуждении!', 'desc': 'В статье представлен фреймворк OpenCoF, который вводит набор данных и модель для видео, улучшающие временное рассуждение с помощью разнообразного обучения и явных токенов рассуждения. Новая модель Wan-CoF показывает значительное улучшение в видео рассуждении по сравнению с предыдущими моделями благодаря применению токенов для визуальных и текстовых сигналов. Исследования показывают, что для достижения более качественного видео рассуждения необходимо комбинировать широкий временной надзор и явные механизмы организации промежуточных состояний рассуждения. Данные, модель и код открыты для дальнейших исследований в области генерации видео с акцентом на рассуждение.'}, 'en': {'title': 'Enhancing Video Reasoning with OpenCoF Framework', 'desc': 'The OpenCoF framework enhances temporal reasoning in video generation by introducing a specialized dataset and model. It focuses on Chain-of-Frame (CoF) reasoning, which connects reasoning across temporally linked video frames. The framework includes the OpenCoF-17K dataset and the Wan-CoF model, which are designed to improve reasoning through diverse supervision and explicit reasoning tokens. Results show that these innovations lead to significant improvements in video reasoning tasks compared to previous models.'}}}, {'id': 'https://huggingface.co/papers/2607.07953', 'title': 'Linear Attention Architectures: Mechanisms, Trade-offs, and Cross-Layer Routing', 'url': 'https://huggingface.co/papers/2607.07953', 'abstract': "Abstract A comparative analysis of softmax attention and recurrent linear-attention architectures examines their expressivity, memory management, and training efficiency across different parameter scales and sequence lengths.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Self-attention lets each token retrieve information from the full context, but its quadratic cost in sequence length limits training and inference at long context. This paper presents a comparative study of softmax attention and four recent recurrent linear-attention architectures: DeltaNet, Gated DeltaNet, Kimi Delta Attention, and Gated DeltaNet-2. We express these mechanisms in a common recurrent-memory notation, making explicit how they differ in expressivity, memory decay, erase and write control, training throughput, and implementation complexity. Our experiments center on 350M-parameter models trained for 15B tokens, and include optimizer and learning-rate comparisons, hybrid-versus-pure stack comparisons, sequence-length runtime measurements, larger DeltaNet runs at 1.3B and 3B parameters, and a small set of downstream evaluations. The reported speed results measure training throughput and iteration time; we do not provide an empirical inference-speed benchmark. Within the reported 350M-parameter, 15B-token sweep, Kimi Delta Attention with Muon reaches the lowest final validation loss, a pure Gated DeltaNet stack trained with AdamW has the highest normalized training throughput, hybrid stacks generally improve loss at a throughput cost, and Muon consistently lowers final validation loss relative to AdamW in the matched architecture settings we evaluate. We introduce and evaluate lightweight cross-layer routing mechanisms for DeltaNet-style memories. The most natural DeltaNet-inspired formulation, forwarding a lower layer's delta-rule write error into the next layer's value target, does not improve over matched baselines. Routing into the aligned hidden stream and forwarding the write value instead yields a modest improvement in the matched runs we report: Cross-Layer Value Routing (CLVR) lowers final validation loss for both DeltaNet and Gated DeltaNet.", 'score': 10, 'issue_id': 2790, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '34144073fd26b274', 'github_url': '', 'github_stars': 0, 'authors': ['Tommaso Cerruti', 'Tim Rieder', 'George Rowlands', 'Lingfeng Jin', 'Imanol Schlag'], 'affiliations': ['ETH AI Center, ETH Zurich', 'ETH Zurich, D-INFK'], 'pdf_title_img': 'assets/pdf/title_img/2607.07953.jpg', 'data': {'categories': ['#memory', '#training', '#optimization', '#architecture', '#long_context'], 'emoji': '🧠', 'ru': {'title': 'Сравнение механизмов внимания в машинном обучении', 'desc': 'В данной статье проведен сравнительный анализ механизмов внимания softmax и рецидивирующих архитектур линейного внимания. Рассмотрены их способности, управление памятью и эффективность обучения при различных масштабах параметров и длинах последовательностей. Эксперименты показали, что внимание Kimi Delta с Muon обеспечивает наименьшее значение потерь при валидации, в то время как чистая архитектура Gated DeltaNet показывает наивысшую скорость обучения. Кроме того, внедрены легкие механизмы маршрутизации для памяти в стиле DeltaNet, что приводит к улучшению результата в некоторых случаях.'}, 'en': {'title': 'Optimizing Attention: A Deep Dive into Softmax and Recurrent Architectures', 'desc': 'This paper compares softmax attention with several recurrent linear-attention architectures, focusing on their expressivity, memory management, and training efficiency. It evaluates models with 350M parameters trained on 15B tokens, analyzing factors like optimizer performance and sequence-length runtime. The study finds that Kimi Delta Attention with Muon achieves the lowest validation loss, while Gated DeltaNet with AdamW has the highest training throughput. Additionally, it introduces Cross-Layer Value Routing (CLVR) to enhance DeltaNet-style memories, showing modest improvements in validation loss.'}}}, {'id': 'https://huggingface.co/papers/2607.08716', 'title': 'Remember When It Matters: Proactive Memory Agent for Long-Horizon Agents', 'url': 'https://huggingface.co/papers/2607.08716', 'abstract': 'Abstract  In long-horizon tasks, decision-relevant state is often scattered across an expanding trajectory, while the action agent must surface it and act. As trajectories grow, task requirements, environment facts, prior attempts, diagnoses, and open subgoals can be buried in the context window or pushed beyond it, failing to influence decisions when needed. We call this failure mode "behavioral state decay". We study memory as an active intervention mechanism rather than passive retrieval. A separate memory agent runs alongside an unmodified action agent, updating a structured memory bank from the recent trajectory and deciding whether to inject a memory-grounded reminder or remain silent. The module is plug-and-play with frontier action agents and existing agent harnesses. Across Terminal-Bench 2.0 and τ^2-Bench, it improves pass@1 for both weaker and stronger action agents, with gains of +8.3 pp on Terminal-Bench and +6.8 pp on τ^2-Bench. Ablations show that selective intervention outperforms passive bank exposure, always-on injection, advisor-only guidance, and general retrieval. As an early step toward open-weight memory policies, we train Qwen3.5-27B on SETA using SFT and GRPO, improving validation reward and achieving partial transfer to Terminal-Bench.', 'score': 9, 'issue_id': 2793, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '424d28db2adc1d5f', 'github_url': '', 'github_stars': 0, 'authors': ['Yifan Wu', 'Lizhu Zhang', 'Yuhang Zhou', 'Mingyi Wang', 'Bo Peng', 'Serena Li', 'Xiangjun Fan', 'Zhuokai Zhao'], 'affiliations': ['Meta'], 'pdf_title_img': 'assets/pdf/title_img/2607.08716.jpg', 'data': {'categories': ['#memory', '#training', '#agents', '#continual_learning', '#agent_memory'], 'emoji': '🧠', 'ru': {'title': 'Активная память для улучшения долгосрочных решений', 'desc': "В данной статье рассматривается проблема 'угасания поведенческого состояния' в долгосрочных задачах машинного обучения. Авторы предлагают использовать активное вмешательство памяти, чтобы эффективно извлекать важные данные из прошлых траекторий вместо пассивного восстановления. Они разработали отдельный агент памяти, который работает вместе с агентом действий и решает, когда напоминать о важной информации. Это решение улучшает результаты работы агентов в различных тестах, показывая значительные приросты в их производительности."}, 'en': {'title': 'Enhancing Decision-Making with Active Memory Intervention', 'desc': "This paper addresses the challenge of decision-making in long-horizon tasks where relevant information can become lost over time, a phenomenon termed 'behavioral state decay'. It proposes a memory agent that actively manages a structured memory bank, allowing it to provide timely reminders to the action agent when necessary. The memory agent operates alongside the action agent, enhancing its performance by selectively injecting memory-based information rather than relying on passive retrieval methods. Experimental results show significant improvements in task performance across various benchmarks, demonstrating the effectiveness of this memory intervention approach."}}}, {'id': 'https://huggingface.co/papers/2607.06987', 'title': 'UP: Unbounded Positive Asymmetric Optimization for Breaking the Exploration-Stability Dilemma', 'url': 'https://huggingface.co/papers/2607.06987', 'abstract': 'Abstract Reinforcement learning frameworks for large language models face exploration-stability trade-offs, which are addressed through a novel universal objective called Unbounded Positive Asymmetric Optimization that enables stable training with enhanced exploration capabilities.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Reinforcement learning (RL) has become the standard paradigm for enhancing the complex reasoning capabilities of large language models (LLMs). To achieve sample efficiency, modern RL frameworks rely on importance sampling (IS). However, these algorithms suffer from an exploration-stability dilemma. Pure IS often leads to catastrophic training instability, while standard clipping mechanisms used to mitigate this instability strictly constrain the policy update budget. By formalizing the concept of Probability Capacity (Cap), we reveal that conservative clipping structurally stifles exploration by prematurely truncating the update budget for correct but low-confidence reasoning paths. To break free from these constraints, we propose Unbounded Positive Asymmetric Optimization (UP), a universal and plug-and-play objective. UP theoretically restructures the optimization process by anchoring the policy to its current state via the stop-gradient operator. This asymmetric design unleashes unclipped, stable gradients for positive advantages to maximize exploration, while maintaining standard clipping safeguards for negative advantages to prevent training instability. Furthermore, our formulation readily extends across different optimization granularities, including token-level (GRPO, DAPO) and sequence-level (GSPO) frameworks. Extensive experiments demonstrate that UP enhances exploration capacity and achieves superior reasoning accuracy across diverse RL algorithms (DAPO, GSPO, and GRPO), model architectures (Dense, MoE, and vision-language), and training modalities (language and multimodal), validating UP as a truly universal plug-and-play enhancement for RL-based training.', 'score': 7, 'issue_id': 2790, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '14033709b03c2030', 'github_url': '', 'github_stars': 0, 'authors': ['Chongyu Fan', 'Pengfei Liu', 'Jingjia Huang', 'Sijia Liu', 'Yi Lin'], 'affiliations': ['ByteDance Seed', 'Michigan State University'], 'pdf_title_img': 'assets/pdf/title_img/2607.06987.jpg', 'data': {'categories': ['#rl', '#reasoning', '#training', '#optimization'], 'emoji': '🧠', 'ru': {'title': 'Новая эра обучения с подкреплением для языковых моделей', 'desc': 'В этой статье представлены методы обучения с подкреплением для больших языковых моделей, которые сталкиваются с дилеммой исследования и стабильности. Авторы предлагают новый универсальный подход, называемый Unbounded Positive Asymmetric Optimization (UP), который позволяет проводить стабильное обучение с улучшенными возможностями исследования. Это достигается за счет формализации концепции вероятностной емкости и применения асимметричного дизайна для оптимизации. Проведенные эксперименты показывают, что UP значительно увеличивает способности к исследованию и улучшает точность рассуждений в различных алгоритмах RL.'}, 'en': {'title': 'Unlocking Exploration in Reinforcement Learning', 'desc': 'This paper introduces a new approach called Unbounded Positive Asymmetric Optimization (UP) to improve reinforcement learning (RL) for large language models (LLMs). It addresses the exploration-stability trade-off that often leads to training instability in existing RL frameworks. By using a unique optimization strategy, UP allows for more effective exploration while still maintaining safeguards against instability. The results show that UP enhances reasoning accuracy across various RL algorithms and model architectures, making it a versatile tool for RL-based training.'}}}, {'id': 'https://huggingface.co/papers/2607.08741', 'title': 'ARDY: Autoregressive Diffusion with Hybrid Representation for Interactive Human Motion Generation', 'url': 'https://huggingface.co/papers/2607.08741', 'abstract': "Abstract ARDY is a streaming generation framework that enables real-time, high-fidelity 3D human motion generation with text and kinematic constraint control through a hybrid representation and two-stage autoregressive transformer denoiser.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Generating realistic 3D human motions in real-time within interactive applications is key for animation, simulation, and humanoid robotics. While recent offline motion generation approaches offer precise control via text and kinematic constraints, they lack the inference speed required for interactive settings. Conversely, existing online methods enable real-time synthesis but often sacrifice controllability or struggle with complex text semantics and long-horizon goals due to limited context windows. In this work, we introduce ARDY, a streaming generation framework that bridges this gap by enabling high-fidelity motion generation controllable via online text prompts and flexible kinematic constraints. ARDY employs a hybrid representation that combines explicit root features with a latent body embedding, balancing precise trajectory control with efficient generative learning. We propose a two-stage autoregressive transformer denoiser that features variable history context and supports conditioning on flexible, long-horizon kinematic constraints. By training on a large-scale motion capture dataset and being directly conditioned on text labels and kinematic constraints sampled from ground truth poses, ARDY natively learns controllable generation that supports online prompting and flexible long-horizon goals. Extensive evaluations on the HumanML3D benchmark and the large-scale, high-fidelity Bones Rigplay dataset demonstrate ARDY's high motion quality and constraint adherence, validating the efficacy of our key architectural decisions. Finally, we demonstrate the method's practical versatility through an interactive demo featuring dynamic text control, diverse keyframe pose constraints, path following, and interactive locomotion control via mouse and keyboard. Supplementary video results, code, and model releases can be found at https://research.nvidia.com/labs/sil/projects/ardy/.", 'score': 6, 'issue_id': 2789, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '076944d359da18ba', 'github_url': '', 'github_stars': 0, 'authors': ['Kaifeng Zhao', 'Mathis Petrovich', 'Haotian Zhang', 'Tingwu Wang', 'Siyu Tang', 'Davis Rempe'], 'affiliations': ['ETH Zürich, Switzerland', 'NVIDIA, Switzerland', 'NVIDIA, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.08741.jpg', 'data': {'categories': ['#benchmark', '#open_source', '#long_context', '#3d', '#optimization', '#games', '#architecture'], 'emoji': '🤖', 'ru': {'title': 'Реализация высококачественной 3D генерации движений в реальном времени', 'desc': 'ARDY — это фреймворк для потоковой генерации, который позволяет в реальном времени создавать высококачественные 3D движения человека с управлением через текстовые подсказки и кинематические ограничения. Он использует гибридное представление, сочетая явные корневые характеристики с латентным телесным встраиванием, что обеспечивает точный контроль траектории. Двухступенчатый авторегрессионный трансформер-дениозер поддерживает переменный контекст истории и позволяет работать с гибкими долгосрочными кинематическими ограничениями. ARDY продемонстрировал высокое качество движений и соблюдение ограничений в обширных оценках на стандартных наборах данных.'}, 'en': {'title': 'Real-Time 3D Motion Generation with ARDY', 'desc': 'ARDY is a framework designed for real-time generation of high-quality 3D human motions using text prompts and kinematic constraints. It combines a hybrid representation of motion data with a two-stage autoregressive transformer denoiser to achieve efficient and controllable motion synthesis. Unlike previous methods, ARDY maintains both speed and precision, allowing for complex interactions in animation and robotics. The framework has been validated through extensive testing, demonstrating its ability to generate realistic motions that adhere to specified constraints.'}}}, {'id': 'https://huggingface.co/papers/2607.07816', 'title': 'A Sparse and Truncated State Vector Simulator for Peaked Circuits', 'url': 'https://huggingface.co/papers/2607.07816', 'abstract': 'Abstract Peaked quantum circuits can be efficiently simulated classically using sparse state vector representations with vectorized operations and hardware acceleration.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct In a class of quantum circuits known as peaked circuits, the goal is to predict the most probable bit string at the output of the circuit. Since these circuits are designed to have a sharp peak in their output distribution, in principle it should be possible to simulate them using a truncated state vector with a limited number of terms, or a fraction of the total probability mass. This approximate simulation can be carried out on a classical computer with a sparse representation that stores only the nonzero amplitudes of the state vector, in contrast to the dense representations that are common in most quantum simulators. For efficiency, all operations on the state vector should be vectorized to the furthest possible extent and, if available, hardware acceleration can also be used. This work describes how these requirements were met in an open-source implementation, and discusses its performance and limitations.', 'score': 5, 'issue_id': 2790, 'pub_date': '2026-07-08', 'pub_date_card': {'ru': '8 июля', 'en': 'July 8', 'zh': '7月8日'}, 'hash': '9590d0b32c1d5a08', 'github_url': '', 'github_stars': 0, 'authors': ['Diogo R. Ferreira'], 'affiliations': ['Instituto Superior Tecnico (IST) Universidade de Lisboa Lisbon, Portugal'], 'pdf_title_img': 'assets/pdf/title_img/2607.07816.jpg', 'data': {'categories': ['#open_source', '#dataset', '#data', '#optimization'], 'emoji': '⚛️', 'ru': {'title': 'Эффективные симуляции пиковых квантовых цепей', 'desc': 'В статье рассматриваются методы эффективной симуляции квантовых цепей с пиковыми распределениями. Эти цепи позволяют предсказывать наиболее вероятные битовые строки на выходе. Авторы предлагают использовать разреженные представления векторов состояний, что позволяет снизить вычислительные затраты. Также обсуждаются особенности векторизированных операций и использование аппаратного ускорения для повышения производительности.'}, 'en': {'title': 'Efficient Classical Simulation of Peaked Quantum Circuits', 'desc': 'This paper discusses how peaked quantum circuits can be simulated efficiently on classical computers. Peaked circuits are designed to produce a sharp peak in their output distribution, allowing for the use of a truncated state vector that captures only the most significant probabilities. The authors present an open-source implementation that utilizes sparse state vector representations and vectorized operations to enhance performance. Additionally, they explore the use of hardware acceleration to further improve the simulation efficiency while addressing the limitations of their approach.'}}}, {'id': 'https://huggingface.co/papers/2607.08688', 'title': 'SAM-MT: Real-Time Interactive Multi-Target Video Segmentation', 'url': 'https://huggingface.co/papers/2607.08688', 'abstract': "Abstract  Modern Video Object Segmentation (VOS) involves tracking and segmenting user-specified targets. While recent approaches have achieved remarkable performance in single-target scenarios, extending them to multi-target settings typically involves replicating the single-target processing for each individual object, resulting in reduced frame rates (FPS) with unbounded latency as target count increases. Built upon Segment Anything 2 (SAM2), we propose SAM-MT, which addresses this by transforming the model into an interactive framework for real-time Multi-Target video segmentation. SAM-MT uses explicit queries to represent different individual targets, in parallel with a shared representation for global context. It employs decoupled masked attention to keep individual identities distinct from cross-target interference, and sparse memory for stable temporal evolution, along with specialized strategies for occlusion handling and overlap prevention. SAM-MT successfully decouples latency from the number of targets, achieving real-time speed on par with single-target baselines (>36 FPS for 10 targets) while maintaining SAM2's robust video segmentation performance.", 'score': 4, 'issue_id': 2792, 'pub_date': '2026-07-09', 'pub_date_card': {'ru': '9 июля', 'en': 'July 9', 'zh': '7月9日'}, 'hash': '6d8dbc767ae4a462', 'github_url': '', 'github_stars': 0, 'authors': ['Ruiqi Shen', 'Chang Liu', 'Henghui Ding'], 'affiliations': ['Fudan University', 'Shanghai University of Finance and Economics'], 'pdf_title_img': 'assets/pdf/title_img/2607.08688.jpg', 'data': {'categories': ['#memory', '#training', '#agents', '#3d', '#optimization'], 'emoji': '🎥', 'ru': {'title': 'Быстрая сегментация нескольких объектов в видео', 'desc': 'Современная сегментация объектов в видео (VOS) фокусируется на отслеживании и сегментации заданных пользователем объектов. В большинстве случаев метод работает эффективно для одного объекта, но при увеличении числа целей производительность падает. Статья представляет SAM-MT — интерактивную модель для сегментации нескольких объектов в реальном времени. Эта модель использует декомпозированное внимание и специализированные стратегии для управления затенением и предотвращения перекрытий, гарантируя стабильную производительность даже при увеличении числа объектов.'}, 'en': {'title': 'Real-Time Multi-Target Segmentation with SAM-MT', 'desc': 'This paper presents SAM-MT, a novel approach for real-time Multi-Target Video Object Segmentation (VOS) that builds on the Segment Anything 2 (SAM2) framework. Unlike traditional methods that process each target individually, SAM-MT uses explicit queries to manage multiple targets simultaneously, enhancing efficiency. It incorporates decoupled masked attention to prevent interference between targets and employs sparse memory for consistent tracking over time. As a result, SAM-MT achieves high frame rates, maintaining performance even with multiple targets, thus decoupling latency from target count.'}}}, {'id': 'https://huggingface.co/papers/2607.06238', 'title': 'PhyMRI-SR: Toward Physics-Aware MRI Image Super-Resolution', 'url': 'https://huggingface.co/papers/2607.06238', 'abstract': 'Abstract MR super-resolution is reformulated as a physics-aware reconstruction problem that dynamically adapts resolution-SNR configurations using Gaussian splatting with prior-aware representations and physics-constrained modeling.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Magnetic resonance imaging (MRI) super-resolution is vital for improving diagnostic accessibility, yet most methods treat it as a deterministic mapping from a fixed low-resolution input to a high-resolution target. This overlooks a key property of MRI acquisition physics: spatial resolution and signal-to-noise ratio (SNR) are inherently coupled, making any given low-resolution scan merely one of many possible realizations under varying acquisition trade-offs. We rethink MRI super-resolution as a physics-aware reconstruction problem, in which the goal is to identify the optimal resolution-SNR configuration and then super-resolve it to obtain high-quality MRI results. A key implication of this formulation is that MRI resolution becomes dynamic rather than fixed. To handle such resolution-heterogeneous inputs, we adapt 2D Gaussian Splatting (2D GS) to MRI by formulating reconstruction as a coordinate-based, resolution-agnostic rendering problem. To further enhance fidelity, we introduce three innovations: (1) a prior-aware Gaussian representation that combines an Anatomical Structure Prior for tissue-specific kernel initialization with an Imaging System Prior that captures hardware characteristics via a covariance dictionary; (2) a physics-constrained signal modeling scheme that predicts intrinsic tissue parameters (proton density rho and effective relaxation rate R2) and synthesizes intensities through governing physical equations, ensuring biophysically plausible contrast; and (3) a meta-learning framework that alleviates paired-data scarcity by pretraining on simulated data and adapting to real-world conditions. Extensive experiments on dynamic-resolution datasets and standard benchmarks demonstrate that our method achieves state-of-the-art performance, highlighting its strong potential for clinical deployment.', 'score': 4, 'issue_id': 2790, 'pub_date': '2026-07-07', 'pub_date_card': {'ru': '7 июля', 'en': 'July 7', 'zh': '7月7日'}, 'hash': 'da61fe0da9e13d7d', 'github_url': '', 'github_stars': 0, 'authors': ['Lihua Wei', 'Huatong Gao', 'Jia Gong', 'Zhiyu Tan', 'Hao Li', 'Jun Liu', 'Zhihua Ren'], 'affiliations': ['Fudan University, Shanghai, China', 'School of Biomedical Engineering & State Key Laboratory of Advanced Medical Materials and Devices, ShanghaiTech University, Shanghai 201210, China', 'School of Biomedical Engineering, ShanghaiTech University, Shanghai 201210, China', 'School of Computing and Communications, Lancaster University, Lancaster, U.K.', 'Shanghai Academy of AI for Science, Shanghai, China', 'Shanghai Clinical Research and Trial Center, Shanghai 200231, China'], 'pdf_title_img': 'assets/pdf/title_img/2607.06238.jpg', 'data': {'categories': ['#benchmark', '#optimization', '#dataset', '#science', '#healthcare'], 'emoji': '🔍', 'ru': {'title': 'Динамическое супер-разрешение в MRI', 'desc': 'В этой статье MRI супер-разрешение рассматривается как задача реконструкции, учитывающая физические аспекты. Авторы предлагают динамически адаптировать конфигурации разрешения и соотношения сигнал/шум (SNR) с помощью метода Gaussian splatting. Используя предвосхищающую репрезентацию и физически ограниченное моделирование, они создают более качественные результаты магнитно-резонансной томографии. Предлагаемый подход показывает выдающиеся результаты, что открывает новые возможности для клинического применения.'}, 'en': {'title': 'Dynamic MRI Super-Resolution through Physics-Aware Reconstruction', 'desc': 'This paper presents a new approach to MRI super-resolution by treating it as a physics-aware reconstruction problem. It recognizes that the relationship between spatial resolution and signal-to-noise ratio (SNR) is dynamic, rather than fixed, allowing for more accurate high-resolution images. The method employs 2D Gaussian Splatting to handle varying resolutions and introduces innovations like prior-aware representations and physics-constrained modeling to enhance image fidelity. Extensive experiments show that this approach achieves state-of-the-art performance, making it promising for clinical applications.'}}}, {'id': 'https://huggingface.co/papers/2607.04461', 'title': 'Flash-BoN: Instant Drafts for Inference-Time Scaling in Diffusion Models', 'url': 'https://huggingface.co/papers/2607.04461', 'abstract': 'Abstract Flash-BoN improves text-to-image generation efficiency by using inexpensive draft candidates generated through timestep truncation, layer skipping, and activation proxies, followed by multi-stage verification that outperforms existing methods under fixed wall-clock budgets.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Inference-time scaling for text-to-image generation has progressed from simple Best-of-N (BoN) sampling to guided search methods that verify and steer candidate trajectories at intermediate denoising steps. These approaches focus on when and how often to verify during denoising but largely treat the cost of generation itself as fixed. Moreover, the standard practice of comparing methods by number of function evaluations (NFEs) counts only denoising forward passes and ignores verifier overhead, which can distort efficiency rankings. We show that under wall-clock evaluation, simple BoN already matches or outperforms several guided search techniques, suggesting that compute is better spent on broader exploration than on repeated intermediate verification. This motivates Flash-BoN, which generates a large pool of inexpensive draft candidates by combining three complementary acceleration knobs: timestep truncation, layer skipping, and activation proxies into a single configuration optimized once per model. An efficient multi-stage verification procedure then identifies the most promising draft, which is refined at full quality. Across three benchmarks and three model scales, Flash-BoN consistently outperforms all baselines under fixed wall-clock budgets, with gains that grow at larger model scales (+8% AUC). We further show that our strategy combines well and improves existing orthogonal techniques such as reflection-based prompt optimization (+16% AUC). The gains correlate with increased candidate diversity, which also enables draft-guided selection to accelerate RL post-training convergence.', 'score': 4, 'issue_id': 2789, 'pub_date': '2026-07-05', 'pub_date_card': {'ru': '5 июля', 'en': 'July 5', 'zh': '7月5日'}, 'hash': 'cbf11a0bd1561b65', 'github_url': '', 'github_stars': 0, 'authors': ['Ruchit Rawal', 'Reza Shirkavand', 'Sayak Paul', 'Yuxin Wen', 'Heng Huang', 'Yizheng Chen', 'Tom Goldstein', 'Gowthami Somepalli'], 'affiliations': ['Hugging Face, USA', 'University of Maryland, College Park, MD, USA'], 'pdf_title_img': 'assets/pdf/title_img/2607.04461.jpg', 'data': {'categories': ['#rl', '#inference', '#training', '#data', '#optimization', '#games'], 'emoji': '✨', 'ru': {'title': 'Flash-BoN: Эффективная генерация изображений из текста', 'desc': 'Статья описывает метод Flash-BoN, который улучшает эффективность генерации изображений из текста. Он использует недорогие предварительные кандидаты, создаваемые с помощью укорочения временных шагов, пропуска слоев и прокси-активаций. Благодаря многоступенчатой верификации, Flash-BoN превосходит существующие методы, позволяя более эффективно распределять вычислительные ресурсы. Метод показывает значительные улучшения в производительности, особенно на больших моделях, благодаря увеличению разнообразия кандидатов.'}, 'en': {'title': 'Efficient Text-to-Image Generation with Flash-BoN', 'desc': 'Flash-BoN enhances the efficiency of text-to-image generation by creating low-cost draft candidates through techniques like timestep truncation, layer skipping, and activation proxies. It employs a multi-stage verification process that surpasses existing methods while adhering to fixed time constraints. The paper argues that focusing on broader exploration rather than frequent intermediate verification can yield better results. Flash-BoN consistently outperforms traditional methods across various benchmarks and model sizes, demonstrating significant improvements in candidate diversity and overall performance.'}}}, {'id': 'https://huggingface.co/papers/2607.08526', 'title': 'A Quantized Native Runtime for On-Device Semantic Audio Generation', 'url': 'https://huggingface.co/papers/2607.08526', 'abstract': 'Abstract A dependency-free runtime enables efficient text-to-music generation on embedded devices through quantization and activation steering while maintaining audio quality.  Generated by Qwen/Qwen2.5-Coder-32B-Instruct Semantic audio applications increasingly require controllable generation on commodity and embedded hardware rather than through framework-heavy datacenter stacks. We present aria, a dependency-free native runtime that runs the complete text-to-music pipeline of Stable Audio~3 (SA3) on ordinary GPUs, CPU-only machines, and a Raspberry~Pi~5, with no Python or deep-learning framework underneath. Our main contribution is a study of quantization: running the model at lo
